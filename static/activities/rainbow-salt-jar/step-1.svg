<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <line x1="5" y1="108" x2="115" y2="108" stroke="#e5e7eb" stroke-width="2"/>
  <!-- Glass jar (clean, empty, upright) — hero -->
  <g transform="translate(35, 15)">
    <!-- Jar body -->
    <rect x="0" y="20" width="50" height="65" rx="4" fill="#f9fafb" fill-opacity="0.5" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Jar neck -->
    <rect x="8" y="6" width="34" height="16" rx="2" fill="#f9fafb" fill-opacity="0.3" stroke="#374151" stroke-width="2"/>
    <!-- Rim -->
    <rect x="6" y="4" width="38" height="5" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <!-- Glass shine lines -->
    <line x1="8" y1="30" x2="8" y2="70" stroke="#dbeafe" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="14" y1="35" x2="14" y2="60" stroke="#dbeafe" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <!-- Sparkle dots for cleanliness -->
    <circle cx="40" cy="30" r="2" fill="none" stroke="#93c5fd" stroke-width="1"/>
    <line x1="40" y1="26" x2="40" y2="28" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
    <line x1="40" y1="32" x2="40" y2="34" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
    <line x1="36" y1="30" x2="38" y2="30" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
    <line x1="42" y1="30" x2="44" y2="30" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- Book supporting jar for tilt (shown to the right) -->
  <g transform="translate(88, 65)">
    <rect x="0" y="0" width="22" height="35" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
    <!-- Book spine lines -->
    <line x1="3" y1="5" x2="3" y2="30" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <!-- Page lines -->
    <line x1="7" y1="8" x2="18" y2="8" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
    <line x1="7" y1="13" x2="18" y2="13" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
    <line x1="7" y1="18" x2="18" y2="18" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- Small tilted jar sketch next to the book -->
  <g transform="translate(92, 42) rotate(15)">
    <rect x="0" y="0" width="16" height="22" rx="2" fill="#f9fafb" fill-opacity="0.4" stroke="#374151" stroke-width="1.5"/>
    <rect x="2" y="-4" width="12" height="5" rx="1" fill="#f3f4f6" stroke="#374151" stroke-width="1"/>
  </g>
  <!-- Cloth/towel wiping (shows cleaning) -->
  <g transform="translate(8, 45)">
    <path d="M0,0 Q5,-5 15,0 Q20,5 25,2" fill="#dbeafe" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0,0 Q5,5 15,5 Q20,3 25,2" fill="#dbeafe" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
