<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <!-- Table surface -->
  <line x1="5" y1="108" x2="115" y2="108" stroke="#e5e7eb" stroke-width="2"/>
  <!-- Zip-lock bag with salt and colour -->
  <g transform="translate(15, 15)">
    <!-- Bag body -->
    <rect x="0" y="8" width="40" height="35" rx="2" fill="#dbeafe" fill-opacity="0.3" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <!-- Zip seal line -->
    <line x1="0" y1="12" x2="40" y2="12" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <!-- Coloured salt inside -->
    <path d="M3,30 Q10,25 20,28 Q30,25 37,30 L37,41 L3,41 Z" fill="#ef4444" stroke="none"/>
    <!-- Hand kneading arrows -->
    <path d="M-5,25 Q-2,20 5,22" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round"/>
    <path d="M45,25 Q42,20 35,22" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round"/>
  </g>
  <!-- Arrow from bag to plate -->
  <path d="M48,52 Q58,65 60,72" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round"/>
  <!-- Paper plate with coloured salt spread to dry -->
  <ellipse cx="60" cy="92" rx="35" ry="12" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Salt spread on plate - red -->
  <ellipse cx="55" cy="90" rx="18" ry="5" fill="#fca5a5" stroke="none"/>
  <!-- Food colouring bottle (top right) -->
  <g transform="translate(85, 20)">
    <rect x="0" y="12" width="16" height="28" rx="3" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <rect x="4" y="0" width="8" height="14" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <!-- Drops coming out -->
    <circle cx="8" cy="44" r="2" fill="#ef4444" stroke="#374151" stroke-width="1"/>
    <circle cx="8" cy="50" r="1.5" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
  </g>
  <!-- Second bag (green, smaller, background) -->
  <g transform="translate(72, 50)">
    <rect x="0" y="0" width="28" height="24" rx="2" fill="#d1fae5" fill-opacity="0.4" stroke="#374151" stroke-width="1.5"/>
    <line x1="0" y1="4" x2="28" y2="4" stroke="#22c55e" stroke-width="1.5"/>
    <path d="M2,14 Q8,11 14,14 Q20,11 26,14 L26,22 L2,22 Z" fill="#86efac" stroke="none"/>
  </g>
</svg>
