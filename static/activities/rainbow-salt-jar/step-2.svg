<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <!-- Table surface -->
  <line x1="5" y1="108" x2="115" y2="108" stroke="#e5e7eb" stroke-width="2"/>
  <!-- Glass jar with rainbow layers — hero -->
  <g transform="translate(30, 8)">
    <!-- Jar body -->
    <rect x="0" y="20" width="50" height="72" rx="4" fill="#f9fafb" fill-opacity="0.3" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Jar neck -->
    <rect x="8" y="6" width="34" height="16" rx="2" fill="#f9fafb" fill-opacity="0.2" stroke="#374151" stroke-width="2"/>
    <!-- Rim -->
    <rect x="6" y="4" width="38" height="5" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <!-- Layer 1 (bottom) - red -->
    <rect x="2" y="78" width="46" height="12" rx="2" fill="#fca5a5"/>
    <!-- Layer 2 - orange -->
    <rect x="2" y="66" width="46" height="12" fill="#fdba74"/>
    <!-- Layer 3 - yellow -->
    <rect x="2" y="54" width="46" height="12" fill="#fde68a"/>
    <!-- Layer 4 - green -->
    <rect x="2" y="42" width="46" height="12" fill="#86efac"/>
    <!-- Layer 5 - blue (being poured) -->
    <rect x="2" y="34" width="46" height="8" fill="#93c5fd"/>
    <!-- Glass shine -->
    <line x1="6" y1="30" x2="6" y2="85" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- Spoon pouring salt into jar -->
  <g transform="translate(75, 5)">
    <!-- Spoon handle -->
    <line x1="20" y1="0" x2="8" y2="25" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Spoon bowl -->
    <ellipse cx="5" cy="28" rx="8" ry="5" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <!-- Salt grains falling -->
    <circle cx="5" cy="36" r="1" fill="#93c5fd"/>
    <circle cx="8" cy="40" r="1" fill="#93c5fd"/>
    <circle cx="3" cy="42" r="1" fill="#93c5fd"/>
    <circle cx="6" cy="46" r="0.8" fill="#93c5fd"/>
  </g>
  <!-- Arrow showing pour direction -->
  <path d="M78,50 Q72,55 70,38" fill="none" stroke="#374151" stroke-width="1" marker-end="url(#arr)" stroke-linecap="round"/>
  <!-- Small coloured salt piles on plates (source) -->
  <ellipse cx="100" cy="85" rx="14" ry="5" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <ellipse cx="100" cy="83" rx="8" ry="3" fill="#a78bfa"/>
  <ellipse cx="100" cy="100" rx="14" ry="5" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <ellipse cx="100" cy="98" rx="8" ry="3" fill="#fca5a5"/>
</svg>
