<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table/shelf surface -->
  <line x1="5" y1="108" x2="115" y2="108" stroke="#e5e7eb" stroke-width="2"/>
  <!-- Completed rainbow salt jar — hero, centred -->
  <g transform="translate(35, 8)">
    <!-- Jar body -->
    <rect x="0" y="20" width="50" height="72" rx="4" fill="#f9fafb" fill-opacity="0.3" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Jar neck -->
    <rect x="8" y="6" width="34" height="16" rx="2" fill="#f9fafb" fill-opacity="0.2" stroke="#374151" stroke-width="2"/>
    <!-- Lid (screwed on) -->
    <rect x="5" y="2" width="40" height="8" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <!-- Thread lines on lid -->
    <line x1="8" y1="5" x2="12" y2="5" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="15" y1="7" x2="19" y2="7" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="28" y1="5" x2="32" y2="5" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="36" y1="7" x2="40" y2="7" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Layer 1 (bottom) - red -->
    <rect x="2" y="78" width="46" height="12" rx="2" fill="#fca5a5"/>
    <!-- Layer 2 - orange -->
    <rect x="2" y="66" width="46" height="12" fill="#fdba74"/>
    <!-- Layer 3 - yellow -->
    <rect x="2" y="54" width="46" height="12" fill="#fde68a"/>
    <!-- Layer 4 - green -->
    <rect x="2" y="42" width="46" height="12" fill="#86efac"/>
    <!-- Layer 5 - blue -->
    <rect x="2" y="30" width="46" height="12" fill="#93c5fd"/>
    <!-- Layer 6 - purple (top) -->
    <rect x="2" y="22" width="46" height="8" rx="2" fill="#c4b5fd"/>
    <!-- Glass shine -->
    <line x1="6" y1="28" x2="6" y2="85" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- Sparkle stars around jar (display feel) -->
  <g stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" fill="none">
    <line x1="22" y1="20" x2="22" y2="14"/>
    <line x1="19" y1="17" x2="25" y2="17"/>
    <line x1="95" y1="30" x2="95" y2="24"/>
    <line x1="92" y1="27" x2="98" y2="27"/>
    <line x1="25" y1="90" x2="25" y2="86"/>
    <line x1="23" y1="88" x2="27" y2="88"/>
    <line x1="100" y1="75" x2="100" y2="71"/>
    <line x1="98" y1="73" x2="102" y2="73"/>
  </g>
  <!-- Tape strip around lid edge -->
  <rect x="38" y="10" width="42" height="5" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1" opacity="0.6"/>
</svg>
