<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 2: Install the Engine -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="120" height="120" fill="#dbeafe" opacity="0.5" />

  <!-- Back end of the hull -->
  <path d="M20,15 L100,15 L100,95 L80,95 L80,50 L40,50 L40,95 L20,95 Z" fill="#d97706" stroke="#92400e" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Tape detail -->
  <rect x="15" y="60" width="30" height="12" fill="#ffffff" opacity="0.6" stroke="#d1d5db" stroke-width="1" />
  <rect x="75" y="60" width="30" height="12" fill="#ffffff" opacity="0.6" stroke="#d1d5db" stroke-width="1" />

  <!-- Rubber Band stretched across -->
  <line x1="30" y1="85" x2="90" y2="85" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
  <line x1="30" y1="90" x2="90" y2="90" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />

  <!-- Paddle Wheel inserted into rubber band -->
  <g transform="translate(60, 87)">
    <rect x="-10" y="-20" width="20" height="40" fill="#f59e0b" stroke="#374151" stroke-width="1.5" />
    <rect x="-20" y="-10" width="40" height="20" fill="#fbbf24" stroke="#374151" stroke-width="1.5" />
    <!-- Tape on paddle -->
    <rect x="-5" y="-15" width="10" height="30" fill="#ffffff" opacity="0.5" stroke="none" />
  </g>

  <!-- Tension indicators -->
  <path d="M40,75 L45,85" fill="none" stroke="#374151" stroke-width="1.5" />
  <path d="M80,75 L75,85" fill="none" stroke="#374151" stroke-width="1.5" />
</svg>