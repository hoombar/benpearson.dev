<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 1: Build the Paddle Wheel -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>
  
  <rect x="0" y="0" width="120" height="120" fill="#dbeafe" opacity="0.5" />

  <!-- Cardboard piece 1 (horizontal) -->
  <g transform="translate(60, 60)">
    <rect x="-30" y="-15" width="60" height="30" fill="#d97706" stroke="#92400e" stroke-width="2" rx="2" />
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,2" />
    <!-- Slit cut -->
    <line x1="0" y1="-15" x2="0" y2="0" stroke="#fef3c7" stroke-width="3" />
  </g>

  <!-- Cardboard piece 2 (vertical, sliding in) -->
  <g transform="translate(60, 20)">
    <!-- Motion lines -->
    <line x1="0" y1="-10" x2="0" y2="20" stroke="#374151" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr)" />
    
    <rect x="-15" y="-15" width="30" height="60" fill="#f59e0b" stroke="#92400e" stroke-width="2" rx="2" />
    <line x1="0" y1="-15" x2="0" y2="45" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,2" />
    <!-- Slit cut -->
    <line x1="0" y1="15" x2="0" y2="45" stroke="#fef3c7" stroke-width="3" />
  </g>
  
  <!-- Tape wrap indication -->
  <rect x="80" y="80" width="25" height="15" fill="#ffffff" opacity="0.8" stroke="#d1d5db" stroke-width="1.5" rx="1" transform="rotate(-15 90 85)" />
  <path d="M75,90 Q65,85 70,75" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" />
</svg>