<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 3: Wind Up and Launch -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Water background with waves -->
  <rect x="0" y="0" width="120" height="120" fill="#93c5fd" />
  <path d="M10,20 Q20,15 30,20 T50,20" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" />
  <path d="M70,40 Q80,35 90,40 T110,40" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" />
  <path d="M20,100 Q30,95 40,100 T60,100" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" />

  <!-- Wake behind the boat -->
  <path d="M60,105 L20,120 M60,105 L100,120 M40,115 L80,115" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7" stroke-linecap="round" />

  <!-- Boat (Angled perspective on water) -->
  <g transform="translate(60, 60) scale(0.8) rotate(15)">
    <!-- Hull -->
    <path d="M0,-60 L30,-10 L30,40 L15,40 L15,10 L-15,10 L-15,40 L-30,40 L-30,-10 Z" fill="#d97706" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M0,-50 L20,-10 L-20,-10 Z" fill="#b45309" stroke="none" />
    
    <!-- Twisted Rubber Band -->
    <path d="M-15,35 L15,35 M-15,32 L15,38 M-15,38 L15,32" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Spinning Paddle Wheel -->
    <g transform="translate(0, 35)">
      <ellipse cx="0" cy="0" rx="20" ry="10" fill="#f59e0b" stroke="#374151" stroke-width="2" />
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#374151" stroke-width="2" />
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#374151" stroke-width="2" />
    </g>
  </g>

  <!-- Winding / Action Arrows -->
  <path d="M85,75 A15,15 0 1,1 75,95" fill="none" stroke="#111827" stroke-width="2.5" marker-end="url(#arr)" stroke-linecap="round" />
  
  <!-- Speed lines -->
  <line x1="60" y1="20" x2="60" y2="0" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="25" x2="45" y2="10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="70" y1="25" x2="75" y2="10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
</svg>