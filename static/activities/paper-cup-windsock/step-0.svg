<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper cup (hero) -->
  <g transform="translate(20, 16)">
    <!-- Cup body (trapezoid shape) -->
    <path d="M12,0 L0,72 L56,72 L44,0 Z" fill="white" stroke="#374151" stroke-width="1.5"/>
    <!-- Cup rim -->
    <ellipse cx="28" cy="0" rx="16" ry="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/>

    <!-- Decorations being drawn -->
    <!-- Zigzag stripe -->
    <polyline points="14,18 20,12 26,18 32,12 38,18 44,12" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Dots pattern -->
    <circle cx="18" cy="32" r="2.5" fill="#3b82f6"/>
    <circle cx="28" cy="30" r="2.5" fill="#22c55e"/>
    <circle cx="38" cy="32" r="2.5" fill="#eab308"/>
    <!-- Stripe -->
    <line x1="12" y1="44" x2="44" y2="44" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
    <!-- More dots -->
    <circle cx="16" cy="56" r="2" fill="#f97316"/>
    <circle cx="26" cy="54" r="2" fill="#ec4899"/>
    <circle cx="36" cy="56" r="2" fill="#3b82f6"/>
  </g>

  <!-- Marker drawing on cup -->
  <g transform="translate(62, 24) rotate(20)">
    <!-- Marker body -->
    <rect x="0" y="-4" width="36" height="8" rx="2" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <!-- Marker cap -->
    <rect x="-6" y="-4" width="7" height="8" rx="2" fill="#b91c1c" stroke="#374151" stroke-width="0.6"/>
    <!-- Marker tip -->
    <polygon points="-6,-2 -6,2 -10,0" fill="#374151"/>
  </g>

  <!-- Extra markers on table -->
  <g transform="translate(82, 76)">
    <rect x="0" y="0" width="6" height="22" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="0" width="6" height="4" rx="1" fill="#1d4ed8" stroke="#374151" stroke-width="0.4"/>
  </g>
  <g transform="translate(92, 78)">
    <rect x="0" y="0" width="6" height="20" rx="2" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="0" width="6" height="4" rx="1" fill="#16a34a" stroke="#374151" stroke-width="0.4"/>
  </g>
  <g transform="translate(102, 77)">
    <rect x="0" y="0" width="6" height="21" rx="2" fill="#eab308" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="0" width="6" height="4" rx="1" fill="#ca8a04" stroke="#374151" stroke-width="0.4"/>
  </g>
</svg>
