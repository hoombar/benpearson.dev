<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Tissue paper sheet being cut (hero) -->
  <g transform="translate(10, 14)">
    <!-- Tissue paper sheet -->
    <rect x="0" y="0" width="70" height="50" rx="1" fill="#fb923c" stroke="#374151" stroke-width="1" opacity="0.8"/>
    <!-- Cut lines showing strips -->
    <line x1="0" y1="10" x2="70" y2="10" stroke="#374151" stroke-width="0.5" stroke-dasharray="3,2"/>
    <line x1="0" y1="20" x2="70" y2="20" stroke="#374151" stroke-width="0.5" stroke-dasharray="3,2"/>
    <line x1="0" y1="30" x2="70" y2="30" stroke="#374151" stroke-width="0.5" stroke-dasharray="3,2"/>
    <line x1="0" y1="40" x2="70" y2="40" stroke="#374151" stroke-width="0.5" stroke-dasharray="3,2"/>
  </g>

  <!-- Already-cut strips in different colours -->
  <rect x="10" y="70" width="60" height="6" rx="1" fill="#ef4444" stroke="#374151" stroke-width="0.5" opacity="0.8"/>
  <rect x="12" y="78" width="58" height="6" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="0.5" opacity="0.8"/>
  <rect x="10" y="86" width="62" height="6" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.5" opacity="0.8"/>
  <rect x="14" y="94" width="56" height="5" rx="1" fill="#a855f7" stroke="#374151" stroke-width="0.5" opacity="0.8"/>

  <!-- Scissors cutting along line -->
  <g transform="translate(78, 28) rotate(10)">
    <path d="M0,0 L16,5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,0 L16,-5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#374151"/>
    <ellipse cx="20" cy="6" rx="5" ry="4" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <ellipse cx="20" cy="-6" rx="5" ry="4" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Cutting direction arrow -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="84" y1="18" x2="84" y2="8" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Warning symbol -->
  <g transform="translate(96, 4)">
    <polygon points="10,0 0,18 20,18" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <line x1="10" y1="5" x2="10" y2="12" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="10" cy="15" r="1" fill="#374151"/>
  </g>
</svg>
