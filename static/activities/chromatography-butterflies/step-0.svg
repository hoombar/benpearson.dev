<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151" />
    </marker>
  </defs>

  <!-- Paper Towel -->
  <circle cx="60" cy="60" r="50" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
  
  <!-- Thick Colourful Circle -->
  <circle cx="60" cy="60" r="15" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="2,1" />
  <circle cx="60" cy="60" r="12" fill="none" stroke="#3b82f6" stroke-width="3" />
  <circle cx="60" cy="60" r="9" fill="none" stroke="#10b981" stroke-width="3" />

  <!-- Marker Hand -->
  <g transform="translate(85, 35) rotate(45)">
    <rect x="0" y="0" width="8" height="35" rx="2" fill="#374151" />
    <path d="M0,0 L8,0 L4,-6 Z" fill="#ef4444" />
  </g>
  
  <!-- Action Arrow -->
  <path d="M60,35 A25,25 0 0,1 85,60" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" />
</svg>
