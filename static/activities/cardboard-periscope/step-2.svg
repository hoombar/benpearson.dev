<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Square of cardboard with foil -->
  <g transform="translate(60, 60) rotate(15)">
    <rect x="-20" y="-20" width="40" height="40" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <!-- Shiny foil lines -->
    <line x1="-15" y1="-15" x2="15" y2="15" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
    <line x1="-15" y1="0" x2="0" y2="15" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="-15" x2="15" y2="0" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- Hand pressing (arrow) -->
  <path d="M30,30 Q45,20 60,30" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
