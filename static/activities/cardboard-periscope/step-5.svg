<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Joined Tubes -->
  <g transform="translate(60, 60)">
    <!-- Bottom Tube -->
    <rect x="-15" y="0" width="30" height="50" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
    <rect x="-15" y="35" width="10" height="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <!-- Top Tube -->
    <rect x="-15" y="-50" width="30" height="50" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
    <rect x="5" y="-45" width="10" height="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <!-- Tape wrap -->
    <rect x="-17" y="-5" width="34" height="10" rx="1" fill="#93c5fd" stroke="#374151" stroke-width="1.5" opacity="0.8"/>
  </g>
</svg>
