<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Tube with window -->
  <g transform="translate(60, 60)">
    <rect x="-15" y="-45" width="30" height="90" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="2.5"/>
    <!-- Window -->
    <rect x="-8" y="-35" width="16" height="12" rx="1" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  </g>
  <!-- Scissors cutting -->
  <g transform="translate(90, 30) rotate(-30)">
    <line x1="0" y1="0" x2="-20" y2="-5" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-20" y2="5" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="6" cy="-6" r="6" stroke="#374151" stroke-width="2" fill="#dbeafe"/>
    <circle cx="6" cy="6" r="6" stroke="#374151" stroke-width="2" fill="#dbeafe"/>
  </g>
</svg>
