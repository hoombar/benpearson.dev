<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Surface -->
  <line x1="10" y1="100" x2="110" y2="100" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Paper -->
  <rect x="25" y="60" width="70" height="30" rx="2" stroke="#374151" stroke-width="2" fill="#f9fafb"/>
  <!-- Toy (Dinosaur) at the edge -->
  <g transform="translate(15, 60)">
    <path d="M5 40 Q5 20 15 15 Q25 10 30 20 Q35 30 30 40 L5 40 Z" fill="#22c55e" stroke="#374151" stroke-width="2"/>
    <path d="M15 15 Q10 10 5 15" stroke="#374151" stroke-width="1.5" fill="none"/>
  </g>
  <!-- Shadow on the paper -->
  <path d="M30 100 Q60 85 90 90 L30 90 Z" fill="#e5e7eb" stroke="none" opacity="0.6"/>
  <!-- Arrow showing toy position -->
  <path d="M15,55 L25,55" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
