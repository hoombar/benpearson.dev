<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Paper -->
  <rect x="20" y="20" width="80" height="80" rx="2" stroke="#374151" stroke-width="2" fill="#f9fafb"/>
  <!-- Shadow on paper -->
  <path d="M40 80 Q60 40 90 60 Q80 85 40 85 Z" fill="#e5e7eb" stroke="none" opacity="0.5"/>
  <!-- Pencil/Marker (hero action) -->
  <g transform="translate(70, 40) rotate(-20)">
    <!-- Tip first (points toward shadow) -->
    <path d="M0 0 L-4 -8 L4 -8 Z" fill="#374151" stroke="#374151" stroke-width="1"/>
    <!-- Shaft -->
    <rect x="-4" y="-48" width="8" height="40" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
    <!-- Eraser -->
    <rect x="-4" y="-54" width="8" height="6" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>
  </g>
  <!-- Trace line (already started) -->
  <path d="M40 80 Q60 40 75 50" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
