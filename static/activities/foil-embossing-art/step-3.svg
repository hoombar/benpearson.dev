<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 3: Add the Ancient Weathering -->
  <rect x="0" y="0" width="120" height="120" fill="#fef3c7" />

  <!-- The Foil-Covered Shield -->
  <path d="M40,20 L80,20 L90,50 Q80,100 60,110 Q40,100 30,50 Z" fill="#9ca3af" stroke="#374151" stroke-width="2" />
  
  <!-- Weathered shadows (black ink) in the crevices -->
  <path d="M57,37 Q83,37 73,63 Q47,83 57,63 Q68,53 57,37" fill="none" stroke="#111827" stroke-width="6" opacity="0.8" stroke-linecap="round" />
  
  <!-- Raised silver string (highlighted, unwiped) -->
  <path d="M60,40 Q80,40 70,60 Q50,80 60,60 Q65,50 60,40" fill="none" stroke="#f3f4f6" stroke-width="3" stroke-linecap="round" />
  
  <!-- Weathered Star -->
  <g transform="translate(45, 52)">
    <polygon points="0,-12 3,-6 9,-6 4,-2 6,4 0,0 -6,4 -4,-2 -9,-6 -3,-6" fill="none" stroke="#111827" stroke-width="4" opacity="0.7" />
    <polygon points="0,-12 3,-6 9,-6 4,-2 6,4 0,0 -6,4 -4,-2 -9,-6 -3,-6" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1" />
  </g>

  <!-- Tissue paper wiping the ink -->
  <g transform="translate(40, 60)">
    <path d="M0,0 Q10,-10 20,-5 Q30,10 15,20 Q-5,25 0,0" fill="#ffffff" stroke="#d1d5db" stroke-width="2" opacity="0.95" />
    <path d="M5,5 Q15,-5 25,5 Q10,20 5,5" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" />
    <!-- Ink stain on the tissue -->
    <circle cx="12" cy="8" r="4" fill="#111827" opacity="0.6" />
  </g>
  
  <!-- Wiping motion arrows -->
  <path d="M30,75 Q20,60 30,45" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round" />
  <path d="M25,50 L30,45 L35,50" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" />

  <!-- Black permanent marker -->
  <g transform="translate(85, 20) rotate(45)">
    <rect x="-6" y="0" width="12" height="40" rx="2" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <rect x="-6" y="5" width="12" height="15" fill="#9ca3af" />
    <path d="M-6,0 L6,0 L3,-8 L-3,-8 Z" fill="#374151" />
    <path d="M-2,-8 L2,-8 L1,-12 L-1,-12 Z" fill="#111827" />
  </g>
</svg>