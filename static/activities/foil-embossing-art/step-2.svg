<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 2: Emboss the Metal -->
  <rect x="0" y="0" width="120" height="120" fill="#fef3c7" />

  <!-- The Foil-Covered Shield (edges folded) -->
  <path d="M40,20 L80,20 L90,50 Q80,100 60,110 Q40,100 30,50 Z" fill="#d1d5db" stroke="#374151" stroke-width="2" />

  <!-- Embossed String Swirl (now a 3D silver ridge) -->
  <path d="M60,40 Q80,40 70,60 Q50,80 60,60 Q65,50 60,40" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <path d="M60,40 Q80,40 70,60 Q50,80 60,60 Q65,50 60,40" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" />
  
  <!-- Embossed Star -->
  <g transform="translate(45, 52)">
    <polygon points="0,-12 3,-6 9,-6 4,-2 6,4 0,0 -6,4 -4,-2 -9,-6 -3,-6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" />
    <!-- Highlight -->
    <line x1="-3" y1="-6" x2="0" y2="-12" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Spoon Action -->
  <!-- Metal spoon rubbing the foil -->
  <g transform="translate(75, 75) rotate(-35)">
    <!-- Handle -->
    <rect x="-2" y="15" width="4" height="40" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="1.5" />
    <!-- Bowl of spoon -->
    <ellipse cx="0" cy="0" rx="10" ry="16" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" />
    <!-- Shine on spoon -->
    <path d="M-6,-5 Q-2,-10 6,-5" fill="none" stroke="#ffffff" stroke-width="2" />
  </g>
  
  <!-- Motion arcs to show rubbing -->
  <path d="M65,70 Q75,65 85,75" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,3" stroke-linecap="round" />
  <path d="M62,80 Q72,75 82,85" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,3" stroke-linecap="round" />

  <!-- Foil Wrinkles -->
  <path d="M45,25 L55,30" fill="none" stroke="#9ca3af" stroke-width="1" stroke-linecap="round" />
  <path d="M75,95 L80,90" fill="none" stroke="#9ca3af" stroke-width="1" stroke-linecap="round" />
  <path d="M35,60 L45,65" fill="none" stroke="#9ca3af" stroke-width="1" stroke-linecap="round" />
</svg>