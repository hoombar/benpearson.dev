<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="80" width="110" height="30" rx="4" fill="#fef3c7" stroke="#374151" stroke-width="2.5"/>

  <!-- Tube lying on side -->
  <path d="M20 70 L80 70 Q85 75 80 80 L20 80 Q15 75 20 70 Z" fill="#fbbf24" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Sealed ends (tape/paper) -->
  <path d="M20 70 Q15 75 20 80 Q25 75 20 70 Z" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <path d="M80 70 Q85 75 80 80 Q75 75 80 70 Z" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  
  <!-- Tape holding ends -->
  <rect x="22" y="68" width="6" height="14" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <rect x="72" y="68" width="6" height="14" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>

  <!-- Decorations on tube -->
  <path d="M35 75 L40 70 L45 75" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M50 75 L55 70 L60 75" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="42" cy="77" r="1" fill="#3b82f6"/>
  <circle cx="57" cy="77" r="1" fill="#3b82f6"/>
  
  <!-- Red marker drawing -->
  <!-- Marker tip touching tube -->
  <g transform="translate(60, 75) rotate(-45)">
    <polygon points="0,0 -3,-6 3,-6" fill="#374151"/>
    <polygon points="0,0 -2,-4 2,-4" fill="#ef4444"/>
    <rect x="-4" y="-30" width="8" height="24" rx="1" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Marker cap placed nearby or just the body -->
    <rect x="-4" y="-30" width="8" height="6" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Action lines -->
  <path d="M62 70 Q67 65 72 75" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2,2"/>
</svg>