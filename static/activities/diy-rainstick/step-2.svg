<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table background -->
  <rect x="10" y="80" width="100" height="30" rx="4" fill="#fef3c7" stroke="#374151" stroke-width="2.5"/>

  <!-- Upright tube with sealed bottom -->
  <path d="M45 40 L45 85 Q55 90 65 85 L65 40 Q55 35 45 40 Z" fill="#fbbf24" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <!-- Tube top opening -->
  <ellipse cx="55" cy="40" rx="10" ry="4" fill="#d97706" stroke="#374151" stroke-width="2"/>
  
  <!-- Tilted Bowl -->
  <g transform="translate(65, 10) rotate(-20)">
    <path d="M0 0 Q10 20 20 20 Q30 20 40 0" fill="#fca5a5" stroke="#374151" stroke-width="2"/>
    <ellipse cx="20" cy="0" rx="20" ry="6" fill="#fecaca" stroke="#374151" stroke-width="2"/>
  </g>

  <!-- Rice falling -->
  <!-- Stream of little rice grains -->
  <ellipse cx="65" cy="22" rx="2" ry="1" fill="#fef9c3" stroke="#374151" stroke-width="1" transform="rotate(30 65 22)"/>
  <ellipse cx="60" cy="26" rx="2" ry="1" fill="#fef9c3" stroke="#374151" stroke-width="1" transform="rotate(-10 60 26)"/>
  <ellipse cx="56" cy="30" rx="2" ry="1" fill="#fef9c3" stroke="#374151" stroke-width="1" transform="rotate(15 56 30)"/>
  <ellipse cx="62" cy="33" rx="2" ry="1" fill="#fef9c3" stroke="#374151" stroke-width="1" transform="rotate(-20 62 33)"/>
  <ellipse cx="58" cy="36" rx="2" ry="1" fill="#fef9c3" stroke="#374151" stroke-width="1" transform="rotate(5 58 36)"/>
  
  <!-- Motion line -->
  <path d="M75 15 Q65 25 60 35" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,3"/>
</svg>