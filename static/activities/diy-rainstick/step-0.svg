<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table background -->
  <rect x="10" y="80" width="100" height="30" rx="4" fill="#fef3c7" stroke="#374151" stroke-width="2.5"/>
  
  <!-- Piece of paper on table -->
  <rect x="25" y="70" width="40" height="20" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2" transform="skewX(-20)"/>

  <!-- Cardboard tube standing upright on paper -->
  <path d="M45 20 L45 80 Q55 85 65 80 L65 20 Q55 15 45 20 Z" fill="#fbbf24" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <!-- Tube top opening -->
  <ellipse cx="55" cy="20" rx="10" ry="4" fill="#d97706" stroke="#374151" stroke-width="2"/>
  
  <!-- Tape Roll -->
  <circle cx="90" cy="75" r="12" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
  <circle cx="90" cy="75" r="5" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
  <path d="M90 63 L102 63 L102 70" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Pencil drawing circle on paper -->
  <!-- Pencil -->
  <g transform="translate(68, 65) rotate(-30)">
    <polygon points="0,0 -3,8 3,8" fill="#374151"/>
    <rect x="-3" y="8" width="6" height="25" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
    <rect x="-3" y="33" width="6" height="5" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>
  </g>
  
  <!-- Circular dashed line on paper -->
  <ellipse cx="55" cy="80" rx="14" ry="6" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>