  <!-- Fully cotton-woolled bear (hero) -->
  <ellipse cx="50" cy="62" rx="22" ry="14" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
  <ellipse cx="42" cy="58" rx="6" ry="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.3"/>
  <circle cx="32" cy="48" r="11" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
  <circle cx="26" cy="39" r="3.5" fill="white" stroke="#d1d5db" stroke-width="0.4"/>
  <circle cx="38" cy="39" r="3.5" fill="white" stroke="#d1d5db" stroke-width="0.4"/>
  <!-- Legs -->
  <ellipse cx="36" cy="76" rx="4" ry="7" fill="white" stroke="#d1d5db" stroke-width="0.4"/>
  <ellipse cx="46" cy="76" rx="4" ry="7" fill="white" stroke="#d1d5db" stroke-width="0.4"/>
  <ellipse cx="56" cy="76" rx="4" ry="7" fill="white" stroke="#d1d5db" stroke-width="0.4"/>
  <ellipse cx="66" cy="76" rx="4" ry="7" fill="white" stroke="#d1d5db" stroke-width="0.4"/>
  <circle cx="72" cy="56" r="3" fill="white" stroke="#d1d5db" stroke-width="0.4"/>

  <!-- Face -->
  <circle cx="28" cy="46" r="3" fill="white" stroke="#374151" stroke-width="0.5"/>
  <circle cx="29" cy="47" r="1.5" fill="#374151"/>
  <circle cx="36" cy="46" r="3" fill="white" stroke="#374151" stroke-width="0.5"/>
  <circle cx="37" cy="47" r="1.5" fill="#374151"/>
  <ellipse cx="32" cy="52" rx="1.8" ry="1.2" fill="#374151"/>
  <path d="M30,54 Q32,56 34,54" fill="none" stroke="#374151" stroke-width="0.5"/>

  <!-- Cotton wool snow ground -->
  <ellipse cx="20" cy="86" rx="18" ry="6" fill="white" stroke="#d1d5db" stroke-width="0.4"/>
  <ellipse cx="50" cy="88" rx="22" ry="7" fill="white" stroke="#d1d5db" stroke-width="0.4"/>
  <ellipse cx="80" cy="86" rx="20" ry="6" fill="white" stroke="#d1d5db" stroke-width="0.4"/>
  <ellipse cx="106" cy="88" rx="14" ry="5" fill="white" stroke="#d1d5db" stroke-width="0.4"/>

