  <circle cx="48" cy="10" r="1.5" fill="white" stroke="#d1d5db" stroke-width="0.3"/>
  <circle cx="76" cy="28" r="2" fill="white" stroke="#d1d5db" stroke-width="0.3"/>
  <circle cx="98" cy="12" r="1.5" fill="white" stroke="#d1d5db" stroke-width="0.3"/>
  <circle cx="110" cy="36" r="1.5" fill="white" stroke="#d1d5db" stroke-width="0.3"/>
  <circle cx="6" cy="56" r="1.5" fill="white" stroke="#d1d5db" stroke-width="0.3"/>
