<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Blue paper sheet -->
  <rect x="10" y="8" width="80" height="84" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="1"/>

  <!-- Polar bear with cotton wool being applied (hero) -->
  <!-- Body (half covered in cotton wool) -->
  <ellipse cx="48" cy="56" rx="24" ry="16" fill="none" stroke="#374151" stroke-width="1"/>
  <!-- Cotton wool patches on body -->
  <ellipse cx="38" cy="52" rx="10" ry="8" fill="white" stroke="#d1d5db" stroke-width="0.5"/>
  <ellipse cx="52" cy="50" rx="8" ry="6" fill="white" stroke="#d1d5db" stroke-width="0.5"/>
  <ellipse cx="44" cy="60" rx="9" ry="7" fill="white" stroke="#d1d5db" stroke-width="0.5"/>
  <!-- Head (covered) -->
  <circle cx="28" cy="40" r="12" fill="white" stroke="#d1d5db" stroke-width="0.5"/>
  <!-- Ears -->
  <circle cx="22" cy="30" r="4" fill="white" stroke="#d1d5db" stroke-width="0.4"/>
  <circle cx="34" cy="30" r="4" fill="white" stroke="#d1d5db" stroke-width="0.4"/>
  <!-- Legs -->
  <ellipse cx="32" cy="72" rx="4" ry="8" fill="white" stroke="#d1d5db" stroke-width="0.4"/>
  <ellipse cx="42" cy="72" rx="4" ry="8" fill="white" stroke="#d1d5db" stroke-width="0.4"/>
  <ellipse cx="56" cy="72" rx="4" ry="8" fill="none" stroke="#374151" stroke-width="0.8"/>
  <ellipse cx="66" cy="72" rx="4" ry="8" fill="none" stroke="#374151" stroke-width="0.8"/>

  <!-- Hand pressing cotton wool -->
  <g transform="translate(54, 44)">
    <rect x="0" y="0" width="12" height="18" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <!-- Cotton wool in hand -->
    <ellipse cx="6" cy="20" rx="8" ry="5" fill="white" stroke="#d1d5db" stroke-width="0.5"/>
  </g>

  <!-- PVA glue -->
  <g transform="translate(92, 30)">
    <rect x="0" y="8" width="14" height="20" rx="3" fill="#f0f9ff" stroke="#374151" stroke-width="0.8"/>
    <rect x="3" y="0" width="8" height="10" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="0.6"/>
    <circle cx="7" cy="0" r="2" fill="#f97316" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Glue drip on uncovered area -->
  <ellipse cx="60" cy="54" rx="6" ry="4" fill="#fef9c3" stroke="#374151" stroke-width="0.3" opacity="0.5"/>
</svg>
