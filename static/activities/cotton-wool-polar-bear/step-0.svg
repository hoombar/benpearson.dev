<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Blue paper sheet -->
  <rect x="10" y="8" width="80" height="84" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="1"/>

  <!-- Polar bear outline drawn with marker (hero) -->
  <!-- Body -->
  <ellipse cx="48" cy="56" rx="24" ry="16" fill="none" stroke="#374151" stroke-width="1.5"/>
  <!-- Head -->
  <circle cx="28" cy="40" r="12" fill="none" stroke="#374151" stroke-width="1.5"/>
  <!-- Ears -->
  <circle cx="22" cy="30" r="4" fill="none" stroke="#374151" stroke-width="1"/>
  <circle cx="34" cy="30" r="4" fill="none" stroke="#374151" stroke-width="1"/>
  <!-- Legs -->
  <ellipse cx="32" cy="72" rx="4" ry="8" fill="none" stroke="#374151" stroke-width="1"/>
  <ellipse cx="42" cy="72" rx="4" ry="8" fill="none" stroke="#374151" stroke-width="1"/>
  <ellipse cx="56" cy="72" rx="4" ry="8" fill="none" stroke="#374151" stroke-width="1"/>
  <ellipse cx="66" cy="72" rx="4" ry="8" fill="none" stroke="#374151" stroke-width="1"/>
  <!-- Tail -->
  <circle cx="72" cy="50" r="3" fill="none" stroke="#374151" stroke-width="1"/>

  <!-- Marker drawing -->
  <g transform="translate(72, 44) rotate(15)">
    <rect x="0" y="-2.5" width="22" height="5" rx="2" fill="#374151" stroke="#374151" stroke-width="0.6"/>
    <rect x="-3" y="-3" width="4" height="6" rx="1" fill="#374151"/>
  </g>
</svg>
