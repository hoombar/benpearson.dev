<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Blue paper sheet -->
  <rect x="10" y="8" width="80" height="84" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="1"/>

  <!-- Fully cotton-woolled bear (hero) -->
  <!-- Body -->
  <ellipse cx="48" cy="56" rx="24" ry="16" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
  <ellipse cx="40" cy="52" rx="8" ry="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.3"/>
  <ellipse cx="56" cy="54" rx="7" ry="5" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.3"/>
  <!-- Head -->
  <circle cx="28" cy="40" r="12" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
  <!-- Ears -->
  <circle cx="22" cy="30" r="4" fill="white" stroke="#d1d5db" stroke-width="0.5"/>
  <circle cx="34" cy="30" r="4" fill="white" stroke="#d1d5db" stroke-width="0.5"/>
  <!-- Legs -->
  <ellipse cx="32" cy="72" rx="5" ry="8" fill="white" stroke="#d1d5db" stroke-width="0.5"/>
  <ellipse cx="42" cy="72" rx="5" ry="8" fill="white" stroke="#d1d5db" stroke-width="0.5"/>
  <ellipse cx="56" cy="72" rx="5" ry="8" fill="white" stroke="#d1d5db" stroke-width="0.5"/>
  <ellipse cx="66" cy="72" rx="5" ry="8" fill="white" stroke="#d1d5db" stroke-width="0.5"/>
  <!-- Tail -->
  <circle cx="72" cy="50" r="4" fill="white" stroke="#d1d5db" stroke-width="0.5"/>

  <!-- Googly eyes -->
  <circle cx="24" cy="38" r="3.5" fill="white" stroke="#374151" stroke-width="0.6"/>
  <circle cx="25" cy="39" r="1.8" fill="#374151"/>
  <circle cx="32" cy="38" r="3.5" fill="white" stroke="#374151" stroke-width="0.6"/>
  <circle cx="33" cy="39" r="1.8" fill="#374151"/>

  <!-- Black nose -->
  <ellipse cx="28" cy="44" rx="2" ry="1.5" fill="#374151"/>
  <!-- Mouth -->
  <path d="M26,46 Q28,48 30,46" fill="none" stroke="#374151" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Marker for mouth -->
  <g transform="translate(92, 60) rotate(10)">
    <rect x="0" y="-2.5" width="18" height="5" rx="2" fill="#374151" stroke="#374151" stroke-width="0.5"/>
    <rect x="-3" y="-3" width="4" height="6" rx="1" fill="#374151"/>
  </g>
</svg>
