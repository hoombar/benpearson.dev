<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect x="0" y="0" width="120" height="100" fill="#dbeafe"/>
  <!-- Ground -->
  <rect x="0" y="90" width="120" height="30" rx="2" fill="#86efac" stroke="#374151" stroke-width="1"/>

  <!-- Pencil pivot (vertical) -->
  <rect x="56" y="42" width="6" height="54" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  <polygon points="59,42 56,36 62,36" fill="#f5deb3" stroke="#374151" stroke-width="0.5"/>

  <!-- Base (clay ball) -->
  <ellipse cx="59" cy="92" rx="12" ry="6" fill="#9ca3af" stroke="#374151" stroke-width="0.8"/>

  <!-- Spinning cross with cups (hero) -->
  <!-- Straw arm horizontal -->
  <line x1="20" y1="52" x2="98" y2="52" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <!-- Straw arm vertical -->
  <line x1="59" y1="16" x2="59" y2="84" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>

  <!-- Cup left -->
  <path d="M18,42 L16,58 L30,58 L28,42 Z" fill="white" stroke="#374151" stroke-width="0.8"/>
  <!-- Cup right -->
  <path d="M92,58 L94,42 L80,42 L82,58 Z" fill="white" stroke="#374151" stroke-width="0.8"/>
  <!-- Cup top -->
  <path d="M49,14 L65,14 L65,28 L49,28 Z" fill="white" stroke="#374151" stroke-width="0.8"/>
  <!-- Cup bottom (red marker) -->
  <path d="M49,82 L65,82 L65,68 L49,68 Z" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>

  <!-- Spin motion arc -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M100,36 Q108,46 100,58" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Wind lines -->
  <line x1="2" y1="38" x2="14" y2="38" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="4" y1="46" x2="16" y2="46" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="2" y1="54" x2="14" y2="54" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Speed/blur lines -->
  <line x1="102" y1="44" x2="108" y2="44" stroke="#374151" stroke-width="0.4" opacity="0.4"/>
  <line x1="104" y1="56" x2="110" y2="56" stroke="#374151" stroke-width="0.4" opacity="0.4"/>
</svg>
