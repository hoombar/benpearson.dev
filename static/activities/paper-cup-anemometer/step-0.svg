<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Four paper cups in a row -->
  <!-- Cup 1 (white) -->
  <g transform="translate(6, 30)">
    <path d="M2,0 L0,40 L24,40 L22,0 Z" fill="white" stroke="#374151" stroke-width="1"/>
    <ellipse cx="12" cy="0" rx="10" ry="3" fill="#f3f4f6" stroke="#374151" stroke-width="0.6"/>
    <!-- Hole near rim -->
    <circle cx="18" cy="8" r="2" fill="#fef3c7" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Cup 2 (white) -->
  <g transform="translate(32, 30)">
    <path d="M2,0 L0,40 L24,40 L22,0 Z" fill="white" stroke="#374151" stroke-width="1"/>
    <ellipse cx="12" cy="0" rx="10" ry="3" fill="#f3f4f6" stroke="#374151" stroke-width="0.6"/>
    <circle cx="18" cy="8" r="2" fill="#fef3c7" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Cup 3 (coloured marker cup - hero) -->
  <g transform="translate(58, 30)">
    <path d="M2,0 L0,40 L24,40 L22,0 Z" fill="#ef4444" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="12" cy="0" rx="10" ry="3" fill="#fca5a5" stroke="#374151" stroke-width="0.8"/>
    <circle cx="18" cy="8" r="2" fill="#fef3c7" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Cup 4 (white) -->
  <g transform="translate(84, 30)">
    <path d="M2,0 L0,40 L24,40 L22,0 Z" fill="white" stroke="#374151" stroke-width="1"/>
    <ellipse cx="12" cy="0" rx="10" ry="3" fill="#f3f4f6" stroke="#374151" stroke-width="0.6"/>
    <circle cx="18" cy="8" r="2" fill="#fef3c7" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Marker colouring the red cup -->
  <g transform="translate(56, 10) rotate(20)">
    <rect x="0" y="-2.5" width="22" height="5" rx="2" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
    <rect x="-3" y="-3" width="4" height="6" rx="1" fill="#374151"/>
  </g>

  <!-- Scissors for poking holes -->
  <g transform="translate(8, 80) rotate(-5)">
    <path d="M0,0 L14,5" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L14,-5" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.2" fill="#374151"/>
    <ellipse cx="17" cy="6" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1"/>
    <ellipse cx="17" cy="-6" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1"/>
  </g>

  <!-- Warning -->
  <g transform="translate(100, 4)">
    <polygon points="8,0 0,14 16,14" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <line x1="8" y1="4" x2="8" y2="9" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="8" cy="11.5" r="0.8" fill="#374151"/>
  </g>
</svg>
