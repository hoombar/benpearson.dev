<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Two straws forming a cross (hero) -->
  <!-- Horizontal straw -->
  <line x1="10" y1="50" x2="110" y2="50" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
  <!-- Vertical straw -->
  <line x1="60" y1="10" x2="60" y2="90" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>

  <!-- Intersection detail -->
  <circle cx="60" cy="50" r="4" fill="#16a34a" stroke="#374151" stroke-width="0.8"/>

  <!-- Tape at intersection -->
  <rect x="54" y="44" width="12" height="4" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.4"/>
  <rect x="56" y="46" width="8" height="8" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.4" transform="rotate(90, 60, 50)"/>

  <!-- Hand pushing straw through -->
  <g transform="translate(4, 40)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrow showing insertion -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="18" y1="38" x2="28" y2="42" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Extra straws -->
  <line x1="90" y1="70" x2="90" y2="96" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <line x1="98" y1="72" x2="98" y2="98" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>

  <!-- Tape roll -->
  <g transform="translate(90, 6)">
    <ellipse cx="10" cy="10" rx="10" ry="10" fill="#d1fae5" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="10" cy="10" rx="4" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="0.4"/>
  </g>
</svg>
