<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Large bowl with white/cream dough -->
  <line x1="14" y1="68" x2="106" y2="68" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M14 68 Q14 108 60 108 Q106 108 106 68" stroke="#374151" stroke-width="2.5" fill="#f9fafb"/>
  <!-- Dough surface (white/cream mound) -->
  <path d="M24 68 Q28 56 60 54 Q92 56 96 68 Z" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <!-- Food colouring bottle (small, tilted, dripping drops) -->
  <!-- Bottle body — single closed path to avoid seam -->
  <g transform="translate(30, 16) rotate(20)">
    <path d="M-8 12 Q-10 8 -6 4 L6 4 Q10 8 8 12 L8 32 Q8 36 4 36 L-4 36 Q-8 36 -8 32 Z"
          fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Nozzle tip -->
    <rect x="-3" y="-4" width="6" height="8" rx="2" fill="#dc2626" stroke="#374151" stroke-width="1.5"/>
  </g>
  <!-- Colour drops falling onto dough surface -->
  <path d="M30 40 Q28 50 30 56" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>
  <!-- Large colour drop on dough -->
  <path d="M26 56 Q24 62 28 64 Q32 62 30 56 Z" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <!-- Second drop -->
  <path d="M38 52 Q36 58 40 60 Q44 58 42 52 Z" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <!-- Colour spreading through dough (concentric arcs) -->
  <path d="M22 66 Q32 58 44 62" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4,3"/>
  <path d="M18 70 Q38 62 56 66" stroke="#fca5a5" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="3,3"/>
  <!-- Second colour drop group (right side, blue variant) -->
  <g transform="translate(84, 20) rotate(-15)">
    <path d="M-7 10 Q-9 6 -5 2 L5 2 Q9 6 7 10 L7 28 Q7 32 3 32 L-3 32 Q-7 32 -7 28 Z"
          fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <rect x="-3" y="-6" width="6" height="8" rx="2" fill="#2563eb" stroke="#374151" stroke-width="1.5"/>
  </g>
  <path d="M84 42 Q82 52 84 58" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>
  <path d="M80 58 Q78 64 82 66 Q86 64 84 58 Z" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
</svg>
