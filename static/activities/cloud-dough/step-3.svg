<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="4" y="108" width="112" height="8" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <!-- Three formed cloud-dough shapes showing what you can make -->

  <!-- Shape 1: Ball (left) — squeezed into sphere -->
  <circle cx="24" cy="88" r="18" fill="#a78bfa" stroke="#374151" stroke-width="2"/>
  <!-- Crumble texture on ball surface -->
  <circle cx="18" cy="82" r="3" fill="#c4b5fd" stroke="none"/>
  <circle cx="28" cy="78" r="2" fill="#c4b5fd" stroke="none"/>
  <circle cx="32" cy="90" r="2" fill="#c4b5fd" stroke="none"/>

  <!-- Shape 2: Pressed into cup — show cup impression result -->
  <!-- Small cup/mould -->
  <path d="M52 82 Q52 106 60 106 Q68 106 68 82" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <line x1="52" y1="82" x2="68" y2="82" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cloud dough shape tipped out (beside cup) -->
  <path d="M72 106 Q72 88 80 88 Q88 88 88 106 Z" fill="#86efac" stroke="#374151" stroke-width="2"/>
  <!-- Crumble marks on shape -->
  <circle cx="76" cy="96" r="2" fill="#d1fae5" stroke="none"/>
  <circle cx="84" cy="100" r="2" fill="#d1fae5" stroke="none"/>

  <!-- Arrow from cup to shape (tip it out action) -->
  <line x1="70" y1="96" x2="71" y2="96" stroke="#374151" stroke-width="1.5"/>
  <path d="M68 92 L72 96 L68 100" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Shape 3: Crumbling hand open — dough crumbling apart -->
  <!-- Pile of crumbles -->
  <ellipse cx="104" cy="104" rx="12" ry="4" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <!-- Falling crumbles above pile (dashed drops) -->
  <circle cx="98" cy="90" r="4" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <circle cx="106" cy="80" r="5" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <circle cx="112" cy="92" r="3" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <!-- Downward arrows for crumbling motion -->
  <line x1="98" y1="94" x2="98" y2="100" stroke="#374151" stroke-width="1" stroke-dasharray="3,2" stroke-linecap="round"/>
  <line x1="108" y1="85" x2="106" y2="100" stroke="#374151" stroke-width="1" stroke-dasharray="3,2" stroke-linecap="round"/>
  <line x1="112" y1="95" x2="112" y2="101" stroke="#374151" stroke-width="1" stroke-dasharray="3,2" stroke-linecap="round"/>
</svg>
