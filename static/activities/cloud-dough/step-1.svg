<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Large bowl in centre -->
  <line x1="14" y1="72" x2="106" y2="72" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M14 72 Q14 112 60 112 Q106 112 106 72" stroke="#374151" stroke-width="2.5" fill="#f9fafb"/>
  <!-- White cornflour powder in bowl (crumbly texture) -->
  <ellipse cx="60" cy="76" rx="36" ry="10" fill="#f3f4f6" stroke="none"/>
  <!-- Crumble texture marks -->
  <circle cx="44" cy="78" r="3" fill="#e5e7eb" stroke="none"/>
  <circle cx="56" cy="74" r="4" fill="#e5e7eb" stroke="none"/>
  <circle cx="68" cy="80" r="3" fill="#e5e7eb" stroke="none"/>
  <circle cx="76" cy="74" r="4" fill="#e5e7eb" stroke="none"/>
  <circle cx="50" cy="84" r="3" fill="#e5e7eb" stroke="none"/>
  <circle cx="64" cy="86" r="3" fill="#e5e7eb" stroke="none"/>
  <!-- Oil bottle pouring from right -->
  <!-- Bottle body (single closed path) -->
  <path d="M86 10 Q86 4 90 4 L96 4 Q100 4 100 10 L100 24 Q104 27 104 32 L104 62 Q104 66 100 66 L86 66 Q82 66 82 62 L82 32 Q82 27 86 24 Z"
        fill="#fef9c3" stroke="#374151" stroke-width="2"/>
  <!-- Oil inside (yellow) -->
  <rect x="84" y="34" width="18" height="28" rx="0" fill="#fef08a" stroke="none"/>
  <!-- Tilted pouring position — oil stream -->
  <line x1="84" y1="68" x2="80" y2="82" stroke="#fde68a" stroke-width="2" stroke-dasharray="3,2" stroke-linecap="round"/>
  <line x1="82" y1="76" x2="76" y2="90" stroke="#fde68a" stroke-width="2" stroke-dasharray="3,2" stroke-linecap="round"/>
  <!-- Oil drop entering bowl -->
  <path d="M74 88 Q72 94 76 96 Q80 94 78 88 Z" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <!-- Mixing arc in bowl (stirring motion) -->
  <path d="M34 80 Q60 66 84 80" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
</svg>
