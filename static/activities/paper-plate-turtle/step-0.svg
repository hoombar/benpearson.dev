<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate flipped upside down (hero, dome shape) -->
  <ellipse cx="50" cy="58" rx="38" ry="30" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>

  <!-- Shell pattern — hexagonal shapes painted on -->
  <polygon points="50,36 58,40 58,48 50,52 42,48 42,40" fill="#16a34a" stroke="#374151" stroke-width="0.8"/>
  <polygon points="38,44 42,40 42,48 38,52 34,48 34,44" fill="#86efac" stroke="#374151" stroke-width="0.6" opacity="0.8"/>
  <polygon points="62,44 66,40 66,48 62,52 58,48 58,40" fill="#86efac" stroke="#374151" stroke-width="0.6" opacity="0.8"/>
  <polygon points="50,52 58,48 58,56 50,60 42,56 42,48" fill="#4ade80" stroke="#374151" stroke-width="0.6"/>
  <polygon points="38,56 42,52 42,60 38,64 34,60 34,56" fill="#bbf7d0" stroke="#374151" stroke-width="0.5" opacity="0.7"/>
  <polygon points="62,56 66,52 66,60 62,64 58,60 58,56" fill="#bbf7d0" stroke="#374151" stroke-width="0.5" opacity="0.7"/>

  <!-- Edge pattern -->
  <ellipse cx="50" cy="58" rx="38" ry="30" fill="none" stroke="#15803d" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Paintbrush painting the shell -->
  <g transform="translate(80, 20)">
    <!-- Handle -->
    <rect x="0" y="0" width="6" height="30" rx="2" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
    <!-- Ferrule -->
    <rect x="-1" y="28" width="8" height="5" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="0.6"/>
    <!-- Bristles -->
    <rect x="0" y="32" width="6" height="7" rx="2" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Hand holding brush -->
  <g transform="translate(88, 18)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Paint pots -->
  <g transform="translate(4, 72)">
    <rect x="0" y="0" width="16" height="20" rx="3" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="8" cy="2" rx="8" ry="3" fill="#16a34a" stroke="#374151" stroke-width="0.6"/>
  </g>
  <g transform="translate(24, 74)">
    <rect x="0" y="0" width="16" height="18" rx="3" fill="#eab308" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="8" cy="2" rx="8" ry="3" fill="#ca8a04" stroke="#374151" stroke-width="0.6"/>
  </g>
</svg>
