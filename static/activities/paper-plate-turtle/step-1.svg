<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Green paper sheet -->
  <rect x="8" y="8" width="70" height="50" rx="2" fill="#86efac" stroke="#374151" stroke-width="1"/>

  <!-- Cut-out shapes on the paper -->

  <!-- Head (oval) being cut -->
  <ellipse cx="52" cy="24" rx="10" ry="8" fill="#22c55e" stroke="#374151" stroke-width="1.2"/>
  <!-- Cut line around head -->
  <ellipse cx="52" cy="24" rx="12" ry="10" fill="none" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- Already cut legs placed below -->
  <!-- Leg 1 -->
  <rect x="10" y="68" width="12" height="18" rx="6" fill="#22c55e" stroke="#374151" stroke-width="1"/>
  <!-- Leg 2 -->
  <rect x="28" y="68" width="12" height="18" rx="6" fill="#22c55e" stroke="#374151" stroke-width="1"/>
  <!-- Leg 3 -->
  <rect x="46" y="68" width="12" height="18" rx="6" fill="#22c55e" stroke="#374151" stroke-width="1"/>
  <!-- Leg 4 -->
  <rect x="64" y="68" width="12" height="18" rx="6" fill="#22c55e" stroke="#374151" stroke-width="1"/>

  <!-- Tail (small triangle) -->
  <polygon points="84,76 90,84 78,84" fill="#22c55e" stroke="#374151" stroke-width="1"/>

  <!-- Scissors cutting the head shape -->
  <g transform="translate(66, 14) rotate(30)">
    <path d="M0,0 L-14,5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,0 L-14,-5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#374151"/>
    <ellipse cx="5" cy="3.5" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <ellipse cx="5" cy="-3.5" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Hand holding scissors -->
  <g transform="translate(84, 6)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Paper scraps -->
  <rect x="90" y="42" width="8" height="6" rx="1" fill="#86efac" stroke="#374151" stroke-width="0.4" opacity="0.5"/>
  <rect x="98" y="50" width="6" height="5" rx="1" fill="#86efac" stroke="#374151" stroke-width="0.4" opacity="0.4"/>
  <rect x="92" y="56" width="7" height="4" rx="1" fill="#86efac" stroke="#374151" stroke-width="0.4" opacity="0.4"/>
</svg>
