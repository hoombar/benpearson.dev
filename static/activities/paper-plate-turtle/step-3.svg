<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Complete turtle (hero) -->
  <!-- Shell -->
  <ellipse cx="54" cy="54" rx="36" ry="28" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <!-- Shell pattern -->
  <polygon points="54,36 62,40 62,48 54,52 46,48 46,40" fill="#16a34a" stroke="#374151" stroke-width="0.6"/>
  <polygon points="42,44 46,40 46,48 42,52 38,48 38,44" fill="#86efac" stroke="#374151" stroke-width="0.5"/>
  <polygon points="66,44 70,40 70,48 66,52 62,48 62,40" fill="#86efac" stroke="#374151" stroke-width="0.5"/>
  <polygon points="54,52 62,48 62,56 54,60 46,56 46,48" fill="#4ade80" stroke="#374151" stroke-width="0.5"/>

  <!-- Legs -->
  <rect x="22" y="36" width="10" height="16" rx="5" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
  <rect x="78" y="36" width="10" height="16" rx="5" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
  <rect x="24" y="60" width="10" height="16" rx="5" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
  <rect x="76" y="60" width="10" height="16" rx="5" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>

  <!-- Head -->
  <ellipse cx="54" cy="22" rx="12" ry="10" fill="#22c55e" stroke="#374151" stroke-width="1"/>

  <!-- Googly eyes -->
  <circle cx="49" cy="19" r="4" fill="white" stroke="#374151" stroke-width="0.8"/>
  <circle cx="49" cy="20" r="2" fill="#374151"/>
  <circle cx="59" cy="19" r="4" fill="white" stroke="#374151" stroke-width="0.8"/>
  <circle cx="59" cy="20" r="2" fill="#374151"/>

  <!-- Happy mouth -->
  <path d="M49,26 Q54,30 59,26" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Nostrils -->
  <circle cx="52" cy="22" r="0.8" fill="#374151"/>
  <circle cx="56" cy="22" r="0.8" fill="#374151"/>

  <!-- Tail -->
  <polygon points="54,84 58,90 50,90" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>

  <!-- Marker drawing details -->
  <g transform="translate(90, 14)">
    <rect x="0" y="0" width="8" height="26" rx="2" fill="#8b5cf6" stroke="#374151" stroke-width="0.8"/>
    <rect x="0" y="22" width="8" height="4" rx="1" fill="#6d28d9" stroke="#374151" stroke-width="0.5"/>
    <polygon points="2,26 6,26 4,30" fill="#374151"/>
  </g>

  <!-- Hand adding face details -->
  <g transform="translate(98, 8)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Spots on legs (drawn details) -->
  <circle cx="27" cy="42" r="1.5" fill="#16a34a" stroke="none"/>
  <circle cx="83" cy="42" r="1.5" fill="#16a34a" stroke="none"/>
  <circle cx="29" cy="66" r="1.5" fill="#16a34a" stroke="none"/>
  <circle cx="81" cy="66" r="1.5" fill="#16a34a" stroke="none"/>
</svg>
