<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate shell (hero, seen from above/slightly tilted) -->
  <ellipse cx="54" cy="50" rx="36" ry="28" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <!-- Shell pattern -->
  <polygon points="54,32 62,36 62,44 54,48 46,44 46,36" fill="#16a34a" stroke="#374151" stroke-width="0.6"/>
  <polygon points="54,48 62,44 62,52 54,56 46,52 46,44" fill="#4ade80" stroke="#374151" stroke-width="0.5"/>

  <!-- Legs attached underneath, poking out -->
  <!-- Front left -->
  <rect x="22" y="32" width="10" height="16" rx="5" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
  <!-- Front right -->
  <rect x="78" y="32" width="10" height="16" rx="5" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
  <!-- Back left -->
  <rect x="24" y="56" width="10" height="16" rx="5" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
  <!-- Back right -->
  <rect x="76" y="56" width="10" height="16" rx="5" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>

  <!-- Head poking out front -->
  <ellipse cx="54" cy="18" rx="10" ry="8" fill="#22c55e" stroke="#374151" stroke-width="1"/>

  <!-- Tail poking out back -->
  <polygon points="54,80 58,86 50,86" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>

  <!-- Glue bottle -->
  <g transform="translate(94, 20)">
    <rect x="0" y="8" width="14" height="22" rx="3" fill="white" stroke="#374151" stroke-width="1"/>
    <rect x="3" y="0" width="8" height="10" rx="2" fill="#f97316" stroke="#374151" stroke-width="0.8"/>
    <rect x="5" y="-3" width="4" height="4" rx="1" fill="#f97316" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Arrow showing leg being glued under plate -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M96,52 Q92,50 88,48" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Hand pressing leg into place -->
  <g transform="translate(86, 56)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Glue dots visible at attachment points -->
  <circle cx="28" cy="40" r="1.5" fill="#f5f5f4" stroke="#374151" stroke-width="0.3" opacity="0.6"/>
  <circle cx="82" cy="40" r="1.5" fill="#f5f5f4" stroke="#374151" stroke-width="0.3" opacity="0.6"/>
</svg>
