<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Foil riverbed (hero) -->
  <g transform="translate(60, 60) rotate(30)">
    <path d="M-60,-15 L60,-15 L60,15 L-60,15 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Flowing water -->
    <path d="M-60,-10 Q0,-5 60,-10 L60,10 Q0,15 -60,10 Z" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <!-- Water sparkles/ripples -->
    <line x1="-40" y1="0" x2="-20" y2="0" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="10" y1="5" x2="30" y2="5" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Racing toy -->
    <g transform="translate(20, 0) rotate(-30)">
      <circle cx="0" cy="0" r="8" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>
      <path d="M-4,-4 L4,-4 M-4,4 L4,4" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Water jug pouring -->
  <g transform="translate(20, 30) rotate(45)">
    <rect x="-10" y="-15" width="20" height="30" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <path d="M10,-10 Q20,-20 30,-10" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="2,4" stroke-linecap="round"/>
  </g>

  <!-- Motion lines -->
  <path d="M80,80 L100,90" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>