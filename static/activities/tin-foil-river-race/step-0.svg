<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Foil unrolling (hero) -->
  <g transform="translate(60, 60) rotate(-15)">
    <!-- Unrolled section -->
    <path d="M-40,-20 L20,-20 L20,20 L-40,20 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <!-- Folded walls -->
    <path d="M-40,-20 L20,-20 L20,-12 L-40,-12 Z" fill="#9ca3af" stroke="#374151" stroke-width="1.5" opacity="0.6"/>
    <path d="M-40,12 L20,12 L20,20 L-40,20 Z" fill="#9ca3af" stroke="#374151" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Spool part -->
    <ellipse cx="20" cy="0" rx="6" ry="20" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  </g>

  <!-- Action arrow for unrolling -->
  <path d="M70,30 Q90,40 80,60" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>