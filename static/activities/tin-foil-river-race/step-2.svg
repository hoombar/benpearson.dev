<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Foil channel (hero) -->
  <g transform="translate(60, 60) rotate(20)">
    <path d="M-50,-15 L50,-15 L50,15 L-50,15 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Stone under the foil creating a bump -->
    <path d="M-10,0 Q0,-10 10,0 Z" fill="#9ca3af" stroke="#374151" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Actual stone being placed -->
    <path d="M20,5 Q25,-5 30,5 Q28,15 22,12 Z" fill="#4b5563" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Hand/Action placing stone -->
  <path d="M90,40 Q80,50 85,65" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>