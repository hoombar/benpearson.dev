<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Bottle 1 — blue "The Raindrop" -->
  <rect x="8" y="35" width="22" height="58" rx="6" fill="#3b82f6" stroke="#374151" stroke-width="2"/>
  <rect x="12" y="26" width="14" height="13" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  <rect x="13" y="22" width="12" height="6" rx="2" fill="#60a5fa" stroke="#374151" stroke-width="1"/>
  <!-- Rice visible inside -->
  <rect x="11" y="72" width="16" height="18" rx="4" fill="#bfdbfe" stroke="none"/>
  <line x1="15" y1="78" x2="16" y2="76" stroke="#fef3c7" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="19" y1="80" x2="20" y2="78" stroke="#fef3c7" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="23" y1="76" x2="24" y2="74" stroke="#fef3c7" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Star sticker -->
  <path d="M19,50 L20,46 L21,50 L25,50 L22,52 L23,56 L20,54 L17,56 L18,52 L15,50 Z"
        fill="#f59e0b" stroke="#374151" stroke-width="0.5"/>

  <!-- Bottle 2 — red "The Thunder" -->
  <rect x="38" y="35" width="22" height="58" rx="6" fill="#ef4444" stroke="#374151" stroke-width="2"/>
  <rect x="42" y="26" width="14" height="13" rx="3" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <rect x="43" y="22" width="12" height="6" rx="2" fill="#f87171" stroke="#374151" stroke-width="1"/>
  <!-- Pasta visible inside -->
  <rect x="41" y="74" width="5" height="9" rx="2" fill="#fca5a5" stroke="#374151" stroke-width="0.4"/>
  <rect x="47" y="76" width="5" height="8" rx="2" fill="#fca5a5" stroke="#374151" stroke-width="0.4"/>
  <rect x="53" y="74" width="4" height="9" rx="2" fill="#fca5a5" stroke="#374151" stroke-width="0.4"/>
  <!-- Lightning bolt sticker -->
  <path d="M50,46 L47,52 L50,52 L48,58 L54,50 L51,50 L53,46 Z"
        fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>

  <!-- Bottle 3 — green "The Heartbeat" -->
  <rect x="68" y="35" width="22" height="58" rx="6" fill="#22c55e" stroke="#374151" stroke-width="2"/>
  <rect x="72" y="26" width="14" height="13" rx="3" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <rect x="73" y="22" width="12" height="6" rx="2" fill="#4ade80" stroke="#374151" stroke-width="1"/>
  <!-- Lentils visible inside -->
  <circle cx="74" cy="84" r="1.5" fill="#86efac" stroke="#374151" stroke-width="0.3"/>
  <circle cx="78" cy="82" r="1.5" fill="#bbf7d0" stroke="#374151" stroke-width="0.3"/>
  <circle cx="82" cy="84" r="1.5" fill="#86efac" stroke="#374151" stroke-width="0.3"/>
  <circle cx="76" cy="78" r="1.5" fill="#bbf7d0" stroke="#374151" stroke-width="0.3"/>
  <circle cx="80" cy="78" r="1.5" fill="#86efac" stroke="#374151" stroke-width="0.3"/>
  <!-- Heart sticker -->
  <path d="M79,48 Q76,44 76,48 Q76,52 79,55 Q82,52 82,48 Q82,44 79,48 Z"
        fill="#fca5a5" stroke="#374151" stroke-width="0.5"/>

  <!-- Paintbrush -->
  <line x1="108" y1="18" x2="100" y2="42" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="97" y="42" width="6" height="5" rx="1" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>

  <!-- Paint pot -->
  <rect x="96" y="60" width="16" height="20" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <rect x="98" y="64" width="12" height="14" rx="2" fill="#ef4444" stroke="none"/>
</svg>