<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Bottle 1 (filled with rice — small white grains visible) -->
  <rect x="10" y="40" width="18" height="55" rx="5" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <rect x="13" y="32" width="12" height="12" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <!-- Cap -->
  <rect x="14" y="28" width="10" height="6" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>
  <!-- Rice inside (bottom third) -->
  <rect x="12" y="72" width="14" height="20" rx="3" fill="#fef3c7" stroke="none"/>
  <line x1="16" y1="78" x2="17" y2="76" stroke="#d97706" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="20" y1="80" x2="21" y2="78" stroke="#d97706" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="18" y1="84" x2="19" y2="82" stroke="#d97706" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="22" y1="76" x2="23" y2="74" stroke="#d97706" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Bottle 2 (filled with pasta — yellow tubes) -->
  <rect x="36" y="40" width="18" height="55" rx="5" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <rect x="39" y="32" width="12" height="12" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <rect x="40" y="28" width="10" height="6" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>
  <!-- Pasta inside -->
  <rect x="39" y="74" width="6" height="10" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
  <rect x="46" y="76" width="5" height="9" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
  <rect x="42" y="82" width="6" height="8" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>

  <!-- Bottle 3 (filled with lentils — green dots) -->
  <rect x="62" y="40" width="18" height="55" rx="5" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <rect x="65" y="32" width="12" height="12" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <rect x="66" y="28" width="10" height="6" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>
  <!-- Lentils inside -->
  <circle cx="67" cy="86" r="1.5" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
  <circle cx="71" cy="84" r="1.5" fill="#16a34a" stroke="#374151" stroke-width="0.4"/>
  <circle cx="75" cy="86" r="1.5" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
  <circle cx="69" cy="80" r="1.5" fill="#16a34a" stroke="#374151" stroke-width="0.4"/>
  <circle cx="73" cy="80" r="1.5" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
  <circle cx="71" cy="76" r="1.5" fill="#16a34a" stroke="#374151" stroke-width="0.4"/>

  <!-- Tape roll nearby -->
  <circle cx="100" cy="82" r="10" fill="#fde68a" stroke="#374151" stroke-width="1.2"/>
  <circle cx="100" cy="82" r="4" fill="#fef3c7" stroke="#374151" stroke-width="0.8"/>

  <!-- Tape strip on caps -->
  <rect x="13" y="27" width="12" height="3" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5" opacity="0.8"/>
  <rect x="39" y="27" width="12" height="3" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5" opacity="0.8"/>
  <rect x="65" y="27" width="12" height="3" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5" opacity="0.8"/>

  <!-- Pouring arrow from a scoop into bottle 1 -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M28,18 Q22,14 16,22" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Small scoop -->
  <path d="M28,12 Q32,8 36,12 L36,18 Q32,22 28,18 Z" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <!-- Grains falling -->
  <circle cx="18" cy="18" r="0.8" fill="#d97706" stroke="none"/>
  <circle cx="20" cy="16" r="0.8" fill="#d97706" stroke="none"/>
  <circle cx="17" cy="20" r="0.8" fill="#d97706" stroke="none"/>
</svg>