<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Boat hull -->
  <rect x="22" y="82" width="56" height="5" rx="2" fill="#f5deb3" stroke="#374151" stroke-width="0.8"/>
  <rect x="26" y="72" width="10" height="12" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.6"/>
  <rect x="45" y="72" width="10" height="12" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.6"/>
  <rect x="64" y="72" width="10" height="12" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.6"/>

  <!-- Mast -->
  <rect x="48" y="18" width="5" height="56" rx="1.5" fill="#f5deb3" stroke="#374151" stroke-width="1"/>

  <!-- Paper sail (hero — triangular) -->
  <polygon points="53,22 53,64 90,44" fill="#60a5fa" stroke="#374151" stroke-width="1.2"/>
  <!-- Sail decoration stripes -->
  <line x1="53" y1="36" x2="76" y2="36" stroke="#3b82f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="53" y1="50" x2="68" y2="50" stroke="#3b82f6" stroke-width="1" stroke-linecap="round"/>

  <!-- Holes where mast threads through -->
  <circle cx="53" cy="24" r="1" fill="#374151"/>
  <circle cx="53" cy="62" r="1" fill="#374151"/>

  <!-- Marker for decorating -->
  <g transform="translate(92, 22) rotate(15)">
    <rect x="0" y="-2.5" width="22" height="5" rx="2" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
    <rect x="-3" y="-3" width="4" height="6" rx="1" fill="#374151"/>
  </g>

  <!-- Scissors -->
  <g transform="translate(92, 68) rotate(-10)">
    <path d="M0,0 L12,4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L12,-4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.2" fill="#374151"/>
    <ellipse cx="15" cy="5" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1"/>
    <ellipse cx="15" cy="-5" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1"/>
  </g>
</svg>
