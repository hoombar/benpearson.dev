<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Hull assembled (side view) -->
  <!-- Popsicle stick base -->
  <rect x="22" y="72" width="56" height="5" rx="2" fill="#f5deb3" stroke="#374151" stroke-width="1"/>

  <!-- Three clothespins clipped on -->
  <rect x="26" y="60" width="10" height="14" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.7"/>
  <rect x="27" y="66" width="8" height="3" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="0.4"/>

  <rect x="45" y="60" width="10" height="14" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.7"/>
  <rect x="46" y="66" width="8" height="3" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="0.4"/>

  <rect x="64" y="60" width="10" height="14" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.7"/>
  <rect x="65" y="66" width="8" height="3" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="0.4"/>

  <!-- Mast (vertical popsicle stick) -->
  <rect x="48" y="10" width="5" height="52" rx="1.5" fill="#f5deb3" stroke="#374151" stroke-width="1.2"/>

  <!-- Hand pushing mast down -->
  <g transform="translate(40, 4)">
    <rect x="0" y="0" width="12" height="18" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrow showing insertion -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="58" y1="34" x2="58" y2="44" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- PVA glue bottle -->
  <g transform="translate(86, 44)">
    <rect x="0" y="8" width="14" height="20" rx="3" fill="#f0f9ff" stroke="#374151" stroke-width="0.8"/>
    <rect x="3" y="0" width="8" height="10" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="0.6"/>
    <circle cx="7" cy="0" r="2" fill="#f97316" stroke="#374151" stroke-width="0.5"/>
  </g>
</svg>
