<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Popsicle stick base (horizontal) -->
  <rect x="18" y="62" width="64" height="6" rx="2" fill="#f5deb3" stroke="#374151" stroke-width="1.2"/>

  <!-- Clothespin 1 (left) -->
  <g transform="translate(22, 42)">
    <rect x="0" y="0" width="6" height="20" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.8"/>
    <rect x="6" y="0" width="6" height="20" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.8"/>
    <rect x="1" y="8" width="10" height="4" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="0.5"/>
    <!-- Gripping end below -->
    <line x1="2" y1="20" x2="2" y2="28" stroke="#f5deb3" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="20" x2="10" y2="28" stroke="#f5deb3" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Clothespin 2 (centre) -->
  <g transform="translate(44, 42)">
    <rect x="0" y="0" width="6" height="20" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.8"/>
    <rect x="6" y="0" width="6" height="20" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.8"/>
    <rect x="1" y="8" width="10" height="4" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="0.5"/>
    <line x1="2" y1="20" x2="2" y2="28" stroke="#f5deb3" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="20" x2="10" y2="28" stroke="#f5deb3" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Clothespin 3 (right) -->
  <g transform="translate(66, 42)">
    <rect x="0" y="0" width="6" height="20" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.8"/>
    <rect x="6" y="0" width="6" height="20" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.8"/>
    <rect x="1" y="8" width="10" height="4" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="0.5"/>
    <line x1="2" y1="20" x2="2" y2="28" stroke="#f5deb3" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="20" x2="10" y2="28" stroke="#f5deb3" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Hand clipping clothespin -->
  <g transform="translate(80, 36)">
    <rect x="0" y="0" width="14" height="22" rx="7" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="16" y="4" width="10" height="16" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrow showing clip direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="86" y1="56" x2="80" y2="58" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
