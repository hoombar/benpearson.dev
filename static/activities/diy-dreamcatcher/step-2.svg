<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Table Background -->
  <rect x="0" y="0" width="120" height="120" fill="#fef3c7" />

  <!-- Paper Plate Hoop -->
  <circle cx="60" cy="55" r="40" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <circle cx="60" cy="55" r="28" fill="#fef3c7" stroke="#374151" stroke-width="2" />

  <!-- Holes -->
  <circle cx="60" cy="20" r="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5" />
  <circle cx="85" cy="30" r="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5" />
  <circle cx="95" cy="55" r="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5" />
  <circle cx="85" cy="80" r="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5" />
  <circle cx="60" cy="90" r="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5" />
  <circle cx="35" cy="80" r="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5" />
  <circle cx="25" cy="55" r="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5" />
  <circle cx="35" cy="30" r="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5" />

  <!-- String weaving (already done) -->
  <path d="M60 20 L85 80 L25 55 L85 30 L35 80" fill="none" stroke="#fca5a5" stroke-width="2" />

  <!-- String in motion -->
  <path d="M35 80 L50 95" fill="none" stroke="#fca5a5" stroke-width="2" />
  <path d="M50 95 Q65 110 80 100" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr)" />

  <!-- Ball of yarn/string -->
  <g transform="translate(90, 100)">
    <circle cx="0" cy="0" r="10" fill="#fca5a5" stroke="#374151" stroke-width="2" />
    <path d="M-6 -4 Q0 -8 6 -2" fill="none" stroke="#374151" stroke-width="1.5" />
    <path d="M-8 2 Q-2 -2 4 6" fill="none" stroke="#374151" stroke-width="1.5" />
    <path d="M-4 6 Q2 10 8 2" fill="none" stroke="#374151" stroke-width="1.5" />
  </g>
</svg>