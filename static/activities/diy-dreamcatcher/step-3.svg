<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Table Background -->
  <rect x="0" y="0" width="120" height="120" fill="#fef3c7" />

  <!-- Paper Plate Hoop -->
  <circle cx="60" cy="55" r="40" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <circle cx="60" cy="55" r="28" fill="#fef3c7" stroke="#374151" stroke-width="2" />

  <!-- String weaving (complex web) -->
  <path d="M60 20 L85 80 L25 55 L85 30 L35 80 L60 90 L85 55 L35 30 L60 20" fill="none" stroke="#fca5a5" stroke-width="2" />

  <!-- One loose string end extending out -->
  <path d="M35 30 L20 15" fill="none" stroke="#fca5a5" stroke-width="2" />

  <!-- Tube pasta on string -->
  <g transform="translate(30, 25) rotate(45)">
    <!-- Back opening -->
    <ellipse cx="-8" cy="0" rx="3" ry="5" fill="#d97706" stroke="#374151" stroke-width="1.5" />
    <!-- Tube body -->
    <path d="M-8 -5 L8 -5 A3 5 0 0 1 8 5 L-8 5 Z" fill="#fbbf24" stroke="#374151" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Front opening -->
    <ellipse cx="8" cy="0" rx="3" ry="5" fill="#fde68a" stroke="#374151" stroke-width="1.5" />
  </g>

  <!-- Motion arrow showing pasta sliding down string -->
  <path d="M20 15 L26 21" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)" />

</svg>