<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  
  <!-- Table Background -->
  <rect x="0" y="0" width="120" height="120" fill="#fef3c7" />
  
  <!-- Paper Plate Hoop -->
  <circle cx="60" cy="60" r="40" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <circle cx="60" cy="60" r="28" fill="#fef3c7" stroke="#374151" stroke-width="2" stroke-dasharray="4,4" />
  
  <!-- Holes in the hoop -->
  <circle cx="60" cy="25" r="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5" />
  <circle cx="85" cy="35" r="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5" />
  <circle cx="95" cy="60" r="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5" />
  <circle cx="85" cy="85" r="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5" />
  <circle cx="60" cy="95" r="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5" />
  
  <!-- Scissors cutting the center -->
  <g transform="translate(60, 60) rotate(-45)">
    <line x1="-10" y1="0" x2="16" y2="0" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-10" y1="0" x2="14" y2="4" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-14" cy="-4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <circle cx="-14" cy="4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  </g>

  <!-- Hole Punch Tool -->
  <g transform="translate(26, 85) rotate(30)">
    <!-- Base -->
    <rect x="-10" y="-4" width="20" height="8" rx="2" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
    <!-- Handle -->
    <path d="M-8,-4 Q0,-12 8,-4" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Punch pin -->
    <line x1="6" y1="-4" x2="6" y2="0" stroke="#374151" stroke-width="2"/>
  </g>

  <!-- Motion arrow for hole punch -->
  <path d="M15 75 Q20 60 25 60" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

</svg>