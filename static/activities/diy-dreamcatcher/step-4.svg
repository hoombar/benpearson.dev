<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall Background -->
  <rect x="0" y="0" width="120" height="120" fill="#f3f4f6" />
  
  <!-- Wall Peg -->
  <circle cx="60" cy="15" r="4" fill="#d97706" stroke="#374151" stroke-width="2" />
  
  <!-- Hanging string -->
  <path d="M60 15 L60 25" fill="none" stroke="#fca5a5" stroke-width="2" />

  <!-- Paper Plate Hoop -->
  <circle cx="60" cy="50" r="25" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <circle cx="60" cy="50" r="18" fill="#f3f4f6" stroke="#374151" stroke-width="2" />

  <!-- String weaving (web) -->
  <path d="M60 32 L75 60 L45 45 L75 45 L45 60 L60 32" fill="none" stroke="#fca5a5" stroke-width="1.5" />
  
  <!-- Some pasta in the web -->
  <g transform="translate(68, 55) rotate(60)">
    <path d="M-4 -3 L4 -3 A2 3 0 0 1 4 3 L-4 3 Z" fill="#fbbf24" stroke="#374151" stroke-width="1" />
  </g>
  <g transform="translate(52, 45) rotate(-30)">
    <path d="M-4 -3 L4 -3 A2 3 0 0 1 4 3 L-4 3 Z" fill="#fbbf24" stroke="#374151" stroke-width="1" />
  </g>

  <!-- Dangling Tail 1 (Left) -->
  <path d="M45 68 L40 90" fill="none" stroke="#fca5a5" stroke-width="1.5" />
  <!-- Pasta -->
  <g transform="translate(42.5, 79) rotate(20)">
    <path d="M-4 -3 L4 -3 A2 3 0 0 1 4 3 L-4 3 Z" fill="#fbbf24" stroke="#374151" stroke-width="1" />
  </g>
  <!-- Leaf -->
  <g transform="translate(40, 95) rotate(15)">
    <path d="M0 -8 Q8 -4 0 8 Q-8 -4 0 -8 Z" fill="#4ade80" stroke="#374151" stroke-width="1.5" stroke-linejoin="round" />
    <line x1="0" y1="-8" x2="0" y2="6" stroke="#374151" stroke-width="1" />
  </g>

  <!-- Dangling Tail 2 (Center) -->
  <path d="M60 75 L60 105" fill="none" stroke="#fca5a5" stroke-width="1.5" />
  <!-- Pasta -->
  <g transform="translate(60, 85) rotate(90)">
    <path d="M-4 -3 L4 -3 A2 3 0 0 1 4 3 L-4 3 Z" fill="#fbbf24" stroke="#374151" stroke-width="1" />
  </g>
  <g transform="translate(60, 95) rotate(90)">
    <path d="M-4 -3 L4 -3 A2 3 0 0 1 4 3 L-4 3 Z" fill="#fbbf24" stroke="#374151" stroke-width="1" />
  </g>
  <!-- Leaf -->
  <g transform="translate(60, 110) rotate(0)">
    <path d="M0 -8 Q8 -4 0 8 Q-8 -4 0 -8 Z" fill="#fb923c" stroke="#374151" stroke-width="1.5" stroke-linejoin="round" />
    <line x1="0" y1="-8" x2="0" y2="6" stroke="#374151" stroke-width="1" />
  </g>

  <!-- Dangling Tail 3 (Right) -->
  <path d="M75 68 L80 90" fill="none" stroke="#fca5a5" stroke-width="1.5" />
  <!-- Pasta -->
  <g transform="translate(77.5, 79) rotate(-20)">
    <path d="M-4 -3 L4 -3 A2 3 0 0 1 4 3 L-4 3 Z" fill="#fbbf24" stroke="#374151" stroke-width="1" />
  </g>
  <!-- Leaf -->
  <g transform="translate(80, 95) rotate(-15)">
    <path d="M0 -8 Q8 -4 0 8 Q-8 -4 0 -8 Z" fill="#fde047" stroke="#374151" stroke-width="1.5" stroke-linejoin="round" />
    <line x1="0" y1="-8" x2="0" y2="6" stroke="#374151" stroke-width="1" />
  </g>
  
  <!-- Sparkles -->
  <path d="M25 40 L28 45 L33 45 L29 48 L30 53 L25 50 L20 53 L21 48 L17 45 L22 45 Z" fill="#fef08a" stroke="#374151" stroke-width="1" stroke-linejoin="round"/>
  <path d="M95 30 L97 33 L100 33 L98 35 L99 38 L95 36 L91 38 L92 35 L90 33 L93 33 Z" fill="#fef08a" stroke="#374151" stroke-width="1" stroke-linejoin="round"/>

