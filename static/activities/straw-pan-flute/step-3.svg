<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="120" height="120" fill="#f3f4f6" stroke="none"/>

  <!-- Stick figure playing pan flute -->
  <!-- Head -->
  <circle cx="60" cy="26" r="8" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>
  <!-- Body -->
  <line x1="60" y1="34" x2="60" y2="72" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="60" y1="72" x2="50" y2="108" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="72" x2="70" y2="108" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arms holding flute to mouth -->
  <line x1="60" y1="46" x2="42" y2="34" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="46" x2="76" y2="34" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Pan flute at mouth (horizontal) -->
  <rect x="34" y="30" width="5" height="40" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="40" y="30" width="5" height="34" rx="2" fill="#ef4444" stroke="#374151" stroke-width="1"/>
  <rect x="46" y="30" width="5" height="28" rx="2" fill="#22c55e" stroke="#374151" stroke-width="1"/>
  <rect x="52" y="30" width="5" height="22" rx="2" fill="#f59e0b" stroke="#374151" stroke-width="1"/>
  <rect x="58" y="30" width="5" height="18" rx="2" fill="#a855f7" stroke="#374151" stroke-width="1"/>
  <rect x="64" y="30" width="5" height="14" rx="2" fill="#ec4899" stroke="#374151" stroke-width="1"/>
  <!-- Tape strip -->
  <rect x="32" y="34" width="40" height="3" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.4" opacity="0.7"/>

  <!-- Musical notes floating -->
  <path d="M82,16 L82,8" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <circle cx="82" cy="16" r="2.5" fill="#3b82f6" stroke="#374151" stroke-width="0.5"/>

  <path d="M92,22 L92,14 L98,12 L98,18" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <circle cx="92" cy="22" r="2.5" fill="#ef4444" stroke="#374151" stroke-width="0.5"/>
  <circle cx="98" cy="18" r="2.5" fill="#ef4444" stroke="#374151" stroke-width="0.5"/>

  <path d="M28,12 L28,6" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <circle cx="28" cy="12" r="2" fill="#22c55e" stroke="#374151" stroke-width="0.5"/>

  <path d="M18,24 L18,18" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <circle cx="18" cy="24" r="2" fill="#f59e0b" stroke="#374151" stroke-width="0.5"/>

  <!-- Breath lines -->
  <line x1="34" y1="28" x2="30" y2="24" stroke="#93c5fd" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <line x1="36" y1="26" x2="32" y2="20" stroke="#93c5fd" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
</svg>