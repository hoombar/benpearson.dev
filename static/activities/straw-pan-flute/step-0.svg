<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Full-length straw (reference) -->
  <rect x="14" y="16" width="5" height="78" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>

  <!-- Straws being cut to different lengths -->
  <rect x="26" y="16" width="5" height="66" rx="2" fill="#ef4444" stroke="#374151" stroke-width="1.2"/>
  <rect x="38" y="16" width="5" height="54" rx="2" fill="#22c55e" stroke="#374151" stroke-width="1.2"/>
  <rect x="50" y="16" width="5" height="42" rx="2" fill="#f59e0b" stroke="#374151" stroke-width="1.2"/>
  <rect x="62" y="16" width="5" height="30" rx="2" fill="#a855f7" stroke="#374151" stroke-width="1.2"/>
  <rect x="74" y="16" width="5" height="20" rx="2" fill="#ec4899" stroke="#374151" stroke-width="1.2"/>

  <!-- Dashed staircase line showing the pattern -->
  <path d="M12,94 L19,94 L19,82 L31,82 L31,70 L43,70 L43,58 L55,58 L55,46 L67,46 L67,36 L79,36"
        fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- Scissors cutting a straw -->
  <g transform="translate(86,52) rotate(0)">
    <path d="M0,0 L-12,-3" stroke="#374151" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M0,0 L-12,3" stroke="#374151" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <ellipse cx="2" cy="-3" rx="4" ry="2.5" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="2" cy="3" rx="4" ry="2.5" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="1.2" fill="#374151" stroke="none"/>
  </g>

  <!-- Cut-off straw piece -->
  <rect x="88" y="56" width="5" height="14" rx="2" fill="#a855f7" stroke="#374151" stroke-width="0.8" opacity="0.5"/>

  <!-- Loose uncut straws waiting -->
  <rect x="100" y="30" width="4" height="64" rx="1.5" fill="#ec4899" stroke="#374151" stroke-width="0.6"/>
  <rect x="108" y="26" width="4" height="68" rx="1.5" fill="#f59e0b" stroke="#374151" stroke-width="0.6"/>
</svg>