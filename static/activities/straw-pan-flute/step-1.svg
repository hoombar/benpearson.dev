<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Pan flute — straws lined up, tops level, bottoms staggered -->
  <!-- Straw 1 (longest) -->
  <rect x="22" y="18" width="7" height="76" rx="2.5" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  <!-- Straw 2 -->
  <rect x="32" y="18" width="7" height="64" rx="2.5" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <!-- Straw 3 -->
  <rect x="42" y="18" width="7" height="54" rx="2.5" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <!-- Straw 4 -->
  <rect x="52" y="18" width="7" height="44" rx="2.5" fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>
  <!-- Straw 5 -->
  <rect x="62" y="18" width="7" height="36" rx="2.5" fill="#a855f7" stroke="#374151" stroke-width="1.5"/>
  <!-- Straw 6 -->
  <rect x="72" y="18" width="7" height="28" rx="2.5" fill="#ec4899" stroke="#374151" stroke-width="1.5"/>

  <!-- Tape strip across front (top third) -->
  <rect x="20" y="28" width="62" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.8" opacity="0.8"/>

  <!-- Second tape strip being applied to back (shown as dashed on front) -->
  <rect x="20" y="36" width="62" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.8" opacity="0.5" stroke-dasharray="3,2"/>

  <!-- Arrow showing tape application -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M96,30 Q88,30 84,30" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Tape roll -->
  <circle cx="104" cy="30" r="10" fill="#fde68a" stroke="#374151" stroke-width="1.2"/>
  <circle cx="104" cy="30" r="4" fill="#fef3c7" stroke="#374151" stroke-width="0.8"/>
</svg>