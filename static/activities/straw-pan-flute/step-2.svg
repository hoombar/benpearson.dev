<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Pan flute from step 1 -->
  <rect x="22" y="14" width="7" height="76" rx="2.5" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  <rect x="32" y="14" width="7" height="64" rx="2.5" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <rect x="42" y="14" width="7" height="54" rx="2.5" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <rect x="52" y="14" width="7" height="44" rx="2.5" fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>
  <rect x="62" y="14" width="7" height="36" rx="2.5" fill="#a855f7" stroke="#374151" stroke-width="1.5"/>
  <rect x="72" y="14" width="7" height="28" rx="2.5" fill="#ec4899" stroke="#374151" stroke-width="1.5"/>

  <!-- Tape across front -->
  <rect x="20" y="24" width="62" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6" opacity="0.8"/>

  <!-- Sealed bottoms (tape folded over) — highlighted -->
  <rect x="20" y="88" width="11" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.8"/>
  <rect x="30" y="76" width="11" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.8"/>
  <rect x="40" y="66" width="11" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.8"/>
  <rect x="50" y="56" width="11" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.8"/>
  <rect x="60" y="48" width="11" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.8"/>
  <rect x="70" y="40" width="11" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.8"/>

  <!-- Close-up detail bubble -->
  <circle cx="100" cy="72" r="16" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <!-- Straw end in detail -->
  <rect x="94" y="62" width="10" height="16" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <!-- Tape folded over bottom -->
  <path d="M94,76 L94,80 Q99,82 104,80 L104,76" fill="#fde68a" stroke="#374151" stroke-width="0.8"/>

  <!-- Arrow from detail to main -->
  <path d="M86,82 Q78,86 68,88" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Star sticker on flute -->
  <path d="M48,32 L49,29 L50,32 L53,32 L51,34 L52,37 L49,35 L46,37 L47,34 L44,32 Z"
        fill="#f59e0b" stroke="#374151" stroke-width="0.4"/>
</svg>