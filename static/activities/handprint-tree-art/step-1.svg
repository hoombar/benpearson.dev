<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Child's arm being painted brown (hero) -->
  <g transform="translate(14, 10)">
    <!-- Forearm (trunk) -->
    <rect x="22" y="40" width="20" height="56" rx="8" fill="#fcd9b6" stroke="#374151" stroke-width="1"/>
    <!-- Brown paint being applied -->
    <rect x="22" y="40" width="20" height="56" rx="8" fill="#92400e" stroke="#374151" stroke-width="1" opacity="0.8"/>

    <!-- Hand with spread fingers -->
    <!-- Palm -->
    <ellipse cx="32" cy="38" rx="16" ry="12" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="32" cy="38" rx="16" ry="12" fill="#92400e" stroke="#374151" stroke-width="0.8" opacity="0.8"/>

    <!-- Fingers (spread) -->
    <rect x="8" y="14" width="7" height="22" rx="3" fill="#92400e" stroke="#374151" stroke-width="0.6" transform="rotate(-20, 12, 26)"/>
    <rect x="18" y="8" width="7" height="26" rx="3" fill="#92400e" stroke="#374151" stroke-width="0.6" transform="rotate(-8, 22, 20)"/>
    <rect x="28" y="6" width="7" height="28" rx="3" fill="#92400e" stroke="#374151" stroke-width="0.6"/>
    <rect x="38" y="8" width="7" height="26" rx="3" fill="#92400e" stroke="#374151" stroke-width="0.6" transform="rotate(8, 42, 20)"/>
    <rect x="46" y="16" width="7" height="20" rx="3" fill="#92400e" stroke="#374151" stroke-width="0.6" transform="rotate(25, 50, 26)"/>
  </g>

  <!-- Paintbrush applying paint to arm -->
  <g transform="translate(66, 54) rotate(10)">
    <rect x="0" y="-3" width="34" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#92400e" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pot -->
  <g transform="translate(90, 74)">
    <rect x="0" y="0" width="18" height="18" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
    <rect x="2" y="4" width="14" height="12" rx="1" fill="#92400e"/>
    <rect x="-1" y="-2" width="20" height="4" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.5"/>
  </g>
</svg>
