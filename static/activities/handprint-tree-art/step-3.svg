<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Completed handprint tree with fingerprint leaves (hero) -->
  <rect x="10" y="4" width="80" height="88" rx="1" fill="white" stroke="#374151" stroke-width="1"/>

  <g transform="translate(30, 10)">
    <!-- Trunk -->
    <rect x="10" y="44" width="14" height="38" rx="5" fill="#92400e" opacity="0.85"/>
    <!-- Palm -->
    <ellipse cx="17" cy="42" rx="12" ry="8" fill="#92400e" opacity="0.85"/>
    <!-- Branch fingers -->
    <rect x="2" y="20" width="5" height="20" rx="2.5" fill="#92400e" opacity="0.85" transform="rotate(-18, 5, 30)"/>
    <rect x="9" y="14" width="5" height="24" rx="2.5" fill="#92400e" opacity="0.85" transform="rotate(-6, 12, 26)"/>
    <rect x="15" y="12" width="5" height="26" rx="2.5" fill="#92400e" opacity="0.85"/>
    <rect x="21" y="14" width="5" height="24" rx="2.5" fill="#92400e" opacity="0.85" transform="rotate(6, 24, 26)"/>
    <rect x="27" y="22" width="5" height="18" rx="2.5" fill="#92400e" opacity="0.85" transform="rotate(20, 30, 30)"/>

    <!-- Fingerprint leaves - greens -->
    <ellipse cx="0" cy="16" rx="3" ry="3.5" fill="#22c55e" opacity="0.8"/>
    <ellipse cx="6" cy="10" rx="3" ry="3.5" fill="#16a34a" opacity="0.8"/>
    <ellipse cx="14" cy="6" rx="3" ry="3.5" fill="#22c55e" opacity="0.8"/>
    <ellipse cx="22" cy="4" rx="3" ry="3.5" fill="#16a34a" opacity="0.8"/>
    <ellipse cx="30" cy="8" rx="3" ry="3.5" fill="#22c55e" opacity="0.8"/>
    <ellipse cx="36" cy="16" rx="3" ry="3.5" fill="#16a34a" opacity="0.8"/>

    <!-- Reds and oranges -->
    <ellipse cx="-4" cy="24" rx="3" ry="3.5" fill="#ef4444" opacity="0.8"/>
    <ellipse cx="10" cy="2" rx="3" ry="3.5" fill="#f97316" opacity="0.8"/>
    <ellipse cx="18" cy="-2" rx="3" ry="3.5" fill="#ef4444" opacity="0.8"/>
    <ellipse cx="26" cy="0" rx="3" ry="3.5" fill="#f97316" opacity="0.8"/>
    <ellipse cx="34" cy="6" rx="3" ry="3.5" fill="#eab308" opacity="0.8"/>
    <ellipse cx="38" cy="24" rx="3" ry="3.5" fill="#ef4444" opacity="0.8"/>

    <!-- More scattered leaves -->
    <ellipse cx="4" cy="4" rx="2.5" ry="3" fill="#eab308" opacity="0.7"/>
    <ellipse cx="28" cy="-4" rx="2.5" ry="3" fill="#22c55e" opacity="0.7"/>
    <ellipse cx="-2" cy="10" rx="2.5" ry="3" fill="#f97316" opacity="0.7"/>
    <ellipse cx="40" cy="12" rx="2.5" ry="3" fill="#eab308" opacity="0.7"/>

    <!-- Falling leaves -->
    <ellipse cx="4" cy="60" rx="2" ry="2.5" fill="#ef4444" opacity="0.6"/>
    <ellipse cx="30" cy="64" rx="2" ry="2.5" fill="#f97316" opacity="0.6"/>
    <ellipse cx="18" cy="68" rx="2" ry="2.5" fill="#eab308" opacity="0.6"/>

    <!-- Grass at base -->
    <line x1="-4" y1="80" x2="-4" y2="74" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="80" x2="2" y2="72" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="32" y1="80" x2="34" y2="74" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="36" y1="80" x2="36" y2="72" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Finger dipping in paint (small) -->
  <g transform="translate(96, 40)">
    <rect x="0" y="-4" width="6" height="16" rx="3" fill="#fcd9b6" stroke="#374151" stroke-width="0.5"/>
    <circle cx="3" cy="14" r="3" fill="#22c55e" stroke="#374151" stroke-width="0.3"/>
  </g>
</svg>
