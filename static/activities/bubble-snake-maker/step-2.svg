<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Shallow bowl -->
  <ellipse cx="60" cy="72" rx="38" ry="10" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <path d="M22,72 Q22,88 60,88 Q98,88 98,72" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>

  <!-- Soap solution in bowl -->
  <ellipse cx="60" cy="72" rx="34" ry="8" fill="#bfdbfe" stroke="none" opacity="0.6"/>
  <!-- Bubble reflections on surface -->
  <circle cx="48" cy="70" r="2" fill="none" stroke="#93c5fd" stroke-width="0.5" opacity="0.7"/>
  <circle cx="66" cy="71" r="1.5" fill="none" stroke="#93c5fd" stroke-width="0.5" opacity="0.7"/>
  <circle cx="56" cy="74" r="1" fill="none" stroke="#93c5fd" stroke-width="0.5" opacity="0.7"/>

  <!-- Washing-up liquid bottle -->
  <g transform="translate(14, 10)">
    <rect x="0" y="16" width="18" height="36" rx="3" fill="#4ade80" stroke="#374151" stroke-width="1.2"/>
    <rect x="4" y="6" width="10" height="12" rx="2" fill="#86efac" stroke="#374151" stroke-width="0.8"/>
    <!-- Nozzle -->
    <rect x="6" y="2" width="6" height="6" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Pouring stream from bottle to bowl -->
  <path d="M23,52 Q30,58 40,66" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,4" opacity="0.7"/>

  <!-- Water jug/cup -->
  <g transform="translate(82, 22)">
    <rect x="0" y="8" width="20" height="28" rx="2" fill="#e0f2fe" stroke="#374151" stroke-width="1.2" opacity="0.7"/>
    <!-- Handle -->
    <path d="M20,14 Q28,14 28,22 Q28,30 20,30" fill="none" stroke="#374151" stroke-width="1.2"/>
    <!-- Water inside -->
    <rect x="2" y="14" width="16" height="20" rx="1" fill="#93c5fd" stroke="none" opacity="0.5"/>
  </g>

  <!-- Spoon for stirring -->
  <g transform="translate(58, 36) rotate(20)">
    <rect x="-2" y="0" width="4" height="28" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="0" cy="30" rx="5" ry="3" fill="#d1d5db" stroke="#374151" stroke-width="0.8"/>
  </g>
</svg>
