<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Plastic bottle -->
  <g transform="translate(40, 14)">
    <!-- Bottle body -->
    <rect x="0" y="20" width="28" height="54" rx="4" fill="#bfdbfe" stroke="#374151" stroke-width="1.2" opacity="0.6"/>
    <!-- Bottle neck -->
    <rect x="8" y="4" width="12" height="18" rx="3" fill="#bfdbfe" stroke="#374151" stroke-width="1.2" opacity="0.6"/>
    <!-- Cap -->
    <rect x="7" y="0" width="14" height="6" rx="2" fill="#60a5fa" stroke="#374151" stroke-width="1"/>
    <!-- Bottle label area -->
    <rect x="2" y="36" width="24" height="16" rx="1" fill="#dbeafe" stroke="#374151" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Dashed cut line across bottom of bottle -->
  <line x1="36" y1="82" x2="72" y2="82" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" stroke-linecap="round"/>

  <!-- Scissors -->
  <g transform="translate(78, 72) rotate(15)">
    <!-- Blade 1 -->
    <path d="M0,0 L-20,6" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Blade 2 -->
    <path d="M0,0 L-20,-6" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Pivot -->
    <circle cx="0" cy="0" r="2" fill="#374151" stroke="none"/>
    <!-- Handle 1 -->
    <ellipse cx="6" cy="4" rx="6" ry="4" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <!-- Handle 2 -->
    <ellipse cx="6" cy="-4" rx="6" ry="4" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Arrow showing cut direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>
  <path d="M54,94 Q54,90 54,86" fill="none" stroke="#ef4444" stroke-width="1" marker-end="url(#arr)"/>
</svg>
