<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Surface / tray -->
  <rect x="8" y="88" width="104" height="8" rx="2" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- 5 coins laid out in a row, being counted -->
  <!-- Coin 1 -->
  <ellipse cx="22" cy="82" rx="9" ry="7" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
  <ellipse cx="22" cy="82" rx="5" ry="3.5" fill="none" stroke="#d97706" stroke-width="1"/>
  <!-- Coin 2 -->
  <ellipse cx="42" cy="82" rx="9" ry="7" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
  <ellipse cx="42" cy="82" rx="5" ry="3.5" fill="none" stroke="#d97706" stroke-width="1"/>
  <!-- Coin 3 (hero) -->
  <ellipse cx="62" cy="80" rx="11" ry="8" fill="#f59e0b" stroke="#374151" stroke-width="2.5"/>
  <ellipse cx="62" cy="80" rx="7" ry="4.5" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <!-- Coin 4 -->
  <ellipse cx="82" cy="82" rx="9" ry="7" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
  <ellipse cx="82" cy="82" rx="5" ry="3.5" fill="none" stroke="#d97706" stroke-width="1"/>
  <!-- Coin 5 -->
  <ellipse cx="100" cy="82" rx="9" ry="7" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
  <ellipse cx="100" cy="82" rx="5" ry="3.5" fill="none" stroke="#d97706" stroke-width="1"/>
  <!-- Counting marks above coins (tally lines) -->
  <line x1="14" y1="62" x2="14" y2="72" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="62" x2="18" y2="72" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="62" x2="34" y2="72" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="62" x2="38" y2="72" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="62" x2="54" y2="72" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="62" x2="58" y2="72" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="74" y1="62" x2="74" y2="72" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="62" x2="78" y2="72" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="94" y1="62" x2="94" y2="72" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="98" y1="62" x2="98" y2="72" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Melted ice puddle shape (residue) -->
  <ellipse cx="38" cy="106" rx="26" ry="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <!-- Sparkle lines on big coin -->
  <line x1="62" y1="66" x2="62" y2="60" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="68" x2="75" y2="64" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="68" x2="49" y2="64" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
</svg>
