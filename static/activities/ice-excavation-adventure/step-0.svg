<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Container (lunchbox shape) hero -->
  <rect x="18" y="62" width="84" height="46" rx="4" stroke="#374151" stroke-width="2.5" fill="#dbeafe"/>
  <rect x="18" y="62" width="84" height="12" rx="4" stroke="#374151" stroke-width="1.5" fill="#93c5fd"/>
  <!-- Blue water inside -->
  <rect x="20" y="74" width="80" height="32" fill="#3b82f6" opacity="0.3"/>
  <!-- Coin 1 - falling -->
  <ellipse cx="40" cy="46" rx="7" ry="5" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="40" cy="46" rx="4" ry="2.5" fill="none" stroke="#d97706" stroke-width="1"/>
  <!-- Coin 2 - falling -->
  <ellipse cx="65" cy="34" rx="7" ry="5" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="65" cy="34" rx="4" ry="2.5" fill="none" stroke="#d97706" stroke-width="1"/>
  <!-- Coin 3 - already in water -->
  <ellipse cx="78" cy="82" rx="6" ry="4" fill="#fbbf24" stroke="#374151" stroke-width="1.5" opacity="0.8"/>
  <!-- Arrows showing coins dropping down -->
  <line x1="40" y1="52" x2="40" y2="70" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <line x1="65" y1="40" x2="65" y2="70" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Food colouring bottle (top-left) -->
  <path d="M8,14 C8,4 16,4 16,14 L16,36 Q16,40 12,40 Q8,40 8,36 Z" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <rect x="11" y="10" width="2" height="6" rx="1" fill="#374151"/>
  <!-- Colour drops from bottle -->
  <line x1="12" y1="40" x2="20" y2="64" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,3"/>
  <circle cx="20" cy="67" r="2" fill="#ef4444"/>
  <!-- Water ripple lines in container -->
  <path d="M24 82 Q40 79 56 82 Q72 85 96 82" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M24 90 Q48 87 72 90 Q84 92 96 90" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.4"/>
</svg>
