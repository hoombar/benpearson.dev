<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Small cup (hero) -->
  <path d="M40,60 L80,60 L75,100 L45,100 Z" fill="#f3f4f6" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="60" cy="60" rx="20" ry="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Food colouring bottle -->
  <g transform="translate(30, 30) rotate(30)">
    <rect x="-8" y="-12" width="16" height="24" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
    <rect x="-8" y="12" width="16" height="6" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <!-- Drop falling -->
    <path d="M0,20 Q0,30 5,35 Q10,30 10,25 Z" fill="#3b82f6" stroke="none" transform="rotate(-30 0 20)"/>
  </g>

  <!-- Action arrow -->
  <path d="M25,50 Q35,60 45,65" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>