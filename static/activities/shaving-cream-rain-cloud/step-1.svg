<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Glass Jar -->
  <path d="M35,30 L35,100 C35,105 40,110 45,110 L75,110 C80,110 85,105 85,100 L85,30" fill="none" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Water inside -->
  <path d="M36,60 L36,100 C36,104 40,108 45,108 L75,108 C80,108 84,104 84,100 L84,60 Z" fill="#dbeafe" stroke="none" opacity="0.4"/>

  <!-- Shaving Cream Cloud (hero) -->
  <g transform="translate(60, 50)">
    <path d="M-25,10 Q-30,0 -20,-10 Q-15,-20 0,-20 Q15,-20 20,-10 Q30,0 25,10 Z" fill="#f9fafb" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="-10" cy="-5" r="8" fill="#f9fafb" stroke="none"/>
    <circle cx="10" cy="-5" r="8" fill="#f9fafb" stroke="none"/>
  </g>

  <!-- Shaving cream can -->
  <g transform="translate(90, 20) rotate(150)">
    <rect x="-8" y="-20" width="16" height="40" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <path d="M-8,20 L8,20 L6,25 L-6,25 Z" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <!-- Foam squirting out -->
    <path d="M0,25 Q0,35 10,45" fill="none" stroke="#f3f4f6" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Action arrow -->
  <path d="M95,45 Q85,55 75,55" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>