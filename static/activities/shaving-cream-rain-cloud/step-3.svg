<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Glass Jar -->
  <path d="M35,40 L35,100 C35,105 40,110 45,110 L75,110 C80,110 85,105 85,100 L85,40" fill="none" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Water and Swirls -->
  <path d="M36,70 L36,100 C36,104 40,108 45,108 L75,108 C80,108 84,104 84,100 L84,70 Z" fill="#dbeafe" stroke="none" opacity="0.4"/>
  <path d="M50,70 Q55,85 45,95 M65,75 Q60,90 70,100" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Shaving Cream Cloud -->
  <path d="M35,60 Q30,50 40,40 Q45,30 60,30 Q75,30 80,40 Q90,50 85,60 Z" fill="#f9fafb" stroke="#374151" stroke-width="2"/>

  <!-- Dropper (hero action) -->
  <g transform="translate(60, 20) rotate(0)">
    <!-- Bulb -->
    <path d="M-6,0 Q-10,-10 0,-15 Q10,-10 6,0 Z" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Stem -->
    <rect x="-2" y="0" width="4" height="20" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <!-- Blue drop -->
    <path d="M0,22 Q0,28 3,32 Q6,28 6,22 Z" fill="#3b82f6" stroke="none"/>
  </g>

  <!-- Action arrow -->
  <path d="M75,15 Q85,25 80,40" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>