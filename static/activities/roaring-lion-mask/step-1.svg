<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Flat paper strip (before curling) -->
  <rect x="8" y="20" width="50" height="8" rx="1" fill="#f97316" stroke="#374151" stroke-width="1.5"/>

  <!-- Arrow showing transformation -->
  <path d="M62,24 L72,24" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Curled paper strip (after curling, result) -->
  <path d="M80,20 Q92,14 96,22 Q100,30 90,28 Q80,26 86,34"
        fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>

  <!-- Pencil used for curling (below) -->
  <line x1="14" y1="50" x2="70" y2="44" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  <polygon points="10,51 8,54 14,50" fill="#374151" stroke="#374151" stroke-width="1"/>
  <!-- Paper wrapping around pencil -->
  <path d="M28,42 Q36,36 44,42 Q52,48 60,42"
        fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Curling arc arrow showing wrap motion -->
  <path d="M36,38 Q42,28 48,36" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Collection of already-curled strips (pile) -->
  <path d="M20,72 Q30,66 36,74 Q42,82 32,78"
        fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40,70 Q48,64 54,72 Q58,78 50,76"
        fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M56,68 Q64,62 68,70 Q72,78 64,74"
        fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M30,82 Q38,76 44,84 Q48,90 40,88"
        fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M50,80 Q58,74 62,82 Q66,88 58,86"
        fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M66,78 Q74,72 78,80 Q82,86 76,84"
        fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Scissors -->
  <g transform="translate(96, 68) rotate(20)">
    <line x1="0" y1="0" x2="12" y2="-2" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="3" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-3" cy="-3" r="3" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <circle cx="-3" cy="3" r="3" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  </g>
</svg>
