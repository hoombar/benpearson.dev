<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="95" width="110" height="12" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate (hero, large circle) -->
  <circle cx="60" cy="58" r="34" fill="#f59e0b" stroke="#374151" stroke-width="2.5"/>
  <!-- Plate rim -->
  <circle cx="60" cy="58" r="28" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Paint being applied (half-painted effect) -->
  <!-- Wet paint sheen on left half -->
  <path d="M26,58 Q26,30 60,24" fill="none" stroke="#fde68a" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Paintbrush painting the plate -->
  <line x1="90" y1="38" x2="72" y2="50" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <!-- Brush bristles -->
  <rect x="68" y="48" width="8" height="6" rx="1" fill="#f59e0b" stroke="#374151" stroke-width="1"/>
  <!-- Brush handle extends -->
  <line x1="90" y1="38" x2="105" y2="26" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>

  <!-- Paint pot (orange/yellow paint) -->
  <rect x="96" y="60" width="18" height="24" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <rect x="98" y="64" width="14" height="18" rx="2" fill="#f59e0b" stroke="none"/>
  <!-- Paint drip on side -->
  <path d="M114,68 Q116,72 114,76" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Second unpainted plate (below, for reference) -->
  <circle cx="22" cy="90" r="12" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="22" cy="90" r="9" fill="none" stroke="#e5e7eb" stroke-width="0.75" stroke-dasharray="2,2"/>
</svg>
