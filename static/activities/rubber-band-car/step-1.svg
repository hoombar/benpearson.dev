<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Car body with axles and wheels (side view, hero) -->
  <g transform="translate(14, 28)">
    <!-- Box body -->
    <rect x="10" y="0" width="60" height="28" rx="3" fill="#d4a574" stroke="#374151" stroke-width="1.5"/>

    <!-- Front axle (straw going through) -->
    <line x1="0" y1="24" x2="80" y2="24" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>

    <!-- Front wheels -->
    <circle cx="4" cy="24" r="10" fill="#d4a574" stroke="#374151" stroke-width="1.2"/>
    <circle cx="4" cy="24" r="2" fill="#374151" stroke="none"/>
    <circle cx="76" cy="24" r="10" fill="#d4a574" stroke="#374151" stroke-width="1.2"/>
    <circle cx="76" cy="24" r="2" fill="#374151" stroke="none"/>

    <!-- Rear axle -->
    <line x1="0" y1="48" x2="80" y2="48" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Rear wheels -->
    <circle cx="4" cy="48" r="10" fill="#d4a574" stroke="#374151" stroke-width="1.2"/>
    <circle cx="4" cy="48" r="2" fill="#374151" stroke="none"/>
    <circle cx="76" cy="48" r="10" fill="#d4a574" stroke="#374151" stroke-width="1.2"/>
    <circle cx="76" cy="48" r="2" fill="#374151" stroke="none"/>
  </g>

  <!-- Tape securing wheel -->
  <rect x="84" y="46" width="10" height="4" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.4"/>

  <!-- Arrow showing wheel spinning -->
  <path d="M100,68 Q108,72 104,80" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Spare cardboard wheel -->
  <circle cx="104" cy="28" r="8" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
  <circle cx="104" cy="28" r="1.5" fill="#374151" stroke="none"/>

  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
</svg>
