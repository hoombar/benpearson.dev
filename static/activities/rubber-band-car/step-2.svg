<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Car body (top-down view showing rubber band inside) -->
  <g transform="translate(16, 14)">
    <!-- Box outline -->
    <rect x="0" y="0" width="72" height="40" rx="3" fill="#d4a574" stroke="#374151" stroke-width="1.5"/>

    <!-- Front axle visible through box -->
    <line x1="-6" y1="10" x2="78" y2="10" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Rear axle -->
    <line x1="-6" y1="32" x2="78" y2="32" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rubber band stretched from rear axle to front hook -->
    <line x1="36" y1="32" x2="36" y2="6" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="32" x2="36" y2="6" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Notch in front wall where rubber band hooks -->
    <rect x="34" y="0" width="4" height="6" fill="#fef3c7" stroke="#374151" stroke-width="0.6"/>

    <!-- Rubber band wound around axle -->
    <path d="M32,32 Q36,28 40,32 Q36,36 32,32" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  </g>

  <!-- Wheels visible on sides -->
  <circle cx="26" cy="24" r="8" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
  <circle cx="26" cy="46" r="8" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
  <circle cx="78" cy="24" r="8" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
  <circle cx="78" cy="46" r="8" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>

  <!-- Hand winding the rear axle -->
  <g transform="translate(78, 58)">
    <rect x="0" y="0" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="12" y="2" width="9" height="16" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Winding arrow around rear axle -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <path d="M68,52 Q60,56 56,50" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Rubber bands -->
  <g transform="translate(8, 70)">
    <ellipse cx="14" cy="10" rx="12" ry="6" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <ellipse cx="14" cy="20" rx="12" ry="6" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
