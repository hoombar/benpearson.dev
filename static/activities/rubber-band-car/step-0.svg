<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Cardboard box (hero) -->
  <g transform="translate(18, 22)">
    <!-- Box body -->
    <rect x="0" y="0" width="60" height="32" rx="3" fill="#d4a574" stroke="#374151" stroke-width="1.5"/>
    <!-- Box top flap -->
    <path d="M0,0 Q30,-6 60,0" fill="#c2956e" stroke="#374151" stroke-width="1"/>
    <!-- Box texture -->
    <line x1="10" y1="8" x2="50" y2="8" stroke="#b5834f" stroke-width="0.5" opacity="0.4"/>
    <line x1="10" y1="16" x2="50" y2="16" stroke="#b5834f" stroke-width="0.5" opacity="0.4"/>
    <line x1="10" y1="24" x2="50" y2="24" stroke="#b5834f" stroke-width="0.5" opacity="0.4"/>

    <!-- Axle holes marked/poked -->
    <circle cx="12" cy="28" r="3" fill="#fef3c7" stroke="#374151" stroke-width="0.8"/>
    <circle cx="48" cy="28" r="3" fill="#fef3c7" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Scissors -->
  <g transform="translate(86, 30) rotate(20)">
    <path d="M0,0 L-16,5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,0 L-16,-5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#374151"/>
    <ellipse cx="5" cy="3.5" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <ellipse cx="5" cy="-3.5" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Arrow pointing to holes -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M22,66 Q26,58 28,54" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
  <path d="M72,66 Q70,58 66,54" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Cut line showing trimming -->
  <line x1="78" y1="26" x2="78" y2="50" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- Trimmed piece -->
  <rect x="82" y="70" width="20" height="20" rx="2" fill="#d4a574" stroke="#374151" stroke-width="0.6" opacity="0.4"/>
</svg>
