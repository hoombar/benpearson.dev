<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Floor surface -->
  <rect x="0" y="70" width="120" height="50" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>

  <!-- Car zooming across floor (side view) -->
  <g transform="translate(26, 32)">
    <!-- Box body -->
    <rect x="10" y="0" width="40" height="22" rx="3" fill="#d4a574" stroke="#374151" stroke-width="1.2"/>
    <!-- Racing stripe -->
    <line x1="12" y1="11" x2="48" y2="11" stroke="#ef4444" stroke-width="2"/>

    <!-- Front wheel -->
    <circle cx="16" cy="26" r="8" fill="#d4a574" stroke="#374151" stroke-width="1"/>
    <circle cx="16" cy="26" r="1.5" fill="#374151"/>
    <!-- Rear wheel -->
    <circle cx="44" cy="26" r="8" fill="#d4a574" stroke="#374151" stroke-width="1"/>
    <circle cx="44" cy="26" r="1.5" fill="#374151"/>

    <!-- Wheel spin lines -->
    <path d="M8,26 Q10,20 16,20" fill="none" stroke="#374151" stroke-width="0.5" opacity="0.4"/>
    <path d="M36,26 Q38,20 44,20" fill="none" stroke="#374151" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Motion/speed lines behind car -->
  <line x1="6" y1="40" x2="22" y2="40" stroke="#374151" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
  <line x1="2" y1="46" x2="24" y2="46" stroke="#374151" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="6" y1="52" x2="20" y2="52" stroke="#374151" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
  <line x1="10" y1="58" x2="24" y2="58" stroke="#374151" stroke-width="0.8" stroke-linecap="round" opacity="0.3"/>

  <!-- Direction arrow -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="82" y1="46" x2="102" y2="46" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Finish line -->
  <line x1="112" y1="70" x2="112" y2="116" stroke="#374151" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Hand that just released the car -->
  <g transform="translate(4, 24)">
    <rect x="0" y="0" width="8" height="16" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="10" y="2" width="7" height="14" rx="3.5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Dust puffs -->
  <circle cx="18" cy="62" r="3" fill="#d1d5db" stroke="none" opacity="0.3"/>
  <circle cx="12" cy="58" r="2" fill="#d1d5db" stroke="none" opacity="0.2"/>
  <circle cx="22" cy="66" r="2.5" fill="#d1d5db" stroke="none" opacity="0.2"/>
</svg>
