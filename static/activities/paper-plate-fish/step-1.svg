<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate with mouth cut out (hero) -->
  <!-- Plate body minus the wedge -->
  <path d="M72,24 A36,36 0 1,0 72,72 L48,48 Z" fill="#f5f5f4" stroke="#374151" stroke-width="1.5"/>
  <!-- Plate ridge -->
  <path d="M66,28 A28,28 0 1,0 66,68" fill="none" stroke="#374151" stroke-width="0.5" opacity="0.3"/>

  <!-- Mouth opening (V-shape) -->
  <line x1="72" y1="24" x2="48" y2="48" stroke="#374151" stroke-width="1.5"/>
  <line x1="48" y1="48" x2="72" y2="72" stroke="#374151" stroke-width="1.5"/>

  <!-- Tail piece being glued on left side -->
  <polygon points="12,30 12,66 -6,48" fill="#f5f5f4" stroke="#374151" stroke-width="1.2"/>

  <!-- Glue at attachment point -->
  <circle cx="12" cy="42" r="1.5" fill="white" stroke="#374151" stroke-width="0.3" opacity="0.6"/>
  <circle cx="12" cy="54" r="1.5" fill="white" stroke="#374151" stroke-width="0.3" opacity="0.6"/>

  <!-- Hand pressing tail onto plate -->
  <g transform="translate(2, 24)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrow showing tail being attached -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M6,20 Q8,28 10,34" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Glue bottle -->
  <g transform="translate(88, 24)">
    <rect x="0" y="8" width="14" height="22" rx="3" fill="white" stroke="#374151" stroke-width="1"/>
    <rect x="3" y="0" width="8" height="10" rx="2" fill="#f97316" stroke="#374151" stroke-width="0.8"/>
    <rect x="5" y="-3" width="4" height="4" rx="1" fill="#f97316" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Fish shape becoming clear! -->
  <!-- Eye position hint -->
  <circle cx="62" cy="40" r="2" fill="none" stroke="#d1d5db" stroke-width="0.5" stroke-dasharray="1,1"/>
</svg>
