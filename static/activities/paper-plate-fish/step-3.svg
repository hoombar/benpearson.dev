<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Ocean background -->
  <rect x="0" y="0" width="120" height="120" fill="#bfdbfe"/>

  <!-- Complete fish (hero) -->
  <!-- Body -->
  <path d="M82,32 A32,32 0 1,0 82,72 L62,52 Z" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>

  <!-- Tail -->
  <polygon points="22,34 22,70 4,52" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>

  <!-- Scale pattern -->
  <path d="M34,40 Q37,37 40,40" fill="none" stroke="#2563eb" stroke-width="0.8"/>
  <path d="M40,40 Q43,37 46,40" fill="none" stroke="#2563eb" stroke-width="0.8"/>
  <path d="M46,40 Q49,37 52,40" fill="none" stroke="#2563eb" stroke-width="0.8"/>
  <path d="M52,40 Q55,37 58,40" fill="none" stroke="#2563eb" stroke-width="0.8"/>
  <path d="M30,47 Q33,44 36,47" fill="none" stroke="#1d4ed8" stroke-width="0.8"/>
  <path d="M36,47 Q39,44 42,47" fill="none" stroke="#1d4ed8" stroke-width="0.8"/>
  <path d="M42,47 Q45,44 48,47" fill="none" stroke="#1d4ed8" stroke-width="0.8"/>
  <path d="M48,47 Q51,44 54,47" fill="none" stroke="#1d4ed8" stroke-width="0.8"/>
  <path d="M54,47 Q57,44 60,47" fill="none" stroke="#1d4ed8" stroke-width="0.8"/>
  <path d="M30,54 Q33,51 36,54" fill="none" stroke="#60a5fa" stroke-width="0.8"/>
  <path d="M36,54 Q39,51 42,54" fill="none" stroke="#60a5fa" stroke-width="0.8"/>
  <path d="M42,54 Q45,51 48,54" fill="none" stroke="#60a5fa" stroke-width="0.8"/>
  <path d="M48,54 Q51,51 54,54" fill="none" stroke="#60a5fa" stroke-width="0.8"/>
  <path d="M54,54 Q57,51 60,54" fill="none" stroke="#60a5fa" stroke-width="0.8"/>
  <path d="M34,61 Q37,58 40,61" fill="none" stroke="#93c5fd" stroke-width="0.8"/>
  <path d="M40,61 Q43,58 46,61" fill="none" stroke="#93c5fd" stroke-width="0.8"/>
  <path d="M46,61 Q49,58 52,61" fill="none" stroke="#93c5fd" stroke-width="0.8"/>

  <!-- Googly eye -->
  <circle cx="66" cy="44" r="5" fill="white" stroke="#374151" stroke-width="1"/>
  <circle cx="67" cy="45" r="2.5" fill="#374151"/>

  <!-- Smile -->
  <path d="M66,56 Q70,60 74,56" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Gill line -->
  <path d="M60,38 Q58,48 60,58" fill="none" stroke="#1d4ed8" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Tissue paper top fin -->
  <path d="M34,32 Q40,20 48,24 Q54,18 60,28 Q64,22 68,30" fill="#8b5cf6" stroke="#374151" stroke-width="0.6" opacity="0.6"/>

  <!-- Tissue paper bottom fin -->
  <path d="M34,72 Q40,82 48,78 Q54,84 60,74" fill="#22c55e" stroke="#374151" stroke-width="0.6" opacity="0.6"/>

  <!-- Bubbles -->
  <circle cx="88" cy="40" r="3" fill="none" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <circle cx="94" cy="32" r="2" fill="none" stroke="white" stroke-width="0.6" opacity="0.4"/>
  <circle cx="92" cy="44" r="1.5" fill="none" stroke="white" stroke-width="0.5" opacity="0.4"/>

  <!-- Seaweed at bottom -->
  <path d="M10,120 Q14,104 10,92 Q6,80 10,70" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <path d="M18,120 Q22,108 18,98 Q14,88 18,80" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  <path d="M100,120 Q104,108 100,98 Q96,88 100,78" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <path d="M108,120 Q112,110 108,100" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
