<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate (hero) -->
  <circle cx="48" cy="48" r="36" fill="#f5f5f4" stroke="#374151" stroke-width="1.5"/>
  <!-- Plate ridge -->
  <circle cx="48" cy="48" r="28" fill="none" stroke="#374151" stroke-width="0.5" opacity="0.3"/>

  <!-- Cut lines showing where to cut triangle -->
  <line x1="48" y1="48" x2="84" y2="30" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="48" y1="48" x2="84" y2="66" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Triangle wedge being cut (slightly separated) -->
  <polygon points="86,30 86,66 50,48" fill="#f5f5f4" stroke="#374151" stroke-width="0.8" opacity="0.5"/>

  <!-- Scissors cutting -->
  <g transform="translate(76, 22) rotate(30)">
    <path d="M0,0 L-16,5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,0 L-16,-5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#374151"/>
    <ellipse cx="5" cy="3.5" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <ellipse cx="5" cy="-3.5" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Arrow showing wedge being removed -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M84,48 Q92,48 98,48" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Separated wedge piece -->
  <g transform="translate(96, 38)">
    <polygon points="0,0 0,20 18,10" fill="#f5f5f4" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Hand holding plate -->
  <g transform="translate(16, 78)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>
</svg>
