<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Fish shape painted with scales (hero) -->
  <!-- Body -->
  <path d="M78,24 A36,36 0 1,0 78,72 L54,48 Z" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>

  <!-- Tail -->
  <polygon points="18,28 18,68 -2,48" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>

  <!-- Scale pattern (overlapping curves) -->
  <path d="M28,34 Q32,30 36,34" fill="none" stroke="#2563eb" stroke-width="1" stroke-linecap="round"/>
  <path d="M36,34 Q40,30 44,34" fill="none" stroke="#2563eb" stroke-width="1" stroke-linecap="round"/>
  <path d="M44,34 Q48,30 52,34" fill="none" stroke="#2563eb" stroke-width="1" stroke-linecap="round"/>
  <path d="M52,34 Q56,30 60,34" fill="none" stroke="#2563eb" stroke-width="1" stroke-linecap="round"/>

  <path d="M24,42 Q28,38 32,42" fill="none" stroke="#1d4ed8" stroke-width="1" stroke-linecap="round"/>
  <path d="M32,42 Q36,38 40,42" fill="none" stroke="#1d4ed8" stroke-width="1" stroke-linecap="round"/>
  <path d="M40,42 Q44,38 48,42" fill="none" stroke="#1d4ed8" stroke-width="1" stroke-linecap="round"/>
  <path d="M48,42 Q52,38 56,42" fill="none" stroke="#1d4ed8" stroke-width="1" stroke-linecap="round"/>
  <path d="M56,42 Q60,38 64,42" fill="none" stroke="#1d4ed8" stroke-width="1" stroke-linecap="round"/>

  <path d="M24,50 Q28,46 32,50" fill="none" stroke="#60a5fa" stroke-width="1" stroke-linecap="round"/>
  <path d="M32,50 Q36,46 40,50" fill="none" stroke="#60a5fa" stroke-width="1" stroke-linecap="round"/>
  <path d="M40,50 Q44,46 48,50" fill="none" stroke="#60a5fa" stroke-width="1" stroke-linecap="round"/>
  <path d="M48,50 Q52,46 56,50" fill="none" stroke="#60a5fa" stroke-width="1" stroke-linecap="round"/>
  <path d="M56,50 Q60,46 64,50" fill="none" stroke="#60a5fa" stroke-width="1" stroke-linecap="round"/>

  <path d="M28,58 Q32,54 36,58" fill="none" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
  <path d="M36,58 Q40,54 44,58" fill="none" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
  <path d="M44,58 Q48,54 52,58" fill="none" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
  <path d="M52,58 Q56,54 60,58" fill="none" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>

  <path d="M32,66 Q36,62 40,66" fill="none" stroke="#bfdbfe" stroke-width="1" stroke-linecap="round"/>
  <path d="M40,66 Q44,62 48,66" fill="none" stroke="#bfdbfe" stroke-width="1" stroke-linecap="round"/>

  <!-- Paintbrush painting scales -->
  <g transform="translate(68, 10)">
    <rect x="0" y="0" width="6" height="28" rx="2" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
    <rect x="-1" y="26" width="8" height="4" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="0.5"/>
    <rect x="0" y="29" width="6" height="6" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Hand -->
  <g transform="translate(76, 6)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Paint pots -->
  <g transform="translate(86, 56)">
    <rect x="0" y="0" width="14" height="18" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="7" cy="2" rx="7" ry="2.5" fill="#2563eb" stroke="#374151" stroke-width="0.5"/>
  </g>
  <g transform="translate(102, 58)">
    <rect x="0" y="0" width="12" height="16" rx="3" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="6" cy="2" rx="6" ry="2" fill="#16a34a" stroke="#374151" stroke-width="0.4"/>
  </g>
</svg>
