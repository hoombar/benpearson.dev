<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Grass Head Ball (hero) -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="30" fill="#ede9fe" stroke="#374151" stroke-width="2.5"/>
    
    <!-- Rubber band at the bottom -->
    <ellipse cx="0" cy="30" rx="10" ry="3" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <!-- Sock tail -->
    <path d="M-8,32 L-15,55 Q0,60 15,55 L8,32" fill="#ede9fe" stroke="#374151" stroke-width="2"/>

    <!-- Pinching a nose -->
    <g transform="translate(0, 0)">
      <path d="M-5,-5 Q0,-15 5,-5" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="-8" r="4" fill="#ede9fe" stroke="#ef4444" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Action arrow showing pinching -->
  <path d="M30,40 Q40,50 50,55" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
  <path d="M90,40 Q80,50 70,55" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>