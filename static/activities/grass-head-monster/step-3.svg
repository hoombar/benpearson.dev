<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Paper Cup -->
  <path d="M40,80 L80,80 L75,115 L45,115 Z" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
  <ellipse cx="60" cy="80" rx="20" ry="5" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/> <!-- Water -->

  <!-- Grass Head Monster (hero) -->
  <g transform="translate(60, 55)">
    <circle cx="0" cy="0" r="25" fill="#ede9fe" stroke="#374151" stroke-width="2.5"/>
    <!-- Nose -->
    <circle cx="0" cy="5" r="3" fill="#ede9fe" stroke="#ef4444" stroke-width="1"/>
    <!-- Googly Eyes -->
    <circle cx="-8" cy="-5" r="5" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <circle cx="-8" cy="-5" r="2" fill="#000000"/>
    <circle cx="8" cy="-5" r="5" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <circle cx="8" cy="-5" r="2" fill="#000000"/>
    
    <!-- Sock tail in water -->
    <path d="M-5,25 L-8,45 Q0,50 8,45 L5,25" fill="#ede9fe" stroke="#374151" stroke-width="2" opacity="0.8"/>

    <!-- Small grass sprouts starting to appear -->
    <line x1="-10" y1="-25" x2="-12" y2="-32" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="-26" x2="0" y2="-35" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="10" y1="-25" x2="12" y2="-32" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Action arrow -->
  <path d="M20,40 Q30,30 45,45" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>