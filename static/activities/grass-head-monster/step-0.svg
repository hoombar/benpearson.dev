<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Sock (hero) -->
  <path d="M40,20 L40,80 C40,90 50,100 65,100 L85,100 L85,80 L65,80 L65,20 Z" fill="#ede9fe" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Hand pouring seeds into toe -->
  <g transform="translate(45, 30)">
    <!-- Spoon -->
    <path d="M30,-10 L45,-5 L55,-10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <!-- Falling seeds -->
    <path d="M35,0 Q30,15 25,30 M40,0 Q35,15 30,30" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="2,4" stroke-linecap="round"/>
  </g>

  <!-- Seeds in the toe -->
  <path d="M42,75 Q52,85 62,75" fill="#fde68a" stroke="#374151" stroke-width="1.5" opacity="0.8"/>

  <!-- Action arrow -->
  <path d="M85,30 Q95,45 85,60" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>