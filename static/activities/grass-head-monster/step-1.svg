<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Sock getting fat with soil (hero) -->
  <path d="M35,20 L35,50 C35,85 85,85 85,50 L85,20 Z" fill="#ede9fe" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Soil ball inside -->
  <circle cx="60" cy="65" r="25" fill="#d97706" stroke="#374151" stroke-width="1.5" opacity="0.8"/>
  <circle cx="60" cy="85" r="5" fill="#fde68a" stroke="none" opacity="0.6"/> <!-- Seeds at the bottom -->

  <!-- Hand pouring soil -->
  <g transform="translate(60, 10)">
    <path d="M-10,0 Q0,-10 10,0 L15,10 L-15,10 Z" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
    <!-- Falling soil -->
    <path d="M-5,15 Q0,30 5,45 M5,15 Q10,30 15,45" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="4,4" stroke-linecap="round"/>
  </g>

  <!-- Action arrow -->
  <path d="M25,30 Q15,50 30,70" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>