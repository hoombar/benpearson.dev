<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="95" width="110" height="12" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Tin can 1 (decorated, gold with stars) -->
  <rect x="12" y="48" width="40" height="45" rx="2" fill="#f59e0b" stroke="#374151" stroke-width="2.5"/>
  <rect x="12" y="46" width="40" height="4" rx="1" fill="#d97706" stroke="#374151" stroke-width="1.5"/>
  <!-- Star decoration -->
  <path d="M32,62 L34,56 L36,62 L42,62 L37,66 L39,72 L34,68 L29,72 L31,66 L26,62 Z"
        fill="#fef9c3" stroke="#374151" stroke-width="1"/>
  <!-- Stripe decoration -->
  <line x1="12" y1="80" x2="52" y2="80" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="86" x2="52" y2="86" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <!-- String handles -->
  <line x1="18" y1="30" x2="18" y2="50" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="30" x2="46" y2="50" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <path d="M18,30 Q32,22 46,30" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Tin can 2 (being painted, green with dots) -->
  <rect x="68" y="48" width="40" height="45" rx="2" fill="#22c55e" stroke="#374151" stroke-width="2.5"/>
  <rect x="68" y="46" width="40" height="4" rx="1" fill="#16a34a" stroke="#374151" stroke-width="1.5"/>
  <!-- Polka dot decoration -->
  <circle cx="78" cy="60" r="3" fill="#d1fae5" stroke="none"/>
  <circle cx="90" cy="68" r="3" fill="#d1fae5" stroke="none"/>
  <circle cx="100" cy="58" r="3" fill="#d1fae5" stroke="none"/>
  <circle cx="82" cy="80" r="3" fill="#d1fae5" stroke="none"/>
  <circle cx="96" cy="82" r="3" fill="#d1fae5" stroke="none"/>

  <!-- Paintbrush actively painting the right can -->
  <line x1="112" y1="40" x2="100" y2="64" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="96" y="64" width="8" height="4" rx="1" fill="#22c55e" stroke="#374151" stroke-width="1"/>

  <!-- Paint pot nearby -->
  <rect x="4" y="10" width="18" height="22" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <rect x="6" y="14" width="14" height="16" rx="1" fill="#22c55e" stroke="none"/>

  <!-- Sticker sheet -->
  <rect x="100" y="8" width="16" height="20" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <path d="M106,14 L107,11 L108,14 L111,14 L108.5,16 L109.5,19 L107,17 L104.5,19 L105.5,16 L103,14 Z"
        fill="#f59e0b" stroke="#374151" stroke-width="0.75"/>
  <circle cx="108" cy="24" r="2" fill="#ef4444" stroke="#374151" stroke-width="0.75"/>
</svg>
