<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Tin can (hero, upside down, showing holes and string) -->
  <rect x="30" y="42" width="60" height="55" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="2.5"/>
  <!-- Solid top -->
  <rect x="30" y="40" width="60" height="4" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <!-- Can ridges -->
  <line x1="30" y1="50" x2="90" y2="50" stroke="#374151" stroke-width="0.75"/>
  <line x1="30" y1="90" x2="90" y2="90" stroke="#374151" stroke-width="0.75"/>

  <!-- Two holes on opposite sides near top -->
  <circle cx="36" cy="46" r="3" fill="#374151" stroke="none"/>
  <circle cx="84" cy="46" r="3" fill="#374151" stroke="none"/>

  <!-- String threading through holes -->
  <!-- Left side: string going down through hole, knot inside -->
  <line x1="36" y1="12" x2="36" y2="44" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Knot inside left -->
  <circle cx="36" cy="52" r="3" fill="none" stroke="#d97706" stroke-width="2"/>
  <circle cx="36" cy="52" r="1" fill="#d97706" stroke="none"/>

  <!-- Right side: string going down through hole, knot inside -->
  <line x1="84" y1="12" x2="84" y2="44" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Knot inside right -->
  <circle cx="84" cy="52" r="3" fill="none" stroke="#d97706" stroke-width="2"/>
  <circle cx="84" cy="52" r="1" fill="#d97706" stroke="none"/>

  <!-- String loop handle (connecting both sides up top) -->
  <path d="M36,12 Q60,4 84,12" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Arrows showing threading direction -->
  <path d="M36,22 L36,36" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M84,22 L84,36" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- String spool nearby -->
  <ellipse cx="108" cy="70" rx="8" ry="6" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="108" cy="70" rx="3" ry="6" fill="#d97706" stroke="#374151" stroke-width="1"/>
</svg>
