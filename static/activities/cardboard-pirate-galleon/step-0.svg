<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Floor/Rug background -->
  <rect x="0" y="0" width="120" height="120" fill="#fef3c7" />
  <ellipse cx="60" cy="100" rx="45" ry="12" fill="#fde68a" />
  <!-- Box body -->
  <path d="M25,80 L25,45 L80,45 L80,80 Z" fill="#f59e0b" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <path d="M80,45 L105,35 L105,70 L80,80 Z" fill="#d97706" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <path d="M25,45 L50,35 L105,35 L80,45 Z" fill="#fbbf24" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <!-- Dashed lines showing where to cut the bow -->
  <line x1="25" y1="45" x2="5" y2="60" stroke="#374151" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
  <line x1="5" y1="60" x2="25" y2="80" stroke="#374151" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
  <!-- Scissors near the dashed line -->
  <g transform="translate(10, 50) rotate(-30)">
    <line x1="0" y1="0" x2="16" y2="-4" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="16" y2="4" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-5" cy="-6" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <circle cx="-5" cy="6" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  </g>
</svg>