<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Water background (blue rug) -->
  <rect x="0" y="0" width="120" height="120" fill="#dbeafe" />
  <path d="M10,100 Q20,95 30,100 T50,100 T70,100 T90,100 T110,100" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <path d="M20,110 Q30,105 40,110 T60,110 T80,110 T100,110" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <!-- Hull -->
  <path d="M30,85 L30,55 L85,55 L85,85 Z" fill="#f59e0b" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <path d="M85,55 L110,45 L110,75 L85,85 Z" fill="#d97706" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <path d="M30,55 L10,70 L30,85 Z" fill="#fbbf24" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <!-- Details drawn on hull (Anchor) -->
  <circle cx="50" cy="65" r="3" fill="none" stroke="#374151" stroke-width="1.5" />
  <line x1="50" y1="68" x2="50" y2="78" stroke="#374151" stroke-width="1.5" stroke-linecap="round" />
  <path d="M44,75 Q50,82 56,75" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" />
  <line x1="46" y1="72" x2="54" y2="72" stroke="#374151" stroke-width="1.5" stroke-linecap="round" />
  <!-- Details drawn on hull (Planks) -->
  <line x1="60" y1="60" x2="80" y2="60" stroke="#374151" stroke-width="1" stroke-linecap="round" />
  <line x1="65" y1="70" x2="75" y2="70" stroke="#374151" stroke-width="1" stroke-linecap="round" />
  <line x1="62" y1="80" x2="82" y2="80" stroke="#374151" stroke-width="1" stroke-linecap="round" />
  <line x1="90" y1="55" x2="105" y2="50" stroke="#374151" stroke-width="1" stroke-linecap="round" />
  <!-- Masts and Sails -->
  <rect x="45" y="20" width="4" height="45" fill="#fde68a" stroke="#374151" stroke-width="1.5" />
  <path d="M35,25 Q50,45 35,55 Q55,50 55,35 Q55,20 35,25 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.5" stroke-linejoin="round" />
  <rect x="70" y="10" width="4" height="50" fill="#fde68a" stroke="#374151" stroke-width="1.5" />
  <path d="M60,15 Q75,35 60,45 Q80,40 80,25 Q80,10 60,15 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Jolly Roger flag -->
  <polygon points="72,12 85,15 82,22 72,20" fill="#ef4444" stroke="#374151" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Motion lines showing sailing forward (left) -->
  <line x1="15" y1="90" x2="5" y2="90" stroke="#374151" stroke-width="2" stroke-linecap="round" />
  <line x1="20" y1="95" x2="10" y2="95" stroke="#374151" stroke-width="2" stroke-linecap="round" />
  <!-- String rigging -->
  <line x1="10" y1="70" x2="45" y2="20" stroke="#374151" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="45" y1="20" x2="70" y2="10" stroke="#374151" stroke-width="1" stroke-dasharray="2,2" />
</svg>