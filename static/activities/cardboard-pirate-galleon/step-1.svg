<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Floor -->
  <rect x="0" y="0" width="120" height="120" fill="#fef3c7" />
  <ellipse cx="60" cy="100" rx="45" ry="12" fill="#fde68a" />
  <!-- Box hull -->
  <path d="M25,80 L25,50 L80,50 L80,80 Z" fill="#f59e0b" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <path d="M80,50 L105,40 L105,70 L80,80 Z" fill="#d97706" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <path d="M25,50 L5,65 L25,80 Z" fill="#fbbf24" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <!-- Masts (Cardboard Tubes) inside the hull -->
  <rect x="40" y="15" width="8" height="55" fill="#fef3c7" stroke="#374151" stroke-width="2" rx="2" />
  <ellipse cx="44" cy="70" rx="8" ry="3" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" />
  <rect x="65" y="10" width="8" height="60" fill="#fef3c7" stroke="#374151" stroke-width="2" rx="2" />
  <ellipse cx="69" cy="70" rx="8" ry="3" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" />
  <!-- Tape roll tool -->
  <g transform="translate(85, 25) rotate(15)">
    <circle cx="0" cy="0" r="10" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
    <path d="M 0,-10 L -15,-10 L -15, -6 L 0, -6" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" />
  </g>
  <!-- Motion line for taping -->
  <path d="M80 35 Q75 55 72 65" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,3" />
</svg>