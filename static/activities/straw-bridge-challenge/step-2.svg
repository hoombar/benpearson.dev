<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Left cup -->
  <g transform="translate(10, 58)">
    <path d="M0,0 L4,40 L28,40 L32,0 Z" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="16" cy="0" rx="16" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Right cup -->
  <g transform="translate(78, 58)">
    <path d="M0,0 L4,40 L28,40 L32,0 Z" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="16" cy="0" rx="16" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Bridge with triangular truss reinforcement (hero) -->
  <!-- Top deck -->
  <line x1="18" y1="52" x2="102" y2="52" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="56" x2="102" y2="56" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom chord -->
  <line x1="26" y1="68" x2="94" y2="68" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Diagonal cross-braces (triangles!) -->
  <line x1="26" y1="54" x2="42" y2="68" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="68" x2="58" y2="54" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="54" x2="74" y2="68" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="74" y1="68" x2="94" y2="54" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Tape joints -->
  <rect x="40" y="66" width="5" height="5" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3" opacity="0.6"/>
  <rect x="56" y="51" width="5" height="5" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3" opacity="0.6"/>
  <rect x="72" y="66" width="5" height="5" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3" opacity="0.6"/>

  <!-- Triangle highlight (showing strongest shape) -->
  <polygon points="26,54 42,68 58,54" fill="none" stroke="#f97316" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>

  <!-- Hand taping a brace -->
  <g transform="translate(70, 34)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Tape strip being applied -->
  <rect x="82" y="50" width="8" height="4" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.4"/>

  <!-- Arrow showing reinforcement -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f97316"/>
    </marker>
  </defs>
  <path d="M42,24 Q42,32 42,40" fill="none" stroke="#f97316" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Label pointing to triangle -->
  <polygon points="38,16 42,22 46,16" fill="none" stroke="#f97316" stroke-width="1.5"/>
</svg>
