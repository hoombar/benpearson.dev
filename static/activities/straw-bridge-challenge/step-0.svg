<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Left cup (upside-down support) -->
  <g transform="translate(10, 58)">
    <path d="M0,0 L4,40 L28,40 L32,0 Z" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="16" cy="0" rx="16" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Right cup (upside-down support) -->
  <g transform="translate(78, 58)">
    <path d="M0,0 L4,40 L28,40 L32,0 Z" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="16" cy="0" rx="16" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Gap measurement arrow -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="42" y1="80" x2="78" y2="80" stroke="#374151" stroke-width="0.8" marker-end="url(#arr)"/>
  <line x1="78" y1="80" x2="42" y2="80" stroke="#374151" stroke-width="0.8" marker-end="url(#arr)"/>

  <!-- Straws bundle -->
  <g transform="translate(6, 10)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="6" x2="42" y2="6" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="12" x2="38" y2="12" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="44" y2="18" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="24" x2="40" y2="24" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Tape roll -->
  <g transform="translate(66, 14)">
    <ellipse cx="10" cy="10" rx="10" ry="10" fill="#d1fae5" stroke="#374151" stroke-width="1"/>
    <ellipse cx="10" cy="10" rx="4" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Scissors -->
  <g transform="translate(90, 22)">
    <path d="M0,0 L12,5" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L12,-5" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.2" fill="#374151"/>
    <ellipse cx="-4" cy="2.5" rx="4" ry="2.5" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <ellipse cx="-4" cy="-2.5" rx="4" ry="2.5" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  </g>

  <!-- Coins stack -->
  <g transform="translate(92, 42)">
    <ellipse cx="8" cy="14" rx="8" ry="3" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="8" cy="12" rx="8" ry="3" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="8" cy="10" rx="8" ry="3" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="8" cy="8" rx="8" ry="3" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>
  </g>
</svg>
