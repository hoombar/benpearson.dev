<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Left cup -->
  <g transform="translate(10, 58)">
    <path d="M0,0 L4,40 L28,40 L32,0 Z" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="16" cy="0" rx="16" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Right cup -->
  <g transform="translate(78, 58)">
    <path d="M0,0 L4,40 L28,40 L32,0 Z" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="16" cy="0" rx="16" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Bridge deck (straws bundled together spanning the gap, hero) -->
  <g transform="translate(18, 52)">
    <line x1="0" y1="0" x2="84" y2="0" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="4" x2="84" y2="4" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="8" x2="84" y2="8" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <!-- Tape holding them together -->
    <rect x="20" y="-2" width="8" height="12" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3" opacity="0.6"/>
    <rect x="56" y="-2" width="8" height="12" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3" opacity="0.6"/>
  </g>

  <!-- Hand placing a straw -->
  <g transform="translate(52, 30)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Straw being placed -->
  <line x1="44" y1="46" x2="80" y2="46" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <!-- Arrow showing placement -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M62,44 Q62,48 60,50" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Extra straws and tape roll -->
  <g transform="translate(6, 14)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="6" x2="28" y2="6" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Tape -->
  <g transform="translate(88, 14)">
    <ellipse cx="8" cy="8" rx="8" ry="8" fill="#d1fae5" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="8" cy="8" rx="3" ry="3" fill="#fef3c7" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Scissors -->
  <g transform="translate(48, 14)">
    <path d="M0,0 L10,3" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L10,-3" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1" fill="#374151"/>
    <ellipse cx="-3" cy="2" rx="3" ry="2" fill="none" stroke="#ef4444" stroke-width="1"/>
    <ellipse cx="-3" cy="-2" rx="3" ry="2" fill="none" stroke="#ef4444" stroke-width="1"/>
  </g>
</svg>
