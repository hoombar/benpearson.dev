<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper with sky and ground painted -->
  <rect x="12" y="6" width="74" height="88" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>

  <!-- Sky -->
  <rect x="13" y="7" width="72" height="52" fill="#60a5fa" stroke="none" opacity="0.85"/>

  <!-- Sun -->
  <circle cx="72" cy="18" r="8" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>

  <!-- Ground - rolling hills -->
  <path d="M13,60 Q30,48 50,58 Q70,68 85,56 L85,93 L13,93 Z" fill="#22c55e" stroke="none" opacity="0.8"/>
  <path d="M13,66 Q40,56 60,64 Q80,72 85,62 L85,93 L13,93 Z" fill="#4ade80" stroke="none" opacity="0.6"/>

  <!-- Simple trees -->
  <line x1="28" y1="58" x2="28" y2="72" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
  <circle cx="28" cy="54" r="7" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
  <line x1="62" y1="56" x2="62" y2="68" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
  <circle cx="62" cy="52" r="6" fill="#4ade80" stroke="#374151" stroke-width="0.6"/>

  <!-- Flower dots -->
  <circle cx="36" cy="72" r="2" fill="#ef4444" stroke="none"/>
  <circle cx="42" cy="76" r="2" fill="#fbbf24" stroke="none"/>
  <circle cx="52" cy="74" r="2" fill="#a78bfa" stroke="none"/>
  <circle cx="70" cy="70" r="2" fill="#ef4444" stroke="none"/>

  <!-- Small house -->
  <rect x="44" y="62" width="10" height="8" rx="1" fill="#fca5a5" stroke="#374151" stroke-width="0.5"/>
  <path d="M42,62 L49,56 L56,62" fill="#92400e" stroke="#374151" stroke-width="0.5"/>

  <!-- Paintbrush -->
  <g transform="translate(78, 68) rotate(15)">
    <rect x="-2" y="-24" width="5" height="18" rx="1" fill="#f97316" stroke="#374151" stroke-width="0.6"/>
    <rect x="-3" y="-8" width="7" height="4" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.4"/>
    <rect x="-4" y="-4" width="9" height="6" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
  </g>
</svg>
