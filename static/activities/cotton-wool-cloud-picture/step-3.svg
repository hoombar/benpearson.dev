<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall background -->
  <rect x="0" y="0" width="120" height="120" fill="#f3f4f6" stroke="none"/>

  <!-- Finished picture displayed -->
  <rect x="10" y="6" width="80" height="92" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <!-- Tape -->
  <rect x="42" y="2" width="16" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>

  <!-- Sky -->
  <rect x="11" y="7" width="78" height="56" fill="#60a5fa" stroke="none" opacity="0.85"/>
  <!-- Sun -->
  <circle cx="78" cy="18" r="8" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
  <line x1="78" y1="8" x2="78" y2="4" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
  <line x1="86" y1="12" x2="90" y2="10" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
  <line x1="88" y1="18" x2="92" y2="18" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>

  <!-- Ground -->
  <path d="M11,64 Q30,52 50,62 Q72,72 89,58 L89,97 L11,97 Z" fill="#22c55e" stroke="none" opacity="0.8"/>
  <path d="M11,70 Q40,60 60,68 Q80,76 89,66 L89,97 L11,97 Z" fill="#4ade80" stroke="none" opacity="0.6"/>
  <!-- Trees -->
  <line x1="28" y1="62" x2="28" y2="72" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="28" cy="58" r="5" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
  <line x1="66" y1="58" x2="66" y2="66" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="66" cy="54" r="5" fill="#4ade80" stroke="#374151" stroke-width="0.4"/>
  <!-- Flowers -->
  <circle cx="38" cy="76" r="1.5" fill="#ef4444"/>
  <circle cx="48" cy="78" r="1.5" fill="#fbbf24"/>
  <circle cx="56" cy="74" r="1.5" fill="#a78bfa"/>

  <!-- Cotton wool clouds -->
  <circle cx="28" cy="22" r="7" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.6"/>
  <circle cx="38" cy="18" r="9" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.6"/>
  <circle cx="48" cy="22" r="7" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.6"/>
  <circle cx="36" cy="26" r="5" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="0.4"/>

  <ellipse cx="66" cy="36" rx="10" ry="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
  <circle cx="22" cy="44" r="5" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
  <circle cx="30" cy="42" r="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>

  <!-- Birds drawn with markers -->
  <path d="M54,30 Q56,28 58,30" fill="none" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M62" y1="26" fill="none" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M58,34 Q60,32 62,34" fill="none" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Rainbow arc -->
  <path d="M16,50 Q50,24 84,50" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>
  <path d="M18,50 Q50,26 82,50" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
  <path d="M20,50 Q50,28 80,50" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>
</svg>
