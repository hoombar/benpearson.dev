<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper being painted -->
  <rect x="12" y="6" width="74" height="88" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>

  <!-- Sky painted blue (top two-thirds) -->
  <rect x="13" y="7" width="72" height="56" fill="#60a5fa" stroke="none" opacity="0.85"/>
  <!-- Gradient - lighter near horizon -->
  <rect x="13" y="50" width="72" height="13" fill="#93c5fd" stroke="none" opacity="0.5"/>

  <!-- Sun in corner -->
  <circle cx="72" cy="18" r="10" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  <!-- Sun rays -->
  <line x1="72" y1="6" x2="72" y2="2" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="82" y1="12" x2="86" y2="8" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="84" y1="18" x2="88" y2="18" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="82" y1="24" x2="86" y2="28" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="12" x2="58" y2="8" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="24" x2="58" y2="28" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Paintbrush painting the sky -->
  <g transform="translate(40, 40) rotate(-20)">
    <rect x="-3" y="-30" width="6" height="22" rx="1.5" fill="#f97316" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-10" width="8" height="5" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.5"/>
    <rect x="-5" y="-5" width="10" height="7" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Paint pot -->
  <rect x="92" y="34" width="16" height="20" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <ellipse cx="100" cy="34" rx="8" ry="2.5" fill="#60a5fa" stroke="#374151" stroke-width="0.6"/>
</svg>
