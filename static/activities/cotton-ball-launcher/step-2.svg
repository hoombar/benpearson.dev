<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Floor -->
  <rect x="0" y="100" width="120" height="20" fill="#f3f4f6" stroke="none"/>
  <line x1="0" y1="100" x2="120" y2="100" stroke="#374151" stroke-width="1.5"/>

  <!-- Launcher cup (held at angle, aimed right) -->
  <g transform="translate(30,58) rotate(-20)">
    <path d="M-14,-30 L-16,30 L16,30 L14,-30 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <!-- Top opening -->
    <ellipse cx="0" cy="-30" rx="14" ry="4" fill="#f3f4f6" stroke="#374151" stroke-width="1"/>
    <!-- Balloon on bottom -->
    <ellipse cx="0" cy="30" rx="16" ry="4" fill="#f472b6" stroke="#374151" stroke-width="1"/>
    <!-- Tape -->
    <rect x="-16" y="27" width="8" height="3" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.4"/>
    <rect x="8" y="27" width="8" height="3" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Hand pulling balloon back -->
  <!-- Balloon knot pulled back -->
  <path d="M33,90 Q38,96 42,98" stroke="#f472b6" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="43" cy="99" r="2" fill="#ec4899" stroke="#374151" stroke-width="0.6"/>

  <!-- Cotton ball flying out (top right) -->
  <circle cx="78" cy="24" r="7" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <!-- Fluffy texture -->
  <circle cx="75" cy="22" r="2" fill="#f3f4f6" stroke="none"/>
  <circle cx="80" cy="21" r="2" fill="#f3f4f6" stroke="none"/>
  <circle cx="78" cy="27" r="2" fill="#f3f4f6" stroke="none"/>

  <!-- Motion lines behind cotton ball -->
  <line x1="66" y1="30" x2="58" y2="36" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="68" y1="26" x2="60" y2="30" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="70" y1="22" x2="62" y2="24" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Pull-back arrow -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M50,94 Q48,100 44,100" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>
</svg>