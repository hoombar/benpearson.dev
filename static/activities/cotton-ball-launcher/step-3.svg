<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table/shelf surface -->
  <rect x="5" y="70" width="110" height="8" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Cup pyramid target (3 cups stacked) -->
  <!-- Bottom row -->
  <path d="M72,50 L70,68 L86,68 L84,50 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <path d="M88,50 L86,68 L102,68 L100,50 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <!-- Top cup -->
  <path d="M80,32 L78,50 L94,50 L92,32 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>

  <!-- Target circle on paper (left area) -->
  <circle cx="38" cy="46" r="18" fill="#f9fafb" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="38" cy="46" r="12" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
  <circle cx="38" cy="46" r="6" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  <circle cx="38" cy="46" r="2" fill="#ef4444" stroke="none"/>

  <!-- Cotton ball approaching target -->
  <circle cx="38" cy="20" r="5" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <!-- Motion lines -->
  <line x1="38" y1="12" x2="38" y2="8" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="34" y1="14" x2="32" y2="10" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="42" y1="14" x2="44" y2="10" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Score tally below -->
  <line x1="20" y1="88" x2="20" y2="96" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="88" x2="24" y2="96" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="88" x2="28" y2="96" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="88" x2="32" y2="96" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="17" y1="92" x2="35" y2="92" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Star burst (hit!) -->
  <path d="M100,36 L102,30 L104,36 L110,34 L106,38 L112,40 L106,42 L108,48 L104,44 L100,48 L102,42 L96,40 L100,38 L96,34 Z"
        fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>

  <!-- Launcher (small, in bottom left) -->
  <path d="M6,82 L5,100 L17,100 L16,82 Z" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <ellipse cx="11" cy="100" rx="6" ry="2" fill="#f472b6" stroke="#374151" stroke-width="0.6"/>
</svg>