<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper cup (open at bottom, hero) -->
  <path d="M36,22 L32,82 L88,82 L84,22 Z" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Cup rim (top opening) -->
  <ellipse cx="60" cy="22" rx="24" ry="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>

  <!-- Balloon stretched over bottom (pink/red membrane) -->
  <ellipse cx="60" cy="82" rx="28" ry="6" fill="#f472b6" stroke="#374151" stroke-width="1.5"/>

  <!-- Balloon knot hanging down -->
  <path d="M60,88 L60,96" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="60" cy="97" r="2" fill="#ec4899" stroke="#374151" stroke-width="0.8"/>

  <!-- Tape strips securing balloon to cup -->
  <rect x="30" y="78" width="12" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>
  <rect x="78" y="78" width="12" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>
  <rect x="54" y="76" width="12" height="4" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>

  <!-- Arrows showing stretch direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M18,70 Q24,78 30,80" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M102,70 Q96,78 90,80" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Tape roll -->
  <circle cx="14" cy="56" r="8" fill="#fde68a" stroke="#374151" stroke-width="1"/>
  <circle cx="14" cy="56" r="3" fill="#fef3c7" stroke="#374151" stroke-width="0.7"/>
</svg>