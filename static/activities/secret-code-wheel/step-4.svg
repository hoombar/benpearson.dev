<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Left paper: plain message -->
  <rect x="8" y="20" width="44" height="56" rx="2" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <!-- Plain text lines -->
  <text x="12" y="36" font-size="7" fill="#374151" font-family="monospace">H I</text>
  <text x="12" y="48" font-size="7" fill="#374151" font-family="monospace">M U M</text>
  <line x1="12" y1="38" x2="48" y2="38" stroke="#374151" stroke-width="0.8" opacity="0.3"/>
  <line x1="12" y1="50" x2="48" y2="50" stroke="#374151" stroke-width="0.8" opacity="0.3"/>
  <line x1="12" y1="58" x2="48" y2="58" stroke="#374151" stroke-width="0.8" opacity="0.3"/>
  <line x1="12" y1="66" x2="48" y2="66" stroke="#374151" stroke-width="0.8" opacity="0.3"/>
  <line x1="12" y1="30" x2="48" y2="30" stroke="#374151" stroke-width="0.8" opacity="0.3"/>
  <!-- "PLAIN" label on first paper -->
  <rect x="8" y="18" width="44" height="10" rx="2" stroke="#374151" stroke-width="1" fill="#dbeafe"/>
  <text x="18" y="26" font-size="6" fill="#374151" font-family="monospace">PLAIN</text>
  <!-- Arrow between papers -->
  <line x1="56" y1="48" x2="64" y2="48" stroke="#374151" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Right paper: coded message -->
  <rect x="68" y="20" width="44" height="56" rx="2" stroke="#374151" stroke-width="1.5" fill="#fef9c3"/>
  <!-- Coded text lines -->
  <text x="72" y="36" font-size="7" fill="#ef4444" font-family="monospace">K L</text>
  <text x="72" y="48" font-size="7" fill="#ef4444" font-family="monospace">P X P</text>
  <line x1="72" y1="38" x2="108" y2="38" stroke="#374151" stroke-width="0.8" opacity="0.3"/>
  <line x1="72" y1="50" x2="108" y2="50" stroke="#374151" stroke-width="0.8" opacity="0.3"/>
  <line x1="72" y1="58" x2="108" y2="58" stroke="#374151" stroke-width="0.8" opacity="0.3"/>
  <line x1="72" y1="66" x2="108" y2="66" stroke="#374151" stroke-width="0.8" opacity="0.3"/>
  <line x1="72" y1="30" x2="108" y2="30" stroke="#374151" stroke-width="0.8" opacity="0.3"/>
  <!-- "CODE" label on second paper -->
  <rect x="68" y="18" width="44" height="10" rx="2" stroke="#374151" stroke-width="1" fill="#fbbf24"/>
  <text x="80" y="26" font-size="6" fill="#374151" font-family="monospace">CODE</text>
  <!-- Small cipher wheel icon at bottom centre -->
  <circle cx="60" cy="98" r="14" stroke="#374151" stroke-width="1.5" fill="#dbeafe"/>
  <circle cx="60" cy="98" r="8" stroke="#374151" stroke-width="1.5" fill="#fef9c3"/>
  <circle cx="60" cy="98" r="2" fill="#374151"/>
  <!-- Rotation arrow on mini wheel -->
  <path d="M70 92 Q74 98 70 104" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
