<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Outer wheel -->
  <circle cx="60" cy="64" r="46" stroke="#374151" stroke-width="2.5" fill="#dbeafe"/>
  <!-- Outer wheel letters at key positions -->
  <text x="57" y="20" font-size="8" fill="#374151" font-family="monospace" font-weight="bold">A</text>
  <text x="99" y="36" font-size="8" fill="#3b82f6" font-family="monospace" font-weight="bold">D</text>
  <text x="103" y="66" font-size="8" fill="#374151" font-family="monospace" font-weight="bold">G</text>
  <text x="57" y="112" font-size="8" fill="#374151" font-family="monospace" font-weight="bold">N</text>
  <text x="11" y="66" font-size="8" fill="#374151" font-family="monospace" font-weight="bold">T</text>
  <!-- Inner wheel (rotated so A aligns with D) -->
  <circle cx="60" cy="64" r="30" stroke="#374151" stroke-width="2" fill="#fef9c3"/>
  <!-- Inner wheel letters — A is now at ~30° (aligned with outer D position) -->
  <text x="80" y="37" font-size="8" fill="#ef4444" font-family="monospace" font-weight="bold">A</text>
  <text x="89" y="64" font-size="8" fill="#374151" font-family="monospace" font-weight="bold">B</text>
  <text x="79" y="90" font-size="8" fill="#374151" font-family="monospace" font-weight="bold">C</text>
  <text x="57" y="96" font-size="8" fill="#374151" font-family="monospace" font-weight="bold">D</text>
  <text x="31" y="90" font-size="8" fill="#374151" font-family="monospace" font-weight="bold">E</text>
  <!-- Alignment indicator line showing A=D alignment -->
  <line x1="60" y1="64" x2="92" y2="30" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>
  <!-- Centre pin -->
  <circle cx="60" cy="64" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <circle cx="60" cy="64" r="2" fill="#374151"/>
  <!-- Rotation arc arrow on inner wheel -->
  <path d="M72 36 Q84 26 90 42" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Key annotation box -->
  <rect x="8" y="8" width="38" height="18" rx="3" stroke="#374151" stroke-width="1.5" fill="#fef9c3"/>
  <text x="12" y="18" font-size="7" fill="#374151" font-family="monospace" font-weight="bold">A = D</text>
  <text x="12" y="23" font-size="5.5" fill="#374151" font-family="monospace">KEY</text>
</svg>
