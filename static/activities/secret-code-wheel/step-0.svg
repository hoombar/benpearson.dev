<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Sheet of paper (background) -->
  <rect x="12" y="10" width="96" height="100" rx="2" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <!-- Large circle drawn on paper -->
  <circle cx="60" cy="62" r="38" stroke="#374151" stroke-width="2" fill="#dbeafe" opacity="0.5"/>
  <!-- Small circle drawn inside -->
  <circle cx="60" cy="62" r="26" stroke="#374151" stroke-width="1.5" fill="#dbeafe" opacity="0.3" stroke-dasharray="4,3"/>
  <!-- Ruler measuring across circle -->
  <rect x="26" y="56" width="68" height="10" rx="1" stroke="#374151" stroke-width="1.5" fill="#fef9c3" opacity="0.85"/>
  <!-- Ruler tick marks -->
  <line x1="36" y1="56" x2="36" y2="60" stroke="#374151" stroke-width="1"/>
  <line x1="46" y1="56" x2="46" y2="60" stroke="#374151" stroke-width="1"/>
  <line x1="56" y1="56" x2="56" y2="60" stroke="#374151" stroke-width="1"/>
  <line x1="66" y1="56" x2="66" y2="60" stroke="#374151" stroke-width="1"/>
  <line x1="76" y1="56" x2="76" y2="60" stroke="#374151" stroke-width="1"/>
  <line x1="86" y1="56" x2="86" y2="60" stroke="#374151" stroke-width="1"/>
  <!-- Scissors cutting along the large circle -->
  <g transform="translate(93,28) rotate(30)">
    <line x1="0" y1="0" x2="14" y2="0" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="12" y2="5" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-5" cy="-5" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <circle cx="-5" cy="5" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  </g>
  <!-- Dashed cut line around big circle -->
  <circle cx="60" cy="62" r="38" stroke="#374151" stroke-width="1" fill="none" stroke-dasharray="5,3"/>
</svg>
