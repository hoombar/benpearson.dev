<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate folded in half being painted (hero) -->
  <!-- Bottom half -->
  <path d="M14,56 Q14,88 54,88 Q94,88 94,56 Z" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <!-- Top half (folded up) -->
  <path d="M14,56 Q14,24 54,24 Q94,24 94,56 Z" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <!-- Fold line -->
  <line x1="14" y1="56" x2="94" y2="56" stroke="#374151" stroke-width="1"/>

  <!-- Scale texture dots (darker green) -->
  <circle cx="34" cy="38" r="2.5" fill="#16a34a" stroke="#374151" stroke-width="0.3"/>
  <circle cx="54" cy="34" r="2.5" fill="#16a34a" stroke="#374151" stroke-width="0.3"/>
  <circle cx="74" cy="38" r="2.5" fill="#16a34a" stroke="#374151" stroke-width="0.3"/>
  <circle cx="44" cy="44" r="2" fill="#16a34a" stroke="#374151" stroke-width="0.3"/>
  <circle cx="64" cy="44" r="2" fill="#16a34a" stroke="#374151" stroke-width="0.3"/>
  <circle cx="34" cy="70" r="2.5" fill="#16a34a" stroke="#374151" stroke-width="0.3"/>
  <circle cx="54" cy="74" r="2.5" fill="#16a34a" stroke="#374151" stroke-width="0.3"/>
  <circle cx="74" cy="70" r="2.5" fill="#16a34a" stroke="#374151" stroke-width="0.3"/>

  <!-- Paintbrush painting -->
  <g transform="translate(76, 16) rotate(30)">
    <rect x="0" y="-3" width="26" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pot -->
  <g transform="translate(96, 62)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
    <rect x="2" y="3" width="12" height="11" rx="1" fill="#22c55e"/>
  </g>

  <!-- Arrow showing fold -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M6,76 Q2,66 6,56" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
