<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Crocodile jaw open (hero) -->
  <!-- Bottom jaw -->
  <path d="M14,58 Q14,86 54,86 Q94,86 94,58 Z" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <!-- Top jaw (tilted open) -->
  <path d="M14,58 Q14,30 54,30 Q94,30 94,58 Z" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>

  <!-- Scale dots on top jaw -->
  <circle cx="40" cy="40" r="2" fill="#16a34a" stroke="#374151" stroke-width="0.3"/>
  <circle cx="58" cy="38" r="2" fill="#16a34a" stroke="#374151" stroke-width="0.3"/>
  <circle cx="74" cy="42" r="2" fill="#16a34a" stroke="#374151" stroke-width="0.3"/>

  <!-- Top teeth (zigzag inside top jaw) -->
  <polygon points="20,58 26,50 32,58 38,50 44,58 50,50 56,58 62,50 68,58 74,50 80,58 86,50 90,58" fill="white" stroke="#374151" stroke-width="0.6"/>

  <!-- Bottom teeth (zigzag inside bottom jaw) -->
  <polygon points="20,58 26,66 32,58 38,66 44,58 50,66 56,58 62,66 68,58 74,66 80,58 86,66 90,58" fill="white" stroke="#374151" stroke-width="0.6"/>

  <!-- Googly eyes on top of fold -->
  <circle cx="36" cy="32" r="6" fill="white" stroke="#374151" stroke-width="0.8"/>
  <circle cx="37" cy="33" r="3" fill="#374151"/>
  <circle cx="72" cy="32" r="6" fill="white" stroke="#374151" stroke-width="0.8"/>
  <circle cx="73" cy="33" r="3" fill="#374151"/>

  <!-- PVA glue -->
  <g transform="translate(96, 30)">
    <rect x="0" y="8" width="14" height="20" rx="3" fill="#f0f9ff" stroke="#374151" stroke-width="0.8"/>
    <rect x="3" y="0" width="8" height="10" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="0.6"/>
    <circle cx="7" cy="0" r="2" fill="#f97316" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Arrow showing teeth gluing inside -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="100" y1="56" x2="92" y2="58" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
