<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Finished crocodile (hero) — side view, mouth slightly open -->
  <!-- Bottom jaw -->
  <path d="M6,56 Q6,72 34,72 Q62,72 62,56 Z" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <!-- Top jaw -->
  <path d="M6,56 Q6,40 34,38 Q62,40 62,56 Z" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>

  <!-- Scale dots -->
  <circle cx="20" cy="46" r="1.5" fill="#16a34a" stroke="#374151" stroke-width="0.2"/>
  <circle cx="34" cy="44" r="1.5" fill="#16a34a" stroke="#374151" stroke-width="0.2"/>
  <circle cx="48" cy="46" r="1.5" fill="#16a34a" stroke="#374151" stroke-width="0.2"/>

  <!-- Teeth -->
  <polygon points="10,56 14,52 18,56 22,52 26,56 30,52 34,56 38,52 42,56 46,52 50,56 54,52 58,56" fill="white" stroke="#374151" stroke-width="0.5"/>
  <polygon points="10,56 14,60 18,56 22,60 26,56 30,60 34,56 38,60 42,56 46,60 50,56 54,60 58,56" fill="white" stroke="#374151" stroke-width="0.5"/>

  <!-- Googly eyes -->
  <circle cx="18" cy="42" r="5" fill="white" stroke="#374151" stroke-width="0.8"/>
  <circle cx="19" cy="43" r="2.5" fill="#374151"/>

  <!-- Nostril bumps -->
  <circle cx="8" cy="48" r="1.5" fill="#15803d" stroke="#374151" stroke-width="0.4"/>

  <!-- Long tail with spiky ridges -->
  <path d="M62,56 Q72,54 82,52 Q94,48 106,42 Q112,38 116,34" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
  <!-- Tail tip -->
  <path d="M116,34 L118,30" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>

  <!-- Spiky ridges along tail -->
  <polygon points="68,48 72,42 76,48" fill="#16a34a" stroke="#374151" stroke-width="0.5"/>
  <polygon points="80,46 84,40 88,46" fill="#16a34a" stroke="#374151" stroke-width="0.5"/>
  <polygon points="92,42 96,36 100,42" fill="#16a34a" stroke="#374151" stroke-width="0.5"/>
  <polygon points="104,38 108,32 112,38" fill="#16a34a" stroke="#374151" stroke-width="0.5"/>

  <!-- Belly colour -->
  <path d="M6,60 Q6,68 34,70 Q56,68 62,60" fill="#bbf7d0" stroke="none" opacity="0.5"/>

  <!-- Small legs -->
  <line x1="24" y1="72" x2="22" y2="82" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="70" x2="50" y2="80" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>

  <!-- Hand making it snap (as puppet) -->
  <g transform="translate(26, 78)">
    <rect x="0" y="0" width="12" height="18" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>
</svg>
