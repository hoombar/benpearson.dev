<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="4" y="108" width="112" height="8" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <!-- Single large drum (front view, hero element) -->
  <path d="M24 68 Q24 106 60 106 Q96 106 96 68" stroke="#374151" stroke-width="2.5" fill="#dbeafe"/>
  <line x1="24" y1="68" x2="96" y2="68" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Balloon skin (orange, stretched across top) -->
  <path d="M18 68 Q60 54 102 68" fill="#f97316" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Rubber band holding skin -->
  <ellipse cx="60" cy="68" rx="42" ry="6" fill="none" stroke="#22c55e" stroke-width="3"/>
  <!-- Spoon (hitting centre of drum) -->
  <!-- Spoon handle, tilted -->
  <line x1="78" y1="14" x2="58" y2="54" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <!-- Spoon bowl (ellipse at business end) -->
  <ellipse cx="56" cy="58" rx="8" ry="6" fill="#e5e7eb" stroke="#374151" stroke-width="2" transform="rotate(-30 56 58)"/>
  <!-- Impact point marker (small circle) -->
  <circle cx="60" cy="62" r="4" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <!-- Vibration rings radiating from impact -->
  <ellipse cx="60" cy="62" rx="12" ry="5" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
  <ellipse cx="60" cy="62" rx="22" ry="8" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>
  <ellipse cx="60" cy="62" rx="34" ry="12" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Sound wave arcs above drum -->
  <path d="M38 46 Q60 38 82 46" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M30 36 Q60 24 90 36" stroke="#374151" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>
