<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="4" y="106" width="112" height="8" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <!-- Three drums lined up: small (left), medium (centre), large (right) -->

  <!-- SMALL drum (left) - mug/cup sized -->
  <!-- Bowl body -->
  <path d="M14 70 Q14 104 28 104 Q42 104 42 70" stroke="#374151" stroke-width="2" fill="#dbeafe"/>
  <line x1="14" y1="70" x2="42" y2="70" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Balloon skin -->
  <path d="M10 70 Q28 62 46 70" fill="#f97316" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Rubber band -->
  <ellipse cx="28" cy="70" rx="18" ry="3" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <!-- High pitch label (small waves) -->
  <path d="M16 52 Q20 46 24 52 Q28 58 32 52 Q36 46 40 52" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- MEDIUM drum (centre) -->
  <path d="M42 60 Q42 104 60 104 Q78 104 78 60" stroke="#374151" stroke-width="2" fill="#dbeafe"/>
  <line x1="42" y1="60" x2="78" y2="60" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Balloon skin -->
  <path d="M38 60 Q60 50 82 60" fill="#f97316" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Rubber band -->
  <ellipse cx="60" cy="60" rx="22" ry="4" fill="none" stroke="#22c55e" stroke-width="2.5"/>

  <!-- LARGE drum (right) -->
  <path d="M78 46 Q78 104 98 104 Q118 104 118 46" stroke="#374151" stroke-width="2" fill="#dbeafe"/>
  <line x1="78" y1="46" x2="118" y2="46" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Balloon skin -->
  <path d="M74 46 Q98 34 122 46" fill="#f97316" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Rubber band -->
  <ellipse cx="98" cy="46" rx="24" ry="5" fill="none" stroke="#22c55e" stroke-width="2.5"/>

  <!-- Arrow showing pitch progression: high → low -->
  <line x1="28" y1="38" x2="96" y2="38" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4,3"/>
  <path d="M92 35 L98 38 L92 41" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
