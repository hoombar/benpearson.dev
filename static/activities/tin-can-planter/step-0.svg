<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Tin can being painted (hero) -->
  <g transform="translate(24, 18)">
    <!-- Can body -->
    <rect x="0" y="8" width="42" height="56" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <!-- Can top rim -->
    <ellipse cx="21" cy="8" rx="21" ry="6" fill="#60a5fa" stroke="#374151" stroke-width="1.2"/>
    <!-- Can bottom -->
    <ellipse cx="21" cy="64" rx="21" ry="5" fill="#2563eb" stroke="#374151" stroke-width="0.8"/>
    <!-- Unpainted patch -->
    <rect x="30" y="44" width="12" height="20" rx="1" fill="#d1d5db" stroke="none" opacity="0.5"/>
  </g>

  <!-- Paintbrush -->
  <g transform="translate(68, 38) rotate(20)">
    <rect x="0" y="-3" width="32" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pot -->
  <g transform="translate(86, 66)">
    <rect x="0" y="0" width="20" height="22" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
    <rect x="2" y="4" width="16" height="16" rx="1" fill="#3b82f6"/>
    <rect x="-1" y="-2" width="22" height="5" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Warning for sharp edges -->
  <g transform="translate(8, 4)">
    <polygon points="8,0 0,14 16,14" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <line x1="8" y1="4" x2="8" y2="9" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="8" cy="11.5" r="0.8" fill="#374151"/>
  </g>
</svg>
