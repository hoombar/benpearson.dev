<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Decorated can with soil and seeds (hero) -->
  <g transform="translate(22, 18)">
    <!-- Can body -->
    <rect x="0" y="8" width="46" height="60" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="23" cy="8" rx="23" ry="6" fill="#60a5fa" stroke="#374151" stroke-width="1.2"/>

    <!-- Decorations -->
    <circle cx="14" cy="48" r="3" fill="#fbbf24" stroke="#374151" stroke-width="0.3"/>
    <path d="M32,46 Q34,42 36,46 Q38,42 40,46 L36,52 Z" fill="#ef4444" stroke="#374151" stroke-width="0.3"/>

    <!-- Soil inside -->
    <ellipse cx="23" cy="8" rx="20" ry="4" fill="#78350f" stroke="#374151" stroke-width="0.5"/>
    <!-- Soil texture -->
    <circle cx="14" cy="7" r="1" fill="#5c2d0b" opacity="0.5"/>
    <circle cx="26" cy="9" r="1.2" fill="#5c2d0b" opacity="0.5"/>
    <circle cx="32" cy="7" r="0.8" fill="#5c2d0b" opacity="0.5"/>
  </g>

  <!-- Hand pushing seed into soil -->
  <g transform="translate(50, 2)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <!-- Seed at fingertip -->
    <ellipse cx="6" cy="22" rx="3" ry="4" fill="#78350f" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Arrow showing pushing seed in -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="56" y1="24" x2="52" y2="24" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Seed packet -->
  <g transform="translate(80, 38)">
    <rect x="0" y="0" width="24" height="34" rx="2" fill="#d1fae5" stroke="#374151" stroke-width="0.8"/>
    <!-- Seed drawing on packet -->
    <ellipse cx="12" cy="14" rx="5" ry="6" fill="#22c55e" stroke="#374151" stroke-width="0.5"/>
    <line x1="12" y1="20" x2="12" y2="28" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>
    <!-- Seeds spilling out -->
    <ellipse cx="20" cy="36" rx="2" ry="3" fill="#78350f" stroke="#374151" stroke-width="0.3"/>
    <ellipse cx="26" cy="38" rx="2" ry="3" fill="#78350f" stroke="#374151" stroke-width="0.3"/>
  </g>
</svg>
