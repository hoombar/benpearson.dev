<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Window background -->
  <rect x="0" y="0" width="120" height="100" fill="#e0f2fe"/>
  <!-- Window frame -->
  <rect x="0" y="0" width="120" height="4" fill="#d4a574" stroke="#374151" stroke-width="1"/>
  <line x1="60" y1="0" x2="60" y2="100" stroke="#d4a574" stroke-width="3"/>
  <!-- Windowsill -->
  <rect x="0" y="96" width="120" height="24" rx="2" fill="#d4a574" stroke="#374151" stroke-width="1.5"/>

  <!-- Sun through window -->
  <circle cx="96" cy="28" r="14" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  <!-- Sun rays -->
  <line x1="96" y1="10" x2="96" y2="6" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="110" y1="28" x2="114" y2="28" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="108" y1="16" x2="112" y2="12" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="108" y1="40" x2="112" y2="44" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Planter on windowsill with sprouts (hero) -->
  <g transform="translate(18, 38)">
    <!-- Can body -->
    <rect x="0" y="8" width="42" height="52" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="21" cy="8" rx="21" ry="5" fill="#60a5fa" stroke="#374151" stroke-width="1"/>

    <!-- Decorations -->
    <circle cx="12" cy="44" r="3" fill="#fbbf24" stroke="#374151" stroke-width="0.3"/>
    <path d="M28,42 Q30,38 32,42 Q34,38 36,42 L32,48 Z" fill="#ef4444" stroke="#374151" stroke-width="0.3"/>

    <!-- Soil -->
    <ellipse cx="21" cy="8" rx="18" ry="3.5" fill="#78350f" stroke="#374151" stroke-width="0.4"/>

    <!-- Green sprouts growing! -->
    <line x1="12" y1="8" x2="12" y2="-10" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
    <path d="M12,-10 Q8,-16 12,-14" fill="#22c55e" stroke="#22c55e" stroke-width="1"/>
    <path d="M12,-10 Q16,-16 12,-14" fill="#22c55e" stroke="#22c55e" stroke-width="1"/>

    <line x1="22" y1="8" x2="22" y2="-14" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
    <path d="M22,-14 Q18,-20 22,-18" fill="#22c55e" stroke="#22c55e" stroke-width="1"/>
    <path d="M22,-14 Q26,-20 22,-18" fill="#22c55e" stroke="#22c55e" stroke-width="1"/>

    <line x1="32" y1="8" x2="32" y2="-8" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
    <path d="M32,-8 Q28,-14 32,-12" fill="#22c55e" stroke="#22c55e" stroke-width="1"/>
    <path d="M32,-8 Q36,-14 32,-12" fill="#22c55e" stroke="#22c55e" stroke-width="1"/>
  </g>

  <!-- Watering spoon -->
  <g transform="translate(68, 58)">
    <!-- Spoon handle -->
    <rect x="10" y="2" width="30" height="4" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <!-- Spoon bowl -->
    <ellipse cx="6" cy="4" rx="8" ry="5" fill="#d1d5db" stroke="#374151" stroke-width="0.8"/>
    <!-- Water in spoon -->
    <ellipse cx="6" cy="3" rx="5" ry="3" fill="#93c5fd" stroke="none"/>
  </g>

  <!-- Water drops falling -->
  <path d="M70,64 Q68,70 66,72" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="1,2" stroke-linecap="round"/>
</svg>
