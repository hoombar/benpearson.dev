<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Decorated tin can (hero) -->
  <g transform="translate(22, 16)">
    <!-- Can body (painted blue) -->
    <rect x="0" y="8" width="46" height="60" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <!-- Can top rim -->
    <ellipse cx="23" cy="8" rx="23" ry="6" fill="#60a5fa" stroke="#374151" stroke-width="1.2"/>

    <!-- Decorations -->
    <!-- Flower drawing -->
    <circle cx="14" cy="28" r="4" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <circle cx="14" cy="28" r="1.5" fill="#92400e"/>
    <line x1="14" y1="32" x2="14" y2="42" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M14,38 Q10,36 8,38" fill="none" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>

    <!-- Heart -->
    <path d="M32,26 Q34,22 36,26 Q38,22 40,26 L36,32 Z" fill="#ef4444" stroke="#374151" stroke-width="0.4"/>

    <!-- Dots pattern -->
    <circle cx="10" cy="54" r="2" fill="#fbbf24" stroke="none"/>
    <circle cx="18" cy="52" r="2" fill="#22c55e" stroke="none"/>
    <circle cx="26" cy="54" r="2" fill="#ef4444" stroke="none"/>
    <circle cx="34" cy="52" r="2" fill="#a855f7" stroke="none"/>
    <circle cx="42" cy="54" r="2" fill="#fbbf24" stroke="none"/>

    <!-- Star sticker -->
    <polygon points="34,40 36,36 38,40 42,40 39,43 40,47 36,44 32,47 33,43 30,40" fill="#fbbf24" stroke="#374151" stroke-width="0.3"/>
  </g>

  <!-- Marker being used -->
  <g transform="translate(70, 34) rotate(20)">
    <rect x="0" y="-3" width="30" height="6" rx="2" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
    <rect x="-4" y="-2.5" width="5" height="5" rx="1" fill="#16a34a" stroke="#374151" stroke-width="0.4"/>
    <polygon points="-4,-1 -4,1 -6,0" fill="#22c55e"/>
  </g>

  <!-- Sticker sheet -->
  <g transform="translate(86, 68)">
    <rect x="0" y="0" width="22" height="22" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
    <polygon points="6,6 8,2 10,6 14,6 11,9 12,13 8,10 4,13 5,9 2,6" fill="#fbbf24" stroke="#374151" stroke-width="0.3"/>
    <circle cx="16" cy="16" r="3" fill="#ef4444" stroke="#374151" stroke-width="0.3"/>
  </g>
</svg>
