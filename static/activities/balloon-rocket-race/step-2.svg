<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- String stretched across -->
  <line x1="10" y1="46" x2="110" y2="46" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="10" cy="46" r="3" fill="#374151"/>
  <circle cx="110" cy="46" r="3" fill="#374151"/>
  <!-- Straw on string (hero) -->
  <rect x="50" y="40" width="20" height="12" rx="5" stroke="#374151" stroke-width="2" fill="#fbbf24"/>
  <!-- Inflated balloon attached to straw (hero) -->
  <!-- Balloon body (oval, red) -->
  <ellipse cx="60" cy="76" rx="34" ry="26" stroke="#374151" stroke-width="2.5" fill="#ef4444"/>
  <!-- Balloon highlight -->
  <ellipse cx="50" cy="64" rx="10" ry="7" fill="#fca5a5" opacity="0.5"/>
  <!-- Balloon neck pointing right (toward start/left, so air pushes right) -->
  <path d="M26 76 Q22 76 22 80 L22 84 Q22 88 26 88 L30 88 Q32 84 32 80 L32 76 Z"
        stroke="#374151" stroke-width="1.5" fill="#fca5a5"/>
  <!-- Tape strips attaching balloon to straw -->
  <rect x="54" y="40" width="12" height="14" rx="1" stroke="#374151" stroke-width="1" fill="#d1fae5" opacity="0.7"/>
  <line x1="54" y1="40" x2="66" y2="54" stroke="#374151" stroke-width="0.8"/>
  <line x1="54" y1="54" x2="66" y2="40" stroke="#374151" stroke-width="0.8"/>
  <!-- Second tape strip -->
  <rect x="54" y="46" width="12" height="8" rx="1" stroke="#374151" stroke-width="1.5" fill="#d1fae5" opacity="0.85"/>
  <!-- Arrow showing direction balloon neck faces (pointing left = pushes rocket right) -->
  <line x1="22" y1="80" x2="10" y2="80" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 77 L10 80 L14 83" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Direction of travel arrow (right) -->
  <line x1="98" y1="62" x2="112" y2="62" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <path d="M108 59 L112 62 L108 65" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
