<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Chair left (simple outline) -->
  <rect x="8" y="54" width="20" height="32" rx="2" stroke="#374151" stroke-width="2" fill="#e5e7eb"/>
  <rect x="8" y="46" width="20" height="10" rx="2" stroke="#374151" stroke-width="1.5" fill="#d1d5db"/>
  <line x1="12" y1="86" x2="12" y2="100" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="86" x2="24" y2="100" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Chair right -->
  <rect x="92" y="54" width="20" height="32" rx="2" stroke="#374151" stroke-width="2" fill="#e5e7eb"/>
  <rect x="92" y="46" width="20" height="10" rx="2" stroke="#374151" stroke-width="1.5" fill="#d1d5db"/>
  <line x1="96" y1="86" x2="96" y2="100" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="86" x2="108" y2="100" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- String tied between chair backs (hero element) -->
  <line x1="28" y1="50" x2="92" y2="50" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <!-- String knot at left chair -->
  <circle cx="28" cy="50" r="3" fill="#374151" stroke="#374151" stroke-width="1"/>
  <!-- String knot at right chair -->
  <circle cx="92" cy="50" r="3" fill="#374151" stroke="#374151" stroke-width="1"/>
  <!-- Tension arrows showing string pulled tight -->
  <line x1="44" y1="50" x2="44" y2="40" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="50" x2="60" y2="38" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="76" y1="50" x2="76" y2="40" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Taut indicator (upward arrows showing tension) -->
  <path d="M42 43 L44 38 L46 43" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M58 41 L60 36 L62 41" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Distance measurement brace -->
  <line x1="28" y1="110" x2="92" y2="110" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="106" x2="28" y2="114" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="92" y1="106" x2="92" y2="114" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 3m label area -->
  <rect x="48" y="104" width="24" height="12" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <text x="50" y="113" font-size="7" fill="#374151" font-family="monospace">3 m+</text>
</svg>
