<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="85" width="110" height="12" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Notepad / paper (hero — mission list) -->
  <rect x="20" y="12" width="55" height="72" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2.5"/>
  <!-- Spiral binding dots -->
  <circle cx="24" cy="20" r="1.5" fill="#374151" stroke="none"/>
  <circle cx="24" cy="30" r="1.5" fill="#374151" stroke="none"/>
  <circle cx="24" cy="40" r="1.5" fill="#374151" stroke="none"/>
  <circle cx="24" cy="50" r="1.5" fill="#374151" stroke="none"/>
  <circle cx="24" cy="60" r="1.5" fill="#374151" stroke="none"/>
  <circle cx="24" cy="70" r="1.5" fill="#374151" stroke="none"/>

  <!-- Written lines (classified messages) -->
  <line x1="30" y1="22" x2="62" y2="22" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="30" y1="32" x2="68" y2="32" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="30" y1="42" x2="58" y2="42" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="30" y1="52" x2="65" y2="52" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="30" y1="62" x2="55" y2="62" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Checkmarks next to some lines -->
  <path d="M28,30 L30,33 L34,27" stroke="#22c55e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M28,40 L30,43 L34,37" stroke="#22c55e" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Pen lying on table -->
  <line x1="45" y1="78" x2="75" y2="72" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="44" cy="78.5" r="1" fill="#374151" stroke="none"/>

  <!-- Spy cup telephone (small, to the right) -->
  <path d="M85,38 L83,58 Q83,61 92,61 Q101,61 101,58 L99,38 Q99,36 92,36 Q85,36 85,38 Z"
        fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="92" cy="60" rx="9" ry="2.5" fill="#f3f4f6" stroke="#374151" stroke-width="1"/>
  <!-- String dangling from cup -->
  <path d="M92,36 Q88,28 92,20 Q96,14 90,10" stroke="#d97706" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- "TOP SECRET" stamp effect (diagonal red rectangle) -->
  <g transform="translate(50, 45) rotate(-15)">
    <rect x="-18" y="-6" width="36" height="12" rx="1" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <!-- Decorative star -->
    <path d="M-14,0 L-12,-3 L-10,0 L-12,3 Z" fill="#ef4444" stroke="none"/>
    <path d="M10,0 L12,-3 L14,0 L12,3 Z" fill="#ef4444" stroke="none"/>
  </g>
</svg>
