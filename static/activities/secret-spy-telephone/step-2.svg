<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Floor surface -->
  <rect x="0" y="105" width="120" height="15" rx="0" fill="#e5e7eb" stroke="none"/>

  <!-- Left cup (held up as if speaking into it) -->
  <path d="M5,42 L3,65 Q3,68 14,68 Q25,68 25,65 L23,42 Q23,40 14,40 Q5,40 5,42 Z"
        fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <ellipse cx="14" cy="67" rx="11" ry="3" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>

  <!-- Sound waves from left cup (speaker) -->
  <path d="M4,48 Q-2,54 4,60" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M0,44 Q-8,54 0,64" fill="none" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>

  <!-- Taut string connecting both cups -->
  <line x1="14" y1="41" x2="106" y2="41" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>

  <!-- Vibration marks on string -->
  <path d="M40,38 Q45,34 50,38 Q55,42 60,38" stroke="#93c5fd" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M65,38 Q70,34 75,38 Q80,42 85,38" stroke="#93c5fd" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Right cup (held up to ear, listening) -->
  <path d="M95,42 L93,65 Q93,68 106,68 Q117,68 117,65 L115,42 Q115,40 106,40 Q95,40 95,42 Z"
        fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <ellipse cx="106" cy="67" rx="11" ry="3" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>

  <!-- Ear indication on right side (curved lines showing listening) -->
  <path d="M116,50 Q122,54 116,58" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left person (stick figure, minimal) -->
  <circle cx="14" cy="28" r="6" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="14" y1="34" x2="14" y2="80" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="80" x2="6" y2="105" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="80" x2="22" y2="105" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arm holding cup -->
  <line x1="14" y1="50" x2="8" y2="60" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right person (stick figure) -->
  <circle cx="106" cy="28" r="6" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="106" y1="34" x2="106" y2="80" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="106" y1="80" x2="98" y2="105" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="106" y1="80" x2="114" y2="105" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arm holding cup to ear -->
  <line x1="106" y1="50" x2="112" y2="60" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>
