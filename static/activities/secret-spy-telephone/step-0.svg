<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Table surface -->
  <rect x="5" y="95" width="110" height="12" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper cup (hero, upside down, large) -->
  <path d="M35,40 L30,90 Q30,94 60,94 Q90,94 90,90 L85,40 Q85,36 60,36 Q35,36 35,40 Z"
        fill="#f9fafb" stroke="#374151" stroke-width="2.5"/>
  <!-- Cup rim (now at the bottom since upside down) -->
  <ellipse cx="60" cy="93" rx="30" ry="5" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <!-- Cup bottom (now at top) — where the hole goes -->
  <ellipse cx="60" cy="38" rx="25" ry="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>

  <!-- Hole in centre of cup bottom -->
  <circle cx="60" cy="38" r="3" fill="#374151" stroke="none"/>

  <!-- Pen poking hole (coming from top-right) -->
  <g transform="translate(74, 22) rotate(30)">
    <!-- Pen body -->
    <rect x="-3" y="-28" width="6" height="30" rx="1.5" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <!-- Pen tip -->
    <polygon points="0,4 -3,2 3,2" fill="#374151" stroke="#374151" stroke-width="1"/>
    <!-- Pen cap clip -->
    <rect x="2" y="-26" width="1.5" height="10" rx="0.5" fill="#374151" stroke="none"/>
  </g>

  <!-- Downward arrow showing poking action -->
  <path d="M72,12 L66,26" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Second cup waiting nearby (smaller, perspective) -->
  <path d="M8,58 L6,82 Q6,85 16,85 Q26,85 26,82 L24,58 Q24,56 16,56 Q8,56 8,58 Z"
        fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="16" cy="57" rx="8" ry="2" fill="#f3f4f6" stroke="#374151" stroke-width="1"/>
</svg>
