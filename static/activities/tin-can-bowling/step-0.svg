<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Row of empty tin cans -->
  <g transform="translate(8, 30)">
    <!-- Can 1 -->
    <rect x="0" y="0" width="18" height="30" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="9" cy="0" rx="9" ry="3" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
    <rect x="2" y="8" width="14" height="14" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="0.5" opacity="0.5"/>
  </g>
  <g transform="translate(28, 30)">
    <!-- Can 2 -->
    <rect x="0" y="0" width="18" height="30" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="9" cy="0" rx="9" ry="3" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
    <rect x="2" y="8" width="14" height="14" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="0.5" opacity="0.5"/>
  </g>
  <g transform="translate(48, 30)">
    <!-- Can 3 -->
    <rect x="0" y="0" width="18" height="30" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="9" cy="0" rx="9" ry="3" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
    <rect x="2" y="8" width="14" height="14" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="0.5" opacity="0.5"/>
  </g>
  <g transform="translate(68, 30)">
    <!-- Can 4 -->
    <rect x="0" y="0" width="18" height="30" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="9" cy="0" rx="9" ry="3" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g transform="translate(88, 30)">
    <!-- Can 5 -->
    <rect x="0" y="0" width="18" height="30" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="9" cy="0" rx="9" ry="3" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Label being peeled off one can -->
  <path d="M50,44 Q56,42 58,46 Q60,50 56,52" fill="#f9fafb" stroke="#374151" stroke-width="0.6"/>

  <!-- Arrow showing peel direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M58,42 Q62,38 66,36" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Newspaper underneath -->
  <rect x="4" y="64" width="112" height="32" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="0.8"/>
  <line x1="10" y1="72" x2="50" y2="72" stroke="#d1d5db" stroke-width="0.5"/>
  <line x1="10" y1="76" x2="40" y2="76" stroke="#d1d5db" stroke-width="0.5"/>
  <line x1="10" y1="80" x2="45" y2="80" stroke="#d1d5db" stroke-width="0.5"/>
  <line x1="60" y1="72" x2="110" y2="72" stroke="#d1d5db" stroke-width="0.5"/>
  <line x1="60" y1="76" x2="100" y2="76" stroke="#d1d5db" stroke-width="0.5"/>
</svg>
