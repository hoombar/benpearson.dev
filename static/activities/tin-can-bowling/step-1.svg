<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Painted cans drying -->
  <g transform="translate(6, 28)">
    <!-- Can 1 - Red -->
    <rect x="0" y="0" width="18" height="30" rx="2" fill="#ef4444" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="9" cy="0" rx="9" ry="3" fill="#fca5a5" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g transform="translate(28, 28)">
    <!-- Can 2 - Blue with number -->
    <rect x="0" y="0" width="18" height="30" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="9" cy="0" rx="9" ry="3" fill="#93c5fd" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g transform="translate(50, 28)">
    <!-- Can 3 - Yellow -->
    <rect x="0" y="0" width="18" height="30" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="9" cy="0" rx="9" ry="3" fill="#fde68a" stroke="#374151" stroke-width="0.8"/>
    <!-- Spots decoration -->
    <circle cx="5" cy="12" r="2" fill="#ef4444" stroke="#374151" stroke-width="0.4"/>
    <circle cx="13" cy="18" r="2" fill="#ef4444" stroke="#374151" stroke-width="0.4"/>
    <circle cx="9" cy="8" r="2" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
  </g>
  <g transform="translate(72, 28)">
    <!-- Can 4 - Green with stripes -->
    <rect x="0" y="0" width="18" height="30" rx="2" fill="#22c55e" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="9" cy="0" rx="9" ry="3" fill="#86efac" stroke="#374151" stroke-width="0.8"/>
    <line x1="0" y1="10" x2="18" y2="10" stroke="#fbbf24" stroke-width="2"/>
    <line x1="0" y1="20" x2="18" y2="20" stroke="#fbbf24" stroke-width="2"/>
  </g>
  <g transform="translate(94, 28)">
    <!-- Can 5 - Purple (being painted) -->
    <rect x="0" y="0" width="18" height="30" rx="2" fill="#a78bfa" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="9" cy="0" rx="9" ry="3" fill="#c4b5fd" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Paintbrush -->
  <g transform="translate(96, 10) rotate(15)">
    <rect x="-2" y="-22" width="5" height="18" rx="1.5" fill="#f97316" stroke="#374151" stroke-width="0.8"/>
    <rect x="-3" y="-6" width="7" height="4" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.5"/>
    <rect x="-4" y="-2" width="9" height="6" rx="1" fill="#a78bfa" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Paint pots -->
  <rect x="8" y="68" width="14" height="14" rx="2" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
  <rect x="26" y="68" width="14" height="14" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
  <rect x="44" y="68" width="14" height="14" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  <rect x="62" y="68" width="14" height="14" rx="2" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
  <rect x="80" y="68" width="14" height="14" rx="2" fill="#a78bfa" stroke="#374151" stroke-width="0.8"/>
</svg>
