<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Dragon body strip being painted (hero, upside down — bumps up) -->
  <g transform="translate(10, 32)">
    <rect x="0" y="10" width="68" height="12" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <!-- Bumpy cups (painted green) -->
    <ellipse cx="9" cy="10" rx="8" ry="10" fill="#22c55e" stroke="#374151" stroke-width="1"/>
    <ellipse cx="26" cy="10" rx="8" ry="10" fill="#22c55e" stroke="#374151" stroke-width="1"/>
    <ellipse cx="43" cy="10" rx="8" ry="10" fill="#16a34a" stroke="#374151" stroke-width="1"/>
    <ellipse cx="60" cy="10" rx="8" ry="10" fill="#22c55e" stroke="#374151" stroke-width="1"/>
    <!-- Scale dots -->
    <circle cx="9" cy="6" r="1.5" fill="#16a34a" stroke="#374151" stroke-width="0.3"/>
    <circle cx="26" cy="6" r="1.5" fill="#15803d" stroke="#374151" stroke-width="0.3"/>
    <circle cx="60" cy="6" r="1.5" fill="#16a34a" stroke="#374151" stroke-width="0.3"/>
    <!-- Yellow belly -->
    <rect x="0" y="18" width="68" height="6" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Head cup being painted -->
  <g transform="translate(84, 30)">
    <ellipse cx="10" cy="12" rx="10" ry="12" fill="#22c55e" stroke="#374151" stroke-width="1"/>
    <rect x="0" y="12" width="20" height="10" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
    <circle cx="10" cy="8" r="1.5" fill="#16a34a" stroke="#374151" stroke-width="0.3"/>
  </g>

  <!-- Paintbrush -->
  <g transform="translate(60, 14) rotate(25)">
    <rect x="0" y="-3" width="26" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pots -->
  <g transform="translate(6, 74)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
    <rect x="2" y="3" width="12" height="11" rx="1" fill="#22c55e"/>
  </g>
  <g transform="translate(26, 74)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
    <rect x="2" y="3" width="12" height="11" rx="1" fill="#fbbf24"/>
  </g>
</svg>
