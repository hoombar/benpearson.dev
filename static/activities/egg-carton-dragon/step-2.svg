<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Dragon body with spikes (hero) -->
  <g transform="translate(10, 40)">
    <!-- Body base -->
    <rect x="0" y="14" width="68" height="12" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <!-- Bumpy cups -->
    <ellipse cx="9" cy="14" rx="8" ry="10" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="26" cy="14" rx="8" ry="10" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="43" cy="14" rx="8" ry="10" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="60" cy="14" rx="8" ry="10" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <!-- Yellow belly -->
    <rect x="0" y="22" width="68" height="5" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>

    <!-- Paper triangle spikes along top -->
    <polygon points="9,4 5,-6 13,-6" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
    <polygon points="26,4 22,-6 30,-6" fill="#f97316" stroke="#374151" stroke-width="0.6"/>
    <polygon points="43,4 39,-6 47,-6" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
    <polygon points="60,4 56,-6 64,-6" fill="#f97316" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Pointed tail -->
  <path d="M78,54 L96,48 Q104,44 108,38" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <polygon points="108,38 104,32 112,34" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
  <!-- Tail spike -->
  <polygon points="108,34 106,28 114,30" fill="#ef4444" stroke="#374151" stroke-width="0.5"/>

  <!-- PVA glue -->
  <g transform="translate(86, 62)">
    <rect x="0" y="8" width="14" height="20" rx="3" fill="#f0f9ff" stroke="#374151" stroke-width="0.8"/>
    <rect x="3" y="0" width="8" height="10" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="0.6"/>
    <circle cx="7" cy="0" r="2" fill="#f97316" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Extra triangle pieces -->
  <polygon points="12,86 8,76 16,76" fill="#ef4444" stroke="#374151" stroke-width="0.5"/>
  <polygon points="28,86 24,76 32,76" fill="#f97316" stroke="#374151" stroke-width="0.5"/>

  <!-- Scissors -->
  <g transform="translate(38, 76)">
    <path d="M0,0 L12,4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L12,-4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.2" fill="#374151"/>
    <ellipse cx="15" cy="5" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1"/>
    <ellipse cx="15" cy="-5" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1"/>
  </g>
</svg>
