<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Dragon body -->
  <g transform="translate(30, 46)">
    <rect x="0" y="12" width="56" height="10" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.7"/>
    <ellipse cx="8" cy="12" rx="7" ry="9" fill="#22c55e" stroke="#374151" stroke-width="0.7"/>
    <ellipse cx="22" cy="12" rx="7" ry="9" fill="#22c55e" stroke="#374151" stroke-width="0.7"/>
    <ellipse cx="36" cy="12" rx="7" ry="9" fill="#22c55e" stroke="#374151" stroke-width="0.7"/>
    <ellipse cx="50" cy="12" rx="7" ry="9" fill="#22c55e" stroke="#374151" stroke-width="0.7"/>
    <rect x="0" y="18" width="56" height="5" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <!-- Spikes -->
    <polygon points="8,3 5,-4 11,-4" fill="#ef4444" stroke="#374151" stroke-width="0.5"/>
    <polygon points="22,3 19,-4 25,-4" fill="#f97316" stroke="#374151" stroke-width="0.5"/>
    <polygon points="36,3 33,-4 39,-4" fill="#ef4444" stroke="#374151" stroke-width="0.5"/>
    <polygon points="50,3 47,-4 53,-4" fill="#f97316" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Tail -->
  <path d="M86,58 L98,52 Q104,48 108,42" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <polygon points="108,42 104,36 112,38" fill="#22c55e" stroke="#374151" stroke-width="0.5"/>

  <!-- Dragon head (hero) -->
  <g transform="translate(6, 38)">
    <ellipse cx="14" cy="16" rx="14" ry="16" fill="#22c55e" stroke="#374151" stroke-width="1.2"/>
    <!-- Googly eyes -->
    <circle cx="8" cy="10" r="4" fill="white" stroke="#374151" stroke-width="0.6"/>
    <circle cx="9" cy="11" r="2" fill="#374151"/>
    <circle cx="18" cy="10" r="4" fill="white" stroke="#374151" stroke-width="0.6"/>
    <circle cx="19" cy="11" r="2" fill="#374151"/>
    <!-- Nostrils -->
    <circle cx="8" cy="20" r="1.2" fill="#15803d" stroke="#374151" stroke-width="0.4"/>
    <circle cx="16" cy="20" r="1.2" fill="#15803d" stroke="#374151" stroke-width="0.4"/>
    <!-- Mouth -->
    <path d="M4,24 Q12,28 22,24" fill="none" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- Fire breath (tissue paper flames) -->
  <path d="M4,54 Q-6,46 -10,38 Q-14,30 -8,24" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M6,58 Q-4,50 -8,42 Q-12,34 -6,28" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M8,56 Q0,48 -4,40 Q-8,32 -2,26" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Scale dots on body -->
  <circle cx="38" cy="54" r="1" fill="#16a34a" stroke="#374151" stroke-width="0.2"/>
  <circle cx="52" cy="54" r="1" fill="#16a34a" stroke="#374151" stroke-width="0.2"/>
  <circle cx="66" cy="54" r="1" fill="#16a34a" stroke="#374151" stroke-width="0.2"/>
  <circle cx="80" cy="54" r="1" fill="#16a34a" stroke="#374151" stroke-width="0.2"/>
</svg>
