<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Full egg carton -->
  <rect x="6" y="24" width="70" height="30" rx="2" fill="#d4a574" stroke="#374151" stroke-width="1.2"/>
  <!-- Egg carton cup bumps (top view) -->
  <circle cx="16" cy="34" r="7" fill="#c4956a" stroke="#374151" stroke-width="0.6"/>
  <circle cx="32" cy="34" r="7" fill="#c4956a" stroke="#374151" stroke-width="0.6"/>
  <circle cx="48" cy="34" r="7" fill="#c4956a" stroke="#374151" stroke-width="0.6"/>
  <circle cx="64" cy="34" r="7" fill="#c4956a" stroke="#374151" stroke-width="0.6"/>
  <circle cx="16" cy="48" r="7" fill="#c4956a" stroke="#374151" stroke-width="0.6"/>
  <circle cx="32" cy="48" r="7" fill="#c4956a" stroke="#374151" stroke-width="0.6"/>
  <circle cx="48" cy="48" r="7" fill="#c4956a" stroke="#374151" stroke-width="0.6"/>
  <circle cx="64" cy="48" r="7" fill="#c4956a" stroke="#374151" stroke-width="0.6"/>

  <!-- Cut lines showing where to cut body strip -->
  <rect x="8" y="26" width="64" height="14" rx="1" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Separate head cup already cut -->
  <g transform="translate(84, 30)">
    <circle cx="10" cy="10" r="9" fill="#c4956a" stroke="#374151" stroke-width="1"/>
    <rect x="1" y="10" width="18" height="8" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Scissors cutting -->
  <g transform="translate(42, 60) rotate(-10)">
    <path d="M0,0 L16,5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,0 L16,-5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#374151"/>
    <ellipse cx="20" cy="6" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <ellipse cx="20" cy="-6" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  </g>

  <!-- Cut strip result preview -->
  <g transform="translate(10, 78)">
    <circle cx="8" cy="8" r="7" fill="#c4956a" stroke="#374151" stroke-width="0.6"/>
    <circle cx="24" cy="8" r="7" fill="#c4956a" stroke="#374151" stroke-width="0.6"/>
    <circle cx="40" cy="8" r="7" fill="#c4956a" stroke="#374151" stroke-width="0.6"/>
    <circle cx="56" cy="8" r="7" fill="#c4956a" stroke="#374151" stroke-width="0.6"/>
    <rect x="1" y="0" width="62" height="16" rx="1" fill="none" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Warning -->
  <g transform="translate(100, 4)">
    <polygon points="8,0 0,14 16,14" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <line x1="8" y1="4" x2="8" y2="9" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="8" cy="11.5" r="0.8" fill="#374151"/>
  </g>
</svg>
