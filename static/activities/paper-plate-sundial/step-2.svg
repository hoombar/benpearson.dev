<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Paper Plate (hero) -->
  <ellipse cx="60" cy="65" rx="50" ry="40" fill="#f9fafb" stroke="#374151" stroke-width="2.5"/>
  <ellipse cx="60" cy="65" rx="35" ry="28" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Straw (Gnomon) -->
  <line x1="60" y1="65" x2="60" y2="25" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Tape holding straw underneath (represented by dashed lines) -->
  <path d="M50 75 L70 75" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2,2"/>
  <path d="M50 78 L70 78" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2,2"/>

  <!-- Action arrow pushing straw in -->
  <path d="M60,10 Q60,15 60,20" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>