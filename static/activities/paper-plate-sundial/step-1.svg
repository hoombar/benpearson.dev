  <line x1="25" y1="32" x2="25" y2="36" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25" y1="54" x2="25" y2="58" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Marker drawing -->
