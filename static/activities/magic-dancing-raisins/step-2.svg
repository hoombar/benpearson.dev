<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Table background -->
  <rect x="0" y="80" width="120" height="40" fill="#fef3c7" />
  <line x1="0" y1="80" x2="120" y2="80" stroke="#374151" stroke-width="2"/>
  
  <!-- Clear Glass -->
  <g transform="translate(45, 45)">
    <!-- Back lip -->
    <ellipse cx="15" cy="0" rx="12" ry="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <!-- Liquid inside glass -->
    <path d="M3,45 A12,4 0 0,0 27,45 L27,10 A12,4 0 0,1 3,10 Z" fill="#93c5fd" />
    <ellipse cx="15" cy="10" rx="12" ry="4" fill="#60a5fa" stroke="#3b82f6" stroke-width="1"/>
    
    <!-- Raisins in liquid sinking -->
    <!-- Sinking raisin 1 -->
    <g transform="translate(10, 20)">
      <ellipse cx="0" cy="0" rx="3" ry="2" fill="#4c1d95" stroke="#374151" stroke-width="1" transform="rotate(-15)"/>
      <line x1="0" y1="-8" x2="0" y2="-4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2,2"/>
    </g>
    <!-- Sinking raisin 2 -->
    <g transform="translate(20, 35)">
      <ellipse cx="0" cy="0" rx="3" ry="2" fill="#4c1d95" stroke="#374151" stroke-width="1" transform="rotate(30)"/>
      <line x1="0" y1="-10" x2="0" y2="-4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2,2"/>
    </g>
    <!-- Sinking raisin 3 -->
    <g transform="translate(14, 42)">
      <ellipse cx="0" cy="0" rx="3" ry="2" fill="#4c1d95" stroke="#374151" stroke-width="1" transform="rotate(10)"/>
    </g>

    <!-- Bubbles -->
    <circle cx="8" cy="30" r="1.5" fill="#ffffff" />
    <circle cx="22" cy="15" r="1" fill="#ffffff" />
    <circle cx="12" cy="12" r="2" fill="#ffffff" />

    <!-- Glass Front -->
    <path d="M3,0 L3,45 A12,4 0 0,0 27,45 L27,0" fill="#f3f4f6" fill-opacity="0.3" stroke="#374151" stroke-width="2"/>
    <line x1="8" y1="10" x2="8" y2="35" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="15" cy="0" rx="12" ry="4" fill="none" stroke="#374151" stroke-width="2"/>
  </g>

  <!-- Dropping Action -->
  <!-- Raisin falling -->
  <g transform="translate(60, 25)">
    <ellipse cx="0" cy="0" rx="4" ry="2.5" fill="#4c1d95" stroke="#374151" stroke-width="1.5" transform="rotate(-25)"/>
    <path d="M-1,0 Q0,0 1,0" stroke="#6d28d9" stroke-width="1" fill="none"/>
  </g>
  <!-- Raisin falling higher -->
  <g transform="translate(54, 12)">
    <ellipse cx="0" cy="0" rx="4" ry="2.5" fill="#4c1d95" stroke="#374151" stroke-width="1.5" transform="rotate(40)"/>
    <path d="M-1,0 Q0,0 1,0" stroke="#6d28d9" stroke-width="1" fill="none"/>
  </g>

  <!-- Downward arrows -->
  <line x1="42" y1="10" x2="48" y2="28" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
  <line x1="78" y1="10" x2="72" y2="28" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>

</svg>