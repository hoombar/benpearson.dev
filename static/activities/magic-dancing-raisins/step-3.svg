<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Table background -->
  <rect x="0" y="80" width="120" height="40" fill="#fef3c7" />
  <line x1="0" y1="80" x2="120" y2="80" stroke="#374151" stroke-width="2"/>
  
  <!-- Clear Glass (Hero Size) -->
  <g transform="translate(40, 30) scale(1.3)">
    <!-- Back lip -->
    <ellipse cx="15" cy="0" rx="12" ry="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <!-- Liquid inside glass -->
    <path d="M3,45 A12,4 0 0,0 27,45 L27,10 A12,4 0 0,1 3,10 Z" fill="#93c5fd" />
    <ellipse cx="15" cy="10" rx="12" ry="4" fill="#60a5fa" stroke="#3b82f6" stroke-width="1"/>
    
    <!-- Dancing Raisins -->
    
    <!-- Raisin 1: Going up -->
    <g transform="translate(8, 25)">
      <ellipse cx="0" cy="0" rx="3" ry="2" fill="#4c1d95" stroke="#374151" stroke-width="1" transform="rotate(-15)"/>
      <line x1="0" y1="5" x2="0" y2="10" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-dasharray="2,2"/>
      <!-- Bubbles attached -->
      <circle cx="-3" cy="-1" r="1" fill="#ffffff" />
      <circle cx="2" cy="-2" r="1" fill="#ffffff" />
      <circle cx="1" cy="2" r="0.5" fill="#ffffff" />
      <!-- Up arrow -->
      <line x1="-5" y1="8" x2="-5" y2="2" stroke="#374151" stroke-width="1" marker-end="url(#arr)" stroke-linecap="round"/>
    </g>

    <!-- Raisin 2: Going down -->
    <g transform="translate(20, 30)">
      <ellipse cx="0" cy="0" rx="3" ry="2" fill="#4c1d95" stroke="#374151" stroke-width="1" transform="rotate(30)"/>
      <line x1="0" y1="-8" x2="0" y2="-4" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-dasharray="2,2"/>
      <!-- Down arrow -->
      <line x1="5" y1="-5" x2="5" y2="1" stroke="#374151" stroke-width="1" marker-end="url(#arr)" stroke-linecap="round"/>
    </g>

    <!-- Raisin 3: Floating at top -->
    <g transform="translate(14, 12)">
      <ellipse cx="0" cy="0" rx="3" ry="2" fill="#4c1d95" stroke="#374151" stroke-width="1" transform="rotate(10)"/>
      <!-- Popping bubbles -->
      <path d="M-4,-4 L-2,-2 M4,-4 L2,-2 M0,-5 L0,-3" stroke="#ffffff" stroke-width="1" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Raisin 4: Sinking fast -->
    <g transform="translate(14, 40)">
      <ellipse cx="0" cy="0" rx="3" ry="2" fill="#4c1d95" stroke="#374151" stroke-width="1" transform="rotate(75)"/>
      <line x1="0" y1="-6" x2="0" y2="-3" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- Lots of Bubbles -->
    <circle cx="5" cy="35" r="1.5" fill="#ffffff" />
    <circle cx="22" cy="18" r="1" fill="#ffffff" />
    <circle cx="12" cy="22" r="2" fill="#ffffff" />
    <circle cx="18" cy="42" r="1" fill="#ffffff" />
    <circle cx="7" cy="15" r="1.5" fill="#ffffff" />
    <circle cx="25" cy="38" r="1" fill="#ffffff" />

    <!-- Glass Front -->
    <path d="M3,0 L3,45 A12,4 0 0,0 27,45 L27,0" fill="#f3f4f6" fill-opacity="0.3" stroke="#374151" stroke-width="1.5"/>
    <line x1="8" y1="10" x2="8" y2="35" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="15" cy="0" rx="12" ry="4" fill="none" stroke="#374151" stroke-width="1.5"/>
  </g>
</svg>