<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Table background -->
  <rect x="0" y="70" width="120" height="50" fill="#fef3c7" />
  <line x1="0" y1="70" x2="120" y2="70" stroke="#374151" stroke-width="2"/>
  
  <!-- Clear Glass -->
  <g transform="translate(20, 30)">
    <ellipse cx="15" cy="45" rx="12" ry="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <path d="M3,0 L3,45 A12,4 0 0,0 27,45 L27,0" fill="#f3f4f6" fill-opacity="0.5" stroke="#374151" stroke-width="2"/>
    <ellipse cx="15" cy="0" rx="12" ry="4" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
    <line x1="8" y1="10" x2="8" y2="35" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Bottle of Sparkling Water -->
  <g transform="translate(60, 15)">
    <!-- Base -->
    <path d="M-10,60 Q-14,60 -14,54 L-14,18 C-14,0 -5,0 -5,-10 L5,-10 C5,0 14,0 14,18 L14,54 Q14,60 8,60 Z" fill="#dbeafe" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <!-- Liquid level -->
    <path d="M-14,39 Q0,42 14,39 L14,54 Q14,60 8,60 L-8,60 Q-14,60 -14,54 Z" fill="#93c5fd" />
    <path d="M-14,39 Q0,42 14,39" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <!-- Label -->
    <rect x="-14" y="26" width="28" height="12" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/>
    <circle cx="0" cy="32" r="3" fill="#ef4444" stroke="#374151" stroke-width="1"/>
    <!-- Cap -->
    <rect x="-6" y="-14" width="12" height="6" rx="1" fill="#ef4444" stroke="#374151" stroke-width="2"/>
    <!-- Sparkles/bubbles in label -->
    <circle cx="-8" cy="32" r="1" fill="#3b82f6"/>
    <circle cx="8" cy="32" r="1" fill="#3b82f6"/>
  </g>

  <!-- Bowl of Raisins -->
  <g transform="translate(95, 65)">
    <!-- Bowl -->
    <path d="M-14,0 Q-14,12 0,12 Q14,12 14,0" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <!-- Raisins -->
    <ellipse cx="-4" cy="-2" rx="3" ry="2" fill="#4c1d95" stroke="#374151" stroke-width="1.5" transform="rotate(-15 -4 -2)"/>
    <ellipse cx="5" cy="-1" rx="3" ry="2" fill="#4c1d95" stroke="#374151" stroke-width="1.5" transform="rotate(20 5 -1)"/>
    <ellipse cx="0" cy="-6" rx="3" ry="2" fill="#4c1d95" stroke="#374151" stroke-width="1.5" transform="rotate(-45 0 -6)"/>
    <ellipse cx="-8" cy="-5" rx="3" ry="2" fill="#4c1d95" stroke="#374151" stroke-width="1.5" transform="rotate(30 -8 -5)"/>
    <ellipse cx="8" cy="-4" rx="3" ry="2" fill="#4c1d95" stroke="#374151" stroke-width="1.5" transform="rotate(-10 8 -4)"/>
    <!-- Highlight on raisins to make them wrinkled -->
    <path d="M-5,-2 Q-4,-2 -3,-2" stroke="#6d28d9" stroke-width="1" fill="none"/>
    <path d="M4,-1 Q5,-1 6,-1" stroke="#6d28d9" stroke-width="1" fill="none"/>
  </g>
</svg>