<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall background -->
  <rect x="0" y="0" width="120" height="120" fill="#f3f4f6" stroke="none"/>

  <!-- String stretched across -->
  <line x1="4" y1="20" x2="116" y2="24" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Flags hanging from string -->
  <!-- Flag 1 -->
  <g transform="translate(10, 22)">
    <line x1="0" y1="0" x2="0" y2="32" stroke="#d4a574" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="2,4 2,22 16,13" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
    <polygon points="8,9 9,12 12,12 10,14 11,17 8,15 5,17 6,14 4,12 7,12" fill="#fbbf24" stroke="#374151" stroke-width="0.3"/>
  </g>

  <!-- Flag 2 -->
  <g transform="translate(28, 23)">
    <line x1="0" y1="0" x2="0" y2="32" stroke="#d4a574" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="2,4 2,22 16,13" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>
    <line x1="4" y1="10" x2="12" y2="10" stroke="#ffffff" stroke-width="1"/>
    <line x1="4" y1="14" x2="14" y2="14" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Flag 3 -->
  <g transform="translate(46, 23)">
    <line x1="0" y1="0" x2="0" y2="32" stroke="#d4a574" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="2,4 2,22 16,13" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <path d="M9,10 Q9,7 11,7 Q13,7 13,10 Q13,13 9,16 Q5,13 5,10 Q5,7 7,7 Q9,7 9,10" fill="#ef4444" stroke="none"/>
  </g>

  <!-- Flag 4 -->
  <g transform="translate(64, 24)">
    <line x1="0" y1="0" x2="0" y2="32" stroke="#d4a574" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="2,4 2,22 16,13" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
    <circle cx="7" cy="10" r="1.5" fill="#ffffff"/>
    <circle cx="11" cy="14" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Flag 5 -->
  <g transform="translate(82, 24)">
    <line x1="0" y1="0" x2="0" y2="32" stroke="#d4a574" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="2,4 2,22 16,13" fill="#a78bfa" stroke="#374151" stroke-width="0.6"/>
    <path d="M6,10 L10,10 L10,14 L14,14" fill="none" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Flag 6 -->
  <g transform="translate(100, 25)">
    <line x1="0" y1="0" x2="0" y2="32" stroke="#d4a574" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="2,4 2,22 16,13" fill="#ec4899" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Bookshelf/surface below for context -->
  <rect x="0" y="76" width="120" height="8" rx="2" fill="#92400e" stroke="#374151" stroke-width="1"/>

  <!-- Small toys on shelf -->
  <!-- Teddy bear silhouette -->
  <circle cx="24" cy="94" r="8" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
  <circle cx="24" cy="84" r="6" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
  <circle cx="19" cy="80" r="2.5" fill="#d4a574" stroke="#374151" stroke-width="0.5"/>
  <circle cx="29" cy="80" r="2.5" fill="#d4a574" stroke="#374151" stroke-width="0.5"/>

  <!-- Books -->
  <rect x="60" y="84" width="6" height="16" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>
  <rect x="68" y="86" width="6" height="14" rx="1" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
  <rect x="76" y="84" width="6" height="16" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
</svg>
