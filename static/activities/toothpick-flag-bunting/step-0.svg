<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Coloured paper sheets -->
  <rect x="8" y="8" width="40" height="50" rx="2" fill="#ef4444" stroke="#374151" stroke-width="1"/>
  <rect x="14" y="12" width="40" height="50" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="20" y="16" width="40" height="50" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1"/>

  <!-- Cut triangles scattered -->
  <polygon points="68,20 80,20 74,8" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
  <polygon points="86,18 98,18 92,6" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
  <polygon points="70,40 82,40 76,28" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  <polygon points="88,36 100,36 94,24" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
  <polygon points="72,58 84,58 78,46" fill="#a78bfa" stroke="#374151" stroke-width="0.8"/>
  <polygon points="90,54 102,54 96,42" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
  <polygon points="68,76 80,76 74,64" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
  <polygon points="88,72 100,72 94,60" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  <polygon points="104,50 116,50 110,38" fill="#ec4899" stroke="#374151" stroke-width="0.8"/>

  <!-- Scissors -->
  <g transform="translate(36, 74) rotate(-10)">
    <path d="M0,0 L-14,4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L-14,-4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.2" fill="#374151"/>
    <ellipse cx="4" cy="3" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <ellipse cx="4" cy="-3" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  </g>

  <!-- Cut line on paper -->
  <line x1="28" y1="50" x2="50" y2="38" stroke="#374151" stroke-width="0.6" stroke-dasharray="2,2"/>
</svg>
