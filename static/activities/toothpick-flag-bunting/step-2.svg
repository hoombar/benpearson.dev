<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Flags being decorated with markers -->
  <!-- Flag 1 - star design -->
  <g transform="translate(10, 12)">
    <line x1="0" y1="0" x2="0" y2="54" stroke="#d4a574" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="2,6 2,30 22,18" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <!-- Star drawn on flag -->
    <polygon points="12,12 13,16 17,16 14,18 15,22 12,20 9,22 10,18 7,16 11,16" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Flag 2 - stripes design -->
  <g transform="translate(34, 12)">
    <line x1="0" y1="0" x2="0" y2="54" stroke="#d4a574" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="2,6 2,30 22,18" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
    <line x1="4" y1="14" x2="16" y2="14" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="4" y1="18" x2="18" y2="18" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="4" y1="22" x2="14" y2="22" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Flag 3 - heart design -->
  <g transform="translate(58, 12)">
    <line x1="0" y1="0" x2="0" y2="54" stroke="#d4a574" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="2,6 2,30 22,18" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <path d="M12,14 Q12,10 15,10 Q18,10 18,14 Q18,18 12,22 Q6,18 6,14 Q6,10 9,10 Q12,10 12,14 Z" fill="#ef4444" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Flag 4 - dots design -->
  <g transform="translate(82, 12)">
    <line x1="0" y1="0" x2="0" y2="54" stroke="#d4a574" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="2,6 2,30 22,18" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <circle cx="8" cy="14" r="2" fill="#ffffff" stroke="none"/>
    <circle cx="14" cy="18" r="2" fill="#ffffff" stroke="none"/>
    <circle cx="8" cy="22" r="2" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Marker in use -->
  <g transform="translate(76, 48) rotate(-30)">
    <rect x="0" y="0" width="5" height="24" rx="1.5" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <rect x="0.5" y="24" width="4" height="3" rx="1" fill="#374151" stroke="none"/>
  </g>

  <!-- More markers -->
  <g transform="translate(14, 76)">
    <rect x="0" y="0" width="4" height="20" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>
    <rect x="10" y="2" width="4" height="18" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
    <rect x="20" y="0" width="4" height="20" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <rect x="30" y="2" width="4" height="18" rx="1" fill="#a78bfa" stroke="#374151" stroke-width="0.6"/>
  </g>
</svg>
