<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate clock face -->
  <circle cx="56" cy="52" r="40" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <circle cx="56" cy="52" r="36" fill="none" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Number positions (all 12) -->
  <circle cx="56" cy="18" r="2.5" fill="#374151" stroke="none"/>
  <circle cx="73" cy="22" r="2" fill="#374151" stroke="none"/>
  <circle cx="86" cy="35" r="2" fill="#374151" stroke="none"/>
  <circle cx="90" cy="52" r="2.5" fill="#374151" stroke="none"/>
  <circle cx="86" cy="69" r="2" fill="#374151" stroke="none"/>
  <circle cx="73" cy="82" r="2" fill="#374151" stroke="none"/>
  <circle cx="56" cy="86" r="2.5" fill="#374151" stroke="none"/>
  <circle cx="39" cy="82" r="2" fill="#374151" stroke="none"/>
  <circle cx="26" cy="69" r="2" fill="#374151" stroke="none"/>
  <circle cx="22" cy="52" r="2.5" fill="#374151" stroke="none"/>
  <circle cx="26" cy="35" r="2" fill="#374151" stroke="none"/>
  <circle cx="39" cy="22" r="2" fill="#374151" stroke="none"/>

  <!-- Hour hand (short red, pointing to 3) -->
  <line x1="56" y1="52" x2="78" y2="52" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

  <!-- Minute hand (long blue, pointing to 12) -->
  <line x1="56" y1="52" x2="56" y2="22" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Centre fastener (paper clip) -->
  <circle cx="56" cy="52" r="3" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
  <circle cx="56" cy="52" r="1" fill="#374151" stroke="none"/>

  <!-- Rotation arrows showing hands can spin -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M46,46 Q42,50 46,56" fill="none" stroke="#374151" stroke-width="1" marker-end="url(#arr)" stroke-dasharray="2,2"/>

  <!-- Close-up detail: back of plate showing bent paper clip -->
  <rect x="84" y="6" width="32" height="28" rx="3" fill="#f3f4f6" stroke="#374151" stroke-width="1"/>
  <!-- Bent clip legs -->
  <line x1="98" y1="14" x2="92" y2="22" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="102" y1="14" x2="108" y2="22" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="100" cy="14" r="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>

  <!-- Arrow from main to detail -->
  <path d="M76,34 Q82,22 88,18" fill="none" stroke="#374151" stroke-width="0.8" marker-end="url(#arr)" stroke-dasharray="2,2"/>
</svg>