<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <!-- Hand -->
  <rect x="22" y="78" width="76" height="26" rx="6" fill="#fde8d0" stroke="#374151" stroke-width="2"/>
  <!-- Index finger -->
  <rect x="26" y="28" width="14" height="54" rx="7" fill="#fde8d0" stroke="#374151" stroke-width="2"/>
  <!-- Middle finger -->
  <rect x="44" y="20" width="14" height="62" rx="7" fill="#fde8d0" stroke="#374151" stroke-width="2"/>
  <!-- Ring finger -->
  <rect x="62" y="28" width="14" height="54" rx="7" fill="#fde8d0" stroke="#374151" stroke-width="2"/>
  <!-- Little finger - show loop being lifted over -->
  <rect x="80" y="36" width="12" height="46" rx="6" fill="#fde8d0" stroke="#374151" stroke-width="2"/>
  <!-- Lower loop on little finger being lifted -->
  <path d="M80,64 Q86,60 92,64" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arrow showing lift motion on little finger -->
  <path d="M86,62 Q86,48 86,36" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-linecap="round"/>
  <!-- Upper loop (stays) on other fingers -->
  <path d="M26,48 Q33,44 40,48" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M44,40 Q51,36 58,40" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M62,48 Q69,44 76,48" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Chain forming at back of hand (below palm) -->
  <path d="M30,104 Q40,110 50,104 Q60,98 70,104 Q80,110 90,104" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arrow pointing to chain -->
  <line x1="60" y1="115" x2="60" y2="108" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>
