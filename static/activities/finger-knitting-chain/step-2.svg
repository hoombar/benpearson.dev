<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Hand -->
  <rect x="22" y="80" width="76" height="28" rx="6" fill="#fde8d0" stroke="#374151" stroke-width="2"/>
  <!-- Index finger -->
  <rect x="26" y="30" width="14" height="54" rx="7" fill="#fde8d0" stroke="#374151" stroke-width="2"/>
  <!-- Middle finger -->
  <rect x="44" y="22" width="14" height="62" rx="7" fill="#fde8d0" stroke="#374151" stroke-width="2"/>
  <!-- Ring finger -->
  <rect x="62" y="30" width="14" height="54" rx="7" fill="#fde8d0" stroke="#374151" stroke-width="2"/>
  <!-- Little finger -->
  <rect x="80" y="38" width="12" height="46" rx="6" fill="#fde8d0" stroke="#374151" stroke-width="2"/>
  <!-- Lower loop (first row) - orange -->
  <line x1="26" y1="62" x2="92" y2="62" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="33" cy="57" r="4" fill="none" stroke="#f97316" stroke-width="2"/>
  <circle cx="51" cy="49" r="4" fill="none" stroke="#f97316" stroke-width="2"/>
  <circle cx="69" cy="57" r="4" fill="none" stroke="#f97316" stroke-width="2"/>
  <circle cx="86" cy="57" r="4" fill="none" stroke="#f97316" stroke-width="2"/>
  <!-- Upper loop (second row) - purple -->
  <line x1="26" y1="44" x2="92" y2="44" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="33" cy="39" r="4" fill="none" stroke="#a855f7" stroke-width="2"/>
  <circle cx="51" cy="31" r="4" fill="none" stroke="#a855f7" stroke-width="2"/>
  <circle cx="69" cy="39" r="4" fill="none" stroke="#a855f7" stroke-width="2"/>
  <circle cx="86" cy="42" r="4" fill="none" stroke="#a855f7" stroke-width="2"/>
  <!-- Labels -->
  <rect x="2" y="55" width="18" height="10" rx="2" fill="#fff7ed"/>
  <text x="3" y="63" font-size="5" fill="#f97316" font-family="sans-serif">row 1</text>
  <rect x="2" y="37" width="18" height="10" rx="2" fill="#faf5ff"/>
  <text x="3" y="45" font-size="5" fill="#a855f7" font-family="sans-serif">row 2</text>
</svg>
