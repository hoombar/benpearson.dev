<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <!-- Finished chain (hero) - long woven chain across the image -->
  <path d="M10,60 Q18,54 26,60 Q34,66 42,60 Q50,54 58,60 Q66,66 74,60 Q82,54 90,60 Q98,66 106,60 Q112,56 116,60"
    fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
  <!-- Chain texture lines (weave pattern) -->
  <path d="M10,60 Q18,66 26,60 Q34,54 42,60 Q50,66 58,60 Q66,54 74,60 Q82,66 90,60 Q98,54 106,60"
    fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Scissors cutting the yarn tail -->
  <g transform="translate(52,20) rotate(15)">
    <!-- Scissors body -->
    <circle cx="0" cy="0" r="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <circle cx="10" cy="0" r="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <!-- Blades -->
    <path d="M3,2 L20,14" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <path d="M3,-2 L20,-14" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Yarn tail being threaded through final loop -->
  <path d="M106,60 Q112,50 110,42" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,2"/>
  <!-- Final loop -->
  <circle cx="110" cy="38" r="6" fill="none" stroke="#f97316" stroke-width="2.5"/>
  <!-- Arrow showing threading through loop -->
  <path d="M108,50 Q112,44 110,38" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round"/>
  <!-- Finished bracelet suggestion (looped into circle) -->
  <circle cx="28" cy="95" r="16" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
  <path d="M13,88 Q20,82 28,88 Q36,94 44,88"
    fill="none" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Arrow from chain to bracelet -->
  <line x1="62" y1="70" x2="38" y2="82" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>
