<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Square paper laid flat (hero) -->
  <rect x="18" y="18" width="84" height="84" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Centre point dot -->
  <circle cx="60" cy="60" r="3" fill="#374151"/>
  <!-- Four triangular flaps folded to centre — shown as diagonal lines -->
  <!-- Top-left flap fold line -->
  <line x1="18" y1="18" x2="60" y2="60" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Top-right flap fold line -->
  <line x1="102" y1="18" x2="60" y2="60" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Bottom-left flap fold line -->
  <line x1="18" y1="102" x2="60" y2="60" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Bottom-right flap fold line -->
  <line x1="102" y1="102" x2="60" y2="60" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Folded flap triangles (filled) showing corners folded in -->
  <polygon points="18,18 60,18 60,60" fill="#bfdbfe" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
  <polygon points="102,18 102,60 60,60" fill="#fde68a" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
  <polygon points="18,102 60,102 60,60" fill="#86efac" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
  <!-- Arrows showing fold direction toward centre -->
  <path d="M28 28 L52 52" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M92 28 L68 52" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M28 92 L52 68" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M92 92 L68 68" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
