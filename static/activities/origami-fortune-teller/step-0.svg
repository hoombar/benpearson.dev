<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Original A4-ish rectangle -->
  <rect x="14" y="10" width="64" height="88" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Diagonal fold line from top-left to right edge -->
  <line x1="14" y1="10" x2="78" y2="74" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Triangle that becomes the square (shaded) -->
  <polygon points="14,10 78,10 78,74" fill="#bfdbfe" fill-opacity="0.5" stroke="#374151" stroke-width="1"/>
  <!-- Strip below triangle — to be cut off -->
  <rect x="14" y="74" width="64" height="24" rx="1" fill="#fde68a" fill-opacity="0.4" stroke="#374151" stroke-width="1" stroke-dasharray="4,2"/>
  <!-- Scissors icon on the cut line -->
  <line x1="14" y1="74" x2="78" y2="74" stroke="#374151" stroke-width="2" stroke-dasharray="6,3"/>
  <g transform="translate(96,74) rotate(-90)">
    <ellipse cx="0" cy="-8" rx="2.5" ry="6" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="0" cy="8" rx="2.5" ry="6" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="0" cy="-18" rx="4" ry="5" fill="none" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="0" cy="18" rx="4" ry="5" fill="none" stroke="#374151" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="2" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
  </g>
  <!-- Result arrow -->
  <path d="M100 50 L112 50" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Resulting square (small) -->
  <rect x="106" y="80" width="10" height="10" rx="1" fill="#bfdbfe" stroke="#374151" stroke-width="1.5"/>
</svg>
