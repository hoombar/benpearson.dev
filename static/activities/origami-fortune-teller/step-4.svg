<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Assembled fortune teller in open position held by fingers (hero) -->
  <!-- Two finger pockets visible — open position showing inner triangles -->
  <!-- Left pocket opening -->
  <path d="M20 60 L60 20 L60 60 Z" fill="#f87171" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M20 60 L60 100 L60 60 Z" fill="#4ade80" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right pocket opening -->
  <path d="M100 60 L60 20 L60 60 Z" fill="#60a5fa" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M100 60 L60 100 L60 60 Z" fill="#fbbf24" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Centre crease lines -->
  <line x1="20" y1="60" x2="100" y2="60" stroke="#374151" stroke-width="1.5"/>
  <line x1="60" y1="20" x2="60" y2="100" stroke="#374151" stroke-width="1.5"/>
  <!-- Number labels on inner triangles -->
  <text x="38" y="46" font-size="8" fill="white" font-family="monospace" font-weight="bold" text-anchor="middle">1</text>
  <text x="38" y="76" font-size="8" fill="white" font-family="monospace" font-weight="bold" text-anchor="middle">5</text>
  <text x="82" y="46" font-size="8" fill="white" font-family="monospace" font-weight="bold" text-anchor="middle">3</text>
  <text x="82" y="76" font-size="8" fill="white" font-family="monospace" font-weight="bold" text-anchor="middle">7</text>
  <!-- Finger/thumb tips in each pocket -->
  <!-- Left thumb -->
  <ellipse cx="18" cy="60" rx="8" ry="6" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <!-- Right index -->
  <ellipse cx="102" cy="60" rx="8" ry="6" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <!-- Top finger -->
  <ellipse cx="60" cy="18" rx="6" ry="8" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <!-- Bottom finger -->
  <ellipse cx="60" cy="102" rx="6" ry="8" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <!-- Open/close arrows -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="4" markerHeight="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M8 50 L14 56" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M8 70 L14 64" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
