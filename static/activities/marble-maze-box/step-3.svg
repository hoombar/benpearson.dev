<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="120" height="120" fill="#f3f4f6" stroke="none"/>

  <!-- Hands tilting the maze box (shown at angle) -->
  <!-- Box lid (tilted perspective) -->
  <g transform="translate(60,54) rotate(-8)">
    <rect x="-48" y="-36" width="96" height="72" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2"/>

    <!-- Maze walls inside -->
    <rect x="-48" y="-14" width="38" height="3" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
    <rect x="0" y="-14" width="28" height="3" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
    <rect x="-30" y="6" width="44" height="3" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-48" y="24" width="34" height="3" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
    <rect x="-2" y="24" width="30" height="3" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>

    <rect x="-4" y="-36" width="3" height="22" rx="1" fill="#f59e0b" stroke="#374151" stroke-width="0.8"/>
    <rect x="-24" y="-12" width="3" height="20" rx="1" fill="#f59e0b" stroke="#374151" stroke-width="0.8"/>
    <rect x="22" y="-12" width="3" height="20" rx="1" fill="#f59e0b" stroke="#374151" stroke-width="0.8"/>
    <rect x="-8" y="8" width="3" height="18" rx="1" fill="#f59e0b" stroke="#374151" stroke-width="0.8"/>

    <!-- START -->
    <circle cx="-40" cy="-28" r="3" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
    <!-- FINISH -->
    <circle cx="40" cy="30" r="3" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>

    <!-- Marble rolling through maze -->
    <circle cx="10" cy="-4" r="4" fill="#a855f7" stroke="#374151" stroke-width="1"/>
    <circle cx="8" cy="-6" r="1" fill="#f9fafb" stroke="none" opacity="0.7"/>
  </g>

  <!-- Motion lines showing tilt -->
  <path d="M16,30 Q14,26 18,22" fill="none" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M104,76 Q106,80 102,84" fill="none" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Tilt arrows -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M10,60 Q6,54 10,48" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M110,48 Q114,54 110,60" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Timer -->
  <circle cx="100" cy="14" r="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <line x1="100" y1="14" x2="100" y2="8" stroke="#ef4444" stroke-width="1" stroke-linecap="round"/>
  <line x1="100" y1="14" x2="106" y2="16" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <circle cx="100" cy="14" r="1" fill="#374151" stroke="none"/>
</svg>