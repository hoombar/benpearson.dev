<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Box lid with maze being built (top-down view, hero) -->
  <rect x="10" y="10" width="100" height="82" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2"/>

  <!-- Straw walls (maze layout) -->
  <!-- Horizontal walls -->
  <rect x="10" y="30" width="40" height="4" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="60" y="30" width="30" height="4" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="26" y="50" width="50" height="4" rx="1" fill="#22c55e" stroke="#374151" stroke-width="1"/>
  <rect x="10" y="70" width="36" height="4" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="58" y="70" width="32" height="4" rx="1" fill="#22c55e" stroke="#374151" stroke-width="1"/>

  <!-- Vertical walls -->
  <rect x="56" y="10" width="4" height="24" rx="1" fill="#f59e0b" stroke="#374151" stroke-width="1"/>
  <rect x="30" y="32" width="4" height="22" rx="1" fill="#f59e0b" stroke="#374151" stroke-width="1"/>
  <rect x="80" y="32" width="4" height="22" rx="1" fill="#f59e0b" stroke="#374151" stroke-width="1"/>
  <rect x="50" y="52" width="4" height="22" rx="1" fill="#f59e0b" stroke="#374151" stroke-width="1"/>

  <!-- START marker -->
  <circle cx="18" cy="18" r="4" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
  <!-- FINISH marker -->
  <circle cx="102" cy="84" r="4" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>

  <!-- Marble testing the path -->
  <circle cx="18" cy="40" r="4" fill="#a855f7" stroke="#374151" stroke-width="1"/>
  <!-- Marble shine -->
  <circle cx="16" cy="38" r="1" fill="#f9fafb" stroke="none" opacity="0.7"/>

  <!-- Tape strip being applied -->
  <rect x="56" y="52" width="4" height="3" rx="0.5" fill="#fde68a" stroke="#374151" stroke-width="0.4"/>
</svg>