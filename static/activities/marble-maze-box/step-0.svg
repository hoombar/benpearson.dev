<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Box lid (top-down view, hero) -->
  <rect x="12" y="14" width="96" height="78" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
  <!-- Inner area -->
  <rect x="16" y="18" width="88" height="70" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1" opacity="0.3"/>

  <!-- START label area (top-left) -->
  <circle cx="26" cy="28" r="6" fill="#22c55e" stroke="#374151" stroke-width="1.2"/>
  <!-- Arrow from start -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <!-- FINISH label area (bottom-right) -->
  <circle cx="94" cy="78" r="6" fill="#ef4444" stroke="#374151" stroke-width="1.2"/>

  <!-- Rough maze path drawn in pencil (planning) -->
  <path d="M26,34 L26,52 L50,52 L50,36 L74,36 L74,60 L40,60 L40,78 L80,78 L80,62 L94,62 L94,72"
        fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" stroke-linecap="round"/>

  <!-- Marker pen -->
  <line x1="104" y1="4" x2="98" y2="18" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="98" y1="18" x2="97" y2="22" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>