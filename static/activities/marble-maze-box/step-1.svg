<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Cut straws sorted by length -->
  <!-- Long straws -->
  <rect x="14" y="20" width="5" height="50" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="22" y="20" width="5" height="48" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="30" y="20" width="5" height="52" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>

  <!-- Medium straws -->
  <rect x="44" y="30" width="5" height="32" rx="2" fill="#22c55e" stroke="#374151" stroke-width="1"/>
  <rect x="52" y="30" width="5" height="30" rx="2" fill="#22c55e" stroke="#374151" stroke-width="1"/>
  <rect x="60" y="30" width="5" height="34" rx="2" fill="#22c55e" stroke="#374151" stroke-width="1"/>
  <rect x="68" y="30" width="5" height="28" rx="2" fill="#22c55e" stroke="#374151" stroke-width="1"/>

  <!-- Short straws -->
  <rect x="82" y="40" width="5" height="16" rx="2" fill="#f59e0b" stroke="#374151" stroke-width="1"/>
  <rect x="90" y="40" width="5" height="14" rx="2" fill="#f59e0b" stroke="#374151" stroke-width="1"/>
  <rect x="98" y="40" width="5" height="18" rx="2" fill="#f59e0b" stroke="#374151" stroke-width="1"/>

  <!-- Scissors -->
  <g transform="translate(70,82) rotate(0)">
    <path d="M0,0 L-14,-3" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M0,0 L-14,3" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none"/>
    <ellipse cx="2" cy="-3.5" rx="4.5" ry="3" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="2" cy="3.5" rx="4.5" ry="3" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="1.5" fill="#374151" stroke="none"/>
  </g>

  <!-- Straw offcuts -->
  <rect x="42" y="86" width="4" height="8" rx="1.5" fill="#3b82f6" stroke="#374151" stroke-width="0.5" opacity="0.5"/>
  <rect x="50" y="84" width="4" height="10" rx="1.5" fill="#22c55e" stroke="#374151" stroke-width="0.5" opacity="0.5"/>
</svg>