<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Cup interior view -->
  <ellipse cx="60" cy="50" rx="40" ry="15" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
  <path d="M20,50 L30,100 L90,100 L100,50 Z" fill="#dbeafe" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" opacity="0.3"/>
  
  <!-- String with knot -->
  <line x1="60" y1="110" x2="60" y2="90" stroke="#374151" stroke-width="2.5"/>
  <circle cx="60" cy="90" r="5" fill="#374151"/>
  <path d="M55,85 Q65,80 60,95 Q55,100 65,90" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>

  <!-- Action arrow for tightening -->
  <path d="M75,105 Q70,115 65,115" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>