<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Paper Cup (hero) -->
  <path d="M40,20 L80,20 L75,80 L45,80 Z" fill="#dbeafe" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="60" cy="20" rx="20" ry="5" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  
  <!-- Upside down cup to poke hole -->
  <g transform="translate(60, 60) rotate(180)">
    <path d="M-20,-30 L20,-30 L15,30 L-15,30 Z" fill="#dbeafe" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="0" cy="30" rx="15" ry="4" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  </g>

  <!-- Push pin -->
  <g transform="translate(60, 30) rotate(0)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M-5,0 L5,0 L4,-8 L-4,-8 Z" fill="#ef4444" stroke="#374151" stroke-width="2"/>
    <path d="M-4,-8 Q0,-12 4,-8 Z" fill="#ef4444" stroke="#374151" stroke-width="2"/>
  </g>

  <!-- Action arrow -->
  <path d="M60,10 Q60,15 60,20" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>