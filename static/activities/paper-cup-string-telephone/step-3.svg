<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Cup 1 (left) -->
  <g transform="translate(25, 60) rotate(-90)">
    <path d="M-15,-20 L15,-20 L12,20 L-12,20 Z" fill="#dbeafe" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-20" rx="15" ry="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Cup 2 (right) -->
  <g transform="translate(95, 60) rotate(90)">
    <path d="M-15,-20 L15,-20 L12,20 L-12,20 Z" fill="#dbeafe" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-20" rx="15" ry="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Tight string connecting them -->
  <line x1="25" y1="60" x2="95" y2="60" stroke="#374151" stroke-width="2" stroke-linecap="round"/>

  <!-- Sound waves from left cup -->
  <path d="M5,50 Q-5,60 5,70" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M10,45 Q-10,60 10,75" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Action arrows pulling apart -->
  <path d="M15,80 L5,80" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
  <path d="M105,80 L115,80" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>