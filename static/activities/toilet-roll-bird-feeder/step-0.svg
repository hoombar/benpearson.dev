<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Cardboard Tube (hero) -->
  <g transform="translate(60, 65)">
    <path d="M-15,-30 L15,-30 L15,30 L-15,30 Z" fill="#fbbf24" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-30" rx="15" ry="5" fill="#fde68a" stroke="#374151" stroke-width="2"/>
    
    <!-- String holes -->
    <circle cx="-8" cy="-22" r="1.5" fill="#374151"/>
    <circle cx="8" cy="-22" r="1.5" fill="#374151"/>
    
    <!-- String loop -->
    <path d="M-8,-22 Q0,-60 8,-22" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Push pin making the second hole -->
  <g transform="translate(68, 43) rotate(-30)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-3" y="-8" width="6" height="8" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Action arrow -->
  <path d="M80,35 Q75,45 70,45" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>