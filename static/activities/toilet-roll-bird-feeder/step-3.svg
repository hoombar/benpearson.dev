<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Branch -->
  <path d="M0,20 Q30,30 60,25 Q90,20 120,30" fill="none" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
  <path d="M60,25 Q70,40 80,45" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>

  <!-- Feeder hanging (hero) -->
  <g transform="translate(60, 65)">
    <!-- String loop -->
    <path d="M-8,-10 Q0,-45 8,-10" fill="none" stroke="#374151" stroke-width="1.5"/>
    <!-- Tube with seeds -->
    <rect x="-15" y="-10" width="30" height="40" fill="#d97706" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="-10" cy="5" r="1.5" fill="#374151"/>
    <circle cx="5" cy="15" r="1" fill="#374151"/>
    <circle cx="-5" cy="25" r="1.5" fill="#374151"/>
  </g>

  <!-- Bird visiting -->
  <g transform="translate(100, 70) scale(0.8)">
    <path d="M-15,0 Q-10,-15 5,-15 Q15,-15 20,0 Q15,15 -15,0" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <!-- Beak -->
    <path d="M-15,0 L-20,-3 L-15,-6" fill="#fde68a" stroke="#374151" stroke-width="1"/>
    <!-- Eye -->
    <circle cx="-10" cy="-8" r="1" fill="#374151"/>
    <!-- Wings -->
    <path d="M0,-15 Q10,-25 15,-10" fill="none" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Action arrow -->
  <path d="M110,40 Q105,55 105,65" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>