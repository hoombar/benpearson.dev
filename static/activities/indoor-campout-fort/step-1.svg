<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(60, 60)">
    <!-- Tube 1 (horizontal) -->
    <rect x="-35" y="-10" width="70" height="20" rx="4" fill="#d97706" stroke="#374151" stroke-width="2"/>
    <ellipse cx="-35" cy="0" rx="4" ry="10" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="35" cy="0" rx="4" ry="10" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
    
    <!-- Tube 2 (vertical) -->
    <rect x="-10" y="-35" width="20" height="70" rx="4" fill="#d97706" stroke="#374151" stroke-width="2"/>
    <ellipse cx="0" cy="-35" rx="10" ry="4" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="0" cy="35" rx="10" ry="4" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
    
    <!-- Movement arrows placing the vertical one -->
    <path d="M 0 -50 L 0 -40" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    <polygon points="0,-40 -3,-45 3,-45" fill="#374151"/>
  </g>
</svg>