<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(10, 20)">
    <!-- Back chair -->
    <rect x="70" y="30" width="8" height="50" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
    <rect x="70" y="30" width="30" height="8" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
    <rect x="92" y="30" width="8" height="50" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
    
    <!-- Front chair -->
    <rect x="10" y="30" width="8" height="50" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
    <rect x="10" y="30" width="30" height="8" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
    <rect x="32" y="30" width="8" height="50" fill="#d1d5db" stroke="#374151" stroke-width="2"/>

    <!-- Sheet draped over them -->
    <path d="M 0 80 Q 5 20 25 20 Q 55 30 85 20 Q 105 20 110 80" fill="#f8fafc" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Sheet fold lines for volume -->
    <path d="M 25 20 Q 30 50 15 80" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M 85 20 Q 80 50 95 80" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Books holding down corners -->
    <rect x="-5" y="70" width="15" height="10" rx="1" fill="#ef4444" stroke="#374151" stroke-width="1.5" transform="rotate(-10 0 75)"/>
    <rect x="100" y="70" width="15" height="10" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="1.5" transform="rotate(10 105 75)"/>
  </g>
</svg>