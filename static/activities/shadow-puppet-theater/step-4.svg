<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background -->
  <rect width="120" height="120" fill="#f9fafb"/>

  <!-- Script paper — cream/yellow, hero element -->
  <rect x="12" y="8" width="80" height="104" rx="3" fill="#fef9c3" stroke="#374151" stroke-width="2"/>
  <!-- Paper highlight edge -->
  <rect x="12" y="8" width="6" height="104" rx="2" fill="#fde68a"/>

  <!-- Scene 1 box — green (beginning) -->
  <rect x="20" y="18" width="64" height="24" rx="2" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Scene 1 label dot -->
  <circle cx="26" cy="23" r="4" fill="#22c55e"/>
  <!-- Scene 1 text lines -->
  <line x1="34" y1="23" x2="76" y2="23" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="29" x2="68" y2="29" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="35" x2="72" y2="35" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Scene 2 box — orange (middle) -->
  <rect x="20" y="48" width="64" height="24" rx="2" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <circle cx="26" cy="53" r="4" fill="#f97316"/>
  <!-- Scene 2 text lines -->
  <line x1="34" y1="53" x2="76" y2="53" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="59" x2="70" y2="59" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="65" x2="74" y2="65" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Scene 3 box — purple (end) -->
  <rect x="20" y="78" width="64" height="24" rx="2" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="26" cy="83" r="4" fill="#a78bfa"/>
  <!-- Scene 3 text lines -->
  <line x1="34" y1="83" x2="76" y2="83" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="89" x2="66" y2="89" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="95" x2="72" y2="95" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Pencil writing at scene 2 -->
  <g transform="translate(106,44) rotate(-20)">
    <!-- Pencil body -->
    <rect x="-4" y="-28" width="8" height="40" rx="2" fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>
    <!-- Pencil eraser end -->
    <rect x="-4" y="-28" width="8" height="7" rx="2" fill="#fca5a5" stroke="#374151" stroke-width="1"/>
    <!-- Metal band -->
    <rect x="-4" y="-22" width="8" height="4" rx="0" fill="#9ca3af"/>
    <!-- Pencil tip -->
    <path d="M-4,12 L0,22 L4,12 Z" fill="#fef3c7" stroke="#374151" stroke-width="1"/>
    <!-- Graphite tip -->
    <path d="M-1,18 L0,22 L1,18 Z" fill="#374151"/>
  </g>

  <!-- Writing motion arc from pencil to scene 2 -->
  <path d="M100,60 Q95,62 92,65" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>
  <polygon points="90,63 89,68 94,67" fill="#374151"/>
</svg>
