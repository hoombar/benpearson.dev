<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background -->
  <rect width="120" height="120" fill="#f9fafb"/>

  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Card paper sheet (the material) -->
  <rect x="8" y="10" width="72" height="88" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2"/>

  <!-- Character outline drawn on card — bold dragon/dinosaur silhouette -->
  <!-- Body -->
  <path d="M26,44 Q22,30 30,22 Q42,16 52,24 Q62,18 64,28 Q70,38 62,50 Q68,60 60,72 Q50,80 38,76 Q28,70 26,58 Z"
        fill="#374151" stroke="#374151" stroke-width="1.5"/>
  <!-- Spiky back -->
  <path d="M46,16 L50,8 L54,16 M54,16 L58,10 L62,18" fill="#374151" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Tail -->
  <path d="M26,58 Q18,66 14,76 Q20,74 26,72" fill="#374151" stroke="#374151" stroke-width="1.5"/>
  <!-- Eye (white dot on silhouette) -->
  <circle cx="36" cy="30" r="3" fill="#f9fafb"/>
  <!-- Feet bumps at bottom -->
  <ellipse cx="36" cy="76" rx="6" ry="4" fill="#374151"/>
  <ellipse cx="52" cy="78" rx="6" ry="4" fill="#374151"/>

  <!-- Dashed cut line around puppet body (follows the body outline) -->
  <path d="M26,44 Q22,30 30,22 Q42,16 52,24 Q62,18 64,28 Q70,38 62,50 Q68,60 60,72 Q50,80 38,76 Q28,70 26,58 Z"
        fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Scissors (hero, cutting the outline) — blades pointing toward outline -->
  <g transform="translate(82,22) rotate(200)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="14" y2="4" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-4" cy="-4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <circle cx="-4" cy="4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  </g>
</svg>
