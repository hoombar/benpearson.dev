<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background (room wall) -->
  <rect width="120" height="120" fill="#dbeafe"/>

  <!-- Floor -->
  <rect x="0" y="104" width="120" height="16" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Left doorframe pole -->
  <rect x="6" y="10" width="10" height="110" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
  <!-- Right doorframe pole -->
  <rect x="104" y="10" width="10" height="110" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="2"/>

  <!-- Top crossbar -->
  <rect x="6" y="10" width="108" height="8" rx="2" fill="#d97706" stroke="#374151" stroke-width="2"/>

  <!-- White sheet stretched between poles (hero) -->
  <rect x="16" y="18" width="88" height="72" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="2.5"/>

  <!-- Sheet folds/texture (subtle lines) -->
  <line x1="16" y1="36" x2="104" y2="36" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="16" y1="54" x2="104" y2="54" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="16" y1="72" x2="104" y2="72" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Corner tape dots (blue — attaching sheet to frame) -->
  <rect x="13" y="15" width="10" height="8" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
  <rect x="97" y="15" width="10" height="8" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
  <rect x="13" y="82" width="10" height="8" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
  <rect x="97" y="82" width="10" height="8" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>

  <!-- Sheet being pulled taut — arrows at bottom corners pointing outward/down -->
  <line x1="22" y1="92" x2="22" y2="100" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="19,98 22,103 25,98" fill="#374151"/>
  <line x1="98" y1="92" x2="98" y2="100" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="95,98 98,103 101,98" fill="#374151"/>
</svg>
