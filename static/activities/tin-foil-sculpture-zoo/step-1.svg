<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Table surface -->
  <rect x="5" y="95" width="110" height="12" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Flat foil sheet (before) -->
  <rect x="8" y="18" width="36" height="28" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <line x1="14" y1="22" x2="14" y2="42" stroke="#f9fafb" stroke-width="0.75" opacity="0.4"/>
  <line x1="26" y1="22" x2="26" y2="42" stroke="#f9fafb" stroke-width="0.75" opacity="0.4"/>

  <!-- Arrow showing transformation -->
  <path d="M48,32 L56,32" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Rolled sausage shape (middle stage) -->
  <rect x="62" y="28" width="48" height="8" rx="4" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <!-- Crinkle texture -->
  <line x1="68" y1="30" x2="70" y2="34" stroke="#374151" stroke-width="0.5"/>
  <line x1="78" y1="30" x2="80" y2="34" stroke="#374151" stroke-width="0.5"/>
  <line x1="88" y1="30" x2="90" y2="34" stroke="#374151" stroke-width="0.5"/>
  <line x1="98" y1="30" x2="100" y2="34" stroke="#374151" stroke-width="0.5"/>

  <!-- Arrow showing next transformation -->
  <path d="M86,42 L86,52" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Finished snake (hero, coiled shape) -->
  <!-- Snake body coil -->
  <path d="M24,90 Q14,90 14,80 Q14,70 28,70 Q42,70 42,80 Q42,88 32,90"
        fill="none" stroke="#d1d5db" stroke-width="5" stroke-linecap="round"/>
  <!-- Snake body continuation upward (head rising) -->
  <path d="M32,90 Q24,92 24,86" fill="none" stroke="#d1d5db" stroke-width="5" stroke-linecap="round"/>
  <!-- Snake head (raised) -->
  <path d="M48,60 Q50,56 54,58" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
  <path d="M28,70 Q36,62 48,60" fill="none" stroke="#d1d5db" stroke-width="5" stroke-linecap="round"/>
  <!-- Snake eyes -->
  <circle cx="52" cy="56" r="1.5" fill="#374151" stroke="none"/>
  <!-- Tongue -->
  <path d="M54,58 L60,56 L58,54" fill="none" stroke="#ef4444" stroke-width="1" stroke-linecap="round"/>
  <path d="M54,58 L60,60" fill="none" stroke="#ef4444" stroke-width="1" stroke-linecap="round"/>

  <!-- Crinkle texture on snake -->
  <line x1="20" y1="78" x2="22" y2="82" stroke="#374151" stroke-width="0.5"/>
  <line x1="32" y1="72" x2="34" y2="76" stroke="#374151" stroke-width="0.5"/>
  <line x1="38" y1="78" x2="40" y2="82" stroke="#374151" stroke-width="0.5"/>

  <!-- Second snake (smaller, coiled spiral from above) -->
  <path d="M88,72 Q78,72 78,80 Q78,88 88,88 Q98,88 98,82 Q98,76 92,76"
        fill="none" stroke="#d1d5db" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="92" cy="76" r="1" fill="#374151" stroke="none"/>
</svg>
