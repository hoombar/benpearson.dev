<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Cardboard base -->
  <rect x="8" y="44" width="104" height="66" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
  <!-- Fence lines drawn on cardboard -->
  <line x1="42" y1="44" x2="42" y2="110" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="76" y1="44" x2="76" y2="110" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="8" y1="78" x2="112" y2="78" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Snake in enclosure 1 (top-left) -->
  <path d="M16,62 Q12,62 12,56 Q12,50 20,50 Q28,50 28,56 Q28,60 22,62"
        fill="none" stroke="#d1d5db" stroke-width="3" stroke-linecap="round"/>
  <circle cx="20" cy="50" r="1" fill="#374151" stroke="none"/>

  <!-- Giraffe in enclosure 2 (top-centre) -->
  <ellipse cx="58" cy="68" rx="8" ry="4" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
  <path d="M62,64 Q64,52 63,46" fill="none" stroke="#d1d5db" stroke-width="3" stroke-linecap="round"/>
  <circle cx="63" cy="44" r="2.5" fill="#d1d5db" stroke="#374151" stroke-width="0.75"/>
  <circle cx="64.5" cy="43.5" r="0.75" fill="#374151" stroke="none"/>
  <line x1="52" y1="72" x2="52" y2="78" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="72" x2="56" y2="78" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="72" x2="60" y2="78" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="72" x2="64" y2="78" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>

  <!-- Dog in enclosure 3 (top-right) -->
  <ellipse cx="94" cy="62" rx="8" ry="4" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
  <ellipse cx="102" cy="58" rx="3.5" ry="2.5" fill="#d1d5db" stroke="#374151" stroke-width="0.75"/>
  <circle cx="103.5" cy="57.5" r="0.5" fill="#374151" stroke="none"/>
  <line x1="88" y1="66" x2="88" y2="74" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="92" y1="66" x2="92" y2="74" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="96" y1="66" x2="96" y2="74" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="100" y1="66" x2="100" y2="74" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M86,60 Q82,56 84,54" fill="none" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Penguin in enclosure 4 (bottom-left) -->
  <ellipse cx="24" cy="92" rx="6" ry="8" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <circle cx="24" cy="84" r="4" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
  <circle cx="25.5" cy="83" r="0.75" fill="#374151" stroke="none"/>
  <!-- Penguin beak -->
  <path d="M28,84 L32,85 L28,86" fill="#f59e0b" stroke="#374151" stroke-width="0.5"/>

  <!-- Owl in enclosure 5 (bottom-centre) -->
  <ellipse cx="58" cy="94" rx="6" ry="7" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <circle cx="55" cy="90" r="2.5" fill="none" stroke="#374151" stroke-width="1"/>
  <circle cx="61" cy="90" r="2.5" fill="none" stroke="#374151" stroke-width="1"/>
  <circle cx="55" cy="90" r="1" fill="#374151" stroke="none"/>
  <circle cx="61" cy="90" r="1" fill="#374151" stroke="none"/>
  <!-- Beak -->
  <path d="M57,93 L58,96 L59,93" fill="#f59e0b" stroke="#374151" stroke-width="0.5"/>

  <!-- Mouse in enclosure 6 (bottom-right) -->
  <ellipse cx="92" cy="96" rx="5" ry="3" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
  <circle cx="97" cy="94" r="2" fill="#d1d5db" stroke="#374151" stroke-width="0.75"/>
  <circle cx="98" cy="93.5" r="0.5" fill="#374151" stroke="none"/>
  <!-- Ears -->
  <circle cx="96" cy="91" r="1.5" fill="#d1d5db" stroke="#374151" stroke-width="0.5"/>
  <circle cx="99" cy="91.5" r="1.5" fill="#d1d5db" stroke="#374151" stroke-width="0.5"/>
  <!-- Tail -->
  <path d="M87,96 Q82,92 80,96" fill="none" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>

  <!-- "ZOO" label at top -->
  <rect x="36" y="28" width="48" height="14" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>
  <!-- Simple letter shapes -->
  <path d="M44,34 L50,34 L44,38 L50,38" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="58" cy="36" r="3" fill="none" stroke="#374151" stroke-width="1.5"/>
  <circle cx="66" cy="36" r="3" fill="none" stroke="#374151" stroke-width="1.5"/>
</svg>
