<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Giraffe sculpture (hero, large, centre) -->
  <!-- Body -->
  <ellipse cx="60" cy="68" rx="16" ry="8" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
  <!-- Long neck -->
  <path d="M68,62 Q72,40 70,20" fill="none" stroke="#d1d5db" stroke-width="6" stroke-linecap="round"/>
  <!-- Head -->
  <ellipse cx="70" cy="16" rx="6" ry="4" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <!-- Eye -->
  <circle cx="73" cy="15" r="1" fill="#374151" stroke="none"/>
  <!-- Horns -->
  <line x1="68" y1="12" x2="66" y2="6" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
  <circle cx="66" cy="5" r="1.5" fill="#d1d5db" stroke="#374151" stroke-width="0.75"/>
  <line x1="72" y1="12" x2="74" y2="6" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
  <circle cx="74" cy="5" r="1.5" fill="#d1d5db" stroke="#374151" stroke-width="0.75"/>

  <!-- Four legs -->
  <line x1="48" y1="74" x2="46" y2="98" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/>
  <line x1="54" y1="76" x2="52" y2="98" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/>
  <line x1="66" y1="76" x2="68" y2="98" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/>
  <line x1="72" y1="74" x2="74" y2="98" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/>
  <!-- Tail -->
  <path d="M44,66 Q38,60 36,64" fill="none" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>

  <!-- Crinkle texture -->
  <line x1="54" y1="66" x2="56" y2="70" stroke="#374151" stroke-width="0.5"/>
  <line x1="62" y1="64" x2="64" y2="68" stroke="#374151" stroke-width="0.5"/>
  <line x1="70" y1="38" x2="72" y2="42" stroke="#374151" stroke-width="0.5"/>
  <line x1="68" y1="48" x2="70" y2="52" stroke="#374151" stroke-width="0.5"/>

  <!-- Small dog sculpture (right, simpler) -->
  <ellipse cx="104" cy="78" rx="10" ry="5" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <!-- Dog head -->
  <ellipse cx="114" cy="72" rx="4" ry="3" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
  <circle cx="116" cy="71" r="0.75" fill="#374151" stroke="none"/>
  <!-- Dog legs -->
  <line x1="96" y1="82" x2="96" y2="96" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="82" x2="100" y2="96" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="108" y1="82" x2="108" y2="96" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="112" y1="82" x2="112" y2="96" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tail curled up -->
  <path d="M94,76 Q88,70 90,66" fill="none" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>

  <!-- Flat foil piece being shaped (top-left, showing process) -->
  <rect x="8" y="30" width="24" height="18" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <!-- Arrows showing corners being pulled down -->
  <line x1="10" y1="48" x2="10" y2="56" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <path d="M8 53 L10 57 L12 53" stroke="#374151" stroke-width="1" stroke-linecap="round" fill="none"/>
  <line x1="30" y1="48" x2="30" y2="56" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <path d="M28 53 L30 57 L32 53" stroke="#374151" stroke-width="1" stroke-linecap="round" fill="none"/>
</svg>
