<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="120" fill="#f9fafb"/>

  <!-- Floor surface -->
  <rect x="8" y="102" width="104" height="10" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>

  <!-- Triangle base: 3 tubes arranged as triangle base, front view -->
  <!-- Left base tube (horizontal) -->
  <rect x="10" y="88" width="44" height="13" rx="5" fill="#fef3c7" stroke="#374151" stroke-width="2.5"/>
  <line x1="24" y1="89" x2="24" y2="100" stroke="#fbbf24" stroke-width="0.9" stroke-dasharray="2,2" stroke-linecap="round"/>
  <line x1="36" y1="89" x2="36" y2="100" stroke="#fbbf24" stroke-width="0.9" stroke-dasharray="2,2" stroke-linecap="round"/>
  <ellipse cx="10" cy="94" rx="4" ry="6.5" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
  <ellipse cx="54" cy="94" rx="4" ry="6.5" fill="#fbbf24" stroke="#374151" stroke-width="2"/>

  <!-- Right base tube (horizontal) -->
  <rect x="66" y="88" width="44" height="13" rx="5" fill="#fef3c7" stroke="#374151" stroke-width="2.5"/>
  <line x1="80" y1="89" x2="80" y2="100" stroke="#fbbf24" stroke-width="0.9" stroke-dasharray="2,2" stroke-linecap="round"/>
  <line x1="92" y1="89" x2="92" y2="100" stroke="#fbbf24" stroke-width="0.9" stroke-dasharray="2,2" stroke-linecap="round"/>
  <ellipse cx="66" cy="94" rx="4" ry="6.5" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
  <ellipse cx="110" cy="94" rx="4" ry="6.5" fill="#fbbf24" stroke="#374151" stroke-width="2"/>

  <!-- Vertical tube left (front pillar) -->
  <rect x="24" y="52" width="13" height="40" rx="5" fill="#fef3c7" stroke="#374151" stroke-width="2.5"/>
  <line x1="26" y1="62" x2="36" y2="62" stroke="#fbbf24" stroke-width="0.9" stroke-dasharray="2,2" stroke-linecap="round"/>
  <line x1="26" y1="74" x2="36" y2="74" stroke="#fbbf24" stroke-width="0.9" stroke-dasharray="2,2" stroke-linecap="round"/>
  <ellipse cx="30" cy="52" rx="6.5" ry="4" fill="#fbbf24" stroke="#374151" stroke-width="2"/>

  <!-- Vertical tube right (front pillar) -->
  <rect x="83" y="52" width="13" height="40" rx="5" fill="#fef3c7" stroke="#374151" stroke-width="2.5"/>
  <line x1="85" y1="62" x2="95" y2="62" stroke="#fbbf24" stroke-width="0.9" stroke-dasharray="2,2" stroke-linecap="round"/>
  <line x1="85" y1="74" x2="95" y2="74" stroke="#fbbf24" stroke-width="0.9" stroke-dasharray="2,2" stroke-linecap="round"/>
  <ellipse cx="89" cy="52" rx="6.5" ry="4" fill="#fbbf24" stroke="#374151" stroke-width="2"/>

  <!-- Vertical tube back-centre (third pillar, slightly behind) -->
  <rect x="52" y="46" width="13" height="44" rx="5" fill="#fef9c3" stroke="#374151" stroke-width="2"/>
  <ellipse cx="58" cy="46" rx="6.5" ry="4" fill="#fde68a" stroke="#374151" stroke-width="1.8"/>

  <!-- Tape joints — where tubes meet (highlight in blue) -->
  <!-- Bottom-left joint -->
  <ellipse cx="30" cy="90" rx="8" ry="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" opacity="0.9"/>
  <!-- Bottom-right joint -->
  <ellipse cx="89" cy="90" rx="8" ry="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" opacity="0.9"/>
  <!-- Back-centre joint -->
  <ellipse cx="58" cy="88" rx="8" ry="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8" opacity="0.8"/>

  <!-- Tape roll (corner) -->
  <circle cx="107" cy="20" r="11" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
  <circle cx="107" cy="20" r="5" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <!-- Tape peel -->
  <path d="M107 9 Q114 5 116 14" stroke="#93c5fd" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- "x2" label area showing tape-twice instruction -->
  <rect x="6" y="20" width="26" height="16" rx="3" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="9" y1="26" x2="29" y2="26" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="9" y1="31" x2="22" y2="31" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
</svg>
