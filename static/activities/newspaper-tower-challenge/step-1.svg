<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="120" fill="#f9fafb"/>

  <!-- Notebook / scrap paper -->
  <rect x="14" y="8" width="84" height="100" rx="3" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
  <!-- Notebook binding edge -->
  <rect x="14" y="8" width="10" height="100" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <!-- Binding holes -->
  <circle cx="19" cy="25" r="2.5" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
  <circle cx="19" cy="45" r="2.5" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
  <circle cx="19" cy="65" r="2.5" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
  <circle cx="19" cy="85" r="2.5" fill="#d1d5db" stroke="#374151" stroke-width="1"/>

  <!-- Sketch 1: wide-base tower (left column) -->
  <!-- Tower outline filled with warm yellow -->
  <path d="M32 95 L44 28 L56 95 Z" fill="#fef3c7" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <!-- Internal level lines -->
  <line x1="36" y1="72" x2="52" y2="72" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="38" y1="55" x2="50" y2="55" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="40" y1="41" x2="48" y2="41" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Diagonal braces (blue) -->
  <line x1="36" y1="72" x2="44" y2="55" stroke="#3b82f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="52" y1="72" x2="44" y2="55" stroke="#3b82f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="38" y1="55" x2="44" y2="41" stroke="#3b82f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="50" y1="55" x2="44" y2="41" stroke="#3b82f6" stroke-width="1" stroke-linecap="round"/>

  <!-- Sketch 2: alternative tower with wider taper (right column) -->
  <path d="M66 95 L82 22 L98 95 Z" fill="#fef9c3" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <!-- Level lines -->
  <line x1="71" y1="74" x2="93" y2="74" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="73" y1="55" x2="91" y2="55" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="76" y1="40" x2="88" y2="40" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Diagonal braces (green — alternative design) -->
  <line x1="71" y1="74" x2="82" y2="55" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>
  <line x1="93" y1="74" x2="82" y2="55" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>

  <!-- Star on chosen design (Sketch 1) indicating "picked favourite" -->
  <path d="M44 14 L46 9 L48 14 L53 14 L49 17 L51 22 L46 19 L41 22 L43 17 L39 14 Z"
        fill="#fde68a" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Pencil tool (top-right) -->
  <g transform="rotate(-40 100 18)">
    <rect x="88" y="12" width="6" height="22" rx="1" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/>
    <rect x="88" y="10" width="6" height="4" rx="0" fill="#fbbf24" stroke="#374151" stroke-width="1.2"/>
    <path d="M88 34 L91 40 L94 34 Z" fill="#f97316" stroke="#374151" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Eraser -->
    <rect x="88" y="8" width="6" height="3" rx="1" fill="#fca5a5" stroke="#374151" stroke-width="1"/>
  </g>
</svg>
