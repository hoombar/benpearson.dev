<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="120" fill="#f9fafb"/>

  <!-- Flat newspaper sheet (top-left) -->
  <rect x="6" y="8" width="48" height="36" rx="1" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
  <!-- Column text lines -->
  <line x1="9" y1="15" x2="51" y2="15" stroke="#d97706" stroke-width="0.7" stroke-dasharray="3,1.5" stroke-linecap="round"/>
  <line x1="9" y1="20" x2="51" y2="20" stroke="#d97706" stroke-width="0.7" stroke-dasharray="3,1.5" stroke-linecap="round"/>
  <line x1="9" y1="25" x2="51" y2="25" stroke="#d97706" stroke-width="0.7" stroke-dasharray="3,1.5" stroke-linecap="round"/>
  <line x1="9" y1="30" x2="51" y2="30" stroke="#d97706" stroke-width="0.7" stroke-dasharray="3,1.5" stroke-linecap="round"/>
  <line x1="9" y1="35" x2="51" y2="35" stroke="#d97706" stroke-width="0.7" stroke-dasharray="3,1.5" stroke-linecap="round"/>
  <!-- Column dividers -->
  <line x1="23" y1="10" x2="23" y2="42" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="37" y1="10" x2="37" y2="42" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Ruler laid diagonally across the sheet -->
  <rect x="8" y="13" width="40" height="6" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1.5" transform="rotate(-20 28 16)"/>
  <!-- Ruler tick marks -->
  <line x1="15" y1="11" x2="15" y2="14" stroke="#374151" stroke-width="0.8" transform="rotate(-20 28 16)"/>
  <line x1="22" y1="11" x2="22" y2="14" stroke="#374151" stroke-width="0.8" transform="rotate(-20 28 16)"/>
  <line x1="29" y1="11" x2="29" y2="14" stroke="#374151" stroke-width="0.8" transform="rotate(-20 28 16)"/>
  <line x1="36" y1="11" x2="36" y2="14" stroke="#374151" stroke-width="0.8" transform="rotate(-20 28 16)"/>

  <!-- Curved rolling action arrow — marker auto-aligns to tangent (12,14) = right-down -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M56 26 Q68 14 80 28" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Finished tube 1 — horizontal cylinder (bottom-left) -->
  <rect x="7" y="68" width="45" height="14" rx="6" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
  <!-- Tube surface column lines -->
  <line x1="18" y1="69" x2="18" y2="81" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="2,2" stroke-linecap="round"/>
  <line x1="29" y1="69" x2="29" y2="81" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="2,2" stroke-linecap="round"/>
  <line x1="40" y1="69" x2="40" y2="81" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="2,2" stroke-linecap="round"/>
  <!-- Left end cap ellipse -->
  <ellipse cx="7" cy="75" rx="4" ry="7" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <!-- Right end cap ellipse -->
  <ellipse cx="52" cy="75" rx="4" ry="7" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <!-- Tape band on tube -->
  <rect x="22" y="68" width="8" height="14" rx="1" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" opacity="0.85"/>

  <!-- Finished tube 2 (bottom-right, slightly angled) -->
  <g transform="rotate(-8 90 82)">
    <rect x="65" y="72" width="45" height="14" rx="6" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
    <line x1="76" y1="73" x2="76" y2="85" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="2,2" stroke-linecap="round"/>
    <line x1="87" y1="73" x2="87" y2="85" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="2,2" stroke-linecap="round"/>
    <line x1="98" y1="73" x2="98" y2="85" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="2,2" stroke-linecap="round"/>
    <ellipse cx="65" cy="79" rx="4" ry="7" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="110" cy="79" rx="4" ry="7" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
    <rect x="82" y="72" width="8" height="14" rx="1" fill="#fde68a" stroke="#f59e0b" stroke-width="1" opacity="0.85"/>
  </g>

  <!-- Tube pile suggestion (bottom-centre, third tube slightly behind) -->
  <rect x="28" y="90" width="45" height="14" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
  <ellipse cx="28" cy="97" rx="4" ry="7" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <ellipse cx="73" cy="97" rx="4" ry="7" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>

  <!-- Roll of tape (top-right) -->
  <circle cx="97" cy="26" r="13" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
  <circle cx="97" cy="26" r="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <!-- Tape strip peeling off -->
  <path d="M97 13 Q107 8 111 18" stroke="#93c5fd" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
