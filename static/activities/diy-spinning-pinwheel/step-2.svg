<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Square base with 4 cut flaps visible -->
  <rect x="20" y="16" width="80" height="80" rx="2" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <!-- Cut lines (4 diagonal slits) -->
  <line x1="20" y1="16" x2="48" y2="44" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="100" y1="16" x2="72" y2="44" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="100" y1="96" x2="72" y2="68" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="96" x2="48" y2="68" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 4 coloured triangular flaps (every other one folded toward centre) -->
  <!-- Flap 1 (top-left): folded to centre, shown as coloured triangle pointing right -->
  <path d="M20 16 L48 44 L60 56 Z" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <!-- Flap 3 (bottom-right): folded to centre -->
  <path d="M100 96 L72 68 L60 56 Z" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  <!-- Unfolded flap 2 (top-right) stays flat -->
  <path d="M100 16 L72 44 L60 56 Z" fill="#f59e0b" stroke="#374151" stroke-width="1" fill-opacity="0.4"/>
  <!-- Unfolded flap 4 (bottom-left) stays flat -->
  <path d="M20 96 L48 68 L60 56 Z" fill="#22c55e" stroke="#374151" stroke-width="1" fill-opacity="0.4"/>
  <!-- Arrow showing flap 4 being brought to centre -->
  <path d="M32 82 Q48 70 57 58" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
  <!-- Arrow showing flap 2 being brought to centre (from top-right) -->
  <path d="M88 30 Q72 42 63 54" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
  <!-- Centre tape piece -->
  <rect x="54" y="50" width="12" height="12" rx="2" stroke="#374151" stroke-width="1.5" fill="#dbeafe"/>
</svg>
