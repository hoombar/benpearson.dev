<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Perfect square with X diagonal crease lines and cut-stop dots -->
  <!-- Square -->
  <rect x="16" y="10" width="88" height="88" rx="2" stroke="#374151" stroke-width="2" fill="white"/>
  <!-- Light diagonal stripes as decoration hint -->
  <line x1="16" y1="30" x2="36" y2="10" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="52" x2="58" y2="10" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="74" x2="80" y2="10" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="98" x2="104" y2="24" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="98" x2="104" y2="46" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="74" y1="98" x2="104" y2="68" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Diagonal crease lines (dashed, from corner to corner) -->
  <line x1="16" y1="10" x2="104" y2="98" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" stroke-linecap="round"/>
  <line x1="104" y1="10" x2="16" y2="98" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" stroke-linecap="round"/>
  <!-- Centre point -->
  <circle cx="60" cy="54" r="3" stroke="#374151" stroke-width="1.5" fill="white"/>
  <!-- 4 cut-stop dots (1.5 cm from centre along each crease) -->
  <circle cx="49" cy="43" r="3.5" fill="#374151"/>
  <circle cx="71" cy="43" r="3.5" fill="#374151"/>
  <circle cx="71" cy="65" r="3.5" fill="#374151"/>
  <circle cx="49" cy="65" r="3.5" fill="#374151"/>
  <!-- Cut lines from each corner to the dot -->
  <line x1="16" y1="10" x2="49" y2="43" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="104" y1="10" x2="71" y2="43" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="104" y1="98" x2="71" y2="65" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="98" x2="49" y2="65" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Label "STOP" dots highlighted with small circles -->
  <circle cx="49" cy="43" r="6" stroke="#374151" stroke-width="1.5" fill="none"/>
  <circle cx="71" cy="43" r="6" stroke="#374151" stroke-width="1.5" fill="none"/>
  <circle cx="71" cy="65" r="6" stroke="#374151" stroke-width="1.5" fill="none"/>
  <circle cx="49" cy="65" r="6" stroke="#374151" stroke-width="1.5" fill="none"/>
</svg>
