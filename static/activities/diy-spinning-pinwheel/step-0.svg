<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Sheet of paper with bold diagonal stripes (hero) -->
  <rect x="14" y="8" width="72" height="90" rx="2" stroke="#374151" stroke-width="2" fill="white"/>
  <!-- Diagonal stripes decorating the paper -->
  <line x1="14" y1="24" x2="32" y2="8" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="14" y1="40" x2="50" y2="8" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <line x1="14" y1="56" x2="68" y2="8" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="14" y1="72" x2="86" y2="8" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="98" x2="86" y2="26" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="98" x2="86" y2="44" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="98" x2="86" y2="62" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="68" y1="98" x2="86" y2="80" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <!-- Dashed cut line showing where to cut off the strip at bottom-right -->
  <line x1="14" y1="90" x2="86" y2="18" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3" stroke-linecap="round"/>
  <!-- Strip being removed (small trapezoid at corner) -->
  <path d="M86 18 L96 8 L96 98 L86 98 Z" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <!-- Scissors cutting along the diagonal -->
  <g transform="translate(90, 60) rotate(-45)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="14" y2="4" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-5" cy="-4" r="4" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
    <circle cx="-5" cy="4" r="4" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
  </g>
</svg>
