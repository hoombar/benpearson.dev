<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="120" fill="#f9fafb"/>

  <!-- Marker defs — auto-align all arrowheads to path direction -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Sheet of paper (hero, white/light grey) -->
  <rect x="18" y="8" width="74" height="96" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>

  <!-- Step 1 fold: lengthways centre fold (dashed) -->
  <line x1="55" y1="10" x2="55" y2="102" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3" stroke-linecap="round"/>

  <!-- Fold arrow: right half folding over to left — tangent at (52,30) = (52−62,30−26) = (−10,4) -->
  <path d="M82 30 Q62 26 52 30" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Top-left corner fold line -->
  <line x1="18" y1="8" x2="55" y2="44" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,4" stroke-linecap="round"/>
  <!-- Top-right corner fold line -->
  <line x1="92" y1="8" x2="55" y2="44" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,4" stroke-linecap="round"/>

  <!-- Arrow: top-left corner moving down-right — tangent at (48,40) = (48−38,40−26) = (10,14) -->
  <path d="M24 14 Q38 26 48 40" stroke="#374151" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Arrow: top-right corner moving down-left — tangent at (62,40) = (62−72,40−26) = (−10,14) -->
  <path d="M86 14 Q72 26 62 40" stroke="#374151" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Second fold: dart wings fold lines -->
  <line x1="18" y1="44" x2="55" y2="72" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" stroke-linecap="round"/>
  <line x1="92" y1="44" x2="55" y2="72" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" stroke-linecap="round"/>

  <!-- Wing fold arrow — tangent at (48,66) = (48−40,66−58) = (8,8) = 45° right-down -->
  <path d="M32 48 Q40 58 48 66" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Result inset: completed dart airplane (bottom-right corner) -->
  <rect x="76" y="80" width="36" height="32" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
  <path d="M80 110 L112 96 L80 82 Z" fill="#f3f4f6" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="80" y1="92" x2="110" y2="96" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" stroke-linecap="round"/>
  <line x1="80" y1="100" x2="110" y2="96" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" stroke-linecap="round"/>
</svg>
