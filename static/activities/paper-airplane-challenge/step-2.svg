<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="120" fill="#f9fafb"/>

  <!-- STEP: decorate planes with names, numbers, flame designs -->

  <!-- Plane 1 (left, hero, large — being decorated) -->
  <!-- Body -->
  <path d="M8 88 L58 62 L72 72 L58 82 L8 88" fill="#f3f4f6" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Wing top surface (lighter) -->
  <path d="M22 88 L58 66 L66 70" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Fold crease line on wing -->
  <line x1="22" y1="88" x2="62" y2="68" stroke="#374151" stroke-width="1" stroke-dasharray="3,2" stroke-linecap="round"/>

  <!-- Flame decoration on plane body -->
  <path d="M14 82 Q16 78 12 74 Q18 76 16 70 Q22 74 20 70 Q26 72 24 68 L36 72 L34 82 Z"
        fill="#f97316" stroke="#d97706" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Flame inner highlight -->
  <path d="M18 80 Q20 76 17 73 Q21 75 20 71 L28 74 L27 80 Z"
        fill="#fde68a" stroke="#f59e0b" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- Racing number circle on tail -->
  <circle cx="54" cy="76" r="8" fill="#3b82f6" stroke="#374151" stroke-width="2"/>
  <!-- Number "1" represented as a bold line (no text allowed) -->
  <line x1="54" y1="70" x2="54" y2="82" stroke="#f9fafb" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 73 L54 70" stroke="#f9fafb" stroke-width="2" stroke-linecap="round"/>

  <!-- Plane 2 (background right, smaller — another fleet member) -->
  <g transform="translate(52, 8) rotate(10 30 30)">
    <path d="M8 52 L44 36 L56 44 L44 52 L8 52" fill="#e5e7eb" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <path d="M18 52 L44 40 L50 44" fill="#d1fae5" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Star decoration on plane 2 -->
    <path d="M22 46 L24 40 L26 46 L32 46 L27 50 L29 56 L24 52 L19 56 L21 50 L16 46 Z"
          fill="#fde68a" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Number "2" circle -->
    <circle cx="40" cy="46" r="6" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <line x1="37" y1="42" x2="43" y2="42" stroke="#f9fafb" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="43" y1="42" x2="43" y2="46" stroke="#f9fafb" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="37" y1="46" x2="43" y2="46" stroke="#f9fafb" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="37" y1="46" x2="37" y2="50" stroke="#f9fafb" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="37" y1="50" x2="43" y2="50" stroke="#f9fafb" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Marker pen being used to decorate (held at top-right) -->
  <g transform="rotate(-40 100 25)">
    <rect x="95" y="14" width="8" height="26" rx="3" fill="#f97316" stroke="#374151" stroke-width="1.8"/>
    <rect x="95" y="12" width="8" height="4" rx="1" fill="#d97706" stroke="#374151" stroke-width="1.2"/>
    <!-- Cap off (pen is in use) -->
    <rect x="95" y="40" width="8" height="10" rx="2" fill="#d97706" stroke="#374151" stroke-width="1.2"/>
    <!-- Nib -->
    <path d="M95 40 L99 46 L103 40 Z" fill="#374151" stroke="#374151" stroke-width="0.8" stroke-linejoin="round"/>
  </g>

  <!-- Star trophy indicator (top-left — champion identity) -->
  <path d="M14 14 L17 7 L20 14 L27 14 L22 19 L24 26 L17 22 L10 26 L12 19 L7 14 Z"
        fill="#fde68a" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
