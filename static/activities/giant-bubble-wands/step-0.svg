<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Shallow bowl/tray (hero) -->
  <line x1="14" y1="72" x2="106" y2="72" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M14 72 Q14 100 60 100 Q106 100 106 72" stroke="#374151" stroke-width="2.5" fill="#dbeafe"/>
  <!-- Bubble solution fill (soapy blue) -->
  <path d="M16 72 Q16 96 60 96 Q104 96 104 72" fill="#93c5fd" opacity="0.4"/>
  <!-- Washing-up liquid bottle -->
  <path d="M16,38 C16,28 20,26 20,20 L36,20 C36,26 40,28 40,38 L40,62 Q40,66 36,66 L20,66 Q16,66 16,62 Z"
        stroke="#374151" stroke-width="2" fill="#22c55e"/>
  <rect x="22" y="16" width="12" height="6" rx="2" stroke="#374151" stroke-width="1.5" fill="#166534"/>
  <!-- Squirt arrow from bottle to bowl -->
  <path d="M38 50 Q52 56 46 70" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Water jug (right side) -->
  <rect x="74" y="30" width="28" height="38" rx="3" stroke="#374151" stroke-width="2" fill="#dbeafe"/>
  <path d="M102 42 Q110 38 110 48 Q110 56 102 52" stroke="#374151" stroke-width="1.5" fill="none"/>
  <rect x="80" y="26" width="16" height="6" rx="2" stroke="#374151" stroke-width="1.5" fill="#93c5fd"/>
  <!-- Pour arrow from jug to bowl -->
  <path d="M76 66 Q70 72 62 72" stroke="#3b82f6" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Spoon stirring gently -->
  <line x1="62" y1="58" x2="60" y2="80" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="59" cy="84" rx="7" ry="4.5" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <!-- Gentle swirl in solution (not frothy) -->
  <path d="M48 82 Q56 78 64 82 Q70 86 64 90" stroke="#3b82f6" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
