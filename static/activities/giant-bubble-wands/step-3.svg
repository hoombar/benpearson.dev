<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Giant wand (hero, long handle) -->
  <line x1="18" y1="114" x2="18" y2="60" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round"/>
  <!-- Giant loop (10+ cm) -->
  <circle cx="18" cy="38" r="22" stroke="#c4b5fd" stroke-width="4" fill="none"/>
  <!-- Lock wrap -->
  <circle cx="18" cy="60" r="5" fill="#a78bfa" stroke="#374151" stroke-width="1.5"/>
  <!-- Enormous bubble floating away (upper right, hero) -->
  <circle cx="82" cy="50" r="36" stroke="#374151" stroke-width="1.5" fill="#dbeafe" opacity="0.25"/>
  <circle cx="82" cy="50" r="36" stroke="#93c5fd" stroke-width="2" fill="none"/>
  <!-- Iridescent shimmer bands -->
  <path d="M50 36 Q82 24 114 36" stroke="#c4b5fd" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M48 46 Q82 34 116 46" stroke="#86efac" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M50 56 Q82 46 114 56" stroke="#fde68a" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M52 66 Q82 58 112 66" stroke="#fca5a5" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Highlight -->
  <ellipse cx="66" cy="32" rx="12" ry="7" fill="white" opacity="0.35"/>
  <!-- Waving motion arrow -->
  <path d="M20 90 Q10 80 20 70" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Smaller bubbles trailing behind the big one -->
  <circle cx="44" cy="16" r="8" stroke="#93c5fd" stroke-width="1.5" fill="#dbeafe" opacity="0.3"/>
  <circle cx="106" cy="18" r="5" stroke="#c4b5fd" stroke-width="1.5" fill="#dbeafe" opacity="0.3"/>
</svg>
