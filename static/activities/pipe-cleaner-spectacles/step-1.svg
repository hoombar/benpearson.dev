<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Left lens frame (circle) -->
  <circle cx="34" cy="46" r="20" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>

  <!-- Right lens frame (circle) -->
  <circle cx="82" cy="46" r="20" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>

  <!-- Nose bridge being wrapped (hero) -->
  <line x1="54" y1="46" x2="62" y2="46" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <!-- Wrapping detail -->
  <path d="M54,44 Q58,42 62,44" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <path d="M54,48 Q58,50 62,48" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

  <!-- Hands wrapping bridge -->
  <g transform="translate(50, 26)">
    <rect x="0" y="0" width="8" height="16" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g transform="translate(60, 26)">
    <rect x="0" y="0" width="8" height="16" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrow showing wrapping -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M58,30 Q54,36 56,42" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Small pipe cleaner piece for bridge -->
  <g transform="translate(78, 80)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <!-- Scissors nearby -->
    <g transform="translate(30, -6)">
      <path d="M0,0 L10,3" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M0,0 L10,-3" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="1" fill="#374151"/>
      <ellipse cx="13" cy="4" rx="3" ry="2.5" fill="none" stroke="#ef4444" stroke-width="0.8"/>
      <ellipse cx="13" cy="-4" rx="3" ry="2.5" fill="none" stroke="#ef4444" stroke-width="0.8"/>
    </g>
  </g>
</svg>
