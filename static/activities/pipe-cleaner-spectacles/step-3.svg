<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Face outline (wearing spectacles — hero) -->
  <ellipse cx="60" cy="50" rx="34" ry="42" fill="#fcd9b6" stroke="#374151" stroke-width="1.2"/>

  <!-- Hair -->
  <path d="M26,30 Q30,8 60,6 Q90,8 94,30" fill="#92400e" stroke="#374151" stroke-width="0.8"/>

  <!-- Spectacles on face -->
  <!-- Left lens (heart shape!) -->
  <path d="M40,40 Q32,34 32,44 Q32,50 40,56 Q48,50 48,44 Q48,34 40,40 Z" fill="none" stroke="#ef4444" stroke-width="3"/>
  <!-- Right lens (heart shape!) -->
  <path d="M78,40 Q70,34 70,44 Q70,50 78,56 Q86,50 86,44 Q86,34 78,40 Z" fill="none" stroke="#ef4444" stroke-width="3"/>
  <!-- Bridge -->
  <line x1="48" y1="44" x2="70" y2="44" stroke="#fbbf24" stroke-width="2.5"/>

  <!-- Decorative spirals on top -->
  <path d="M32,34 Q28,28 32,24 Q36,20 40,24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M86,34 Q90,28 86,24 Q82,20 78,24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Arms going to ears -->
  <line x1="26" y1="44" x2="18" y2="48" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="92" y1="44" x2="100" y2="48" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes behind lenses -->
  <circle cx="40" cy="44" r="2" fill="#374151"/>
  <circle cx="78" cy="44" r="2" fill="#374151"/>

  <!-- Smile -->
  <path d="M48,66 Q60,76 72,66" fill="none" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Extra decorated pair on table -->
  <g transform="translate(8, 82)">
    <circle cx="10" cy="8" r="7" fill="none" stroke="#22c55e" stroke-width="2"/>
    <circle cx="30" cy="8" r="7" fill="none" stroke="#22c55e" stroke-width="2"/>
    <line x1="17" y1="8" x2="23" y2="8" stroke="#a855f7" stroke-width="1.5"/>
  </g>

  <!-- Star-shaped pair on table -->
  <g transform="translate(76, 82)">
    <polygon points="10,2 11,6 15,6 12,9 13,13 10,10 7,13 8,9 5,6 9,6" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <polygon points="30,2 31,6 35,6 32,9 33,13 30,10 27,13 28,9 25,6 29,6" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="15" y1="8" x2="25" y2="8" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
</svg>
