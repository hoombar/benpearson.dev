<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <line x1="5" y1="108" x2="115" y2="108" stroke="#e5e7eb" stroke-width="2"/>
  <!-- Paper sheet -->
  <rect x="10" y="20" width="70" height="80" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Flower being filled with dots — hero -->
  <!-- Stem dots (green) -->
  <circle cx="42" cy="72" r="2" fill="#22c55e"/>
  <circle cx="42" cy="77" r="2" fill="#22c55e"/>
  <circle cx="42" cy="82" r="2" fill="#22c55e"/>
  <circle cx="42" cy="87" r="2" fill="#86efac"/>
  <!-- Petal dots (red/pink, partially filled) -->
  <circle cx="42" cy="40" r="2" fill="#ef4444"/>
  <circle cx="46" cy="38" r="2" fill="#ef4444"/>
  <circle cx="38" cy="38" r="2" fill="#fca5a5"/>
  <circle cx="35" cy="42" r="2" fill="#ef4444"/>
  <circle cx="49" cy="42" r="2" fill="#fca5a5"/>
  <circle cx="42" cy="35" r="2" fill="#fca5a5"/>
  <circle cx="37" cy="35" r="2" fill="#ef4444"/>
  <circle cx="47" cy="35" r="2" fill="#ef4444"/>
  <circle cx="34" cy="46" r="2" fill="#ef4444"/>
  <circle cx="50" cy="46" r="2" fill="#fca5a5"/>
  <circle cx="42" cy="50" r="2" fill="#ef4444"/>
  <circle cx="37" cy="48" r="2" fill="#fca5a5"/>
  <circle cx="47" cy="48" r="2" fill="#ef4444"/>
  <!-- Centre dots (yellow) -->
  <circle cx="42" cy="43" r="2" fill="#fde68a"/>
  <circle cx="45" cy="44" r="2" fill="#f59e0b"/>
  <circle cx="39" cy="44" r="2" fill="#fde68a"/>
  <!-- Leaf dots (green mix) -->
  <circle cx="48" cy="65" r="2" fill="#86efac"/>
  <circle cx="52" cy="63" r="2" fill="#22c55e"/>
  <circle cx="50" cy="67" r="2" fill="#22c55e"/>
  <!-- Hand holding cotton bud pressing down -->
  <g transform="translate(55, 30)">
    <!-- Cotton bud stick -->
    <line x1="0" y1="15" x2="30" y2="-15" stroke="#f3f4f6" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Cotton tip (pressing) -->
    <circle cx="0" cy="15" r="3.5" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>
    <!-- Top cotton end -->
    <circle cx="30" cy="-15" r="3" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
    <!-- Partial finger curves -->
    <path d="M12,2 Q15,-2 20,-5" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M10,6 Q14,2 18,0" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Paint plate (small, in corner) -->
  <ellipse cx="100" cy="85" rx="15" ry="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="93" cy="83" r="3" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
  <circle cx="103" cy="82" r="3" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
  <circle cx="108" cy="86" r="3" fill="#fde68a" stroke="#374151" stroke-width="0.8"/>
</svg>
