<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <line x1="5" y1="108" x2="115" y2="108" stroke="#e5e7eb" stroke-width="2"/>
  <!-- Paper plate palette — hero -->
  <ellipse cx="55" cy="70" rx="40" ry="15" fill="#f9fafb" stroke="#374151" stroke-width="2.5"/>
  <!-- Paint blobs on plate -->
  <circle cx="30" cy="65" r="6" fill="#ef4444" stroke="#374151" stroke-width="1"/>
  <circle cx="48" cy="62" r="6" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <circle cx="65" cy="62" r="6" fill="#fde68a" stroke="#374151" stroke-width="1"/>
  <circle cx="80" cy="65" r="6" fill="#22c55e" stroke="#374151" stroke-width="1"/>
  <circle cx="55" cy="74" r="5" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <!-- Cotton buds laid out beside plate -->
  <!-- Bud 1 (red-tipped) -->
  <line x1="8" y1="30" x2="38" y2="38" stroke="#f3f4f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="8" cy="30" r="3" fill="#fca5a5" stroke="#374151" stroke-width="1"/>
  <circle cx="38" cy="38" r="3" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <!-- Bud 2 (blue-tipped) -->
  <line x1="14" y1="22" x2="44" y2="30" stroke="#f3f4f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="14" cy="22" r="3" fill="#93c5fd" stroke="#374151" stroke-width="1"/>
  <circle cx="44" cy="30" r="3" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <!-- Bud 3 (yellow-tipped) -->
  <line x1="22" y1="14" x2="52" y2="22" stroke="#f3f4f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="22" cy="14" r="3" fill="#fde68a" stroke="#374151" stroke-width="1"/>
  <circle cx="52" cy="22" r="3" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <!-- Bud 4 (green-tipped) -->
  <line x1="32" y1="8" x2="62" y2="16" stroke="#f3f4f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="8" r="3" fill="#86efac" stroke="#374151" stroke-width="1"/>
  <circle cx="62" cy="16" r="3" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <!-- Paint tubes (source, background) -->
  <g transform="translate(88, 30)">
    <rect x="0" y="0" width="12" height="30" rx="3" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <rect x="2" y="-4" width="8" height="6" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  </g>
  <g transform="translate(102, 35)">
    <rect x="0" y="0" width="12" height="28" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <rect x="2" y="-4" width="8" height="6" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  </g>
</svg>
