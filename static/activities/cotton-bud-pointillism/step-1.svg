<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <line x1="5" y1="108" x2="115" y2="108" stroke="#e5e7eb" stroke-width="2"/>
  <!-- Paper sheet — hero -->
  <rect x="15" y="15" width="75" height="85" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Faint pencil outline of a flower -->
  <!-- Stem -->
  <line x1="52" y1="58" x2="52" y2="88" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Leaf -->
  <path d="M52,72 Q60,65 62,72 Q60,79 52,72" fill="none" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Petals (faint outline) -->
  <circle cx="52" cy="45" r="15" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <circle cx="52" cy="45" r="6" fill="none" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Petal divisions -->
  <line x1="52" y1="30" x2="52" y2="38" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <line x1="37" y1="45" x2="45" y2="45" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <line x1="67" y1="45" x2="59" y2="45" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <line x1="52" y1="60" x2="52" y2="53" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <line x1="42" y1="35" x2="47" y2="40" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <line x1="62" y1="35" x2="57" y2="40" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <!-- Pencil drawing the outline -->
  <g transform="translate(62, 55) rotate(30)">
    <!-- Pencil body -->
    <rect x="0" y="0" width="6" height="35" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
    <!-- Pencil tip -->
    <path d="M0,0 L3,-6 L6,0 Z" fill="#fef3c7" stroke="#374151" stroke-width="1"/>
    <!-- Graphite point -->
    <path d="M2,-1 L3,-4 L4,-1 Z" fill="#374151"/>
    <!-- Eraser end -->
    <rect x="0" y="33" width="6" height="4" rx="1" fill="#fca5a5" stroke="#374151" stroke-width="1"/>
  </g>
</svg>
