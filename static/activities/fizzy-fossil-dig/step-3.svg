<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Spray bottle (top-left, angled toward the rock) -->
  <g transform="translate(24, 36) rotate(-30)">
    <!-- Bottle body -->
    <rect x="-8" y="-4" width="16" height="32" rx="4" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
    <!-- Nozzle/pump top -->
    <rect x="-4" y="-14" width="8" height="12" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <!-- Trigger -->
    <path d="M4,-10 L10,-6 L10,-2 L4,-4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Nozzle tip -->
    <line x1="0" y1="-14" x2="0" y2="-18" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Spray lines (dashed, from nozzle toward the rock) -->
  <line x1="34" y1="14" x2="52" y2="40" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3" stroke-linecap="round"/>
  <line x1="30" y1="12" x2="48" y2="44" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,3" stroke-linecap="round"/>
  <line x1="38" y1="16" x2="56" y2="38" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,3" stroke-linecap="round"/>

  <!-- Tray (bottom) -->
  <rect x="36" y="82" width="74" height="8" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>

  <!-- Fossil rock (hero, crumbling - centre-right) -->
  <!-- Main rock body with irregular edge to show crumbling -->
  <path d="M56,76 Q50,64 54,52 Q58,44 68,42 Q78,40 86,46 Q92,52 92,62 Q92,72 88,78 Q82,82 72,82 Q62,82 56,76 Z"
        fill="#d97706" stroke="#374151" stroke-width="2.5"/>
  <!-- Crack lines showing dissolution -->
  <path d="M62,50 L66,58 L60,64" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M80,48 L78,56" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Dinosaur partially revealed (top of rock broken away) -->
  <g transform="translate(72, 46)">
    <!-- Dino head and neck poking out -->
    <path d="M-4,4 L-4,-4 L0,-8 L6,-6 L8,-2 L6,2 L2,4 Z" fill="#22c55e" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Eye -->
    <circle cx="3" cy="-3" r="1" fill="#374151"/>
  </g>

  <!-- Fizz bubbles rising from rock -->
  <circle cx="58" cy="42" r="3" fill="none" stroke="#374151" stroke-width="1"/>
  <circle cx="64" cy="36" r="2" fill="none" stroke="#374151" stroke-width="1"/>
  <circle cx="54" cy="34" r="2.5" fill="none" stroke="#374151" stroke-width="1"/>
  <circle cx="70" cy="32" r="1.5" fill="none" stroke="#374151" stroke-width="1"/>
  <circle cx="60" cy="28" r="2" fill="none" stroke="#374151" stroke-width="1"/>
  <circle cx="76" cy="36" r="2" fill="none" stroke="#374151" stroke-width="1"/>
  <circle cx="82" cy="30" r="1.5" fill="none" stroke="#374151" stroke-width="1"/>

  <!-- Crumbled pieces falling off -->
  <ellipse cx="48" cy="72" rx="4" ry="3" fill="#fbbf24" stroke="#374151" stroke-width="1"/>
  <ellipse cx="94" cy="74" rx="3" ry="2" fill="#fbbf24" stroke="#374151" stroke-width="1"/>
  <circle cx="52" cy="78" r="2" fill="#fbbf24" stroke="#374151" stroke-width="1"/>

  <!-- Tray legs -->
  <line x1="44" y1="90" x2="44" y2="106" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="102" y1="90" x2="102" y2="106" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Table edge -->
  <line x1="0" y1="106" x2="120" y2="106" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Exclamation sparkles (excitement!) -->
  <line x1="98" y1="16" x2="98" y2="22" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="95" y1="19" x2="101" y2="19" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="108" y1="24" x2="108" y2="28" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="106" y1="26" x2="110" y2="26" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
</svg>
