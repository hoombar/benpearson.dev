<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Flat dough piece (left side, before) -->
  <ellipse cx="28" cy="44" rx="20" ry="8" fill="#d97706" stroke="#374151" stroke-width="2"/>
  <!-- Small dinosaur on the dough -->
  <g transform="translate(28, 30)">
    <!-- Simple T-rex silhouette -->
    <path d="M-6,0 L-6,-8 L-2,-10 L2,-8 L4,-6 L4,-2 L2,0 Z" fill="#22c55e" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Legs -->
    <line x1="-3" y1="0" x2="-4" y2="6" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="1" y1="0" x2="2" y2="6" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Tail -->
    <path d="M-6,-4 L-12,-6" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Arrow showing transformation -->
  <line x1="52" y1="42" x2="66" y2="42" stroke="#374151" stroke-width="1.5" stroke-linecap="round"
        marker-end="url(#arr)"/>

  <!-- Packed rock shape (right side, after) — dough wrapped around dino -->
  <ellipse cx="88" cy="42" rx="18" ry="14" fill="#d97706" stroke="#374151" stroke-width="2.5"/>
  <!-- Texture lines on rock -->
  <path d="M76 38 Q80 36 84 38" stroke="#374151" stroke-width="1" stroke-linecap="round" fill="none"/>
  <path d="M90 46 Q94 44 98 46" stroke="#374151" stroke-width="1" stroke-linecap="round" fill="none"/>
  <!-- Hidden dino outline (dashed, showing it's inside) -->
  <path d="M84,36 L84,32 L88,30 L92,32 L92,36" stroke="#374151" stroke-width="1" stroke-dasharray="2,2" fill="none" stroke-linecap="round"/>

  <!-- Downward arrows showing pressing action on the rock -->
  <line x1="80" y1="18" x2="80" y2="26" stroke="#374151" stroke-width="1.5" stroke-linecap="round"
        marker-end="url(#arr)"/>
  <line x1="96" y1="18" x2="96" y2="26" stroke="#374151" stroke-width="1.5" stroke-linecap="round"
        marker-end="url(#arr)"/>

  <!-- Tray at bottom with several finished fossil rocks -->
  <rect x="10" y="72" width="100" height="10" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <!-- Fossil rock 1 -->
  <ellipse cx="30" cy="70" rx="12" ry="9" fill="#d97706" stroke="#374151" stroke-width="2"/>
  <!-- Fossil rock 2 -->
  <ellipse cx="60" cy="69" rx="14" ry="10" fill="#d97706" stroke="#374151" stroke-width="2"/>
  <!-- Fossil rock 3 -->
  <ellipse cx="88" cy="70" rx="11" ry="8" fill="#d97706" stroke="#374151" stroke-width="2"/>
  <!-- Texture on tray rocks -->
  <path d="M24 68 Q28 66 32 68" stroke="#374151" stroke-width="1" stroke-linecap="round" fill="none"/>
  <path d="M54 67 Q58 65 62 67" stroke="#374151" stroke-width="1" stroke-linecap="round" fill="none"/>
  <path d="M84 68 Q88 66 92 68" stroke="#374151" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- Arrow from top scene down to tray -->
  <path d="M88 58 Q88 62 70 68" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"
        marker-end="url(#arr)"/>

  <!-- Table edge -->
  <line x1="0" y1="86" x2="120" y2="86" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- More tray rocks below for depth -->
  <line x1="10" y1="82" x2="10" y2="100" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="110" y1="82" x2="110" y2="100" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>
