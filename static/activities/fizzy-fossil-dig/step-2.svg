<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Clock (top-right, showing time passing) -->
  <circle cx="92" cy="26" r="18" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Clock tick marks -->
  <line x1="92" y1="10" x2="92" y2="14" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="92" y1="38" x2="92" y2="42" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="76" y1="26" x2="80" y2="26" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="104" y1="26" x2="108" y2="26" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Clock hands -->
  <line x1="92" y1="26" x2="92" y2="16" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="92" y1="26" x2="100" y2="22" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Clock centre dot -->
  <circle cx="92" cy="26" r="2" fill="#374151"/>
  <!-- Time-passing arc around clock -->
  <path d="M80 8 Q92 2 104 8" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"
        marker-end="url(#arr)"/>

  <!-- Moon (top-left, showing overnight) -->
  <path d="M24 10 Q14 18 14 30 Q14 42 24 48 Q10 44 6 30 Q2 16 16 8 Q20 8 24 10 Z"
        fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <!-- Stars -->
  <circle cx="36" cy="12" r="1.5" fill="#f59e0b" stroke="#374151" stroke-width="1"/>
  <circle cx="44" cy="20" r="1" fill="#f59e0b" stroke="#374151" stroke-width="1"/>
  <circle cx="30" cy="24" r="1" fill="#f59e0b" stroke="#374151" stroke-width="1"/>

  <!-- Tray with fossil rocks (centre-bottom, hero) -->
  <rect x="14" y="68" width="92" height="10" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="2.5"/>

  <!-- Fossil rock 1 (soft, before — lighter colour) -->
  <ellipse cx="32" cy="62" rx="14" ry="10" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
  <path d="M24 60 Q28 58 32 60" stroke="#374151" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- Arrow showing hardening -->
  <line x1="52" y1="60" x2="64" y2="60" stroke="#374151" stroke-width="1.5" stroke-linecap="round"
        marker-end="url(#arr)"/>

  <!-- Fossil rock 2 (hard, after — darker colour, thicker outline) -->
  <ellipse cx="82" cy="62" rx="14" ry="10" fill="#d97706" stroke="#374151" stroke-width="2.5"/>
  <path d="M74 60 Q78 58 82 60" stroke="#374151" stroke-width="1" stroke-linecap="round" fill="none"/>
  <path d="M82 66 Q86 64 90 66" stroke="#374151" stroke-width="1" stroke-linecap="round" fill="none"/>
  <!-- Hardness lines (small radiating marks) -->
  <line x1="70" y1="54" x2="68" y2="50" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="82" y1="50" x2="82" y2="46" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="94" y1="54" x2="96" y2="50" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Tray legs -->
  <line x1="22" y1="78" x2="22" y2="96" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="98" y1="78" x2="98" y2="96" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Table edge -->
  <line x1="0" y1="96" x2="120" y2="96" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>
