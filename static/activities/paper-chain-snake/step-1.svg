<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Chain being built - several linked loops -->
  <!-- Link 1 (green) -->
  <ellipse cx="24" cy="50" rx="10" ry="14" fill="none" stroke="#4ade80" stroke-width="5"/>
  <ellipse cx="24" cy="50" rx="10" ry="14" fill="none" stroke="#374151" stroke-width="1"/>

  <!-- Link 2 (red) - threaded through link 1 -->
  <ellipse cx="38" cy="50" rx="10" ry="14" fill="none" stroke="#ef4444" stroke-width="5"/>
  <ellipse cx="38" cy="50" rx="10" ry="14" fill="none" stroke="#374151" stroke-width="1"/>

  <!-- Link 3 (yellow) - threaded through link 2 -->
  <ellipse cx="52" cy="50" rx="10" ry="14" fill="none" stroke="#fbbf24" stroke-width="5"/>
  <ellipse cx="52" cy="50" rx="10" ry="14" fill="none" stroke="#374151" stroke-width="1"/>

  <!-- Link 4 (blue) - threaded through link 3 -->
  <ellipse cx="66" cy="50" rx="10" ry="14" fill="none" stroke="#3b82f6" stroke-width="5"/>
  <ellipse cx="66" cy="50" rx="10" ry="14" fill="none" stroke="#374151" stroke-width="1"/>

  <!-- New strip being threaded through link 4 -->
  <path d="M76,42 Q82,42 82,50 Q82,58 76,58" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
  <path d="M76,42 Q82,42 82,50 Q82,58 76,58" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- Open end of strip curling to meet -->
  <path d="M76,42 Q72,36 68,42" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
  <path d="M76,42 Q72,36 68,42" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Glue bottle -->
  <g transform="translate(90, 24)">
    <rect x="0" y="12" width="14" height="26" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
    <rect x="3" y="4" width="8" height="10" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="0.8"/>
    <!-- Glue nozzle -->
    <rect x="5" y="0" width="4" height="5" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Glue dot on strip overlap -->
  <circle cx="72" cy="40" r="2" fill="#fef3c7" stroke="#374151" stroke-width="0.5" opacity="0.7"/>

  <!-- Arrow showing threading direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M86,68 Q82,62 78,58" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
