<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Stage suggestion: curtain rods at top -->
  <rect x="8" y="8" width="104" height="6" rx="2" stroke="#374151" stroke-width="1.5" fill="#d97706"/>
  <circle cx="8" cy="11" r="3" fill="#d97706" stroke="#374151" stroke-width="1"/>
  <circle cx="112" cy="11" r="3" fill="#d97706" stroke="#374151" stroke-width="1"/>
  <!-- Left curtain -->
  <path d="M8 14 Q20 26 14 38 Q10 50 18 60 L8 60 Z" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <!-- Right curtain -->
  <path d="M112 14 Q100 26 106 38 Q110 50 102 60 L112 60 Z" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <!-- Puppet: paper bag with mouth OPEN (performing) -->
  <!-- Upper part of bag (top portion, tilted slightly) -->
  <rect x="30" y="20" width="60" height="28" rx="3" stroke="#374151" stroke-width="2.5" fill="#fbbf24"/>
  <!-- Hair (wild) -->
  <path d="M34 20 Q32 12 30 8" stroke="#ef4444" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M44 20 Q44 10 46 6" stroke="#22c55e" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M56 20 Q56 10 58 6" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M68 20 Q70 12 72 8" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M80 20 Q82 12 84 8" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Googly eyes on bag -->
  <circle cx="48" cy="32" r="9" fill="white" stroke="#374151" stroke-width="2"/>
  <circle cx="48" cy="32" r="5" fill="#374151"/>
  <circle cx="46" cy="30" r="2" fill="white"/>
  <circle cx="72" cy="32" r="9" fill="white" stroke="#374151" stroke-width="2"/>
  <circle cx="72" cy="32" r="5" fill="#374151"/>
  <circle cx="70" cy="30" r="2" fill="white"/>
  <!-- Mouth OPEN: lower bag section below the flap -->
  <rect x="30" y="48" width="60" height="32" rx="3" stroke="#374151" stroke-width="2.5" fill="#fde68a"/>
  <!-- Teeth visible inside open mouth -->
  <rect x="36" y="44" width="7" height="8" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
  <rect x="47" y="44" width="7" height="8" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
  <rect x="58" y="44" width="7" height="8" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
  <rect x="69" y="44" width="7" height="8" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
  <!-- Pink inside of mouth (tongue area) -->
  <rect x="30" y="44" width="60" height="10" fill="#fca5a5" opacity="0.5"/>
  <!-- Sound lines from mouth (speaking) -->
  <path d="M96 56 Q104 52 110 56" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M96 62 Q106 58 112 62" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M96 68 Q104 64 110 68" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
