<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Paper bag body -->
  <rect x="24" y="30" width="72" height="80" rx="3" stroke="#374151" stroke-width="2.5" fill="#fde68a"/>
  <!-- Bottom flap (the mouth) - shown slightly open -->
  <rect x="24" y="30" width="72" height="22" rx="3" stroke="#374151" stroke-width="2" fill="#fbbf24"/>
  <!-- Flap fold crease line -->
  <line x1="24" y1="52" x2="96" y2="52" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Arrow pointing to flap with label indicator -->
  <line x1="106" y1="41" x2="98" y2="41" stroke="#374151" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Bracket showing flap area -->
  <line x1="100" y1="30" x2="108" y2="30" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="100" y1="52" x2="108" y2="52" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="104" y1="30" x2="104" y2="52" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Open/close arc arrows showing mouth movement -->
  <path d="M36 52 Q28 42 36 32" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M36 32 Q28 42 36 52" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="4,3"/>
  <!-- Hand silhouette suggestion (fingers) at bottom of bag -->
  <path d="M42 110 Q42 106 44 106 L50 106 Q52 106 52 110" stroke="#374151" stroke-width="1.5" fill="#fca5a5" stroke-linecap="round"/>
  <path d="M54 110 Q54 104 56 104 L62 104 Q64 104 64 110" stroke="#374151" stroke-width="1.5" fill="#fca5a5" stroke-linecap="round"/>
  <path d="M66 110 Q66 106 68 106 L74 106 Q76 106 76 110" stroke="#374151" stroke-width="1.5" fill="#fca5a5" stroke-linecap="round"/>
  <!-- Arrow showing hand goes in from below -->
  <line x1="60" y1="118" x2="60" y2="112" stroke="#374151" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
