<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Paper bag body -->
  <rect x="20" y="18" width="72" height="92" rx="3" stroke="#374151" stroke-width="2.5" fill="#fde68a"/>
  <!-- Bottom flap (mouth area) -->
  <rect x="20" y="18" width="72" height="24" rx="3" stroke="#374151" stroke-width="2" fill="#fbbf24"/>
  <!-- Fold line -->
  <line x1="20" y1="42" x2="92" y2="42" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Big round eyes on bag body above flap -->
  <circle cx="42" cy="60" r="11" fill="white" stroke="#374151" stroke-width="2"/>
  <circle cx="42" cy="60" r="7" fill="#374151"/>
  <circle cx="39" cy="57" r="2.5" fill="white"/>
  <circle cx="70" cy="60" r="11" fill="white" stroke="#374151" stroke-width="2"/>
  <circle cx="70" cy="60" r="7" fill="#374151"/>
  <circle cx="67" cy="57" r="2.5" fill="white"/>
  <!-- Teeth on upper flap inner edge -->
  <rect x="26" y="38" width="8" height="6" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
  <rect x="38" y="38" width="8" height="6" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
  <rect x="50" y="38" width="8" height="6" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
  <rect x="62" y="38" width="8" height="6" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
  <rect x="74" y="38" width="8" height="6" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
  <!-- Lower teeth on bag body below flap -->
  <rect x="26" y="42" width="8" height="6" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
  <rect x="38" y="42" width="8" height="6" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
  <rect x="50" y="42" width="8" height="6" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
  <rect x="62" y="42" width="8" height="6" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
  <rect x="74" y="42" width="8" height="6" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
  <!-- Nose triangle -->
  <path d="M56 70 L60 80 L64 70 Z" stroke="#374151" stroke-width="1.5" fill="#f97316"/>
  <!-- Marker pen drawing -->
  <line x1="100" y1="14" x2="80" y2="54" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M78 55 L74 58 L80 52 Z" fill="#374151"/>
  <rect x="100" y="8" width="8" height="8" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
</svg>
