<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="4" y="96" width="112" height="6" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <!-- Straw bundle base (4 straws banded together, viewed from side) -->
  <rect x="14" y="82" width="80" height="8" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <rect x="14" y="74" width="80" height="8" rx="3" fill="#4ade80" stroke="#374151" stroke-width="1.5"/>
  <rect x="14" y="66" width="80" height="8" rx="3" fill="#60a5fa" stroke="#374151" stroke-width="1.5"/>
  <rect x="14" y="58" width="80" height="8" rx="3" fill="#f87171" stroke="#374151" stroke-width="1.5"/>
  <!-- Tape wrapping each end of the bundle -->
  <rect x="14" y="58" width="12" height="32" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="1" opacity="0.8"/>
  <rect x="82" y="58" width="12" height="32" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="1" opacity="0.8"/>
  <!-- Two upright straws at right end (pivot support) -->
  <rect x="84" y="16" width="6" height="44" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <rect x="92" y="16" width="6" height="44" rx="3" fill="#60a5fa" stroke="#374151" stroke-width="1.5"/>
  <!-- Tape securing uprights to base -->
  <rect x="82" y="52" width="18" height="10" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="1" opacity="0.85"/>
  <!-- Arrow pointing to tape -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M62 38 L84 52" stroke="#374151" stroke-width="1.5" fill="none" stroke-dasharray="4,3" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Label area (tape icon) -->
  <rect x="44" y="28" width="22" height="12" rx="2" fill="#d1fae5" stroke="#374151" stroke-width="1"/>
</svg>
