<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Table surface -->
  <rect x="4" y="106" width="112" height="6" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <!-- Base bundle -->
  <rect x="10" y="90" width="60" height="14" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
  <!-- Upright pivot straws -->
  <rect x="64" y="50" width="6" height="52" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <rect x="72" y="50" width="6" height="52" rx="3" fill="#60a5fa" stroke="#374151" stroke-width="1.5"/>
  <!-- Rubber band -->
  <ellipse cx="71" cy="72" rx="10" ry="6" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <!-- Arm launched upward (rotated, spoon at top) -->
  <!-- Arm as rotated straw: from pivot at ~(71,72) going upper-left -->
  <line x1="71" y1="72" x2="30" y2="28" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
  <!-- Spoon bowl at tip of arm -->
  <ellipse cx="24" cy="22" rx="10" ry="7" fill="#d1d5db" stroke="#374151" stroke-width="1.5" transform="rotate(-45,24,22)"/>
  <!-- Marshmallow in flight -->
  <ellipse cx="60" cy="18" rx="9" ry="8" fill="white" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="58" cy="15" rx="3" ry="2" fill="#f3f4f6" opacity="0.7"/>
  <!-- Trajectory arc -->
  <path d="M24 22 Q50 6 80 30" stroke="#374151" stroke-width="1.5" fill="none" stroke-dasharray="4,3" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Ruler on table for measuring -->
  <rect x="6" y="98" width="80" height="7" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1"/>
  <line x1="16" y1="98" x2="16" y2="101" stroke="#374151" stroke-width="1"/>
  <line x1="26" y1="98" x2="26" y2="101" stroke="#374151" stroke-width="1"/>
  <line x1="36" y1="98" x2="36" y2="101" stroke="#374151" stroke-width="1"/>
  <line x1="46" y1="98" x2="46" y2="101" stroke="#374151" stroke-width="1"/>
  <line x1="56" y1="98" x2="56" y2="101" stroke="#374151" stroke-width="1"/>
  <line x1="66" y1="98" x2="66" y2="101" stroke="#374151" stroke-width="1"/>
  <line x1="76" y1="98" x2="76" y2="101" stroke="#374151" stroke-width="1"/>
</svg>
