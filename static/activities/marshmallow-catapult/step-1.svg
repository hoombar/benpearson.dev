<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Spoon (hero) — bowl on left, handle on right -->
  <ellipse cx="28" cy="60" rx="18" ry="14" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <ellipse cx="28" cy="60" rx="12" ry="9" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
  <path d="M46 60 L100 60" stroke="#374151" stroke-width="5" stroke-linecap="round"/>
  <path d="M96 58 Q106 58 108 60 Q106 62 96 62" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <!-- Straw taped under the spoon handle -->
  <rect x="44" y="64" width="60" height="6" rx="3" fill="#4ade80" stroke="#374151" stroke-width="1.5"/>
  <!-- Tape strips holding spoon to straw -->
  <rect x="52" y="58" width="10" height="14" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="1" opacity="0.9"/>
  <rect x="70" y="58" width="10" height="14" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="1" opacity="0.9"/>
  <rect x="88" y="58" width="10" height="14" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="1" opacity="0.9"/>
  <!-- Cross lines on tape -->
  <line x1="53" y1="60" x2="61" y2="70" stroke="#374151" stroke-width="0.7" opacity="0.5"/>
  <line x1="71" y1="60" x2="79" y2="70" stroke="#374151" stroke-width="0.7" opacity="0.5"/>
  <line x1="89" y1="60" x2="97" y2="70" stroke="#374151" stroke-width="0.7" opacity="0.5"/>
  <!-- Arrow showing solid single arm unit -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M60 90 L60 78" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- "Arm" bracket below -->
  <line x1="20" y1="94" x2="104" y2="94" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="90" x2="20" y2="98" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="104" y1="90" x2="104" y2="98" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>
