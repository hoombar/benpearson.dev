<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Crown with points and spirals being added (hero) -->
  <g transform="translate(10, 30)">
    <!-- Crown band -->
    <ellipse cx="50" cy="36" rx="46" ry="26" fill="none" stroke="#eab308" stroke-width="4" stroke-linecap="round"/>

    <!-- Points -->
    <polyline points="10,16 18,0 26,16" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="28,12 36,-4 44,12" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="44,10 52,-6 60,10" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="60,12 68,-4 76,12" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="78,16 86,0 94,16" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Spirals at point tips -->
    <circle cx="18" cy="-2" r="3" fill="none" stroke="#ec4899" stroke-width="2"/>
    <circle cx="36" cy="-6" r="3" fill="none" stroke="#eab308" stroke-width="2"/>
    <circle cx="52" cy="-8" r="3" fill="none" stroke="#a855f7" stroke-width="2"/>
    <circle cx="68" cy="-6" r="3" fill="none" stroke="#22c55e" stroke-width="2"/>

    <!-- Spiral being attached at rightmost point -->
    <circle cx="86" cy="-2" r="3" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="2,2"/>
  </g>

  <!-- Pencil being used to make spirals -->
  <g transform="translate(72, 8)">
    <!-- Pencil -->
    <rect x="0" y="-3" width="30" height="6" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <polygon points="30,-3 30,3 36,0" fill="#fde68a" stroke="#374151" stroke-width="0.5"/>
    <polygon points="34,-1.5 34,1.5 36,0" fill="#374151"/>
    <!-- Pipe cleaner wrapped around pencil -->
    <path d="M4,3 Q6,-3 8,3 Q10,-3 12,3 Q14,-3 16,3" fill="none" stroke="#ec4899" stroke-width="2"/>
  </g>

  <!-- Arrow showing wrapping -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M86,16 Q88,20 88,24" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Extra pipe cleaners -->
  <line x1="6" y1="90" x2="40" y2="90" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  <line x1="8" y1="96" x2="36" y2="96" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
</svg>
