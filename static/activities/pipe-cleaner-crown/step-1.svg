<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Crown band with zigzag points being added (hero) -->
  <g transform="translate(10, 30)">
    <!-- Crown band (oval) -->
    <ellipse cx="50" cy="36" rx="46" ry="26" fill="none" stroke="#eab308" stroke-width="4" stroke-linecap="round"/>

    <!-- Zigzag points attached to band -->
    <!-- Point 1 (left) -->
    <polyline points="10,16 18,0 26,16" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Point 2 -->
    <polyline points="28,12 36,-4 44,12" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Point 3 (centre) -->
    <polyline points="44,10 52,-6 60,10" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Point 4 -->
    <polyline points="60,12 68,-4 76,12" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Point 5 (right, being attached) -->
    <polyline points="78,16 86,0 94,16" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4,3"/>
  </g>

  <!-- Hand twisting point onto band -->
  <g transform="translate(88, 30)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="16" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrow showing twist attachment -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M94,52 Q92,48 88,46" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Loose pipe cleaner being bent -->
  <g transform="translate(8, 78)">
    <polyline points="0,10 14,0 28,10" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
