<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Child's head wearing crown (hero) -->
  <g transform="translate(20, 16)">
    <!-- Head -->
    <ellipse cx="40" cy="50" rx="30" ry="36" fill="#fcd9b6" stroke="#374151" stroke-width="1.2"/>

    <!-- Hair -->
    <path d="M12,40 Q14,20 28,14 Q40,10 52,14 Q66,20 68,40" fill="#92400e" stroke="#374151" stroke-width="0.8"/>

    <!-- Eyes -->
    <circle cx="30" cy="50" r="3" fill="white" stroke="#374151" stroke-width="0.6"/>
    <circle cx="30" cy="51" r="1.5" fill="#374151"/>
    <circle cx="50" cy="50" r="3" fill="white" stroke="#374151" stroke-width="0.6"/>
    <circle cx="50" cy="51" r="1.5" fill="#374151"/>

    <!-- Happy smile -->
    <path d="M32,62 Q40,70 48,62" fill="none" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Rosy cheeks -->
    <circle cx="24" cy="58" r="4" fill="#fda4af" opacity="0.4"/>
    <circle cx="56" cy="58" r="4" fill="#fda4af" opacity="0.4"/>

    <!-- Crown sitting on head -->
    <!-- Band -->
    <path d="M8,32 Q40,24 72,32" fill="none" stroke="#eab308" stroke-width="4" stroke-linecap="round"/>

    <!-- Points -->
    <polyline points="12,32 18,18 24,32" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="24,30 32,14 40,30" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="38,28 46,10 54,28" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="54,30 62,14 70,30" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Spirals at tips -->
    <circle cx="18" cy="16" r="3" fill="none" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="32" cy="12" r="3" fill="none" stroke="#eab308" stroke-width="1.5"/>
    <circle cx="46" cy="8" r="3" fill="none" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="62" cy="12" r="3" fill="none" stroke="#22c55e" stroke-width="1.5"/>

    <!-- Sticker jewels on band -->
    <circle cx="20" cy="32" r="2.5" fill="#ef4444" stroke="#374151" stroke-width="0.4"/>
    <circle cx="40" cy="28" r="2.5" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
    <circle cx="60" cy="30" r="2.5" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Sparkle effects -->
  <g transform="translate(86, 10)">
    <line x1="6" y1="0" x2="6" y2="12" stroke="#eab308" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="6" x2="12" y2="6" stroke="#eab308" stroke-width="1" stroke-linecap="round"/>
  </g>
  <g transform="translate(4, 20)">
    <line x1="4" y1="0" x2="4" y2="8" stroke="#eab308" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="0" y1="4" x2="8" y2="4" stroke="#eab308" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>
