<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Egg carton being cut apart -->
  <rect x="6" y="36" width="60" height="24" rx="2" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
  <circle cx="16" cy="44" r="7" fill="#c4956a" stroke="#374151" stroke-width="0.5"/>
  <circle cx="32" cy="44" r="7" fill="#c4956a" stroke="#374151" stroke-width="0.5"/>
  <circle cx="48" cy="44" r="7" fill="#c4956a" stroke="#374151" stroke-width="0.5"/>

  <!-- Cut lines -->
  <line x1="24" y1="36" x2="24" y2="60" stroke="#ef4444" stroke-width="0.6" stroke-dasharray="2,2"/>
  <line x1="40" y1="36" x2="40" y2="60" stroke="#ef4444" stroke-width="0.6" stroke-dasharray="2,2"/>

  <!-- Painted scoops (hero) -->
  <g transform="translate(10, 70)">
    <ellipse cx="10" cy="8" rx="10" ry="8" fill="#f472b6" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g transform="translate(34, 70)">
    <ellipse cx="10" cy="8" rx="10" ry="8" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g transform="translate(58, 70)">
    <ellipse cx="10" cy="8" rx="10" ry="8" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g transform="translate(82, 70)">
    <ellipse cx="10" cy="8" rx="10" ry="8" fill="#4ade80" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Paintbrush -->
  <g transform="translate(70, 20) rotate(25)">
    <rect x="0" y="-3" width="26" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#f472b6" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pots -->
  <g transform="translate(86, 22)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.5"/>
    <rect x="2" y="3" width="8" height="7" rx="1" fill="#f472b6"/>
  </g>
  <g transform="translate(100, 22)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.5"/>
    <rect x="2" y="3" width="8" height="7" rx="1" fill="#92400e"/>
  </g>
  <g transform="translate(86, 38)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.5"/>
    <rect x="2" y="3" width="8" height="7" rx="1" fill="#fbbf24"/>
  </g>
  <g transform="translate(100, 38)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.5"/>
    <rect x="2" y="3" width="8" height="7" rx="1" fill="#4ade80"/>
  </g>
</svg>
