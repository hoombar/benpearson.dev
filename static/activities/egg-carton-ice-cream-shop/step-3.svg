<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Shop counter -->
  <rect x="4" y="56" width="112" height="6" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>

  <!-- Ice cream display row -->
  <!-- Ice cream 1 -->
  <g transform="translate(8, 30)">
    <path d="M0,0 L6,24 L12,0 Z" fill="#d4a574" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="6" cy="0" rx="8" ry="6" fill="#f472b6" stroke="#374151" stroke-width="0.6"/>
    <circle cx="6" cy="-5" r="2" fill="#ef4444" stroke="#374151" stroke-width="0.3"/>
  </g>
  <!-- Ice cream 2 -->
  <g transform="translate(28, 26)">
    <path d="M0,4 L6,28 L12,4 Z" fill="#d4a574" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="6" cy="4" rx="8" ry="6" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="6" cy="-6" rx="7" ry="5" fill="#92400e" stroke="#374151" stroke-width="0.6"/>
  </g>
  <!-- Ice cream 3 -->
  <g transform="translate(48, 30)">
    <path d="M0,0 L6,24 L12,0 Z" fill="#d4a574" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="6" cy="0" rx="8" ry="6" fill="#4ade80" stroke="#374151" stroke-width="0.6"/>
    <circle cx="6" cy="-5" r="2" fill="#ef4444" stroke="#374151" stroke-width="0.3"/>
  </g>
  <!-- Ice cream 4 -->
  <g transform="translate(68, 22)">
    <path d="M0,8 L6,32 L12,8 Z" fill="#d4a574" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="6" cy="8" rx="8" ry="6" fill="#a855f7" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="6" cy="-2" rx="7" ry="5" fill="#f472b6" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="6" cy="-12" rx="6" ry="5" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Menu board -->
  <g transform="translate(88, 6)">
    <rect x="0" y="0" width="26" height="36" rx="2" fill="white" stroke="#374151" stroke-width="0.8"/>
    <!-- Menu lines -->
    <line x1="4" y1="8" x2="22" y2="8" stroke="#374151" stroke-width="0.4"/>
    <line x1="4" y1="14" x2="22" y2="14" stroke="#374151" stroke-width="0.4"/>
    <line x1="4" y1="20" x2="22" y2="20" stroke="#374151" stroke-width="0.4"/>
    <line x1="4" y1="26" x2="22" y2="26" stroke="#374151" stroke-width="0.4"/>
    <!-- Colour dots as flavour indicators -->
    <circle cx="7" cy="8" r="1.5" fill="#f472b6" stroke="none"/>
    <circle cx="7" cy="14" r="1.5" fill="#92400e" stroke="none"/>
    <circle cx="7" cy="20" r="1.5" fill="#fbbf24" stroke="none"/>
    <circle cx="7" cy="26" r="1.5" fill="#4ade80" stroke="none"/>
  </g>

  <!-- Hand serving ice cream -->
  <g transform="translate(46, 64)">
    <rect x="0" y="0" width="14" height="22" rx="7" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Coins on counter -->
  <circle cx="18" cy="72" r="4" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
  <circle cx="28" cy="72" r="4" fill="#9ca3af" stroke="#374151" stroke-width="0.5"/>
</svg>
