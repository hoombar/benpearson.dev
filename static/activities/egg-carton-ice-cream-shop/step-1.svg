<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper semi-circle being rolled (hero) -->
  <path d="M10,50 A30,30 0 0 1 70,50 Z" fill="#d4a574" stroke="#374151" stroke-width="1"/>
  <!-- Arrow showing rolling direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M14,46 Q8,38 16,32" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Finished cone 1 -->
  <g transform="translate(78, 14)">
    <path d="M0,0 L12,48 L24,0 Z" fill="#d4a574" stroke="#374151" stroke-width="1"/>
    <!-- Waffle pattern -->
    <line x1="4" y1="10" x2="20" y2="10" stroke="#92400e" stroke-width="0.5"/>
    <line x1="6" y1="20" x2="18" y2="20" stroke="#92400e" stroke-width="0.5"/>
    <line x1="8" y1="30" x2="16" y2="30" stroke="#92400e" stroke-width="0.5"/>
    <line x1="8" y1="0" x2="10" y2="40" stroke="#92400e" stroke-width="0.5"/>
    <line x1="16" y1="0" x2="14" y2="40" stroke="#92400e" stroke-width="0.5"/>
  </g>

  <!-- Finished cone 2 -->
  <g transform="translate(78, 66)">
    <path d="M0,0 L10,38 L20,0 Z" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
    <line x1="4" y1="8" x2="16" y2="8" stroke="#92400e" stroke-width="0.4"/>
    <line x1="5" y1="16" x2="15" y2="16" stroke="#92400e" stroke-width="0.4"/>
    <line x1="6" y1="24" x2="14" y2="24" stroke="#92400e" stroke-width="0.4"/>
    <line x1="7" y1="0" x2="9" y2="32" stroke="#92400e" stroke-width="0.4"/>
    <line x1="13" y1="0" x2="11" y2="32" stroke="#92400e" stroke-width="0.4"/>
  </g>

  <!-- Marker drawing waffle pattern -->
  <g transform="translate(58, 6) rotate(15)">
    <rect x="0" y="-2.5" width="20" height="5" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.6"/>
    <rect x="-3" y="-3" width="4" height="6" rx="1" fill="#374151"/>
  </g>

  <!-- Tape -->
  <g transform="translate(10, 72)">
    <ellipse cx="10" cy="10" rx="10" ry="10" fill="#d1fae5" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="10" cy="10" rx="4" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Scissors -->
  <g transform="translate(36, 66)">
    <path d="M0,0 L12,4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L12,-4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.2" fill="#374151"/>
    <ellipse cx="15" cy="5" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1"/>
    <ellipse cx="15" cy="-5" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1"/>
  </g>
</svg>
