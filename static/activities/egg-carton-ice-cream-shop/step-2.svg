<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Single scoop ice cream (hero) -->
  <g transform="translate(8, 30)">
    <path d="M0,0 L10,40 L20,0 Z" fill="#d4a574" stroke="#374151" stroke-width="1"/>
    <line x1="4" y1="8" x2="16" y2="8" stroke="#92400e" stroke-width="0.4"/>
    <line x1="6" y1="16" x2="14" y2="16" stroke="#92400e" stroke-width="0.4"/>
    <ellipse cx="10" cy="0" rx="12" ry="10" fill="#f472b6" stroke="#374151" stroke-width="1"/>
    <!-- Cherry -->
    <circle cx="10" cy="-8" r="3" fill="#ef4444" stroke="#374151" stroke-width="0.5"/>
    <line x1="10" y1="-11" x2="12" y2="-14" stroke="#22c55e" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- Double scoop -->
  <g transform="translate(40, 20)">
    <path d="M0,10 L10,50 L20,10 Z" fill="#d4a574" stroke="#374151" stroke-width="1"/>
    <line x1="4" y1="18" x2="16" y2="18" stroke="#92400e" stroke-width="0.4"/>
    <ellipse cx="10" cy="10" rx="12" ry="10" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="10" cy="-6" rx="11" ry="9" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <circle cx="10" cy="-14" r="3" fill="#ef4444" stroke="#374151" stroke-width="0.5"/>
    <line x1="10" y1="-17" x2="12" y2="-20" stroke="#22c55e" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- Triple scoop -->
  <g transform="translate(72, 14)">
    <path d="M0,16 L10,56 L20,16 Z" fill="#d4a574" stroke="#374151" stroke-width="1"/>
    <line x1="4" y1="24" x2="16" y2="24" stroke="#92400e" stroke-width="0.4"/>
    <ellipse cx="10" cy="16" rx="12" ry="10" fill="#4ade80" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="10" cy="0" rx="11" ry="9" fill="#f472b6" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="10" cy="-14" rx="10" ry="8" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <circle cx="10" cy="-22" r="3" fill="#ef4444" stroke="#374151" stroke-width="0.5"/>
    <line x1="10" y1="-25" x2="12" y2="-28" stroke="#22c55e" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- PVA glue -->
  <g transform="translate(98, 50)">
    <rect x="0" y="8" width="14" height="20" rx="3" fill="#f0f9ff" stroke="#374151" stroke-width="0.8"/>
    <rect x="3" y="0" width="8" height="10" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="0.6"/>
    <circle cx="7" cy="0" r="2" fill="#f97316" stroke="#374151" stroke-width="0.5"/>
  </g>
</svg>
