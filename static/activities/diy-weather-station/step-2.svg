<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Open notebook (hero) with weather log table being drawn -->
  <!-- Notebook left page -->
  <rect x="6" y="12" width="52" height="96" rx="3" stroke="#374151" stroke-width="2" fill="white"/>
  <!-- Notebook right page -->
  <rect x="62" y="12" width="52" height="96" rx="3" stroke="#374151" stroke-width="2" fill="white"/>
  <!-- Spine / binding -->
  <line x1="58" y1="12" x2="58" y2="108" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <line x1="62" y1="12" x2="62" y2="108" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <!-- Spiral binding dots -->
  <circle cx="60" cy="24" r="3" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <circle cx="60" cy="36" r="3" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <circle cx="60" cy="48" r="3" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <circle cx="60" cy="60" r="3" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <circle cx="60" cy="72" r="3" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <circle cx="60" cy="84" r="3" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <circle cx="60" cy="96" r="3" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- Left page: Table header row -->
  <line x1="8" y1="26" x2="56" y2="26" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Table rows (date rows) on left page -->
  <line x1="8" y1="36" x2="56" y2="36" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="8" y1="46" x2="56" y2="46" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="8" y1="56" x2="56" y2="56" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="8" y1="66" x2="56" y2="66" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="8" y1="76" x2="56" y2="76" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="8" y1="86" x2="56" y2="86" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="8" y1="96" x2="56" y2="96" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- Vertical column divider on left page -->
  <line x1="24" y1="18" x2="24" y2="100" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- Right page: cloud symbol key -->
  <!-- Sun symbol -->
  <circle cx="78" cy="32" r="7" stroke="#374151" stroke-width="1.5" fill="#fde68a"/>
  <line x1="78" y1="20" x2="78" y2="17" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="44" x2="78" y2="47" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="66" y1="32" x2="63" y2="32" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="90" y1="32" x2="93" y2="32" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cloud symbol -->
  <path d="M80 58 Q80 52 86 52 Q88 48 94 48 Q100 48 100 54 Q104 54 104 58 Q104 62 100 62 L80 62 Q76 62 76 58 Q76 54 80 58 Z" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- Rain symbol (lines under cloud) -->
  <path d="M80 74 Q80 68 86 68 Q88 64 94 64 Q100 64 100 70 Q104 70 104 74 Q104 78 100 78 L80 78 Q76 78 76 74 Q76 70 80 74 Z" stroke="#374151" stroke-width="1.5" fill="#dbeafe"/>
  <line x1="84" y1="80" x2="82" y2="86" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="90" y1="80" x2="88" y2="86" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="96" y1="80" x2="94" y2="86" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pencil drawing in the notebook -->
  <line x1="96" y1="104" x2="108" y2="92" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M106 90 L110 86 L114 90 Z" stroke="#374151" stroke-width="1.5" fill="#374151"/>
  <rect x="93" y="102" width="5" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
</svg>
