<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Sky / ground line -->
  <line x1="4" y1="88" x2="116" y2="88" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cloud in sky -->
  <path d="M44 30 Q42 22 50 20 Q52 14 60 14 Q68 14 70 20 Q78 18 80 26 Q86 26 86 32 Q86 38 80 38 L44 38 Q38 38 38 32 Q38 26 44 30 Z" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- Rain drops from cloud -->
  <line x1="50" y1="40" x2="48" y2="48" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="40" x2="58" y2="48" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="40" x2="68" y2="48" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Rain gauge (left side) with water level -->
  <rect x="12" y="56" width="20" height="32" rx="2" stroke="#374151" stroke-width="2" fill="#f9fafb"/>
  <rect x="13" y="70" width="18" height="17" rx="1" stroke="none" fill="#93c5fd"/>
  <line x1="12" y1="70" x2="18" y2="70" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="78" x2="18" y2="78" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="86" x2="18" y2="86" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="62" x2="18" y2="62" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Rain gauge base -->
  <rect x="16" y="88" width="12" height="6" rx="2" stroke="#374151" stroke-width="1.5" fill="#d97706"/>
  <!-- Wind vane (right side) -->
  <!-- Post -->
  <line x1="90" y1="88" x2="90" y2="52" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Horizontal straw of wind vane -->
  <rect x="64" y="49" width="52" height="5" rx="2" stroke="#374151" stroke-width="1.5" fill="#fde68a"/>
  <!-- Arrowhead pointing left (into wind) -->
  <path d="M64 47 L54 51 L64 55 L70 51 Z" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <!-- Tail fin pointing right -->
  <path d="M116 45 L116 58 L106 54 Z" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <!-- Wind direction arrow along ground -->
  <line x1="40" y1="100" x2="68" y2="100" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Notebook with pencil for recording -->
  <rect x="48" y="92" width="24" height="20" rx="2" stroke="#374151" stroke-width="1.5" fill="white"/>
  <line x1="50" y1="98" x2="70" y2="98" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="50" y1="103" x2="70" y2="103" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="50" y1="108" x2="70" y2="108" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
</svg>
