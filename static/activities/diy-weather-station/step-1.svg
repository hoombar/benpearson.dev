<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Wind vane: straw with arrow at left, tail fin at right, on pivot pen -->
  <!-- Container base filled with stones -->
  <rect x="44" y="88" width="32" height="22" rx="3" stroke="#374151" stroke-width="2" fill="#d97706"/>
  <!-- Small circles as "stones" inside container -->
  <circle cx="52" cy="96" r="3" stroke="#374151" stroke-width="1" fill="#fbbf24"/>
  <circle cx="60" cy="99" r="3" stroke="#374151" stroke-width="1" fill="#fbbf24"/>
  <circle cx="68" cy="96" r="3" stroke="#374151" stroke-width="1" fill="#fbbf24"/>
  <circle cx="56" cy="104" r="3" stroke="#374151" stroke-width="1" fill="#fbbf24"/>
  <circle cx="64" cy="104" r="3" stroke="#374151" stroke-width="1" fill="#fbbf24"/>
  <!-- Pen/pivot standing upright from container -->
  <rect x="57" y="60" width="6" height="30" rx="2" stroke="#374151" stroke-width="1.5" fill="#3b82f6"/>
  <path d="M57 60 L60 54 L63 60 Z" fill="#374151"/>
  <!-- Horizontal straw balance point at pen tip -->
  <rect x="14" y="52" width="92" height="5" rx="2" stroke="#374151" stroke-width="1.5" fill="#fde68a"/>
  <!-- Paper arrowhead at left end of straw -->
  <path d="M14 50 L4 54 L14 58 L20 54 Z" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <!-- Paper tail fin at right end of straw -->
  <path d="M106 46 L116 48 L116 62 L106 60 Z" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <!-- Compass card with N/S/E/W marks below -->
  <rect x="42" y="78" width="36" height="12" rx="2" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <!-- N mark (left) -->
  <line x1="48" y1="82" x2="48" y2="86" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="82" x2="52" y2="86" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="82" x2="52" y2="86" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- E mark (right) -->
  <line x1="66" y1="82" x2="66" y2="86" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="66" y1="82" x2="70" y2="82" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="66" y1="84" x2="69" y2="84" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="66" y1="86" x2="70" y2="86" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tape piece at balance point on straw -->
  <rect x="57" y="50" width="6" height="7" rx="1" stroke="#374151" stroke-width="1" fill="#dbeafe"/>
</svg>
