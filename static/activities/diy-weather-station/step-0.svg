<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Hero: straight-sided container (jar) with measurement scale being marked -->
  <!-- Container body -->
  <rect x="36" y="30" width="34" height="70" rx="3" stroke="#374151" stroke-width="2.5" fill="#f9fafb"/>
  <!-- Measurement lines on the container (every 10px = 1 cm) -->
  <line x1="37" y1="94" x2="47" y2="94" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="37" y1="84" x2="47" y2="84" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="37" y1="74" x2="47" y2="74" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="37" y1="64" x2="47" y2="64" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="37" y1="54" x2="47" y2="54" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="37" y1="44" x2="47" y2="44" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="37" y1="34" x2="47" y2="34" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ruler alongside the container -->
  <rect x="74" y="28" width="10" height="76" rx="2" stroke="#374151" stroke-width="1.5" fill="#fef9c3"/>
  <line x1="74" y1="38" x2="84" y2="38" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="74" y1="48" x2="84" y2="48" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="74" y1="58" x2="84" y2="58" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="74" y1="68" x2="84" y2="68" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="74" y1="78" x2="84" y2="78" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="74" y1="88" x2="84" y2="88" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="74" y1="98" x2="84" y2="98" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- Marker pen drawing a line on the container -->
  <g transform="translate(18, 94) rotate(-45)">
    <rect x="-3" y="-22" width="6" height="16" rx="1" fill="#374151" stroke="#374151" stroke-width="1"/>
    <path d="M-3 -6 L0 0 L3 -6 Z" fill="#374151"/>
    <rect x="-3" y="-30" width="6" height="9" rx="1" fill="#ef4444" stroke="#374151" stroke-width="1"/>
  </g>
  <!-- Arrow pointing from ruler to the jar line -->
  <line x1="72" y1="64" x2="48" y2="64" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M51 61 L47 64 L51 67" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
