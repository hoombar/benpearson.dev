<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Paper sheet (hero) -->
  <rect x="14" y="8" width="78" height="100" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2.5"/>
  <!-- paper shadow -->
  <rect x="16" y="10" width="78" height="100" rx="2" fill="#e5e7eb" stroke="none" opacity="0.4"/>
  <rect x="14" y="8" width="78" height="100" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2.5"/>
  <!-- lined guide marks on paper -->
  <line x1="22" y1="20" x2="84" y2="20" stroke="#dbeafe" stroke-width="1"/>
  <line x1="22" y1="28" x2="84" y2="28" stroke="#dbeafe" stroke-width="1"/>

  <!-- Robot sketch on paper -->
  <!-- Head box -->
  <rect x="36" y="22" width="28" height="20" rx="1" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>
  <!-- eyes -->
  <circle cx="44" cy="30" r="3.5" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
  <circle cx="44" cy="30" r="1.5" fill="#3b82f6" stroke="none"/>
  <circle cx="56" cy="30" r="3.5" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
  <circle cx="56" cy="30" r="1.5" fill="#3b82f6" stroke="none"/>
  <!-- mouth line on head -->
  <line x1="42" y1="37" x2="58" y2="37" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- antenna -->
  <line x1="50" y1="22" x2="50" y2="14" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="50" cy="12" r="2.5" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>

  <!-- Body box -->
  <rect x="28" y="44" width="44" height="32" rx="1" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
  <!-- control panel grid -->
  <rect x="34" y="50" width="14" height="10" rx="1" fill="#86efac" stroke="#374151" stroke-width="1"/>
  <rect x="52" y="50" width="8" height="8" rx="1" fill="#93c5fd" stroke="#374151" stroke-width="1"/>
  <circle cx="63" cy="64" r="3" fill="#fca5a5" stroke="#374151" stroke-width="1"/>
  <line x1="34" y1="64" x2="68" y2="64" stroke="#d97706" stroke-width="1"/>
  <!-- arm stubs -->
  <rect x="16" y="50" width="12" height="8" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <rect x="72" y="50" width="12" height="8" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>

  <!-- Legs -->
  <rect x="34" y="76" width="10" height="16" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <rect x="56" y="76" width="10" height="16" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>

  <!-- Pencil drawing (right side) -->
  <g transform="translate(100,18) rotate(45)">
    <!-- pencil body -->
    <rect x="-4" y="-2" width="8" height="32" rx="1" fill="#fde68a" stroke="#374151" stroke-width="2"/>
    <!-- eraser end -->
    <rect x="-4" y="-6" width="8" height="5" rx="1" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>
    <!-- tip -->
    <polygon points="-4,30 4,30 0,38" fill="#d97706" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- lead tip -->
    <polygon points="-2,35 2,35 0,38" fill="#374151" stroke="none"/>
  </g>

  <!-- drawing motion arc -->
  <path d="M86,72 Q90,65 88,58" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="2,2" stroke-linecap="round"/>
</svg>
