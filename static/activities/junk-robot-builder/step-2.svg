<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Robot torso (hero, large box) -->
  <rect x="30" y="52" width="60" height="56" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2.5"/>
  <!-- torso side face -->
  <rect x="90" y="54" width="6" height="52" rx="1" fill="#fbbf24" stroke="none"/>
  <!-- torso bottom face -->
  <rect x="32" y="108" width="64" height="4" rx="1" fill="#d97706" stroke="none"/>
  <!-- panel line on torso -->
  <line x1="30" y1="80" x2="90" y2="80" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Robot head (smaller box) — hovering above, being placed down -->
  <rect x="38" y="14" width="44" height="32" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
  <!-- head side face -->
  <rect x="82" y="16" width="5" height="28" rx="1" fill="#fbbf24" stroke="none"/>
  <!-- simple eye circles on head -->
  <circle cx="52" cy="28" r="5" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
  <circle cx="52" cy="28" r="2" fill="#3b82f6" stroke="none"/>
  <circle cx="68" cy="28" r="5" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
  <circle cx="68" cy="28" r="2" fill="#3b82f6" stroke="none"/>

  <!-- Downward arrow: head descending onto torso -->
  <line x1="60" y1="46" x2="60" y2="50" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <polygon points="60,52 56,47 64,47" fill="#374151"/>

  <!-- Tape strip across join (yellow tape) -->
  <rect x="34" y="50" width="52" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>

  <!-- Arm tubes (left and right) -->
  <!-- left arm -->
  <ellipse cx="30" cy="72" rx="3" ry="6" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
  <rect x="10" y="66" width="20" height="12" rx="5" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
  <ellipse cx="10" cy="72" rx="3" ry="6" fill="#d97706" stroke="#374151" stroke-width="1.5"/>

  <!-- right arm -->
  <ellipse cx="90" cy="72" rx="3" ry="6" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
  <rect x="90" y="66" width="20" height="12" rx="5" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
  <ellipse cx="110" cy="72" rx="3" ry="6" fill="#d97706" stroke="#374151" stroke-width="1.5"/>

  <!-- Tape roll (bottom-right) -->
  <g transform="translate(104,100)">
    <circle cx="0" cy="0" r="10" fill="#fde68a" stroke="#374151" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <!-- tape strip coming off roll -->
    <path d="M10,0 L18,0 L18,-4" fill="none" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- tape strip on arm joint left -->
  <rect x="26" y="69" width="8" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1" opacity="0.9"/>
  <!-- tape strip on arm joint right -->
  <rect x="86" y="69" width="8" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1" opacity="0.9"/>
</svg>
