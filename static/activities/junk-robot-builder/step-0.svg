<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Floor surface -->
  <rect x="5" y="96" width="110" height="3" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Recycling bin (top-left) -->
  <g transform="translate(20,60)">
    <!-- bin body -->
    <rect x="-11" y="-20" width="22" height="30" rx="2" fill="#86efac" stroke="#374151" stroke-width="2"/>
    <!-- bin lid -->
    <rect x="-13" y="-26" width="26" height="7" rx="2" fill="#22c55e" stroke="#374151" stroke-width="2"/>
    <!-- recycling arrows -->
    <path d="M-4,-12 L0,-18 L4,-12 L2,-12 L2,-6 L-2,-6 L-2,-12 Z" fill="#374151" opacity="0.4"/>
    <!-- stripes on bin -->
    <line x1="-11" y1="-4" x2="11" y2="-4" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
    <line x1="-11" y1="4" x2="11" y2="4" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Arrow: items coming out of bin — marker auto-aligns to tangent (50−42,60−55) = (8,5) = 32° right-down -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M30,62 Q42,55 50,60" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Large cardboard box (centre-right, hero) -->
  <g transform="translate(72,68)">
    <!-- box body -->
    <rect x="-18" y="-20" width="36" height="30" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2.5"/>
    <!-- open flaps top -->
    <path d="M-18,-20 L-12,-32 L0,-28 L12,-32 L18,-20" fill="#fbbf24" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <!-- crease -->
    <line x1="0" y1="-20" x2="0" y2="10" stroke="#d97706" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- side shadow -->
    <rect x="18" y="-18" width="4" height="28" rx="1" fill="#fbbf24" stroke="none"/>
  </g>

  <!-- Medium box (left of centre) -->
  <g transform="translate(46,78)">
    <rect x="-12" y="-12" width="22" height="20" rx="1" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
    <line x1="-12" y1="-2" x2="10" y2="-2" stroke="#d97706" stroke-width="1"/>
    <rect x="10" y="-10" width="3" height="18" rx="1" fill="#fbbf24" stroke="none"/>
  </g>

  <!-- Cardboard tube standing up (far right) -->
  <g transform="translate(103,70)">
    <ellipse cx="0" cy="-16" rx="6" ry="3" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
    <rect x="-6" y="-16" width="12" height="32" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
    <ellipse cx="0" cy="16" rx="6" ry="3" fill="#d97706" stroke="#374151" stroke-width="1.5"/>
    <!-- tube rings -->
    <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#d97706" stroke-width="1"/>
    <line x1="-6" y1="4" x2="6" y2="4" stroke="#d97706" stroke-width="1"/>
  </g>

  <!-- Aluminium foil ball -->
  <g transform="translate(55,85)">
    <circle cx="0" cy="0" r="8" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <!-- crinkle lines -->
    <path d="M-5,-3 Q0,-1 5,-3" fill="none" stroke="#9ca3af" stroke-width="1" stroke-linecap="round"/>
    <path d="M-6,1 Q0,4 6,1" fill="none" stroke="#9ca3af" stroke-width="1" stroke-linecap="round"/>
    <path d="M-4,5 Q0,4 4,5" fill="none" stroke="#9ca3af" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Bottle caps -->
  <circle cx="42" cy="92" r="5" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
  <circle cx="42" cy="92" r="2.5" fill="#dbeafe" stroke="none"/>
  <circle cx="54" cy="94" r="5" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>
  <circle cx="54" cy="94" r="2.5" fill="#fee2e2" stroke="none"/>
  <circle cx="66" cy="92" r="5" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <circle cx="66" cy="92" r="2.5" fill="#fef9c3" stroke="none"/>

  <!-- "spread out" indicator dashes on floor -->
  <line x1="36" y1="97" x2="95" y2="97" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" stroke-linecap="round"/>
</svg>
