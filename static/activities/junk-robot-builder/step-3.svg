<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Completed robot (assembled, hero) -->

  <!-- Legs -->
  <rect x="34" y="98" width="14" height="16" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
  <rect x="72" y="98" width="14" height="16" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="2"/>

  <!-- Torso (body) -->
  <rect x="22" y="52" width="76" height="48" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2.5"/>
  <!-- torso side -->
  <rect x="98" y="54" width="5" height="44" rx="1" fill="#fbbf24" stroke="none"/>
  <!-- torso bottom -->
  <rect x="24" y="100" width="74" height="4" rx="1" fill="#d97706" stroke="none"/>

  <!-- Control panel on torso -->
  <rect x="30" y="60" width="18" height="14" rx="1" fill="#86efac" stroke="#374151" stroke-width="1.5"/>
  <!-- green panel button -->
  <circle cx="39" cy="67" r="4" fill="#22c55e" stroke="#374151" stroke-width="1"/>
  <rect x="52" y="60" width="12" height="10" rx="1" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
  <circle cx="58" cy="65" r="3" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <!-- dials -->
  <circle cx="72" cy="64" r="4" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>
  <circle cx="84" cy="64" r="4" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <!-- horizontal divider on panel -->
  <line x1="30" y1="78" x2="90" y2="78" stroke="#d97706" stroke-width="1"/>
  <!-- lower panel row -->
  <rect x="30" y="82" width="60" height="10" rx="1" fill="#fef9c3" stroke="#374151" stroke-width="1"/>
  <line x1="50" y1="82" x2="50" y2="92" stroke="#374151" stroke-width="1"/>
  <line x1="70" y1="82" x2="70" y2="92" stroke="#374151" stroke-width="1"/>

  <!-- Arm tubes -->
  <rect x="4" y="60" width="18" height="10" rx="4" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
  <rect x="98" y="60" width="18" height="10" rx="4" fill="#fef3c7" stroke="#374151" stroke-width="2"/>

  <!-- Head (on top of body, tape join) -->
  <rect x="98" y="50" width="22" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1"/><!-- tape -->
  <rect x="32" y="22" width="56" height="32" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2.5"/>
  <!-- head side -->
  <rect x="88" y="24" width="5" height="28" rx="1" fill="#fbbf24" stroke="none"/>
  <!-- tape at neck join -->
  <rect x="34" y="50" width="52" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>

  <!-- Eyes on head (drawn with marker — vivid) -->
  <circle cx="50" cy="35" r="7" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
  <circle cx="50" cy="35" r="4" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <circle cx="50" cy="35" r="1.5" fill="#f9fafb" stroke="none"/>
  <circle cx="70" cy="35" r="7" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
  <circle cx="70" cy="35" r="4" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <circle cx="70" cy="35" r="1.5" fill="#f9fafb" stroke="none"/>

  <!-- Mouth on head -->
  <path d="M46,44 Q60,50 74,44" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>

  <!-- Antenna -->
  <line x1="60" y1="22" x2="60" y2="12" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <circle cx="60" cy="9" r="4" fill="#fca5a5" stroke="#374151" stroke-width="2"/>

  <!-- Foil sensor ball on shoulder -->
  <circle cx="22" cy="56" r="8" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <path d="M16,52 Q22,47 28,52" fill="none" stroke="#9ca3af" stroke-width="1" stroke-linecap="round"/>
  <path d="M15,57 Q22,62 29,57" fill="none" stroke="#9ca3af" stroke-width="1" stroke-linecap="round"/>

  <!-- Marker pen approaching (action) -->
  <g transform="translate(106,30) rotate(140)">
    <rect x="-3" y="-2" width="6" height="22" rx="1" fill="#a78bfa" stroke="#374151" stroke-width="1.5"/>
    <rect x="-3" y="-6" width="6" height="5" rx="1" fill="#7c3aed" stroke="#374151" stroke-width="1"/>
    <polygon points="-3,20 3,20 0,26" fill="#374151" stroke="#374151" stroke-width="1"/>
  </g>
  <!-- drawing arc -->
  <path d="M100,46 Q108,38 106,30" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="2,2" stroke-linecap="round"/>
</svg>
