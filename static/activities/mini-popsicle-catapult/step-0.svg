<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(60, 60) rotate(-15)">
    <!-- 5 sticks stacked, slightly offset for thickness -->
    <rect x="-40" y="-12" width="80" height="10" rx="5" fill="#d97706" stroke="#374151" stroke-width="2"/>
    <rect x="-40" y="-9" width="80" height="10" rx="5" fill="#f59e0b" stroke="#374151" stroke-width="2"/>
    <rect x="-40" y="-6" width="80" height="10" rx="5" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
    <rect x="-40" y="-3" width="80" height="10" rx="5" fill="#fde68a" stroke="#374151" stroke-width="2"/>
    <rect x="-40" y="0" width="80" height="10" rx="5" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
    
    <!-- Rubber band left -->
    <rect x="-30" y="-14" width="6" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <rect x="-26" y="-14" width="3" height="26" rx="1" fill="#2563eb" stroke="#374151" stroke-width="1.5"/>
    
    <!-- Rubber band right -->
    <rect x="24" y="-14" width="6" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <rect x="28" y="-14" width="3" height="26" rx="1" fill="#2563eb" stroke="#374151" stroke-width="1.5"/>
  </g>
  <!-- Motion arrows showing banding -->
  <path d="M 15 45 Q 25 25 40 30" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none"/>
  <polygon points="40,30 35,27 37,34" fill="#374151"/>
</svg>