<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Base stack -->
  <g transform="translate(60, 60) rotate(-15)">
    <rect x="-20" y="-15" width="40" height="30" rx="4" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
    <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#374151" stroke-width="1.5"/>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#374151" stroke-width="1.5"/>
    <rect x="-15" y="-17" width="6" height="34" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <rect x="9" y="-17" width="6" height="34" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Bottom launcher stick (flat) -->
  <rect x="15" y="70" width="80" height="10" rx="5" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
  
  <!-- Top launcher stick (angled up) -->
  <g transform="translate(15, 75) rotate(-30)">
    <rect x="0" y="-5" width="80" height="10" rx="5" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
  </g>

  <!-- Rubber band at the joined end (left side) -->
  <rect x="18" y="66" width="6" height="14" rx="2" fill="#ef4444" stroke="#374151" stroke-width="1.5" transform="rotate(-15 21 73)"/>

  <!-- Arrow sliding base stack in -->
  <path d="M 80 30 Q 70 45 60 50" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>