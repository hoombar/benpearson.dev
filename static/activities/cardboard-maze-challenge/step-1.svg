<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Step 1: Cut the Cardboard Walls — scissors cutting a 4cm strip with V-notch at base -->

  <!-- Table surface -->
  <rect x="0" y="102" width="120" height="18" fill="#f3f4f6" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Main cardboard strip (hero — horizontal, centre-left) -->
  <g transform="translate(52, 68)">
    <!-- shadow -->
    <rect x="-44" y="-16" width="88" height="32" rx="2" fill="#d1d5db" opacity="0.35" transform="translate(2,2)"/>
    <!-- strip top face -->
    <rect x="-44" y="-16" width="88" height="28" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- cardboard thickness bottom edge -->
    <rect x="-44" y="12" width="88" height="5" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- corrugation texture lines -->
    <line x1="-34" y1="-10" x2="-34" y2="10" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="-22" y1="-10" x2="-22" y2="10" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="-10" y1="-10" x2="-10" y2="10" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="2" y1="-10" x2="2" y2="10" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="14" y1="-10" x2="14" y2="10" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="26" y1="-10" x2="26" y2="10" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="38" y1="-10" x2="38" y2="10" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <!-- dashed cut lines showing where to cut width = 4cm -->
    <line x1="-44" y1="-16" x2="44" y2="-16" stroke="#374151" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,2" opacity="0.6"/>
    <!-- V-notch being cut at base, centre -->
    <path d="M-8,12 L0,28 L8,12" fill="#fbbf24" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- dashed lines showing V-cut lines -->
    <line x1="-8" y1="-16" x2="-8" y2="12" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2"/>
    <line x1="8" y1="-16" x2="8" y2="12" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2"/>
  </g>

  <!-- Scissors — flat pattern (no sub-group rotations): handles at +x end, blades at -x end -->
  <g transform="translate(86, 46) rotate(-30)">
    <!-- Handle rings — both at the positive-x side (handle end) -->
    <circle cx="22" cy="-8" r="7" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
    <circle cx="22" cy="8" r="7" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
    <circle cx="22" cy="-8" r="4" fill="#f9fafb" stroke="none"/>
    <circle cx="22" cy="8" r="4" fill="#f9fafb" stroke="none"/>
    <!-- Blades — two crossing lines; tips extend to the negative-x side (blade end) -->
    <line x1="14" y1="-4" x2="-24" y2="8" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="4" x2="-24" y2="-8" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
    <!-- Pivot dot -->
    <circle cx="0" cy="0" r="3" fill="#374151" stroke="#f9fafb" stroke-width="1"/>
  </g>

  <!-- Completed cut strip with V-notch — finished result, lower-left -->
  <g transform="translate(26, 88)">
    <rect x="-18" y="-12" width="36" height="22" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <rect x="-18" y="10" width="36" height="4" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- corrugation on small strip -->
    <line x1="-10" y1="-8" x2="-10" y2="8" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="10" y1="-8" x2="10" y2="8" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <!-- V-notch at base -->
    <path d="M-5,10 L0,22 L5,10" fill="#fbbf24" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Arrow: cut result pointing left from main strip -->
  <line x1="46" y1="88" x2="36" y2="88" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="36,86 31,88 36,90" fill="#374151"/>

  <!-- Width dimension callout: "4cm" bracket above strip -->
  <line x1="8" y1="46" x2="96" y2="46" stroke="#374151" stroke-width="1" stroke-linecap="round" stroke-dasharray="2,2"/>
  <line x1="8" y1="44" x2="8" y2="48" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="96" y1="44" x2="96" y2="48" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
</svg>
