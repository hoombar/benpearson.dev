<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Step 2: Build and Tape the Maze — top-down view, walls slotted in and taped inside box -->

  <!-- Box outer body (hero) -->
  <rect x="6" y="8" width="108" height="102" rx="3" fill="#fef3c7" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <!-- box inner floor -->
  <rect x="13" y="15" width="94" height="88" rx="2" fill="#fbbf24" opacity="0.25" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <!-- box corner depth lines -->
  <line x1="13" y1="15" x2="6" y2="8" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="107" y1="15" x2="114" y2="8" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="13" y1="103" x2="6" y2="110" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="107" y1="103" x2="114" y2="110" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>

  <!-- MAZE WALLS (cardboard strips, brown/amber, slotted in) -->
  <!-- Wall 1: horizontal upper-left -->
  <rect x="13" y="33" width="50" height="7" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- tape piece on wall 1 -->
  <rect x="28" y="31" width="12" height="11" rx="1" fill="#dbeafe" stroke="#374151" stroke-width="1" stroke-linecap="round" opacity="0.78"/>

  <!-- Wall 2: vertical left-centre -->
  <rect x="39" y="40" width="7" height="42" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- tape -->
  <rect x="37" y="56" width="11" height="9" rx="1" fill="#dbeafe" stroke="#374151" stroke-width="1" stroke-linecap="round" opacity="0.78"/>

  <!-- Wall 3: horizontal middle-right -->
  <rect x="63" y="55" width="44" height="7" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- tape -->
  <rect x="76" y="53" width="9" height="11" rx="1" fill="#dbeafe" stroke="#374151" stroke-width="1" stroke-linecap="round" opacity="0.78"/>

  <!-- Wall 4: vertical right upper -->
  <rect x="80" y="24" width="7" height="33" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- tape -->
  <rect x="78" y="36" width="11" height="9" rx="1" fill="#dbeafe" stroke="#374151" stroke-width="1" stroke-linecap="round" opacity="0.78"/>

  <!-- Wall 5: horizontal lower-left -->
  <rect x="13" y="75" width="40" height="7" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- tape -->
  <rect x="22" y="73" width="10" height="11" rx="1" fill="#dbeafe" stroke="#374151" stroke-width="1" stroke-linecap="round" opacity="0.78"/>

  <!-- Entry hole, left side — green -->
  <rect x="2" y="20" width="10" height="17" rx="2" fill="#22c55e" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- entry arrow -->
  <line x1="-2" y1="28" x2="3" y2="28" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <polygon points="3,26 8,28 3,30" fill="#22c55e"/>

  <!-- Exit hole, right side — red -->
  <rect x="108" y="83" width="10" height="17" rx="2" fill="#ef4444" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- exit arrow -->
  <line x1="118" y1="91" x2="123" y2="91" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <polygon points="122,89 127,91 122,93" fill="#ef4444"/>

  <!-- Tape roll icon, top-right corner of canvas, showing the tool being used -->
  <g transform="translate(106, 14)">
    <circle cx="0" cy="0" r="7" fill="#dbeafe" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3.5" fill="#f9fafb" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <!-- tape strip coming off roll -->
    <rect x="6" y="-2" width="10" height="4" rx="1" fill="#dbeafe" stroke="#374151" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
