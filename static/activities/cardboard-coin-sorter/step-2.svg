<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Box cross-section with ramp and dividers inside (hero) -->
  <g transform="translate(14, 8)">
    <!-- Box walls -->
    <rect x="0" y="0" width="80" height="84" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

    <!-- Ramp (diagonal) -->
    <line x1="4" y1="12" x2="74" y2="72" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>

    <!-- Slot 1 in ramp (smallest) -->
    <rect x="20" y="28" width="6" height="4" fill="#fef3c7" stroke="#374151" stroke-width="0.5"/>

    <!-- Slot 2 in ramp (medium) -->
    <rect x="40" y="44" width="9" height="4" fill="#fef3c7" stroke="#374151" stroke-width="0.5"/>

    <!-- Slot 3 in ramp (largest) -->
    <rect x="58" y="58" width="12" height="4" fill="#fef3c7" stroke="#374151" stroke-width="0.5"/>

    <!-- Dividers below ramp creating compartments -->
    <line x1="30" y1="36" x2="30" y2="84" stroke="#d4a574" stroke-width="2" stroke-linecap="round"/>
    <line x1="52" y1="52" x2="52" y2="84" stroke="#d4a574" stroke-width="2" stroke-linecap="round"/>

    <!-- Compartment labels (coins visible in each) -->
    <!-- Small coin compartment -->
    <circle cx="18" cy="76" r="4" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>

    <!-- Medium coin compartment -->
    <circle cx="42" cy="76" r="5.5" fill="#d1d5db" stroke="#374151" stroke-width="0.4"/>

    <!-- Large coin goes to end -->
    <circle cx="68" cy="76" r="7" fill="#fde68a" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Tape roll -->
  <g transform="translate(98, 18)">
    <ellipse cx="8" cy="8" rx="8" ry="8" fill="#d1fae5" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="8" cy="8" rx="3" ry="3" fill="#fef3c7" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Hand taping ramp into place -->
  <g transform="translate(88, 42)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Tape piece being applied -->
  <rect x="86" y="36" width="8" height="4" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3"/>

  <!-- Arrow showing coin path -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M22,14 Q26,22 30,28" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
