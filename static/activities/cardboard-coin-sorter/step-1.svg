<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Cardboard ramp piece with slots being cut (hero) -->
  <g transform="translate(10, 20)">
    <!-- Ramp piece (flat, being worked on) -->
    <rect x="0" y="0" width="80" height="50" rx="2" fill="#d4a574" stroke="#374151" stroke-width="1.5"/>

    <!-- Slot 1 (smallest) -->
    <rect x="16" y="18" width="10" height="3" rx="0.5" fill="#fef3c7" stroke="#374151" stroke-width="0.8"/>

    <!-- Slot 2 (medium) -->
    <rect x="36" y="18" width="14" height="3" rx="0.5" fill="#fef3c7" stroke="#374151" stroke-width="0.8"/>

    <!-- Slot 3 (largest, being cut) -->
    <rect x="58" y="18" width="18" height="3" rx="0.5" fill="#fef3c7" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="2,2"/>
  </g>

  <!-- Coins being measured against slots -->
  <!-- Small coin -->
  <g transform="translate(20, 78)">
    <circle cx="5" cy="5" r="5" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <!-- Arrow to slot 1 -->
    <line x1="5" y1="0" x2="30" y2="-30" stroke="#374151" stroke-width="0.5" stroke-dasharray="1,1"/>
  </g>

  <!-- Medium coin -->
  <g transform="translate(44, 76)">
    <circle cx="7" cy="7" r="7" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <line x1="7" y1="0" x2="7" y2="-22" stroke="#374151" stroke-width="0.5" stroke-dasharray="1,1"/>
  </g>

  <!-- Large coin -->
  <g transform="translate(68, 74)">
    <circle cx="9" cy="9" r="9" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>
    <line x1="9" y1="0" x2="9" y2="-20" stroke="#374151" stroke-width="0.5" stroke-dasharray="1,1"/>
  </g>

  <!-- Ruler measuring slot width -->
  <g transform="translate(56, 30)">
    <rect x="0" y="0" width="24" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>
    <line x1="4" y1="0" x2="4" y2="6" stroke="#374151" stroke-width="0.3"/>
    <line x1="8" y1="0" x2="8" y2="4" stroke="#374151" stroke-width="0.3"/>
    <line x1="12" y1="0" x2="12" y2="6" stroke="#374151" stroke-width="0.3"/>
    <line x1="16" y1="0" x2="16" y2="4" stroke="#374151" stroke-width="0.3"/>
    <line x1="20" y1="0" x2="20" y2="6" stroke="#374151" stroke-width="0.3"/>
  </g>

  <!-- Scissors cutting largest slot -->
  <g transform="translate(80, 28) rotate(10)">
    <path d="M0,0 L-14,4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L-14,-4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.2" fill="#374151"/>
    <ellipse cx="4" cy="3" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <ellipse cx="4" cy="-3" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  </g>

  <!-- Size labels (arrows showing increasing width) -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="16" y1="14" x2="80" y2="14" stroke="#374151" stroke-width="0.6" marker-end="url(#arr)"/>
</svg>
