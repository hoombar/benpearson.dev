<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Completed coin sorter machine (hero, cross-section) -->
  <g transform="translate(14, 8)">
    <!-- Box walls -->
    <rect x="0" y="0" width="80" height="84" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

    <!-- Decorated exterior -->
    <rect x="0" y="0" width="80" height="84" rx="2" fill="none" stroke="#3b82f6" stroke-width="0.5" stroke-dasharray="4,4"/>

    <!-- Ramp -->
    <line x1="4" y1="12" x2="74" y2="72" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>

    <!-- Slots -->
    <rect x="20" y="28" width="6" height="4" fill="#fef3c7" stroke="#374151" stroke-width="0.5"/>
    <rect x="40" y="44" width="9" height="4" fill="#fef3c7" stroke="#374151" stroke-width="0.5"/>
    <rect x="58" y="58" width="12" height="4" fill="#fef3c7" stroke="#374151" stroke-width="0.5"/>

    <!-- Dividers -->
    <line x1="30" y1="36" x2="30" y2="84" stroke="#d4a574" stroke-width="2"/>
    <line x1="52" y1="52" x2="52" y2="84" stroke="#d4a574" stroke-width="2"/>

    <!-- Sorted coins in compartments! -->
    <!-- Small coins -->
    <circle cx="14" cy="76" r="4" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <circle cx="22" cy="76" r="4" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <circle cx="18" cy="70" r="4" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>

    <!-- Medium coins -->
    <circle cx="38" cy="76" r="5.5" fill="#d1d5db" stroke="#374151" stroke-width="0.4"/>
    <circle cx="46" cy="76" r="5.5" fill="#d1d5db" stroke="#374151" stroke-width="0.4"/>

    <!-- Large coins -->
    <circle cx="62" cy="76" r="7" fill="#fde68a" stroke="#374151" stroke-width="0.4"/>
    <circle cx="72" cy="76" r="7" fill="#fde68a" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Coin being dropped in at top -->
  <circle cx="22" cy="4" r="5" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>

  <!-- Hand dropping coin -->
  <g transform="translate(24, -6)">
    <rect x="0" y="0" width="12" height="18" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrow showing coin path down ramp -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fbbf24"/>
    </marker>
  </defs>
  <path d="M22,10 Q24,16 28,22" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Coin falling through slot 1 -->
  <circle cx="37" cy="40" r="3.5" fill="#fbbf24" stroke="#374151" stroke-width="0.4" opacity="0.5"/>
  <path d="M37,44 Q34,50 28,58" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.5"/>

  <!-- Label decorations on machine -->
  <rect x="96" y="20" width="14" height="8" rx="1" fill="#ef4444" stroke="#374151" stroke-width="0.4"/>
  <rect x="96" y="36" width="14" height="8" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
  <rect x="96" y="52" width="14" height="8" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>

  <!-- Extra coins waiting -->
  <g transform="translate(98, 72)">
    <circle cx="4" cy="4" r="4" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <circle cx="12" cy="4" r="5" fill="#d1d5db" stroke="#374151" stroke-width="0.4"/>
    <circle cx="6" cy="14" r="6" fill="#fde68a" stroke="#374151" stroke-width="0.4"/>
  </g>
</svg>
