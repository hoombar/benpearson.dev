<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Square frame from popsicle sticks (hero) -->
  <!-- Top stick -->
  <rect x="20" y="18" width="72" height="8" rx="2" fill="#d97706" stroke="#374151" stroke-width="1.5"/>
  <!-- Bottom stick -->
  <rect x="20" y="76" width="72" height="8" rx="2" fill="#d97706" stroke="#374151" stroke-width="1.5"/>
  <!-- Left stick -->
  <rect x="20" y="18" width="8" height="66" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <!-- Right stick -->
  <rect x="84" y="18" width="8" height="66" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>

  <!-- Glue dots at corners -->
  <circle cx="24" cy="22" r="3" fill="#f9fafb" stroke="#374151" stroke-width="0.5" opacity="0.7"/>
  <circle cx="88" cy="22" r="3" fill="#f9fafb" stroke="#374151" stroke-width="0.5" opacity="0.7"/>
  <circle cx="24" cy="80" r="3" fill="#f9fafb" stroke="#374151" stroke-width="0.5" opacity="0.7"/>
  <circle cx="88" cy="80" r="3" fill="#f9fafb" stroke="#374151" stroke-width="0.5" opacity="0.7"/>

  <!-- PVA glue bottle -->
  <rect x="100" y="44" width="12" height="26" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <rect x="103" y="36" width="6" height="10" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="0.8"/>
  <!-- Glue drip -->
  <circle cx="106" cy="72" r="1.5" fill="#f9fafb" stroke="#374151" stroke-width="0.4" opacity="0.6"/>

  <!-- Arrow from glue to corner -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M100,50 Q96,38 92,26" fill="none" stroke="#374151" stroke-width="1" marker-end="url(#arr)" stroke-dasharray="2,2"/>

  <!-- Extra sticks waiting (for second layer) -->
  <rect x="6" y="44" width="6" height="48" rx="2" fill="#d97706" stroke="#374151" stroke-width="0.8"/>
  <rect x="6" y="36" width="6" height="48" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(90 9 60)"/>
</svg>