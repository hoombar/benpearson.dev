  <!-- Heart sticker on bottom -->
  <path d="M56,83 Q54,79 54,81 Q54,83 56,86 Q58,83 58,81 Q58,79 56,83 Z"
        fill="#ec4899" stroke="#374151" stroke-width="0.4"/>

  <!-- Gem stickers on right -->
  <circle cx="87" cy="38" r="3" fill="#a855f7" stroke="#374151" stroke-width="0.6"/>
  <circle cx="87" cy="66" r="3" fill="#a855f7" stroke="#374151" stroke-width="0.6"/>

  <!-- Sticker sheet nearby -->
  <rect x="98" y="30" width="16" height="24" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>
  <circle cx="102" cy="36" r="2" fill="#ec4899" stroke="#374151" stroke-width="0.3"/>
  <circle cx="110" cy="36" r="2" fill="#a855f7" stroke="#374151" stroke-width="0.3"/>
  <path d="M102,44 L103,41 L104,44 L107,44 L105,46 L106,49 L103,47 L100,49 L101,46 L98,44 Z"
