  <rect x="20" y="16" width="72" height="10" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  <circle cx="36" cy="21" r="2" fill="#f9fafb" stroke="none"/>
  <circle cx="48" cy="21" r="2" fill="#f9fafb" stroke="none"/>
  <circle cx="60" cy="21" r="2" fill="#f9fafb" stroke="none"/>
  <circle cx="72" cy="21" r="2" fill="#f9fafb" stroke="none"/>

  <!-- Bottom — green -->
  <rect x="20" y="78" width="72" height="10" rx="3" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <!-- Left — red -->
  <rect x="20" y="16" width="10" height="72" rx="3" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <!-- Right — yellow -->
  <rect x="82" y="16" width="10" height="72" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>

  <!-- Star stickers -->
  <path d="M25,40 L26,37 L27,40 L30,40 L28,42 L29,45 L26,43 L23,45 L24,42 L21,40 Z"
