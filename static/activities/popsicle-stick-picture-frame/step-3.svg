<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall background -->
  <rect x="0" y="0" width="120" height="120" fill="#f3f4f6" stroke="none"/>

  <!-- Frame hanging on wall (hero) -->
  <!-- String for hanging -->
  <path d="M46,6 Q60,0 74,6" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <!-- Nail -->
  <circle cx="60" cy="2" r="1.5" fill="#9ca3af" stroke="#374151" stroke-width="0.6"/>

  <!-- Frame -->
  <!-- Top — blue -->
  <rect x="24" y="14" width="72" height="10" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  <circle cx="40" cy="19" r="2" fill="#f9fafb" stroke="none"/>
  <circle cx="52" cy="19" r="2" fill="#f9fafb" stroke="none"/>
  <circle cx="64" cy="19" r="2" fill="#f9fafb" stroke="none"/>
  <circle cx="76" cy="19" r="2" fill="#f9fafb" stroke="none"/>
  <!-- Bottom — green -->
  <rect x="24" y="82" width="72" height="10" rx="3" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <!-- Left — red -->
  <rect x="24" y="14" width="10" height="78" rx="3" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <!-- Right — yellow -->
  <rect x="86" y="14" width="10" height="78" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>

  <!-- Stars on left -->
  <path d="M29,40 L30,37 L31,40 L34,40 L32,42 L33,45 L30,43 L27,45 L28,42 L25,40 Z"
        fill="#f59e0b" stroke="#374151" stroke-width="0.3"/>

  <!-- Gems on right -->
  <circle cx="91" cy="38" r="3" fill="#a855f7" stroke="#374151" stroke-width="0.5"/>
  <circle cx="91" cy="66" r="3" fill="#a855f7" stroke="#374151" stroke-width="0.5"/>

  <!-- Picture visible through frame (child's drawing — simple sun, house, tree) -->
  <rect x="34" y="24" width="52" height="58" fill="#f9fafb" stroke="none"/>
  <!-- Sun -->
  <circle cx="44" cy="34" r="6" fill="#fbbf24" stroke="none"/>
  <line x1="44" y1="26" x2="44" y2="24" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
  <line x1="50" y1="30" x2="52" y2="28" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
  <line x1="38" y1="30" x2="36" y2="28" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
  <!-- House -->
  <rect x="52" y="56" width="20" height="18" fill="#fca5a5" stroke="#374151" stroke-width="0.8"/>
  <polygon points="52,56 62,44 72,56" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
  <rect x="58" y="64" width="6" height="10" fill="#d97706" stroke="#374151" stroke-width="0.5"/>
  <!-- Tree -->
  <line x1="42" y1="60" x2="42" y2="76" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <circle cx="42" cy="54" r="8" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
  <!-- Grass -->
  <line x1="34" y1="76" x2="86" y2="76" stroke="#22c55e" stroke-width="1.5"/>
</svg>