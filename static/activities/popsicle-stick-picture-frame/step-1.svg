<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Frame being painted (hero) -->
  <!-- Top stick — painted blue -->
  <rect x="22" y="20" width="68" height="10" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  <!-- Bottom stick — painted green -->
  <rect x="22" y="74" width="68" height="10" rx="3" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <!-- Left stick — painted red -->
  <rect x="22" y="20" width="10" height="64" rx="3" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <!-- Right stick — being painted yellow -->
  <rect x="80" y="20" width="10" height="64" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <!-- Unpainted portion at bottom of right stick -->
  <rect x="80" y="60" width="10" height="24" rx="3" fill="#d97706" stroke="#374151" stroke-width="1.5"/>

  <!-- Paintbrush painting the right stick -->
  <line x1="104" y1="40" x2="92" y2="56" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <rect x="89" y="56" width="6" height="5" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>

  <!-- Paint pots -->
  <rect x="6" y="80" width="12" height="14" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <rect x="8" y="84" width="8" height="8" rx="1" fill="#3b82f6" stroke="none"/>

  <rect x="22" y="88" width="10" height="10" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>
  <rect x="24" y="90" width="6" height="6" rx="1" fill="#ef4444" stroke="none"/>

  <rect x="36" y="88" width="10" height="10" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>
  <rect x="38" y="90" width="6" height="6" rx="1" fill="#22c55e" stroke="none"/>

  <rect x="50" y="88" width="10" height="10" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>
  <rect x="52" y="90" width="6" height="6" rx="1" fill="#fbbf24" stroke="none"/>
</svg>