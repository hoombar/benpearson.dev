<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Funnel -->
  <path d="M40 20 L80 20 L65 50 L65 70 L55 70 L55 50 Z" fill="#fde68a" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Powder pouring from spoon -->
  <path d="M70 10 L85 15 L95 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/> <!-- spoon -->
  <path d="M70 15 Q65 30 60 40" fill="none" stroke="#e5e7eb" stroke-width="4" stroke-dasharray="2,4" stroke-linecap="round"/>
  
  <!-- Balloon stretched around funnel stem -->
  <path d="M52 65 C40 80 30 90 35 105 C40 115 80 115 85 105 C90 90 80 80 68 65 Z" fill="#ef4444" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="60" cy="65" rx="9" ry="3" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- Baking soda pile inside balloon -->
  <path d="M45 108 Q60 98 75 108 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>

  <!-- Action lines pointing down -->
  <path d="M45 40 Q40 50 40 60" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>