<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Bottle -->
  <path d="M45,45 C45,60 40,65 40,110 C40,115 80,115 80,110 C80,65 75,60 75,45 L75,35 L45,35 Z" fill="#f3f4f6" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <path d="M41,85 C45,88 50,88 60,86 C70,84 75,85 79,85 L79,108 C75,112 45,112 41,108 Z" fill="#dbeafe" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Balloon hanging down the side -->
  <g transform="translate(80, 40) rotate(100)">
    <!-- Balloon body (with powder inside) -->
    <path d="M0,0 C-15,10 -25,25 -20,40 C-15,55 15,55 20,40 C25,25 15,10 0,0 Z" fill="#ef4444" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <!-- Powder pile -->
    <path d="M-10,42 Q0,35 10,42 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  </g>
  
  <!-- Balloon neck stretched over bottle mouth -->
  <path d="M42,35 Q60,30 78,35 Q85,45 80,50 L40,50 Q35,45 42,35 Z" fill="#ef4444" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="60" cy="35" rx="18" ry="6" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- Motion arrow to show stretching -->
  <path d="M95,60 Q105,40 85,30" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>