<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Bottle -->
  <path d="M45,45 C45,60 40,65 40,110 C40,115 80,115 80,110 C80,65 75,60 75,45 L75,35 L45,35 Z" fill="#f3f4f6" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <!-- Bottle neck details -->
  <line x1="45" y1="40" x2="75" y2="40" stroke="#374151" stroke-width="2"/>
  <ellipse cx="60" cy="35" rx="15" ry="5" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- Vinegar liquid inside -->
  <path d="M41,85 C45,88 50,88 60,86 C70,84 75,85 79,85 L79,108 C75,112 45,112 41,108 Z" fill="#dbeafe" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Vinegar jug pouring -->
  <g transform="translate(30, 25) rotate(30)">
    <path d="M-15,-20 L15,-20 C20,-20 25,-10 25,10 L25,30 C25,35 20,40 15,40 L-15,40 C-20,40 -25,35 -25,30 L-25,10 C-25,-10 -20,-20 -15,-20 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <!-- Handle -->
    <path d="M-25,0 C-35,0 -40,10 -35,20 L-25,20" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <!-- Liquid stream -->
    <path d="M15,-20 Q25,-30 40,-15" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,4"/>
  </g>

  <!-- Pouring motion -->
  <path d="M25,50 Q30,60 38,70" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>