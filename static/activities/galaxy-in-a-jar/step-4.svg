<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Jar with multiple layers -->
  <g transform="translate(60, 65)">
    <rect x="-25" y="-40" width="50" height="80" rx="4" fill="none" stroke="#374151" stroke-width="2.5"/>
    <!-- Layer 1 (bottom) -->
    <path d="M-22,10 Q-10,-3 0,10 Q10,-3 22,10 L22,40 L-22,40 Z" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
    <!-- Layer 2 (middle) -->
    <path d="M-22,-15 Q-10,-28 0,-15 Q10,-28 22,-15 L22,10 Q10,-3 0,10 Q-10,-3 -22,10 Z" fill="#c4b5fd" stroke="#374151" stroke-width="1.5"/>
    <!-- Layer 3 (top) -->
    <path d="M-22,-35 Q-10,-42 0,-35 Q10,-42 22,-35 L22,-15 Q10,-28 0,-15 Q-10,-28 -22,-15 Z" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>
    <!-- Glitter stars -->
    <circle cx="-10" cy="20" r="1" fill="white"/>
    <circle cx="12" cy="-5" r="1" fill="white"/>
    <circle cx="-8" cy="-25" r="1" fill="white"/>
  </g>
</svg>
