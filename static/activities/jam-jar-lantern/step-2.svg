<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Jar fully covered in tissue (upside down to dry) -->
  <!-- Baking paper surface -->
  <rect x="8" y="96" width="104" height="14" rx="2" stroke="#374151" stroke-width="1.5" fill="#f9fafb" stroke-dasharray="5,3"/>
  <!-- Upside down jar (rim at bottom, base at top) -->
  <path d="M38,98 Q32,98 32,92 L32,52 C32,42 36,38 36,32 L84,32 C84,38 88,42 88,52 L88,92 Q88,98 82,98 Z"
        stroke="#374151" stroke-width="2.5" fill="none"/>
  <!-- Tissue paper covering entire jar (colourful mosaic) -->
  <path d="M32 80 Q38 74 50 78 Q60 84 52 92 Q44 98 36 92 Q30 88 32 80 Z" fill="#ef4444" opacity="0.8" stroke="#374151" stroke-width="0.8"/>
  <path d="M50 76 Q60 70 70 76 Q78 84 70 92 Q62 98 54 92 Q46 84 50 76 Z" fill="#3b82f6" opacity="0.8" stroke="#374151" stroke-width="0.8"/>
  <path d="M68 78 Q78 72 86 80 Q88 88 82 94 Q74 100 68 94 Q62 86 68 78 Z" fill="#f59e0b" opacity="0.8" stroke="#374151" stroke-width="0.8"/>
  <path d="M34 60 Q44 54 54 60 Q62 68 54 76 Q46 80 38 74 Q30 68 34 60 Z" fill="#22c55e" opacity="0.8" stroke="#374151" stroke-width="0.8"/>
  <path d="M54 58 Q64 52 72 58 Q80 66 72 74 Q64 78 56 72 Q48 66 54 58 Z" fill="#a78bfa" opacity="0.8" stroke="#374151" stroke-width="0.8"/>
  <path d="M72 56 Q80 50 86 56 Q90 64 86 72 Q80 76 74 70 Q68 64 72 56 Z" fill="#f97316" opacity="0.8" stroke="#374151" stroke-width="0.8"/>
  <path d="M34 42 Q44 36 54 42 Q60 50 54 58 Q46 62 38 56 Q30 50 34 42 Z" fill="#fbbf24" opacity="0.8" stroke="#374151" stroke-width="0.8"/>
  <!-- Final PVA coat being brushed on (brush on right) -->
  <line x1="100" y1="12" x2="82" y2="54" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="78" y="50" width="7" height="10" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="1.5" opacity="0.8"/>
  <!-- Gloss sheen lines over tissue -->
  <path d="M40 66 Q56 62 72 66" stroke="white" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
</svg>
