<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Step 1: Mix the Primary Colours — pour red into yellow to get orange, show the transformation -->

  <!-- Table -->
  <rect x="0" y="104" width="120" height="16" fill="#f3f4f6" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Source: RED jar top-left, tilted pouring -->
  <g transform="translate(16, 38) rotate(-30)">
    <rect x="-7" y="-24" width="14" height="30" rx="3" fill="#fee2e2" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-8" y="-28" width="16" height="6" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#ef4444" opacity="0.85"/>
    <!-- liquid stream (dashed = flow) -->
    <path d="M0,-28 Q-3,-36 -5,-44" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2,2"/>
    <ellipse cx="-5" cy="-45" rx="2.5" ry="2" fill="#ef4444" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Arrow: red → mixing jar -->
  <path d="M22,30 Q36,50 46,60" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <polygon points="44,61 47,66 50,61" fill="#ef4444"/>

  <!-- Source: YELLOW jar top-right, tilted pouring -->
  <g transform="translate(104, 38) rotate(30)">
    <rect x="-7" y="-24" width="14" height="30" rx="3" fill="#fef9c3" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-8" y="-28" width="16" height="6" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#f59e0b" opacity="0.85"/>
    <!-- liquid stream -->
    <path d="M0,-28 Q3,-36 5,-44" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2,2"/>
    <ellipse cx="5" cy="-45" rx="2.5" ry="2" fill="#f59e0b" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Arrow: yellow → mixing jar -->
  <path d="M98,30 Q84,50 74,60" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <polygon points="70,61 73,66 76,61" fill="#f59e0b"/>

  <!-- Result mixing jar (hero) with ORANGE = red + yellow -->
  <g transform="translate(60, 82)">
    <!-- shadow -->
    <ellipse cx="2" cy="24" rx="18" ry="5" fill="#d1d5db" opacity="0.3"/>
    <!-- jar body -->
    <rect x="-14" y="-28" width="28" height="44" rx="4" fill="#ffedd5" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- jar rim -->
    <rect x="-15" y="-34" width="30" height="8" rx="3" fill="#f3f4f6" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- orange mixed liquid -->
    <rect x="-12" y="-4" width="24" height="20" rx="2" fill="#f97316" opacity="0.9"/>
    <!-- water surface -->
    <line x1="-12" y1="-4" x2="12" y2="-4" stroke="#fdba74" stroke-width="1.5" stroke-linecap="round"/>
    <!-- mixing swirl arc + arrowhead -->
    <path d="M-6,6 Q0,2 6,6 Q0,10 -6,6" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="-6,4 -8,7 -4,8" fill="#ea580c"/>
  </g>

  <!-- Finger-print swatches on paper strip at bottom (recording results) -->
  <rect x="4" y="96" width="54" height="10" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- red swatch -->
  <ellipse cx="12" cy="101" rx="4" ry="3.5" fill="#ef4444" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <!-- plus sign -->
  <line x1="18" y1="101" x2="22" y2="101" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="99" x2="20" y2="103" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- yellow swatch -->
  <ellipse cx="28" cy="101" rx="4" ry="3.5" fill="#f59e0b" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <!-- equals sign -->
  <line x1="34" y1="100" x2="38" y2="100" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="34" y1="103" x2="38" y2="103" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- orange result swatch -->
  <ellipse cx="46" cy="101" rx="5" ry="4" fill="#f97316" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
</svg>
