<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Tube 1 (eagle) - red -->
  <rect x="8" y="36" width="28" height="58" rx="4" fill="#ef4444" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="22" cy="36" rx="14" ry="5" fill="#fca5a5" stroke="#374151" stroke-width="1"/>
  <!-- Eagle face -->
  <circle cx="16" cy="52" r="3.5" fill="white" stroke="#374151" stroke-width="0.8"/>
  <circle cx="28" cy="52" r="3.5" fill="white" stroke="#374151" stroke-width="0.8"/>
  <circle cx="16.5" cy="52.5" r="1.5" fill="#374151"/>
  <circle cx="28.5" cy="52.5" r="1.5" fill="#374151"/>
  <!-- Beak -->
  <polygon points="22,56 19,62 25,62" fill="#f97316" stroke="#374151" stroke-width="0.6"/>
  <!-- Fierce eyebrows -->
  <line x1="13" y1="48" x2="19" y2="49.5" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="31" y1="48" x2="25" y2="49.5" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Tube 2 (bear) - blue -->
  <rect x="46" y="36" width="28" height="58" rx="4" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="60" cy="36" rx="14" ry="5" fill="#93c5fd" stroke="#374151" stroke-width="1"/>
  <!-- Bear face -->
  <circle cx="54" cy="52" r="3" fill="white" stroke="#374151" stroke-width="0.8"/>
  <circle cx="66" cy="52" r="3" fill="white" stroke="#374151" stroke-width="0.8"/>
  <circle cx="54.5" cy="52.5" r="1.5" fill="#374151"/>
  <circle cx="66.5" cy="52.5" r="1.5" fill="#374151"/>
  <!-- Bear nose -->
  <ellipse cx="60" cy="58" rx="4" ry="3" fill="#1e3a5f" stroke="#374151" stroke-width="0.6"/>
  <!-- Bear mouth -->
  <path d="M57,62 Q60,66 63,62" fill="none" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Round ears -->
  <circle cx="48" cy="38" r="4" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
  <circle cx="72" cy="38" r="4" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>

  <!-- Tube 3 (fish) - yellow -->
  <rect x="84" y="36" width="28" height="58" rx="4" fill="#eab308" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="98" cy="36" rx="14" ry="5" fill="#fde68a" stroke="#374151" stroke-width="1"/>
  <!-- Fish face -->
  <circle cx="92" cy="50" r="3.5" fill="white" stroke="#374151" stroke-width="0.8"/>
  <circle cx="104" cy="50" r="3.5" fill="white" stroke="#374151" stroke-width="0.8"/>
  <circle cx="92.5" cy="50.5" r="1.5" fill="#374151"/>
  <circle cx="104.5" cy="50.5" r="1.5" fill="#374151"/>
  <!-- Fish mouth -->
  <ellipse cx="98" cy="58" rx="3" ry="2" fill="#fca5a5" stroke="#374151" stroke-width="0.6"/>
  <!-- Scales pattern -->
  <path d="M88,66 Q92,64 96,66 Q100,64 104,66" fill="none" stroke="#a16207" stroke-width="0.6"/>
  <path d="M88,72 Q92,70 96,72 Q100,70 104,72" fill="none" stroke="#a16207" stroke-width="0.6"/>
  <path d="M88,78 Q92,76 96,78 Q100,76 104,78" fill="none" stroke="#a16207" stroke-width="0.6"/>

  <!-- Marker -->
  <g transform="translate(2, 14) rotate(15)">
    <rect x="0" y="-2.5" width="22" height="5" rx="2" fill="#374151" stroke="#374151" stroke-width="0.6"/>
    <rect x="-3" y="-2" width="4" height="4" rx="1" fill="#6b7280"/>
  </g>
</svg>
