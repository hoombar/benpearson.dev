<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Large paper sheet -->
  <rect x="18" y="6" width="70" height="90" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>

  <!-- Stick figure outline being drawn (guide for pasta placement) -->
  <!-- Head circle -->
  <circle cx="53" cy="18" r="8" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Spine -->
  <line x1="53" y1="26" x2="53" y2="60" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Left arm -->
  <line x1="53" y1="36" x2="32" y2="50" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Right arm -->
  <line x1="53" y1="36" x2="74" y2="50" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Pelvis -->
  <line x1="43" y1="60" x2="63" y2="60" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Left leg -->
  <line x1="43" y1="60" x2="36" y2="88" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Right leg -->
  <line x1="63" y1="60" x2="70" y2="88" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Rib lines -->
  <line x1="43" y1="32" x2="63" y2="32" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="43" y1="38" x2="63" y2="38" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="43" y1="44" x2="63" y2="44" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Marker pen drawing -->
  <line x1="98" y1="20" x2="90" y2="36" stroke="#9ca3af" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="87.5" y="36" width="5" height="5" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
</svg>