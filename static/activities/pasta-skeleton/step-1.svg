<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Sorted pasta piles -->
  <!-- Pile 1: Tube pasta (penne) — "long bones" -->
  <rect x="10" y="22" width="6" height="20" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1"/>
  <rect x="18" y="24" width="6" height="18" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1"/>
  <rect x="14" y="20" width="6" height="22" rx="2" fill="#fde68a" stroke="#374151" stroke-width="1"/>
  <rect x="8" y="44" width="6" height="16" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1"/>
  <rect x="16" y="46" width="6" height="14" rx="2" fill="#fde68a" stroke="#374151" stroke-width="1"/>

  <!-- Pile 2: Spaghetti — "ribs, fingers" -->
  <line x1="38" y1="18" x2="38" y2="56" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="16" x2="42" y2="58" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="46" y1="18" x2="46" y2="54" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="20" x2="50" y2="56" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="16" x2="54" y2="52" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Pile 3: Shells — "skull, joints" -->
  <path d="M72,24 Q68,20 70,26 Q72,32 76,26 Q80,20 76,24 Z" fill="#fde68a" stroke="#374151" stroke-width="0.8"/>
  <path d="M80,28 Q76,24 78,30 Q80,36 84,30 Q88,24 84,28 Z" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  <path d="M70,34 Q66,30 68,36 Q70,42 74,36 Q78,30 74,34 Z" fill="#fde68a" stroke="#374151" stroke-width="0.8"/>

  <!-- Pile 4: Fusilli/spirals — "spine" -->
  <path d="M96,20 Q92,24 96,28 Q100,32 96,36 Q92,40 96,44" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M104,18 Q100,22 104,26 Q108,30 104,34 Q100,38 104,42" fill="none" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Labels (arrows pointing to each pile) -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Bone icons showing what each becomes -->
  <!-- Long bone icon near tube pasta -->
  <line x1="12" y1="70" x2="12" y2="90" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <circle cx="12" cy="70" r="2.5" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>
  <circle cx="12" cy="90" r="2.5" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>
  <path d="M12,64 Q12,60 14,58" fill="none" stroke="#374151" stroke-width="0.8" marker-end="url(#arr)"/>

  <!-- Rib icon near spaghetti -->
  <path d="M42,72 Q50,68 54,72" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M42,78 Q50,74 54,78" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M46,64 Q46,60 46,58" fill="none" stroke="#374151" stroke-width="0.8" marker-end="url(#arr)"/>

  <!-- Skull icon near shells -->
  <circle cx="76" cy="80" r="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="73" cy="78" r="1.5" fill="#374151" stroke="none"/>
  <circle cx="79" cy="78" r="1.5" fill="#374151" stroke="none"/>
  <path d="M76,64 Q76,60 76,58" fill="none" stroke="#374151" stroke-width="0.8" marker-end="url(#arr)"/>
</svg>