<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall background -->
  <rect x="0" y="0" width="120" height="120" fill="#f3f4f6" stroke="none"/>

  <!-- Paper with completed skeleton hanging on wall -->
  <rect x="18" y="6" width="72" height="92" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>

  <!-- Tape holding it up -->
  <rect x="48" y="2" width="14" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>

  <!-- Complete pasta skeleton -->
  <!-- Skull -->
  <path d="M54,14 Q48,10 48,16 Q48,24 54,26 Q60,24 60,16 Q60,10 54,14 Z" fill="#fde68a" stroke="#374151" stroke-width="0.8"/>
  <circle cx="51" cy="17" r="1.5" fill="#374151" stroke="none"/>
  <circle cx="57" cy="17" r="1.5" fill="#374151" stroke="none"/>

  <!-- Spine -->
  <rect x="52" y="28" width="4" height="5" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
  <rect x="52" y="35" width="4" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5"/>
  <rect x="52" y="42" width="4" height="5" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
  <rect x="52" y="49" width="4" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5"/>

  <!-- Ribs -->
  <line x1="44" y1="30" x2="52" y2="30" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="56" y1="30" x2="64" y2="30" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="44" y1="34" x2="52" y2="34" stroke="#fde68a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="56" y1="34" x2="64" y2="34" stroke="#fde68a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="46" y1="38" x2="52" y2="38" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="56" y1="38" x2="62" y2="38" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="46" y1="42" x2="52" y2="42" stroke="#fde68a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="56" y1="42" x2="62" y2="42" stroke="#fde68a" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Arms -->
  <rect x="30" y="30" width="4" height="12" rx="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.5" transform="rotate(-20 32 36)"/>
  <rect x="30" y="42" width="4" height="12" rx="1.5" fill="#fde68a" stroke="#374151" stroke-width="0.5" transform="rotate(-10 32 48)"/>
  <rect x="66" y="30" width="4" height="12" rx="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.5" transform="rotate(20 68 36)"/>
  <rect x="66" y="42" width="4" height="12" rx="1.5" fill="#fde68a" stroke="#374151" stroke-width="0.5" transform="rotate(10 68 48)"/>

  <!-- Fingers (tiny spaghetti bits) -->
  <line x1="24" y1="54" x2="22" y2="58" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="26" y1="54" x2="24" y2="60" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="28" y1="54" x2="28" y2="60" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="76" y1="54" x2="78" y2="58" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="78" y1="54" x2="80" y2="60" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="80" y1="54" x2="80" y2="60" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Pelvis -->
  <path d="M46,56 Q54,60 62,56" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Legs -->
  <rect x="42" y="62" width="4" height="14" rx="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
  <rect x="42" y="74" width="4" height="12" rx="1.5" fill="#fde68a" stroke="#374151" stroke-width="0.5"/>
  <rect x="60" y="62" width="4" height="14" rx="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
  <rect x="60" y="74" width="4" height="12" rx="1.5" fill="#fde68a" stroke="#374151" stroke-width="0.5"/>

  <!-- Label arrows and text markers -->
  <!-- Arrow to skull -->
  <line x1="72" y1="16" x2="64" y2="16" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <circle cx="74" cy="16" r="0.8" fill="#374151" stroke="none"/>
  <!-- Arrow to ribs -->
  <line x1="74" y1="36" x2="66" y2="36" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <circle cx="76" cy="36" r="0.8" fill="#374151" stroke="none"/>
  <!-- Arrow to spine -->
  <line x1="34" y1="48" x2="50" y2="48" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <circle cx="32" cy="48" r="0.8" fill="#374151" stroke="none"/>
  <!-- Arrow to leg -->
  <line x1="74" y1="70" x2="66" y2="70" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <circle cx="76" cy="70" r="0.8" fill="#374151" stroke="none"/>

  <!-- Label placeholders (short lines suggesting text) -->
  <line x1="76" y1="14" x2="86" y2="14" stroke="#374151" stroke-width="0.6"/>
  <line x1="78" y1="34" x2="86" y2="34" stroke="#374151" stroke-width="0.6"/>
  <line x1="22" y1="46" x2="30" y2="46" stroke="#374151" stroke-width="0.6"/>
  <line x1="78" y1="68" x2="86" y2="68" stroke="#374151" stroke-width="0.6"/>
</svg>