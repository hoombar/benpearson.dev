<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper with pasta skeleton being built (hero) -->
  <rect x="14" y="4" width="72" height="92" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>

  <!-- Skull (shells clustered) -->
  <path d="M50,14 Q44,10 44,16 Q44,24 50,26 Q56,24 56,16 Q56,10 50,14 Z" fill="#fde68a" stroke="#374151" stroke-width="1"/>
  <circle cx="47" cy="17" r="1.5" fill="#374151" stroke="none"/>
  <circle cx="53" cy="17" r="1.5" fill="#374151" stroke="none"/>

  <!-- Spine (fusilli/tube pieces) -->
  <rect x="48" y="28" width="4" height="6" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
  <rect x="48" y="36" width="4" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>
  <rect x="48" y="44" width="4" height="6" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
  <rect x="48" y="52" width="4" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>

  <!-- Ribs (spaghetti) -->
  <line x1="40" y1="30" x2="48" y2="30" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="30" x2="60" y2="30" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="34" x2="48" y2="34" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="34" x2="60" y2="34" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="38" x2="48" y2="38" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="38" x2="58" y2="38" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="42" x2="48" y2="42" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="42" x2="58" y2="42" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arms (penne tubes) -->
  <rect x="26" y="30" width="5" height="14" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(-20 28.5 37)"/>
  <rect x="26" y="44" width="5" height="14" rx="2" fill="#fde68a" stroke="#374151" stroke-width="0.8" transform="rotate(-10 28.5 51)"/>
  <rect x="62" y="30" width="5" height="14" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(20 64.5 37)"/>
  <rect x="62" y="44" width="5" height="14" rx="2" fill="#fde68a" stroke="#374151" stroke-width="0.8" transform="rotate(10 64.5 51)"/>

  <!-- Pelvis -->
  <path d="M42,60 Q50,64 58,60" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <!-- Legs (penne tubes) -->
  <rect x="38" y="66" width="5" height="16" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  <rect x="38" y="78" width="5" height="14" rx="2" fill="#fde68a" stroke="#374151" stroke-width="0.8"/>
  <rect x="56" y="66" width="5" height="16" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  <rect x="56" y="78" width="5" height="14" rx="2" fill="#fde68a" stroke="#374151" stroke-width="0.8"/>

  <!-- PVA glue bottle -->
  <rect x="92" y="36" width="14" height="28" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <rect x="96" y="28" width="6" height="10" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="0.8"/>

  <!-- Glue squeezing out -->
  <circle cx="99" cy="68" r="1.5" fill="#fef3c7" stroke="#374151" stroke-width="0.4" opacity="0.6"/>
</svg>