<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Paper sheet (sketch/plan) -->
  <rect x="14" y="10" width="92" height="100" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Pencil lines — design sketch -->
  <!-- Outer box outline of container -->
  <rect x="30" y="24" width="44" height="50" rx="2" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Egg inside the sketch -->
  <ellipse cx="52" cy="44" rx="10" ry="13" fill="none" stroke="#374151" stroke-width="1.2"/>
  <!-- Cotton wool squiggles around egg -->
  <path d="M36 36 Q40 32 44 36 Q48 32 52 36" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M36 52 Q40 56 44 52 Q48 56 52 52" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M36 36 Q32 40 36 44 Q32 48 36 52" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M68 36 Q72 40 68 44 Q72 48 68 52" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Straw cage lines on container exterior -->
  <line x1="30" y1="38" x2="74" y2="38" stroke="#374151" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  <line x1="30" y1="56" x2="74" y2="56" stroke="#374151" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  <!-- Drop arrow on sketch -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M86 26 L86 46" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Pencil tool on paper -->
  <g transform="translate(80,82) rotate(-30)">
    <rect x="-3" y="-22" width="6" height="28" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
    <polygon points="-3,6 3,6 0,14" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
    <rect x="-3" y="-26" width="6" height="6" rx="1" fill="#f87171" stroke="#374151" stroke-width="1"/>
  </g>
  <!-- Ruler at bottom of page -->
  <rect x="20" y="94" width="80" height="8" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1"/>
  <line x1="30" y1="94" x2="30" y2="97" stroke="#374151" stroke-width="1"/>
  <line x1="40" y1="94" x2="40" y2="97" stroke="#374151" stroke-width="1"/>
  <line x1="50" y1="94" x2="50" y2="97" stroke="#374151" stroke-width="1"/>
  <line x1="60" y1="94" x2="60" y2="97" stroke="#374151" stroke-width="1"/>
  <line x1="70" y1="94" x2="70" y2="97" stroke="#374151" stroke-width="1"/>
  <line x1="80" y1="94" x2="80" y2="97" stroke="#374151" stroke-width="1"/>
  <line x1="90" y1="94" x2="90" y2="97" stroke="#374151" stroke-width="1"/>
</svg>
