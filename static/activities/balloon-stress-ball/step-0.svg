<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Plastic bottle being cut -->
  <g transform="translate(14, 10)">
    <rect x="10" y="0" width="16" height="14" rx="3" fill="#dbeafe" stroke="#374151" stroke-width="0.8" opacity="0.6"/>
    <rect x="4" y="14" width="28" height="50" rx="4" fill="#dbeafe" stroke="#374151" stroke-width="1" opacity="0.5"/>
    <!-- Cut line -->
    <line x1="4" y1="28" x2="32" y2="28" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="3,2"/>
  </g>

  <!-- Scissors cutting -->
  <g transform="translate(48, 30) rotate(-10)">
    <path d="M0,0 L14,5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,0 L14,-5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#374151"/>
    <ellipse cx="18" cy="6" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <ellipse cx="18" cy="-6" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  </g>

  <!-- Resulting funnel -->
  <g transform="translate(72, 24)">
    <rect x="8" y="0" width="14" height="12" rx="3" fill="#dbeafe" stroke="#374151" stroke-width="0.8" opacity="0.6"/>
    <path d="M2,12 L28,12 L22,30 L8,30 Z" fill="#dbeafe" stroke="#374151" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Balloon stretched over funnel neck -->
  <g transform="translate(72, 50)">
    <rect x="8" y="0" width="14" height="8" rx="3" fill="#dbeafe" stroke="#374151" stroke-width="0.6" opacity="0.5"/>
    <!-- Balloon neck stretched over -->
    <path d="M6,0 Q4,-4 8,-4 L22,-4 Q26,-4 24,0" fill="#f87171" stroke="#374151" stroke-width="0.6"/>
    <!-- Balloon body hanging below -->
    <path d="M6,0 Q-2,10 2,24 Q8,34 15,34 Q22,34 28,24 Q32,10 24,0" fill="#f87171" stroke="#374151" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- Arrow showing stretch -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="104" y1="42" x2="100" y2="48" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Uninflated balloons -->
  <path d="M16,80 Q10,86 14,94 L18,98 L22,94 Q26,86 20,80 Z" fill="#60a5fa" stroke="#374151" stroke-width="0.5"/>
  <path d="M34,80 Q28,86 32,94 L36,98 L40,94 Q44,86 38,80 Z" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
</svg>
