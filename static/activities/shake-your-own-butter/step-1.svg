<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Glass jar being shaken (hero, slightly tilted) -->
  <g transform="translate(60,64) rotate(-8)">
    <path d="M-22,42 Q-28,42 -28,36 L-28,-14 C-28,-26 -24,-30 -24,-38 L24,-38 C24,-30 28,-26 28,-14 L28,36 Q28,42 22,42 Z"
          stroke="#374151" stroke-width="2.5" fill="#f9fafb"/>
    <!-- Lid -->
    <rect x="-26" y="-44" width="52" height="8" rx="3" stroke="#374151" stroke-width="2" fill="#e5e7eb"/>
    <rect x="-22" y="-48" width="44" height="6" rx="2" stroke="#374151" stroke-width="1.5" fill="#d1d5db"/>
    <!-- Bottom: liquid buttermilk phase (white) -->
    <rect x="-27" y="10" width="54" height="30" rx="1" fill="#fef9c3"/>
    <!-- Top: whipped/butter phase (yellow lumps) -->
    <path d="M-24,10 Q-18,-2 -10,0 Q0,-6 10,-2 Q18,-8 24,10 Z" fill="#fbbf24" stroke="#374151" stroke-width="1"/>
    <!-- Separation line between phases -->
    <line x1="-27" y1="10" x2="27" y2="10" stroke="#374151" stroke-width="1" stroke-dasharray="3,2"/>
  </g>
  <!-- Motion arcs showing vigorous shaking -->
  <path d="M22 30 Q14 50 22 70" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M98 30 Q106 50 98 70" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Small motion lines (speed) -->
  <line x1="10" y1="48" x2="18" y2="48" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="56" x2="16" y2="56" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="102" y1="48" x2="110" y2="48" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="104" y1="56" x2="110" y2="56" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>
