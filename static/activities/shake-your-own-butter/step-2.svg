<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Jar tilted over sink, draining buttermilk -->
  <g transform="translate(50,52) rotate(40)">
    <path d="M-20,38 Q-26,38 -26,32 L-26,-18 C-26,-28 -22,-32 -22,-38 L22,-38 C22,-32 26,-28 26,-18 L26,32 Q26,38 20,38 Z"
          stroke="#374151" stroke-width="2.5" fill="#f9fafb"/>
    <!-- Lid off (tilted) -->
    <rect x="-24" y="-44" width="48" height="7" rx="3" stroke="#374151" stroke-width="2" fill="#e5e7eb" opacity="0.5"/>
    <!-- Butter lump remaining (golden, stuck to bottom of tilted jar = top visually) -->
    <ellipse cx="0" cy="-10" rx="18" ry="10" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
    <!-- Texture bumps on butter -->
    <path d="M-12,-6 Q-6,-14 0,-10 Q6,-14 12,-6" stroke="#d97706" stroke-width="1" fill="none"/>
  </g>
  <!-- Buttermilk stream flowing out (white liquid) -->
  <line x1="72" y1="66" x2="90" y2="94" stroke="#fef9c3" stroke-width="4" stroke-linecap="round" stroke-dasharray="5,2"/>
  <line x1="72" y1="66" x2="90" y2="94" stroke="#374151" stroke-width="1" stroke-linecap="round" stroke-dasharray="5,2"/>
  <!-- Salt being added (spoon bringing salt to jar) -->
  <ellipse cx="96" cy="36" rx="7" ry="4.5" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <line x1="103" y1="36" x2="116" y2="26" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Salt grains on spoon -->
  <circle cx="90" cy="35" r="1" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
  <circle cx="94" cy="33" r="1" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
  <circle cx="98" cy="36" r="1" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
  <!-- Arrow from spoon towards jar -->
  <line x1="90" y1="38" x2="72" y2="52" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Sink outline below -->
  <rect x="66" y="96" width="42" height="18" rx="3" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <line x1="84" y1="96" x2="84" y2="114" stroke="#374151" stroke-width="1" stroke-dasharray="2,2"/>
</svg>
