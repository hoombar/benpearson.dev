<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Glass jar (hero, half full) -->
  <path d="M44,106 Q38,106 38,100 L38,50 C38,38 42,34 42,26 L78,26 C78,34 82,38 82,50 L82,100 Q82,106 76,106 Z"
        stroke="#374151" stroke-width="2.5" fill="#f9fafb"/>
  <!-- Lid ring and cap -->
  <rect x="40" y="20" width="40" height="8" rx="3" stroke="#374151" stroke-width="2" fill="#e5e7eb"/>
  <rect x="44" y="16" width="32" height="6" rx="2" stroke="#374151" stroke-width="1.5" fill="#d1d5db"/>
  <!-- Cream fill level (half) -->
  <rect x="39" y="68" width="42" height="38" rx="1" fill="#fef9c3" opacity="0.9"/>
  <line x1="39" y1="68" x2="81" y2="68" stroke="#374151" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,2"/>
  <!-- Cream carton (source, left side) -->
  <rect x="6" y="36" width="24" height="40" rx="2" stroke="#374151" stroke-width="2" fill="#fef9c3"/>
  <path d="M6 36 L18 28 L30 36" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="#fde68a"/>
  <line x1="10" y1="46" x2="26" y2="46" stroke="#374151" stroke-width="1" opacity="0.5"/>
  <line x1="10" y1="52" x2="26" y2="52" stroke="#374151" stroke-width="1" opacity="0.5"/>
  <!-- Pour stream from carton into jar -->
  <line x1="30" y1="54" x2="44" y2="66" stroke="#fef9c3" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,2"/>
  <line x1="30" y1="54" x2="44" y2="66" stroke="#374151" stroke-width="1" stroke-linecap="round" stroke-dasharray="4,2"/>
  <!-- Arrow direction of pour -->
  <line x1="28" y1="52" x2="40" y2="62" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Jar reflection lines -->
  <line x1="44" y1="32" x2="44" y2="98" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
