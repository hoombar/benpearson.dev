<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Tinfoil sheet (hero, being scrunched) -->
  <path d="M24,34 L80,28 L86,74 L30,80 Z" fill="#d1d5db" stroke="#374151" stroke-width="1.2"/>
  <!-- Foil wrinkle details -->
  <line x1="34" y1="36" x2="40" y2="72" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="50" y1="32" x2="54" y2="76" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="66" y1="30" x2="68" y2="74" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="28" y1="50" x2="82" y2="46" stroke="#9ca3af" stroke-width="0.5"/>
  <line x1="28" y1="64" x2="84" y2="60" stroke="#9ca3af" stroke-width="0.5"/>
  <!-- Foil shine highlights -->
  <line x1="38" y1="42" x2="44" y2="46" stroke="white" stroke-width="0.8" opacity="0.6"/>
  <line x1="58" y1="50" x2="64" y2="54" stroke="white" stroke-width="0.8" opacity="0.6"/>

  <!-- Hands scrunching from sides -->
  <g transform="translate(16, 44)">
    <rect x="0" y="0" width="12" height="18" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g transform="translate(82, 40)">
    <rect x="0" y="0" width="12" height="18" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Finished ball example (small, to the side) -->
  <circle cx="102" cy="84" r="8" fill="#d1d5db" stroke="#374151" stroke-width="0.8"/>
  <!-- Ball texture -->
  <path d="M96,82 Q100,78 106,82" fill="none" stroke="#9ca3af" stroke-width="0.5"/>
  <path d="M98,88 Q102,84 108,86" fill="none" stroke="#9ca3af" stroke-width="0.5"/>
  <line x1="100" y1="78" x2="102" y2="90" stroke="#9ca3af" stroke-width="0.4"/>
  <!-- Shine -->
  <circle cx="99" cy="80" r="1.5" fill="white" opacity="0.5"/>

  <!-- Arrow from sheet to ball -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M86,78 Q96,80 98,76" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
