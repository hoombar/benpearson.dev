<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Step 3: Build Your Gallery — multiple overlapping prints from different colours -->

  <!-- Table surface -->
  <rect x="0" y="106" width="120" height="14" fill="#f3f4f6" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Gallery paper sheet — main canvas (hero ~35% of canvas) -->
  <rect x="6" y="14" width="108" height="86" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- light paper border detail -->
  <rect x="9" y="17" width="102" height="80" rx="2" fill="none" stroke="#e5e7eb" stroke-width="1"/>

  <!-- RED bubble print cluster, top-left -->
  <circle cx="32" cy="40" r="14" fill="#fca5a5" stroke="#374151" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <circle cx="32" cy="40" r="7" fill="#fee2e2" opacity="0.65"/>
  <circle cx="20" cy="52" r="9" fill="#fca5a5" stroke="#374151" stroke-width="1.5" stroke-linecap="round" opacity="0.82"/>
  <circle cx="44" cy="54" r="8" fill="#fee2e2" stroke="#374151" stroke-width="1.5" stroke-linecap="round" opacity="0.82"/>
  <circle cx="18" cy="35" r="5.5" fill="#fca5a5" stroke="#374151" stroke-width="1" stroke-linecap="round" opacity="0.72"/>
  <circle cx="42" cy="30" r="5" fill="#fee2e2" stroke="#374151" stroke-width="1" stroke-linecap="round" opacity="0.72"/>

  <!-- BLUE bubble print cluster, top-right -->
  <circle cx="86" cy="38" r="15" fill="#93c5fd" stroke="#374151" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <circle cx="86" cy="38" r="7.5" fill="#dbeafe" opacity="0.65"/>
  <circle cx="74" cy="50" r="9" fill="#93c5fd" stroke="#374151" stroke-width="1.5" stroke-linecap="round" opacity="0.82"/>
  <circle cx="98" cy="52" r="10" fill="#dbeafe" stroke="#374151" stroke-width="1.5" stroke-linecap="round" opacity="0.82"/>
  <circle cx="78" cy="32" r="5" fill="#93c5fd" stroke="#374151" stroke-width="1" stroke-linecap="round" opacity="0.72"/>
  <circle cx="98" cy="32" r="5.5" fill="#dbeafe" stroke="#374151" stroke-width="1" stroke-linecap="round" opacity="0.72"/>

  <!-- Overlap zone — purple where red + blue prints intersect -->
  <circle cx="58" cy="46" r="9" fill="#c4b5fd" stroke="#374151" stroke-width="1.5" stroke-linecap="round" opacity="0.78"/>
  <circle cx="62" cy="56" r="6" fill="#ede9fe" stroke="#374151" stroke-width="1" stroke-linecap="round" opacity="0.72"/>

  <!-- YELLOW bubble print cluster, bottom-centre -->
  <circle cx="58" cy="80" r="13" fill="#fde68a" stroke="#374151" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <circle cx="58" cy="80" r="6.5" fill="#fef9c3" opacity="0.65"/>
  <circle cx="42" cy="86" r="8" fill="#fdba74" stroke="#374151" stroke-width="1.5" stroke-linecap="round" opacity="0.82"/>
  <circle cx="74" cy="84" r="9" fill="#fde68a" stroke="#374151" stroke-width="1.5" stroke-linecap="round" opacity="0.82"/>
  <circle cx="50" cy="70" r="5" fill="#fdba74" stroke="#374151" stroke-width="1" stroke-linecap="round" opacity="0.72"/>
  <circle cx="70" cy="72" r="5.5" fill="#fde68a" stroke="#374151" stroke-width="1" stroke-linecap="round" opacity="0.72"/>

  <!-- Mini colour bowls in top corners indicating swap -->
  <g transform="translate(16, 10)">
    <path d="M-7,0 Q-8,5 0,6 Q8,5 7,0 Z" fill="#fee2e2" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="7" ry="2.5" fill="#fca5a5" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(60, 9)">
    <path d="M-7,0 Q-8,5 0,6 Q8,5 7,0 Z" fill="#fef9c3" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="7" ry="2.5" fill="#fde68a" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(104, 10)">
    <path d="M-7,0 Q-8,5 0,6 Q8,5 7,0 Z" fill="#dbeafe" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="7" ry="2.5" fill="#93c5fd" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Swap arrow red → yellow bowl -->
  <path d="M23,10 Q40,4 53,9" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="52,7 57,10 52,13" fill="#374151"/>
  <!-- Swap arrow yellow → blue bowl -->
  <path d="M67,9 Q82,4 97,10" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="96,8 101,11 96,14" fill="#374151"/>
</svg>
