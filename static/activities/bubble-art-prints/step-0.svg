<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Step 0: Mix Your Bubble Paint — stir paint + soap + water into containers -->

  <!-- Table surface -->
  <rect x="0" y="96" width="120" height="24" fill="#f3f4f6" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Red paint tube, top-left, being squeezed -->
  <g transform="translate(18, 36) rotate(-20)">
    <rect x="-5" y="-3" width="24" height="9" fill="#fca5a5" stroke="#374151" stroke-width="1.5" stroke-linecap="round" rx="2"/>
    <path d="M19,-3 L24,-1 L24,6 L19,6" fill="#ef4444" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- squeeze ridge lines -->
    <line x1="2" y1="-2" x2="2" y2="7" stroke="#f87171" stroke-width="1" stroke-linecap="round"/>
    <line x1="6" y1="-2" x2="6" y2="7" stroke="#f87171" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Red paint blob dripping from tube -->
  <ellipse cx="38" cy="30" rx="4" ry="3.5" fill="#ef4444" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Arrow: red paint blob → left red bowl.
       Path ends at wing level (24,67); polygon tip at (24,72) extends into bowl — matches pattern of other two arrows. -->
  <path d="M38,34 Q22,50 24,67" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="24,72 21,67 27,67" fill="#374151"/>

  <!-- Soap bottle, centre-top, tilted pouring -->
  <g transform="translate(60, 22) rotate(15)">
    <rect x="-5" y="0" width="10" height="20" fill="#d1fae5" stroke="#374151" stroke-width="1.5" stroke-linecap="round" rx="2"/>
    <rect x="-3" y="-5" width="6" height="7" fill="#86efac" stroke="#374151" stroke-width="1.5" stroke-linecap="round" rx="1"/>
    <rect x="-4" y="5" width="8" height="5" fill="#6ee7b7" stroke="#374151" stroke-width="1" rx="1"/>
    <!-- soap drip -->
    <path d="M0,-5 Q0,-10 0,-14" fill="none" stroke="#86efac" stroke-width="2" stroke-linecap="round" stroke-dasharray="2,2"/>
    <ellipse cx="0" cy="-15" rx="2" ry="2.5" fill="#86efac" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- arrow soap drip → middle yellow bowl -->
  <path d="M60,38 Q60,50 60,60" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,2"/>
  <polygon points="57,60 60,65 63,60" fill="#374151"/>

  <!-- Water droplets near top -->
  <ellipse cx="90" cy="26" rx="2.5" ry="3" fill="#93c5fd" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="96" cy="32" rx="2" ry="2.5" fill="#93c5fd" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="86" cy="34" rx="1.5" ry="2" fill="#93c5fd" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- arrow water → right blue bowl -->
  <path d="M92,36 Q96,50 96,60" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,2"/>
  <polygon points="93,60 96,65 99,60" fill="#374151"/>

  <!-- Left container — RED paint mix -->
  <g transform="translate(24, 78)">
    <path d="M-14,0 L-15,16 L15,16 L14,0 Z" fill="#fee2e2" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="14" ry="4.5" fill="#fca5a5" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="1" rx="11" ry="3.5" fill="#ef4444" opacity="0.8"/>
    <!-- foam bubbles on surface -->
    <circle cx="-4" cy="0" r="2" fill="#fca5a5" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="3" cy="-1" r="1.5" fill="#fee2e2" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- Middle container — YELLOW (hero, being stirred with straw) -->
  <g transform="translate(60, 76)">
    <path d="M-17,0 L-18,20 L18,20 L17,0 Z" fill="#fef9c3" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="17" ry="5.5" fill="#fde68a" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="0" cy="1" rx="14" ry="4.5" fill="#f59e0b" opacity="0.75"/>
    <!-- swirl lines -->
    <path d="M-7,8 Q0,5 7,8 Q0,11 -7,8" fill="none" stroke="#d97706" stroke-width="1" stroke-linecap="round"/>
    <path d="M-5,13 Q0,11 5,13" fill="none" stroke="#d97706" stroke-width="1" stroke-linecap="round"/>
    <!-- stir stick going in at angle -->
  </g>
  <!-- Stir stick for yellow bowl -->
  <g transform="translate(71, 55) rotate(18)">
    <rect x="-2" y="0" width="4" height="28" fill="#fbbf24" stroke="#374151" stroke-width="1.5" stroke-linecap="round" rx="2"/>
    <ellipse cx="0" cy="28" rx="3.5" ry="2.5" fill="#fbbf24" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- arc + arrowhead showing stir rotation -->
  <path d="M53,72 Q55,67 60,66 Q65,65 68,69" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="68,69 72,67 70,73" fill="#374151"/>

  <!-- Right container — BLUE paint mix -->
  <g transform="translate(96, 78)">
    <path d="M-13,0 L-14,16 L14,16 L13,0 Z" fill="#dbeafe" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="13" ry="4" fill="#93c5fd" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="1" rx="10" ry="3" fill="#3b82f6" opacity="0.75"/>
    <circle cx="-3" cy="0" r="1.5" fill="#93c5fd" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="4" cy="-1" r="1.5" fill="#dbeafe" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>
