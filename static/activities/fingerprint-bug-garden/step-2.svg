<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Paper with dried fingerprint bugs + marker details being added -->
  <rect x="8" y="10" width="104" height="104" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Ladybird (red thumbprint body) with details -->
  <ellipse cx="30" cy="46" rx="14" ry="16" fill="#ef4444" stroke="#374151" stroke-width="2"/>
  <!-- Ladybird centre line -->
  <line x1="30" y1="30" x2="30" y2="62" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ladybird spots -->
  <circle cx="24" cy="42" r="3" fill="#374151"/>
  <circle cx="36" cy="42" r="3" fill="#374151"/>
  <circle cx="24" cy="54" r="2.5" fill="#374151"/>
  <circle cx="36" cy="54" r="2.5" fill="#374151"/>
  <!-- Ladybird head (small black circle) -->
  <ellipse cx="30" cy="30" rx="8" ry="6" fill="#374151" stroke="#374151" stroke-width="1"/>
  <!-- Eyes -->
  <circle cx="27" cy="29" r="1.5" fill="white"/>
  <circle cx="33" cy="29" r="1.5" fill="white"/>
  <!-- Legs (6 total) -->
  <line x1="18" y1="42" x2="10" y2="38" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="48" x2="10" y2="48" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="54" x2="10" y2="58" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="42" x2="50" y2="38" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="48" x2="50" y2="48" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="54" x2="50" y2="58" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Antennae -->
  <line x1="27" y1="24" x2="22" y2="16" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="22" cy="16" r="2" fill="#374151"/>
  <line x1="33" y1="24" x2="38" y2="16" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="38" cy="16" r="2" fill="#374151"/>
  <!-- Bumblebee (yellow body) with details -->
  <ellipse cx="80" cy="50" rx="12" ry="16" fill="#f59e0b" stroke="#374151" stroke-width="2"/>
  <!-- Bee stripes -->
  <line x1="68" y1="44" x2="92" y2="44" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <line x1="68" y1="54" x2="92" y2="54" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <!-- Bee head -->
  <ellipse cx="80" cy="34" rx="8" ry="6" fill="#374151" stroke="#374151" stroke-width="1"/>
  <circle cx="77" cy="33" r="1.5" fill="white"/>
  <circle cx="83" cy="33" r="1.5" fill="white"/>
  <!-- Bee wings -->
  <ellipse cx="68" cy="42" rx="8" ry="5" fill="#dbeafe" stroke="#374151" stroke-width="1" opacity="0.8"/>
  <ellipse cx="92" cy="42" rx="8" ry="5" fill="#dbeafe" stroke="#374151" stroke-width="1" opacity="0.8"/>
  <!-- Bee legs -->
  <line x1="70" y1="50" x2="62" y2="55" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="56" x2="62" y2="62" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="90" y1="50" x2="98" y2="55" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="90" y1="56" x2="98" y2="62" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bee antennae -->
  <line x1="76" y1="28" x2="70" y2="20" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="70" cy="20" r="2" fill="#374151"/>
  <line x1="84" y1="28" x2="90" y2="20" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="90" cy="20" r="2" fill="#374151"/>
  <!-- Marker being used to draw -->
  <line x1="100" y1="80" x2="86" y2="94" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="86,94 83,89 90,90" fill="#374151"/>
  <!-- Marker cap off to the side -->
  <rect x="102" y="72" width="12" height="6" rx="3" fill="#374151" stroke="#374151" stroke-width="1"/>
</svg>
