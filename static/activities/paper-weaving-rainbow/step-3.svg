<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background (wall) -->
  <rect width="120" height="120" fill="#dbeafe"/>

  <!-- Hanging rod / dowel -->
  <rect x="22" y="8" width="76" height="5" rx="2" fill="#d97706" stroke="#374151" stroke-width="1.5"/>

  <!-- String through hole -->
  <line x1="60" y1="13" x2="60" y2="20" stroke="#374151" stroke-width="2" stroke-linecap="round"/>

  <!-- Hole punch circle -->
  <circle cx="60" cy="22" r="4" fill="#f9fafb" stroke="#374151" stroke-width="2"/>

  <!-- Finished woven piece — full rainbow grid -->
  <!-- Base loom paper -->
  <rect x="18" y="22" width="84" height="88" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>

  <!-- Vertical loom bands -->
  <rect x="18" y="22" width="18" height="88" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <rect x="43" y="22" width="18" height="88" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <rect x="68" y="22" width="18" height="88" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <rect x="93" y="22" width="9"  height="88" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Horizontal woven strips — alternating over/under with loom bands -->
  <!-- Red (row 1, y=26) — OVER bands 1,3; under 2,4 -->
  <rect x="18" y="26" width="84" height="11" fill="#ef4444"/>
  <rect x="43" y="26" width="18" height="11" fill="#e5e7eb"/>
  <rect x="93" y="26" width="9"  height="11" fill="#e5e7eb"/>
  <line x1="18" y1="26" x2="102" y2="26" stroke="#374151" stroke-width="1"/>
  <line x1="18" y1="37" x2="102" y2="37" stroke="#374151" stroke-width="1"/>

  <!-- Orange (row 2, y=39) — UNDER bands 1,3; over 2,4 -->
  <rect x="18" y="39" width="84" height="11" fill="#f97316"/>
  <rect x="18" y="39" width="18" height="11" fill="#e5e7eb"/>
  <rect x="68" y="39" width="18" height="11" fill="#e5e7eb"/>
  <line x1="18" y1="39" x2="102" y2="39" stroke="#374151" stroke-width="1"/>
  <line x1="18" y1="50" x2="102" y2="50" stroke="#374151" stroke-width="1"/>

  <!-- Yellow (row 3, y=52) — same as red -->
  <rect x="18" y="52" width="84" height="11" fill="#f59e0b"/>
  <rect x="43" y="52" width="18" height="11" fill="#e5e7eb"/>
  <rect x="93" y="52" width="9"  height="11" fill="#e5e7eb"/>
  <line x1="18" y1="52" x2="102" y2="52" stroke="#374151" stroke-width="1"/>
  <line x1="18" y1="63" x2="102" y2="63" stroke="#374151" stroke-width="1"/>

  <!-- Green (row 4, y=65) — same as orange -->
  <rect x="18" y="65" width="84" height="11" fill="#22c55e"/>
  <rect x="18" y="65" width="18" height="11" fill="#e5e7eb"/>
  <rect x="68" y="65" width="18" height="11" fill="#e5e7eb"/>
  <line x1="18" y1="65" x2="102" y2="65" stroke="#374151" stroke-width="1"/>
  <line x1="18" y1="76" x2="102" y2="76" stroke="#374151" stroke-width="1"/>

  <!-- Blue (row 5, y=78) — same as red -->
  <rect x="18" y="78" width="84" height="11" fill="#3b82f6"/>
  <rect x="43" y="78" width="18" height="11" fill="#e5e7eb"/>
  <rect x="93" y="78" width="9"  height="11" fill="#e5e7eb"/>
  <line x1="18" y1="78" x2="102" y2="78" stroke="#374151" stroke-width="1"/>
  <line x1="18" y1="89" x2="102" y2="89" stroke="#374151" stroke-width="1"/>

  <!-- Purple (row 6, y=91) — same as orange -->
  <rect x="18" y="91" width="84" height="11" fill="#a78bfa"/>
  <rect x="18" y="91" width="18" height="11" fill="#e5e7eb"/>
  <rect x="68" y="91" width="18" height="11" fill="#e5e7eb"/>
  <line x1="18" y1="91" x2="102" y2="91" stroke="#374151" stroke-width="1"/>
  <line x1="18" y1="102" x2="102" y2="102" stroke="#374151" stroke-width="1"/>

  <!-- Tape tabs at sides (beige/tan) -->
  <rect x="14" y="96" width="6" height="14" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="1"/>
  <rect x="100" y="96" width="6" height="14" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="1"/>

  <!-- Outer border of finished piece -->
  <rect x="18" y="22" width="84" height="88" rx="2" fill="none" stroke="#374151" stroke-width="2"/>
</svg>
