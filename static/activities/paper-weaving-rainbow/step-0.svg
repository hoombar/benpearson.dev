<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background -->
  <rect width="120" height="120" fill="#f9fafb"/>

  <!-- Table surface -->
  <rect x="0" y="90" width="120" height="30" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Paper sheet — white base, visible fill -->
  <rect x="14" y="16" width="92" height="68" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>

  <!-- Left half of paper (lighter shade = back of fold) -->
  <rect x="14" y="16" width="46" height="68" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>

  <!-- Fold crease line (dashed, centre) -->
  <line x1="60" y1="16" x2="60" y2="84" stroke="#374151" stroke-width="2" stroke-dasharray="5,3" stroke-linecap="round"/>

  <!-- Slit cuts from fold toward left edge — 5 slits, dark rectangles showing cuts -->
  <rect x="24" y="25" width="36" height="3" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
  <rect x="24" y="35" width="36" height="3" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
  <rect x="24" y="45" width="36" height="3" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
  <rect x="24" y="55" width="36" height="3" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
  <rect x="24" y="65" width="36" height="3" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="1"/>

  <!-- Stop-short line (orange dashed) — 2 cm from open edge -->
  <line x1="18" y1="16" x2="18" y2="84" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Bracket ticks -->
  <line x1="18" y1="17" x2="23" y2="17" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="83" x2="23" y2="83" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Fold arrow — right half folds over onto left -->
  <path d="M76,35 Q90,50 76,65" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <polygon points="73,62 76,68 80,63" fill="#374151"/>

  <!-- Scissors — blades pointing left toward slit cuts -->
  <g transform="translate(97,50) rotate(180)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="14" y2="4" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-4" cy="-4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <circle cx="-4" cy="4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  </g>
</svg>
