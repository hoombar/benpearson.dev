<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background -->
  <rect width="120" height="120" fill="#f9fafb"/>

  <!-- Loom base paper -->
  <rect x="8" y="8" width="104" height="104" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>

  <!-- Vertical loom strips (the slitted base) — light grey, spaced evenly -->
  <!-- These are the paper bands between the slits -->
  <rect x="8"  y="8" width="19" height="104" rx="0" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <rect x="35" y="8" width="19" height="104" rx="0" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <rect x="62" y="8" width="19" height="104" rx="0" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <rect x="89" y="8" width="23" height="104" rx="0" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Slit gaps between bands (white openings where strips go "under") -->
  <rect x="27" y="8"  width="8" height="104" fill="#f9fafb"/>
  <rect x="54" y="8"  width="8" height="104" fill="#f9fafb"/>
  <rect x="81" y="8"  width="8" height="104" fill="#f9fafb"/>

  <!-- Woven horizontal strips — over/under pattern clearly shown -->
  <!-- Row 1: Red — starts OVER (band 1), UNDER (gap 1), OVER (band 2), UNDER (gap 2), OVER (band 3) -->
  <!-- "Under" segments: drawn below loom bands, clipped by them -->
  <!-- "Over" segments: drawn on top of loom bands -->
  <!-- We simulate over/under by drawing full strip then covering with band rects where it goes under -->

  <!-- Red strip row (y=18, h=10) -->
  <rect x="8"  y="18" width="104" height="10" rx="1" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <!-- Cover where red goes "under" bands 2 and 4 (these bands occlude the strip) -->
  <rect x="35" y="18" width="19" height="10" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <rect x="89" y="18" width="23" height="10" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Orange strip row (y=33, h=10) — starts UNDER band 1, OVER gap 1, UNDER band 2... -->
  <rect x="8"  y="33" width="104" height="10" rx="1" fill="#f97316" stroke="#374151" stroke-width="1.5"/>
  <!-- Cover where orange goes under (bands 1, 3) -->
  <rect x="8"  y="33" width="19" height="10" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <rect x="62" y="33" width="19" height="10" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Yellow strip row (y=48, h=10) — same pattern as red -->
  <rect x="8"  y="48" width="104" height="10" rx="1" fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>
  <rect x="35" y="48" width="19" height="10" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <rect x="89" y="48" width="23" height="10" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Green strip row (y=63, h=10) — same pattern as orange -->
  <rect x="8"  y="63" width="104" height="10" rx="1" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <rect x="8"  y="63" width="19" height="10" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <rect x="62" y="63" width="19" height="10" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Blue strip row (y=78, h=10) — same as red/yellow -->
  <rect x="8"  y="78" width="104" height="10" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  <rect x="35" y="78" width="19" height="10" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <rect x="89" y="78" width="23" height="10" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Purple strip being actively woven in — partially inserted, arrow shows direction -->
  <!-- Visible portion coming from right, entering gap -->
  <rect x="89" y="93" width="23" height="10" rx="1" fill="#a78bfa" stroke="#374151" stroke-width="2.5"/>
  <rect x="62" y="93" width="19" height="10" rx="1" fill="#a78bfa" stroke="#374151" stroke-width="2.5"/>
  <!-- Purple goes under band at 35, so it's hidden there — but visible in gap before it -->
  <rect x="27" y="93" width="8"  height="10" fill="#a78bfa" stroke="#374151" stroke-width="2"/>
  <!-- Arrow showing strip being pushed left -->
  <polygon points="14,98 21,94 21,102" fill="#374151"/>
  <line x1="21" y1="98" x2="26" y2="98" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
</svg>
