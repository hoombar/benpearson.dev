<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect x="0" y="0" width="120" height="80" fill="#dbeafe" stroke="none"/>
  <!-- Grass ground -->
  <rect x="0" y="80" width="120" height="40" fill="#86efac" stroke="none"/>
  <line x1="0" y1="80" x2="120" y2="80" stroke="#374151" stroke-width="1.5"/>

  <!-- Basket/bag for collecting -->
  <path d="M42,78 Q42,98 60,98 Q78,98 78,78" fill="#d97706" stroke="#374151" stroke-width="1.5"/>
  <path d="M42,78 Q60,72 78,78" fill="none" stroke="#374151" stroke-width="1.5"/>
  <!-- Handle -->
  <path d="M48,78 Q60,62 72,78" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>

  <!-- Items being collected -->
  <!-- Large leaf -->
  <path d="M22,50 Q16,42 22,34 Q28,26 34,34 Q40,42 34,50 Q28,56 22,50 Z" fill="#22c55e" stroke="#374151" stroke-width="1.2"/>
  <line x1="28" y1="34" x2="28" y2="52" stroke="#374151" stroke-width="0.6"/>

  <!-- Feather -->
  <line x1="86" y1="26" x2="86" y2="60" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M86,30 Q80,28 82,34 Q84,38 86,36" fill="#93c5fd" stroke="#374151" stroke-width="0.5"/>
  <path d="M86,30 Q92,28 90,34 Q88,38 86,36" fill="#93c5fd" stroke="#374151" stroke-width="0.5"/>
  <path d="M86,38 Q80,36 82,42 Q84,46 86,44" fill="#93c5fd" stroke="#374151" stroke-width="0.5"/>
  <path d="M86,38 Q92,36 90,42 Q88,46 86,44" fill="#93c5fd" stroke="#374151" stroke-width="0.5"/>

  <!-- Pine needles cluster -->
  <line x1="58" y1="44" x2="52" y2="36" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>
  <line x1="58" y1="44" x2="54" y2="34" stroke="#16a34a" stroke-width="1" stroke-linecap="round"/>
  <line x1="58" y1="44" x2="62" y2="34" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>
  <line x1="58" y1="44" x2="64" y2="36" stroke="#16a34a" stroke-width="1" stroke-linecap="round"/>
  <line x1="58" y1="44" x2="58" y2="32" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>

  <!-- Flower -->
  <circle cx="100" cy="72" r="4" fill="#fca5a5" stroke="#374151" stroke-width="0.8"/>
  <circle cx="100" cy="72" r="1.5" fill="#f59e0b" stroke="none"/>
  <line x1="100" y1="76" x2="100" y2="86" stroke="#22c55e" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Grass tuft -->
  <line x1="14" y1="80" x2="12" y2="68" stroke="#22c55e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="14" y1="80" x2="16" y2="66" stroke="#16a34a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="14" y1="80" x2="10" y2="70" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>
  <line x1="14" y1="80" x2="18" y2="70" stroke="#16a34a" stroke-width="1" stroke-linecap="round"/>

  <!-- Magnifying glass (searching) -->
  <circle cx="48" cy="32" r="6" fill="none" stroke="#374151" stroke-width="1.5"/>
  <line x1="52" y1="36" x2="58" y2="44" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
</svg>