<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table/ground surface -->
  <rect x="0" y="70" width="120" height="50" fill="#86efac" stroke="none"/>
  <line x1="0" y1="70" x2="120" y2="70" stroke="#374151" stroke-width="1.5"/>

  <!-- Large paper sheet on ground -->
  <rect x="10" y="40" width="100" height="56" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>

  <!-- Paint containers (jar lids) -->
  <circle cx="24" cy="26" r="10" fill="#ef4444" stroke="#374151" stroke-width="1.2"/>
  <circle cx="24" cy="26" r="7" fill="#fca5a5" stroke="none"/>

  <circle cx="52" cy="22" r="10" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>
  <circle cx="52" cy="22" r="7" fill="#93c5fd" stroke="none"/>

  <circle cx="80" cy="26" r="10" fill="#22c55e" stroke="#374151" stroke-width="1.2"/>
  <circle cx="80" cy="26" r="7" fill="#86efac" stroke="none"/>

  <circle cx="106" cy="22" r="10" fill="#fbbf24" stroke="#374151" stroke-width="1.2"/>
  <circle cx="106" cy="22" r="7" fill="#fde68a" stroke="none"/>

  <!-- Nature brushes laid out beside paper -->
  <!-- Leaf brush -->
  <line x1="14" y1="34" x2="14" y2="16" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <path d="M14,34 Q10,32 12,36 Q14,40 16,36 Q18,32 14,34 Z" fill="#22c55e" stroke="#374151" stroke-width="0.5"/>

  <!-- Feather brush -->
  <line x1="40" y1="36" x2="40" y2="14" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>

  <!-- Grass brush -->
  <line x1="94" y1="36" x2="94" y2="14" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
</svg>