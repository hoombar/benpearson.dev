<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Nature brush 1: leaf brush (hero, centre-left) -->
  <!-- Stick handle -->
  <line x1="24" y1="14" x2="24" y2="66" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <!-- Leaf tied to end -->
  <path d="M24,66 Q16,60 18,70 Q20,78 24,82 Q28,78 30,70 Q32,60 24,66 Z" fill="#22c55e" stroke="#374151" stroke-width="1"/>
  <line x1="24" y1="66" x2="24" y2="80" stroke="#374151" stroke-width="0.5"/>
  <!-- String binding -->
  <ellipse cx="24" cy="66" rx="4" ry="2" fill="none" stroke="#d97706" stroke-width="1.5"/>

  <!-- Nature brush 2: feather brush -->
  <line x1="52" y1="14" x2="52" y2="58" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <!-- Feather -->
  <line x1="52" y1="58" x2="52" y2="88" stroke="#374151" stroke-width="0.6"/>
  <path d="M52,62 Q46,60 48,66 Q50,70 52,68" fill="#93c5fd" stroke="#374151" stroke-width="0.4"/>
  <path d="M52,62 Q58,60 56,66 Q54,70 52,68" fill="#93c5fd" stroke="#374151" stroke-width="0.4"/>
  <path d="M52,70 Q46,68 48,74 Q50,78 52,76" fill="#93c5fd" stroke="#374151" stroke-width="0.4"/>
  <path d="M52,70 Q58,68 56,74 Q54,78 52,76" fill="#93c5fd" stroke="#374151" stroke-width="0.4"/>
  <path d="M52,78 Q48,76 50,82 Q51,86 52,84" fill="#93c5fd" stroke="#374151" stroke-width="0.4"/>
  <path d="M52,78 Q56,76 54,82 Q53,86 52,84" fill="#93c5fd" stroke="#374151" stroke-width="0.4"/>
  <!-- String -->
  <ellipse cx="52" cy="58" rx="4" ry="2" fill="none" stroke="#d97706" stroke-width="1.5"/>

  <!-- Nature brush 3: grass brush -->
  <line x1="80" y1="14" x2="80" y2="58" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <!-- Grass blades -->
  <line x1="80" y1="58" x2="74" y2="82" stroke="#22c55e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="80" y1="58" x2="78" y2="86" stroke="#16a34a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="80" y1="58" x2="80" y2="88" stroke="#22c55e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="80" y1="58" x2="82" y2="86" stroke="#16a34a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="80" y1="58" x2="86" y2="82" stroke="#22c55e" stroke-width="1.2" stroke-linecap="round"/>
  <!-- String -->
  <ellipse cx="80" cy="58" rx="5" ry="2" fill="none" stroke="#d97706" stroke-width="1.5"/>

  <!-- String ball nearby -->
  <circle cx="106" cy="44" r="8" fill="#d97706" stroke="#374151" stroke-width="1.2"/>
  <path d="M106,36 Q110,40 106,44 Q102,48 106,52" fill="none" stroke="#fef3c7" stroke-width="0.8"/>
</svg>