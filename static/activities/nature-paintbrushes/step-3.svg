<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground/table surface -->
  <rect x="0" y="90" width="120" height="30" fill="#86efac" stroke="none"/>
  <line x1="0" y1="90" x2="120" y2="90" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper with textured art (hero) -->
  <rect x="8" y="8" width="104" height="78" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>

  <!-- Leaf sweep marks (broad, swooshy) -->
  <path d="M16,50 Q30,44 50,50 Q70,56 80,48" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <path d="M20,58 Q40,52 60,58" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Feather lines (delicate, thin) -->
  <line x1="30" y1="22" x2="80" y2="28" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="34" y1="26" x2="76" y2="32" stroke="#3b82f6" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="28" y1="18" x2="84" y2="22" stroke="#3b82f6" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>

  <!-- Grass scratch marks (fine, scratchy) -->
  <line x1="82" y1="40" x2="86" y2="68" stroke="#ef4444" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="84" y1="38" x2="90" y2="66" stroke="#ef4444" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="86" y1="42" x2="92" y2="70" stroke="#ef4444" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="88" y1="40" x2="94" y2="64" stroke="#ef4444" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>
  <line x1="90" y1="44" x2="96" y2="68" stroke="#ef4444" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>

  <!-- Flower stamp marks (round dabs) -->
  <circle cx="26" cy="70" r="5" fill="#fbbf24" stroke="none" opacity="0.5"/>
  <circle cx="40" cy="66" r="4" fill="#fbbf24" stroke="none" opacity="0.6"/>
  <circle cx="52" cy="72" r="5" fill="#fbbf24" stroke="none" opacity="0.4"/>
  <circle cx="66" cy="68" r="4" fill="#ef4444" stroke="none" opacity="0.4"/>
  <circle cx="34" cy="74" r="3" fill="#ef4444" stroke="none" opacity="0.5"/>

  <!-- Nature brush being used (leaf brush dipping in paint) -->
  <line x1="18" y1="82" x2="18" y2="56" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M18,56 Q14,54 16,58 Q18,62 20,58 Q22,54 18,56 Z" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
  <!-- Paint drip -->
  <circle cx="18" cy="64" r="1.5" fill="#22c55e" stroke="none" opacity="0.5"/>
</svg>