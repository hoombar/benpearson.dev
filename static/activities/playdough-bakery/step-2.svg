<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background -->
  <rect width="120" height="120" fill="#f9fafb"/>

  <!-- Bakery counter (hero surface) -->
  <rect x="4" y="72" width="112" height="18" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="2.5"/>
  <!-- Counter edge shadow -->
  <rect x="4" y="88" width="112" height="4" rx="1" fill="#d97706"/>
  <!-- Counter legs -->
  <rect x="14" y="90" width="8" height="26" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <rect x="98" y="90" width="8" height="26" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>

  <!-- Display tray 1 (left) — golden baking tray -->
  <rect x="8"  y="54" width="32" height="20" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <!-- Tray rim highlight -->
  <rect x="9"  y="55" width="30" height="4"  rx="1" fill="#fde68a"/>
  <!-- Bread roll on tray -->
  <ellipse cx="24" cy="66" rx="10" ry="7" fill="#f97316" stroke="#374151" stroke-width="1.5"/>
  <!-- Roll highlight -->
  <ellipse cx="21" cy="63" rx="3" ry="2" fill="#fdba74" opacity="0.8"/>
  <!-- Roll score line -->
  <path d="M18,66 Q24,62 30,66" fill="none" stroke="#d97706" stroke-width="1" stroke-linecap="round"/>

  <!-- Display tray 2 (centre) -->
  <rect x="44" y="54" width="32" height="20" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <rect x="45" y="55" width="30" height="4"  rx="1" fill="#fde68a"/>
  <!-- Croissant shape -->
  <path d="M50,70 Q52,58 60,62 Q68,58 70,70 Q65,68 60,66 Q55,68 50,70 Z" fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>
  <!-- Croissant layers -->
  <path d="M53,67 Q60,63 67,67" fill="none" stroke="#d97706" stroke-width="1" stroke-linecap="round"/>

  <!-- Display tray 3 (right) — the star attraction, pink cake -->
  <rect x="80" y="50" width="36" height="24" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
  <rect x="81" y="51" width="34" height="4"  rx="1" fill="#fde68a"/>
  <!-- Layered cake body -->
  <rect x="86" y="60" width="24" height="12" rx="2" fill="#a78bfa" stroke="#374151" stroke-width="1.5"/>
  <!-- Cake layer split -->
  <line x1="86" y1="66" x2="110" y2="66" stroke="#7c3aed" stroke-width="1"/>
  <!-- Icing on top -->
  <path d="M86,60 Q98,54 110,60" fill="#ede9fe" stroke="#374151" stroke-width="1.5"/>
  <!-- Candle on cake -->
  <rect x="96" y="52" width="4" height="9" rx="1" fill="#ef4444" stroke="#374151" stroke-width="1"/>
  <!-- Flame -->
  <path d="M98,52 Q101,48 98,44 Q95,48 98,52 Z" fill="#f59e0b" stroke="#f97316" stroke-width="1"/>

  <!-- Bakery sign hanging above -->
  <rect x="30" y="8" width="60" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <!-- Sign string left -->
  <line x1="36" y1="8" x2="36" y2="4" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sign string right -->
  <line x1="84" y1="8" x2="84" y2="4" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sign decoration lines (representing text) -->
  <line x1="40" y1="15" x2="80" y2="15" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="22" x2="74" y2="22" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Decorative stars on sign -->
  <polygon points="36,19 37.5,15 39,19 35.5,17 40,17" fill="#f59e0b"/>
  <polygon points="81,19 82.5,15 84,19 80.5,17 85,17" fill="#f59e0b"/>
</svg>
