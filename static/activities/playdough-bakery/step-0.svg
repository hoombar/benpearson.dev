<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background -->
  <rect width="120" height="120" fill="#f9fafb"/>

  <!-- Counter surface -->
  <rect x="0" y="96" width="120" height="24" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Mixing bowl — large, centred, hero element -->
  <!-- Bowl body -->
  <path d="M16,56 Q16,108 60,108 Q104,108 104,56 Z" fill="#dbeafe" stroke="#374151" stroke-width="2.5"/>
  <!-- Bowl rim -->
  <ellipse cx="60" cy="56" rx="44" ry="8" fill="#93c5fd" stroke="#374151" stroke-width="2.5"/>
  <!-- Dough forming in bowl (pale yellow/cream) -->
  <ellipse cx="60" cy="94" rx="32" ry="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>

  <!-- Flour sack (top-left) -->
  <rect x="5" y="20" width="24" height="22" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Tied top of sack -->
  <path d="M5,20 Q17,12 29,20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- "FLOUR" cross marks on sack -->
  <line x1="12" y1="27" x2="22" y2="27" stroke="#9ca3af" stroke-width="1" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="22" y2="32" stroke="#9ca3af" stroke-width="1" stroke-linecap="round"/>
  <!-- Flour cloud pouring down -->
  <path d="M17,42 Q17,52 17,54" fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round" stroke-dasharray="3,3"/>
  <polygon points="14,52 17,58 20,52" fill="#e5e7eb"/>

  <!-- Salt shaker (top-centre) -->
  <rect x="52" y="12" width="14" height="30" rx="7" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Cap -->
  <rect x="54" y="10" width="10" height="5" rx="2" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
  <!-- Salt holes -->
  <circle cx="57" cy="17" r="1.2" fill="#9ca3af"/>
  <circle cx="62" cy="17" r="1.2" fill="#9ca3af"/>
  <!-- Salt pouring -->
  <line x1="59" y1="42" x2="59" y2="54" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-dasharray="2,3"/>
  <polygon points="56,52 59,57 62,52" fill="#9ca3af"/>

  <!-- Water drop (top-right, blue) -->
  <path d="M96,14 Q103,26 103,32 Q103,44 96,44 Q89,44 89,32 Q89,26 96,14 Z" fill="#93c5fd" stroke="#3b82f6" stroke-width="2"/>
  <!-- Highlight on drop -->
  <ellipse cx="93" cy="26" rx="2" ry="4" fill="#dbeafe" opacity="0.7"/>
  <!-- Water pouring down -->
  <line x1="96" y1="44" x2="96" y2="54" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,3"/>
  <polygon points="93,52 96,58 99,52" fill="#3b82f6"/>

  <!-- Spoon stirring -->
  <line x1="88" y1="28" x2="78" y2="62" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="74" cy="68" rx="10" ry="7" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <!-- Stirring arc on bowl — marker auto-aligns to tangent (76−60,76−68) = (16,8) = 27° right-down -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M44,76 Q60,68 76,76" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,2" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
