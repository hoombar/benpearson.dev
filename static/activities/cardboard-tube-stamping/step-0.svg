<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Cardboard tube (round, unshapen) -->
  <g transform="translate(10, 20)">
    <rect x="0" y="0" width="20" height="50" rx="2" fill="#d4a574" stroke="#374151" stroke-width="1"/>
    <ellipse cx="10" cy="0" rx="10" ry="4" fill="#c4956a" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="10" cy="50" rx="10" ry="4" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Heart-shaped tube (hero) -->
  <g transform="translate(42, 20)">
    <rect x="0" y="10" width="20" height="40" rx="2" fill="#d4a574" stroke="#374151" stroke-width="1"/>
    <!-- Heart shape at top -->
    <path d="M10,0 Q0,-4 2,4 Q4,8 10,14 Q16,8 18,4 Q20,-4 10,0 Z" fill="#c4956a" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Star-shaped tube -->
  <g transform="translate(74, 20)">
    <rect x="0" y="10" width="20" height="40" rx="2" fill="#d4a574" stroke="#374151" stroke-width="1"/>
    <!-- Star shape at top (5 points) -->
    <polygon points="10,0 12,6 18,6 13,10 15,16 10,12 5,16 7,10 2,6 8,6" fill="#c4956a" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Hand pinching tube -->
  <g transform="translate(36, 4)">
    <rect x="0" y="0" width="8" height="16" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g transform="translate(58, 4)">
    <rect x="0" y="0" width="8" height="16" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Pinch arrows -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="38" y1="12" x2="44" y2="12" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
  <line x1="64" y1="12" x2="58" y2="12" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Tape -->
  <g transform="translate(14, 78)">
    <ellipse cx="10" cy="10" rx="10" ry="10" fill="#d1fae5" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="10" cy="10" rx="4" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="0.4"/>
  </g>
</svg>
