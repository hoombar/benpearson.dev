<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate as paint pad (hero) -->
  <ellipse cx="56" cy="52" rx="40" ry="32" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>

  <!-- Paint blobs on plate -->
  <ellipse cx="34" cy="40" rx="14" ry="8" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
  <ellipse cx="72" cy="40" rx="14" ry="8" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>
  <ellipse cx="36" cy="62" rx="14" ry="8" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
  <ellipse cx="70" cy="62" rx="14" ry="8" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>

  <!-- Paint bottles pouring -->
  <g transform="translate(90, 10) rotate(30)">
    <rect x="0" y="0" width="10" height="26" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
    <rect x="2" y="0" width="6" height="6" rx="1" fill="#ef4444" stroke="#374151" stroke-width="0.5"/>
    <!-- Paint drip -->
    <circle cx="5" cy="28" r="2" fill="#ef4444" stroke="#374151" stroke-width="0.3"/>
  </g>

  <!-- Dashed lines showing paint spreading -->
  <path d="M34,40 Q34,36 34,32" fill="none" stroke="#fca5a5" stroke-width="0.5" stroke-dasharray="2,2"/>
</svg>
