<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Side view of caterpillar with 5 body cups and a head, legs sticking out -->
  <!-- Floor line -->
  <line x1="4" y1="96" x2="116" y2="96" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Head cup (red, large, front) -->
  <path d="M4 96 Q4 68 22 68 Q40 68 40 96 Z" stroke="#374151" stroke-width="2" fill="#ef4444"/>
  <!-- Eyes and smile on head -->
  <circle cx="16" cy="78" r="3" stroke="#374151" stroke-width="1.5" fill="white"/>
  <circle cx="16" cy="78" r="1.5" fill="#374151"/>
  <path d="M12 87 Q16 91 20 87" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Antennae -->
  <path d="M14 68 Q10 56 6 50" stroke="#22c55e" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="5" cy="48" r="3" stroke="#22c55e" stroke-width="2" fill="none"/>
  <path d="M22 68 Q26 56 30 50" stroke="#22c55e" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="31" cy="48" r="3" stroke="#22c55e" stroke-width="2" fill="none"/>
  <!-- Body cup 2 (orange) -->
  <path d="M40 96 Q40 70 56 70 Q72 70 72 96 Z" stroke="#374151" stroke-width="2" fill="#f97316"/>
  <!-- Legs on cup 2 -->
  <line x1="44" y1="88" x2="36" y2="100" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="90" x2="44" y2="104" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="88" x2="76" y2="100" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Body cup 3 (yellow) -->
  <path d="M72 96 Q72 72 86 72 Q100 72 100 96 Z" stroke="#374151" stroke-width="2" fill="#f59e0b"/>
  <!-- Legs on cup 3 -->
  <line x1="76" y1="89" x2="68" y2="102" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="96" y1="89" x2="104" y2="102" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Body cup 4 (green, partial) -->
  <path d="M100 96 Q100 74 112 74 Q120 74 120 96 Z" stroke="#374151" stroke-width="2" fill="#22c55e"/>
  <!-- Legs on cup 4 -->
  <line x1="104" y1="90" x2="98" y2="104" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
</svg>
