  <!-- Two googly eyes -->
  <circle cx="44" cy="68" r="10" stroke="#374151" stroke-width="2" fill="white"/>
  <circle cx="44" cy="68" r="5" fill="#374151"/>
  <circle cx="46" cy="66" r="1.5" fill="white"/>
  <circle cx="76" cy="68" r="10" stroke="#374151" stroke-width="2" fill="white"/>
  <circle cx="76" cy="68" r="5" fill="#374151"/>
  <circle cx="78" cy="66" r="1.5" fill="white"/>
  <!-- Smile -->
  <path d="M44 84 Q60 92 76 84" stroke="#374151" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Pipe cleaner antennae — two curved wires with loops at top -->
  <path d="M48 46 Q40 26 30 18" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="28" cy="16" r="5" stroke="#22c55e" stroke-width="2.5" fill="none"/>
