<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Egg carton strip: 6 egg cups as bumpy ovals, top-down isometric view -->
  <!-- Outer carton rectangle -->
  <rect x="8" y="48" width="104" height="36" rx="4" stroke="#374151" stroke-width="2" fill="#fef3c7"/>
  <!-- 6 cup openings (ellipses) spaced across the carton -->
  <ellipse cx="20" cy="66" rx="8" ry="10" stroke="#374151" stroke-width="1.5" fill="#fbbf24"/>
  <ellipse cx="38" cy="66" rx="8" ry="10" stroke="#374151" stroke-width="1.5" fill="#fbbf24"/>
  <ellipse cx="56" cy="66" rx="8" ry="10" stroke="#374151" stroke-width="1.5" fill="#fbbf24"/>
  <ellipse cx="74" cy="66" rx="8" ry="10" stroke="#374151" stroke-width="1.5" fill="#fbbf24"/>
  <ellipse cx="92" cy="66" rx="8" ry="10" stroke="#374151" stroke-width="1.5" fill="#fbbf24"/>
  <ellipse cx="110" cy="66" rx="6" ry="10" stroke="#374151" stroke-width="1.5" fill="#fbbf24"/>
  <!-- Dashed cut lines along top and bottom edges of the strip -->
  <line x1="8" y1="48" x2="112" y2="48" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" stroke-linecap="round"/>
  <line x1="8" y1="84" x2="112" y2="84" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" stroke-linecap="round"/>
  <!-- Scissors at the left cutting along the top dashed line -->
  <g transform="translate(14, 30) rotate(10)">
    <line x1="0" y1="0" x2="18" y2="0" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="16" y2="5" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-5" cy="-4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <circle cx="-5" cy="4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  </g>
  <!-- Label showing "cut here" arrow along dashed line -->
  <line x1="36" y1="38" x2="36" y2="45" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M33 42 L36 46 L39 42" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
