<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Window background -->
  <rect x="0" y="0" width="120" height="120" fill="#dbeafe" stroke="none"/>
  <!-- Window frame -->
  <rect x="4" y="4" width="112" height="112" rx="2" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="60" y1="4" x2="60" y2="116" stroke="#374151" stroke-width="2"/>

  <!-- String/garland across window -->
  <path d="M8,32 Q60,40 112,32" fill="none" stroke="#d97706" stroke-width="1.5"/>

  <!-- Butterfly 1 (hanging from string, left) -->
  <line x1="28" y1="34" x2="28" y2="42" stroke="#d97706" stroke-width="0.8"/>
  <!-- Wings -->
  <path d="M28,52 Q18,42 16,48 Q14,54 22,56 Z" fill="#fca5a5" stroke="#374151" stroke-width="0.8" opacity="0.7"/>
  <path d="M28,52 Q38,42 40,48 Q42,54 34,56 Z" fill="#fca5a5" stroke="#374151" stroke-width="0.8" opacity="0.7"/>
  <!-- Body -->
  <rect x="26" y="44" width="4" height="18" rx="1.5" fill="#a855f7" stroke="#374151" stroke-width="0.8"/>
  <!-- Antennae -->
  <path d="M27,44 Q24,40 22,38" fill="none" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>
  <path d="M29,44 Q32,40 34,38" fill="none" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>

  <!-- Butterfly 2 (centre) -->
  <line x1="48" y1="38" x2="48" y2="46" stroke="#d97706" stroke-width="0.8"/>
  <path d="M48,56 Q38,46 36,52 Q34,58 42,60 Z" fill="#c4b5fd" stroke="#374151" stroke-width="0.8" opacity="0.7"/>
  <path d="M48,56 Q58,46 60,52 Q62,58 54,60 Z" fill="#c4b5fd" stroke="#374151" stroke-width="0.8" opacity="0.7"/>
  <rect x="46" y="48" width="4" height="18" rx="1.5" fill="#ec4899" stroke="#374151" stroke-width="0.8"/>
  <path d="M47,48 Q44,44 42,42" fill="none" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>
  <path d="M49,48 Q52,44 54,42" fill="none" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>

  <!-- Butterfly 3 (right) -->
  <line x1="82" y1="34" x2="82" y2="42" stroke="#d97706" stroke-width="0.8"/>
  <path d="M82,52 Q72,42 70,48 Q68,54 76,56 Z" fill="#86efac" stroke="#374151" stroke-width="0.8" opacity="0.7"/>
  <path d="M82,52 Q92,42 94,48 Q96,54 88,56 Z" fill="#86efac" stroke="#374151" stroke-width="0.8" opacity="0.7"/>
  <rect x="80" y="44" width="4" height="18" rx="1.5" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
  <path d="M81,44 Q78,40 76,38" fill="none" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>
  <path d="M83,44 Q86,40 88,38" fill="none" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>

  <!-- Butterfly on window (stuck with tape) -->
  <path d="M98,78 Q90,70 88,74 Q86,78 92,80 Z" fill="#fde68a" stroke="#374151" stroke-width="0.6" opacity="0.7"/>
  <path d="M98,78 Q106,70 108,74 Q110,78 104,80 Z" fill="#fde68a" stroke="#374151" stroke-width="0.6" opacity="0.7"/>
  <rect x="96" y="72" width="4" height="14" rx="1.5" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>

  <!-- Sunlight glow through wings -->
  <circle cx="36" cy="52" r="8" fill="#fbbf24" stroke="none" opacity="0.1"/>
  <circle cx="90" cy="52" r="8" fill="#fbbf24" stroke="none" opacity="0.1"/>
</svg>