<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Clothespin being painted (hero, large, centre) -->
  <!-- Body of clothespin -->
  <rect x="42" y="20" width="12" height="70" rx="3" fill="#d97706" stroke="#374151" stroke-width="2"/>
  <!-- Split at bottom -->
  <line x1="48" y1="70" x2="48" y2="90" stroke="#374151" stroke-width="1.5"/>
  <!-- Spring/metal clip area -->
  <circle cx="48" cy="60" r="3" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Paint being applied (pink/purple) -->
  <rect x="42" y="20" width="12" height="36" rx="3" fill="#a855f7" stroke="#374151" stroke-width="2"/>

  <!-- Paintbrush applying paint -->
  <line x1="68" y1="14" x2="56" y2="34" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <rect x="53" y="34" width="6" height="5" rx="1" fill="#a855f7" stroke="#374151" stroke-width="0.8"/>

  <!-- Paint pot -->
  <rect x="80" y="56" width="18" height="24" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <rect x="82" y="60" width="14" height="18" rx="2" fill="#a855f7" stroke="none"/>

  <!-- Other unpainted clothespins nearby -->
  <rect x="14" y="60" width="8" height="36" rx="2" fill="#d97706" stroke="#374151" stroke-width="1"/>
  <line x1="18" y1="80" x2="18" y2="96" stroke="#374151" stroke-width="0.8"/>

  <rect x="108" y="54" width="8" height="36" rx="2" fill="#d97706" stroke="#374151" stroke-width="1"/>
  <line x1="112" y1="74" x2="112" y2="90" stroke="#374151" stroke-width="0.8"/>

  <!-- Drying clothespin (already painted, set aside) -->
  <rect x="24" y="22" width="8" height="36" rx="2" fill="#ec4899" stroke="#374151" stroke-width="1"/>
  <line x1="28" y1="42" x2="28" y2="58" stroke="#374151" stroke-width="0.8"/>
</svg>