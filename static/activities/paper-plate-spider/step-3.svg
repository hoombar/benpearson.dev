<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Light background for hanging context -->
  <rect x="0" y="0" width="120" height="120" fill="#f8fafc"/>

  <!-- Doorframe hint -->
  <rect x="0" y="0" width="8" height="120" fill="#d4a574" stroke="#374151" stroke-width="1"/>
  <rect x="112" y="0" width="8" height="120" fill="#d4a574" stroke="#374151" stroke-width="1"/>
  <rect x="0" y="0" width="120" height="8" fill="#d4a574" stroke="#374151" stroke-width="1"/>

  <!-- String hanging from top -->
  <line x1="60" y1="8" x2="60" y2="26" stroke="#374151" stroke-width="1"/>

  <!-- Hanging spider (hero) -->
  <g transform="translate(26, 26)">
    <!-- Plate body -->
    <ellipse cx="34" cy="32" rx="32" ry="30" fill="#374151" stroke="#1f2937" stroke-width="1.5"/>

    <!-- Legs spreading outward -->
    <polyline points="-4,12 -16,4 -24,14" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-4,22 -18,18 -26,26" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-2,34 -16,32 -24,40" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-2,44 -14,46 -22,54" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="72,12 84,4 92,14" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="72,22 86,18 94,26" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="70,34 84,32 92,40" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="70,44 82,46 90,54" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Googly eyes -->
    <circle cx="24" cy="18" r="8" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="24" cy="20" r="4" fill="#374151"/>
    <circle cx="44" cy="18" r="8" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="44" cy="20" r="4" fill="#374151"/>

    <!-- Smile with fangs -->
    <path d="M22,36 Q34,46 46,36" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="28,36 30,42 32,36" fill="white"/>
    <polygon points="36,36 38,42 40,36" fill="white"/>

    <!-- Rosy cheeks -->
    <circle cx="20" cy="30" r="3" fill="#f472b6" opacity="0.4"/>
    <circle cx="48" cy="30" r="3" fill="#f472b6" opacity="0.4"/>
  </g>

  <!-- Web strands in corner -->
  <path d="M112,8 Q90,20 80,40" fill="none" stroke="#d1d5db" stroke-width="0.5"/>
  <path d="M112,8 Q100,30 96,50" fill="none" stroke="#d1d5db" stroke-width="0.5"/>
  <path d="M112,8 Q106,36 108,60" fill="none" stroke="#d1d5db" stroke-width="0.5"/>
</svg>
