<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Spider plate with face being added (hero) -->
  <g transform="translate(24, 22)">
    <!-- Plate body -->
    <ellipse cx="36" cy="34" rx="34" ry="32" fill="#374151" stroke="#1f2937" stroke-width="1.5"/>

    <!-- Legs (all 8) -->
    <polyline points="-6,14 -18,6 -28,16" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-6,24 -20,20 -30,28" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-4,36 -18,34 -28,42" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-4,46 -16,48 -26,56" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="78,14 90,6 100,16" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="78,24 92,20 102,28" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="76,36 90,34 100,42" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="76,46 88,48 98,56" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Big googly eyes -->
    <circle cx="26" cy="20" r="8" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="26" cy="22" r="4" fill="#374151"/>
    <circle cx="46" cy="20" r="8" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="46" cy="22" r="4" fill="#374151"/>

    <!-- Smile with fangs -->
    <path d="M24,38 Q36,48 48,38" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Fangs -->
    <polygon points="30,38 32,44 34,38" fill="white"/>
    <polygon points="38,38 40,44 42,38" fill="white"/>

    <!-- Rosy cheeks -->
    <circle cx="22" cy="32" r="3" fill="#f472b6" opacity="0.4"/>
    <circle cx="50" cy="32" r="3" fill="#f472b6" opacity="0.4"/>
  </g>

  <!-- White marker being used -->
  <g transform="translate(80, 56) rotate(30)">
    <rect x="0" y="-3" width="26" height="6" rx="2" fill="white" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-2.5" width="5" height="5" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="0.4"/>
    <polygon points="-4,-1 -4,1 -6,0" fill="white" stroke="#374151" stroke-width="0.3"/>
  </g>
</svg>
