<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Black plate with legs being attached (hero) -->
  <g transform="translate(24, 22)">
    <!-- Plate body -->
    <ellipse cx="36" cy="34" rx="34" ry="32" fill="#374151" stroke="#1f2937" stroke-width="1.5"/>

    <!-- Left legs (pipe cleaners, zigzag joints) -->
    <polyline points="-6,14 -18,6 -28,16" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-6,24 -20,20 -30,28" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-4,36 -18,34 -28,42" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-4,46 -16,48 -26,56" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right legs (some already attached) -->
    <polyline points="78,14 90,6 100,16" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="78,24 92,20 102,28" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="76,36 90,34 100,42" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Last leg being pushed through -->
    <polyline points="76,46 88,48 98,56" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4,3"/>

    <!-- Hole dots visible on plate edge -->
    <circle cx="-2" cy="14" r="1.5" fill="#fef3c7"/>
    <circle cx="-2" cy="24" r="1.5" fill="#fef3c7"/>
    <circle cx="-2" cy="36" r="1.5" fill="#fef3c7"/>
    <circle cx="-2" cy="46" r="1.5" fill="#fef3c7"/>
    <circle cx="74" cy="14" r="1.5" fill="#fef3c7"/>
    <circle cx="74" cy="24" r="1.5" fill="#fef3c7"/>
    <circle cx="74" cy="36" r="1.5" fill="#fef3c7"/>
    <circle cx="74" cy="46" r="1.5" fill="#fef3c7"/>
  </g>

  <!-- Warning symbol -->
  <g transform="translate(4, 4)">
    <polygon points="8,0 0,14 16,14" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <line x1="8" y1="4" x2="8" y2="9" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="8" cy="11.5" r="0.8" fill="#374151"/>
  </g>
</svg>
