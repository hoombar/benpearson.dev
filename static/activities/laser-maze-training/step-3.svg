<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="spotlight" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="5" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Background dark room -->
  <rect x="0" y="0" width="800" height="600" fill="#0f172a"/>
  
  <!-- Table -->
  <rect x="300" y="450" width="200" height="30" fill="#78350f" filter="url(#shadow)"/>
  <rect x="320" y="480" width="20" height="120" fill="#451a03"/>
  <rect x="460" y="480" width="20" height="120" fill="#451a03"/>

  <!-- Spotlight -->
  <circle cx="400" cy="350" r="250" fill="url(#spotlight)"/>

  <!-- The Intel (Teddy Bear) -->
  <g transform="translate(400, 400)" filter="url(#shadow)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="40" ry="45" fill="#d97706"/>
    <!-- Head -->
    <circle cx="0" cy="-55" r="35" fill="#d97706"/>
    <!-- Ears -->
    <circle cx="-25" cy="-80" r="15" fill="#b45309"/>
    <circle cx="25" cy="-80" r="15" fill="#b45309"/>
    <!-- Arms -->
    <ellipse cx="-45" cy="-10" rx="15" ry="30" fill="#d97706" transform="rotate(30 -45 -10)"/>
    <ellipse cx="45" cy="-10" rx="15" ry="30" fill="#d97706" transform="rotate(-30 45 -10)"/>
    <!-- Legs -->
    <ellipse cx="-20" cy="40" rx="20" ry="25" fill="#d97706"/>
    <ellipse cx="20" cy="40" rx="20" ry="25" fill="#d97706"/>
    <!-- Eyes and snout -->
    <circle cx="-15" cy="-60" r="4" fill="#000"/>
    <circle cx="15" cy="-60" r="4" fill="#000"/>
    <ellipse cx="0" cy="-45" rx="12" ry="8" fill="#fef3c7"/>
    <circle cx="0" cy="-48" r="3" fill="#000"/>
  </g>

  <!-- Laser Beams crossing in front -->
  <line x1="0" y1="200" x2="800" y2="500" stroke="#ef4444" stroke-width="5" filter="url(#glow)"/>
  <line x1="0" y1="500" x2="800" y2="200" stroke="#ef4444" stroke-width="5" filter="url(#glow)"/>
  <line x1="200" y1="0" x2="600" y2="600" stroke="#ef4444" stroke-width="5" filter="url(#glow)"/>

  <!-- Twinkle stars around intel -->
  <path d="M 320 250 L 330 270 L 350 280 L 330 290 L 320 310 L 310 290 L 290 280 L 310 270 Z" fill="#fff" filter="url(#glow)"/>
  <path d="M 480 220 L 485 230 L 495 235 L 485 240 L 480 250 L 475 240 L 465 235 L 475 230 Z" fill="#fff" filter="url(#glow)"/>
</svg>