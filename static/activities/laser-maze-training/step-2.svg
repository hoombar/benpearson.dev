<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background: Hallway Floor -->
  <rect x="0" y="400" width="800" height="200" fill="#0f172a"/>
  <path d="M 0 400 L 800 400" stroke="#1e293b" stroke-width="10"/>
  <!-- Walls -->
  <rect x="0" y="0" width="800" height="400" fill="url(#wall)"/>
  
  <!-- Left Wall depth -->
  <polygon points="0,0 150,100 150,380 0,400" fill="#334155"/>
  <!-- Right Wall depth -->
  <polygon points="800,0 650,100 650,380 800,400" fill="#334155"/>

  <!-- Zigzagging Red Yarn (Lasers) -->
  <polyline points="150,300 650,250 150,150 650,350 150,200" fill="none" stroke="#ef4444" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Tape spots -->
  <rect x="140" y="290" width="20" height="20" fill="#fef08a" transform="rotate(10 150 300)"/>
  <rect x="640" y="240" width="20" height="20" fill="#fef08a" transform="rotate(-15 650 250)"/>
  <rect x="140" y="140" width="20" height="20" fill="#fef08a" transform="rotate(5 150 150)"/>
  <rect x="640" y="340" width="20" height="20" fill="#fef08a" transform="rotate(20 650 350)"/>
  <rect x="140" y="190" width="20" height="20" fill="#fef08a" transform="rotate(-5 150 200)"/>

  <!-- Hand pulling the string tight -->
  <g transform="translate(650, 200)">
    <path d="M 0 0 C -30 -20 -60 10 -30 40 C -10 60 20 50 40 30" fill="#fcd34d" filter="url(#glow)"/>
    <!-- String from hand -->
    <line x1="-20" y1="20" x2="-100" y2="100" stroke="#ef4444" stroke-width="6" filter="url(#glow)"/>
    <!-- Motion lines -->
    <path d="M -40 -10 Q -60 -30 -40 -50" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="5,5"/>
  </g>
</svg>