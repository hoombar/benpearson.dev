<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="5" dy="20" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Floor -->
  <polygon points="0,450 800,450 800,600 0,600" fill="#020617"/>
  <!-- Spotlight area -->
  <ellipse cx="400" cy="520" rx="300" ry="60" fill="#334155" opacity="0.5"/>

  <!-- Laser Beams -->
  <line x1="0" y1="300" x2="800" y2="400" stroke="#ef4444" stroke-width="6" filter="url(#glow)"/>
  <line x1="0" y1="500" x2="800" y2="200" stroke="#ef4444" stroke-width="6" filter="url(#glow)"/>
  <line x1="0" y1="100" x2="800" y2="300" stroke="#ef4444" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Secret Agent Kid -->
  <g transform="translate(400, 350)" filter="url(#shadow)">
    <!-- Body bent over -->
    <path d="M -30 0 Q 0 -50 50 20" fill="none" stroke="#2563eb" stroke-width="40" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="-50" cy="20" r="35" fill="#fcd34d"/>
    <!-- Sunglasses -->
    <rect x="-70" y="10" width="30" height="15" rx="5" fill="#000"/>
    <line x1="-70" y1="15" x2="-80" y2="10" stroke="#000" stroke-width="3"/>
    <!-- Arm reaching forward -->
    <path d="M -20 10 L -60 70 L -100 60" fill="none" stroke="#2563eb" stroke-width="15" stroke-linecap="round"/>
    <circle cx="-100" cy="60" r="10" fill="#fcd34d"/>
    <!-- Arm balancing back -->
    <path d="M 20 -10 L 60 -40 L 100 -20" fill="none" stroke="#2563eb" stroke-width="15" stroke-linecap="round"/>
    <circle cx="100" cy="-20" r="10" fill="#fcd34d"/>
    <!-- Leg stretching back -->
    <path d="M 40 10 L 80 80 L 130 90" fill="none" stroke="#1d4ed8" stroke-width="20" stroke-linecap="round"/>
    <ellipse cx="130" cy="90" rx="15" ry="8" fill="#1e293b"/>
    <!-- Leg planting down -->
    <path d="M 20 20 L 10 100 L 0 160" fill="none" stroke="#1d4ed8" stroke-width="20" stroke-linecap="round"/>
    <ellipse cx="0" cy="160" rx="20" ry="10" fill="#1e293b"/>
  </g>

  <!-- Action/Sweat drops -->
  <path d="M 330 330 Q 320 310 330 300 Q 340 310 330 330" fill="#60a5fa"/>
  <path d="M 310 360 Q 290 350 300 330 Q 320 340 310 360" fill="#60a5fa"/>
  <!-- Motion lines indicating balancing -->
  <path d="M 500 280 Q 520 260 540 280" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="4,4"/>
  <path d="M 520 240 Q 540 220 560 240" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="4,4"/>
</svg>