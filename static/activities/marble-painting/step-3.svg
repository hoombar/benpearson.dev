<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Paper sheet being held up (two corners pinched) -->
  <rect x="16" y="20" width="88" height="72" rx="2" stroke="#374151" stroke-width="2.5" fill="#f9fafb"/>
  <!-- Swirling marble paint trails on the paper (the artwork) -->
  <path d="M28 38 Q50 28 72 40 Q94 52 88 34 Q82 22 60 30" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M24 60 Q44 46 64 58 Q82 70 98 50" stroke="#3b82f6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M100 68 Q78 56 58 64 Q38 72 28 58" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M40 78 Q58 66 76 78 Q90 86 96 72" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M26 78 Q38 84 54 80 Q70 76 80 84" stroke="#a78bfa" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Colour mixing blob where trails cross -->
  <ellipse cx="60" cy="44" rx="8" ry="6" fill="#f97316" opacity="0.5"/>
  <ellipse cx="76" cy="62" rx="7" ry="5" fill="#84cc16" opacity="0.5"/>
  <!-- Holding corners (simple finger wedges at top corners) -->
  <path d="M16 20 Q14 14 18 12 Q22 10 24 16" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <path d="M104 20 Q106 14 102 12 Q98 10 96 16" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <!-- Sparkle/star marks showing admiration -->
  <line x1="60" y1="100" x2="60" y2="106" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="102" x2="52" y2="107" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="66" y1="102" x2="68" y2="107" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="60" cy="112" r="3" fill="#f59e0b"/>
</svg>
