  <line x1="10" y1="58" x2="110" y2="48" stroke="#374151" stroke-width="1.5"/>
  <!-- Paper inside box (foreshortened) -->
  <path d="M16 60 L104 50 L104 96 L16 106 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <!-- Swirling marble paint trails -->
  <path d="M30 70 Q50 58 70 72 Q90 86 85 68 Q80 55 60 62" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M26 90 Q40 76 58 88 Q74 98 90 80" stroke="#3b82f6" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M100 90 Q80 78 62 84 Q44 90 35 78" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M50 95 Q66 85 80 94" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Marbles (hero) -->
  <circle cx="72" cy="70" r="7" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  <circle cx="70" cy="68" r="2.5" fill="#93c5fd"/>
  <circle cx="50" cy="82" r="7" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <circle cx="48" cy="80" r="2.5" fill="#fca5a5"/>
  <circle cx="86" cy="76" r="6" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <circle cx="84" cy="74" r="2" fill="#86efac"/>
  <!-- Tilt arrows on box sides -->
  <path d="M6 58 Q2 70 6 82" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M4 79 L6 84 L8 79" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
