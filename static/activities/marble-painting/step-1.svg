<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Box lid top-down -->
  <rect x="12" y="20" width="96" height="80" rx="3" stroke="#374151" stroke-width="2.5" fill="#fbbf24" opacity="0.5"/>
  <line x1="12" y1="30" x2="108" y2="30" stroke="#374151" stroke-width="1.5"/>
  <!-- White paper inside -->
  <rect x="18" y="32" width="84" height="62" rx="1" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <!-- 4 paint blobs on paper (different colours) -->
  <ellipse cx="34" cy="48" rx="10" ry="8" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="92" cy="48" rx="10" ry="8" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="34" cy="80" rx="10" ry="8" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="92" cy="80" rx="10" ry="8" fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="60" cy="63" rx="9" ry="7" fill="#a78bfa" stroke="#374151" stroke-width="1.5"/>
  <!-- Spoon adding paint (from above right) -->
  <line x1="108" y1="8" x2="96" y2="44" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="93" cy="48" rx="8" ry="5" stroke="#374151" stroke-width="1.5" fill="#3b82f6"/>
  <!-- Paint drip from spoon -->
  <line x1="93" y1="44" x2="93" y2="42" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-dasharray="2,2"/>
</svg>
