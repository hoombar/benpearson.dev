<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Cardboard box lid (top-down view, hero) -->
  <rect x="14" y="22" width="92" height="76" rx="3" stroke="#374151" stroke-width="2.5" fill="#fbbf24" opacity="0.6"/>
  <rect x="14" y="22" width="92" height="10" rx="3" stroke="#374151" stroke-width="1.5" fill="#d97706" opacity="0.7"/>
  <line x1="14" y1="32" x2="106" y2="32" stroke="#374151" stroke-width="1.5"/>
  <!-- White paper sheet inside box -->
  <rect x="20" y="34" width="80" height="58" rx="1" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <!-- Scissors top right -->
  <g transform="translate(96,10) rotate(30)">
    <line x1="0" y1="0" x2="12" y2="0" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="4" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-4" cy="-4" r="3.5" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <circle cx="-4" cy="4" r="3.5" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  </g>
  <!-- Dashed cut line showing paper being cut to size -->
  <rect x="20" y="34" width="80" height="58" rx="1" stroke="#374151" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <!-- Arrow placing paper into box -->
  <line x1="60" y1="14" x2="60" y2="28" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <path d="M57 25 L60 30 L63 25" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Box side depth hints -->
  <line x1="14" y1="98" x2="8" y2="106" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="106" y1="98" x2="112" y2="106" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8" y1="106" x2="112" y2="106" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>
