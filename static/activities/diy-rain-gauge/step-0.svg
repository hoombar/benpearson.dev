<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 0: Create the Measurement Scale -->
  <!-- Table background -->
  <rect x="0" y="80" width="120" height="40" fill="#fef3c7" />
  <line x1="0" y1="80" x2="120" y2="80" stroke="#d97706" stroke-width="2" />
  
  <!-- Jar -->
  <path d="M35,25 L35,100 Q35,105 45,105 L75,105 Q85,105 85,95 L85,25" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <path d="M30,25 L90,25" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" />
  
  <!-- Ruler held against jar -->
  <rect x="25" y="15" width="15" height="95" fill="#fde68a" stroke="#374151" stroke-width="1.5" />
  <!-- Ruler markings -->
  <line x1="40" y1="20" x2="35" y2="20" stroke="#374151" stroke-width="1" />
  <line x1="40" y1="35" x2="32" y2="35" stroke="#374151" stroke-width="1" />
  <line x1="40" y1="50" x2="35" y2="50" stroke="#374151" stroke-width="1" />
  <line x1="40" y1="65" x2="32" y2="65" stroke="#374151" stroke-width="1" />
  <line x1="40" y1="80" x2="35" y2="80" stroke="#374151" stroke-width="1" />
  <line x1="40" y1="95" x2="32" y2="95" stroke="#374151" stroke-width="1" />
  
  <!-- Hand-drawn marks on the jar -->
  <line x1="45" y1="95" x2="55" y2="95" stroke="#111827" stroke-width="2" stroke-linecap="round" />
  <line x1="45" y1="80" x2="55" y2="80" stroke="#111827" stroke-width="2" stroke-linecap="round" />
  <line x1="45" y1="65" x2="55" y2="65" stroke="#111827" stroke-width="2" stroke-linecap="round" />
  <line x1="45" y1="50" x2="55" y2="50" stroke="#111827" stroke-width="2" stroke-linecap="round" />
  
  <!-- Permanent Marker in action -->
  <g transform="translate(65, 30) rotate(-40)">
    <rect x="0" y="0" width="12" height="45" rx="2" fill="#ef4444" stroke="#374151" stroke-width="1.5" />
    <path d="M0,0 L12,0 L8,-10 L4,-10 Z" fill="#111827" />
    <rect x="0" y="35" width="12" height="10" fill="#374151" />
  </g>
  
  <!-- Motion arc for drawing -->
  <path d="M58,45 Q70,40 75,50" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,3" stroke-linecap="round" />
</svg>
