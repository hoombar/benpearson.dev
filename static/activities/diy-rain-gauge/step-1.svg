<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 1: Add the Magic Drop -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Table background -->
  <rect x="0" y="80" width="120" height="40" fill="#fef3c7" />
  <line x1="0" y1="80" x2="120" y2="80" stroke="#d97706" stroke-width="2" />

  <!-- Jar with measurements -->
  <path d="M35,35 L35,100 Q35,105 45,105 L75,105 Q85,105 85,95 L85,35" fill="#f9fafb" opacity="0.9" stroke="#374151" stroke-width="2" />
  <path d="M30,35 L90,35" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" />
  <line x1="45" y1="95" x2="55" y2="95" stroke="#111827" stroke-width="2" stroke-linecap="round" />
  <line x1="45" y1="80" x2="55" y2="80" stroke="#111827" stroke-width="2" stroke-linecap="round" />
  <line x1="45" y1="65" x2="55" y2="65" stroke="#111827" stroke-width="2" stroke-linecap="round" />

  <!-- Food coloring bottle (squeezed) -->
  <g transform="translate(60, 10) rotate(-20)">
    <!-- Cap -->
    <rect x="-6" y="0" width="12" height="10" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="1.5" />
    <!-- Body -->
    <path d="M-8,10 L8,10 Q12,30 8,35 L-8,35 Q-12,30 -8,10 Z" fill="#3b82f6" stroke="#374151" stroke-width="2" />
    <rect x="-8" y="15" width="16" height="10" fill="#ffffff" stroke="#374151" stroke-width="1.5" />
    <!-- Dropper tip -->
    <path d="M-3,0 L3,0 L1,-5 L-1,-5 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.5" />
  </g>

  <!-- Blue drops falling -->
  <path d="M55,30 Q58,35 55,40 Q52,35 55,30" fill="#3b82f6" stroke="#374151" stroke-width="1" />
  <path d="M55,50 Q58,55 55,60 Q52,55 55,50" fill="#3b82f6" stroke="#374151" stroke-width="1" />
  <line x1="55" y1="65" x2="55" y2="85" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Concentrated blue at bottom -->
  <path d="M37,95 L83,95 Q82,103 75,103 L45,103 Q38,103 37,95 Z" fill="#3b82f6" opacity="0.8" />
</svg>