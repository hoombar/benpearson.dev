<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Table surface -->
  <line x1="4" y1="100" x2="116" y2="100" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 6 jars with DIFFERENT water levels — descending left to right -->
  <!-- Water fill heights (from top of water to y=99): jar1=26, jar2=21, jar3=16, jar4=12, jar5=8, jar6=4 -->
  <!-- Jar 1: water from y=73 to 99 -->
  <rect x="7" y="70" width="14" height="30" rx="1" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <rect x="8" y="73" width="12" height="26" rx="1" stroke="none" fill="#93c5fd"/>
  <rect x="5" y="65" width="18" height="6" rx="1" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- Jar 2: water from y=78 to 99 -->
  <rect x="25" y="70" width="14" height="30" rx="1" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <rect x="26" y="78" width="12" height="21" rx="1" stroke="none" fill="#93c5fd"/>
  <rect x="23" y="65" width="18" height="6" rx="1" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- Jar 3: water from y=83 to 99 -->
  <rect x="43" y="70" width="14" height="30" rx="1" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <rect x="44" y="83" width="12" height="16" rx="1" stroke="none" fill="#93c5fd"/>
  <rect x="41" y="65" width="18" height="6" rx="1" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- Jar 4: water from y=87 to 99 -->
  <rect x="61" y="70" width="14" height="30" rx="1" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <rect x="62" y="87" width="12" height="12" rx="1" stroke="none" fill="#93c5fd"/>
  <rect x="59" y="65" width="18" height="6" rx="1" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- Jar 5: water from y=91 to 99 -->
  <rect x="79" y="70" width="14" height="30" rx="1" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <rect x="80" y="91" width="12" height="8" rx="1" stroke="none" fill="#93c5fd"/>
  <rect x="77" y="65" width="18" height="6" rx="1" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- Jar 6: water from y=95 to 99 -->
  <rect x="97" y="70" width="14" height="30" rx="1" stroke="#374151" stroke-width="1.5" fill="#f9fafb"/>
  <rect x="98" y="95" width="12" height="4" rx="1" stroke="none" fill="#93c5fd"/>
  <rect x="95" y="65" width="18" height="6" rx="1" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- Diagonal guideline showing descending water levels -->
  <line x1="14" y1="73" x2="104" y2="95" stroke="#374151" stroke-width="1" stroke-dasharray="3,3" stroke-linecap="round"/>
  <!-- Pitcher/jug pouring water into jar 2 from above -->
  <path d="M18 14 Q18 10 22 10 L32 10 Q36 10 36 14 L36 36 Q36 40 32 40 L22 40 Q18 40 18 36 Z" stroke="#374151" stroke-width="1.5" fill="#dbeafe"/>
  <path d="M36 22 Q44 22 44 28 Q44 34 36 34" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Water pouring from jug to jar 2 -->
  <line x1="32" y1="40" x2="32" y2="62" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
