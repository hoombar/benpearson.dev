<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Spray bottle (hero, large) -->
  <!-- Bottle body — single closed path -->
  <path d="M42,48 Q38,48 38,52 L38,90 Q38,96 52,96 L68,96 Q82,96 82,90 L82,52 Q82,48 78,48 Z"
        fill="#dbeafe" stroke="#374151" stroke-width="2.5"/>
  <!-- Neck -->
  <rect x="52" y="32" width="16" height="18" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
  <!-- Trigger -->
  <path d="M68,36 L82,36 L82,48 L68,48" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <!-- Nozzle -->
  <rect x="40" y="30" width="14" height="6" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <!-- Spray nozzle tip -->
  <circle cx="38" cy="33" r="2.5" fill="#374151" stroke="none"/>

  <!-- Spray mist coming from nozzle -->
  <line x1="32" y1="30" x2="18" y2="24" stroke="#93c5fd" stroke-width="1" stroke-linecap="round" stroke-dasharray="2,2"/>
  <line x1="32" y1="33" x2="16" y2="33" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2"/>
  <line x1="32" y1="36" x2="18" y2="42" stroke="#93c5fd" stroke-width="1" stroke-linecap="round" stroke-dasharray="2,2"/>
  <!-- Mist dots -->
  <circle cx="14" cy="28" r="1" fill="#93c5fd" stroke="none"/>
  <circle cx="10" cy="33" r="1.5" fill="#93c5fd" stroke="none"/>
  <circle cx="12" cy="38" r="1" fill="#93c5fd" stroke="none"/>

  <!-- Vinegar bottle (source, smaller, to the right) -->
  <path d="M92,38 Q88,38 88,42 L88,82 Q88,86 98,86 L102,86 Q112,86 112,82 L112,42 Q112,38 108,38 Z"
        fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <rect x="96" y="28" width="8" height="12" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <!-- Vinegar label lines -->
  <line x1="92" y1="55" x2="108" y2="55" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="94" y1="60" x2="106" y2="60" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>

  <!-- Arrow from vinegar into spray bottle -->
  <path d="M92,52 Q86,52 82,56" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Liquid level inside spray bottle -->
  <rect x="40" y="58" width="40" height="36" rx="1" fill="#dbeafe" stroke="none" opacity="0.5"/>
</svg>
