<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="105" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Baking tray -->
  <rect x="10" y="38" width="100" height="65" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <!-- Paper inside tray -->
  <rect x="15" y="42" width="90" height="56" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="1"/>

  <!-- Fizzing erupting blobs — colour blobs with bubble circles rising -->
  <!-- Red blob fizzing -->
  <ellipse cx="32" cy="62" rx="10" ry="7" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <circle cx="28" cy="54" r="2.5" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <circle cx="34" cy="50" r="2" fill="#fee2e2" stroke="#ef4444" stroke-width="0.75"/>
  <circle cx="30" cy="46" r="1.5" fill="#fee2e2" stroke="#ef4444" stroke-width="0.75"/>

  <!-- Blue blob fizzing -->
  <ellipse cx="58" cy="58" rx="11" ry="8" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  <circle cx="54" cy="48" r="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="62" cy="44" r="2.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.75"/>
  <circle cx="56" cy="40" r="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.75"/>
  <circle cx="60" cy="36" r="1.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.75"/>

  <!-- Yellow blob fizzing -->
  <ellipse cx="84" cy="60" rx="9" ry="6" fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>
  <circle cx="80" cy="52" r="2" fill="#fef9c3" stroke="#f59e0b" stroke-width="0.75"/>
  <circle cx="86" cy="48" r="2.5" fill="#fef9c3" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="82" cy="44" r="1.5" fill="#fef9c3" stroke="#f59e0b" stroke-width="0.75"/>

  <!-- Green blob fizzing -->
  <ellipse cx="45" cy="82" rx="8" ry="6" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <circle cx="42" cy="74" r="2" fill="#d1fae5" stroke="#22c55e" stroke-width="0.75"/>
  <circle cx="48" cy="72" r="1.5" fill="#d1fae5" stroke="#22c55e" stroke-width="0.75"/>

  <!-- Purple blob fizzing -->
  <ellipse cx="72" cy="84" rx="9" ry="5" fill="#a78bfa" stroke="#374151" stroke-width="1.5"/>
  <circle cx="68" cy="76" r="2" fill="#ede9fe" stroke="#a78bfa" stroke-width="0.75"/>
  <circle cx="76" cy="74" r="2.5" fill="#ede9fe" stroke="#a78bfa" stroke-width="1"/>

  <!-- Colour blending between blobs -->
  <path d="M42,62 Q50,66 52,58" stroke="#a78bfa" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M68,60 Q76,64 80,60" stroke="#f97316" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Spray bottle (small, at top spraying down) -->
  <g transform="translate(90, 18) rotate(30)">
    <rect x="-8" y="-4" width="16" height="22" rx="3" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
    <rect x="-4" y="-12" width="8" height="10" rx="1.5" fill="#dbeafe" stroke="#374151" stroke-width="1"/>
    <circle cx="-8" cy="-10" r="1.5" fill="#374151" stroke="none"/>
  </g>

  <!-- Spray mist from bottle -->
  <line x1="78" y1="24" x2="68" y2="36" stroke="#93c5fd" stroke-width="1" stroke-dasharray="2,2" stroke-linecap="round"/>
  <line x1="80" y1="26" x2="74" y2="38" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>
  <line x1="82" y1="28" x2="80" y2="40" stroke="#93c5fd" stroke-width="1" stroke-dasharray="2,2" stroke-linecap="round"/>
</svg>
