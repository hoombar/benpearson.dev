<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Baking tray (hero) -->
  <rect x="10" y="30" width="100" height="68" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="2.5"/>
  <!-- Tray inner rim -->
  <rect x="15" y="35" width="90" height="58" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="1"/>

  <!-- Paper inside tray -->
  <rect x="18" y="38" width="84" height="52" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>

  <!-- Coloured baking soda blobs on paper -->
  <ellipse cx="35" cy="50" rx="8" ry="6" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="60" cy="48" rx="9" ry="7" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="85" cy="52" rx="7" ry="5" fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="45" cy="68" rx="8" ry="6" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="72" cy="72" rx="9" ry="5" fill="#a78bfa" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="28" cy="80" rx="6" ry="5" fill="#f97316" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="92" cy="76" rx="7" ry="5" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>

  <!-- Spoon above tray showing dolloping action -->
  <line x1="50" y1="10" x2="55" y2="30" stroke="#e5e7eb" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="56" cy="32" rx="6" ry="3.5" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <!-- Blob falling from spoon -->
  <ellipse cx="56" cy="38" rx="4" ry="3" fill="#3b82f6" stroke="#374151" stroke-width="1" opacity="0.7"/>
</svg>
