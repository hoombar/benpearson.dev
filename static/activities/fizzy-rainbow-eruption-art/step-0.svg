<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Table surface -->
  <rect x="5" y="95" width="110" height="12" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Three small containers (hero group) -->
  <!-- Container 1 - red paste -->
  <rect x="8" y="62" width="28" height="32" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <ellipse cx="22" cy="78" rx="10" ry="6" fill="#ef4444" stroke="#374151" stroke-width="1"/>

  <!-- Container 2 - blue paste -->
  <rect x="46" y="62" width="28" height="32" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <ellipse cx="60" cy="78" rx="10" ry="6" fill="#3b82f6" stroke="#374151" stroke-width="1"/>

  <!-- Container 3 - yellow paste -->
  <rect x="84" y="62" width="28" height="32" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <ellipse cx="98" cy="78" rx="10" ry="6" fill="#f59e0b" stroke="#374151" stroke-width="1"/>

  <!-- Baking soda box (top left) -->
  <rect x="6" y="10" width="22" height="30" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <line x1="10" y1="18" x2="24" y2="18" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="12" y1="24" x2="22" y2="24" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>

  <!-- Arrow from baking soda into containers -->
  <path d="M22,42 Q22,52 22,56" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Food colouring bottles (top right) -->
  <rect x="78" y="16" width="8" height="20" rx="2" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <rect x="78" y="10" width="8" height="8" rx="2" fill="#fee2e2" stroke="#374151" stroke-width="1"/>
  <rect x="92" y="16" width="8" height="20" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  <rect x="92" y="10" width="8" height="8" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="1"/>
  <rect x="106" y="16" width="8" height="20" rx="2" fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>
  <rect x="106" y="10" width="8" height="8" rx="2" fill="#fef9c3" stroke="#374151" stroke-width="1"/>

  <!-- Dashed drips from bottles -->
  <line x1="82" y1="38" x2="82" y2="52" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>
  <line x1="96" y1="38" x2="96" y2="52" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>

  <!-- Spoon stirring in middle container -->
  <line x1="55" y1="48" x2="60" y2="74" stroke="#e5e7eb" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="61" cy="76" rx="5" ry="3" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Stirring arc -->
  <path d="M52,72 Q60,64 68,72" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
