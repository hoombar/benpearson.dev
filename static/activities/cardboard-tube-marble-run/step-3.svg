<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background: Wall -->
  <rect width="800" height="600" fill="#d1e8e2"/>
  
  <!-- Taped Tubes on Wall -->
  <g transform="translate(300, 150)">
    <!-- Tube 1 (Top) -->
    <rect x="-80" y="-40" width="160" height="50" rx="10" fill="#d6ab7d" transform="rotate(30)"/>
    <rect x="-20" y="-50" width="20" height="80" fill="rgba(255,255,255,0.7)" transform="rotate(30)"/>
    
    <!-- Tube 2 (Middle) -->
    <g transform="translate(100, 150)">
      <rect x="-80" y="-40" width="160" height="50" rx="10" fill="#b38a5c" transform="rotate(-20)"/>
      <rect x="-20" y="-50" width="20" height="80" fill="rgba(255,255,255,0.7)" transform="rotate(-20)"/>
    </g>
  </g>
  
  <!-- Hand dropping marble -->
  <g transform="translate(250, 80)">
    <!-- Hand shape -->
    <path d="M 0 0 C -20 -30 -40 -30 -60 0 C -70 20 -40 60 0 80 C 40 100 80 60 60 20 Z" fill="#ffccbc"/>
    <!-- Marble -->
    <circle cx="-50" cy="-10" r="15" fill="#ff7043"/>
    <circle cx="-55" cy="-15" r="4" fill="#fff" opacity="0.6"/>
  </g>
  
  <!-- Falling marble and motion lines -->
  <g transform="translate(380, 260)">
    <circle cx="0" cy="0" r="15" fill="#42a5f5"/>
    <circle cx="-5" cy="-5" r="4" fill="#fff" opacity="0.6"/>
    <path d="M -20 -40 Q -10 -20 0 -15" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="5,5"/>
    <path d="M -10 -50 Q 0 -30 10 -20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Eye watching -->
  <path d="M 600 200 Q 650 150 700 200 Q 650 250 600 200 Z" fill="#fff" stroke="#333" stroke-width="4"/>
  <circle cx="650" cy="200" r="20" fill="#4caf50"/>
  <circle cx="650" cy="200" r="10" fill="#000"/>
  <circle cx="645" cy="195" r="5" fill="#fff"/>
  <!-- Concentration motion lines -->
  <path d="M 580 150 L 550 120" stroke="#ffca28" stroke-width="4" stroke-linecap="round"/>
  <path d="M 720 150 L 750 120" stroke="#ffca28" stroke-width="4" stroke-linecap="round"/>

</svg>