<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- String with crystal clusters (hero — the magical result) -->
  <!-- Main string running through centre -->
  <line x1="60" y1="10" x2="60" y2="110" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Crystal clusters growing outward from string — cube/diamond shapes -->
  <!-- Upper cluster left side -->
  <rect x="42" y="24" width="12" height="12" rx="1" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <rect x="35" y="30" width="9" height="9" rx="1" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <rect x="44" y="36" width="8" height="8" rx="1" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <!-- Upper cluster right side -->
  <rect x="66" y="24" width="12" height="12" rx="1" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <rect x="76" y="30" width="9" height="9" rx="1" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <rect x="64" y="36" width="8" height="8" rx="1" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <!-- Middle cluster left -->
  <rect x="38" y="54" width="14" height="14" rx="1" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <rect x="30" y="60" width="10" height="10" rx="1" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <rect x="40" y="67" width="9" height="9" rx="1" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <!-- Middle cluster right -->
  <rect x="68" y="54" width="14" height="14" rx="1" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <rect x="80" y="60" width="10" height="10" rx="1" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <rect x="67" y="67" width="9" height="9" rx="1" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <!-- Lower cluster left -->
  <rect x="44" y="84" width="11" height="11" rx="1" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <rect x="36" y="88" width="9" height="9" rx="1" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- Lower cluster right -->
  <rect x="65" y="84" width="11" height="11" rx="1" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <rect x="75" y="88" width="9" height="9" rx="1" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- Sparkle marks showing glittery crystals -->
  <line x1="25" y1="50" x2="28" y2="50" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="47" x2="26" y2="53" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="92" y1="44" x2="95" y2="44" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="93" y1="41" x2="93" y2="47" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="80" x2="23" y2="80" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21" y1="77" x2="21" y2="83" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Magnifying glass (lower right, showing inspection) -->
  <circle cx="100" cy="98" r="14" stroke="#374151" stroke-width="2" fill="none"/>
  <line x1="111" y1="109" x2="118" y2="116" stroke="#374151" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Crystal visible inside magnifying glass lens -->
  <rect x="94" y="92" width="6" height="6" rx="0.5" stroke="#374151" stroke-width="1" fill="#f3f4f6"/>
  <rect x="100" y="97" width="5" height="5" rx="0.5" stroke="#374151" stroke-width="1" fill="#e5e7eb"/>
</svg>
