<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Three containers in a row (red, yellow, blue) -->
  <!-- Left jar (red) -->
  <rect x="8" y="72" width="30" height="38" rx="3" stroke="#374151" stroke-width="2" fill="#fee2e2"/>
  <rect x="6" y="65" width="34" height="9" rx="2" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- Middle jar (yellow — hero, being coloured right now) -->
  <rect x="45" y="68" width="30" height="42" rx="3" stroke="#374151" stroke-width="2.5" fill="#fef9c3"/>
  <rect x="43" y="61" width="34" height="9" rx="2" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- Right jar (blue) -->
  <rect x="82" y="72" width="30" height="38" rx="3" stroke="#374151" stroke-width="2" fill="#dbeafe"/>
  <rect x="80" y="65" width="34" height="9" rx="2" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- Food colouring bottle above middle jar -->
  <!-- Bottle body -->
  <rect x="52" y="16" width="16" height="30" rx="4" stroke="#374151" stroke-width="2" fill="#f3f4f6"/>
  <!-- Bottle cap (yellow to match jar below) -->
  <rect x="55" y="8" width="10" height="10" rx="2" stroke="#374151" stroke-width="1.5" fill="#f59e0b"/>
  <!-- Bottle tip -->
  <rect x="58" y="17" width="4" height="6" rx="1" stroke="#374151" stroke-width="1" fill="#e5e7eb"/>
  <!-- Drops falling from bottle into middle jar (dashed = liquid) -->
  <line x1="60" y1="46" x2="60" y2="58" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round"/>
  <!-- Drop 1 -->
  <path d="M60 60 Q63 64 60 68 Q57 64 60 60" stroke="#374151" stroke-width="1.5" fill="#fde68a"/>
  <!-- Drop 2 -->
  <path d="M60 70 Q62 73 60 76 Q58 73 60 70" stroke="#374151" stroke-width="1.5" fill="#fde68a"/>
  <!-- Solid arrows showing the same process will happen to each jar -->
  <!-- Arrow to left jar -->
  <line x1="42" y1="78" x2="34" y2="78" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M36 75 L32 78 L36 81" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Arrow to right jar -->
  <line x1="78" y1="78" x2="86" y2="78" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M84 75 L88 78 L84 81" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
