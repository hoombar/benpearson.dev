<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Container with hot water (hero) -->
  <!-- Jar body -->
  <rect x="34" y="56" width="52" height="56" rx="3" stroke="#374151" stroke-width="2.5" fill="#dbeafe"/>
  <!-- Jar lid ring -->
  <rect x="30" y="48" width="60" height="10" rx="2" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- Water surface line inside jar -->
  <line x1="34" y1="72" x2="86" y2="72" stroke="#374151" stroke-width="1" stroke-dasharray="3,3" stroke-linecap="round"/>
  <!-- Salt crystals settled at bottom (showing saturation) -->
  <rect x="40" y="102" width="6" height="6" rx="1" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <rect x="52" y="103" width="5" height="5" rx="1" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <rect x="64" y="102" width="6" height="6" rx="1" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <rect x="73" y="103" width="5" height="5" rx="1" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <!-- Steam wavy lines above container -->
  <path d="M46 42 Q50 36 46 30 Q42 24 46 18" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-dasharray="3,2"/>
  <path d="M60 40 Q64 34 60 28 Q56 22 60 16" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-dasharray="3,2"/>
  <path d="M74 42 Q78 36 74 30 Q70 24 74 18" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-dasharray="3,2"/>
  <!-- Spoon pouring salt in from upper left -->
  <!-- Spoon handle -->
  <line x1="10" y1="14" x2="28" y2="42" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Spoon bowl -->
  <ellipse cx="32" cy="46" rx="8" ry="5" stroke="#374151" stroke-width="2" fill="#f3f4f6" transform="rotate(-35 32 46)"/>
  <!-- Salt crystals falling from spoon into jar -->
  <line x1="36" y1="52" x2="38" y2="58" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,3" stroke-linecap="round"/>
  <!-- Crystal particles -->
  <rect x="37" y="56" width="4" height="4" rx="0.5" stroke="#374151" stroke-width="1" fill="#f3f4f6"/>
  <rect x="42" y="61" width="3" height="3" rx="0.5" stroke="#374151" stroke-width="1" fill="#f3f4f6"/>
  <rect x="32" y="62" width="3" height="3" rx="0.5" stroke="#374151" stroke-width="1" fill="#f3f4f6"/>
</svg>
