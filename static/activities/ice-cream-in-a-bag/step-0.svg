<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 0: Mix the Potion -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Table background -->
  <rect x="0" y="80" width="120" height="40" fill="#fef3c7" />
  <line x1="0" y1="80" x2="120" y2="80" stroke="#d97706" stroke-width="2" />

  <!-- Small Zip-lock Bag -->
  <path d="M40,40 L80,40 L80,95 Q80,100 75,100 L45,100 Q40,100 40,95 Z" fill="#f9fafb" opacity="0.8" stroke="#374151" stroke-width="2" stroke-linejoin="round" />
  <line x1="40" y1="45" x2="80" y2="45" stroke="#ef4444" stroke-width="2" />
  
  <!-- Liquid cream at bottom -->
  <path d="M42,85 L78,85 L78,95 Q78,98 75,98 L45,98 Q42,98 42,95 Z" fill="#fef9c3" opacity="0.7" />

  <!-- Heavy Cream Jug -->
  <g transform="translate(15, 30) rotate(15)">
    <rect x="-10" y="-15" width="20" height="35" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="1.5" />
    <path d="M-10,-15 L10,-15 L5,-25 L-5,-25 Z" fill="#93c5fd" stroke="#374151" stroke-width="1.5" />
    <rect x="-6" y="-5" width="12" height="15" fill="#ffffff" />
    <!-- Cream pouring -->
    <path d="M5,-25 Q15,-30 25,-10" fill="none" stroke="#fef9c3" stroke-width="2" stroke-dasharray="3,3" />
  </g>

  <!-- Spoon with sugar -->
  <g transform="translate(85, 30) rotate(-30)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#374151" stroke-width="2" stroke-linecap="round" />
    <ellipse cx="0" cy="0" rx="6" ry="10" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="4" ry="7" fill="#ffffff" />
    <!-- Sugar falling -->
    <path d="M-5,10 L-20,30" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="2,2" />
  </g>
</svg>