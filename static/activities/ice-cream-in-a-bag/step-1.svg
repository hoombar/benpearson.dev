<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 1: Prepare the Arctic Chamber -->
  <!-- Table background -->
  <rect x="0" y="90" width="120" height="30" fill="#fef3c7" />
  <line x1="0" y1="90" x2="120" y2="90" stroke="#d97706" stroke-width="2" />

  <!-- Large Zip-lock Bag -->
  <path d="M25,20 L95,20 L95,100 Q95,105 90,105 L30,105 Q25,105 25,100 Z" fill="#f9fafb" opacity="0.6" stroke="#374151" stroke-width="2" stroke-linejoin="round" />
  <line x1="25" y1="28" x2="95" y2="28" stroke="#ef4444" stroke-width="2.5" />

  <!-- Ice Cubes inside -->
  <g stroke="#374151" stroke-width="1.5" fill="#dbeafe">
    <rect x="35" y="80" width="15" height="15" rx="2" transform="rotate(10 42 87)" />
    <rect x="55" y="85" width="15" height="15" rx="2" transform="rotate(-15 62 92)" />
    <rect x="75" y="75" width="15" height="15" rx="2" transform="rotate(5 82 82)" />
    <rect x="45" y="65" width="15" height="15" rx="2" transform="rotate(-20 52 72)" />
    <rect x="65" y="60" width="15" height="15" rx="2" transform="rotate(25 72 67)" />
  </g>

  <!-- Salt container pouring -->
  <g transform="translate(85, 15) rotate(-45)">
    <rect x="-10" y="-20" width="20" height="35" fill="#3b82f6" stroke="#374151" stroke-width="1.5" />
    <path d="M-10,-20 Q0,-25 10,-20" fill="#60a5fa" stroke="#374151" stroke-width="1.5" />
    <rect x="-4" y="-22" width="8" height="4" fill="#f9fafb" stroke="#374151" stroke-width="1" />
    <!-- Salt grains falling -->
    <path d="M-5,-25 L-20,-45" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="2,3" />
    <path d="M0,-25 L-10,-50" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="2,4" />
  </g>

  <!-- Ice cube dropping in -->
  <g transform="translate(30, 30) rotate(15)">
    <rect x="0" y="0" width="15" height="15" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="1.5" />
    <line x1="7" y1="-10" x2="7" y2="-5" stroke="#374151" stroke-width="1.5" />
    <line x1="7" y1="20" x2="7" y2="25" stroke="#374151" stroke-width="1.5" />
  </g>
</svg>