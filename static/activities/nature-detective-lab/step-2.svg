<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background: outdoors/grass -->
  <rect x="0" y="0" width="120" height="120" fill="#d1fae5"/>
  <!-- Sky upper portion -->
  <rect x="0" y="0" width="120" height="50" fill="#dbeafe"/>
  <!-- Ground -->
  <rect x="0" y="80" width="120" height="40" fill="#d1fae5"/>
  <!-- Ground/grass horizon -->
  <line x1="0" y1="80" x2="120" y2="80" stroke="#86efac" stroke-width="2"/>

  <!-- Hero: outdoor map/sketch paper - large centre -->
  <rect x="14" y="12" width="88" height="64" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="2.5"/>
  <!-- Map terrain lines (simplified landscape) -->
  <path d="M22,28 Q34,20 50,24 Q66,28 80,22 Q90,20 96,24"
        fill="none" stroke="#86efac" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tree shapes on map -->
  <circle cx="30" cy="36" r="7" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <rect x="28" y="42" width="4" height="6" rx="1" fill="#d97706" stroke="#374151" stroke-width="1"/>
  <circle cx="88" cy="34" r="5" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <rect x="86" y="39" width="4" height="5" rx="1" fill="#d97706" stroke="#374151" stroke-width="1"/>

  <!-- Study zone: dashed boundary on map -->
  <rect x="40" y="28" width="36" height="28" rx="3" fill="#fef9c3" fill-opacity="0.7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- X marker in centre of study zone -->
  <line x1="53" y1="38" x2="63" y2="48" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <line x1="63" y1="38" x2="53" y2="48" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

  <!-- Pencil sketching the boundary (tip at top → after rotate(-25) points upper-left toward map) -->
  <!-- Tip -->
  <polygon points="105,10 102,16 108,16" fill="#374151" transform="rotate(-25 105 28)"/>
  <!-- Shaft -->
  <rect x="102" y="16" width="6" height="30" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1.5" transform="rotate(-25 105 28)"/>
  <!-- Eraser end — x=102 matches shaft x=102 so they are collinear after rotation -->
  <rect x="102" y="46" width="6" height="6" rx="1" fill="#fca5a5" stroke="#374151" stroke-width="1.5" transform="rotate(-25 105 28)"/>

  <!-- Arc motion from pencil to map zone edge — marker auto-aligns to tangent (80−88,50−46) = (−8,4) = left-down -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M96,42 Q88,46 80,50" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Ground detail: small patch of grass in study zone -->
  <!-- Grass tufts -->
  <line x1="30" y1="80" x2="28" y2="72" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="80" x2="35" y2="71" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="80" x2="58" y2="71" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="66" y1="80" x2="66" y2="70" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="90" y1="80" x2="92" y2="71" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Small leaf on ground -->
  <ellipse cx="48" cy="96" rx="8" ry="4" fill="#22c55e" stroke="#374151" stroke-width="1.5" transform="rotate(-15 48 96)"/>
  <!-- Rock on ground -->
  <ellipse cx="80" cy="100" rx="9" ry="6" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="78" cy="98" rx="5" ry="3" fill="#e5e7eb" stroke="none"/>
</svg>
