<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background -->
  <rect x="0" y="0" width="120" height="120" fill="#fef9c3"/>
  <!-- Table surface -->
  <rect x="0" y="80" width="120" height="40" fill="#fef3c7"/>
  <line x1="0" y1="80" x2="120" y2="80" stroke="#fde68a" stroke-width="1.5"/>

  <!-- Four labelled containers in a row on table -->
  <!-- Container 1: Leaves (green) -->
  <rect x="6" y="54" width="22" height="26" rx="4" fill="#d1fae5" stroke="#374151" stroke-width="2"/>
  <ellipse cx="17" cy="54" rx="11" ry="4" fill="#86efac" stroke="#374151" stroke-width="2"/>
  <!-- Leaf inside container 1 -->
  <ellipse cx="17" cy="64" rx="6" ry="4" fill="#22c55e" stroke="#374151" stroke-width="1"/>
  <!-- Label -->
  <rect x="8" y="70" width="18" height="8" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <line x1="10" y1="74" x2="24" y2="74" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Container 2: Petals (purple/pink) -->
  <rect x="32" y="54" width="22" height="26" rx="4" fill="#ede9fe" stroke="#374151" stroke-width="2"/>
  <ellipse cx="43" cy="54" rx="11" ry="4" fill="#c4b5fd" stroke="#374151" stroke-width="2"/>
  <!-- Petal inside -->
  <ellipse cx="43" cy="64" rx="5" ry="4" fill="#a78bfa" stroke="#374151" stroke-width="1"/>
  <ellipse cx="39" cy="66" rx="4" ry="3" fill="#c4b5fd" stroke="#374151" stroke-width="1"/>
  <!-- Label -->
  <rect x="34" y="70" width="18" height="8" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <line x1="36" y1="74" x2="50" y2="74" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Container 3: Rocks (grey) -->
  <rect x="58" y="54" width="22" height="26" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <ellipse cx="69" cy="54" rx="11" ry="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <!-- Rock inside -->
  <ellipse cx="69" cy="66" rx="6" ry="4" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
  <ellipse cx="67" cy="64" rx="3" ry="2" fill="#e5e7eb" stroke="none"/>
  <!-- Label -->
  <rect x="60" y="70" width="18" height="8" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <line x1="62" y1="74" x2="76" y2="74" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Container 4: Seeds (amber/yellow) - being labelled -->
  <rect x="84" y="54" width="22" height="26" rx="4" fill="#fef3c7" stroke="#374151" stroke-width="2.5"/>
  <ellipse cx="95" cy="54" rx="11" ry="4" fill="#fde68a" stroke="#374151" stroke-width="2.5"/>
  <!-- Seeds inside -->
  <ellipse cx="92" cy="64" rx="3" ry="2" fill="#f59e0b" stroke="#374151" stroke-width="1"/>
  <ellipse cx="98" cy="66" rx="3" ry="2" fill="#f59e0b" stroke="#374151" stroke-width="1"/>
  <ellipse cx="95" cy="68" rx="3" ry="2" fill="#d97706" stroke="#374151" stroke-width="1"/>
  <!-- Label being written (active/hero container) -->
  <rect x="86" y="70" width="18" height="8" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <line x1="88" y1="74" x2="102" y2="74" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Marker/pen writing the label on container 4 (tip touching label directly) -->
  <g transform="translate(95, 68) rotate(30)">
    <rect x="-3" y="-18" width="6" height="18" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <rect x="-3" y="-22" width="6" height="5" rx="1" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
    <polygon points="-2,0 2,0 0,4" fill="#374151"/>
  </g>

  <!-- Surface shadow lines -->
  <line x1="6" y1="80" x2="6" y2="86" stroke="#fde68a" stroke-width="1" stroke-linecap="round"/>
  <line x1="106" y1="80" x2="106" y2="86" stroke="#fde68a" stroke-width="1" stroke-linecap="round"/>
</svg>
