<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Box body -->
  <path d="M20 40 L80 40 L100 55 L100 105 L40 105 L20 90 Z" fill="#fef3c7" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <line x1="80" y1="40" x2="80" y2="90" stroke="#374151" stroke-width="2"/>
  <line x1="20" y1="90" x2="80" y2="90" stroke="#374151" stroke-width="2"/>
  
  <!-- Dots (Constellation) -->
  <circle cx="40" cy="50" r="2" fill="#374151"/>
  <circle cx="50" cy="45" r="2" fill="#374151"/>
  <circle cx="65" cy="48" r="2" fill="#374151"/>
  <circle cx="75" cy="42" r="2" fill="#374151"/>
  <circle cx="85" cy="50" r="2" fill="#374151"/>

  <!-- Imaginary lines linking them faintly -->
  <path d="M40 50 L50 45 L65 48 L75 42 L85 50" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Pen drawing the last dot -->
  <g transform="translate(85, 50) rotate(-30)">
    <!-- Shaft -->
    <rect x="-3" y="-40" width="6" height="30" fill="#fde68a" stroke="#374151" stroke-width="2"/>
    <!-- Tip -->
    <polygon points="-3,-10 3,-10 0,0" fill="#374151"/>
    <!-- Eraser end -->
    <rect x="-3" y="-46" width="6" height="6" fill="#fca5a5" stroke="#374151" stroke-width="2"/>
  </g>
</svg>