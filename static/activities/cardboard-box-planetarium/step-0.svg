<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Box body -->
  <path d="M20 30 L80 30 L100 45 L100 95 L40 95 L20 80 Z" fill="#fef3c7" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <!-- Inner box lines -->
  <line x1="80" y1="30" x2="80" y2="80" stroke="#374151" stroke-width="2"/>
  <line x1="20" y1="80" x2="80" y2="80" stroke="#374151" stroke-width="2"/>
  <!-- Tape across the bottom (now on top since it's flipped) -->
  <line x1="30" y1="35" x2="90" y2="40" stroke="#9ca3af" stroke-width="6" opacity="0.6"/>
  
  <!-- Tape dispenser/roll -->
  <circle cx="85" cy="20" r="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <circle cx="85" cy="20" r="4" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="75" y1="20" x2="65" y2="30" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Motion arrow showing taping -->
  <path d="M70 15 Q60 10 50 25" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>