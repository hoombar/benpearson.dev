<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Floor -->
  <rect x="0" y="100" width="120" height="20" fill="#f3f4f6" stroke="none"/>
  <line x1="0" y1="100" x2="120" y2="100" stroke="#374151" stroke-width="1.5"/>

  <!-- Cup wall (alternating upside-down and right-way-up) -->
  <!-- Row 1 (bottom, upside-down) -->
  <path d="M20,84 L24,100 L38,100 L42,84 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <path d="M44,84 L48,100 L62,100 L66,84 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <path d="M68,84 L72,100 L86,100 L90,84 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>

  <!-- Row 2 (right-way-up, nesting in gaps) -->
  <path d="M34,68 L30,84 L44,84 L40,68 Z" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <path d="M58,68 L54,84 L68,84 L64,68 Z" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <path d="M82,68 L78,84 L92,84 L88,68 Z" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>

  <!-- Row 3 (upside-down again) -->
  <path d="M20,52 L24,68 L38,68 L42,52 Z" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>
  <path d="M44,52 L48,68 L62,68 L66,52 Z" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>
  <path d="M68,52 L72,68 L86,68 L90,52 Z" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Row 4 (right-way-up) -->
  <path d="M34,36 L30,52 L44,52 L40,36 Z" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>
  <path d="M58,36 L54,52 L68,52 L64,36 Z" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>

  <!-- Row 5 (wobbling — top, with motion lines) -->
  <path d="M42,20 L46,36 L60,36 L64,20 Z" fill="#c4b5fd" stroke="#374151" stroke-width="1.5"/>

  <!-- Wobble motion lines -->
  <line x1="66" y1="22" x2="70" y2="18" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="68" y1="26" x2="72" y2="24" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="38" y1="24" x2="34" y2="20" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
</svg>