<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Floor -->
  <rect x="0" y="100" width="120" height="20" fill="#f3f4f6" stroke="none"/>
  <line x1="0" y1="100" x2="120" y2="100" stroke="#374151" stroke-width="1.5"/>

  <!-- Castle structure from cups -->
  <!-- Left tower (3 high) -->
  <path d="M6,78 L9,96 L21,96 L24,78 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <path d="M8,60 L11,78 L19,78 L22,60 Z" fill="#dbeafe" stroke="#374151" stroke-width="1.2"/>
  <path d="M10,44 L13,60 L17,60 L20,44 Z" fill="#fca5a5" stroke="#374151" stroke-width="1.2"/>

  <!-- Right tower (3 high) -->
  <path d="M86,78 L89,96 L101,96 L104,78 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <path d="M88,60 L91,78 L99,78 L102,60 Z" fill="#dbeafe" stroke="#374151" stroke-width="1.2"/>
  <path d="M90,44 L93,60 L97,60 L100,44 Z" fill="#fca5a5" stroke="#374151" stroke-width="1.2"/>

  <!-- Bridge between towers (cups resting across) -->
  <path d="M26,68 L29,86 L41,86 L44,68 Z" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>
  <path d="M46,68 L49,86 L61,86 L64,68 Z" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>
  <path d="M66,68 L69,86 L81,86 L84,68 Z" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>

  <!-- Bridge top layer -->
  <path d="M36,52 L39,68 L51,68 L54,52 Z" fill="#c4b5fd" stroke="#374151" stroke-width="1.2"/>
  <path d="M56,52 L59,68 L71,68 L74,52 Z" fill="#c4b5fd" stroke="#374151" stroke-width="1.2"/>

  <!-- Archway entrance (gap underneath bridge) -->
  <path d="M46,86 Q55,78 64,86" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Flag on top of left tower -->
  <line x1="15" y1="44" x2="15" y2="28" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <path d="M15,28 L25,32 L15,36 Z" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>

  <!-- Flag on right tower -->
  <line x1="95" y1="44" x2="95" y2="28" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <path d="M95,28 L105,32 L95,36 Z" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>

  <!-- Camera/phone taking photo (top right) -->
  <rect x="102" y="8" width="14" height="20" rx="2" fill="#374151" stroke="#374151" stroke-width="1"/>
  <circle cx="109" cy="16" r="3" fill="#3b82f6" stroke="#f9fafb" stroke-width="0.8"/>
  <!-- Flash -->
  <line x1="106" y1="6" x2="104" y2="2" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
  <line x1="109" y1="5" x2="109" y2="0" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
  <line x1="112" y1="6" x2="114" y2="2" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
</svg>