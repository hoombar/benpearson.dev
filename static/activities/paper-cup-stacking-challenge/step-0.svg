<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Floor -->
  <rect x="0" y="100" width="120" height="20" fill="#f3f4f6" stroke="none"/>
  <line x1="0" y1="100" x2="120" y2="100" stroke="#374151" stroke-width="1.5"/>

  <!-- 4-level cup pyramid (hero) -->
  <!-- Bottom row: 4 cups upside-down -->
  <path d="M14,82 L18,100 L32,100 L36,82 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <path d="M38,82 L42,100 L56,100 L60,82 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <path d="M62,82 L66,100 L80,100 L84,82 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <path d="M86,82 L90,100 L104,100 L108,82 Z" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>

  <!-- Second row: 3 cups -->
  <path d="M26,62 L30,80 L44,80 L48,62 Z" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <path d="M50,62 L54,80 L68,80 L72,62 Z" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <path d="M74,62 L78,80 L92,80 L96,62 Z" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>

  <!-- Third row: 2 cups -->
  <path d="M38,42 L42,60 L56,60 L60,42 Z" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>
  <path d="M62,42 L66,60 L80,60 L84,42 Z" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Top: 1 cup -->
  <path d="M50,22 L54,40 L68,40 L72,22 Z" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>

  <!-- Star on top -->
  <path d="M61,14 L62,10 L63,14 L67,14 L64,16 L65,20 L62,18 L59,20 L60,16 L57,14 Z"
        fill="#f59e0b" stroke="#374151" stroke-width="0.5"/>
</svg>