<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Step 0: Plan the Course Stations — top-down floor plan with 5-6 stations and route arrows -->

  <!-- Floor / room area -->
  <rect x="8" y="8" width="104" height="104" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- room inner edge (dashed = room boundary) -->
  <rect x="14" y="14" width="92" height="92" rx="2" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>

  <!-- START marker top-left -->
  <rect x="14" y="14" width="22" height="9" rx="1" fill="#22c55e" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Station 1: Cardboard tunnel (top-left) — amber box with openings -->
  <g transform="translate(30, 38)">
    <rect x="-13" y="-9" width="26" height="17" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- corrugation lines -->
    <line x1="-7" y1="-6" x2="-7" y2="5" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="1" y1="-6" x2="1" y2="5" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="9" y1="-6" x2="9" y2="5" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <!-- left opening -->
    <ellipse cx="-13" cy="0" rx="4" ry="7" fill="#fbbf24" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- right opening -->
    <ellipse cx="13" cy="0" rx="4" ry="7" fill="#fbbf24" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- direction arrow through tunnel -->
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="8,0 5,-2 5,2" fill="#374151"/>
  </g>

  <!-- Station 2: Stepping stones (top-right, paper squares on floor) -->
  <circle cx="80" cy="32" r="7" fill="#fde68a" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="92" cy="36" r="7" fill="#fde68a" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="88" cy="48" r="7" fill="#f59e0b" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Station 3: Limbo bar (right, between two book stacks — top-down view) -->
  <g transform="translate(96, 70)">
    <!-- left book stack (top-down = small rect) -->
    <rect x="-6" y="-14" width="12" height="6" rx="1" fill="#93c5fd" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- bar going left (orange tube) -->
    <line x1="-6" y1="-11" x2="-28" y2="-11" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <!-- right book stack -->
    <rect x="-6" y="-5" width="12" height="6" rx="1" fill="#86efac" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Station 4: Tape balance beam (bottom, horizontal tape strip on floor) -->
  <g transform="translate(60, 94)">
    <rect x="-28" y="-4" width="56" height="7" rx="2" fill="#fca5a5" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- footprint hint -->
    <ellipse cx="-10" cy="0" rx="2.5" ry="3.5" fill="#ef4444" opacity="0.4"/>
    <ellipse cx="10" cy="0" rx="2.5" ry="3.5" fill="#ef4444" opacity="0.4"/>
  </g>

  <!-- FINISH marker bottom-right -->
  <rect x="90" y="99" width="16" height="7" rx="1" fill="#ef4444" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- finish line tape -->
  <line x1="98" y1="88" x2="98" y2="99" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,2"/>

  <!-- Route arrows connecting stations (the planned course path — hero) -->
  <!-- 1 → 2 -->
  <path d="M44,36 Q62,30 72,30" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="71,28 76,31 71,34" fill="#374151"/>

  <!-- 2 → 3 -->
  <path d="M94,56 Q98,60 96,64" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="94,63 97,68 100,63" fill="#374151"/>

  <!-- 3 → 4 -->
  <path d="M84,72 Q72,82 74,90" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="72,89 75,95 78,90" fill="#374151"/>

  <!-- 4 → FINISH -->
  <path d="M88,93 Q90,93 92,96" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="91,95 94,99 97,95" fill="#374151"/>
</svg>
