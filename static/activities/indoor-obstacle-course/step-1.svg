<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Step 1: Build and Mark the Track — side view: tunnel, limbo bar on books, floor arrows, START/FINISH -->

  <!-- Floor -->
  <rect x="0" y="100" width="120" height="20" fill="#f3f4f6" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="0" y1="100" x2="120" y2="100" stroke="#374151" stroke-width="2" stroke-linecap="round"/>

  <!-- START label on floor -->
  <rect x="2" y="103" width="22" height="9" rx="1" fill="#22c55e" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- FINISH label on floor, right -->
  <rect x="96" y="103" width="22" height="9" rx="1" fill="#ef4444" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- finish tape vertical -->
  <line x1="107" y1="80" x2="107" y2="100" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,2"/>

  <!-- Floor route arrows (hero — show direction through course) -->
  <line x1="26" y1="108" x2="42" y2="108" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <polygon points="41,106 46,108 41,110" fill="#374151"/>
  <line x1="52" y1="108" x2="68" y2="108" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <polygon points="67,106 72,108 67,110" fill="#374151"/>
  <line x1="78" y1="108" x2="90" y2="108" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <polygon points="89,106 94,108 89,110" fill="#374151"/>

  <!-- CARDBOARD TUNNEL (left, side view) -->
  <g transform="translate(26, 76)">
    <!-- tunnel body sides (two walls visible) -->
    <rect x="-20" y="-24" width="40" height="24" rx="3" fill="#fef3c7" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <!-- corrugation lines -->
    <line x1="-14" y1="-24" x2="-14" y2="-4" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="-5" y1="-24" x2="-5" y2="-4" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="4" y1="-24" x2="4" y2="-4" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="13" y1="-24" x2="13" y2="-4" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <!-- base strip -->
    <rect x="-22" y="0" width="44" height="4" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- left tunnel opening arch (dark interior visible through arch) -->
    <path d="M-20,-24 Q-20,-42 -8,-42 Q4,-42 4,-24" fill="#b45309" stroke="#374151" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M-20,-24 Q-20,-42 -8,-42 Q4,-42 4,-24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <!-- right face (smaller rectangle showing tunnel depth) -->
    <rect x="16" y="-20" width="8" height="20" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- STEPPING STONES (centre, 3 paper squares on floor) -->
  <rect x="46" y="88" width="10" height="10" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="52" y="78" width="10" height="10" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="58" y="88" width="10" height="10" rx="1" fill="#f59e0b" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- BOOK STACKS supporting limbo bar -->
  <g transform="translate(70, 90)">
    <rect x="-7" y="-24" width="14" height="6" rx="1" fill="#dbeafe" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-7" y="-18" width="14" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-7" y="-12" width="14" height="6" rx="1" fill="#86efac" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-8" y="-6" width="16" height="6" rx="1" fill="#fca5a5" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(94, 90)">
    <rect x="-7" y="-24" width="14" height="6" rx="1" fill="#86efac" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-7" y="-18" width="14" height="6" rx="1" fill="#dbeafe" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-7" y="-12" width="14" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-8" y="-6" width="16" height="6" rx="1" fill="#fca5a5" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- LIMBO BAR (orange cardboard tube) -->
  <line x1="63" y1="66" x2="101" y2="66" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
  <line x1="65" y1="64" x2="99" y2="64" stroke="#fdba74" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Tape roll icon (top-right, showing the tool used) -->
  <g transform="translate(108, 22)">
    <circle cx="0" cy="0" r="9" fill="#fde68a" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#f9fafb" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M9,0 Q14,-2 16,-6" fill="none" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
