<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Step 2: Race the Clock — child running course, stopwatch, star sticker reward -->

  <!-- Floor -->
  <rect x="0" y="100" width="120" height="20" fill="#f3f4f6" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="0" y1="100" x2="120" y2="100" stroke="#374151" stroke-width="2" stroke-linecap="round"/>

  <!-- Finish tape (right, vertical) -->
  <line x1="90" y1="68" x2="90" y2="100" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <!-- Checkered finish flag on pole -->
  <g transform="translate(90, 66)">
    <rect x="0" y="-18" width="18" height="12" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- checkered squares -->
    <rect x="0" y="-18" width="4.5" height="4" fill="#374151"/>
    <rect x="9" y="-18" width="4.5" height="4" fill="#374151"/>
    <rect x="4.5" y="-14" width="4.5" height="4" fill="#374151"/>
    <rect x="13.5" y="-14" width="4.5" height="4" fill="#374151"/>
    <rect x="0" y="-10" width="4.5" height="4" fill="#374151"/>
    <rect x="9" y="-10" width="4.5" height="4" fill="#374151"/>
  </g>

  <!-- STICK FIGURE child running (hero, 30%+ of canvas) -->
  <g transform="translate(36, 62)">
    <!-- head -->
    <circle cx="0" cy="-28" r="11" fill="#fef3c7" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- hair -->
    <path d="M-9,-36 Q-5,-44 0,-42 Q5,-44 9,-36" fill="#d97706" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="-3.5" cy="-30" r="1.5" fill="#374151"/>
    <circle cx="3.5" cy="-30" r="1.5" fill="#374151"/>
    <!-- smile -->
    <path d="M-4,-24 Q0,-20 4,-24" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- body/shirt -->
    <rect x="-10" y="-17" width="20" height="26" rx="4" fill="#3b82f6" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <!-- left arm pumping back -->
    <line x1="-10" y1="-10" x2="-24" y2="-2" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- right arm pumping forward -->
    <line x1="10" y1="-10" x2="22" y2="-18" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- left leg trailing back -->
    <line x1="-5" y1="9" x2="-16" y2="32" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- right leg leading forward -->
    <line x1="5" y1="9" x2="18" y2="26" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- left shoe -->
    <ellipse cx="-18" cy="34" rx="7" ry="3.5" fill="#ef4444" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- right shoe -->
    <ellipse cx="20" cy="28" rx="7" ry="3.5" fill="#ef4444" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Motion lines behind runner -->
  <line x1="4" y1="46" x2="16" y2="46" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="4" y1="54" x2="18" y2="54" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="62" x2="14" y2="62" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- STOPWATCH (top-right, vivid blue) -->
  <g transform="translate(100, 36)">
    <!-- watch body -->
    <circle cx="0" cy="4" r="20" fill="#f9fafb" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- watch inner face -->
    <circle cx="0" cy="4" r="16" fill="#dbeafe" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <!-- tick marks -->
    <line x1="0" y1="-12" x2="0" y2="-15" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="19" x2="0" y2="22" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-12" y1="4" x2="-15" y2="4" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12" y1="4" x2="15" y2="4" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- minute hand (up) -->
    <line x1="0" y1="4" x2="0" y2="-10" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- second hand (red, at angle) -->
    <line x1="0" y1="4" x2="10" y2="12" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <!-- centre dot -->
    <circle cx="0" cy="4" r="2.5" fill="#374151"/>
    <!-- crown -->
    <rect x="-4" y="-22" width="8" height="5" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- side button -->
    <rect x="17" y="0" width="5" height="8" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- GOLD STAR STICKER (reward, bottom-right) -->
  <g transform="translate(100, 88)">
    <polygon points="0,-14 3.5,-5 13,-5 6,1 9,10 0,4 -9,10 -6,1 -13,-5 -3.5,-5" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="0,-10 2.5,-4 9,-4 4,0 6.5,7 0,3 -6.5,7 -4,0 -9,-4 -2.5,-4" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- Floor tape arrows showing course route -->
  <g transform="translate(58, 108)">
    <rect x="-6" y="-2" width="14" height="4" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <polygon points="8,0 3,-4 3,4" fill="#fde68a" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  </g>
  <g transform="translate(76, 108)">
    <rect x="-4" y="-2" width="12" height="4" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <polygon points="8,0 3,-4 3,4" fill="#fde68a" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
