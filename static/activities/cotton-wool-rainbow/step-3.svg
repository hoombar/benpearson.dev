<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Light blue sky background -->
  <rect x="0" y="0" width="120" height="100" fill="#e0f2fe"/>
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Completed cotton wool rainbow with clouds (hero) -->
  <g transform="translate(6, 8)">
    <!-- Red arc -->
    <path d="M10,80 Q54,4 98,80" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <!-- Orange arc -->
    <path d="M14,80 Q54,10 94,80" fill="none" stroke="#f97316" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <!-- Yellow arc -->
    <path d="M18,80 Q54,16 90,80" fill="none" stroke="#eab308" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <!-- Green arc -->
    <path d="M22,80 Q54,22 86,80" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <!-- Blue arc -->
    <path d="M26,80 Q54,28 82,80" fill="none" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <!-- Purple arc -->
    <path d="M30,80 Q54,34 78,80" fill="none" stroke="#a855f7" stroke-width="7" stroke-linecap="round" opacity="0.7"/>

    <!-- Left cloud cluster -->
    <circle cx="8" cy="78" r="10" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="18" cy="74" r="8" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="4" cy="72" r="7" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="14" cy="68" r="6" fill="white" stroke="#d1d5db" stroke-width="0.8"/>

    <!-- Right cloud cluster -->
    <circle cx="100" cy="78" r="10" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="90" cy="74" r="8" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="104" cy="72" r="7" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="94" cy="68" r="6" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
  </g>

  <!-- Sun peeking -->
  <circle cx="104" cy="16" r="10" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
  <line x1="104" y1="4" x2="104" y2="0" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="114" y1="12" x2="118" y2="10" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="116" y1="22" x2="120" y2="24" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
</svg>
