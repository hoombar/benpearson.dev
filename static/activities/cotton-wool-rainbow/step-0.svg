<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper with rainbow arcs being drawn (hero) -->
  <rect x="6" y="6" width="88" height="84" rx="1" fill="white" stroke="#374151" stroke-width="1"/>

  <!-- Rainbow arcs (drawn lines) -->
  <path d="M14,80 Q50,10 86,80" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <path d="M18,80 Q50,16 82,80" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <path d="M22,80 Q50,22 78,80" fill="none" stroke="#eab308" stroke-width="2" stroke-linecap="round"/>
  <path d="M26,80 Q50,28 74,80" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <path d="M30,80 Q50,34 70,80" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <!-- Inner arc being drawn (dashed) -->
  <path d="M34,80 Q50,40 66,80" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,3"/>

  <!-- Marker drawing the inner arc -->
  <g transform="translate(62, 60) rotate(40)">
    <rect x="0" y="-3" width="28" height="6" rx="2" fill="#a855f7" stroke="#374151" stroke-width="0.6"/>
    <rect x="-3" y="-2.5" width="4" height="5" rx="1" fill="#7c3aed"/>
    <polygon points="-3,-1 -3,1 -5,0" fill="#a855f7"/>
  </g>

  <!-- Extra markers -->
  <g transform="translate(98, 30)">
    <rect x="0" y="0" width="5" height="20" rx="1.5" fill="#ef4444" stroke="#374151" stroke-width="0.4"/>
  </g>
  <g transform="translate(104, 32)">
    <rect x="0" y="0" width="5" height="18" rx="1.5" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
  </g>
  <g transform="translate(110, 28)">
    <rect x="0" y="0" width="5" height="22" rx="1.5" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
  </g>
</svg>
