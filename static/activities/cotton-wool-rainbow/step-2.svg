<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper with cotton wool being glued onto arcs (hero) -->
  <rect x="6" y="6" width="88" height="84" rx="1" fill="white" stroke="#374151" stroke-width="1"/>

  <!-- Cotton wool rainbow arcs (fluffy, partially complete) -->
  <!-- Red (complete) -->
  <path d="M14,80 Q50,10 86,80" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <!-- Orange (complete) -->
  <path d="M18,80 Q50,16 82,80" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <!-- Yellow (complete) -->
  <path d="M22,80 Q50,22 78,80" fill="none" stroke="#eab308" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <!-- Green (being applied — partial) -->
  <path d="M26,80 Q38,46 50,36" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <!-- Remaining green arc (drawn line only) -->
  <path d="M50,36 Q62,44 74,80" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,3"/>

  <!-- Blue and purple arcs (still drawn lines) -->
  <path d="M30,80 Q50,34 70,80" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,3"/>
  <path d="M34,80 Q50,40 66,80" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,3"/>

  <!-- Hand pressing cotton wool -->
  <g transform="translate(44, 26)">
    <rect x="0" y="0" width="12" height="18" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Glue bottle -->
  <g transform="translate(96, 40) rotate(15)">
    <rect x="0" y="-5" width="18" height="10" rx="3" fill="white" stroke="#374151" stroke-width="0.6"/>
    <path d="M-2,-3 L-5,0 L-2,3" fill="#f97316" stroke="#374151" stroke-width="0.4"/>
    <rect x="4" y="-3" width="8" height="6" rx="1" fill="#f97316" opacity="0.6"/>
  </g>

  <!-- Green cotton wool strip ready -->
  <g transform="translate(96, 64)">
    <path d="M0,0 Q6,-3 12,0 Q18,3 24,0" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
