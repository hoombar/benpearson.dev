<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Table surface -->
  <rect x="5" y="105" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Plastic bottle (hero) -->
  <path d="M40,102 Q36,102 36,96 L36,36 Q36,28 44,24 L44,16 Q44,12 48,12 L72,12 Q76,12 76,16 L76,24 Q84,28 84,36 L84,96 Q84,102 80,102 Z"
        fill="none" stroke="#374151" stroke-width="2.5"/>

  <!-- Water inside -->
  <rect x="38" y="42" width="44" height="58" rx="2" fill="#dbeafe" stroke="none" opacity="0.4"/>
  <!-- Glitter in water -->
  <circle cx="50" cy="60" r="1" fill="#f59e0b" stroke="none"/>
  <circle cx="65" cy="70" r="1.5" fill="#e5e7eb" stroke="none"/>
  <circle cx="72" cy="82" r="1" fill="#f59e0b" stroke="none"/>

  <!-- Cap being screwed on -->
  <rect x="46" y="8" width="28" height="8" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="2"/>

  <!-- Tape wrapping around cap -->
  <rect x="44" y="6" width="32" height="12" rx="4" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.6"/>
  <!-- Tape roll nearby -->
  <circle cx="104" cy="40" r="12" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <circle cx="104" cy="40" r="5" fill="#fef3c7" stroke="#374151" stroke-width="1"/>

  <!-- Arrow from tape to cap -->
  <path d="M92,40 Q82,30 76,14" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Rotation arc around cap showing screwing motion -->
  <path d="M42,4 Q60,-6 78,4" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Checkmark (sealed tight!) -->
  <path d="M18,50 L24,58 L36,42" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
