<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Table surface -->
  <rect x="5" y="105" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Plastic bottle (hero, large) — single closed path -->
  <path d="M40,102 Q36,102 36,96 L36,36 Q36,28 44,24 L44,16 Q44,12 48,12 L72,12 Q76,12 76,16 L76,24 Q84,28 84,36 L84,96 Q84,102 80,102 Z"
        fill="none" stroke="#374151" stroke-width="2.5"/>
  <!-- Cap -->
  <rect x="46" y="8" width="28" height="8" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>

  <!-- Water level (3/4 full) -->
  <rect x="38" y="42" width="44" height="58" rx="2" fill="#dbeafe" stroke="none" opacity="0.5"/>
  <!-- Water surface line -->
  <path d="M38,42 Q50,38 60,42 Q70,46 82,42" stroke="#93c5fd" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Air gap indication at top -->
  <line x1="44" y1="30" x2="52" y2="30" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="48" y1="28" x2="48" y2="32" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>

  <!-- Water pouring in from right (tap/jug) -->
  <path d="M96,20 Q100,20 100,24 L100,40 Q100,44 96,44 L92,44 Q88,44 88,40 L88,24 Q88,20 92,20 Z"
        fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>

  <!-- Water stream flowing into bottle -->
  <path d="M88,36 Q82,36 78,24" stroke="#93c5fd" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="86" y1="34" x2="80" y2="28" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>

  <!-- 3/4 mark indicator -->
  <line x1="30" y1="42" x2="35" y2="42" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="30" y1="102" x2="35" y2="102" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- Bracket showing 3/4 -->
  <path d="M32,42 L30,42 L30,102 L32,102" stroke="#374151" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>
