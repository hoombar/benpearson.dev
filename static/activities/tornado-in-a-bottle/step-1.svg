<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Table surface -->
  <rect x="5" y="105" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Plastic bottle (hero) -->
  <path d="M40,102 Q36,102 36,96 L36,36 Q36,28 44,24 L44,16 Q44,12 48,12 L72,12 Q76,12 76,16 L76,24 Q84,28 84,36 L84,96 Q84,102 80,102 Z"
        fill="none" stroke="#374151" stroke-width="2.5"/>

  <!-- Water inside -->
  <rect x="38" y="42" width="44" height="58" rx="2" fill="#dbeafe" stroke="none" opacity="0.4"/>

  <!-- Glitter particles in water -->
  <circle cx="48" cy="56" r="1.5" fill="#f59e0b" stroke="none"/>
  <circle cx="62" cy="62" r="1" fill="#e5e7eb" stroke="none"/>
  <circle cx="72" cy="52" r="1.5" fill="#f59e0b" stroke="none"/>
  <circle cx="55" cy="78" r="1" fill="#e5e7eb" stroke="none"/>
  <circle cx="44" cy="88" r="1.5" fill="#f59e0b" stroke="none"/>
  <circle cx="68" cy="72" r="1" fill="#e5e7eb" stroke="none"/>
  <circle cx="76" cy="86" r="1.5" fill="#f59e0b" stroke="none"/>

  <!-- Washing-up liquid bottle (left) -->
  <path d="M4,36 Q2,36 2,40 L2,78 Q2,82 8,82 L14,82 Q20,82 20,78 L20,40 Q20,36 18,36 Z"
        fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <rect x="7" y="26" width="8" height="12" rx="2" fill="#d1fae5" stroke="#374151" stroke-width="1"/>
  <!-- Nozzle -->
  <path d="M9,26 L11,22 L13,26" fill="#22c55e" stroke="#374151" stroke-width="1"/>

  <!-- Drop falling from soap bottle into bottle top -->
  <ellipse cx="24" cy="20" rx="3" ry="4" fill="#d1fae5" stroke="#374151" stroke-width="1"/>
  <path d="M24,16 L26,12" stroke="#374151" stroke-width="1" stroke-linecap="round" stroke-dasharray="2,1"/>

  <!-- Arrow from soap to bottle -->
  <path d="M26,24 Q36,24 44,18" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Glitter tube (right) -->
  <rect x="96" y="34" width="14" height="36" rx="3" fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>
  <rect x="98" y="28" width="10" height="8" rx="2" fill="#fde68a" stroke="#374151" stroke-width="1"/>

  <!-- Glitter falling from tube -->
  <circle cx="98" cy="74" r="1" fill="#f59e0b" stroke="none"/>
  <circle cx="94" cy="78" r="1.5" fill="#e5e7eb" stroke="none"/>
  <circle cx="96" cy="82" r="1" fill="#f59e0b" stroke="none"/>

  <!-- Arrow from glitter to bottle -->
  <path d="M94,70 Q86,50 78,30" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
