<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Bottle held upside down (hero) -->
  <!-- Cap at bottom -->
  <rect x="46" y="102" width="28" height="8" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>

  <!-- Bottle body (upside down) -->
  <path d="M40,10 Q36,10 36,16 L36,76 Q36,84 44,88 L44,96 Q44,100 48,100 L72,100 Q76,100 76,96 L76,88 Q84,84 84,76 L84,16 Q84,10 80,10 Z"
        fill="none" stroke="#374151" stroke-width="2.5"/>

  <!-- Water at top of upside-down bottle -->
  <rect x="38" y="12" width="44" height="50" rx="2" fill="#dbeafe" stroke="none" opacity="0.4"/>

  <!-- VORTEX/TORNADO funnel in the water -->
  <!-- Funnel shape — wide at top, narrow at bottom -->
  <path d="M48,58 Q52,62 58,90" stroke="#93c5fd" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M72,58 Q68,62 62,90" stroke="#93c5fd" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Spiral lines inside vortex -->
  <path d="M52,62 Q60,58 68,62" stroke="#93c5fd" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M54,68 Q60,64 66,68" stroke="#93c5fd" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M56,74 Q60,70 64,74" stroke="#93c5fd" stroke-width="0.75" fill="none" stroke-linecap="round"/>
  <path d="M58,80 Q60,77 62,80" stroke="#93c5fd" stroke-width="0.75" fill="none" stroke-linecap="round"/>

  <!-- Glitter caught in vortex -->
  <circle cx="52" cy="60" r="1.5" fill="#f59e0b" stroke="none"/>
  <circle cx="66" cy="64" r="1" fill="#e5e7eb" stroke="none"/>
  <circle cx="58" cy="72" r="1.5" fill="#f59e0b" stroke="none"/>
  <circle cx="62" cy="78" r="1" fill="#e5e7eb" stroke="none"/>
  <circle cx="60" cy="84" r="1" fill="#f59e0b" stroke="none"/>
  <!-- Glitter in water above -->
  <circle cx="44" cy="30" r="1" fill="#f59e0b" stroke="none"/>
  <circle cx="70" cy="24" r="1.5" fill="#e5e7eb" stroke="none"/>
  <circle cx="56" cy="40" r="1" fill="#f59e0b" stroke="none"/>

  <!-- Circular swirl motion arrows around bottle -->
  <path d="M28,50 Q20,40 28,30" stroke="#374151" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M92,30 Q100,40 92,50" stroke="#374151" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Speed/motion lines -->
  <line x1="22" y1="44" x2="16" y2="44" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="24" y1="38" x2="18" y2="36" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="98" y1="44" x2="104" y2="44" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="96" y1="38" x2="102" y2="36" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>
</svg>
