<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Finished snowman (hero, centre) -->
  <!-- Body -->
  <ellipse cx="60" cy="72" rx="24" ry="22" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Head -->
  <ellipse cx="60" cy="34" rx="16" ry="16" fill="#f9fafb" stroke="#374151" stroke-width="2"/>

  <!-- Hat (coloured sock cuff) -->
  <rect x="46" y="10" width="28" height="16" rx="3" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <!-- Hat brim (folded cuff) -->
  <rect x="44" y="22" width="32" height="6" rx="2" fill="#fca5a5" stroke="#374151" stroke-width="1"/>
  <!-- Pom-pom on top -->
  <circle cx="60" cy="10" r="4" fill="#f9fafb" stroke="#374151" stroke-width="1"/>

  <!-- Scarf -->
  <path d="M44,48 Q50,52 60,50 Q70,48 76,52" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <!-- Scarf tails -->
  <line x1="72" y1="50" x2="78" y2="60" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="60" x2="76" y2="68" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Scarf stripes -->
  <line x1="48" y1="49" x2="48" y2="53" stroke="#f9fafb" stroke-width="1" stroke-linecap="round"/>
  <line x1="54" y1="50" x2="54" y2="52" stroke="#f9fafb" stroke-width="1" stroke-linecap="round"/>
  <line x1="66" y1="49" x2="66" y2="52" stroke="#f9fafb" stroke-width="1" stroke-linecap="round"/>

  <!-- Face -->
  <circle cx="54" cy="30" r="2" fill="#374151" stroke="none"/>
  <circle cx="66" cy="30" r="2" fill="#374151" stroke="none"/>
  <polygon points="60,34 57,38 63,38" fill="#f59e0b" stroke="#374151" stroke-width="0.5"/>
  <circle cx="54" cy="40" r="1" fill="#374151" stroke="none"/>
  <circle cx="57" cy="42" r="1" fill="#374151" stroke="none"/>
  <circle cx="60" cy="43" r="1" fill="#374151" stroke="none"/>
  <circle cx="63" cy="42" r="1" fill="#374151" stroke="none"/>
  <circle cx="66" cy="40" r="1" fill="#374151" stroke="none"/>

  <!-- Buttons -->
  <circle cx="60" cy="58" r="2" fill="#374151" stroke="none"/>
  <circle cx="60" cy="68" r="2" fill="#374151" stroke="none"/>
  <circle cx="60" cy="78" r="2" fill="#374151" stroke="none"/>

  <!-- Mini snowman beside (baby snowman) -->
  <ellipse cx="18" cy="84" rx="10" ry="10" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="18" cy="68" rx="7" ry="7" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <circle cx="16" cy="66" r="1" fill="#374151" stroke="none"/>
  <circle cx="20" cy="66" r="1" fill="#374151" stroke="none"/>
  <polygon points="18,68 17,70 19,70" fill="#f59e0b" stroke="none"/>
  <path d="M12,74 Q15,76 18,75 Q21,74 24,76" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sparkle/snowflakes -->
  <path d="M100,20 L100,14 M97,17 L103,17 M98,15 L102,19 M98,19 L102,15" stroke="#93c5fd" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M14,20 L14,14 M11,17 L17,17" stroke="#93c5fd" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M96,50 L96,46 M94,48 L98,48" stroke="#93c5fd" stroke-width="0.8" stroke-linecap="round"/>
</svg>