<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Sock snowman shape with rubber bands (hero) -->
  <!-- Body (bottom, larger ball) -->
  <ellipse cx="60" cy="72" rx="24" ry="22" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Rice texture -->
  <line x1="50" y1="70" x2="51" y2="68" stroke="#e5e7eb" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="60" y1="76" x2="61" y2="74" stroke="#e5e7eb" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="70" y1="68" x2="71" y2="66" stroke="#e5e7eb" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Head (top, smaller ball) -->
  <ellipse cx="60" cy="34" rx="16" ry="16" fill="#f9fafb" stroke="#374151" stroke-width="2"/>

  <!-- Rubber band at neck (between head and body) -->
  <ellipse cx="60" cy="50" rx="12" ry="3" fill="none" stroke="#ef4444" stroke-width="2.5"/>

  <!-- Rubber band at top (sealing) -->
  <ellipse cx="60" cy="18" rx="6" ry="2" fill="none" stroke="#ef4444" stroke-width="2"/>
  <!-- Excess sock fabric above top band -->
  <path d="M54,18 Q56,10 60,8 Q64,10 66,18" fill="#f3f4f6" stroke="#374151" stroke-width="1"/>

  <!-- Arrows showing where rubber bands go -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M90,50 Q82,50 74,50" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M84,18 Q76,18 68,18" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Rubber bands nearby -->
  <circle cx="98" cy="50" r="6" fill="none" stroke="#ef4444" stroke-width="2"/>
  <circle cx="92" cy="18" r="5" fill="none" stroke="#ef4444" stroke-width="2"/>

  <!-- Squish arrows showing shaping -->
  <path d="M30,72 Q36,72 38,72" fill="none" stroke="#374151" stroke-width="1" marker-end="url(#arr)" stroke-dasharray="2,2"/>
  <path d="M90,72 Q84,72 82,72" fill="none" stroke="#374151" stroke-width="1" marker-end="url(#arr)" stroke-dasharray="2,2"/>
</svg>