<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- White sock (hero, open at top, being filled) -->
  <path d="M42,24 L38,80 Q38,96 50,96 L70,96 Q82,96 82,80 L78,24" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Sock opening -->
  <ellipse cx="60" cy="24" rx="18" ry="5" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <!-- Sock ribbing -->
  <line x1="42" y1="28" x2="78" y2="28" stroke="#e5e7eb" stroke-width="0.8"/>
  <line x1="42" y1="32" x2="78" y2="32" stroke="#e5e7eb" stroke-width="0.8"/>

  <!-- Rice inside (bottom portion) -->
  <path d="M40,58 L40,80 Q40,94 52,94 L68,94 Q80,94 80,80 L80,58" fill="#fef3c7" stroke="none"/>
  <ellipse cx="60" cy="58" rx="20" ry="4" fill="#fef3c7" stroke="#d97706" stroke-width="0.5"/>
  <!-- Rice grain texture -->
  <line x1="50" y1="66" x2="51" y2="64" stroke="#d97706" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="58" y1="70" x2="59" y2="68" stroke="#d97706" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="66" y1="64" x2="67" y2="62" stroke="#d97706" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="54" y1="76" x2="55" y2="74" stroke="#d97706" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="70" y1="72" x2="71" y2="70" stroke="#d97706" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Rice grains falling in -->
  <circle cx="56" cy="36" r="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.4"/>
  <circle cx="60" cy="40" r="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.4"/>
  <circle cx="64" cy="34" r="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.4"/>
  <circle cx="58" cy="44" r="1" fill="#fef3c7" stroke="#d97706" stroke-width="0.4"/>

  <!-- Scoop/cup pouring rice -->
  <path d="M86,12 Q92,8 98,12 L98,22 Q92,26 86,22 Z" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
  <!-- Rice in scoop -->
  <ellipse cx="92" cy="14" rx="5" ry="3" fill="#fef3c7" stroke="#d97706" stroke-width="0.5"/>

  <!-- Pour arrow -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M86,20 Q78,26 68,28" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>
</svg>