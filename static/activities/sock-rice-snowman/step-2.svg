<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Snowman with face and buttons (hero) -->
  <!-- Body -->
  <ellipse cx="60" cy="72" rx="24" ry="22" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Head -->
  <ellipse cx="60" cy="34" rx="16" ry="16" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Neck rubber band -->
  <ellipse cx="60" cy="50" rx="12" ry="3" fill="none" stroke="#ef4444" stroke-width="2"/>
  <!-- Top rubber band -->
  <ellipse cx="60" cy="18" rx="6" ry="2" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <path d="M54,18 Q56,10 60,8 Q64,10 66,18" fill="#f3f4f6" stroke="#374151" stroke-width="1"/>

  <!-- Face -->
  <!-- Eyes -->
  <circle cx="54" cy="30" r="2" fill="#374151" stroke="none"/>
  <circle cx="66" cy="30" r="2" fill="#374151" stroke="none"/>
  <!-- Carrot nose (orange triangle) -->
  <polygon points="60,34 57,38 63,38" fill="#f59e0b" stroke="#374151" stroke-width="0.6"/>
  <!-- Smile (dots) -->
  <circle cx="54" cy="40" r="1" fill="#374151" stroke="none"/>
  <circle cx="57" cy="42" r="1" fill="#374151" stroke="none"/>
  <circle cx="60" cy="43" r="1" fill="#374151" stroke="none"/>
  <circle cx="63" cy="42" r="1" fill="#374151" stroke="none"/>
  <circle cx="66" cy="40" r="1" fill="#374151" stroke="none"/>

  <!-- Buttons down body -->
  <circle cx="60" cy="58" r="2" fill="#374151" stroke="none"/>
  <circle cx="60" cy="68" r="2" fill="#374151" stroke="none"/>
  <circle cx="60" cy="78" r="2" fill="#374151" stroke="none"/>

  <!-- Marker pen nearby -->
  <line x1="96" y1="34" x2="96" y2="60" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <rect x="93.5" y="30" width="5" height="5" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>

  <!-- Star sticker on body -->
  <path d="M48,64 L49,61 L50,64 L53,64 L51,66 L52,69 L49,67 L46,69 L47,66 L44,64 Z"
        fill="#f59e0b" stroke="#374151" stroke-width="0.4"/>
