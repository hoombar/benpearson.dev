<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="95" width="110" height="12" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Eggshell halves (hero, centre) -->
  <!-- Shell half 1 -->
  <path d="M40,40 Q36,52 38,62 Q42,70 50,70 Q58,70 62,62 Q64,52 60,40 Q50,30 40,40 Z" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>
  <!-- Cracked top edge -->
  <path d="M40,40 L44,36 L48,42 L52,34 L56,40 L60,40" fill="none" stroke="#374151" stroke-width="1.2"/>

  <!-- Shell half 2 -->
  <path d="M66,44 Q64,54 66,62 Q68,68 74,68 Q80,68 82,62 Q84,54 82,44 Q74,36 66,44 Z" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>
  <path d="M66,44 L68,40 L72,46 L76,38 L80,44 L82,44" fill="none" stroke="#374151" stroke-width="1.2"/>

  <!-- Running water (tap) -->
  <rect x="18" y="4" width="14" height="10" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
  <rect x="22" y="14" width="6" height="8" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <!-- Water stream (dashed) -->
  <line x1="25" y1="22" x2="25" y2="40" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>
  <line x1="23" y1="22" x2="22" y2="38" stroke="#93c5fd" stroke-width="1" stroke-dasharray="2,3" stroke-linecap="round"/>

  <!-- Bowl underneath tap -->
  <path d="M12,50 Q12,70 25,70 Q38,70 38,50" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="25" cy="50" rx="13" ry="4" fill="#bfdbfe" stroke="#374151" stroke-width="1"/>

  <!-- Paper towel with shells drying (right) -->
  <rect x="78" y="70" width="30" height="22" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <!-- Dotted paper towel texture -->
  <circle cx="84" cy="76" r="0.5" fill="#d1d5db" stroke="none"/>
  <circle cx="90" cy="76" r="0.5" fill="#d1d5db" stroke="none"/>
  <circle cx="96" cy="76" r="0.5" fill="#d1d5db" stroke="none"/>
  <circle cx="102" cy="76" r="0.5" fill="#d1d5db" stroke="none"/>
  <circle cx="87" cy="82" r="0.5" fill="#d1d5db" stroke="none"/>
  <circle cx="93" cy="82" r="0.5" fill="#d1d5db" stroke="none"/>
  <circle cx="99" cy="82" r="0.5" fill="#d1d5db" stroke="none"/>
  <!-- Shell pieces drying -->
  <path d="M86,78 Q84,82 87,83 Q90,82 88,78 Z" fill="#fef3c7" stroke="#374151" stroke-width="0.6"/>
  <path d="M94,77 Q92,81 95,82 Q98,81 96,77 Z" fill="#fef3c7" stroke="#374151" stroke-width="0.6"/>
  <path d="M100,80 Q99,83 101,84 Q103,83 102,80 Z" fill="#fef3c7" stroke="#374151" stroke-width="0.6"/>

  <!-- Membrane being peeled (visual cue) -->
  <path d="M58,58 Q62,56 64,52" fill="none" stroke="#fde68a" stroke-width="1" stroke-dasharray="2,2"/>
</svg>