<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper sheet with mosaic flower design (hero) -->
  <rect x="15" y="12" width="76" height="82" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>

  <!-- Mosaic flower — petals made of shell pieces -->
  <!-- Top petal (red) -->
  <circle cx="53" cy="32" r="3" fill="#ef4444" stroke="#374151" stroke-width="0.4"/>
  <circle cx="49" cy="30" r="2.5" fill="#fca5a5" stroke="#374151" stroke-width="0.4"/>
  <circle cx="57" cy="30" r="2.5" fill="#ef4444" stroke="#374151" stroke-width="0.4"/>
  <circle cx="53" cy="27" r="2" fill="#fca5a5" stroke="#374151" stroke-width="0.4"/>

  <!-- Right petal (blue) -->
  <circle cx="62" cy="40" r="3" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
  <circle cx="66" cy="38" r="2.5" fill="#93c5fd" stroke="#374151" stroke-width="0.4"/>
  <circle cx="64" cy="44" r="2.5" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
  <circle cx="68" cy="42" r="2" fill="#93c5fd" stroke="#374151" stroke-width="0.4"/>

  <!-- Bottom right petal (green) -->
  <circle cx="58" cy="52" r="3" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
  <circle cx="62" cy="54" r="2.5" fill="#86efac" stroke="#374151" stroke-width="0.4"/>
  <circle cx="56" cy="56" r="2.5" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>

  <!-- Bottom left petal (red) -->
  <circle cx="44" cy="52" r="3" fill="#fca5a5" stroke="#374151" stroke-width="0.4"/>
  <circle cx="40" cy="54" r="2.5" fill="#ef4444" stroke="#374151" stroke-width="0.4"/>
  <circle cx="46" cy="56" r="2.5" fill="#fca5a5" stroke="#374151" stroke-width="0.4"/>

  <!-- Left petal (blue) -->
  <circle cx="40" cy="40" r="3" fill="#93c5fd" stroke="#374151" stroke-width="0.4"/>
  <circle cx="36" cy="38" r="2.5" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
  <circle cx="38" cy="44" r="2.5" fill="#93c5fd" stroke="#374151" stroke-width="0.4"/>

  <!-- Centre (yellow/natural) -->
  <circle cx="51" cy="42" r="2.5" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
  <circle cx="55" cy="42" r="2.5" fill="#fde68a" stroke="#374151" stroke-width="0.4"/>
  <circle cx="53" cy="46" r="2" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
  <circle cx="53" cy="38" r="2" fill="#fde68a" stroke="#374151" stroke-width="0.4"/>

  <!-- Stem (green shells) -->
  <circle cx="53" cy="60" r="2" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
  <circle cx="53" cy="64" r="2" fill="#86efac" stroke="#374151" stroke-width="0.4"/>
  <circle cx="53" cy="68" r="2" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
  <circle cx="53" cy="72" r="2" fill="#86efac" stroke="#374151" stroke-width="0.4"/>
  <circle cx="53" cy="76" r="2" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>

  <!-- Leaf -->
  <circle cx="48" cy="68" r="2" fill="#86efac" stroke="#374151" stroke-width="0.4"/>
  <circle cx="45" cy="70" r="2" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
  <circle cx="58" cy="72" r="2" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
  <circle cx="61" cy="74" r="2" fill="#86efac" stroke="#374151" stroke-width="0.4"/>

  <!-- PVA glue bottle -->
  <rect x="96" y="40" width="14" height="28" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <rect x="100" y="32" width="6" height="10" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="0.8"/>
  <!-- Glue drop -->
  <circle cx="103" cy="72" r="2" fill="#fef3c7" stroke="#374151" stroke-width="0.5" opacity="0.6"/>

  <!-- Loose shell pieces nearby -->
  <circle cx="98" cy="86" r="2" fill="#ef4444" stroke="#374151" stroke-width="0.4"/>
  <circle cx="104" cy="88" r="2" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
  <circle cx="108" cy="84" r="1.5" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
</svg>