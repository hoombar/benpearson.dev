<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Cup 1 — red dye -->
  <path d="M6,52 Q6,90 20,90 Q34,90 34,52" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="20" cy="52" rx="14" ry="5" fill="#ef4444" stroke="#374151" stroke-width="1"/>
  <!-- Shell pieces visible in dye -->
  <path d="M14,62 Q12,66 15,67 Q18,66 16,62 Z" fill="#fef3c7" stroke="#374151" stroke-width="0.5" opacity="0.7"/>
  <path d="M22,58 Q20,62 23,63 Q26,62 24,58 Z" fill="#fef3c7" stroke="#374151" stroke-width="0.5" opacity="0.7"/>

  <!-- Cup 2 — blue dye -->
  <path d="M40,52 Q40,90 54,90 Q68,90 68,52" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="54" cy="52" rx="14" ry="5" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <!-- Shell pieces -->
  <path d="M48,60 Q46,64 49,65 Q52,64 50,60 Z" fill="#fef3c7" stroke="#374151" stroke-width="0.5" opacity="0.7"/>
  <path d="M56,64 Q54,68 57,69 Q60,68 58,64 Z" fill="#fef3c7" stroke="#374151" stroke-width="0.5" opacity="0.7"/>

  <!-- Cup 3 — green dye -->
  <path d="M74,52 Q74,90 88,90 Q102,90 102,52" fill="#86efac" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="88" cy="52" rx="14" ry="5" fill="#22c55e" stroke="#374151" stroke-width="1"/>
  <!-- Shell pieces -->
  <path d="M82,58 Q80,62 83,63 Q86,62 84,58 Z" fill="#fef3c7" stroke="#374151" stroke-width="0.5" opacity="0.7"/>
  <path d="M92,62 Q90,66 93,67 Q96,66 94,62 Z" fill="#fef3c7" stroke="#374151" stroke-width="0.5" opacity="0.7"/>

  <!-- Food colouring bottle -->
  <rect x="102" y="20" width="10" height="24" rx="2" fill="#ef4444" stroke="#374151" stroke-width="1"/>
  <rect x="104" y="14" width="6" height="8" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>

  <!-- Drops falling into cup -->
  <circle cx="54" cy="40" r="1.5" fill="#3b82f6" stroke="none"/>
  <circle cx="54" cy="34" r="1" fill="#3b82f6" stroke="none"/>

  <!-- Clock symbol (wait 10-15 min) -->
  <circle cx="20" cy="24" r="10" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <line x1="20" y1="24" x2="20" y2="18" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="24" x2="25" y2="24" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <circle cx="20" cy="24" r="1" fill="#374151" stroke="none"/>
</svg>