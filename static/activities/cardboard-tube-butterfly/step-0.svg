<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Cardboard tube being painted purple (hero) -->
  <g transform="translate(30, 14)">
    <rect x="0" y="0" width="28" height="74" rx="2" fill="#a855f7" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="14" cy="2" rx="14" ry="5" fill="#9333ea" stroke="#374151" stroke-width="1.2"/>
    <!-- Unpainted patch -->
    <rect x="0" y="56" width="28" height="18" rx="1" fill="#d4a574" stroke="none" opacity="0.5"/>
  </g>

  <!-- Paintbrush -->
  <g transform="translate(60, 46) rotate(20)">
    <rect x="0" y="-3" width="34" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#a855f7" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pot -->
  <g transform="translate(84, 66)">
    <rect x="0" y="0" width="22" height="24" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
    <rect x="2" y="4" width="18" height="18" rx="1" fill="#a855f7"/>
    <rect x="-1" y="-2" width="24" height="5" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Painting direction arrow -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a855f7"/>
    </marker>
  </defs>
  <path d="M54,66 Q50,74 54,82" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
