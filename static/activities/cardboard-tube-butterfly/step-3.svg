<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Completed butterfly (hero) -->
  <g transform="translate(18, 16)">
    <!-- Left wing -->
    <path d="M38,18 Q2,14 0,38 Q-2,62 16,68 Q30,74 38,66" fill="#f472b6" stroke="#374151" stroke-width="1.2"/>
    <circle cx="18" cy="34" r="6" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <circle cx="14" cy="54" r="4.5" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
    <circle cx="26" cy="44" r="3" fill="#a855f7" stroke="#374151" stroke-width="0.3"/>

    <!-- Right wing -->
    <path d="M52,18 Q88,14 90,38 Q92,62 74,68 Q60,74 52,66" fill="#f472b6" stroke="#374151" stroke-width="1.2"/>
    <circle cx="72" cy="34" r="6" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <circle cx="76" cy="54" r="4.5" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
    <circle cx="64" cy="44" r="3" fill="#a855f7" stroke="#374151" stroke-width="0.3"/>

    <!-- Tube body -->
    <rect x="34" y="0" width="22" height="72" rx="2" fill="#a855f7" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="45" cy="2" rx="11" ry="4" fill="#9333ea" stroke="#374151" stroke-width="1"/>

    <!-- Pipe cleaner antennae -->
    <path d="M42,4 Q36,-8 32,-16" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="-18" r="3" fill="none" stroke="#374151" stroke-width="2"/>
    <path d="M48,4 Q54,-8 58,-16" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <circle cx="58" cy="-18" r="3" fill="none" stroke="#374151" stroke-width="2"/>

    <!-- Googly eyes -->
    <circle cx="40" cy="14" r="5" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="40" cy="15" r="2.5" fill="#374151"/>
    <circle cx="50" cy="14" r="5" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="50" cy="15" r="2.5" fill="#374151"/>

    <!-- Smile -->
    <path d="M40,24 Q45,28 50,24" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Small flower -->
  <g transform="translate(100, 82)">
    <line x1="6" y1="6" x2="6" y2="18" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="6" cy="4" r="4" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <circle cx="6" cy="4" r="1.5" fill="#92400e"/>
  </g>
</svg>
