<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Wings being attached to tube (hero) -->
  <g transform="translate(18, 14)">
    <!-- Wings behind tube -->
    <!-- Left wing -->
    <path d="M38,20 Q4,16 2,38 Q0,60 16,66 Q30,72 38,64" fill="#f472b6" stroke="#374151" stroke-width="1.2"/>
    <circle cx="18" cy="34" r="5" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <circle cx="14" cy="54" r="4" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>

    <!-- Right wing -->
    <path d="M52,20 Q86,16 88,38 Q90,60 74,66 Q60,72 52,64" fill="#f472b6" stroke="#374151" stroke-width="1.2"/>
    <circle cx="72" cy="34" r="5" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <circle cx="76" cy="54" r="4" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>

    <!-- Tube body (on top of wings) -->
    <rect x="34" y="0" width="22" height="70" rx="2" fill="#a855f7" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="45" cy="2" rx="11" ry="4" fill="#9333ea" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Glue bottle -->
  <g transform="translate(90, 44) rotate(15)">
    <rect x="0" y="-5" width="22" height="10" rx="3" fill="white" stroke="#374151" stroke-width="0.8"/>
    <path d="M-2,-3 L-5,0 L-2,3" fill="#f97316" stroke="#374151" stroke-width="0.5"/>
    <rect x="6" y="-3" width="10" height="6" rx="1" fill="#f97316" opacity="0.6"/>
  </g>

  <!-- Arrow showing attachment -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M92,54 Q82,58 72,56" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
