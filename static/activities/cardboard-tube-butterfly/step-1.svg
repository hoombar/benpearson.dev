<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Folded paper with wing being cut (left) -->
  <g transform="translate(6, 12)">
    <!-- Folded paper -->
    <rect x="0" y="0" width="36" height="50" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
    <!-- Fold line -->
    <line x1="0" y1="0" x2="0" y2="50" stroke="#374151" stroke-width="1" stroke-dasharray="3,2"/>
    <!-- Wing shape being cut -->
    <path d="M0,6 Q30,4 34,16 Q38,28 28,36 Q18,44 0,44" fill="none" stroke="#374151" stroke-width="1.2" stroke-dasharray="3,2"/>
  </g>

  <!-- Arrow showing unfold -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="46" y1="36" x2="54" y2="36" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Unfolded wings with decorations (right, hero) -->
  <g transform="translate(60, 8)">
    <!-- Left wing -->
    <path d="M26,6 Q-4,4 0,20 Q-4,36 10,42 Q20,48 26,44" fill="#f472b6" stroke="#374151" stroke-width="1.2"/>
    <!-- Right wing -->
    <path d="M26,6 Q56,4 52,20 Q56,36 42,42 Q32,48 26,44" fill="#f472b6" stroke="#374151" stroke-width="1.2"/>
    <!-- Fold centre line -->
    <line x1="26" y1="6" x2="26" y2="44" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2"/>

    <!-- Decorations on wings -->
    <!-- Left wing spots -->
    <circle cx="14" cy="18" r="4" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <circle cx="12" cy="34" r="3" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
    <!-- Right wing spots (mirror) -->
    <circle cx="38" cy="18" r="4" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <circle cx="40" cy="34" r="3" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Markers decorating -->
  <g transform="translate(96, 56)">
    <rect x="0" y="0" width="6" height="22" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="0" width="6" height="4" rx="1" fill="#ca8a04" stroke="#374151" stroke-width="0.4"/>
  </g>
  <g transform="translate(106, 58)">
    <rect x="0" y="0" width="6" height="20" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="0" width="6" height="4" rx="1" fill="#1d4ed8" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Scissors -->
  <g transform="translate(6, 68)">
    <path d="M0,0 L12,3" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L12,-3" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1" fill="#374151"/>
    <ellipse cx="15" cy="4" rx="3.5" ry="2.5" fill="none" stroke="#ef4444" stroke-width="1"/>
    <ellipse cx="15" cy="-4" rx="3.5" ry="2.5" fill="none" stroke="#ef4444" stroke-width="1"/>
  </g>
</svg>
