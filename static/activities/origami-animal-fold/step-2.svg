<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="120" fill="#f9fafb"/>

  <!-- STEP: shape into animal — showing the paper mid-fold emerging into a bird/crane -->

  <!-- Marker defs — auto-align all arrowheads to path direction -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#3b82f6" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Diamond/kite base (current state of paper) -->
  <path d="M60 10 L104 60 L60 110 L16 60 Z" fill="#f97316" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Centre vertical crease -->
  <line x1="60" y1="10" x2="60" y2="110" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,4" stroke-linecap="round"/>
  <!-- Centre horizontal crease -->
  <line x1="16" y1="60" x2="104" y2="60" stroke="#374151" stroke-width="1.2" stroke-dasharray="4,3" stroke-linecap="round"/>

  <!-- LEFT narrow flap being folded in to centre -->
  <path d="M16 60 L60 10 L60 110 Z" fill="#fdba74" stroke="#374151" stroke-width="1.8" stroke-linejoin="round" opacity="0.85"/>
  <!-- Fold lines: left edge towards centre crease -->
  <line x1="16" y1="60" x2="60" y2="36" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" stroke-linecap="round"/>
  <line x1="16" y1="60" x2="60" y2="84" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" stroke-linecap="round"/>

  <!-- Arrow: left point folding inward — tangent at (50,38) = (50−34,38−46) = (16,−8) = right-up -->
  <path d="M26 60 Q34 46 50 38" stroke="#3b82f6" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#arr-blue)"/>

  <!-- RIGHT narrow flap being folded in (mirror) -->
  <path d="M104 60 L60 10 L60 110 Z" fill="#fdba74" stroke="#374151" stroke-width="1.8" stroke-linejoin="round" opacity="0.85"/>
  <line x1="104" y1="60" x2="60" y2="36" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" stroke-linecap="round"/>
  <line x1="104" y1="60" x2="60" y2="84" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" stroke-linecap="round"/>
  <!-- Mirror arrow: right point folding inward — tangent at (70,38) = (70−86,38−46) = (−16,−8) = left-up -->
  <path d="M94 60 Q86 46 70 38" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Thumbnail crease pressing at fold line -->
  <circle cx="60" cy="36" r="4" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <!-- Pressing down arrow — marker-end at bottom (60,34) points downward -->
  <path d="M60 28 L60 34" stroke="#374151" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Small result inset (top-right): bird head/neck starting to emerge -->
  <rect x="84" y="6" width="32" height="32" rx="1" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/>
  <!-- Simplified crane silhouette emerging -->
  <path d="M100 34 L100 22 L90 16 L110 16" fill="#f97316" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M100 22 L92 28" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M100 22 L108 28" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="84" y1="32" x2="116" y2="32" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Arrow to inset — nearly horizontal short arc, hand-placed V fine -->
  <path d="M78 22 Q82 22 83 22" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M80 19 L84 22 L80 25" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step counter indicator -->
  <circle cx="12" cy="108" r="7" fill="#f97316" stroke="#374151" stroke-width="1.5"/>
</svg>
