<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="120" fill="#f9fafb"/>

  <!-- Stack of plain squares (back sheets, offset) -->
  <rect x="34" y="24" width="60" height="60" rx="1" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <rect x="30" y="20" width="60" height="60" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>

  <!-- Front square (hero, vivid orange — origami paper coloured side) -->
  <rect x="26" y="16" width="60" height="60" rx="1" fill="#f97316" stroke="#374151" stroke-width="2.5"/>

  <!-- Diagonal half — showing colour being applied to one side -->
  <!-- Colour-pencil shading mark (lighter orange tint showing the coloured half) -->
  <path d="M26 76 L86 16 L86 76 Z" fill="#fdba74" stroke="#374151" stroke-width="1" stroke-linejoin="round" opacity="0.6"/>
  <!-- Colour stroke lines (suggesting pencil strokes applied) -->
  <line x1="62" y1="19" x2="84" y2="41" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <line x1="70" y1="19" x2="84" y2="33" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <line x1="78" y1="19" x2="84" y2="25" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.8"/>

  <!-- Colouring pencil held in hand -->
  <g transform="rotate(-35 100 10)">
    <!-- Pencil body -->
    <rect x="93" y="4" width="6" height="26" rx="1.5" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
    <!-- Pencil band -->
    <rect x="93" y="4" width="6" height="4" fill="#f59e0b" stroke="#374151" stroke-width="1"/>
    <!-- Eraser -->
    <rect x="93" y="2" width="6" height="3" rx="1" fill="#fca5a5" stroke="#374151" stroke-width="1"/>
    <!-- Pencil tip -->
    <path d="M93 30 L96 38 L99 30 Z" fill="#f97316" stroke="#374151" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Graphite point -->
    <path d="M94.5 35 L96 38 L97.5 35 Z" fill="#374151"/>
  </g>

  <!-- Two more pencils (different colours for choice) -->
  <g transform="rotate(-20 108 18)">
    <rect x="105" y="10" width="5" height="22" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>
    <path d="M105 32 L107.5 38 L110 32 Z" fill="#1d4ed8" stroke="#374151" stroke-width="1" stroke-linejoin="round"/>
    <rect x="105" y="8" width="5" height="3" rx="0.5" fill="#fca5a5" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g transform="rotate(-50 88 12)">
    <rect x="85" y="6" width="5" height="20" rx="1" fill="#22c55e" stroke="#374151" stroke-width="1.2"/>
    <path d="M85 26 L87.5 32 L90 26 Z" fill="#15803d" stroke="#374151" stroke-width="1" stroke-linejoin="round"/>
  </g>

  <!-- Square edge label (perfect square indicator, 90-degree corner mark) -->
  <rect x="26" y="16" width="8" height="8" fill="none" stroke="#374151" stroke-width="1.2"/>
  <!-- Corner square mark -->
  <path d="M26 24 L26 28 L30 28" stroke="#374151" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Scissors (top-left — cut to square) -->
  <g transform="translate(8,8)">
    <!-- Blade 1 -->
    <path d="M4 2 Q10 8 6 14" stroke="#374151" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Blade 2 -->
    <path d="M12 2 Q6 8 10 14" stroke="#374151" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Pivot -->
    <circle cx="8" cy="9" r="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
    <!-- Handles -->
    <ellipse cx="3" cy="15" rx="3" ry="2" fill="#dbeafe" stroke="#374151" stroke-width="1.2" transform="rotate(-20 3 15)"/>
    <ellipse cx="13" cy="15" rx="3" ry="2" fill="#dbeafe" stroke="#374151" stroke-width="1.2" transform="rotate(20 13 15)"/>
  </g>
</svg>
