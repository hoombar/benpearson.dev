<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="4" y="102" width="112" height="8" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <!-- Potato half (cut side up) — outer skin -->
  <path d="M20 90 Q18 112 60 114 Q102 112 100 90" fill="#fde68a" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Flat cut surface (ellipse on top) -->
  <ellipse cx="60" cy="88" rx="40" ry="12" fill="#fef9c3" stroke="#374151" stroke-width="2"/>
  <!-- Potato skin texture marks -->
  <path d="M28 96 Q34 100 38 98" stroke="#d97706" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M80 94 Q86 98 90 96" stroke="#d97706" stroke-width="1" fill="none" stroke-linecap="round"/>
  <circle cx="48" cy="105" r="2" fill="#d97706" stroke="none"/>
  <!-- Heart shape carved into surface -->
  <path d="M53 86 Q53 80 60 80 Q67 80 67 86 Q67 92 60 97 Q53 92 53 86 Z"
        fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>
  <!-- Kitchen knife (pointing downward toward potato) -->
  <!-- Blade -->
  <path d="M76 14 L86 14 L90 72 L76 72 Z" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
  <!-- Blade edge highlight -->
  <line x1="86" y1="14" x2="90" y2="72" stroke="#9ca3af" stroke-width="1"/>
  <!-- Handle -->
  <rect x="73" y="6" width="17" height="12" rx="3" fill="#6b7280" stroke="#374151" stroke-width="2"/>
  <!-- Warning circle (⚠ adult needed) -->
  <circle cx="14" cy="16" r="10" fill="#fef08a" stroke="#374151" stroke-width="2"/>
  <line x1="14" y1="11" x2="14" y2="19" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <circle cx="14" cy="22" r="1.5" fill="#374151"/>
  <!-- Arrow showing knife pressing down -->
  <line x1="96" y1="22" x2="96" y2="68" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M93 65 L96 71 L99 65" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
