<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="4" y="104" width="112" height="8" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <!-- Shallow paint dish/plate (overhead view) — large circle -->
  <circle cx="52" cy="72" r="36" fill="#fca5a5" stroke="#374151" stroke-width="2.5"/>
  <!-- Rim of plate -->
  <circle cx="52" cy="72" r="30" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <!-- Paint puddle in centre -->
  <ellipse cx="52" cy="72" rx="22" ry="18" fill="#dc2626" stroke="none"/>
  <!-- Paintbrush spreading paint -->
  <!-- Brush shaft -->
  <rect x="72" y="30" width="6" height="48" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="2" transform="rotate(30 75 54)"/>
  <!-- Brush head/bristles -->
  <path d="M86 72 Q90 78 88 85 Q84 82 80 85 Q78 79 82 73 Z" fill="#d97706" stroke="#374151" stroke-width="1.5"/>
  <!-- Spreading arc (motion of brush) -->
  <path d="M68 58 Q80 68 72 80" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2" fill="none" stroke-linecap="round"/>
  <!-- Paint splats to show spreading action -->
  <circle cx="44" cy="62" r="4" fill="#b91c1c" stroke="none"/>
  <circle cx="62" cy="58" r="3" fill="#b91c1c" stroke="none"/>
  <circle cx="38" cy="78" r="3" fill="#b91c1c" stroke="none"/>
</svg>
