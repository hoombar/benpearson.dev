<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper sheet with strip being cut (hero) -->
  <g transform="translate(10, 20)">
    <!-- Paper sheet -->
    <rect x="0" y="0" width="60" height="50" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
    <!-- Cut line for strip -->
    <rect x="0" y="0" width="60" height="10" rx="0.5" fill="#dbeafe" stroke="#374151" stroke-width="0.8" stroke-dasharray="3,2"/>
  </g>

  <!-- Already-cut paper strip being folded -->
  <g transform="translate(10, 78)">
    <!-- Strip -->
    <rect x="0" y="0" width="60" height="10" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
    <!-- Fold crease line -->
    <line x1="0" y1="5" x2="60" y2="5" stroke="#374151" stroke-width="0.5" stroke-dasharray="3,2"/>
  </g>

  <!-- Fold arrow -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M40,92 Q40,96 40,88" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Popsicle stick for size reference -->
  <g transform="translate(78, 22)">
    <rect x="0" y="0" width="12" height="60" rx="4" fill="#fde68a" stroke="#374151" stroke-width="1"/>
    <!-- Wood grain -->
    <line x1="4" y1="8" x2="4" y2="52" stroke="#eab308" stroke-width="0.3" opacity="0.5"/>
    <line x1="8" y1="8" x2="8" y2="52" stroke="#eab308" stroke-width="0.3" opacity="0.5"/>
  </g>

  <!-- Scissors -->
  <g transform="translate(72, 14) rotate(10)">
    <path d="M0,0 L14,4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L14,-4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.2" fill="#374151"/>
    <ellipse cx="18" cy="5" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <ellipse cx="18" cy="-5" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  </g>
</svg>
