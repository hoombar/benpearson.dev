<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Child blowing harmonica (hero) -->
  <g transform="translate(4, 12)">
    <!-- Head -->
    <ellipse cx="36" cy="40" rx="28" ry="34" fill="#fcd9b6" stroke="#374151" stroke-width="1.2"/>

    <!-- Hair -->
    <path d="M10,32 Q12,12 26,8 Q36,4 46,8 Q60,12 62,32" fill="#374151" stroke="#374151" stroke-width="0.8"/>

    <!-- Eyes (closed, concentrating) -->
    <path d="M24,36 Q28,34 32,36" fill="none" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M40,36 Q44,34 48,36" fill="none" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Cheeks puffed (blowing) -->
    <circle cx="20" cy="48" r="6" fill="#fda4af" opacity="0.4"/>
    <circle cx="52" cy="48" r="6" fill="#fda4af" opacity="0.4"/>

    <!-- Mouth (pursed, blowing) -->
    <ellipse cx="36" cy="52" rx="4" ry="3" fill="#fda4af" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Harmonica at mouth level -->
  <g transform="translate(42, 52)">
    <!-- Bottom stick -->
    <rect x="0" y="10" width="68" height="8" rx="3" fill="#fde68a" stroke="#374151" stroke-width="1"/>
    <!-- Paper -->
    <rect x="0" y="8" width="68" height="4" rx="0.5" fill="white" stroke="#374151" stroke-width="0.3"/>
    <!-- Top stick -->
    <rect x="0" y="0" width="68" height="8" rx="3" fill="#fde68a" stroke="#374151" stroke-width="1"/>
    <!-- Rubber bands -->
    <ellipse cx="6" cy="9" rx="5" ry="12" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.8"/>
    <ellipse cx="62" cy="9" rx="5" ry="12" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Sound waves emanating -->
  <path d="M112,56 Q116,52 112,48" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <path d="M114,60 Q120,54 114,44" fill="none" stroke="#374151" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>

  <!-- Musical notes -->
  <g transform="translate(102, 28)">
    <circle cx="0" cy="0" r="2.5" fill="#374151"/>
    <line x1="2.5" y1="0" x2="2.5" y2="-12" stroke="#374151" stroke-width="1"/>
    <path d="M2.5,-12 Q8,-14 8,-10" fill="none" stroke="#374151" stroke-width="1"/>
  </g>
  <g transform="translate(108, 18)">
    <circle cx="0" cy="0" r="2" fill="#374151"/>
    <line x1="2" y1="0" x2="2" y2="-10" stroke="#374151" stroke-width="0.8"/>
    <path d="M2,-10 Q6,-12 6,-8" fill="none" stroke="#374151" stroke-width="0.8"/>
  </g>
</svg>
