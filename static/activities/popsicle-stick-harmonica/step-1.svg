<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Exploded view of sandwich assembly (hero) -->
  <!-- Bottom stick -->
  <g transform="translate(16, 62)">
    <rect x="0" y="0" width="80" height="10" rx="4" fill="#fde68a" stroke="#374151" stroke-width="1.2"/>
    <line x1="20" y1="2" x2="20" y2="8" stroke="#eab308" stroke-width="0.3" opacity="0.5"/>
    <line x1="40" y1="2" x2="40" y2="8" stroke="#eab308" stroke-width="0.3" opacity="0.5"/>
    <line x1="60" y1="2" x2="60" y2="8" stroke="#eab308" stroke-width="0.3" opacity="0.5"/>
  </g>

  <!-- Paper strip in middle -->
  <g transform="translate(16, 46)">
    <rect x="0" y="0" width="80" height="8" rx="1" fill="white" stroke="#374151" stroke-width="0.8"/>
    <line x1="0" y1="4" x2="80" y2="4" stroke="#374151" stroke-width="0.3" stroke-dasharray="3,2"/>
  </g>

  <!-- Top stick -->
  <g transform="translate(16, 28)">
    <rect x="0" y="0" width="80" height="10" rx="4" fill="#fde68a" stroke="#374151" stroke-width="1.2"/>
    <line x1="20" y1="2" x2="20" y2="8" stroke="#eab308" stroke-width="0.3" opacity="0.5"/>
    <line x1="40" y1="2" x2="40" y2="8" stroke="#eab308" stroke-width="0.3" opacity="0.5"/>
    <line x1="60" y1="2" x2="60" y2="8" stroke="#eab308" stroke-width="0.3" opacity="0.5"/>
  </g>

  <!-- Arrows showing assembly -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <!-- Top stick going down -->
  <line x1="56" y1="22" x2="56" y2="28" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
  <!-- Bottom stick going up -->
  <line x1="56" y1="78" x2="56" y2="72" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Assembled preview (small, side view) -->
  <g transform="translate(14, 86)">
    <rect x="0" y="0" width="80" height="4" rx="2" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="4" width="80" height="2" rx="0.5" fill="white" stroke="#374151" stroke-width="0.3"/>
    <rect x="0" y="6" width="80" height="4" rx="2" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>
  </g>
</svg>
