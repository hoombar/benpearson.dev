<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Glass jar vase with flowers (hero) -->
  <g transform="translate(28, 42)">
    <!-- Jar -->
    <rect x="0" y="8" width="40" height="46" rx="3" fill="#dbeafe" stroke="#374151" stroke-width="1.2" opacity="0.5"/>
    <!-- Jar rim -->
    <rect x="-2" y="4" width="44" height="6" rx="2" fill="#e0f2fe" stroke="#374151" stroke-width="1"/>
    <!-- Jar bottom -->
    <rect x="2" y="50" width="36" height="4" rx="2" fill="#bfdbfe" stroke="none" opacity="0.5"/>
  </g>

  <!-- Flower 1 (pink) -->
  <g transform="translate(34, 4)">
    <!-- Stem -->
    <line x1="10" y1="24" x2="10" y2="60" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <!-- Leaf -->
    <ellipse cx="16" cy="44" rx="6" ry="3" fill="#22c55e" stroke="#374151" stroke-width="0.5" transform="rotate(20, 16, 44)"/>
    <!-- Flower head -->
    <circle cx="10" cy="16" r="4" fill="#eab308" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="10" cy="4" rx="4" ry="8" fill="#f472b6" stroke="#374151" stroke-width="0.5"/>
    <ellipse cx="0" cy="14" rx="8" ry="4" fill="#f472b6" stroke="#374151" stroke-width="0.5"/>
    <ellipse cx="20" cy="14" rx="8" ry="4" fill="#f472b6" stroke="#374151" stroke-width="0.5"/>
    <ellipse cx="10" cy="26" rx="4" ry="6" fill="#f472b6" stroke="#374151" stroke-width="0.5"/>
    <ellipse cx="3" cy="6" rx="4" ry="7" fill="#ec4899" stroke="#374151" stroke-width="0.5" transform="rotate(-40, 3, 6)"/>
    <ellipse cx="17" cy="6" rx="4" ry="7" fill="#ec4899" stroke="#374151" stroke-width="0.5" transform="rotate(40, 17, 6)"/>
  </g>

  <!-- Flower 2 (yellow/orange) -->
  <g transform="translate(56, 8)">
    <line x1="8" y1="22" x2="8" y2="56" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="14" cy="38" rx="5" ry="2.5" fill="#22c55e" stroke="#374151" stroke-width="0.5" transform="rotate(25, 14, 38)"/>
    <circle cx="8" cy="14" r="4" fill="#92400e" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="8" cy="4" rx="3.5" ry="7" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
    <ellipse cx="0" cy="12" rx="7" ry="3.5" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
    <ellipse cx="16" cy="12" rx="7" ry="3.5" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
    <ellipse cx="8" cy="22" rx="3.5" ry="5" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Flower 3 (purple, shorter) -->
  <g transform="translate(14, 16)">
    <line x1="8" y1="22" x2="10" y2="48" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="4" cy="36" rx="5" ry="2.5" fill="#22c55e" stroke="#374151" stroke-width="0.5" transform="rotate(-20, 4, 36)"/>
    <circle cx="8" cy="14" r="3.5" fill="#eab308" stroke="#374151" stroke-width="0.5"/>
    <ellipse cx="8" cy="4" rx="3.5" ry="7" fill="#a855f7" stroke="#374151" stroke-width="0.5"/>
    <ellipse cx="0" cy="12" rx="7" ry="3.5" fill="#a855f7" stroke="#374151" stroke-width="0.5"/>
    <ellipse cx="16" cy="12" rx="7" ry="3.5" fill="#a855f7" stroke="#374151" stroke-width="0.5"/>
    <ellipse cx="8" cy="22" rx="3.5" ry="5" fill="#a855f7" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Gift tag -->
  <g transform="translate(82, 72)">
    <rect x="0" y="0" width="22" height="16" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="0.6"/>
    <circle cx="18" cy="4" r="1.5" fill="none" stroke="#374151" stroke-width="0.4"/>
    <line x1="4" y1="7" x2="16" y2="7" stroke="#374151" stroke-width="0.3"/>
    <line x1="4" y1="10" x2="12" y2="10" stroke="#374151" stroke-width="0.3"/>
  </g>
</svg>
