<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Flattened cup flower being painted (hero) -->
  <g transform="translate(16, 16)">
    <!-- Centre (cup base) -->
    <circle cx="40" cy="40" r="8" fill="#eab308" stroke="#374151" stroke-width="1"/>

    <!-- Petals radiating outward -->
    <ellipse cx="40" cy="8" rx="6" ry="16" fill="#f472b6" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="40" cy="72" rx="6" ry="16" fill="#f472b6" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="8" cy="40" rx="16" ry="6" fill="#f472b6" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="72" cy="40" rx="16" ry="6" fill="#f472b6" stroke="#374151" stroke-width="0.8"/>

    <!-- Diagonal petals -->
    <ellipse cx="18" cy="18" rx="6" ry="14" fill="#ec4899" stroke="#374151" stroke-width="0.8" transform="rotate(-45, 18, 18)"/>
    <ellipse cx="62" cy="18" rx="6" ry="14" fill="#ec4899" stroke="#374151" stroke-width="0.8" transform="rotate(45, 62, 18)"/>
    <ellipse cx="18" cy="62" rx="6" ry="14" fill="#ec4899" stroke="#374151" stroke-width="0.8" transform="rotate(45, 18, 62)"/>
    <ellipse cx="62" cy="62" rx="6" ry="14" fill="#ec4899" stroke="#374151" stroke-width="0.8" transform="rotate(-45, 62, 62)"/>
  </g>

  <!-- Paintbrush painting a petal -->
  <g transform="translate(72, 14) rotate(30)">
    <rect x="0" y="-3" width="30" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#f472b6" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pots -->
  <g transform="translate(90, 64)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
    <rect x="2" y="3" width="12" height="11" rx="1" fill="#f472b6"/>
  </g>
  <g transform="translate(90, 82)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
    <rect x="2" y="3" width="12" height="11" rx="1" fill="#eab308"/>
  </g>
</svg>
