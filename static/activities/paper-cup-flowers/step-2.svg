<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Side view: flower with straw being inserted (hero) -->
  <g transform="translate(24, 10)">
    <!-- Flower head (side view — petals fanning out) -->
    <path d="M30,20 Q10,10 -2,22" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
    <path d="M30,20 Q18,4 6,12" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <path d="M30,20 Q32,2 26,6" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
    <path d="M30,20 Q44,4 50,14" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <path d="M30,20 Q52,10 62,22" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>

    <!-- Cup base (centre) -->
    <circle cx="30" cy="22" r="6" fill="#eab308" stroke="#374151" stroke-width="1"/>

    <!-- Straw being pushed through -->
    <line x1="30" y1="28" x2="30" y2="84" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Hand pushing straw -->
  <g transform="translate(48, 72)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="16" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrow showing insertion direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="54" y1="42" x2="54" y2="32" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Tape for securing -->
  <g transform="translate(80, 30)">
    <ellipse cx="10" cy="10" rx="10" ry="10" fill="#d1fae5" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="10" cy="10" rx="4" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Extra straws -->
  <line x1="86" y1="60" x2="86" y2="92" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <line x1="92" y1="62" x2="92" y2="94" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
</svg>
