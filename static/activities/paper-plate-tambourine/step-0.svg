<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate (face-up, hero) -->
  <ellipse cx="52" cy="56" rx="38" ry="16" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="52" cy="56" rx="32" ry="13" fill="none" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Rice grains scattered on plate -->
  <ellipse cx="44" cy="54" rx="1.5" ry="0.8" fill="#fef3c7" stroke="#374151" stroke-width="0.4" transform="rotate(20 44 54)"/>
  <ellipse cx="50" cy="52" rx="1.5" ry="0.8" fill="#fef3c7" stroke="#374151" stroke-width="0.4" transform="rotate(-10 50 52)"/>
  <ellipse cx="56" cy="55" rx="1.5" ry="0.8" fill="#fef3c7" stroke="#374151" stroke-width="0.4" transform="rotate(35 56 55)"/>
  <ellipse cx="48" cy="58" rx="1.5" ry="0.8" fill="#fef3c7" stroke="#374151" stroke-width="0.4" transform="rotate(-25 48 58)"/>
  <ellipse cx="54" cy="50" rx="1.5" ry="0.8" fill="#fef3c7" stroke="#374151" stroke-width="0.4" transform="rotate(15 54 50)"/>
  <ellipse cx="60" cy="56" rx="1.5" ry="0.8" fill="#fef3c7" stroke="#374151" stroke-width="0.4" transform="rotate(-5 60 56)"/>
  <ellipse cx="46" cy="50" rx="1.5" ry="0.8" fill="#fef3c7" stroke="#374151" stroke-width="0.4" transform="rotate(30 46 50)"/>
  <ellipse cx="52" cy="58" rx="1.5" ry="0.8" fill="#fef3c7" stroke="#374151" stroke-width="0.4"/>

  <!-- Rice pouring from cup -->
  <g transform="translate(76, 10)">
    <!-- Cup tilted -->
    <rect x="0" y="0" width="16" height="24" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1" transform="rotate(30 8 12)"/>
  </g>

  <!-- Rice falling stream -->
  <ellipse cx="72" cy="36" rx="1.5" ry="0.8" fill="#fef3c7" stroke="#374151" stroke-width="0.3" transform="rotate(45 72 36)"/>
  <ellipse cx="68" cy="40" rx="1.5" ry="0.8" fill="#fef3c7" stroke="#374151" stroke-width="0.3" transform="rotate(-20 68 40)"/>
  <ellipse cx="70" cy="44" rx="1.5" ry="0.8" fill="#fef3c7" stroke="#374151" stroke-width="0.3" transform="rotate(10 70 44)"/>
  <ellipse cx="66" cy="48" rx="1.5" ry="0.8" fill="#fef3c7" stroke="#374151" stroke-width="0.3" transform="rotate(30 66 48)"/>

  <!-- Rice bag -->
  <g transform="translate(4, 8)">
    <rect x="0" y="0" width="22" height="30" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1"/>
    <!-- Rice visible through bag -->
    <ellipse cx="8" cy="20" rx="1" ry="0.6" fill="#374151" stroke="none" opacity="0.3"/>
    <ellipse cx="12" cy="18" rx="1" ry="0.6" fill="#374151" stroke="none" opacity="0.3"/>
    <ellipse cx="14" cy="22" rx="1" ry="0.6" fill="#374151" stroke="none" opacity="0.3"/>
    <ellipse cx="10" cy="24" rx="1" ry="0.6" fill="#374151" stroke="none" opacity="0.3"/>
  </g>
</svg>
