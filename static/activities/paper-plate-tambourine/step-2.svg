<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Tambourine being decorated (top-down view) -->
  <circle cx="52" cy="48" r="38" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>

  <!-- Tape visible around edge -->
  <circle cx="52" cy="48" r="36" fill="none" stroke="#fde68a" stroke-width="3" stroke-dasharray="12,6"/>

  <!-- Decorations drawn on tambourine -->
  <!-- Star -->
  <path d="M52,18 L55,28 L65,28 L57,34 L60,44 L52,38 L44,44 L47,34 L39,28 L49,28 Z" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>

  <!-- Swirls -->
  <path d="M28,40 Q24,34 30,32 Q36,30 34,36 Q32,42 26,40" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M72,36 Q68,30 74,28 Q80,26 78,32 Q76,38 70,36" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Music notes -->
  <circle cx="38" cy="60" r="2.5" fill="#374151" stroke="none"/>
  <line x1="40.5" y1="60" x2="40.5" y2="50" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <path d="M40.5,50 Q44,48 44,52" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <circle cx="62" cy="62" r="2.5" fill="#374151" stroke="none"/>
  <line x1="64.5" y1="62" x2="64.5" y2="52" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <path d="M64.5,52 Q68,50 68,54" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Zigzag border -->
  <path d="M26,68 L30,64 L34,68 L38,64 L42,68 L46,64 L50,68 L54,64 L58,68 L62,64 L66,68 L70,64 L74,68" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Marker in use -->
  <g transform="translate(74, 48) rotate(-30)">
    <rect x="0" y="0" width="5" height="26" rx="1.5" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <rect x="0.5" y="26" width="4" height="3" rx="1" fill="#374151" stroke="none"/>
  </g>
</svg>
