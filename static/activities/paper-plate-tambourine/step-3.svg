<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="120" height="120" fill="#f3f4f6" stroke="none"/>

  <!-- Hand holding tambourine and shaking it -->
  <!-- Hand -->
  <g transform="translate(14, 50)">
    <rect x="0" y="4" width="10" height="22" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="1"/>
    <rect x="12" y="0" width="9" height="18" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="1"/>
    <rect x="6" y="20" width="12" height="14" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Tambourine at angle (shaking) -->
  <g transform="translate(36, 20) rotate(15)">
    <ellipse cx="28" cy="28" rx="28" ry="26" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <!-- Tape edge -->
    <ellipse cx="28" cy="28" rx="26" ry="24" fill="none" stroke="#fde68a" stroke-width="2.5" stroke-dasharray="8,4"/>
    <!-- Star decoration -->
    <path d="M28,12 L30,20 L38,20 L32,24 L34,32 L28,28 L22,32 L24,24 L18,20 L26,20 Z" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <!-- Music note -->
    <circle cx="20" cy="38" r="2" fill="#374151"/>
    <line x1="22" y1="38" x2="22" y2="30" stroke="#374151" stroke-width="0.8"/>
    <circle cx="36" cy="40" r="2" fill="#374151"/>
    <line x1="38" y1="40" x2="38" y2="32" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Motion/shake lines -->
  <line x1="88" y1="24" x2="96" y2="20" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="90" y1="32" x2="98" y2="32" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="88" y1="40" x2="96" y2="44" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Sound waves -->
  <path d="M98,24 Q104,32 98,40" fill="none" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M104,20 Q112,32 104,44" fill="none" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Rice grains bouncing inside (visible through imagination) -->
  <!-- Musical notes floating -->
  <g fill="#374151" opacity="0.5">
    <circle cx="78" cy="68" r="2"/>
    <line x1="80" y1="68" x2="80" y2="60" stroke="#374151" stroke-width="0.8"/>
    <path d="M80,60 Q84,58 84,62" fill="none" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g fill="#374151" opacity="0.4">
    <circle cx="92" cy="74" r="1.5"/>
    <line x1="93.5" y1="74" x2="93.5" y2="68" stroke="#374151" stroke-width="0.6"/>
    <path d="M93.5,68 Q96,66 96,70" fill="none" stroke="#374151" stroke-width="0.6"/>
  </g>
  <g fill="#374151" opacity="0.3">
    <circle cx="84" cy="82" r="1.5"/>
    <line x1="85.5" y1="82" x2="85.5" y2="76" stroke="#374151" stroke-width="0.6"/>
  </g>
</svg>
