<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Sword with blade taped -->
  <line x1="8" y1="54" x2="104" y2="54" stroke="#d1fae5" stroke-width="8" stroke-linecap="round"/>
  <line x1="8" y1="54" x2="104" y2="54" stroke="#374151" stroke-width="0.8"/>
  <polygon points="104,50 112,54 104,58" fill="#d1fae5" stroke="#374151" stroke-width="0.6"/>

  <!-- Cardboard hand guard (hero) -->
  <rect x="28" y="40" width="20" height="28" rx="2" fill="#d4a574" stroke="#374151" stroke-width="1.2"/>
  <!-- Centre hole where tube passes through -->
  <circle cx="38" cy="54" r="4" fill="#fef3c7" stroke="#374151" stroke-width="0.6"/>

  <!-- Tape securing guard to tube -->
  <rect x="26" y="52" width="4" height="4" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3"/>
  <rect x="46" y="52" width="4" height="4" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3"/>

  <!-- Cardboard being cut -->
  <g transform="translate(66, 14)">
    <rect x="0" y="0" width="30" height="20" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
    <!-- Cut line -->
    <rect x="5" y="2" width="20" height="16" rx="1" fill="none" stroke="#ef4444" stroke-width="0.6" stroke-dasharray="2,2"/>
  </g>

  <!-- Arrow showing slide onto tube -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="76" y1="38" x2="52" y2="48" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Scissors -->
  <g transform="translate(98, 8)">
    <path d="M0,0 L10,3" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L10,-3" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1" fill="#374151"/>
    <ellipse cx="13" cy="4" rx="3.5" ry="2.5" fill="none" stroke="#ef4444" stroke-width="0.8"/>
    <ellipse cx="13" cy="-4" rx="3.5" ry="2.5" fill="none" stroke="#ef4444" stroke-width="0.8"/>
  </g>
</svg>
