<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Newspaper sheets flat -->
  <rect x="6" y="14" width="70" height="50" rx="1" fill="#f5f5f4" stroke="#374151" stroke-width="0.8"/>
  <line x1="10" y1="22" x2="72" y2="22" stroke="#d1d5db" stroke-width="0.4"/>
  <line x1="10" y1="30" x2="72" y2="30" stroke="#d1d5db" stroke-width="0.4"/>
  <line x1="10" y1="38" x2="72" y2="38" stroke="#d1d5db" stroke-width="0.4"/>
  <line x1="10" y1="46" x2="72" y2="46" stroke="#d1d5db" stroke-width="0.4"/>
  <line x1="10" y1="54" x2="72" y2="54" stroke="#d1d5db" stroke-width="0.4"/>

  <!-- Diagonal rolling arrow -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M12,60 Q24,48 36,36" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>

  <!-- Partially rolled corner showing the technique -->
  <path d="M6,64 Q10,58 18,54" fill="none" stroke="#e5e7eb" stroke-width="6" stroke-linecap="round"/>

  <!-- Finished rolled tube example -->
  <line x1="10" y1="82" x2="108" y2="82" stroke="#e5e7eb" stroke-width="6" stroke-linecap="round"/>
  <line x1="10" y1="82" x2="108" y2="82" stroke="#374151" stroke-width="0.8"/>

  <!-- Tape strips on tube -->
  <rect x="30" y="79" width="10" height="6" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3"/>
  <rect x="56" y="79" width="10" height="6" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3"/>
  <rect x="82" y="79" width="10" height="6" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3"/>

  <!-- Hands rolling -->
  <g transform="translate(18, 68)">
    <rect x="0" y="0" width="10" height="16" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.6"/>
  </g>
</svg>
