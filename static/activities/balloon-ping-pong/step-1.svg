<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Chair left -->
  <rect x="8" y="52" width="18" height="28" rx="2" stroke="#374151" stroke-width="2" fill="#e5e7eb"/>
  <rect x="8" y="44" width="18" height="10" rx="2" stroke="#374151" stroke-width="1.5" fill="#d1d5db"/>
  <line x1="11" y1="80" x2="11" y2="96" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="80" x2="22" y2="96" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Chair right -->
  <rect x="94" y="52" width="18" height="28" rx="2" stroke="#374151" stroke-width="2" fill="#e5e7eb"/>
  <rect x="94" y="44" width="18" height="10" rx="2" stroke="#374151" stroke-width="1.5" fill="#d1d5db"/>
  <line x1="97" y1="80" x2="97" y2="96" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="80" x2="108" y2="96" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- String (net) tied between chairs at waist height -->
  <line x1="26" y1="48" x2="94" y2="48" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <!-- Knots at each end -->
  <circle cx="26" cy="48" r="3" fill="#374151"/>
  <circle cx="94" cy="48" r="3" fill="#374151"/>
  <!-- Net label (dashed line showing centre) -->
  <line x1="60" y1="48" x2="60" y2="96" stroke="#374151" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <!-- 2m measurement bracket on floor -->
  <line x1="26" y1="110" x2="94" y2="110" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="106" x2="26" y2="114" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="94" y1="106" x2="94" y2="114" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="46" y="103" width="28" height="11" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <text x="48" y="112" font-size="7" fill="#374151" font-family="monospace">2m+ each</text>
  <!-- Arrow indicating net height at waist -->
  <line x1="4" y1="48" x2="4" y2="80" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2" y1="48" x2="6" y2="48" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2" y1="80" x2="6" y2="80" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>
