<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- String net across middle -->
  <line x1="60" y1="18" x2="60" y2="100" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="18" x2="64" y2="18" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="100" x2="64" y2="100" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left paddle -->
  <circle cx="26" cy="66" r="18" stroke="#374151" stroke-width="2" fill="#dbeafe"/>
  <line x1="26" y1="84" x2="26" y2="108" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <rect x="20" y="86" width="12" height="5" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="1" opacity="0.8"/>
  <!-- Right paddle -->
  <circle cx="94" cy="50" r="18" stroke="#374151" stroke-width="2" fill="#fde68a"/>
  <line x1="94" y1="68" x2="94" y2="92" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <rect x="88" y="70" width="12" height="5" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="1" opacity="0.8"/>
  <!-- Balloon in flight (hero, arc trajectory) -->
  <circle cx="60" cy="36" r="16" stroke="#374151" stroke-width="2" fill="#f472b6"/>
  <ellipse cx="54" cy="30" rx="5" ry="3" fill="#fce7f3" opacity="0.5"/>
  <ellipse cx="60" cy="36" rx="5" ry="3" fill="#e879a0" opacity="0.6" stroke="none"/>
  <!-- Flight arc (trajectory from left paddle to right) -->
  <path d="M36 60 Q60 20 80 46" stroke="#374151" stroke-width="1.5" fill="none" stroke-dasharray="4,3" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Score display -->
  <rect x="6" y="8" width="22" height="14" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <text x="10" y="19" font-size="8" fill="#374151" font-family="monospace" font-weight="bold">3</text>
  <rect x="92" y="8" width="22" height="14" rx="2" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <text x="98" y="19" font-size="8" fill="#374151" font-family="monospace" font-weight="bold">5</text>
</svg>
