<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Inflated round balloon (hero) -->
  <circle cx="60" cy="58" r="42" stroke="#374151" stroke-width="2.5" fill="#f472b6"/>
  <!-- Balloon highlight -->
  <ellipse cx="44" cy="40" rx="14" ry="10" fill="#fce7f3" opacity="0.5"/>
  <!-- Balloon knot at bottom -->
  <path d="M56 100 Q58 108 60 108 Q62 108 64 100" stroke="#374151" stroke-width="2" fill="#e879a0" stroke-linecap="round"/>
  <!-- Small tie bump -->
  <ellipse cx="60" cy="100" rx="5" ry="3" fill="#e879a0" stroke="#374151" stroke-width="1.5"/>
  <!-- Size guide: ~20-25 cm across arrows -->
  <line x1="14" y1="58" x2="106" y2="58" stroke="#374151" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="14" y1="54" x2="14" y2="62" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="106" y1="54" x2="106" y2="62" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="36" y="52" width="48" height="12" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <text x="38" y="61" font-size="7" fill="#374151" font-family="monospace">20–25 cm</text>
  <!-- Blowing arrow -->
  <line x1="16" y1="20" x2="28" y2="34" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,2"/>
  <path d="M25 31 L28 36 L31 30" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Round shape tick (vs sausage X) -->
  <circle cx="100" cy="16" r="8" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <path d="M96 16 L99 19 L104 13" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
