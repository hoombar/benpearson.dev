<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Straws vertical -->
  <rect x="24" y="8" width="5" height="70" rx="2.5" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
  <rect x="38" y="8" width="5" height="70" rx="2.5" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
  <rect x="52" y="8" width="5" height="70" rx="2.5" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
  <rect x="66" y="8" width="5" height="70" rx="2.5" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  <rect x="80" y="8" width="5" height="70" rx="2.5" fill="#a78bfa" stroke="#374151" stroke-width="0.8"/>

  <!-- Woven section pushed down - several rows visible -->
  <!-- Orange rows -->
  <rect x="22" y="62" width="66" height="3" rx="1" fill="#f97316" stroke="none" opacity="0.8"/>
  <rect x="22" y="68" width="66" height="3" rx="1" fill="#f97316" stroke="none" opacity="0.8"/>
  <!-- Blue rows (colour change) -->
  <rect x="22" y="74" width="66" height="3" rx="1" fill="#60a5fa" stroke="none" opacity="0.8"/>
  <rect x="22" y="80" width="66" height="3" rx="1" fill="#60a5fa" stroke="none" opacity="0.8"/>
  <!-- Green rows -->
  <rect x="22" y="86" width="66" height="3" rx="1" fill="#4ade80" stroke="none" opacity="0.8"/>
  <rect x="22" y="92" width="66" height="3" rx="1" fill="#4ade80" stroke="none" opacity="0.8"/>

  <!-- Weave texture on the woven section (over-under visible) -->
  <!-- Orange section vertical gaps showing straws underneath -->
  <rect x="37" y="62" width="7" height="9" fill="#fef3c7" opacity="0.3" stroke="none"/>
  <rect x="65" y="62" width="7" height="9" fill="#fef3c7" opacity="0.3" stroke="none"/>
  <rect x="23" y="68" width="7" height="3" fill="#fef3c7" opacity="0.3" stroke="none"/>
  <rect x="51" y="68" width="7" height="3" fill="#fef3c7" opacity="0.3" stroke="none"/>

  <!-- Arrow showing push-down direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="100" y1="46" x2="100" y2="60" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="96" y1="46" x2="96" y2="56" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Hand pushing weaving down -->
  <g transform="translate(92, 28)">
    <rect x="0" y="0" width="8" height="16" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="10" y="2" width="7" height="14" rx="3.5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Top knot -->
  <circle cx="54" cy="6" r="3" fill="#d1d5db" stroke="#374151" stroke-width="0.8"/>
</svg>
