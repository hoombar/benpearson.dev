<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Straws vertical (warp) -->
  <rect x="20" y="10" width="5" height="66" rx="2.5" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
  <rect x="34" y="10" width="5" height="66" rx="2.5" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
  <rect x="48" y="10" width="5" height="66" rx="2.5" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
  <rect x="62" y="10" width="5" height="66" rx="2.5" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  <rect x="76" y="10" width="5" height="66" rx="2.5" fill="#a78bfa" stroke="#374151" stroke-width="0.8"/>

  <!-- Top knot -->
  <circle cx="50" cy="6" r="3" fill="#d1d5db" stroke="#374151" stroke-width="0.8"/>

  <!-- Weaving string going over-under (weft) -->
  <!-- Row 1 - orange string -->
  <!-- Over straw 1 -->
  <line x1="16" y1="56" x2="26" y2="56" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Under straw 2 (hidden, just connecting) -->
  <line x1="26" y1="56" x2="34" y2="56" stroke="#f97316" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Over straw 2-3 gap -->
  <line x1="39" y1="56" x2="48" y2="56" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Under straw 3 -->
  <line x1="53" y1="56" x2="62" y2="56" stroke="#f97316" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Over straw 4-5 gap -->
  <line x1="67" y1="56" x2="76" y2="56" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Past straw 5 -->
  <line x1="81" y1="56" x2="86" y2="56" stroke="#f97316" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Row 2 - going back, opposite pattern -->
  <line x1="86" y1="62" x2="81" y2="62" stroke="#f97316" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="76" y1="62" x2="67" y2="62" stroke="#f97316" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="62" y1="62" x2="53" y2="62" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="62" x2="39" y2="62" stroke="#f97316" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="34" y1="62" x2="26" y2="62" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="62" x2="16" y2="62" stroke="#f97316" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Arrow showing weaving direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M94,56 Q96,56 96,59 Q96,62 94,62" fill="none" stroke="#374151" stroke-width="0.8" marker-end="url(#arr)"/>

  <!-- String ball -->
  <circle cx="10" cy="88" r="8" fill="#f97316" stroke="#374151" stroke-width="0.8"/>
  <path d="M6,84 Q8,80 14,84" fill="none" stroke="#fb923c" stroke-width="0.6"/>
  <!-- String trailing from ball to weaving -->
  <path d="M14,82 Q16,72 16,56" fill="none" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
</svg>
