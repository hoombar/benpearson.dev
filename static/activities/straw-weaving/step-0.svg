<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Straws with string threaded through (vertical, hero) -->
  <!-- Straw 1 -->
  <rect x="22" y="20" width="6" height="60" rx="3" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
  <!-- Straw 2 -->
  <rect x="36" y="20" width="6" height="60" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
  <!-- Straw 3 -->
  <rect x="50" y="20" width="6" height="60" rx="3" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
  <!-- Straw 4 -->
  <rect x="64" y="20" width="6" height="60" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  <!-- Straw 5 -->
  <rect x="78" y="20" width="6" height="60" rx="3" fill="#a78bfa" stroke="#374151" stroke-width="0.8"/>

  <!-- String poking out top of each straw -->
  <line x1="25" y1="10" x2="25" y2="20" stroke="#d1d5db" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="39" y1="10" x2="39" y2="20" stroke="#d1d5db" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="53" y1="10" x2="53" y2="20" stroke="#d1d5db" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="67" y1="10" x2="67" y2="20" stroke="#d1d5db" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="81" y1="10" x2="81" y2="20" stroke="#d1d5db" stroke-width="1.2" stroke-linecap="round"/>

  <!-- All strings tied together at top -->
  <circle cx="53" cy="8" r="3" fill="#d1d5db" stroke="#374151" stroke-width="0.8"/>
  <!-- Lines converging to knot -->
  <line x1="25" y1="10" x2="53" y2="8" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
  <line x1="39" y1="10" x2="53" y2="8" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
  <line x1="67" y1="10" x2="53" y2="8" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
  <line x1="81" y1="10" x2="53" y2="8" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>

  <!-- String poking out bottom -->
  <line x1="25" y1="80" x2="25" y2="96" stroke="#d1d5db" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="39" y1="80" x2="39" y2="96" stroke="#d1d5db" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="53" y1="80" x2="53" y2="96" stroke="#d1d5db" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="67" y1="80" x2="67" y2="96" stroke="#d1d5db" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="81" y1="80" x2="81" y2="96" stroke="#d1d5db" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Ball of string -->
  <circle cx="102" cy="78" r="12" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
  <path d="M96,74 Q100,68 106,72 Q110,76 104,80" fill="none" stroke="#9ca3af" stroke-width="0.8"/>
  <path d="M98,80 Q102,84 108,82" fill="none" stroke="#9ca3af" stroke-width="0.8"/>
</svg>
