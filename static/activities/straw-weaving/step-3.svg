<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Finished woven piece (straws removed) - hero -->
  <g transform="translate(24, 10)">
    <!-- Woven rectangle -->
    <rect x="0" y="12" width="52" height="70" rx="2" fill="#f97316" stroke="#374151" stroke-width="1.2" opacity="0.3"/>

    <!-- Woven rows - alternating colours -->
    <rect x="2" y="14" width="48" height="5" rx="1" fill="#f97316" opacity="0.8"/>
    <rect x="2" y="21" width="48" height="5" rx="1" fill="#f97316" opacity="0.7"/>
    <rect x="2" y="28" width="48" height="5" rx="1" fill="#60a5fa" opacity="0.8"/>
    <rect x="2" y="35" width="48" height="5" rx="1" fill="#60a5fa" opacity="0.7"/>
    <rect x="2" y="42" width="48" height="5" rx="1" fill="#4ade80" opacity="0.8"/>
    <rect x="2" y="49" width="48" height="5" rx="1" fill="#4ade80" opacity="0.7"/>
    <rect x="2" y="56" width="48" height="5" rx="1" fill="#f97316" opacity="0.8"/>
    <rect x="2" y="63" width="48" height="5" rx="1" fill="#f97316" opacity="0.7"/>
    <rect x="2" y="70" width="48" height="5" rx="1" fill="#a78bfa" opacity="0.8"/>
    <rect x="2" y="77" width="48" height="3" rx="1" fill="#a78bfa" opacity="0.7"/>

    <!-- Warp strings visible as vertical lines -->
    <line x1="10" y1="6" x2="10" y2="88" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="20" y1="6" x2="20" y2="88" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="30" y1="6" x2="30" y2="88" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="40" y1="6" x2="40" y2="88" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>

    <!-- Tied-off string tassels at top -->
    <line x1="10" y1="6" x2="8" y2="0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="20" y1="6" x2="18" y2="0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="30" y1="6" x2="28" y2="0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="40" y1="6" x2="38" y2="0" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>

    <!-- Bottom tassels -->
    <line x1="10" y1="88" x2="8" y2="94" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="20" y1="88" x2="18" y2="94" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="30" y1="88" x2="28" y2="94" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="40" y1="88" x2="38" y2="94" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Removed straws lying aside -->
  <rect x="86" y="30" width="4" height="28" rx="2" fill="#ef4444" stroke="#374151" stroke-width="0.5" opacity="0.5"/>
  <rect x="92" y="34" width="4" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="0.5" opacity="0.5"/>
  <rect x="98" y="32" width="4" height="28" rx="2" fill="#22c55e" stroke="#374151" stroke-width="0.5" opacity="0.5"/>
  <rect x="104" y="36" width="4" height="24" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="0.5" opacity="0.5"/>

  <!-- Scissors -->
  <g transform="translate(94, 76) rotate(30)">
    <path d="M0,0 L-12,3" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L-12,-3" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.2" fill="#374151" stroke="none"/>
    <ellipse cx="4" cy="2.5" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <ellipse cx="4" cy="-2.5" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  </g>
</svg>
