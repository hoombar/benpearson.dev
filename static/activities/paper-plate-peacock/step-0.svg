<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate being painted teal (hero) -->
  <ellipse cx="50" cy="50" rx="36" ry="34" fill="#0d9488" stroke="#374151" stroke-width="1.5"/>
  <!-- Plate rim -->
  <ellipse cx="50" cy="50" rx="26" ry="24" fill="none" stroke="#0f766e" stroke-width="0.6" opacity="0.4"/>
  <!-- Wet paint swirls -->
  <path d="M36,38 Q46,34 54,40" fill="none" stroke="#14b8a6" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M40,56 Q50,52 58,58" fill="none" stroke="#0f766e" stroke-width="1" stroke-linecap="round"/>

  <!-- Paintbrush painting -->
  <g transform="translate(68, 22) rotate(30)">
    <rect x="0" y="-3" width="28" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#0d9488" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pots -->
  <g transform="translate(92, 52)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
    <rect x="2" y="3" width="12" height="11" rx="1" fill="#3b82f6"/>
  </g>
  <g transform="translate(92, 70)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
    <rect x="2" y="3" width="12" height="11" rx="1" fill="#22c55e"/>
  </g>
</svg>
