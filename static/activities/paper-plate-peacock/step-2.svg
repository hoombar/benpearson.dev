<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Feathers fanned out behind plate (hero) -->
  <!-- Feather 1 (far left) -->
  <path d="M14,52 Q4,30 10,10 Q14,4 16,10 Q20,30 18,52 Z" fill="#a855f7" stroke="#374151" stroke-width="0.6"/>
  <circle cx="13" cy="20" r="2.5" fill="#22c55e" stroke="#374151" stroke-width="0.3"/>
  <!-- Feather 2 -->
  <path d="M28,48 Q22,26 26,6 Q30,0 32,6 Q34,26 32,48 Z" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>
  <circle cx="29" cy="16" r="2.5" fill="#fbbf24" stroke="#374151" stroke-width="0.3"/>
  <!-- Feather 3 -->
  <path d="M42,46 Q40,24 42,4 Q46,-2 48,4 Q48,24 46,46 Z" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
  <circle cx="44" cy="14" r="2.5" fill="#3b82f6" stroke="#374151" stroke-width="0.3"/>
  <!-- Feather 4 (centre) -->
  <path d="M56,44 Q56,22 58,2 Q60,-4 62,2 Q62,22 60,44 Z" fill="#0d9488" stroke="#374151" stroke-width="0.6"/>
  <circle cx="59" cy="12" r="2.5" fill="#a855f7" stroke="#374151" stroke-width="0.3"/>
  <!-- Feather 5 -->
  <path d="M70,46 Q72,24 72,4 Q74,-2 76,4 Q78,24 74,46 Z" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>
  <circle cx="73" cy="14" r="2.5" fill="#22c55e" stroke="#374151" stroke-width="0.3"/>
  <!-- Feather 6 -->
  <path d="M84,48 Q84,26 86,6 Q88,0 90,6 Q92,26 88,48 Z" fill="#a855f7" stroke="#374151" stroke-width="0.6"/>
  <circle cx="87" cy="16" r="2.5" fill="#fbbf24" stroke="#374151" stroke-width="0.3"/>
  <!-- Feather 7 (far right) -->
  <path d="M98,52 Q100,30 102,10 Q104,4 106,10 Q108,30 104,52 Z" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
  <circle cx="103" cy="20" r="2.5" fill="#3b82f6" stroke="#374151" stroke-width="0.3"/>

  <!-- Paper plate body (on top of feathers) -->
  <ellipse cx="58" cy="66" rx="28" ry="26" fill="#0d9488" stroke="#374151" stroke-width="1.5"/>

  <!-- PVA glue -->
  <g transform="translate(96, 66)">
    <rect x="0" y="8" width="14" height="20" rx="3" fill="#f0f9ff" stroke="#374151" stroke-width="0.8"/>
    <rect x="3" y="0" width="8" height="10" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="0.6"/>
    <circle cx="7" cy="0" r="2" fill="#f97316" stroke="#374151" stroke-width="0.5"/>
  </g>
</svg>
