<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Feather being cut from paper (hero) -->
  <rect x="6" y="16" width="50" height="74" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>

  <!-- Teardrop feather shape being cut -->
  <path d="M24,20 Q14,40 16,60 Q18,74 24,80 Q30,74 32,60 Q34,40 24,20 Z" fill="#2563eb" stroke="#374151" stroke-width="1.2"/>
  <!-- Eye-spot on feather -->
  <circle cx="24" cy="34" r="5" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
  <circle cx="24" cy="34" r="2.5" fill="#1e40af" stroke="#374151" stroke-width="0.4"/>

  <!-- Cut line (dashed) -->
  <path d="M24,20 Q14,40 16,60 Q18,74 24,80" fill="none" stroke="#374151" stroke-width="0.5" stroke-dasharray="3,2"/>

  <!-- Scissors cutting -->
  <g transform="translate(28, 72) rotate(-30)">
    <path d="M0,0 L14,5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,0 L14,-5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#374151"/>
    <ellipse cx="18" cy="6" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <ellipse cx="18" cy="-6" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  </g>

  <!-- Finished feathers -->
  <g transform="translate(62, 14)">
    <path d="M12,0 Q6,16 8,32 Q10,42 12,46 Q14,42 16,32 Q18,16 12,0 Z" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
    <circle cx="12" cy="12" r="3" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
    <circle cx="12" cy="12" r="1.5" fill="#1e3a8a" stroke="none"/>
  </g>
  <g transform="translate(82, 14)">
    <path d="M12,0 Q6,16 8,32 Q10,42 12,46 Q14,42 16,32 Q18,16 12,0 Z" fill="#a855f7" stroke="#374151" stroke-width="0.6"/>
    <circle cx="12" cy="12" r="3" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
    <circle cx="12" cy="12" r="1.5" fill="#7c3aed" stroke="none"/>
  </g>
  <g transform="translate(62, 50)">
    <path d="M12,0 Q6,16 8,32 Q10,42 12,46 Q14,42 16,32 Q18,16 12,0 Z" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>
    <circle cx="12" cy="12" r="3" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <circle cx="12" cy="12" r="1.5" fill="#1e40af" stroke="none"/>
  </g>
  <g transform="translate(82, 50)">
    <path d="M12,0 Q6,16 8,32 Q10,42 12,46 Q14,42 16,32 Q18,16 12,0 Z" fill="#0d9488" stroke="#374151" stroke-width="0.6"/>
    <circle cx="12" cy="12" r="3" fill="#a855f7" stroke="#374151" stroke-width="0.4"/>
    <circle cx="12" cy="12" r="1.5" fill="#0f766e" stroke="none"/>
  </g>
</svg>
