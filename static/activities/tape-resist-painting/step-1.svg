<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper sheet being painted -->
  <rect x="15" y="10" width="70" height="86" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>

  <!-- Paint coverage - bold colours across paper -->
  <!-- Blue section -->
  <rect x="16" y="11" width="34" height="42" fill="#60a5fa" opacity="0.85"/>
  <!-- Red section -->
  <rect x="50" y="11" width="34" height="42" fill="#f87171" opacity="0.85"/>
  <!-- Green section -->
  <rect x="16" y="53" width="34" height="42" rx="0 0 2 0" fill="#4ade80" opacity="0.85"/>
  <!-- Yellow section -->
  <rect x="50" y="53" width="34" height="42" fill="#fbbf24" opacity="0.85"/>

  <!-- Tape strips visible under paint -->
  <rect x="20" y="42" width="60" height="7" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5" opacity="0.5"/>
  <rect x="46" y="16" width="7" height="74" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5" opacity="0.5"/>

  <!-- Paintbrush in action -->
  <g transform="translate(62, 68) rotate(-25)">
    <!-- Brush handle -->
    <rect x="-3" y="-40" width="6" height="32" rx="1.5" fill="#a78bfa" stroke="#374151" stroke-width="1"/>
    <!-- Ferrule -->
    <rect x="-4" y="-10" width="8" height="5" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.8"/>
    <!-- Bristles -->
    <rect x="-5" y="-5" width="10" height="8" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Paint pot -->
  <rect x="92" y="58" width="18" height="22" rx="2" fill="#60a5fa" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="101" cy="58" rx="9" ry="2.5" fill="#93c5fd" stroke="#374151" stroke-width="0.8"/>

  <!-- Paint drip on pot -->
  <path d="M108,62 Q110,66 108,68" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
</svg>
