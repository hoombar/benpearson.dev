<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Painted paper -->
  <rect x="15" y="10" width="70" height="86" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>

  <!-- Paint coverage -->
  <rect x="16" y="11" width="34" height="42" fill="#60a5fa" opacity="0.85"/>
  <rect x="50" y="11" width="34" height="42" fill="#f87171" opacity="0.85"/>
  <rect x="16" y="53" width="34" height="42" fill="#4ade80" opacity="0.85"/>
  <rect x="50" y="53" width="34" height="42" fill="#fbbf24" opacity="0.85"/>

  <!-- White reveal where tape has been peeled (horizontal strip partially peeled) -->
  <rect x="20" y="42" width="35" height="7" rx="1" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.5"/>

  <!-- Tape being peeled up - curling away -->
  <g>
    <!-- Remaining tape on paper -->
    <rect x="55" y="42" width="25" height="7" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.8" opacity="0.85"/>
    <!-- Peeling section curling up -->
    <path d="M55,42 Q52,36 50,28 Q49,24 52,22" fill="none" stroke="#fde68a" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
    <path d="M55,42 Q52,36 50,28 Q49,24 52,22" fill="none" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- Hand pulling tape -->
  <g transform="translate(42, 14)">
    <!-- Thumb -->
    <rect x="4" y="0" width="8" height="16" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="1"/>
    <!-- Index finger -->
    <rect x="-2" y="2" width="7" height="18" rx="3.5" fill="#fcd9b6" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Upward arrow showing peel direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="42" y1="46" x2="42" y2="32" stroke="#374151" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Vertical tape still on paper (not yet peeled) -->
  <rect x="46" y="16" width="7" height="74" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5" opacity="0.5"/>
</svg>
