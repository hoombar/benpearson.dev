<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper sheet -->
  <rect x="15" y="10" width="70" height="86" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>

  <!-- Tape strips on paper - creating a star/geometric pattern -->
  <!-- Horizontal strip -->
  <rect x="20" y="42" width="60" height="7" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.8" opacity="0.85"/>
  <!-- Vertical strip -->
  <rect x="46" y="16" width="7" height="74" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.8" opacity="0.85"/>
  <!-- Diagonal strip top-left to bottom-right -->
  <rect x="-2" y="44" width="56" height="7" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.8" opacity="0.85" transform="rotate(-40 26 47)"/>
  <!-- Diagonal strip top-right to bottom-left -->
  <rect x="30" y="44" width="56" height="7" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.8" opacity="0.85" transform="rotate(40 58 47)"/>

  <!-- Hand pressing tape down -->
  <g transform="translate(58, 30)">
    <!-- Thumb -->
    <rect x="-3" y="-2" width="8" height="18" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="1"/>
    <!-- Index finger pressing down -->
    <rect x="6" y="2" width="7" height="20" rx="3.5" fill="#fcd9b6" stroke="#374151" stroke-width="1"/>
    <!-- Small press marks -->
    <line x1="8" y1="22" x2="6" y2="26" stroke="#374151" stroke-width="0.6" stroke-linecap="round"/>
    <line x1="10" y1="22" x2="10" y2="26" stroke="#374151" stroke-width="0.6" stroke-linecap="round"/>
    <line x1="12" y1="22" x2="14" y2="26" stroke="#374151" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- Tape roll -->
  <circle cx="102" cy="40" r="12" fill="#fde68a" stroke="#374151" stroke-width="1.2"/>
  <circle cx="102" cy="40" r="5" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>
  <!-- Tape tail coming off roll -->
  <path d="M90,40 Q88,44 85,42" fill="none" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
  <line x1="85" y1="42" x2="85" y2="42" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
</svg>
