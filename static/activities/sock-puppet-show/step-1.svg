<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background -->
  <rect width="120" height="120" fill="#f9fafb"/>

  <!-- Hand wearing the sock — sock puppet on hand, viewed from side -->
  <!-- Arm/wrist (skin coloured) -->
  <rect x="42" y="88" width="36" height="32" rx="4" fill="#fbbf24" stroke="#374151" stroke-width="2"/>

  <!-- Sock body (bright blue) on the hand -->
  <g transform="translate(60,60) rotate(-5)">
    <!-- Main sock body -->
    <path d="M-26,-48 L-26,18 Q-26,30 -16,32 L16,32 Q26,30 26,18 L26,-48 Z"
          fill="#3b82f6" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Sock toe area (darker blue) -->
    <path d="M-26,20 Q-26,32 -16,32 L16,32 Q26,30 26,20 Z"
          fill="#2563eb" stroke="#374151" stroke-width="1.5"/>
    <!-- Cuff at top (white band) -->
    <rect x="-26" y="-48" width="52" height="12" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <!-- Cuff stripe -->
    <line x1="-26" y1="-42" x2="26" y2="-42" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Left eye (white circle with dark pupil) — already drawn -->
    <circle cx="-10" cy="-22" r="7" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
    <circle cx="-9"  cy="-21" r="3.5" fill="#374151"/>
    <circle cx="-11" cy="-23" r="1" fill="#f9fafb"/>

    <!-- Right eye outline — being drawn NOW by marker -->
    <circle cx="10" cy="-22" r="7" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
    <!-- Partial pupil (being drawn) -->
    <path d="M7,-22 Q10,-26 13,-22" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose dot -->
    <circle cx="0" cy="-10" r="2.5" fill="#374151"/>

    <!-- Mouth line (dashed — where the mouth fold will be) -->
    <line x1="-14" y1="2" x2="14" y2="2" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3" stroke-linecap="round"/>
  </g>

  <!-- Blue marker in hand, tip pointing at puppet's right eye -->
  <g transform="translate(96,28) rotate(130)">
    <rect x="-5" y="-20" width="10" height="36" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <rect x="-6" y="-26" width="12" height="8" rx="3" fill="#1d4ed8" stroke="#374151" stroke-width="1"/>
    <path d="-4,16 L0,24 L4,16" fill="#374151" stroke="#374151" stroke-width="1"/>
    <!-- Tip -->
    <path d="M-4,16 L0,24 L4,16 Z" fill="#374151"/>
  </g>
</svg>
