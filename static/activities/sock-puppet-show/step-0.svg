<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background -->
  <rect width="120" height="120" fill="#f9fafb"/>

  <!-- Table surface -->
  <rect x="0" y="96" width="120" height="24" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Large bright red sock (hero, laid flat) -->
  <path d="M38,20 L38,72 Q38,88 52,90 L68,90 Q80,90 80,78 L80,68 L70,68 L70,20 Z"
        fill="#ef4444" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Sock cuff band (white stripe at top) -->
  <rect x="38" y="20" width="32" height="10" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <!-- Cuff stripe decoration -->
  <line x1="38" y1="26" x2="70" y2="26" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sock heel bump -->
  <path d="M70,68 Q82,68 80,78 L80,78" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>
  <!-- Sock toe (rounded bottom of foot) -->
  <path d="M38,82 Q38,92 52,90" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>

  <!-- Marker (blue, standing up) -->
  <rect x="84" y="32" width="10" height="36" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="2"/>
  <!-- Marker cap -->
  <rect x="83" y="26" width="12" height="8" rx="3" fill="#1d4ed8" stroke="#374151" stroke-width="1.5"/>
  <!-- Marker tip -->
  <path d="M87,68 L89,76 L91,68" fill="#374151" stroke="#374151" stroke-width="1"/>
  <!-- Marker label stripe -->
  <rect x="84" y="46" width="10" height="6" fill="#93c5fd"/>

  <!-- Scissors — blades pointing right toward sock -->
  <g transform="translate(16,68) rotate(-25)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="14" y2="4" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-4" cy="-4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <circle cx="-4" cy="4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  </g>

  <!-- Roll of tape (brown/beige) -->
  <circle cx="104" cy="72" r="12" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
  <!-- Tape hole (inner circle) -->
  <circle cx="104" cy="72" r="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <!-- Tape edge -->
  <path d="M104,60 Q116,60 116,72" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Layout arrow: supplies spread on surface -->
  <line x1="28" y1="105" x2="96" y2="105" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3" stroke-linecap="round"/>
</svg>
