<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background (stage backdrop — warm purple) -->
  <rect width="120" height="120" fill="#ede9fe"/>

  <!-- Stage blanket draped over table — navy/dark blue -->
  <rect x="0" y="72" width="120" height="48" rx="0" fill="#1e40af" stroke="#374151" stroke-width="1"/>
  <!-- Blanket fold lines -->
  <line x1="0"  y1="82" x2="120" y2="82" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="20" y1="72" x2="20" y2="120" stroke="#1d4ed8" stroke-width="1"/>
  <line x1="100" y1="72" x2="100" y2="120" stroke="#1d4ed8" stroke-width="1"/>
  <!-- Table legs underneath -->
  <rect x="10" y="98" width="10" height="22" rx="1" fill="#374151"/>
  <rect x="100" y="98" width="10" height="22" rx="1" fill="#374151"/>

  <!-- Stage curtain arch effect — two triangular side curtains -->
  <path d="M0,0 L0,80 L20,72 L20,0 Z" fill="#a78bfa" stroke="#374151" stroke-width="1"/>
  <path d="M120,0 L120,80 L100,72 L100,0 Z" fill="#a78bfa" stroke="#374151" stroke-width="1"/>
  <!-- Curtain folds -->
  <line x1="6" y1="0" x2="6" y2="76" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="114" y1="0" x2="114" y2="76" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- LEFT PUPPET — red villain, hand below stage edge, puppet visible above -->
  <g transform="translate(36,64)">
    <!-- Wrist/arm (hand) -->
    <rect x="-10" y="18" width="20" height="24" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
    <!-- Sock body (red) -->
    <path d="M-16,-42 L-16,18 Q-16,26 -8,28 L8,28 Q16,26 16,18 L16,-42 Z"
          fill="#ef4444" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Toe bump -->
    <path d="M-16,16 Q-16,28 -8,28 L8,28 Q16,26 16,16 Z" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>
    <!-- Cuff -->
    <rect x="-16" y="-42" width="32" height="9" rx="2" fill="#374151" stroke="#374151" stroke-width="1"/>
    <!-- Eyes -->
    <circle cx="-6" cy="-20" r="5" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <circle cx="-5" cy="-19" r="2.5" fill="#374151"/>
    <circle cx="6"  cy="-20" r="5" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <circle cx="7"  cy="-19" r="2.5" fill="#374151"/>
    <!-- Eyebrows (angry) -->
    <path d="M-11,-28 L-6,-24" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <path d="M11,-28 L6,-24"  stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <!-- Open mouth (villain speaking — rectangle mouth = talking action) -->
    <rect x="-8" y="-4" width="16" height="10" rx="4" fill="#374151"/>
    <rect x="-6" y="-2" width="12" height="6"  rx="3" fill="#fca5a5"/>
    <!-- Yarn hair (wild orange) -->
    <path d="M-14,-42 Q-18,-52 -12,-56" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
    <path d="M-6,-42 Q-8,-54 -2,-58"   fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
    <path d="M6,-42 Q8,-54 12,-56"     fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
    <!-- Speech bubble from villain -->
    <ellipse cx="28" cy="-36" rx="14" ry="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <!-- Speech bubble tail -->
    <path d="M20,-30 L14,-24 L22,-28 Z" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <!-- Speech lines -->
    <line x1="18" y1="-38" x2="38" y2="-38" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="21" y1="-33" x2="35" y2="-33" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- RIGHT PUPPET — blue hero, raised higher (hero appears triumphant) -->
  <g transform="translate(84,56)">
    <!-- Wrist/arm (hand) -->
    <rect x="-10" y="26" width="20" height="24" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
    <!-- Sock body (blue) -->
    <path d="M-16,-50 L-16,26 Q-16,34 -8,36 L8,36 Q16,34 16,26 L16,-50 Z"
          fill="#3b82f6" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Toe bump -->
    <path d="M-16,24 Q-16,36 -8,36 L8,36 Q16,34 16,24 Z" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
    <!-- Cuff (white) -->
    <rect x="-16" y="-50" width="32" height="9" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
    <!-- Crown -->
    <path d="M-14,-58 L-14,-50 L14,-50 L14,-58 L8,-53 L3,-62 L0,-53 L-3,-62 L-8,-53 Z"
          fill="#f59e0b" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-56" r="2" fill="#ef4444"/>
    <!-- Eyes -->
    <circle cx="-6" cy="-28" r="5" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <circle cx="-5" cy="-27" r="2.5" fill="#374151"/>
    <circle cx="-8" cy="-30" r="1" fill="#f9fafb"/>
    <circle cx="6"  cy="-28" r="5" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <circle cx="7"  cy="-27" r="2.5" fill="#374151"/>
    <circle cx="4"  cy="-30" r="1" fill="#f9fafb"/>
    <!-- Big open smile (hero performing) -->
    <rect x="-8" y="-8" width="16" height="10" rx="5" fill="#374151"/>
    <rect x="-6" y="-6" width="12" height="6"  rx="3" fill="#fca5a5"/>
    <!-- Cheeks -->
    <circle cx="-12" cy="-14" r="4" fill="#fca5a5" opacity="0.7"/>
    <circle cx="12"  cy="-14" r="4" fill="#fca5a5" opacity="0.7"/>
    <!-- Hair curls -->
    <path d="M-14,-50 Q-18,-60 -10,-64 Q-4,-62 -6,-50" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M4,-50 Q6,-62 12,-64 Q18,-60 14,-50"      fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <!-- Speech bubble from hero -->
    <ellipse cx="-28" cy="-44" rx="14" ry="10" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
    <path d="M-20,-38 L-14,-32 L-22,-36 Z" fill="#d1fae5" stroke="#22c55e" stroke-width="1"/>
    <line x1="-38" y1="-46" x2="-18" y2="-46" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-36" y1="-41" x2="-20" y2="-41" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
