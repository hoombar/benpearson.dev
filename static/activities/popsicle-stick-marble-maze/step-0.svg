<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Cardboard base (hero) -->
  <rect x="12" y="18" width="72" height="72" rx="2" fill="#d4a574" stroke="#374151" stroke-width="1.5"/>
  <!-- Cardboard texture lines -->
  <line x1="16" y1="30" x2="80" y2="30" stroke="#c4956a" stroke-width="0.4"/>
  <line x1="16" y1="45" x2="80" y2="45" stroke="#c4956a" stroke-width="0.4"/>
  <line x1="16" y1="60" x2="80" y2="60" stroke="#c4956a" stroke-width="0.4"/>
  <line x1="16" y1="75" x2="80" y2="75" stroke="#c4956a" stroke-width="0.4"/>

  <!-- Border drawn with marker -->
  <rect x="16" y="22" width="64" height="64" rx="1" fill="none" stroke="#374151" stroke-width="1.2"/>

  <!-- START label area (gap in border) -->
  <rect x="16" y="22" width="14" height="6" fill="#d4a574"/>
  <circle cx="23" cy="25" r="2" fill="#22c55e" stroke="#374151" stroke-width="0.5"/>

  <!-- FINISH label area (gap in border) -->
  <rect x="66" y="80" width="14" height="6" fill="#d4a574"/>
  <circle cx="73" cy="83" r="2" fill="#ef4444" stroke="#374151" stroke-width="0.5"/>

  <!-- Marker drawing the border -->
  <g transform="translate(72, 6) rotate(35)">
    <rect x="0" y="-3" width="28" height="6" rx="2" fill="#1e40af" stroke="#374151" stroke-width="0.8"/>
    <rect x="-3" y="-4" width="4" height="8" rx="1" fill="#374151"/>
  </g>

  <!-- Scissors for cutting cardboard -->
  <g transform="translate(92, 50)">
    <path d="M0,0 L14,5" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L14,-5" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#374151"/>
    <ellipse cx="18" cy="6" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <ellipse cx="18" cy="-6" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  </g>
</svg>
