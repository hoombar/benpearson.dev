<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Cardboard base tilted (hero) -->
  <g transform="translate(10, 16) rotate(-8, 44, 40)">
    <rect x="0" y="0" width="76" height="76" rx="2" fill="#d4a574" stroke="#374151" stroke-width="1.5"/>

    <!-- Popsicle stick walls -->
    <rect x="4" y="16" width="36" height="3" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.6"/>
    <rect x="24" y="30" width="44" height="3" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.6"/>
    <rect x="4" y="44" width="44" height="3" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.6"/>
    <rect x="28" y="56" width="40" height="3" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.6"/>

    <rect x="22" y="4" width="3" height="16" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.6"/>
    <rect x="46" y="16" width="3" height="18" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.6"/>
    <rect x="22" y="30" width="3" height="18" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.6"/>
    <rect x="46" y="44" width="3" height="16" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.6"/>

    <!-- Border sticks -->
    <rect x="2" y="2" width="3" height="72" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.5"/>
    <rect x="70" y="2" width="3" height="72" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.5"/>
    <rect x="4" y="2" width="68" height="3" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.5"/>
    <rect x="4" y="70" width="68" height="3" rx="1" fill="#f5deb3" stroke="#374151" stroke-width="0.5"/>

    <!-- Marble -->
    <circle cx="32" cy="38" r="4" fill="#6366f1" stroke="#374151" stroke-width="0.8"/>
    <circle cx="30" cy="36" r="1.2" fill="#a5b4fc" opacity="0.6"/>

    <!-- START marker -->
    <circle cx="12" cy="8" r="2" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
    <!-- FINISH marker -->
    <circle cx="62" cy="68" r="2" fill="#ef4444" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Hands holding the board -->
  <g transform="translate(2, 68)">
    <rect x="0" y="0" width="14" height="22" rx="7" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g transform="translate(90, 56)">
    <rect x="0" y="0" width="14" height="22" rx="7" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Motion arrows showing tilt -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M106,54 Q108,48 104,44" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
  <path d="M4,66 Q2,72 6,76" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
