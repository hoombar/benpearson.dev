<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background surface -->
  <rect x="0" y="0" width="120" height="120" fill="#fef9c3"/>
  <!-- Table surface -->
  <rect x="0" y="72" width="120" height="48" fill="#fef3c7" stroke="none"/>
  <line x1="0" y1="72" x2="120" y2="72" stroke="#fde68a" stroke-width="1.5"/>

  <!-- Paper under leaf (table surface) -->
  <rect x="12" y="74" width="96" height="38" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>

  <!-- Hero leaf: vein-side up, large, centre of canvas -->
  <!-- Leaf body with vivid green fill -->
  <ellipse cx="60" cy="46" rx="32" ry="20" fill="#22c55e" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Central vein (midrib) -->
  <line x1="28" y1="47" x2="92" y2="45" stroke="#15803d" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Side veins radiating out -->
  <line x1="36" y1="47" x2="30" y2="36" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
  <line x1="44" y1="46" x2="38" y2="34" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
  <line x1="52" y1="45" x2="48" y2="33" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
  <line x1="60" y1="45" x2="58" y2="33" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
  <line x1="68" y1="45" x2="70" y2="33" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
  <line x1="76" y1="45" x2="80" y2="34" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
  <!-- Stem -->
  <line x1="28" y1="47" x2="18" y2="55" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>

  <!-- Flat paintbrush applying red paint to leaf -->
  <!-- Handle -->
  <rect x="82" y="8" width="6" height="30" rx="3" fill="#d97706" stroke="#374151" stroke-width="1.5"/>
  <!-- Ferrule (metal band) -->
  <rect x="81" y="35" width="8" height="5" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <!-- Bristles with red paint on them -->
  <rect x="80" y="40" width="10" height="14" rx="2" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <!-- Paint strokes on leaf from brush -->
  <ellipse cx="72" cy="42" rx="10" ry="5" fill="#ef4444" fill-opacity="0.7" stroke="none"/>
  <ellipse cx="58" cy="41" rx="8" ry="4" fill="#ef4444" fill-opacity="0.5" stroke="none"/>

  <!-- Curved motion arrow: brush moving left across leaf — marker auto-aligns to tangent (−6,2) -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M85 38 Q78 38 72 40" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Paint pot bottom-left -->
  <rect x="8" y="78" width="20" height="18" rx="3" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="18" cy="78" rx="10" ry="4" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>
</svg>
