<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background paper/canvas for gallery -->
  <rect x="0" y="0" width="120" height="120" fill="#fef9c3"/>
  <!-- Large backing paper -->
  <rect x="6" y="6" width="108" height="108" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="2"/>

  <!-- Print 1: large orange leaf print top-left -->
  <g transform="translate(32, 32)">
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="#f97316" fill-opacity="0.85" stroke="none"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#c2410c" stroke-width="1" stroke-linecap="round"/>
    <line x1="-10" y1="0" x2="-13" y2="-7" stroke="#c2410c" stroke-width="1" stroke-linecap="round"/>
    <line x1="-2" y1="0" x2="-3" y2="-8" stroke="#c2410c" stroke-width="1" stroke-linecap="round"/>
    <line x1="7" y1="0" x2="9" y2="-7" stroke="#c2410c" stroke-width="1" stroke-linecap="round"/>
    <line x1="14" y1="0" x2="17" y2="-5" stroke="#c2410c" stroke-width="1" stroke-linecap="round"/>
    <!-- Stem line -->
    <line x1="-20" y1="0" x2="-25" y2="5" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Print 2: vivid red leaf print top-right, overlapping slightly -->
  <g transform="translate(82, 28) rotate(-15)">
    <ellipse cx="0" cy="0" rx="18" ry="11" fill="#ef4444" fill-opacity="0.85" stroke="none"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#b91c1c" stroke-width="1" stroke-linecap="round"/>
    <line x1="-7" y1="0" x2="-9" y2="-6" stroke="#b91c1c" stroke-width="1" stroke-linecap="round"/>
    <line x1="2" y1="0" x2="1" y2="-7" stroke="#b91c1c" stroke-width="1" stroke-linecap="round"/>
    <line x1="10" y1="0" x2="12" y2="-5" stroke="#b91c1c" stroke-width="1" stroke-linecap="round"/>
    <line x1="-16" y1="0" x2="-20" y2="4" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Print 3: green leaf print bottom-left -->
  <g transform="translate(36, 82) rotate(10)">
    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#22c55e" fill-opacity="0.85" stroke="none"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="-10" y2="-6" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-1" y2="-7" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
    <line x1="8" y1="0" x2="10" y2="-6" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
    <line x1="-18" y1="0" x2="-22" y2="5" stroke="#15803d" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Print 4: yellow/amber leaf print bottom-right (hero, largest) -->
  <g transform="translate(86, 80) rotate(-8)">
    <ellipse cx="0" cy="0" rx="24" ry="15" fill="#f59e0b" fill-opacity="0.85" stroke="none"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#d97706" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="-15" y2="-8" stroke="#d97706" stroke-width="1" stroke-linecap="round"/>
    <line x1="-4" y1="0" x2="-5" y2="-9" stroke="#d97706" stroke-width="1" stroke-linecap="round"/>
    <line x1="5" y1="0" x2="5" y2="-9" stroke="#d97706" stroke-width="1" stroke-linecap="round"/>
    <line x1="14" y1="0" x2="17" y2="-7" stroke="#d97706" stroke-width="1" stroke-linecap="round"/>
    <line x1="-22" y1="0" x2="-27" y2="6" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Marker pen adding details (arrange/embellish action) -->
  <!-- Pen body -->
  <rect x="95" y="8" width="5" height="22" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  <!-- Pen tip -->
  <polygon points="95,30 100,30 97.5,36" fill="#374151" stroke="#374151" stroke-width="1"/>
</svg>
