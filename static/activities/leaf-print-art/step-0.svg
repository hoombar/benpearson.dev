<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Sky/ground background -->
  <rect x="0" y="0" width="120" height="120" fill="#f0fdf4"/>
  <rect x="0" y="88" width="120" height="32" fill="#d1fae5"/>
  <line x1="0" y1="88" x2="120" y2="88" stroke="#86efac" stroke-width="1.5"/>

  <!-- Hero leaf: large orange fallen leaf centre-left -->
  <ellipse cx="42" cy="52" rx="26" ry="16" fill="#f97316" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Central vein -->
  <line x1="16" y1="53" x2="68" y2="51" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Side veins left -->
  <line x1="24" y1="53" x2="19" y2="44" stroke="#c2410c" stroke-width="1" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="26" y2="42" stroke="#c2410c" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="51" x2="36" y2="41" stroke="#c2410c" stroke-width="1" stroke-linecap="round"/>
  <!-- Side veins right -->
  <line x1="50" y1="51" x2="54" y2="42" stroke="#c2410c" stroke-width="1" stroke-linecap="round"/>
  <line x1="58" y1="52" x2="63" y2="44" stroke="#c2410c" stroke-width="1" stroke-linecap="round"/>
  <!-- Stem -->
  <line x1="16" y1="53" x2="8" y2="60" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>

  <!-- Small green leaf top-right -->
  <g transform="translate(86, 28) rotate(20)">
    <ellipse cx="0" cy="0" rx="14" ry="8" fill="#22c55e" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="-7" y2="-5" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
    <line x1="2" y1="0" x2="1" y2="-5" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
    <line x1="7" y1="0" x2="10" y2="-4" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="-18" y2="5" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Yellow leaf mid-right -->
  <g transform="translate(96, 62) rotate(-15)">
    <ellipse cx="0" cy="0" rx="11" ry="6" fill="#f59e0b" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <line x1="-9" y1="0" x2="9" y2="0" stroke="#d97706" stroke-width="1" stroke-linecap="round"/>
    <line x1="-3" y1="0" x2="-4" y2="-4" stroke="#d97706" stroke-width="1" stroke-linecap="round"/>
    <line x1="3" y1="0" x2="3" y2="-4" stroke="#d97706" stroke-width="1" stroke-linecap="round"/>
    <line x1="-9" y1="0" x2="-14" y2="4" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Red leaf on ground -->
  <g transform="translate(72, 98) rotate(8)">
    <ellipse cx="0" cy="0" rx="15" ry="8" fill="#ef4444" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <line x1="-13" y1="0" x2="13" y2="0" stroke="#b91c1c" stroke-width="1" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="-7" y2="-5" stroke="#b91c1c" stroke-width="1" stroke-linecap="round"/>
    <line x1="2" y1="0" x2="1" y2="-5" stroke="#b91c1c" stroke-width="1" stroke-linecap="round"/>
    <line x1="7" y1="0" x2="9" y2="-5" stroke="#b91c1c" stroke-width="1" stroke-linecap="round"/>
    <line x1="-13" y1="0" x2="-19" y2="5" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Small green leaf bottom-left ground -->
  <g transform="translate(24, 102) rotate(-10)">
    <ellipse cx="0" cy="0" rx="10" ry="6" fill="#22c55e" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
    <line x1="-2" y1="0" x2="-3" y2="-4" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
    <line x1="3" y1="0" x2="3" y2="-4" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="-13" y2="4" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Down arrow showing collection action -->
  <line x1="42" y1="12" x2="42" y2="26" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <polyline points="38,23 42,28 46,23" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
