<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect x="0" y="0" width="120" height="80" fill="#dbeafe" stroke="none"/>
  <!-- Grass ground -->
  <rect x="0" y="80" width="120" height="40" fill="#86efac" stroke="none"/>
  <line x1="0" y1="80" x2="120" y2="80" stroke="#374151" stroke-width="1.5"/>

  <!-- Tree in background -->
  <line x1="100" y1="52" x2="100" y2="80" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="38" r="16" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>

  <!-- Bird on tree -->
  <path d="M94,34 Q90,30 92,28 Q94,26 96,28" fill="#ef4444" stroke="#374151" stroke-width="1"/>
  <circle cx="94" cy="29" r="0.75" fill="#374151" stroke="none"/>
  <!-- Wing -->
  <path d="M94,32 Q98,30 96,34" fill="#ef4444" stroke="#374151" stroke-width="0.75"/>

  <!-- Butterfly -->
  <path d="M28,32 Q24,26 26,32 Q24,38 28,36" fill="#c4b5fd" stroke="#374151" stroke-width="0.75"/>
  <path d="M28,32 Q32,26 30,32 Q32,38 28,36" fill="#c4b5fd" stroke="#374151" stroke-width="0.75"/>
  <line x1="28" y1="30" x2="28" y2="38" stroke="#374151" stroke-width="0.5"/>

  <!-- Flower on ground -->
  <circle cx="22" cy="88" r="4" fill="#fca5a5" stroke="#374151" stroke-width="1"/>
  <circle cx="22" cy="88" r="1.5" fill="#f59e0b" stroke="none"/>
  <line x1="22" y1="92" x2="22" y2="100" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Ladybug on ground -->
  <ellipse cx="50" cy="92" rx="3" ry="2.5" fill="#ef4444" stroke="#374151" stroke-width="1"/>
  <line x1="50" y1="89.5" x2="50" y2="94.5" stroke="#374151" stroke-width="0.5"/>
  <circle cx="49" cy="91" r="0.5" fill="#374151" stroke="none"/>
  <circle cx="51" cy="93" r="0.5" fill="#374151" stroke="none"/>
  <!-- Head -->
  <circle cx="50" cy="89" r="1.5" fill="#374151" stroke="none"/>

  <!-- Stick figure holding binoculars up to eyes (centre, hero) -->
  <!-- Body -->
  <line x1="60" y1="64" x2="60" y2="100" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="60" y1="100" x2="52" y2="116" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="100" x2="68" y2="116" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arms holding binoculars -->
  <line x1="60" y1="72" x2="52" y2="58" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="72" x2="68" y2="58" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Binoculars at face -->
  <ellipse cx="54" cy="54" rx="7" ry="7" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="54" cy="54" rx="5" ry="5" fill="#fef3c7" stroke="#374151" stroke-width="1"/>
  <ellipse cx="66" cy="54" rx="7" ry="7" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="66" cy="54" rx="5" ry="5" fill="#fef3c7" stroke="#374151" stroke-width="1"/>

  <!-- Strap around neck -->
  <path d="M48,58 Q46,64 50,68 Q60,80 70,68 Q74,64 72,58"
        fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cloud -->
  <ellipse cx="70" cy="16" rx="14" ry="6" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <ellipse cx="62" cy="14" rx="8" ry="5" fill="#f9fafb" stroke="none"/>
  <ellipse cx="78" cy="14" rx="8" ry="5" fill="#f9fafb" stroke="none"/>
</svg>
