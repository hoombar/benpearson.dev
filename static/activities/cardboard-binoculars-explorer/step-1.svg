<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="95" width="110" height="12" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Binoculars being painted (hero, side view) -->
  <!-- Left tube -->
  <rect x="22" y="34" width="34" height="50" rx="16" fill="#22c55e" stroke="#374151" stroke-width="2.5"/>
  <!-- Right tube -->
  <rect x="64" y="34" width="34" height="50" rx="16" fill="#22c55e" stroke="#374151" stroke-width="2.5"/>

  <!-- Camouflage dabs on tubes -->
  <ellipse cx="36" cy="48" rx="6" ry="4" fill="#16a34a" stroke="none"/>
  <ellipse cx="48" cy="62" rx="5" ry="3" fill="#d97706" stroke="none"/>
  <ellipse cx="32" cy="72" rx="4" ry="3" fill="#16a34a" stroke="none"/>
  <ellipse cx="76" cy="50" rx="5" ry="3" fill="#d97706" stroke="none"/>
  <ellipse cx="88" cy="64" rx="6" ry="4" fill="#16a34a" stroke="none"/>
  <ellipse cx="80" cy="76" rx="4" ry="3" fill="#d97706" stroke="none"/>

  <!-- Tape strips still visible -->
  <rect x="50" y="42" width="22" height="4" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5" opacity="0.5"/>
  <rect x="50" y="56" width="22" height="4" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5" opacity="0.5"/>
  <rect x="50" y="70" width="22" height="4" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5" opacity="0.5"/>

  <!-- Star sticker -->
  <path d="M54,46 L55,42 L56,46 L60,46 L57,48 L58,52 L55,50 L52,52 L53,48 L50,46 Z"
        fill="#f59e0b" stroke="#374151" stroke-width="0.5"/>

  <!-- Paintbrush -->
  <line x1="108" y1="28" x2="96" y2="52" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="92" y="52" width="8" height="5" rx="1" fill="#22c55e" stroke="#374151" stroke-width="1"/>

  <!-- Paint pot -->
  <rect x="8" y="70" width="14" height="18" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <rect x="10" y="74" width="10" height="12" rx="1" fill="#22c55e" stroke="none"/>
</svg>
