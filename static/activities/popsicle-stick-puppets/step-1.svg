<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Cut-out knight character -->
  <g transform="translate(14, 12)">
    <circle cx="14" cy="10" r="9" fill="#d1d5db" stroke="#374151" stroke-width="1.2"/>
    <rect x="6" y="0" width="16" height="5" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.8"/>
    <circle cx="10" cy="10" r="1.5" fill="#374151"/>
    <circle cx="18" cy="10" r="1.5" fill="#374151"/>
    <rect x="6" y="20" width="16" height="22" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="1"/>
    <rect x="0" y="22" width="6" height="14" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="0.8"/>
    <rect x="22" y="22" width="6" height="14" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="0.8"/>
    <rect x="7" y="42" width="6" height="16" rx="1" fill="#93c5fd" stroke="#374151" stroke-width="0.8"/>
    <rect x="15" y="42" width="6" height="16" rx="1" fill="#93c5fd" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Cut-out dragon character -->
  <g transform="translate(58, 10)">
    <ellipse cx="14" cy="10" rx="12" ry="8" fill="#22c55e" stroke="#374151" stroke-width="1"/>
    <circle cx="8" cy="8" r="2" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
    <circle cx="20" cy="8" r="2" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
    <ellipse cx="14" cy="30" rx="14" ry="16" fill="#22c55e" stroke="#374151" stroke-width="1"/>
    <!-- Tail -->
    <path d="M28,30 Q36,28 40,20" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    <path d="M28,30 Q36,28 40,20" fill="none" stroke="#374151" stroke-width="0.8"/>
    <!-- Wings -->
    <path d="M0,24 Q-6,14 2,10" fill="#86efac" stroke="#374151" stroke-width="0.6"/>
    <path d="M28,24 Q34,14 26,10" fill="#86efac" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Scissors -->
  <g transform="translate(46, 66) rotate(-10)">
    <path d="M0,0 L-16,5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,0 L-16,-5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#374151"/>
    <ellipse cx="5" cy="3.5" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <ellipse cx="5" cy="-3.5" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Paper scraps -->
  <path d="M36,78 Q38,74 42,78" fill="#f9fafb" stroke="#374151" stroke-width="0.5"/>
  <path d="M50,82 Q54,78 56,82" fill="#f9fafb" stroke="#374151" stroke-width="0.5"/>
</svg>
