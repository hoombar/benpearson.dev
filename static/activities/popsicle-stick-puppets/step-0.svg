<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper with characters being drawn -->
  <rect x="10" y="6" width="68" height="88" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>

  <!-- Character 1 - Knight (drawn on paper) -->
  <g transform="translate(18, 14)">
    <!-- Head with helmet -->
    <circle cx="10" cy="8" r="7" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
    <rect x="4" y="0" width="12" height="4" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <!-- Eyes -->
    <circle cx="7" cy="8" r="1" fill="#374151"/>
    <circle cx="13" cy="8" r="1" fill="#374151"/>
    <!-- Body/armor -->
    <rect x="4" y="16" width="12" height="18" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="0.8"/>
    <!-- Arms -->
    <rect x="0" y="18" width="4" height="10" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="0.6"/>
    <rect x="16" y="18" width="4" height="10" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="0.6"/>
    <!-- Shield -->
    <path d="M20,20 L26,20 L26,28 L23,32 L20,28 Z" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
    <!-- Legs -->
    <rect x="5" y="34" width="4" height="12" rx="1" fill="#93c5fd" stroke="#374151" stroke-width="0.6"/>
    <rect x="11" y="34" width="4" height="12" rx="1" fill="#93c5fd" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Character 2 - Dragon (partially drawn) -->
  <g transform="translate(52, 16)">
    <!-- Head -->
    <ellipse cx="10" cy="8" rx="8" ry="6" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <circle cx="6" cy="6" r="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <circle cx="14" cy="6" r="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <!-- Mouth -->
    <path d="M4,12 L16,12" stroke="#374151" stroke-width="0.8"/>
    <!-- Body -->
    <ellipse cx="10" cy="24" rx="10" ry="12" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <!-- Spines -->
    <path d="M10,12 L8,8 L12,8" fill="#4ade80" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Marker in use -->
  <g transform="translate(66, 48) rotate(-20)">
    <rect x="0" y="0" width="6" height="26" rx="2" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <rect x="0.5" y="26" width="5" height="3" rx="1" fill="#374151" stroke="none"/>
  </g>

  <!-- Other markers -->
  <rect x="86" y="20" width="5" height="22" rx="1.5" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
  <rect x="94" y="18" width="5" height="24" rx="1.5" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>
  <rect x="102" y="22" width="5" height="20" rx="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
</svg>
