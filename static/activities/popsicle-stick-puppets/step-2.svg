<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Completed puppet 1 - Knight on stick -->
  <g transform="translate(10, 4)">
    <!-- Popsicle stick -->
    <rect x="10" y="52" width="6" height="42" rx="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <!-- Knight character on top -->
    <circle cx="13" cy="10" r="8" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
    <rect x="6" y="1" width="14" height="4" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <circle cx="10" cy="10" r="1.2" fill="#374151"/>
    <circle cx="16" cy="10" r="1.2" fill="#374151"/>
    <rect x="6" y="18" width="14" height="18" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="0.8"/>
    <rect x="1" y="20" width="5" height="10" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="0.6"/>
    <rect x="20" y="20" width="5" height="10" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="0.6"/>
    <rect x="7" y="36" width="5" height="14" rx="1" fill="#93c5fd" stroke="#374151" stroke-width="0.6"/>
    <rect x="14" y="36" width="5" height="14" rx="1" fill="#93c5fd" stroke="#374151" stroke-width="0.6"/>
    <!-- Tape strip -->
    <rect x="4" y="48" width="18" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.4" opacity="0.7"/>
  </g>

  <!-- Puppet 2 being assembled - Dragon + stick + tape -->
  <g transform="translate(52, 6)">
    <!-- Popsicle stick -->
    <rect x="10" y="46" width="6" height="42" rx="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <!-- Dragon on top -->
    <ellipse cx="13" cy="10" rx="10" ry="7" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <circle cx="8" cy="8" r="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <circle cx="18" cy="8" r="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <ellipse cx="13" cy="28" rx="12" ry="14" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <path d="M25,28 Q32,26 36,20" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <path d="M25,28 Q32,26 36,20" fill="none" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Tape being applied -->
  <rect x="56" y="48" width="18" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.4" opacity="0.7"/>

  <!-- Tape roll -->
  <circle cx="102" cy="60" r="10" fill="#fde68a" stroke="#374151" stroke-width="1"/>
  <circle cx="102" cy="60" r="4" fill="#f9fafb" stroke="#374151" stroke-width="0.6"/>

  <!-- Extra popsicle sticks -->
  <rect x="88" y="76" width="5" height="20" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
  <rect x="96" y="78" width="5" height="18" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
  <rect x="104" y="76" width="5" height="20" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
</svg>
