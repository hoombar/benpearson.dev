<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="120" height="120" fill="#f3f4f6" stroke="none"/>

  <!-- Sofa back (puppet stage) -->
  <rect x="0" y="56" width="120" height="64" rx="8" fill="#a78bfa" stroke="#374151" stroke-width="1.5"/>
  <path d="M0,62 Q60,54 120,62" fill="#c4b5fd" stroke="none"/>

  <!-- Knight puppet popping up from behind sofa -->
  <g transform="translate(22, 2)">
    <rect x="10" y="38" width="5" height="22" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <circle cx="12" cy="10" r="7" fill="#d1d5db" stroke="#374151" stroke-width="0.8"/>
    <rect x="6" y="2" width="12" height="4" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.5"/>
    <circle cx="9" cy="10" r="1" fill="#374151"/>
    <circle cx="15" cy="10" r="1" fill="#374151"/>
    <rect x="6" y="18" width="12" height="16" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="0.7"/>
    <rect x="1" y="20" width="5" height="8" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="0.5"/>
    <rect x="18" y="20" width="5" height="8" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Dragon puppet popping up -->
  <g transform="translate(58, 6)">
    <rect x="10" y="36" width="5" height="18" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="12" cy="8" rx="10" ry="6" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <circle cx="7" cy="6" r="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.3"/>
    <circle cx="17" cy="6" r="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.3"/>
    <ellipse cx="12" cy="24" rx="10" ry="10" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <!-- Fire breath! -->
    <path d="M22,8 Q28,6 32,10 Q36,6 38,12" fill="#f97316" stroke="#374151" stroke-width="0.5" opacity="0.8"/>
    <path d="M24,10 Q28,8 30,12" fill="#fbbf24" stroke="none" opacity="0.6"/>
  </g>

  <!-- Speech/action lines -->
  <line x1="38" y1="18" x2="42" y2="14" stroke="#374151" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="40" y1="22" x2="46" y2="20" stroke="#374151" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="82" y1="16" x2="86" y2="12" stroke="#374151" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="84" y1="22" x2="90" y2="20" stroke="#374151" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Audience area below (floor) -->
  <rect x="0" y="110" width="120" height="10" fill="#e5e7eb" stroke="none"/>
</svg>
