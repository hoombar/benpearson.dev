<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Sheet of paper -->
  <rect x="10" y="10" width="80" height="82" rx="1" fill="white" stroke="#374151" stroke-width="1"/>

  <!-- Sheep body being covered with cotton wool (hero) -->
  <g transform="translate(16, 24)">
    <!-- Body outline (partially covered) -->
    <path d="M20,40 Q2,38 4,24 Q6,12 18,8 Q28,4 38,8 Q48,4 56,10 Q66,14 64,26 Q68,36 56,42 Q44,48 32,46 Q22,46 20,40 Z" fill="#f3f4f6" stroke="#374151" stroke-width="1"/>

    <!-- Cotton wool puffs (fluffy circles) -->
    <circle cx="20" cy="16" r="7" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="34" cy="12" r="8" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="48" cy="14" r="7" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="56" cy="24" r="7" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="50" cy="34" r="8" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="36" cy="36" r="7" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="24" cy="32" r="7" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="12" cy="26" r="6" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="38" cy="24" r="6" fill="white" stroke="#d1d5db" stroke-width="0.8"/>

    <!-- Head circle (empty, no wool) -->
    <circle cx="8" cy="44" r="12" fill="none" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Glue being applied -->
  <g transform="translate(80, 30) rotate(20)">
    <!-- PVA glue bottle -->
    <rect x="0" y="-6" width="24" height="12" rx="3" fill="white" stroke="#374151" stroke-width="0.8"/>
    <!-- Nozzle -->
    <path d="M-2,-3 L-6,0 L-2,3" fill="#f97316" stroke="#374151" stroke-width="0.6"/>
    <!-- Label -->
    <rect x="6" y="-4" width="12" height="8" rx="1" fill="#f97316" stroke="none" opacity="0.6"/>
  </g>

  <!-- Cotton wool puff being placed -->
  <circle cx="100" cy="64" r="8" fill="white" stroke="#d1d5db" stroke-width="1"/>

  <!-- Arrow showing placement -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M96,56 Q88,52 80,54" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Extra cotton wool on table -->
  <circle cx="98" cy="84" r="6" fill="white" stroke="#d1d5db" stroke-width="0.6"/>
  <circle cx="108" cy="78" r="5" fill="white" stroke="#d1d5db" stroke-width="0.6"/>
</svg>
