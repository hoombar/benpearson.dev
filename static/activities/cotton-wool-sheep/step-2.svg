<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Sheet of paper -->
  <rect x="10" y="10" width="80" height="82" rx="1" fill="white" stroke="#374151" stroke-width="1"/>

  <!-- Sheep with woolly body and face being added (hero) -->
  <g transform="translate(16, 24)">
    <!-- Woolly body (cotton wool puffs) -->
    <circle cx="20" cy="16" r="7" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="34" cy="12" r="8" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="48" cy="14" r="7" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="56" cy="24" r="7" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="50" cy="34" r="8" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="36" cy="36" r="7" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="24" cy="32" r="7" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="12" cy="26" r="6" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="38" cy="24" r="6" fill="white" stroke="#d1d5db" stroke-width="0.8"/>

    <!-- Black head -->
    <circle cx="8" cy="44" r="12" fill="#374151" stroke="#374151" stroke-width="1"/>

    <!-- Googly eyes -->
    <circle cx="4" cy="42" r="3.5" fill="white" stroke="#374151" stroke-width="0.6"/>
    <circle cx="4" cy="43" r="1.8" fill="#374151"/>
    <circle cx="12" cy="42" r="3.5" fill="white" stroke="#374151" stroke-width="0.6"/>
    <circle cx="12" cy="43" r="1.8" fill="#374151"/>

    <!-- Nose -->
    <ellipse cx="8" cy="49" rx="1.5" ry="1" fill="#9ca3af"/>

    <!-- Smile -->
    <path d="M4,51 Q8,54 12,51" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Ears -->
    <ellipse cx="-2" cy="40" rx="4" ry="2.5" fill="#374151" stroke="#1f2937" stroke-width="0.5" transform="rotate(-20, -2, 40)"/>
    <ellipse cx="-2" cy="40" rx="2.5" ry="1.5" fill="#fda4af" stroke="none" transform="rotate(-20, -2, 40)"/>
    <ellipse cx="18" cy="40" rx="4" ry="2.5" fill="#374151" stroke="#1f2937" stroke-width="0.5" transform="rotate(20, 18, 40)"/>
    <ellipse cx="18" cy="40" rx="2.5" ry="1.5" fill="#fda4af" stroke="none" transform="rotate(20, 18, 40)"/>
  </g>

  <!-- Marker being used on face -->
  <g transform="translate(50, 66) rotate(30)">
    <rect x="0" y="-3" width="28" height="6" rx="2" fill="#374151" stroke="#374151" stroke-width="0.6"/>
    <polygon points="0,-1 0,1 -3,0" fill="#374151"/>
  </g>

  <!-- Spare googly eye -->
  <circle cx="100" cy="86" r="4" fill="white" stroke="#374151" stroke-width="0.6"/>
  <circle cx="100" cy="87" r="2" fill="#374151"/>
</svg>
