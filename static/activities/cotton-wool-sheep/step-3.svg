<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Grassy background hint -->
  <rect x="0" y="88" width="120" height="32" rx="2" fill="#d1fae5"/>
  <!-- Table/ground surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#86efac" stroke="#374151" stroke-width="1.5"/>

  <!-- Completed sheep (hero) -->
  <g transform="translate(18, 16)">
    <!-- Woolly body -->
    <circle cx="24" cy="16" r="8" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="40" cy="12" r="9" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="56" cy="14" r="8" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="64" cy="26" r="8" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="56" cy="38" r="9" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="40" cy="40" r="8" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="28" cy="36" r="8" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="16" cy="28" r="7" fill="white" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="44" cy="26" r="7" fill="white" stroke="#d1d5db" stroke-width="0.8"/>

    <!-- Black head -->
    <circle cx="10" cy="48" r="14" fill="#374151" stroke="#374151" stroke-width="1"/>

    <!-- Ears -->
    <ellipse cx="0" cy="44" rx="5" ry="3" fill="#374151" stroke="#1f2937" stroke-width="0.5" transform="rotate(-20, 0, 44)"/>
    <ellipse cx="0" cy="44" rx="3" ry="1.8" fill="#fda4af" stroke="none" transform="rotate(-20, 0, 44)"/>
    <ellipse cx="20" cy="44" rx="5" ry="3" fill="#374151" stroke="#1f2937" stroke-width="0.5" transform="rotate(20, 20, 44)"/>
    <ellipse cx="20" cy="44" rx="3" ry="1.8" fill="#fda4af" stroke="none" transform="rotate(20, 20, 44)"/>

    <!-- Googly eyes -->
    <circle cx="6" cy="46" r="4" fill="white" stroke="#374151" stroke-width="0.6"/>
    <circle cx="6" cy="47" r="2" fill="#374151"/>
    <circle cx="14" cy="46" r="4" fill="white" stroke="#374151" stroke-width="0.6"/>
    <circle cx="14" cy="47" r="2" fill="#374151"/>

    <!-- Nose and smile -->
    <ellipse cx="10" cy="53" rx="2" ry="1" fill="#9ca3af"/>
    <path d="M6,55 Q10,58 14,55" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Pipe cleaner legs -->
    <!-- Front legs (V shape) -->
    <line x1="24" y1="48" x2="20" y2="72" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="48" x2="28" y2="72" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Back legs (V shape) -->
    <line x1="56" y1="48" x2="52" y2="72" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="56" y1="48" x2="60" y2="72" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Small flowers in grass -->
  <circle cx="8" cy="96" r="2.5" fill="#fbbf24" stroke="#374151" stroke-width="0.3"/>
  <circle cx="100" cy="94" r="2.5" fill="#f472b6" stroke="#374151" stroke-width="0.3"/>
  <circle cx="112" cy="98" r="2" fill="#fbbf24" stroke="#374151" stroke-width="0.3"/>
</svg>
