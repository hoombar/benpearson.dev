<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Glass jar/vase -->
  <path d="M38,58 L34,96 Q34,100 40,100 L80,100 Q86,100 86,96 L82,58" fill="#dbeafe" stroke="#374151" stroke-width="1.5" opacity="0.5"/>
  <!-- Jar rim -->
  <ellipse cx="60" cy="58" rx="22" ry="5" fill="#dbeafe" stroke="#374151" stroke-width="1.2" opacity="0.6"/>

  <!-- Flower 1 - Red (tall, centre) -->
  <g transform="translate(50, 6)">
    <!-- Petals -->
    <path d="M10,20 Q4,14 4,8 Q4,2 10,6" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <path d="M10,6 Q14,0 18,2 Q22,4 18,10" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <path d="M18,10 Q24,8 24,14 Q24,20 18,18" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <path d="M18,18 Q16,24 10,22 Q6,20 10,16" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <circle cx="14" cy="14" r="3" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
    <!-- Pipe cleaner stem -->
    <line x1="14" y1="22" x2="14" y2="56" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Leaf -->
    <path d="M14,38 Q6,34 2,38 Q6,42 14,38" fill="#22c55e" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Flower 2 - Yellow (left) -->
  <g transform="translate(28, 14)">
    <path d="M10,18 Q4,12 6,6 Q8,2 12,6" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <path d="M12,6 Q16,0 20,4 Q22,8 18,12" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <path d="M18,12 Q24,10 22,16 Q20,20 16,18" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <path d="M16,18 Q12,22 8,18 Q6,16 10,14" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <circle cx="14" cy="12" r="3" fill="#ef4444" stroke="#374151" stroke-width="0.5"/>
    <line x1="14" y1="20" x2="16" y2="50" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M15,34 Q22,30 26,34 Q22,38 15,34" fill="#22c55e" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Flower 3 - Purple (right) -->
  <g transform="translate(68, 12)">
    <path d="M10,18 Q2,14 4,8 Q6,2 12,6" fill="#a78bfa" stroke="#374151" stroke-width="0.8"/>
    <path d="M12,6 Q16,0 20,4 Q24,8 18,10" fill="#a78bfa" stroke="#374151" stroke-width="0.8"/>
    <path d="M18,10 Q24,14 22,18 Q20,22 16,18" fill="#a78bfa" stroke="#374151" stroke-width="0.8"/>
    <path d="M16,18 Q12,24 8,20 Q4,18 10,14" fill="#a78bfa" stroke="#374151" stroke-width="0.8"/>
    <circle cx="14" cy="13" r="3" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
    <line x1="14" y1="22" x2="12" y2="52" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M13,36 Q6,32 2,36 Q6,40 13,36" fill="#22c55e" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Flower 4 - Pink (far left) -->
  <g transform="translate(18, 22)">
    <path d="M8,14 Q2,10 4,4 Q6,0 10,4 Q14,0 16,4 Q18,10 12,14" fill="#f9a8d4" stroke="#374151" stroke-width="0.6"/>
    <circle cx="10" cy="10" r="2" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <line x1="10" y1="16" x2="12" y2="42" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Flower 5 - Orange (far right) -->
  <g transform="translate(82, 20)">
    <path d="M8,14 Q2,10 4,4 Q6,0 10,4 Q14,0 16,4 Q18,10 12,14" fill="#fb923c" stroke="#374151" stroke-width="0.6"/>
    <circle cx="10" cy="10" r="2" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
    <line x1="10" y1="16" x2="8" y2="44" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
