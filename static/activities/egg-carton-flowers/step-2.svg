<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Painted flower 1 - red (hero, being painted) -->
  <g transform="translate(18, 10)">
    <path d="M14,50 Q14,58 20,62 L44,62 Q50,58 50,50" fill="#ef4444" stroke="#374151" stroke-width="1"/>
    <path d="M14,50 Q8,42 6,32 Q4,24 14,28 Q18,32 20,40" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <path d="M20,40 Q22,28 28,22 Q34,18 36,28 Q36,36 34,42" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <path d="M34,42 Q38,30 44,24 Q50,20 50,30 Q50,40 48,46" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <path d="M48,46 Q54,38 58,34 Q62,30 60,40 Q58,48 54,52" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <!-- Yellow centre dot -->
    <circle cx="32" cy="52" r="5" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Painted flower 2 - yellow -->
  <g transform="translate(6, 72)">
    <path d="M6,14 Q6,20 10,22 L22,22 Q26,20 26,14" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <path d="M6,14 Q2,8 4,2 Q8,0 10,6 Q12,10 12,14" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <path d="M12,14 Q14,6 16,2 Q20,0 20,6 Q20,10 20,14" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <path d="M20,14 Q24,8 26,2 Q28,0 28,8 Q28,12 26,14" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <circle cx="16" cy="16" r="3" fill="#ef4444" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Painted flower 3 - purple -->
  <g transform="translate(42, 74)">
    <path d="M6,12 Q6,18 10,20 L22,20 Q26,18 26,12" fill="#a78bfa" stroke="#374151" stroke-width="0.8"/>
    <path d="M6,12 Q0,4 4,0 Q8,-2 10,4 Q12,8 12,12" fill="#a78bfa" stroke="#374151" stroke-width="0.6"/>
    <path d="M12,12 Q14,2 16,-2 Q20,-4 20,4 Q20,8 20,12" fill="#a78bfa" stroke="#374151" stroke-width="0.6"/>
    <path d="M20,12 Q24,4 28,0 Q30,-2 28,6 Q28,10 26,12" fill="#a78bfa" stroke="#374151" stroke-width="0.6"/>
    <circle cx="16" cy="14" r="3" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Paintbrush in use -->
  <g transform="translate(64, 30) rotate(-30)">
    <rect x="-3" y="-36" width="6" height="28" rx="1.5" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-10" width="8" height="5" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <rect x="-5" y="-5" width="10" height="8" rx="1" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pots -->
  <rect x="86" y="60" width="14" height="16" rx="2" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
  <rect x="102" y="62" width="14" height="16" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  <rect x="86" y="80" width="14" height="16" rx="2" fill="#a78bfa" stroke="#374151" stroke-width="0.8"/>
  <rect x="102" y="82" width="14" height="16" rx="2" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
</svg>
