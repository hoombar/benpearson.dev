<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Egg carton (open, showing cups) -->
  <g transform="translate(8, 16)">
    <!-- Carton base -->
    <rect x="0" y="20" width="80" height="36" rx="3" fill="#d6d3d1" stroke="#374151" stroke-width="1.2"/>
    <!-- Individual cups (2 rows of 4 visible) -->
    <!-- Top row -->
    <path d="M6,20 Q6,30 10,36 L18,36 Q22,30 22,20" fill="#d6d3d1" stroke="#374151" stroke-width="0.8"/>
    <path d="M26,20 Q26,30 30,36 L38,36 Q42,30 42,20" fill="#d6d3d1" stroke="#374151" stroke-width="0.8"/>
    <path d="M46,20 Q46,30 50,36 L58,36 Q62,30 62,20" fill="#d6d3d1" stroke="#374151" stroke-width="0.8"/>
    <path d="M66,20 Q66,30 70,36 L78,36 Q82,30 82,20" fill="#d6d3d1" stroke="#374151" stroke-width="0.8"/>
    <!-- Bottom row -->
    <path d="M6,38 Q6,48 10,54 L18,54 Q22,48 22,38" fill="#d6d3d1" stroke="#374151" stroke-width="0.8"/>
    <path d="M26,38 Q26,48 30,54 L38,54 Q42,48 42,38" fill="#d6d3d1" stroke="#374151" stroke-width="0.8"/>
    <!-- Missing cup (already cut out) -->
    <rect x="46" y="38" width="16" height="16" fill="#fef3c7" stroke="#374151" stroke-width="0.5" stroke-dasharray="2,2"/>
    <path d="M66,38 Q66,48 70,54 L78,54 Q82,48 82,38" fill="#d6d3d1" stroke="#374151" stroke-width="0.8"/>
    <!-- Carton lid (folded back) -->
    <rect x="0" y="6" width="80" height="14" rx="3" fill="#e7e5e4" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Cut-out cup sitting separately -->
  <g transform="translate(78, 62)">
    <path d="M0,0 Q0,14 6,20 L22,20 Q28,14 28,0" fill="#d6d3d1" stroke="#374151" stroke-width="1.2"/>
    <!-- Cup bottom -->
    <path d="M6,20 Q14,24 22,20" fill="#d6d3d1" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Scissors -->
  <g transform="translate(56, 72) rotate(-20)">
    <path d="M0,0 L-16,5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,0 L-16,-5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#374151" stroke="none"/>
    <ellipse cx="5" cy="3.5" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <ellipse cx="5" cy="-3.5" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Dashed cut line on carton -->
  <rect x="54" y="54" width="16" height="2" fill="none" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="2,2"/>
</svg>
