<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="120" height="120" fill="#e0f2fe"/>
  <rect x="0" y="85" width="120" height="35" fill="#bae6fd"/>
  <!-- Tube -->
  <rect x="45" y="20" width="14" height="60" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
  <!-- Small cardboard head -->
  <polygon points="40,80 64,80 68,95 36,95" fill="#f59e0b" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <!-- Tape pieces -->
  <rect x="42" y="75" width="20" height="6" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
  <rect x="47" y="78" width="6" height="10" fill="#9ca3af" stroke="#374151" stroke-width="1" transform="rotate(45 50 83)"/>
  <!-- Action arrow -->
  <path d="M25,65 Q35,55 42,70" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="42,75 39,70 45,70" fill="#374151"/>
  <!-- Tape roll -->
  <circle cx="20" cy="50" r="10" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
  <circle cx="20" cy="50" r="4" fill="#e0f2fe" stroke="#374151" stroke-width="1.5"/>
</svg>