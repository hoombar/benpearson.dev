<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="120" height="120" fill="#fef3c7"/>
  <rect x="0" y="80" width="120" height="40" fill="#fde68a"/>
  <!-- Cardboard box -->
  <path d="M20,60 L100,60 L110,80 L10,80 Z" fill="#d97706" stroke="#374151" stroke-width="2"/>
  <rect x="20" y="40" width="80" height="20" fill="#f59e0b" stroke="#374151" stroke-width="2"/>
  <path d="M45,60 Q60,40 75,60" fill="#fef3c7" stroke="#374151" stroke-width="2"/> <!-- Cut archway -->
  <!-- Scissors cutting -->
  <g transform="translate(60, 40) rotate(-45)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="14" y2="4" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-4" cy="-4" r="4" fill="#ef4444" stroke="#374151" stroke-width="2"/>
    <circle cx="-4" cy="4" r="4" fill="#ef4444" stroke="#374151" stroke-width="2"/>
  </g>
  <!-- Motion line -->
  <line x1="55" y1="25" x2="60" y2="35" stroke="#374151" stroke-width="1.5" stroke-dasharray="2,2"/>
</svg>