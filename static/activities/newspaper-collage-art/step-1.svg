<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Background paper/card -->
  <rect x="10" y="10" width="76" height="82" rx="2" fill="white" stroke="#374151" stroke-width="1.5"/>

  <!-- Owl shape laid out from newspaper pieces (not glued yet, slightly lifted) -->

  <!-- Body (large oval of newspaper) -->
  <ellipse cx="48" cy="56" rx="22" ry="26" fill="#f5f5f4" stroke="#374151" stroke-width="0.8"/>
  <line x1="32" y1="42" x2="60" y2="42" stroke="#e5e7eb" stroke-width="0.6"/>
  <line x1="30" y1="46" x2="62" y2="46" stroke="#e5e7eb" stroke-width="0.6"/>
  <line x1="30" y1="50" x2="62" y2="50" stroke="#e5e7eb" stroke-width="0.6"/>
  <line x1="30" y1="54" x2="64" y2="54" stroke="#e5e7eb" stroke-width="0.6"/>
  <line x1="30" y1="58" x2="62" y2="58" stroke="#e5e7eb" stroke-width="0.6"/>
  <line x1="32" y1="62" x2="60" y2="62" stroke="#e5e7eb" stroke-width="0.6"/>
  <line x1="34" y1="66" x2="58" y2="66" stroke="#e5e7eb" stroke-width="0.6"/>

  <!-- Head (circle of newspaper) -->
  <circle cx="48" cy="26" r="14" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
  <line x1="38" y1="22" x2="58" y2="22" stroke="#d1d5db" stroke-width="1"/>
  <line x1="38" y1="26" x2="56" y2="26" stroke="#d1d5db" stroke-width="0.6"/>

  <!-- Ear tufts (small triangles) -->
  <polygon points="38,14 34,8 42,12" fill="#f5f5f4" stroke="#374151" stroke-width="0.6"/>
  <polygon points="58,14 62,8 54,12" fill="#f5f5f4" stroke="#374151" stroke-width="0.6"/>

  <!-- Wings (newspaper strips) -->
  <path d="M26,44 Q18,54 22,68" fill="#f5f5f4" stroke="#374151" stroke-width="0.8"/>
  <path d="M26,44 L18,54 L22,68 Z" fill="#f5f5f4" stroke="#374151" stroke-width="0.6"/>
  <path d="M70,44 Q78,54 74,68" fill="#f5f5f4" stroke="#374151" stroke-width="0.8"/>
  <path d="M70,44 L78,54 L74,68 Z" fill="#f5f5f4" stroke="#374151" stroke-width="0.6"/>

  <!-- Feet (small strips) -->
  <rect x="38" y="80" width="8" height="4" rx="1" fill="#f5f5f4" stroke="#374151" stroke-width="0.5"/>
  <rect x="50" y="80" width="8" height="4" rx="1" fill="#f5f5f4" stroke="#374151" stroke-width="0.5"/>

  <!-- Hand moving a piece into position -->
  <g transform="translate(74, 38)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Spare newspaper pieces nearby -->
  <path d="M92,68 L108,68 Q108,72 106,74 L108,78 Q104,76 100,78 L92,78 Z" fill="#f5f5f4" stroke="#374151" stroke-width="0.5"/>
  <line x1="94" y1="72" x2="106" y2="72" stroke="#e5e7eb" stroke-width="0.5"/>
  <rect x="92" y="82" width="14" height="10" rx="0.5" fill="#f5f5f4" stroke="#374151" stroke-width="0.5"/>
  <line x1="94" y1="86" x2="104" y2="86" stroke="#e5e7eb" stroke-width="0.5"/>
</svg>
