<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Background paper -->
  <rect x="10" y="10" width="76" height="82" rx="2" fill="white" stroke="#374151" stroke-width="1.5"/>

  <!-- Owl body glued down (flatter, pressed) -->
  <ellipse cx="48" cy="56" rx="22" ry="26" fill="#f5f5f4" stroke="#374151" stroke-width="1"/>
  <line x1="30" y1="42" x2="62" y2="42" stroke="#e5e7eb" stroke-width="0.6"/>
  <line x1="28" y1="46" x2="64" y2="46" stroke="#e5e7eb" stroke-width="0.6"/>
  <line x1="28" y1="50" x2="64" y2="50" stroke="#e5e7eb" stroke-width="0.6"/>
  <line x1="28" y1="54" x2="66" y2="54" stroke="#e5e7eb" stroke-width="0.6"/>
  <line x1="28" y1="58" x2="64" y2="58" stroke="#e5e7eb" stroke-width="0.6"/>
  <line x1="30" y1="62" x2="62" y2="62" stroke="#e5e7eb" stroke-width="0.6"/>
  <line x1="32" y1="66" x2="60" y2="66" stroke="#e5e7eb" stroke-width="0.6"/>

  <!-- Head glued -->
  <circle cx="48" cy="26" r="14" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <line x1="38" y1="22" x2="58" y2="22" stroke="#d1d5db" stroke-width="1"/>
  <line x1="38" y1="26" x2="56" y2="26" stroke="#d1d5db" stroke-width="0.6"/>

  <!-- Ear tufts -->
  <polygon points="38,14 34,8 42,12" fill="#f5f5f4" stroke="#374151" stroke-width="0.6"/>
  <polygon points="58,14 62,8 54,12" fill="#f5f5f4" stroke="#374151" stroke-width="0.6"/>

  <!-- Wings -->
  <path d="M26,44 L18,54 L22,68 Z" fill="#f5f5f4" stroke="#374151" stroke-width="0.8"/>
  <path d="M70,44 L78,54 L74,68 Z" fill="#f5f5f4" stroke="#374151" stroke-width="0.8"/>

  <!-- Feet -->
  <rect x="38" y="80" width="8" height="4" rx="1" fill="#f5f5f4" stroke="#374151" stroke-width="0.5"/>
  <rect x="50" y="80" width="8" height="4" rx="1" fill="#f5f5f4" stroke="#374151" stroke-width="0.5"/>

  <!-- Paintbrush spreading glue on a piece being attached -->
  <g transform="translate(60, 64)">
    <!-- Handle -->
    <rect x="0" y="0" width="5" height="28" rx="2" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
    <!-- Ferrule -->
    <rect x="-0.5" y="26" width="6" height="4" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="0.5"/>
    <!-- Bristles with glue -->
    <rect x="0" y="29" width="5" height="6" rx="2" fill="#fef9c3" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Hand holding brush -->
  <g transform="translate(68, 60)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Glue bottle -->
  <g transform="translate(92, 16)">
    <rect x="0" y="8" width="14" height="22" rx="3" fill="white" stroke="#374151" stroke-width="1"/>
    <rect x="3" y="0" width="8" height="10" rx="2" fill="#f97316" stroke="#374151" stroke-width="0.8"/>
    <rect x="5" y="-3" width="4" height="4" rx="1" fill="#f97316" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Glue sheen on freshly pressed piece -->
  <ellipse cx="48" cy="70" rx="14" ry="6" fill="none" stroke="#fde68a" stroke-width="0.5" opacity="0.5"/>
</svg>
