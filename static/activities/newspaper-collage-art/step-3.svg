<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Background paper with completed owl collage -->
  <rect x="10" y="6" width="76" height="86" rx="2" fill="white" stroke="#374151" stroke-width="1.5"/>

  <!-- Owl body (newspaper) -->
  <ellipse cx="48" cy="52" rx="22" ry="26" fill="#f5f5f4" stroke="#374151" stroke-width="1"/>
  <line x1="30" y1="38" x2="62" y2="38" stroke="#e5e7eb" stroke-width="0.5"/>
  <line x1="28" y1="42" x2="64" y2="42" stroke="#e5e7eb" stroke-width="0.5"/>
  <line x1="28" y1="46" x2="64" y2="46" stroke="#e5e7eb" stroke-width="0.5"/>
  <line x1="28" y1="50" x2="66" y2="50" stroke="#e5e7eb" stroke-width="0.5"/>
  <line x1="28" y1="54" x2="64" y2="54" stroke="#e5e7eb" stroke-width="0.5"/>
  <line x1="30" y1="58" x2="62" y2="58" stroke="#e5e7eb" stroke-width="0.5"/>
  <line x1="32" y1="62" x2="60" y2="62" stroke="#e5e7eb" stroke-width="0.5"/>

  <!-- Head -->
  <circle cx="48" cy="22" r="14" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <line x1="38" y1="18" x2="58" y2="18" stroke="#d1d5db" stroke-width="0.8"/>
  <line x1="38" y1="22" x2="56" y2="22" stroke="#d1d5db" stroke-width="0.5"/>

  <!-- Ear tufts -->
  <polygon points="38,10 34,4 42,8" fill="#f5f5f4" stroke="#374151" stroke-width="0.6"/>
  <polygon points="58,10 62,4 54,8" fill="#f5f5f4" stroke="#374151" stroke-width="0.6"/>

  <!-- Wings -->
  <path d="M26,40 L18,50 L22,64 Z" fill="#f5f5f4" stroke="#374151" stroke-width="0.8"/>
  <path d="M70,40 L78,50 L74,64 Z" fill="#f5f5f4" stroke="#374151" stroke-width="0.8"/>

  <!-- Feet -->
  <rect x="38" y="76" width="8" height="4" rx="1" fill="#f5f5f4" stroke="#374151" stroke-width="0.5"/>
  <rect x="50" y="76" width="8" height="4" rx="1" fill="#f5f5f4" stroke="#374151" stroke-width="0.5"/>

  <!-- ADDED DETAILS — drawn with markers/paint -->
  <!-- Big eyes -->
  <circle cx="42" cy="20" r="5" fill="#fbbf24" stroke="#374151" stroke-width="1.2"/>
  <circle cx="42" cy="20" r="2.5" fill="#374151"/>
  <circle cx="54" cy="20" r="5" fill="#fbbf24" stroke="#374151" stroke-width="1.2"/>
  <circle cx="54" cy="20" r="2.5" fill="#374151"/>

  <!-- Beak -->
  <polygon points="48,24 45,28 51,28" fill="#f97316" stroke="#374151" stroke-width="0.8"/>

  <!-- Feather details drawn on body -->
  <path d="M36,44 Q40,40 44,44" fill="none" stroke="#f97316" stroke-width="1" stroke-linecap="round"/>
  <path d="M44,44 Q48,40 52,44" fill="none" stroke="#f97316" stroke-width="1" stroke-linecap="round"/>
  <path d="M52,44 Q56,40 60,44" fill="none" stroke="#f97316" stroke-width="1" stroke-linecap="round"/>
  <path d="M34,50 Q38,46 42,50" fill="none" stroke="#ef4444" stroke-width="1" stroke-linecap="round"/>
  <path d="M42,50 Q46,46 50,50" fill="none" stroke="#ef4444" stroke-width="1" stroke-linecap="round"/>
  <path d="M50,50 Q54,46 58,50" fill="none" stroke="#ef4444" stroke-width="1" stroke-linecap="round"/>

  <!-- Branch the owl sits on (drawn) -->
  <line x1="14" y1="80" x2="82" y2="80" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
  <!-- Leaf -->
  <ellipse cx="76" cy="76" rx="6" ry="3" fill="#22c55e" stroke="#374151" stroke-width="0.5" transform="rotate(-20 76 76)"/>

  <!-- Marker in use -->
  <g transform="translate(86, 28)">
    <rect x="0" y="0" width="8" height="26" rx="2" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <rect x="0" y="22" width="8" height="4" rx="1" fill="#b91c1c" stroke="#374151" stroke-width="0.5"/>
    <polygon points="2,26 6,26 4,30" fill="#374151"/>
  </g>

  <!-- Hand holding marker -->
  <g transform="translate(94, 22)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- More markers nearby -->
  <g transform="translate(96, 64)">
    <rect x="0" y="0" width="6" height="22" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="0.5"/>
    <rect x="0" y="18" width="6" height="4" rx="1" fill="#2563eb" stroke="#374151" stroke-width="0.4"/>
  </g>
  <g transform="translate(106, 68)">
    <rect x="0" y="0" width="6" height="20" rx="2" fill="#22c55e" stroke="#374151" stroke-width="0.5"/>
    <rect x="0" y="16" width="6" height="4" rx="1" fill="#16a34a" stroke="#374151" stroke-width="0.4"/>
  </g>
</svg>
