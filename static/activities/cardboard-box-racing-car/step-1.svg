<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(15, 30)">
    <!-- Box, now painted red -->
    <rect x="10" y="20" width="70" height="50" fill="#ef4444" stroke="#374151" stroke-width="2"/>
    <!-- Yellow racing stripe -->
    <rect x="10" y="35" width="70" height="10" fill="#fde047" stroke="#374151" stroke-width="1.5"/>
    
    <!-- Door is folded down -->
    <path d="M 25 70 L 65 70 L 60 90 L 30 90 Z" fill="#fca5a5" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Paintbrush painting the box -->
    <g transform="translate(75, 40) rotate(-45)">
      <line x1="-20" y1="0" x2="5" y2="0" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <path d="M 5 -3 L 15 -2 L 15 2 L 5 3 Z" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    </g>
    <!-- Motion lines -->
    <path d="M 85 25 L 95 35" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 90 20 L 100 30" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>