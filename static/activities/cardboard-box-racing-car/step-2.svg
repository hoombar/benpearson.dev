<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(15, 25)">
    <!-- Box, red with yellow stripe -->
    <rect x="10" y="20" width="70" height="50" fill="#ef4444" stroke="#374151" stroke-width="2"/>
    <rect x="10" y="35" width="70" height="10" fill="#fde047" stroke="#374151" stroke-width="1.5"/>
    
    <!-- Back wheel (left) partially visible -->
    <circle cx="10" cy="70" r="12" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <circle cx="10" cy="70" r="4" fill="#f3f4f6" stroke="#374151" stroke-width="1"/>

    <!-- Front wheel (left) visible -->
    <circle cx="20" cy="75" r="14" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <circle cx="20" cy="75" r="5" fill="#f3f4f6" stroke="#374151" stroke-width="1"/>
    
    <!-- Front wheel (right) visible -->
    <circle cx="70" cy="75" r="14" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <circle cx="70" cy="75" r="5" fill="#f3f4f6" stroke="#374151" stroke-width="1"/>
    
    <!-- Tape strips holding the front wheels -->
    <rect x="16" y="55" width="8" height="15" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
    <rect x="66" y="55" width="8" height="15" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
    
    <!-- Adding a wheel action -->
    <path d="M 90 75 L 80 75" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    <polygon points="80,75 85,72 85,78" fill="#374151"/>
  </g>
</svg>