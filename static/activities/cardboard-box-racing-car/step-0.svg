<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(15, 30)">
    <!-- Main Box -->
    <rect x="10" y="20" width="70" height="50" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
    <!-- Box Flaps -->
    <path d="M 10 20 L -5 5" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <path d="M 80 20 L 95 5" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <path d="M 10 20 L 25 -5 L 65 -5 L 80 20" fill="#fde68a" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Door Cutout outline (dashed) -->
    <path d="M 25 20 L 25 60" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>
    <path d="M 65 20 L 65 60" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>
    
    <!-- Scissors cutting the door -->
    <g transform="translate(25, 45) rotate(-30)">
      <!-- Blades -->
      <line x1="0" y1="0" x2="16" y2="0" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="14" y2="4" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Handles -->
      <circle cx="-4" cy="-4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
      <circle cx="-4" cy="4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    </g>
  </g>
</svg>