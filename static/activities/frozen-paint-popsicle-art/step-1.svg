<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="90" width="110" height="12" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Ice cube tray (hero) -->
  <rect x="15" y="50" width="90" height="38" rx="3" fill="#dbeafe" stroke="#374151" stroke-width="2.5"/>
  <!-- Tray section dividers -->
  <line x1="37.5" y1="50" x2="37.5" y2="88" stroke="#374151" stroke-width="1.5"/>
  <line x1="60" y1="50" x2="60" y2="88" stroke="#374151" stroke-width="1.5"/>
  <line x1="82.5" y1="50" x2="82.5" y2="88" stroke="#374151" stroke-width="1.5"/>

  <!-- Paint fills in each section -->
  <rect x="16" y="62" width="21" height="25" rx="1" fill="#ef4444" stroke="none"/>
  <rect x="38.5" y="62" width="21" height="25" rx="1" fill="#3b82f6" stroke="none"/>
  <rect x="61" y="62" width="21" height="25" rx="1" fill="#22c55e" stroke="none"/>
  <rect x="83.5" y="62" width="21" height="25" rx="1" fill="#f59e0b" stroke="none"/>

  <!-- Popsicle sticks standing upright in each section -->
  <line x1="26" y1="18" x2="26" y2="72" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="49" y1="18" x2="49" y2="72" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="71" y1="18" x2="71" y2="72" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="93" y1="18" x2="93" y2="72" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Downward arrows showing sticks being pushed in -->
  <line x1="26" y1="10" x2="26" y2="16" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M23 14 L26 18 L29 14" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <line x1="49" y1="10" x2="49" y2="16" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M46 14 L49 18 L52 14" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <line x1="71" y1="10" x2="71" y2="16" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M68 14 L71 18 L74 14" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <line x1="93" y1="10" x2="93" y2="16" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M90 14 L93 18 L96 14" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
