<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Table surface -->
  <rect x="5" y="85" width="110" height="12" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Ice cube tray (hero, ~40% canvas) -->
  <rect x="20" y="52" width="80" height="32" rx="3" fill="#dbeafe" stroke="#374151" stroke-width="2.5"/>
  <!-- Tray sections dividers -->
  <line x1="40" y1="52" x2="40" y2="84" stroke="#374151" stroke-width="1.5"/>
  <line x1="60" y1="52" x2="60" y2="84" stroke="#374151" stroke-width="1.5"/>
  <line x1="80" y1="52" x2="80" y2="84" stroke="#374151" stroke-width="1.5"/>
  <!-- Paint blobs in tray sections -->
  <ellipse cx="30" cy="72" rx="8" ry="5" fill="#ef4444" stroke="#374151" stroke-width="1"/>
  <ellipse cx="50" cy="72" rx="8" ry="5" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <ellipse cx="70" cy="72" rx="8" ry="5" fill="#22c55e" stroke="#374151" stroke-width="1"/>
  <ellipse cx="90" cy="72" rx="8" ry="5" fill="#f59e0b" stroke="#374151" stroke-width="1"/>

  <!-- Paint bottle (top-left) -->
  <path d="M8,38 Q4,38 4,32 L4,16 Q4,12 8,12 L18,12 Q22,12 22,16 L22,32 Q22,38 18,38 Z"
        fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <rect x="10" y="6" width="6" height="8" rx="2" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>

  <!-- Arrow from paint bottle into tray -->
  <path d="M16,40 Q20,46 28,52" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Popsicle stick stirring in section 2 -->
  <line x1="50" y1="38" x2="50" y2="70" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>

  <!-- Stirring arc -->
  <path d="M42,62 Q50,54 58,62" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Water drop (top-right) -->
  <path d="M100,10 Q106,22 106,28 Q106,36 100,36 Q94,36 94,28 Q94,22 100,10 Z"
        fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>

  <!-- Dashed drip from water drop -->
  <line x1="100" y1="38" x2="100" y2="50" stroke="#3b82f6" stroke-width="1.5"
        stroke-dasharray="3,2" stroke-linecap="round"/>
</svg>
