<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Table surface -->
  <rect x="5" y="95" width="110" height="12" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper sheet (hero surface) -->
  <rect x="12" y="42" width="96" height="52" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2"/>

  <!-- Colourful paint trails on paper -->
  <path d="M25,78 Q35,65 50,72 Q62,78 75,62 Q85,52 92,58"
        fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M20,60 Q30,52 42,58 Q55,65 68,55 Q78,48 88,52"
        fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M30,88 Q45,80 55,85 Q65,90 80,82"
        fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Colour blend spots -->
  <circle cx="50" cy="70" r="4" fill="#a78bfa" stroke="none" opacity="0.5"/>
  <circle cx="68" cy="56" r="3" fill="#f97316" stroke="none" opacity="0.5"/>

  <!-- Frozen paint cube being held (tilted, actively painting) -->
  <g transform="translate(85, 48) rotate(-25)">
    <!-- Popsicle stick handle -->
    <line x1="0" y1="-30" x2="0" y2="2" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Ice cube at bottom -->
    <rect x="-7" y="2" width="14" height="14" rx="2" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Melting drips -->
    <line x1="-3" y1="16" x2="-4" y2="22" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="16" x2="4" y2="20" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Motion arrow showing sliding direction -->
  <path d="M78,62 Q68,58 58,62" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Second ice cube (blue, waiting on table) -->
  <g transform="translate(22, 30)">
    <line x1="0" y1="-16" x2="0" y2="2" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    <rect x="-6" y="2" width="12" height="12" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <!-- Small melting drop -->
    <circle cx="0" cy="17" r="1.5" fill="#3b82f6" stroke="none"/>
  </g>
</svg>
