<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Freezer box (hero, large) -->
  <rect x="15" y="30" width="90" height="75" rx="4" fill="#dbeafe" stroke="#374151" stroke-width="2.5"/>
  <!-- Freezer door handle -->
  <line x1="95" y1="55" x2="95" y2="75" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <!-- Frost/cold lines inside freezer -->
  <line x1="25" y1="42" x2="35" y2="42" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="48" x2="40" y2="48" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
  <line x1="70" y1="42" x2="82" y2="42" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72" y1="48" x2="80" y2="48" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>

  <!-- Ice cube tray inside freezer -->
  <rect x="28" y="60" width="55" height="22" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <line x1="42" y1="60" x2="42" y2="82" stroke="#374151" stroke-width="1"/>
  <line x1="55.5" y1="60" x2="55.5" y2="82" stroke="#374151" stroke-width="1"/>
  <line x1="69" y1="60" x2="69" y2="82" stroke="#374151" stroke-width="1"/>

  <!-- Frozen paint cubes (solid blocks now) -->
  <rect x="29" y="66" width="12" height="15" rx="1" fill="#ef4444" stroke="none"/>
  <rect x="43" y="66" width="12" height="15" rx="1" fill="#3b82f6" stroke="none"/>
  <rect x="56.5" y="66" width="12" height="15" rx="1" fill="#22c55e" stroke="none"/>
  <rect x="70" y="66" width="12" height="15" rx="1" fill="#f59e0b" stroke="none"/>

  <!-- Popsicle sticks poking up -->
  <line x1="35" y1="52" x2="35" y2="68" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="49" y1="52" x2="49" y2="68" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="62.5" y1="52" x2="62.5" y2="68" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="76" y1="52" x2="76" y2="68" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Snowflake/cold symbols around freezer -->
  <!-- Snowflake 1 -->
  <line x1="8" y1="20" x2="8" y2="30" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="3" y1="25" x2="13" y2="25" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4.5" y1="21.5" x2="11.5" y2="28.5" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
  <line x1="11.5" y1="21.5" x2="4.5" y2="28.5" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>

  <!-- Snowflake 2 -->
  <line x1="110" y1="16" x2="110" y2="24" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="106" y1="20" x2="114" y2="20" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arrow showing tray going into freezer -->
  <path d="M60,18 L60,28" stroke="#374151" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
