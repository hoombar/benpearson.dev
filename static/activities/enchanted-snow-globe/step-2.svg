<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Glass jar (hero) -->
  <path d="M34,28 Q30,28 30,32 L30,88 Q30,96 60,96 Q90,96 90,88 L90,32 Q90,28 86,28 Z"
        fill="#dbeafe" stroke="#374151" stroke-width="2.5" fill-opacity="0.3"/>
  <rect x="42" y="18" width="36" height="12" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="2" fill-opacity="0.3"/>
  <rect x="40" y="14" width="40" height="6" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>

  <!-- Water inside jar -->
  <rect x="32" y="34" width="56" height="60" rx="2" fill="#dbeafe" stroke="none" opacity="0.4"/>

  <!-- Glitter particles floating in water (various sizes, silver/gold) -->
  <circle cx="42" cy="44" r="1.5" fill="#f59e0b" stroke="none"/>
  <circle cx="55" cy="50" r="1" fill="#e5e7eb" stroke="none"/>
  <circle cx="68" cy="42" r="1.5" fill="#e5e7eb" stroke="none"/>
  <circle cx="48" cy="60" r="1" fill="#f59e0b" stroke="none"/>
  <circle cx="72" cy="56" r="1.5" fill="#e5e7eb" stroke="none"/>
  <circle cx="38" cy="72" r="1" fill="#f59e0b" stroke="none"/>
  <circle cx="62" cy="68" r="1.5" fill="#e5e7eb" stroke="none"/>
  <circle cx="80" cy="48" r="1" fill="#f59e0b" stroke="none"/>
  <circle cx="52" cy="80" r="1.5" fill="#e5e7eb" stroke="none"/>
  <circle cx="74" cy="76" r="1" fill="#f59e0b" stroke="none"/>
  <circle cx="44" cy="88" r="1" fill="#e5e7eb" stroke="none"/>
  <circle cx="66" cy="84" r="1.5" fill="#f59e0b" stroke="none"/>
  <circle cx="82" cy="66" r="1" fill="#e5e7eb" stroke="none"/>
  <circle cx="36" cy="54" r="1.5" fill="#f59e0b" stroke="none"/>
  <circle cx="58" cy="38" r="1" fill="#e5e7eb" stroke="none"/>
  <!-- Star sequins -->
  <path d="M50,46 L51,43 L52,46 L55,46 L52.5,48 L53.5,51 L51,49 L48.5,51 L49.5,48 L47,46 Z" fill="#f59e0b" stroke="none"/>
  <path d="M70,62 L71,59 L72,62 L75,62 L72.5,64 L73.5,67 L71,65 L68.5,67 L69.5,64 L67,62 Z" fill="#e5e7eb" stroke="none"/>

  <!-- Glitter being sprinkled from above -->
  <!-- Pinching fingers suggestion (two curved lines) -->
  <path d="M56,4 Q52,8 54,10" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M64,4 Q68,8 66,10" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Falling glitter particles -->
  <circle cx="58" cy="12" r="1" fill="#f59e0b" stroke="none"/>
  <circle cx="62" cy="14" r="1.5" fill="#e5e7eb" stroke="none"/>
  <circle cx="56" cy="16" r="1" fill="#e5e7eb" stroke="none"/>
  <circle cx="64" cy="10" r="1" fill="#f59e0b" stroke="none"/>
  <line x1="60" y1="10" x2="60" y2="16" stroke="#f59e0b" stroke-width="0.75" stroke-dasharray="2,1" stroke-linecap="round"/>
  <line x1="56" y1="12" x2="57" y2="18" stroke="#e5e7eb" stroke-width="0.75" stroke-dasharray="2,1" stroke-linecap="round"/>

  <!-- Glitter tube/container to the right -->
  <rect x="96" y="30" width="14" height="40" rx="3" fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>
  <rect x="98" y="24" width="10" height="8" rx="2" fill="#fde68a" stroke="#374151" stroke-width="1"/>
</svg>
