<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Table surface -->
  <rect x="4" y="112" width="112" height="4" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Volcano cone (background) -->
  <path d="M10,112 L60,38 L110,112 Z" fill="#d97706" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <!-- shading right -->
  <path d="M60,38 L110,112 L88,112 Z" fill="#b45309" stroke="none" opacity="0.3"/>
  <!-- texture -->
  <path d="M28,98 Q34,94 40,98" fill="none" stroke="#b45309" stroke-width="1" stroke-linecap="round"/>
  <path d="M76,92 Q82,88 88,92" fill="none" stroke="#92400e" stroke-width="1" stroke-linecap="round"/>

  <!-- Container at crater (filled with orange/red lava mix) -->
  <rect x="49" y="30" width="22" height="22" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- lava mix inside -->
  <rect x="51" y="40" width="18" height="10" rx="0" fill="#fca5a5" stroke="none"/>
  <line x1="51" y1="40" x2="69" y2="40" stroke="#ef4444" stroke-width="1"/>
  <ellipse cx="60" cy="30" rx="11" ry="3" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper pouch (hero, being held above crater) -->
  <g transform="translate(60,12)">
    <!-- pouch body -->
    <path d="M-18,-2 L18,-2 L14,10 L-14,10 Z" fill="#f3f4f6" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- top fold -->
    <path d="M-18,-2 L-14,-12 L14,-12 L18,-2" fill="#e5e7eb" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <!-- baking soda texture inside pouch -->
    <circle cx="-8" cy="4" r="2" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
    <circle cx="0" cy="5" r="2.5" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
    <circle cx="8" cy="4" r="2" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
    <!-- powder dusting -->
    <path d="M-12,8 Q0,11 12,8" fill="none" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Dashed arrow: pouch dropping into crater -->
  <line x1="60" y1="22" x2="60" y2="29" stroke="#374151" stroke-width="2" stroke-dasharray="2,2" stroke-linecap="round"/>
  <polygon points="60,31 56,26 64,26" fill="#374151"/>


  <!-- Countdown dots (3...2...1) -->
  <circle cx="18" cy="44" r="5" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <circle cx="18" cy="44" r="2" fill="#f59e0b" stroke="none"/>
  <circle cx="18" cy="58" r="5" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <circle cx="18" cy="58" r="2" fill="#f59e0b" stroke="none"/>
  <circle cx="18" cy="72" r="5" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <circle cx="18" cy="72" r="2" fill="#f59e0b" stroke="none"/>

  <!-- small baking soda box (top-left context) -->
  <g transform="translate(10,100)">
    <rect x="-8" y="-14" width="16" height="20" rx="1" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <rect x="-8" y="-20" width="16" height="7" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <line x1="-6" y1="-12" x2="6" y2="-12" stroke="#9ca3af" stroke-width="1"/>
    <line x1="-6" y1="-7" x2="6" y2="-7" stroke="#9ca3af" stroke-width="1"/>
  </g>
</svg>
