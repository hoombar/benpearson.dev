<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Surface / table -->
  <rect x="4" y="104" width="112" height="5" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Volcano cone (hero, clay/dough) -->
  <path d="M10,104 L60,28 L110,104 Z" fill="#d97706" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- shading on right side of cone -->
  <path d="M60,28 L110,104 L90,104 Z" fill="#b45309" stroke="none" opacity="0.35"/>
  <!-- texture bumps on surface -->
  <path d="M26,90 Q30,86 34,90" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M40,76 Q45,72 50,76" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M70,76 Q75,72 80,76" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M82,90 Q87,86 92,90" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- dough texture dots -->
  <circle cx="48" cy="88" r="2" fill="#b45309" stroke="none" opacity="0.5"/>
  <circle cx="62" cy="80" r="2" fill="#b45309" stroke="none" opacity="0.5"/>
  <circle cx="76" cy="86" r="2" fill="#92400e" stroke="none" opacity="0.5"/>

  <!-- Container at crater top -->
  <rect x="50" y="20" width="20" height="22" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- container opening at top -->
  <ellipse cx="60" cy="20" rx="10" ry="3" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <!-- container is filled slightly -->
  <rect x="52" y="32" width="16" height="8" rx="0" fill="#dbeafe" stroke="none" opacity="0.6"/>

  <!-- Arrows showing shaping motion (inward push from both sides) -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M22,88 Q32,76 44,70" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M98,88 Q88,76 76,70" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
