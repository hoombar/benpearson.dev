<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Table surface -->
  <rect x="4" y="106" width="112" height="4" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Vinegar bottle (left, hero) -->
  <g transform="translate(28,64)">
    <!-- Entire bottle as ONE closed path: rounded base, smooth cubic shoulders, no seams anywhere.
         Left side: straight up to y=-26, then cubic C-14,-44 -5,-44 arrives at neck top y=-54 vertically.
         Right side mirrors. Both shoulder cubics have vertical tangents at start AND end. -->
    <path d="M-8,16 Q-14,16 -14,10 L-14,-26 C-14,-44 -5,-44 -5,-54 L5,-54 C5,-44 14,-44 14,-26 L14,10 Q14,16 8,16 Z"
          fill="#dbeafe" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <!-- label -->
    <rect x="-10" y="-14" width="20" height="20" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
    <!-- label lines -->
    <line x1="-7" y1="-9" x2="7" y2="-9" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <line x1="-7" y1="-4" x2="7" y2="-4" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <line x1="-7" y1="1" x2="4" y2="1" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <!-- cap — neck top is at y=-54; cap bottom y=-53 overlaps via 2px stroke -->
    <rect x="-6" y="-60" width="12" height="7" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="2"/>
    <!-- liquid level line -->
    <line x1="-12" y1="-4" x2="12" y2="-4" stroke="#93c5fd" stroke-width="1"/>
  </g>

  <!-- Vinegar pouring arc -->
  <path d="M28,22 Q48,30 56,52" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3,2"/>
  <polygon points="56,52 50,48 58,46" fill="#93c5fd"/>

  <!-- Container (centre, being filled) -->
  <g transform="translate(68,74)">
    <rect x="-18" y="-36" width="36" height="48" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="2.5"/>
    <!-- vinegar fill inside (light blue) -->
    <rect x="-15" y="-4" width="30" height="16" rx="1" fill="#dbeafe" stroke="none"/>
    <!-- liquid surface line -->
    <line x1="-15" y1="-4" x2="15" y2="-4" stroke="#93c5fd" stroke-width="1.5"/>
    <!-- container rim/opening -->
    <ellipse cx="0" cy="-36" rx="18" ry="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Food colouring dropper (right) -->
  <g transform="translate(104,38)">
    <!-- dropper body -->
    <rect x="-5" y="-20" width="10" height="28" rx="2" fill="#fca5a5" stroke="#374151" stroke-width="2"/>
    <!-- rubber bulb top -->
    <ellipse cx="0" cy="-20" rx="7" ry="5" fill="#ef4444" stroke="#374151" stroke-width="2"/>
    <!-- tip -->
    <path d="M-2,8 L0,18 L2,8" fill="#fca5a5" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Red drops falling from dropper into container -->
  <ellipse cx="104" cy="58" rx="3" ry="4" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="100" cy="68" rx="2.5" ry="3.5" fill="#ef4444" stroke="#374151" stroke-width="1" opacity="0.8"/>
  <!-- dashed drip line -->
  <line x1="104" y1="56" x2="90" y2="74" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2" stroke-linecap="round"/>

  <!-- Washing-up liquid bottle hint (small, far right) -->
  <g transform="translate(114,80)">
    <rect x="-5" y="-18" width="10" height="24" rx="2" fill="#86efac" stroke="#374151" stroke-width="1.5"/>
    <rect x="-4" y="-22" width="8" height="5" rx="1" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  </g>
</svg>
