<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="95" width="110" height="12" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper strip laid flat (hero) -->
  <rect x="8" y="55" width="104" height="18" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="2"/>

  <!-- Big leaves standing up as crown points -->
  <!-- Red maple leaf (left) -->
  <path d="M22,55 L18,38 L14,44 L10,36 L16,46 L12,44 L20,52 L28,44 L24,46 L30,36 L26,44 L22,38 Z"
        fill="#ef4444" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Yellow oak leaf (centre-left) -->
  <path d="M44,55 Q38,42 40,32 Q44,26 48,32 Q52,26 54,34 Q50,42 44,55"
        fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>
  <line x1="44" y1="55" x2="46" y2="32" stroke="#374151" stroke-width="0.75"/>

  <!-- Green large leaf (centre) -->
  <ellipse cx="64" cy="40" rx="8" ry="16" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <line x1="64" y1="56" x2="64" y2="26" stroke="#374151" stroke-width="0.75"/>

  <!-- Orange leaf (centre-right) -->
  <path d="M82,55 Q76,42 78,30 Q82,24 86,30 Q90,24 92,34 Q88,42 82,55"
        fill="#f97316" stroke="#374151" stroke-width="1.5"/>
  <line x1="82" y1="55" x2="84" y2="30" stroke="#374151" stroke-width="0.75"/>

  <!-- Small red leaf (right) -->
  <ellipse cx="100" cy="42" rx="6" ry="12" fill="#ef4444" stroke="#374151" stroke-width="1.5" transform="rotate(10 100 42)"/>

  <!-- Small flowers filling gaps at base -->
  <circle cx="34" cy="60" r="3" fill="#fca5a5" stroke="#374151" stroke-width="0.75"/>
  <circle cx="34" cy="60" r="1" fill="#f59e0b" stroke="none"/>

  <circle cx="54" cy="62" r="3" fill="#c4b5fd" stroke="#374151" stroke-width="0.75"/>
  <circle cx="54" cy="62" r="1" fill="#f59e0b" stroke="none"/>

  <circle cx="74" cy="60" r="3" fill="#fca5a5" stroke="#374151" stroke-width="0.75"/>
  <circle cx="74" cy="60" r="1" fill="#f59e0b" stroke="none"/>

  <circle cx="92" cy="62" r="2.5" fill="#93c5fd" stroke="#374151" stroke-width="0.75"/>

  <!-- Seed pod -->
  <ellipse cx="16" cy="62" rx="3" ry="2" fill="#d97706" stroke="#374151" stroke-width="0.75"/>

  <!-- Glue bottle -->
  <path d="M4,78 Q2,78 2,80 L2,92 Q2,94 6,94 L10,94 Q14,94 14,92 L14,80 Q14,78 12,78 Z"
        fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <rect x="5" y="74" width="4" height="5" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="0.75"/>

  <!-- Glue line on strip -->
  <path d="M12,64 Q30,68 50,64 Q70,60 90,64" stroke="#f3f4f6" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
