<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Grass ground -->
  <rect x="0" y="90" width="120" height="30" rx="0" fill="#86efac" stroke="none"/>
  <line x1="0" y1="90" x2="120" y2="90" stroke="#374151" stroke-width="1.5"/>

  <!-- Basket (collection container) -->
  <path d="M35,62 L30,90 Q30,96 60,96 Q90,96 90,90 L85,62"
        fill="#fde68a" stroke="#374151" stroke-width="2"/>
  <!-- Basket weave lines -->
  <line x1="38" y1="70" x2="82" y2="70" stroke="#d97706" stroke-width="1" stroke-linecap="round"/>
  <line x1="36" y1="78" x2="84" y2="78" stroke="#d97706" stroke-width="1" stroke-linecap="round"/>
  <line x1="34" y1="86" x2="86" y2="86" stroke="#d97706" stroke-width="1" stroke-linecap="round"/>
  <!-- Basket handle -->
  <path d="M38,62 Q60,38 82,62" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Collected items spilling out of basket -->
  <!-- Large maple-style leaf -->
  <path d="M50,58 L45,48 L42,54 L36,46 L40,56 L34,54 L42,60 L50,58"
        fill="#ef4444" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="50" y1="58" x2="42" y2="52" stroke="#374151" stroke-width="0.75"/>

  <!-- Oak-style leaf -->
  <path d="M68,56 Q62,50 64,44 Q68,40 72,44 Q76,40 78,46 Q74,50 68,56"
        fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>
  <line x1="68" y1="56" x2="70" y2="44" stroke="#374151" stroke-width="0.75"/>

  <!-- Small round leaf -->
  <ellipse cx="78" cy="58" rx="6" ry="4" fill="#22c55e" stroke="#374151" stroke-width="1" transform="rotate(-20 78 58)"/>

  <!-- Flower petals -->
  <circle cx="56" cy="54" r="4" fill="#fca5a5" stroke="#374151" stroke-width="1"/>
  <circle cx="56" cy="54" r="1.5" fill="#f59e0b" stroke="none"/>

  <!-- Twig -->
  <line x1="42" y1="64" x2="62" y2="56" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="60" x2="56" y2="54" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Scattered leaves on ground nearby -->
  <ellipse cx="16" cy="96" rx="8" ry="5" fill="#f59e0b" stroke="#374151" stroke-width="1" transform="rotate(15 16 96)"/>
  <ellipse cx="104" cy="98" rx="7" ry="4" fill="#ef4444" stroke="#374151" stroke-width="1" transform="rotate(-10 104 98)"/>
  <ellipse cx="20" cy="106" rx="6" ry="4" fill="#22c55e" stroke="#374151" stroke-width="1"/>

  <!-- Small tree in background -->
  <line x1="108" y1="56" x2="108" y2="90" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <circle cx="108" cy="42" r="16" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <circle cx="108" cy="42" r="10" fill="#86efac" stroke="none"/>
</svg>
