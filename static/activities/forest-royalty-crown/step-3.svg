<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="100" width="120" height="20" fill="#86efac" stroke="none"/>
  <line x1="0" y1="100" x2="120" y2="100" stroke="#374151" stroke-width="1.5"/>

  <!-- Crown on a head (circular band with decorations, hero) -->
  <!-- Head (partial circle) -->
  <ellipse cx="60" cy="66" rx="28" ry="30" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- Crown band wrapped around head -->
  <path d="M32,55 Q32,48 60,46 Q88,48 88,55" fill="#fef3c7" stroke="#374151" stroke-width="2.5"/>
  <path d="M32,55 L32,62 Q32,66 60,64 Q88,66 88,62 L88,55" fill="#fef3c7" stroke="#374151" stroke-width="2"/>

  <!-- Tape join visible at back -->
  <rect x="56" y="62" width="8" height="4" rx="0" fill="#fde68a" stroke="#374151" stroke-width="0.5" opacity="0.6"/>

  <!-- Leaves standing up from crown -->
  <!-- Red maple leaf (left) -->
  <path d="M38,48 L35,32 L32,38 L28,30 L34,40 L30,38 L36,46 Z"
        fill="#ef4444" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Yellow leaf (centre-left) -->
  <path d="M50,46 Q46,34 48,26 Q52,22 54,28 Q56,22 58,30 Q54,38 50,46"
        fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>

  <!-- Green tall leaf (centre, tallest point) -->
  <ellipse cx="60" cy="28" rx="6" ry="18" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <line x1="60" y1="46" x2="60" y2="12" stroke="#374151" stroke-width="0.75"/>

  <!-- Orange leaf (centre-right) -->
  <path d="M70,46 Q66,34 68,26 Q72,22 74,28 Q76,22 78,30 Q74,38 70,46"
        fill="#f97316" stroke="#374151" stroke-width="1.5"/>

  <!-- Small red leaf (right) -->
  <ellipse cx="82" cy="38" rx="5" ry="10" fill="#ef4444" stroke="#374151" stroke-width="1.5" transform="rotate(15 82 38)"/>

  <!-- Flowers on crown band -->
  <circle cx="44" cy="56" r="3" fill="#fca5a5" stroke="#374151" stroke-width="0.75"/>
  <circle cx="44" cy="56" r="1" fill="#f59e0b" stroke="none"/>
  <circle cx="76" cy="56" r="3" fill="#c4b5fd" stroke="#374151" stroke-width="0.75"/>
  <circle cx="76" cy="56" r="1" fill="#f59e0b" stroke="none"/>

  <!-- Happy face on head -->
  <circle cx="52" cy="68" r="2" fill="#374151" stroke="none"/>
  <circle cx="68" cy="68" r="2" fill="#374151" stroke="none"/>
  <path d="M52,78 Q60,84 68,78" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sparkle/celebration lines -->
  <line x1="18" y1="24" x2="14" y2="18" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="20" x2="22" y2="14" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="24" x2="30" y2="18" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>

  <line x1="94" y1="24" x2="90" y2="18" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="98" y1="20" x2="98" y2="14" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="102" y1="24" x2="106" y2="18" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
</svg>
