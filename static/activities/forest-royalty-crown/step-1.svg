<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="85" width="110" height="12" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper strip (hero, long horizontal band) -->
  <rect x="8" y="46" width="104" height="20" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="2.5"/>

  <!-- Ruler showing measurement -->
  <rect x="8" y="72" width="80" height="8" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1"/>
  <!-- Ruler tick marks -->
  <line x1="18" y1="72" x2="18" y2="76" stroke="#374151" stroke-width="0.75"/>
  <line x1="28" y1="72" x2="28" y2="76" stroke="#374151" stroke-width="0.75"/>
  <line x1="38" y1="72" x2="38" y2="76" stroke="#374151" stroke-width="0.75"/>
  <line x1="48" y1="72" x2="48" y2="78" stroke="#374151" stroke-width="1"/>
  <line x1="58" y1="72" x2="58" y2="76" stroke="#374151" stroke-width="0.75"/>
  <line x1="68" y1="72" x2="68" y2="76" stroke="#374151" stroke-width="0.75"/>
  <line x1="78" y1="72" x2="78" y2="76" stroke="#374151" stroke-width="0.75"/>

  <!-- Width measurement indicator (5cm) -->
  <line x1="4" y1="46" x2="4" y2="66" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="2" y1="46" x2="6" y2="46" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="2" y1="66" x2="6" y2="66" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Scissors cutting the strip -->
  <g transform="translate(104, 46) rotate(-5)">
    <line x1="0" y1="0" x2="14" y2="-2" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="12" y2="4" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-4" cy="-4" r="3.5" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <circle cx="-4" cy="4" r="3.5" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Cut line -->
  <line x1="112" y1="42" x2="112" y2="70" stroke="#374151" stroke-width="1" stroke-dasharray="3,2" stroke-linecap="round"/>

  <!-- Tape joining strips shown at middle -->
  <rect x="52" y="44" width="16" height="24" rx="0" fill="#fde68a" stroke="#374151" stroke-width="0.75" opacity="0.5"/>

  <!-- Head size wrapping preview (curved arrow above) -->
  <path d="M24,36 Q60,20 96,36" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4,3"/>
</svg>
