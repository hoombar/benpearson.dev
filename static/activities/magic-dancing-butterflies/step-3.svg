<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper on table -->
  <rect x="15" y="72" width="90" height="26" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>

  <!-- Balloon (hero, hovering above paper) -->
  <ellipse cx="60" cy="32" rx="28" ry="32" fill="#ef4444" stroke="#374151" stroke-width="2.5"/>
  <path d="M56,63 L60,68 L64,63" fill="#ef4444" stroke="#374151" stroke-width="2"/>
  <!-- Balloon highlight -->
  <ellipse cx="48" cy="22" rx="5" ry="9" fill="#fca5a5" stroke="none" opacity="0.4"/>

  <!-- Static sparks -->
  <path d="M34,54 L32,58 L36,60" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M86,54 L88,58 L84,60" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Butterflies LEAPING up toward balloon (in air) -->
  <!-- Pink butterfly rising -->
  <g transform="translate(45, 56) rotate(-10)">
    <path d="M0,-2 Q-6,-8 -4,-2 Q-6,4 0,2" fill="#fca5a5" stroke="#374151" stroke-width="1"/>
    <path d="M0,-2 Q6,-8 4,-2 Q6,4 0,2" fill="#fca5a5" stroke="#374151" stroke-width="1"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>
  </g>

  <!-- Blue butterfly mid-air -->
  <g transform="translate(72, 52) rotate(15)">
    <path d="M0,-2 Q-6,-8 -4,-2 Q-6,4 0,2" fill="#93c5fd" stroke="#374151" stroke-width="1"/>
    <path d="M0,-2 Q6,-8 4,-2 Q6,4 0,2" fill="#93c5fd" stroke="#374151" stroke-width="1"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>
  </g>

  <!-- Green butterfly clinging to balloon -->
  <g transform="translate(52, 44) rotate(-20)">
    <path d="M0,-2 Q-5,-7 -3,-2 Q-5,3 0,1" fill="#d1fae5" stroke="#374151" stroke-width="1"/>
    <path d="M0,-2 Q5,-7 3,-2 Q5,3 0,1" fill="#d1fae5" stroke="#374151" stroke-width="1"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>
  </g>

  <!-- Yellow butterfly just leaving table -->
  <g transform="translate(40, 68) rotate(5)">
    <path d="M0,-2 Q-5,-7 -3,-2 Q-5,3 0,1" fill="#fef9c3" stroke="#374151" stroke-width="1"/>
    <path d="M0,-2 Q5,-7 3,-2 Q5,3 0,1" fill="#fef9c3" stroke="#374151" stroke-width="1"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>
  </g>

  <!-- Purple butterfly on balloon surface -->
  <g transform="translate(68, 40) rotate(25)">
    <path d="M0,-2 Q-5,-7 -3,-2 Q-5,3 0,1" fill="#ede9fe" stroke="#374151" stroke-width="1"/>
    <path d="M0,-2 Q5,-7 3,-2 Q5,3 0,1" fill="#ede9fe" stroke="#374151" stroke-width="1"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>
  </g>

  <!-- Butterflies still on paper (not yet attracted) -->
  <path d="M55,82 Q51,78 53,82 Q51,86 55,85" fill="#fca5a5" stroke="#374151" stroke-width="0.75"/>
  <path d="M55,82 Q59,78 57,82 Q59,86 55,85" fill="#fca5a5" stroke="#374151" stroke-width="0.75"/>

  <path d="M78,85 Q74,81 76,85 Q74,89 78,88" fill="#93c5fd" stroke="#374151" stroke-width="0.75"/>
  <path d="M78,85 Q82,81 80,85 Q82,89 78,88" fill="#93c5fd" stroke="#374151" stroke-width="0.75"/>

  <!-- Upward motion lines from departing butterflies -->
  <line x1="38" y1="74" x2="38" y2="70" stroke="#374151" stroke-width="0.75" stroke-linecap="round" stroke-dasharray="2,2"/>
  <line x1="42" y1="76" x2="43" y2="72" stroke="#374151" stroke-width="0.75" stroke-linecap="round" stroke-dasharray="2,2"/>
</svg>
