  <path d="M72,78 Q66,72 68,78 Q66,84 72,82" fill="#ede9fe" stroke="#374151" stroke-width="1"/>
  <path d="M72,78 Q78,72 76,78 Q78,84 72,82" fill="#ede9fe" stroke="#374151" stroke-width="1"/>
  <line x1="72" y1="75" x2="72" y2="85" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>

