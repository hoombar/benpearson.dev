  <!-- Scattered tissue paper butterflies on paper -->
  <!-- Pink butterfly -->
  <path d="M38,55 Q32,49 34,55 Q32,61 38,59" fill="#fca5a5" stroke="#374151" stroke-width="1"/>
  <path d="M38,55 Q44,49 42,55 Q44,61 38,59" fill="#fca5a5" stroke="#374151" stroke-width="1"/>
  <line x1="38" y1="52" x2="38" y2="62" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>

  <!-- Blue butterfly -->
  <path d="M62,62 Q56,56 58,62 Q56,68 62,66" fill="#93c5fd" stroke="#374151" stroke-width="1"/>
  <path d="M62,62 Q68,56 66,62 Q68,68 62,66" fill="#93c5fd" stroke="#374151" stroke-width="1"/>
  <line x1="62" y1="59" x2="62" y2="69" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>

  <!-- Green butterfly -->
  <path d="M80,50 Q74,44 76,50 Q74,56 80,54" fill="#d1fae5" stroke="#374151" stroke-width="1"/>
  <path d="M80,50 Q86,44 84,50 Q86,56 80,54" fill="#d1fae5" stroke="#374151" stroke-width="1"/>
