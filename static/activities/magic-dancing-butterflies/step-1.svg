  <!-- Drawn flowers on paper (marker decorations) -->
  <circle cx="28" cy="82" r="4" fill="#fca5a5" stroke="#374151" stroke-width="1"/>
  <circle cx="28" cy="82" r="1.5" fill="#f59e0b" stroke="none"/>
  <line x1="28" y1="86" x2="28" y2="92" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>

  <circle cx="88" cy="80" r="4" fill="#c4b5fd" stroke="#374151" stroke-width="1"/>
  <circle cx="88" cy="80" r="1.5" fill="#f59e0b" stroke="none"/>
  <line x1="88" y1="84" x2="88" y2="92" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>

