<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Balloon (hero, large) -->
  <ellipse cx="60" cy="50" rx="32" ry="38" fill="#ef4444" stroke="#374151" stroke-width="2.5"/>
  <!-- Balloon knot at bottom -->
  <path d="M56,87 L60,92 L64,87" fill="#ef4444" stroke="#374151" stroke-width="2"/>
  <!-- Balloon highlight -->
  <ellipse cx="48" cy="38" rx="6" ry="10" fill="#fca5a5" stroke="none" opacity="0.4"/>

  <!-- Rubbing arc arrows showing back-and-forth motion -->
  <path d="M30,36 Q20,50 30,64" stroke="#374151" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M90,36 Q100,50 90,64" stroke="#374151" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Static electricity sparks/zigzags around balloon -->
  <path d="M26,30 L22,34 L28,36 L24,40" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M94,28 L98,32 L92,34 L96,38" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M36,16 L34,20 L38,22" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M84,16 L86,20 L82,22" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Hair strands below (representing rubbing on hair) -->
  <path d="M42,100 Q44,94 46,100" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M50,100 Q52,92 54,100" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M58,100 Q60,94 62,100" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M66,100 Q68,92 70,100" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M74,100 Q76,94 78,100" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Some hair strands standing up (attracted to balloon) -->
  <line x1="52" y1="100" x2="54" y2="94" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="60" y1="100" x2="60" y2="93" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="68" y1="100" x2="66" y2="94" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Head outline (partial arc) -->
  <path d="M36,108 Q36,98 60,96 Q84,98 84,108" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
</svg>
