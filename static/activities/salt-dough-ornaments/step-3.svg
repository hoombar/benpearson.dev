<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Surface -->
  <rect x="8" y="94" width="104" height="6" rx="1" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <!-- Star ornament (painted, left) -->
  <path d="M28 70 L31 60 L34 70 L44 70 L36 76 L39 86 L31 80 L23 86 L26 76 L18 70 Z"
        stroke="#374151" stroke-width="2" fill="#ef4444"/>
  <!-- Circle ornament (centre, hero - being painted) -->
  <circle cx="66" cy="74" r="16" stroke="#374151" stroke-width="2.5" fill="#3b82f6"/>
  <!-- Painted dot pattern on circle -->
  <circle cx="60" cy="70" r="3" fill="#fbbf24"/>
  <circle cx="72" cy="70" r="3" fill="#fbbf24"/>
  <circle cx="66" cy="80" r="3" fill="#fbbf24"/>
  <!-- Heart ornament (right) -->
  <path d="M100 64 Q100 58 94 58 Q88 58 88 64 Q88 70 100 76 Q112 70 112 64 Q112 58 106 58 Q100 58 100 64 Z"
        stroke="#374151" stroke-width="1.5" fill="#22c55e"/>
  <!-- Paintbrush applying paint to circle -->
  <line x1="30" y1="36" x2="58" y2="64" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="54" y="60" width="6" height="10" rx="1" fill="#a78bfa" stroke="#374151" stroke-width="1.5"/>
  <!-- Paint blob (palette) -->
  <ellipse cx="22" cy="42" rx="10" ry="7" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="16" cy="42" r="4" fill="#ef4444"/>
  <circle cx="26" cy="40" r="3.5" fill="#3b82f6"/>
  <circle cx="24" cy="47" r="3" fill="#22c55e"/>
</svg>
