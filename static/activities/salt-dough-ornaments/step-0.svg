<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Bowl (hero) -->
  <line x1="14" y1="76" x2="106" y2="76" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M14 76 Q14 110 60 110 Q106 110 106 76" stroke="#374151" stroke-width="2.5" fill="#f9fafb"/>
  <!-- Dough forming in bowl (clumped ball shape) -->
  <ellipse cx="60" cy="98" rx="24" ry="10" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>
  <!-- Flour sack (top left) -->
  <rect x="6" y="22" width="24" height="28" rx="2" stroke="#374151" stroke-width="2" fill="#f9fafb"/>
  <path d="M6 22 Q18 14 30 22" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none"/>
  <line x1="10" y1="30" x2="26" y2="30" stroke="#374151" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="10" y1="36" x2="26" y2="36" stroke="#374151" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- Salt shaker (top centre) -->
  <rect x="54" y="14" width="12" height="30" rx="6" stroke="#374151" stroke-width="2" fill="#f9fafb"/>
  <rect x="54" y="14" width="12" height="8" rx="4" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
  <circle cx="58" cy="18" r="1" fill="#374151"/>
  <circle cx="62" cy="18" r="1" fill="#374151"/>
  <circle cx="60" cy="15" r="1" fill="#374151"/>
  <!-- Spoon (top right) -->
  <line x1="92" y1="44" x2="88" y2="70" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="86" cy="76" rx="8" ry="5" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <!-- Arrows showing ingredients going into bowl -->
  <line x1="18" y1="50" x2="26" y2="70" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <line x1="60" y1="44" x2="60" y2="70" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
