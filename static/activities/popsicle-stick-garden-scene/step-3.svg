<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Green base -->
  <rect x="10" y="72" width="100" height="26" rx="2" fill="#22c55e" stroke="#374151" stroke-width="1.2"/>
  <!-- Grass blades on base -->
  <path d="M16,80 L18,74 L20,80" fill="none" stroke="#16a34a" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M56,82 L58,76 L60,82" fill="none" stroke="#16a34a" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M90,80 L92,74 L94,80" fill="none" stroke="#16a34a" stroke-width="0.6" stroke-linecap="round"/>

  <!-- White picket fence standing upright along back -->
  <rect x="14" y="42" width="84" height="4" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
  <rect x="14" y="60" width="84" height="4" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
  <rect x="18" y="34" width="5" height="38" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
  <rect x="32" y="34" width="5" height="38" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
  <rect x="46" y="34" width="5" height="38" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
  <rect x="60" y="34" width="5" height="38" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
  <rect x="74" y="34" width="5" height="38" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
  <rect x="88" y="34" width="5" height="38" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>

  <!-- Red flower peeking over fence -->
  <rect x="24" y="36" width="2" height="24" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
  <circle cx="25" cy="30" r="7" fill="#ef4444" stroke="#374151" stroke-width="0.7"/>
  <circle cx="25" cy="30" r="3" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>

  <!-- Purple flower peeking over fence -->
  <rect x="52" y="38" width="2" height="22" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
  <ellipse cx="48" cy="34" rx="3.5" ry="4.5" fill="#a855f7" stroke="#374151" stroke-width="0.5"/>
  <ellipse cx="57" cy="34" rx="3.5" ry="4.5" fill="#a855f7" stroke="#374151" stroke-width="0.5"/>
  <ellipse cx="53" cy="28" rx="3.5" ry="4.5" fill="#a855f7" stroke="#374151" stroke-width="0.5"/>
  <circle cx="53" cy="34" r="2.5" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>

  <!-- Pink tulip peeking over fence -->
  <rect x="80" y="38" width="2" height="22" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
  <path d="M75,38 Q77,24 81,22 Q85,24 87,38 Z" fill="#ec4899" stroke="#374151" stroke-width="0.7"/>

  <!-- Ladybird on the fence -->
  <g transform="translate(42, 52)">
    <ellipse cx="0" cy="0" rx="4" ry="3" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
    <circle cx="-3" cy="-1" r="2" fill="#374151"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#374151" stroke-width="0.5"/>
    <circle cx="-1.5" cy="1" r="0.8" fill="#374151"/>
    <circle cx="1.5" cy="-1" r="0.8" fill="#374151"/>
    <circle cx="2" cy="1.5" r="0.8" fill="#374151"/>
    <!-- Antennae -->
    <line x1="-3" y1="-1" x2="-5" y2="-4" stroke="#374151" stroke-width="0.4"/>
    <line x1="-3" y1="-1" x2="-1" y2="-5" stroke="#374151" stroke-width="0.4"/>
    <circle cx="-5" cy="-4" r="0.5" fill="#374151"/>
    <circle cx="-1" cy="-5" r="0.5" fill="#374151"/>
  </g>

  <!-- Small butterfly -->
  <g transform="translate(100, 22)">
    <ellipse cx="0" cy="0" rx="1" ry="3" fill="#374151"/>
    <ellipse cx="-4" cy="-1" rx="3.5" ry="2.5" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
    <ellipse cx="4" cy="-1" rx="3.5" ry="2.5" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
    <ellipse cx="-3" cy="2" rx="2.5" ry="1.5" fill="#93c5fd" stroke="#374151" stroke-width="0.3"/>
    <ellipse cx="3" cy="2" rx="2.5" ry="1.5" fill="#93c5fd" stroke="#374151" stroke-width="0.3"/>
  </g>
</svg>
