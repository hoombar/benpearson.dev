<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Cardboard base rectangle -->
  <rect x="10" y="56" width="76" height="38" rx="2" fill="#22c55e" stroke="#374151" stroke-width="1.2"/>

  <!-- Painted grass texture -->
  <path d="M14,70 L16,64 L18,70" fill="none" stroke="#16a34a" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M24,72 L26,66 L28,72" fill="none" stroke="#16a34a" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M36,68 L38,62 L40,68" fill="none" stroke="#16a34a" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M48,70 L50,64 L52,70" fill="none" stroke="#16a34a" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M60,72 L62,66 L64,72" fill="none" stroke="#16a34a" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M72,68 L74,62 L76,68" fill="none" stroke="#16a34a" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Paintbrush painting the base green -->
  <g transform="translate(50, 80) rotate(-10)">
    <rect x="0" y="-3" width="24" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pot -->
  <g transform="translate(92, 62)">
    <rect x="0" y="0" width="18" height="18" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
    <rect x="2" y="4" width="14" height="12" rx="1" fill="#22c55e"/>
  </g>

  <!-- Fence being painted white (separate from base) -->
  <g transform="translate(12, 10)">
    <!-- Rails -->
    <rect x="0" y="12" width="56" height="4" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="28" width="56" height="4" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
    <!-- Pickets -->
    <rect x="4" y="4" width="5" height="34" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
    <rect x="15" y="4" width="5" height="34" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
    <rect x="26" y="4" width="5" height="34" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
    <rect x="37" y="4" width="5" height="34" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
    <rect x="48" y="4" width="5" height="34" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Small paintbrush next to fence -->
  <g transform="translate(76, 20) rotate(30)">
    <rect x="0" y="-2" width="16" height="4" rx="1.5" fill="#92400e" stroke="#374151" stroke-width="0.6"/>
    <rect x="-3" y="-2.5" width="4" height="5" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.4"/>
    <rect x="-7" y="-3" width="5" height="6" rx="1" fill="white" stroke="#374151" stroke-width="0.4"/>
  </g>
</svg>
