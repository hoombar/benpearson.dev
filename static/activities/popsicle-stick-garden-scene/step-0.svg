<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Two horizontal rails -->
  <rect x="10" y="48" width="80" height="5" rx="1.5" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
  <rect x="10" y="72" width="80" height="5" rx="1.5" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>

  <!-- Vertical pickets (6 sticks) -->
  <rect x="14" y="36" width="6" height="52" rx="1.5" fill="#e8c99b" stroke="#374151" stroke-width="0.8"/>
  <rect x="28" y="36" width="6" height="52" rx="1.5" fill="#e8c99b" stroke="#374151" stroke-width="0.8"/>
  <rect x="42" y="36" width="6" height="52" rx="1.5" fill="#e8c99b" stroke="#374151" stroke-width="0.8"/>
  <rect x="56" y="36" width="6" height="52" rx="1.5" fill="#e8c99b" stroke="#374151" stroke-width="0.8"/>
  <rect x="70" y="36" width="6" height="52" rx="1.5" fill="#e8c99b" stroke="#374151" stroke-width="0.8"/>
  <rect x="84" y="36" width="6" height="52" rx="1.5" fill="#e8c99b" stroke="#374151" stroke-width="0.8"/>

  <!-- Glue dots at intersections -->
  <circle cx="17" cy="50" r="1.5" fill="#fef9c3" stroke="#374151" stroke-width="0.3" opacity="0.7"/>
  <circle cx="45" cy="50" r="1.5" fill="#fef9c3" stroke="#374151" stroke-width="0.3" opacity="0.7"/>
  <circle cx="73" cy="74" r="1.5" fill="#fef9c3" stroke="#374151" stroke-width="0.3" opacity="0.7"/>

  <!-- PVA glue bottle -->
  <g transform="translate(96, 40)">
    <rect x="0" y="8" width="14" height="20" rx="3" fill="#f0f9ff" stroke="#374151" stroke-width="0.8"/>
    <rect x="3" y="0" width="8" height="10" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="0.6"/>
    <circle cx="7" cy="0" r="2" fill="#f97316" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Hand pressing down a picket -->
  <g transform="translate(52, 22)">
    <rect x="0" y="0" width="10" height="16" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Loose sticks not yet placed -->
  <rect x="16" y="92" width="36" height="5" rx="1.5" fill="#e8c99b" stroke="#374151" stroke-width="0.6"/>
  <rect x="58" y="94" width="36" height="5" rx="1.5" fill="#e8c99b" stroke="#374151" stroke-width="0.6"/>
</svg>
