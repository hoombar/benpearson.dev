<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Straw cross (hero, centre) -->
  <!-- Vertical straw -->
  <rect x="57" y="14" width="6" height="78" rx="2" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
  <!-- Horizontal straw -->
  <rect x="22" y="50" width="76" height="6" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>

  <!-- Tape at intersection -->
  <rect x="52" y="46" width="16" height="14" rx="2" fill="#fde68a" stroke="#374151" stroke-width="1" opacity="0.8"/>
  <!-- Cross tape strip -->
  <rect x="54" y="44" width="12" height="4" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5" opacity="0.7" transform="rotate(45 60 46)"/>

  <!-- Loose straws nearby (before assembly) -->
  <rect x="8" y="78" width="4" height="20" rx="1.5" fill="#22c55e" stroke="#374151" stroke-width="0.8" transform="rotate(-15 10 88)"/>
  <rect x="104" y="76" width="4" height="20" rx="1.5" fill="#3b82f6" stroke="#374151" stroke-width="0.8" transform="rotate(10 106 86)"/>

  <!-- Tape roll -->
  <circle cx="104" cy="30" r="10" fill="#fde68a" stroke="#374151" stroke-width="1.2"/>
  <circle cx="104" cy="30" r="4" fill="#fef3c7" stroke="#374151" stroke-width="0.8"/>

  <!-- Arrow from tape to intersection -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M94,36 Q82,42 72,46" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>
</svg>