<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Flat zip-lock bag (transparent look) -->
  <rect x="16" y="18" width="88" height="72" rx="3" fill="#dbeafe" stroke="#374151" stroke-width="1.5" opacity="0.5"/>
  <!-- Zip-lock seal line at top -->
  <line x1="16" y1="24" x2="104" y2="24" stroke="#3b82f6" stroke-width="2"/>
  <line x1="16" y1="27" x2="104" y2="27" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- Straw cross on top of bag -->
  <!-- Vertical straw -->
  <rect x="57" y="22" width="5" height="64" rx="2" fill="#22c55e" stroke="#374151" stroke-width="1.2"/>
  <!-- Horizontal straw -->
  <rect x="24" y="50" width="72" height="5" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>

  <!-- Tape at intersection -->
  <rect x="54" y="47" width="12" height="11" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6" opacity="0.8"/>

  <!-- Tape at straw ends (attaching to bag) -->
  <rect x="55" y="20" width="10" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5" opacity="0.8"/>
  <rect x="55" y="82" width="10" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5" opacity="0.8"/>
  <rect x="22" y="48" width="6" height="10" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5" opacity="0.8"/>
  <rect x="92" y="48" width="6" height="10" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5" opacity="0.8"/>

  <!-- Arrows showing tape attachment points -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M14,40 Q18,44 22,48" fill="none" stroke="#374151" stroke-width="1" marker-end="url(#arr)" stroke-dasharray="2,2"/>
  <path d="M106,40 Q102,44 98,48" fill="none" stroke="#374151" stroke-width="1" marker-end="url(#arr)" stroke-dasharray="2,2"/>
</svg>