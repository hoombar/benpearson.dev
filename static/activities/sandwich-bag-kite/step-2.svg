<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Kite (bag with frame, decorated) -->
  <rect x="20" y="14" width="80" height="66" rx="3" fill="#dbeafe" stroke="#374151" stroke-width="1.5" opacity="0.5"/>
  <!-- Zip seal -->
  <line x1="20" y1="20" x2="100" y2="20" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Straw frame visible underneath -->
  <line x1="60" y1="16" x2="60" y2="78" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>
  <line x1="24" y1="47" x2="96" y2="47" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>

  <!-- Decorations drawn on bag -->
  <!-- Rainbow stripe -->
  <line x1="30" y1="32" x2="90" y2="32" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="36" x2="88" y2="36" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="40" x2="86" y2="40" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Star sticker -->
  <path d="M42,56 L43,52 L44,56 L48,56 L45,58 L46,62 L43,60 L40,62 L41,58 L38,56 Z"
        fill="#f59e0b" stroke="#374151" stroke-width="0.5"/>

  <!-- Swirl decoration -->
  <path d="M72,56 Q76,52 80,56 Q84,60 80,64 Q76,68 72,64" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>

  <!-- String tied through centre, hanging down -->
  <line x1="60" y1="47" x2="60" y2="96" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Knot -->
  <circle cx="60" cy="48" r="2" fill="#d97706" stroke="#374151" stroke-width="0.6"/>

  <!-- String coil at bottom -->
  <ellipse cx="60" cy="92" rx="8" ry="4" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <ellipse cx="60" cy="90" rx="6" ry="3" fill="none" stroke="#d97706" stroke-width="1"/>

  <!-- Marker nearby -->
  <line x1="108" y1="50" x2="108" y2="76" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="105.5" y="46" width="5" height="5" rx="1" fill="#c4b5fd" stroke="#374151" stroke-width="0.6"/>
</svg>