<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect x="0" y="0" width="120" height="84" fill="#dbeafe" stroke="none"/>
  <!-- Grass ground -->
  <rect x="0" y="84" width="120" height="36" fill="#86efac" stroke="none"/>
  <line x1="0" y1="84" x2="120" y2="84" stroke="#374151" stroke-width="1.5"/>

  <!-- Kite flying high in sky (hero) -->
  <g transform="translate(70,20) rotate(15)">
    <rect x="-16" y="-12" width="32" height="24" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="1.5" opacity="0.7"/>
    <!-- Frame lines -->
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <!-- Rainbow decoration -->
    <line x1="-12" y1="-6" x2="12" y2="-6" stroke="#ef4444" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-10" y1="-3" x2="10" y2="-3" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Star -->
    <path d="M-4,4 L-3,1 L-2,4 L1,4 L-1,6 L0,9 L-3,7 L-6,9 L-5,6 L-7,4 Z"
          fill="#f59e0b" stroke="#374151" stroke-width="0.3"/>
  </g>

  <!-- Kite string going down to figure -->
  <line x1="74" y1="32" x2="40" y2="88" stroke="#d97706" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Stick figure running and flying kite -->
  <!-- Head -->
  <circle cx="40" cy="68" r="5" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>
  <!-- Body -->
  <line x1="40" y1="73" x2="40" y2="92" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Legs (running pose) -->
  <line x1="40" y1="92" x2="34" y2="108" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="40" y1="92" x2="48" y2="106" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Arms — one holding string up -->
  <line x1="40" y1="78" x2="40" y2="88" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="40" y1="78" x2="48" y2="84" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Wind lines -->
  <line x1="90" y1="14" x2="100" y2="14" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="92" y1="18" x2="106" y2="18" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="88" y1="22" x2="98" y2="22" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Cloud -->
  <ellipse cx="20" cy="16" rx="12" ry="5" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>
  <ellipse cx="14" cy="14" rx="7" ry="4" fill="#f9fafb" stroke="none"/>
  <ellipse cx="26" cy="14" rx="7" ry="4" fill="#f9fafb" stroke="none"/>
</svg>