<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <!-- Table surface -->
  <line x1="5" y1="108" x2="115" y2="108" stroke="#e5e7eb" stroke-width="2"/>
  <!-- Sponge hull with pointed bow -->
  <path d="M30,80 L30,102 L85,102 L85,80 L95,91 Z" fill="#fde68a" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sponge texture dots -->
  <circle cx="42" cy="90" r="1.5" fill="#f59e0b" opacity="0.5"/>
  <circle cx="55" cy="86" r="1" fill="#f59e0b" opacity="0.5"/>
  <circle cx="65" cy="95" r="1.5" fill="#f59e0b" opacity="0.5"/>
  <circle cx="75" cy="88" r="1" fill="#f59e0b" opacity="0.5"/>
  <!-- Toothpick mast (vertical) -->
  <line x1="60" y1="18" x2="60" y2="82" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <!-- Paper sail - bowed curve -->
  <path d="M60,22 Q78,42 60,62" fill="#dbeafe" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Sail stripes decoration -->
  <path d="M60,30 Q72,38 60,46" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M60,38 Q68,44 60,50" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Top hole on sail -->
  <circle cx="60" cy="22" r="2" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <!-- Bottom hole on sail -->
  <circle cx="60" cy="62" r="2" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <!-- Small tape piece at base -->
  <rect x="56" y="78" width="8" height="5" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <!-- Arrow showing toothpick going into sponge -->
  <line x1="48" y1="72" x2="56" y2="80" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round"/>
  <!-- Hand pushing toothpick (simplified) -->
  <path d="M30,20 Q35,18 40,22 Q44,26 48,24" fill="#fef3c7" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill-opacity="0.7"/>
  <line x1="48" y1="24" x2="56" y2="22" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>
