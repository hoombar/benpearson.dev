<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <!-- Basin / bowl of water -->
  <path d="M8,55 Q8,105 60,105 Q112,105 112,55" fill="#dbeafe" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="55" x2="112" y2="55" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Water surface shimmer -->
  <path d="M20,58 Q30,54 40,58 Q50,62 60,58 Q70,54 80,58 Q90,62 100,58" fill="none" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
  <!-- Boat 1 (left, yellow sail) -->
  <g transform="translate(28, 52)">
    <!-- Sponge hull -->
    <path d="M-10,5 L-10,14 L12,14 L12,5 L16,10 Z" fill="#fde68a" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Mast -->
    <line x1="2" y1="-22" x2="2" y2="6" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Sail -->
    <path d="M2,-20 Q14,-10 2,0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/>
  </g>
  <!-- Boat 2 (right, blue sail) -->
  <g transform="translate(75, 50)">
    <!-- Sponge hull -->
    <path d="M-10,5 L-10,14 L12,14 L12,5 L16,10 Z" fill="#fde68a" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Mast -->
    <line x1="2" y1="-22" x2="2" y2="6" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Sail -->
    <path d="M2,-20 Q14,-10 2,0" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  </g>
  <!-- Wind/blow lines from left -->
  <line x1="3" y1="35" x2="18" y2="37" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <line x1="3" y1="42" x2="18" y2="43" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <line x1="3" y1="49" x2="18" y2="49" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Speed lines behind boats -->
  <line x1="14" y1="62" x2="8" y2="62" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
  <line x1="14" y1="66" x2="10" y2="66" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="54" y2="60" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
  <line x1="60" y1="64" x2="56" y2="64" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
  <!-- Small wave splashes -->
  <path d="M45,56 Q47,52 49,56" fill="none" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
  <path d="M90,54 Q92,50 94,54" fill="none" stroke="#93c5fd" stroke-width="1" stroke-linecap="round"/>
</svg>
