<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <!-- Table surface -->
  <line x1="5" y1="95" x2="115" y2="95" stroke="#e5e7eb" stroke-width="2"/>
  <!-- Sponge - rectangular, before cutting -->
  <rect x="15" y="62" width="40" height="28" rx="3" fill="#fde68a" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Sponge texture dots -->
  <circle cx="25" cy="72" r="1.5" fill="#f59e0b" opacity="0.5"/>
  <circle cx="35" cy="68" r="1" fill="#f59e0b" opacity="0.5"/>
  <circle cx="42" cy="78" r="1.5" fill="#f59e0b" opacity="0.5"/>
  <circle cx="30" cy="82" r="1" fill="#f59e0b" opacity="0.5"/>
  <circle cx="45" cy="85" r="1" fill="#f59e0b" opacity="0.5"/>
  <!-- Dashed cut lines showing diagonal bow cuts -->
  <line x1="55" y1="62" x2="45" y2="76" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>
  <line x1="55" y1="90" x2="45" y2="76" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>
  <!-- Arrow showing cut direction -->
  <line x1="58" y1="70" x2="48" y2="74" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round"/>
  <!-- Scissors -->
  <g transform="translate(72, 68) rotate(-15)">
    <!-- Blade 1 -->
    <path d="M0,0 L22,0" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <!-- Blade 2 -->
    <path d="M0,0 L20,8" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <!-- Pivot -->
    <circle cx="0" cy="0" r="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <!-- Handle 1 -->
    <ellipse cx="-8" cy="-3" rx="6" ry="4" fill="none" stroke="#ef4444" stroke-width="2"/>
    <!-- Handle 2 -->
    <ellipse cx="-8" cy="5" rx="6" ry="4" fill="none" stroke="#ef4444" stroke-width="2"/>
  </g>
  <!-- Result: cut sponge with pointed bow -->
  <g transform="translate(70, 20)">
    <path d="M0,10 L0,38 L35,38 L35,10 L42,24 Z" fill="#fde68a" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Texture dots on result -->
    <circle cx="10" cy="20" r="1.5" fill="#f59e0b" opacity="0.5"/>
    <circle cx="20" cy="28" r="1" fill="#f59e0b" opacity="0.5"/>
    <circle cx="28" cy="18" r="1.5" fill="#f59e0b" opacity="0.5"/>
  </g>
  <!-- Arrow from original to result -->
  <path d="M45,55 Q60,35 68,30" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>
