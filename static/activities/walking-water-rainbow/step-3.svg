<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5e6"/>
      <stop offset="100%" stop-color="#ffdcb3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="20%" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <rect x="0" y="220" width="400" height="80" fill="#f0e6d2"/>
  <line x1="0" y1="220" x2="400" y2="220" stroke="#dcb48c" stroke-width="3"/>
  
  <g transform="translate(0, 140)">
    <!-- Jars -->
    <g transform="translate(40, 0)" filter="url(#shadow)">
      <path d="M 0 0 L 40 0 L 40 80 A 5 5 0 0 1 35 85 L 5 85 A 5 5 0 0 1 0 80 Z" fill="#ff6666" opacity="0.8"/>
      <path d="M 0 -20 L 40 -20 L 40 80 A 5 5 0 0 1 35 85 L 5 85 A 5 5 0 0 1 0 80 Z" fill="url(#glass)" stroke="#ccc" stroke-width="2"/>
    </g>
    <g transform="translate(110, 0)" filter="url(#shadow)">
      <path d="M 0 -20 L 40 -20 L 40 80 A 5 5 0 0 1 35 85 L 5 85 A 5 5 0 0 1 0 80 Z" fill="url(#glass)" stroke="#ccc" stroke-width="2"/>
    </g>
    <g transform="translate(180, 0)" filter="url(#shadow)">
      <path d="M 0 0 L 40 0 L 40 80 A 5 5 0 0 1 35 85 L 5 85 A 5 5 0 0 1 0 80 Z" fill="#ffff66" opacity="0.8"/>
      <path d="M 0 -20 L 40 -20 L 40 80 A 5 5 0 0 1 35 85 L 5 85 A 5 5 0 0 1 0 80 Z" fill="url(#glass)" stroke="#ccc" stroke-width="2"/>
    </g>
    <g transform="translate(250, 0)" filter="url(#shadow)">
      <path d="M 0 -20 L 40 -20 L 40 80 A 5 5 0 0 1 35 85 L 5 85 A 5 5 0 0 1 0 80 Z" fill="url(#glass)" stroke="#ccc" stroke-width="2"/>
    </g>
    <g transform="translate(320, 0)" filter="url(#shadow)">
      <path d="M 0 0 L 40 0 L 40 80 A 5 5 0 0 1 35 85 L 5 85 A 5 5 0 0 1 0 80 Z" fill="#66b3ff" opacity="0.8"/>
      <path d="M 0 -20 L 40 -20 L 40 80 A 5 5 0 0 1 35 85 L 5 85 A 5 5 0 0 1 0 80 Z" fill="url(#glass)" stroke="#ccc" stroke-width="2"/>
    </g>
    
    <!-- Paper towels -->
    <path d="M 60 40 Q 95 -60 130 60" fill="none" stroke="#f8f8f8" stroke-width="12" filter="url(#shadow)"/>
    <path d="M 60 40 Q 95 -60 130 60" fill="none" stroke="#eee" stroke-width="12" stroke-dasharray="2,4" opacity="0.5"/>
    
    <path d="M 130 60 Q 165 -60 200 40" fill="none" stroke="#f8f8f8" stroke-width="12" filter="url(#shadow)"/>
    <path d="M 130 60 Q 165 -60 200 40" fill="none" stroke="#eee" stroke-width="12" stroke-dasharray="2,4" opacity="0.5"/>
    
    <path d="M 200 40 Q 235 -60 270 60" fill="none" stroke="#f8f8f8" stroke-width="12" filter="url(#shadow)"/>
    <path d="M 200 40 Q 235 -60 270 60" fill="none" stroke="#eee" stroke-width="12" stroke-dasharray="2,4" opacity="0.5"/>
    
    <path d="M 270 60 Q 305 -60 340 40" fill="none" stroke="#f8f8f8" stroke-width="12" filter="url(#shadow)"/>
    <path d="M 270 60 Q 305 -60 340 40" fill="none" stroke="#eee" stroke-width="12" stroke-dasharray="2,4" opacity="0.5"/>
  </g>
</svg>