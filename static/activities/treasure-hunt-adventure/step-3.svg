<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 3: Hide clues backwards — treasure first, then clues in reverse -->

  <!-- Marker defs — auto-align diagonal arrows to their line direction -->
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#ef4444" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#22c55e" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-white" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#f9fafb" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Treasure chest (top-right = placed first / hidden first) -->
  <g transform="translate(94, 28)">
    <rect x="-16" y="-10" width="32" height="22" rx="2" fill="#d97706" stroke="#374151" stroke-width="2"/>
    <path d="M-16,-10 Q-16,-20 0,-20 Q16,-20 16,-10 Z" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
    <!-- Lock -->
    <rect x="-4" y="-4" width="8" height="7" rx="1.5" fill="#fbbf24" stroke="#374151" stroke-width="1"/>
    <circle cx="0" cy="-1" r="2" fill="#f59e0b" stroke="#374151" stroke-width="0.8"/>
    <!-- Gold coins hint -->
    <ellipse cx="-8" cy="-12" rx="4" ry="2.5" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
    <ellipse cx="8" cy="-12" rx="4" ry="2.5" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  </g>

  <!-- Arrow 1: chest → clue 3 — straight horizontal left, hand-placed V fine -->
  <line x1="77" y1="28" x2="60" y2="28" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2" stroke-linecap="round"/>
  <path d="M63,24 L58,28 L63,32" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clue paper 3 (last clue hidden, points to chest) -->
  <rect x="36" y="16" width="22" height="28" rx="2" fill="#fef9c3" stroke="#374151" stroke-width="2"/>
  <!-- Arrow drawn on clue 3 pointing right — straight horizontal, hand-placed V fine -->
  <line x1="42" y1="30" x2="54" y2="30" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <path d="M51,26 L55,30 L51,34" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow 2: clue 3 → clue 2 — diagonal (−17,12) = 145°, marker auto-aligns -->
  <line x1="35" y1="48" x2="18" y2="60" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2" stroke-linecap="round" marker-end="url(#arr-red)"/>

  <!-- Clue paper 2 -->
  <rect x="6" y="62" width="22" height="28" rx="2" fill="#fef9c3" stroke="#374151" stroke-width="2"/>
  <!-- Arrow on clue 2 — straight horizontal right, hand-placed V fine -->
  <line x1="12" y1="76" x2="24" y2="76" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <path d="M21,72 L25,76 L21,80" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow 3: clue 2 → clue 1 — diagonal (18,6) = 18°, marker auto-aligns -->
  <line x1="28" y1="82" x2="46" y2="88" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2" stroke-linecap="round" marker-end="url(#arr-red)"/>

  <!-- Clue paper 1 (first given to child) -->
  <rect x="48" y="82" width="22" height="28" rx="2" fill="#fef9c3" stroke="#374151" stroke-width="2.5"/>
  <!-- Star on clue 1 (start marker) -->
  <path d="M59,90 L61,96 L67,96 L62,100 L64,106 L59,102 L54,106 L56,100 L51,96 L57,96 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1" stroke-linejoin="round"/>

  <!-- Clue paper 4 (right side, pointing to clue 3) -->
  <rect x="72" y="58" width="22" height="28" rx="2" fill="#fef9c3" stroke="#374151" stroke-width="2"/>
  <!-- Arrow on clue 4 — straight horizontal right, hand-placed V fine -->
  <line x1="78" y1="72" x2="90" y2="72" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <path d="M87,68 L91,72 L87,76" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow: clue 4 → clue 3 — diagonal (−14,−14) = up-left 45°, marker auto-aligns -->
  <line x1="72" y1="58" x2="58" y2="44" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2" stroke-linecap="round" marker-end="url(#arr-red)"/>

  <!-- Label: "START" badge on clue 1 -->
  <rect x="46" y="108" width="26" height="10" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <!-- Small arrow on badge — straight horizontal right, hand-placed V fine -->
  <line x1="52" y1="113" x2="64" y2="113" stroke="#f9fafb" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M62,110 L65,113 L62,116" fill="none" stroke="#f9fafb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
