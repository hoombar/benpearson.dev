<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 1: Write the clues — colourful clue papers with picture and arrow -->

  <!-- Back clue paper (stack depth) -->
  <rect x="26" y="14" width="72" height="90" rx="2" fill="#fde68a" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Hero: front clue paper (parchment yellow) -->
  <rect x="18" y="10" width="72" height="90" rx="2" fill="#fef9c3" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Paper worn edge lines -->
  <line x1="22" y1="14" x2="86" y2="14" stroke="#fde68a" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="22" y1="17" x2="86" y2="17" stroke="#fde68a" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Clue picture: house drawing (picture clue for bedroom) -->
  <!-- House body -->
  <rect x="28" y="42" width="30" height="22" rx="1" fill="#fca5a5" stroke="#374151" stroke-width="2"/>
  <!-- Roof -->
  <path d="M26,42 L43,28 L60,42 Z" fill="#ef4444" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <!-- Door -->
  <rect x="37" y="52" width="10" height="12" rx="1" fill="#d97706" stroke="#374151" stroke-width="1.5"/>
  <!-- Window -->
  <rect x="30" y="46" width="8" height="7" rx="1" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
  <!-- Window cross -->
  <line x1="34" y1="46" x2="34" y2="53" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="30" y1="49" x2="38" y2="49" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Bold colourful forward arrow (points to next clue location) -->
  <line x1="64" y1="54" x2="82" y2="54" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <path d="M78,48 L84,54 L78,60" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Question marks / hint text lines at top -->
  <line x1="26" y1="22" x2="82" y2="22" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="30" x2="74" y2="30" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Marker (writing tool, upper-right) -->
  <g transform="translate(108,16) rotate(140)">
    <rect x="-4" y="-22" width="8" height="6" rx="2" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
    <rect x="-4" y="-16" width="8" height="26" rx="1" fill="#86efac" stroke="#374151" stroke-width="1.5"/>
    <rect x="-4" y="-6" width="8" height="10" fill="#d1fae5" stroke="none"/>
    <polygon points="-3,10 3,10 0,18" fill="#374151" stroke="#374151" stroke-width="1" stroke-linejoin="round"/>
  </g>
</svg>
