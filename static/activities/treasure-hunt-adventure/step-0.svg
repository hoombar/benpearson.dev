<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 0: Plan the route — parchment map with route drawn on it -->

  <!-- Map paper (parchment, hero) -->
  <rect x="8" y="8" width="96" height="104" rx="3" fill="#fef9c3" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Torn/worn edges detail -->
  <rect x="8" y="8" width="96" height="104" rx="3" fill="none" stroke="#fde68a" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Room icons drawn on the map -->
  <!-- Room 1: sofa (living room) bottom-left -->
  <rect x="18" y="78" width="20" height="14" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
  <rect x="16" y="74" width="24" height="6" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>

  <!-- Room 2: sink (kitchen) middle -->
  <rect x="50" y="54" width="18" height="14" rx="2" fill="#86efac" stroke="#374151" stroke-width="1.5"/>
  <circle cx="59" cy="61" r="3" fill="#f9fafb" stroke="#374151" stroke-width="1"/>

  <!-- Room 3: bathtub (bathroom) upper-right -->
  <ellipse cx="88" cy="36" rx="14" ry="8" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <rect x="74" y="34" width="28" height="10" rx="3" fill="#bfdbfe" stroke="#374151" stroke-width="1"/>

  <!-- Room 4: bed (bedroom) lower-right — treasure end -->
  <rect x="72" y="76" width="28" height="18" rx="2" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <rect x="72" y="76" width="28" height="8" rx="2" fill="#f59e0b" stroke="#374151" stroke-width="1"/>

  <!-- Dashed route path connecting rooms -->
  <path d="M32,80 Q40,68 50,62" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" fill="none" stroke-linecap="round"/>
  <path d="M68,62 Q76,52 80,42" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" fill="none" stroke-linecap="round"/>
  <path d="M84,42 Q90,58 88,72" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" fill="none" stroke-linecap="round"/>

  <!-- Route direction arrows -->
  <path d="M47,65 L50,62 L53,65" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M83,73 L86,76 L89,73" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- X marks the treasure spot -->
  <line x1="82" y1="80" x2="90" y2="88" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="90" y1="80" x2="82" y2="88" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pencil (planning tool, top-right corner) -->
  <g transform="translate(108,14) rotate(145)">
    <rect x="-3" y="-18" width="6" height="24" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
    <rect x="-3" y="-18" width="6" height="4" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
    <polygon points="-3,6 3,6 0,13" fill="#fde68a" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="0" cy="12" r="1.2" fill="#374151"/>
  </g>
</svg>
