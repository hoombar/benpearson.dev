<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 4: Make the Start Map — colourful adventure launch card -->

  <!-- Card background (hero) — vivid adventure map -->
  <rect x="6" y="8" width="108" height="104" rx="4" fill="#fef9c3" stroke="#374151" stroke-width="2.5"/>
  <!-- Decorative double border -->
  <rect x="12" y="14" width="96" height="92" rx="3" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <rect x="16" y="18" width="88" height="84" rx="2" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- Corner decorations (diamonds) -->
  <path d="M22,20 L28,14 L34,20 L28,26 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M86,20 L92,14 L98,20 L92,26 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M22,100 L28,94 L34,100 L28,106 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M86,100 L92,94 L98,100 L92,106 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Big bold X in centre (treasure map X) -->
  <line x1="44" y1="34" x2="76" y2="66" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <line x1="76" y1="34" x2="44" y2="66" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <!-- X highlight (slightly offset lighter lines for depth) -->
  <line x1="45" y1="33" x2="77" y2="65" stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>
  <line x1="77" y1="33" x2="45" y2="65" stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>

  <!-- Star burst around X -->
  <circle cx="60" cy="50" r="18" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Compass rose (lower-left) -->
  <g transform="translate(28, 86)">
    <circle cx="0" cy="0" r="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <!-- N pointer (red) -->
    <path d="M0,-10 L3,0 L0,-4 L-3,0 Z" fill="#ef4444" stroke="#374151" stroke-width="1"/>
    <!-- S pointer (white/light) -->
    <path d="M0,10 L3,0 L0,4 L-3,0 Z" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
    <!-- E pointer -->
    <path d="M10,0 L0,3 L4,0 L0,-3 Z" fill="#374151" stroke="#374151" stroke-width="0.5"/>
    <!-- W pointer -->
    <path d="M-10,0 L0,3 L-4,0 L0,-3 Z" fill="#374151" stroke="#374151" stroke-width="0.5"/>
    <!-- Centre dot -->
    <circle cx="0" cy="0" r="2" fill="#374151"/>
  </g>

  <!-- "Your Adventure Begins" implied by the bold arrow at bottom -->
  <line x1="42" y1="100" x2="80" y2="100" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <path d="M76,95 L82,100 L76,105" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Footprint trail hints (3 pairs of footprints heading right) -->
  <ellipse cx="44" cy="90" rx="3" ry="2" fill="#d97706" transform="rotate(-15,44,90)"/>
  <ellipse cx="50" cy="87" rx="3" ry="2" fill="#d97706" transform="rotate(15,50,87)"/>
  <ellipse cx="56" cy="90" rx="3" ry="2" fill="#d97706" transform="rotate(-15,56,90)"/>
  <ellipse cx="62" cy="87" rx="3" ry="2" fill="#d97706" transform="rotate(15,62,87)"/>
  <ellipse cx="68" cy="90" rx="3" ry="2" fill="#d97706" transform="rotate(-15,68,90)"/>
  <ellipse cx="74" cy="87" rx="3" ry="2" fill="#d97706" transform="rotate(15,74,87)"/>
</svg>
