<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Castle Base -->
  <rect x="30" y="40" width="60" height="60" rx="2" stroke="#374151" stroke-width="2.5" fill="#fbbf24"/>
  
  <!-- Towers -->
  <rect x="20" y="30" width="18" height="60" rx="2" stroke="#374151" stroke-width="2.5" fill="#d97706"/>
  <rect x="82" y="30" width="18" height="60" rx="2" stroke="#374151" stroke-width="2.5" fill="#d97706"/>
  
  <!-- Flags -->
  <line x1="29" y1="30" x2="29" y2="10" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <polygon points="29,10 40,15 29,20" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <line x1="91" y1="30" x2="91" y2="10" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <polygon points="91,10 102,15 91,20" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  
  <!-- Decorations -->
  <!-- Drawbridge -->
  <path d="M45 100 L45 70 Q60 65 75 70 L75 100" fill="#92400e" stroke="#374151" stroke-width="2.5"/>
  <!-- Chains -->
  <line x1="45" y1="70" x2="35" y2="55" stroke="#374151" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="75" y1="70" x2="85" y2="55" stroke="#374151" stroke-width="1.5" stroke-dasharray="2,2"/>
  
  <!-- Stone patterns -->
  <line x1="30" y1="50" x2="40" y2="50" stroke="#374151" stroke-width="1.5"/>
  <line x1="30" y1="60" x2="40" y2="60" stroke="#374151" stroke-width="1.5"/>
  <line x1="80" y1="50" x2="90" y2="50" stroke="#374151" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="90" y2="60" stroke="#374151" stroke-width="1.5"/>
  
  <!-- Windows -->
  <rect x="25" y="40" width="8" height="12" rx="4" fill="#374151"/>
  
  <!-- Marker drawing a window -->
  <rect x="87" y="40" width="8" height="12" rx="4" fill="#374151"/>
  <g transform="translate(90, 45) rotate(135)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-2 2 L-6 0 L-2 -2 Z" stroke="#374151" stroke-width="1.5" fill="#3b82f6"/>
    <rect x="0" y="-3" width="16" height="6" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  </g>
</svg>