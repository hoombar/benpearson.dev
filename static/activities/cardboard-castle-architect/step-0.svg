<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Surface -->
  <rect x="8" y="80" width="104" height="20" rx="2" stroke="#374151" stroke-width="2" fill="#fef3c7"/>
  
  <!-- Big box -->
  <rect x="16" y="44" width="36" height="36" rx="2" stroke="#374151" stroke-width="2" fill="#d97706"/>
  <path d="M16 44 L24 36 L52 36 L60 44" stroke="#374151" stroke-width="2" fill="none"/>
  
  <!-- Small box -->
  <rect x="56" y="56" width="24" height="24" rx="2" stroke="#374151" stroke-width="2" fill="#fbbf24"/>
  <path d="M56 56 L62 50 L80 50 L86 56" stroke="#374151" stroke-width="2" fill="none"/>
  
  <!-- Tube 1 -->
  <rect x="88" y="48" width="10" height="32" rx="2" stroke="#374151" stroke-width="2" fill="#d97706"/>
  <!-- Tube 2 -->
  <rect x="100" y="48" width="10" height="32" rx="2" stroke="#374151" stroke-width="2" fill="#d97706"/>
  
  <!-- Scissors -->
  <g transform="translate(30, 88) rotate(-20)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="14" y2="4" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-4" cy="-4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <circle cx="-4" cy="4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  </g>
  
  <!-- Tape -->
  <circle cx="70" cy="88" r="8" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <circle cx="70" cy="88" r="4" fill="none" stroke="#374151" stroke-width="2"/>
  
  <!-- Marker -->
  <g transform="translate(90, 88) rotate(15)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-2 2 L-6 0 L-2 -2 Z" stroke="#374151" stroke-width="1.5" fill="#ef4444"/>
    <rect x="0" y="-3" width="14" height="6" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  </g>
</svg>