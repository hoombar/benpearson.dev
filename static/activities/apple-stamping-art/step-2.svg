<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Plate -->
  <ellipse cx="60" cy="85" rx="45" ry="15" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>

  <!-- Paint puddle on plate -->
  <path d="M40,85 Q50,75 60,82 Q75,78 80,85 Q80,92 60,90 Q40,92 40,85 Z" fill="#ef4444" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Apple half dipping -->
  <g transform="translate(60, 75)">
    <!-- Apple body (upside down) -->
    <path d="M-20,0 C-20,-25 20,-25 20,0 Z" fill="#ef4444" stroke="#374151" stroke-width="2"/>
    <!-- Stem/Fork sticking out top -->
    <path d="M0,-22 L0,-40" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
    <path d="M0,-40 L0,-50" stroke="#374151" stroke-width="4" stroke-linecap="round"/> <!-- fork handle -->
  </g>

  <!-- Motion arrow down -->
  <path d="M40,40 Q40,55 50,65" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>