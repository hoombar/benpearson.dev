<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Left Apple Half (showing inside) -->
  <g transform="translate(35, 65)">
    <!-- Skin -->
    <path d="M-20,0 C-20,-20 20,-20 20,0 C20,20 -20,20 -20,0 Z" fill="#fca5a5" stroke="#374151" stroke-width="2"/>
    <!-- Flesh -->
    <path d="M-16,0 C-16,-16 16,-16 16,0 C16,16 -16,16 -16,0 Z" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
    <!-- Star Core -->
    <path d="M0,-6 L2,-2 L6,-2 L3,1 L4,5 L0,3 L-4,5 L-3,1 L-6,-2 L-2,-2 Z" fill="none" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="-1" cy="0" r="1" fill="#374151"/>
    <circle cx="1" cy="2" r="1" fill="#374151"/>
  </g>

  <!-- Right Apple Half (showing outside) -->
  <g transform="translate(85, 65)">
    <!-- Body -->
    <path d="M-20,0 C-20,-25 20,-25 20,0 C20,20 -20,20 -20,0 Z" fill="#ef4444" stroke="#374151" stroke-width="2"/>
    <!-- Stem -->
    <path d="M0,-22 Q5,-30 10,-30" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <!-- Leaf -->
    <path d="M5,-28 Q15,-35 20,-25 Q10,-20 5,-28 Z" fill="#22c55e" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Knife slicing downwards -->
  <g transform="translate(60, 25)">
    <!-- Blade -->
    <path d="M-4,15 L-4,35 C-4,40 4,40 4,35 L4,-5 Z" fill="#dbeafe" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <!-- Handle -->
    <rect x="-6" y="-30" width="12" height="25" rx="3" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  </g>

  <!-- Action lines -->
  <line x1="60" y1="60" x2="60" y2="85" stroke="#374151" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
</svg>