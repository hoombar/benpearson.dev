<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Paper -->
  <rect x="20" y="20" width="80" height="80" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2"/>

  <!-- Already stamped prints -->
  <g transform="translate(40, 40) scale(0.6)">
    <path d="M-20,0 C-20,-20 20,-20 20,0 C20,20 -20,20 -20,0 Z" fill="#ef4444" stroke="none" opacity="0.8"/>
    <!-- Star core unpainted (paper shows through) -->
    <path d="M0,-6 L2,-2 L6,-2 L3,1 L4,5 L0,3 L-4,5 L-3,1 L-6,-2 L-2,-2 Z" fill="#f9fafb" stroke="none"/>
  </g>
  <g transform="translate(80, 50) scale(0.6)">
    <path d="M-20,0 C-20,-20 20,-20 20,0 C20,20 -20,20 -20,0 Z" fill="#ef4444" stroke="none" opacity="0.8"/>
    <!-- Star core -->
    <path d="M0,-6 L2,-2 L6,-2 L3,1 L4,5 L0,3 L-4,5 L-3,1 L-6,-2 L-2,-2 Z" fill="#f9fafb" stroke="none"/>
  </g>

  <!-- Apple stamping down -->
  <g transform="translate(50, 80)">
    <!-- Apple body -->
    <path d="M-20,0 C-20,-25 20,-25 20,0 Z" fill="#ef4444" stroke="#374151" stroke-width="2"/>
    <!-- Fork sticking out -->
    <path d="M0,-22 L0,-40" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
    <path d="M0,-40 L0,-50" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Motion lines lifting up -->
  <path d="M80,80 Q70,70 60,65" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>