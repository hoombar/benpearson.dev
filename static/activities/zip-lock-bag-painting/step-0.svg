<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Open zip-lock bag (hero) -->
  <g transform="translate(14, 18)">
    <!-- Bag body -->
    <rect x="0" y="8" width="70" height="70" rx="1" fill="#e0f2fe" stroke="#374151" stroke-width="1.2" opacity="0.6"/>
    <!-- Zip-lock seal strip (open) -->
    <rect x="0" y="4" width="70" height="6" rx="1" fill="#93c5fd" stroke="#374151" stroke-width="0.8"/>
    <!-- Opening flap folded back -->
    <path d="M0,4 Q10,-6 35,-8 Q60,-6 70,4" fill="#dbeafe" stroke="#374151" stroke-width="0.8" opacity="0.5"/>

    <!-- Paint blobs inside -->
    <!-- Red blob -->
    <circle cx="16" cy="36" r="8" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
    <!-- Yellow blob -->
    <circle cx="36" cy="42" r="9" fill="#eab308" stroke="#374151" stroke-width="0.6"/>
    <!-- Blue blob -->
    <circle cx="56" cy="36" r="8" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>
    <!-- Green blob -->
    <circle cx="26" cy="58" r="7" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
    <!-- Purple blob -->
    <circle cx="48" cy="60" r="7" fill="#a855f7" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint tube squeezing -->
  <g transform="translate(86, 20) rotate(30)">
    <!-- Tube body -->
    <rect x="0" y="-6" width="28" height="12" rx="3" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <!-- Tube cap -->
    <rect x="-4" y="-4" width="5" height="8" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <!-- Nozzle -->
    <rect x="-7" y="-2" width="4" height="4" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.5"/>
    <!-- Squeeze marks -->
    <line x1="10" y1="-4" x2="10" y2="4" stroke="#b91c1c" stroke-width="0.5"/>
    <line x1="18" y1="-4" x2="18" y2="4" stroke="#b91c1c" stroke-width="0.5"/>
  </g>

  <!-- Paint drop falling from tube -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>
  <path d="M84,30 Q82,36 78,40" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
