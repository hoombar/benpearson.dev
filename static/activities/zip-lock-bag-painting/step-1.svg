<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Sealed zip-lock bag with paint (hero) -->
  <g transform="translate(10, 20)">
    <!-- Bag body -->
    <rect x="0" y="8" width="76" height="66" rx="1" fill="#e0f2fe" stroke="#374151" stroke-width="1.2" opacity="0.6"/>
    <!-- Zip-lock seal strip (closed) -->
    <rect x="0" y="4" width="76" height="6" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
    <!-- Seal detail lines -->
    <line x1="2" y1="7" x2="74" y2="7" stroke="#1d4ed8" stroke-width="0.5"/>

    <!-- Paint blobs inside -->
    <circle cx="18" cy="36" r="8" fill="#ef4444" stroke="none" opacity="0.8"/>
    <circle cx="38" cy="40" r="9" fill="#eab308" stroke="none" opacity="0.8"/>
    <circle cx="58" cy="36" r="8" fill="#3b82f6" stroke="none" opacity="0.7"/>
    <circle cx="28" cy="56" r="7" fill="#22c55e" stroke="none" opacity="0.8"/>
    <circle cx="50" cy="58" r="7" fill="#a855f7" stroke="none" opacity="0.8"/>
  </g>

  <!-- Hand pressing along seal -->
  <g transform="translate(56, 8)">
    <!-- Finger pressing seal -->
    <rect x="0" y="0" width="14" height="22" rx="7" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="16" y="2" width="12" height="18" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrow showing sealing direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="56" y1="16" x2="36" y2="22" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Tape being added along top edge -->
  <rect x="10" y="20" width="76" height="5" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.4" opacity="0.7"/>

  <!-- Tape roll -->
  <g transform="translate(92, 60)">
    <ellipse cx="10" cy="10" rx="10" ry="10" fill="#d1fae5" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="10" cy="10" rx="4" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Checkmark for sealed -->
  <g transform="translate(92, 30)">
    <circle cx="10" cy="10" r="10" fill="#d1fae5" stroke="#374151" stroke-width="0.8"/>
    <polyline points="5,10 9,14 16,6" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
