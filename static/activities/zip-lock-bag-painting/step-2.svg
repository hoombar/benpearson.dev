<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Sealed bag with mixed/swirled paint (hero) -->
  <g transform="translate(8, 16)">
    <!-- Bag body -->
    <rect x="0" y="8" width="84" height="72" rx="1" fill="#e0f2fe" stroke="#374151" stroke-width="1.2" opacity="0.5"/>
    <!-- Zip-lock seal -->
    <rect x="0" y="4" width="84" height="6" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
    <!-- Tape strip -->
    <rect x="0" y="4" width="84" height="5" rx="1" fill="#d1fae5" stroke="none" opacity="0.5"/>

    <!-- Swirled paint inside - blended streaks -->
    <path d="M10,30 Q24,20 40,35 Q56,50 70,30" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M14,50 Q30,40 46,55 Q62,70 74,50" fill="none" stroke="#eab308" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <path d="M8,42 Q22,60 42,42 Q62,24 76,42" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <!-- Blended areas -->
    <circle cx="32" cy="38" r="6" fill="#f97316" opacity="0.5"/>
    <circle cx="52" cy="44" r="5" fill="#22c55e" opacity="0.5"/>
    <circle cx="20" cy="54" r="5" fill="#a855f7" opacity="0.5"/>
  </g>

  <!-- Hands pressing on bag -->
  <g transform="translate(30, 38)">
    <!-- Left hand palm -->
    <ellipse cx="12" cy="12" rx="14" ry="12" fill="#fcd9b6" stroke="#374151" stroke-width="0.8" opacity="0.7"/>
    <!-- Fingers spread -->
    <rect x="2" y="-6" width="6" height="14" rx="3" fill="#fcd9b6" stroke="#374151" stroke-width="0.6" opacity="0.7"/>
    <rect x="10" y="-8" width="6" height="14" rx="3" fill="#fcd9b6" stroke="#374151" stroke-width="0.6" opacity="0.7"/>
    <rect x="18" y="-6" width="6" height="14" rx="3" fill="#fcd9b6" stroke="#374151" stroke-width="0.6" opacity="0.7"/>
  </g>

  <!-- Swirl motion arrows -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M98,40 Q106,50 98,60 Q90,70 98,80" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Colour mixing hint: red + yellow = orange -->
  <g transform="translate(96, 16)">
    <circle cx="4" cy="4" r="4" fill="#ef4444" stroke="#374151" stroke-width="0.4"/>
    <circle cx="16" cy="4" r="4" fill="#eab308" stroke="#374151" stroke-width="0.4"/>
    <circle cx="10" cy="14" r="5" fill="#f97316" stroke="#374151" stroke-width="0.4"/>
  </g>
</svg>
