<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Cardboard tube being painted (hero) -->
  <g transform="translate(26, 14)">
    <!-- Tube body -->
    <rect x="0" y="0" width="30" height="76" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
    <!-- Top ellipse -->
    <ellipse cx="15" cy="2" rx="15" ry="5" fill="#b0b8c4" stroke="#374151" stroke-width="1.2"/>
    <!-- Paint being applied (silver/white) -->
    <rect x="0" y="10" width="30" height="50" rx="1" fill="#e5e7eb" stroke="none" opacity="0.8"/>
  </g>

  <!-- Paintbrush applying paint -->
  <g transform="translate(58, 36) rotate(15)">
    <!-- Handle -->
    <rect x="0" y="-3" width="36" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <!-- Ferrule -->
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <!-- Bristles -->
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pot -->
  <g transform="translate(82, 66)">
    <rect x="0" y="0" width="22" height="24" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
    <rect x="2" y="4" width="18" height="18" rx="1" fill="#d1d5db" stroke="none"/>
    <rect x="-1" y="-2" width="24" height="5" rx="2" fill="#9ca3af" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Extra paint pots (different colours to choose from) -->
  <g transform="translate(6, 78)">
    <rect x="0" y="0" width="14" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
    <rect x="2" y="3" width="10" height="11" rx="1" fill="#3b82f6" stroke="none"/>
  </g>
  <g transform="translate(6, 56)">
    <rect x="0" y="0" width="14" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
    <rect x="2" y="3" width="10" height="11" rx="1" fill="#ef4444" stroke="none"/>
  </g>

  <!-- Painting motion arrow -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M52,62 Q48,72 52,80" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
