<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Rocket tube with fins being attached (hero) -->
  <g transform="translate(30, 6)">
    <!-- Nose cone on top -->
    <polygon points="15,0 0,24 30,24" fill="white" stroke="#374151" stroke-width="1.2"/>

    <!-- Tube body -->
    <rect x="0" y="24" width="30" height="56" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>

    <!-- Fin left (already attached) -->
    <polygon points="0,62 -14,80 0,80" fill="#d4a574" stroke="#374151" stroke-width="1"/>
    <!-- Tab fold line -->
    <line x1="0" y1="62" x2="0" y2="80" stroke="#374151" stroke-width="0.4" stroke-dasharray="2,2"/>

    <!-- Fin right (already attached) -->
    <polygon points="30,62 44,80 30,80" fill="#d4a574" stroke="#374151" stroke-width="1"/>
    <line x1="30" y1="62" x2="30" y2="80" stroke="#374151" stroke-width="0.4" stroke-dasharray="2,2"/>

    <!-- Fin back (visible at bottom) -->
    <polygon points="12,72 18,72 15,80" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Loose fin being attached with tape -->
  <g transform="translate(76, 50)">
    <!-- Triangle fin -->
    <polygon points="0,0 20,20 0,20" fill="#d4a574" stroke="#374151" stroke-width="1"/>
    <!-- Fold tab -->
    <rect x="-4" y="0" width="4" height="20" fill="#d4a574" stroke="#374151" stroke-width="0.5" stroke-dasharray="2,1"/>
  </g>

  <!-- Arrow showing fin attachment -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="76" y1="60" x2="66" y2="68" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Tape pieces -->
  <rect x="86" y="38" width="12" height="4" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.4"/>
  <rect x="90" y="44" width="12" height="4" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.4"/>

  <!-- Scissors nearby -->
  <g transform="translate(8, 82)">
    <path d="M0,0 L12,3" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L12,-3" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1" fill="#374151"/>
    <ellipse cx="15" cy="4" rx="3.5" ry="2.5" fill="none" stroke="#ef4444" stroke-width="1"/>
    <ellipse cx="15" cy="-4" rx="3.5" ry="2.5" fill="none" stroke="#ef4444" stroke-width="1"/>
  </g>
</svg>
