<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper circle being rolled into cone (left side) -->
  <g transform="translate(6, 20)">
    <!-- Flat paper circle with cut line -->
    <circle cx="24" cy="24" r="24" fill="white" stroke="#374151" stroke-width="1"/>
    <!-- Cut line from edge to centre -->
    <line x1="24" y1="24" x2="48" y2="24" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- Centre dot -->
    <circle cx="24" cy="24" r="1.5" fill="#374151"/>
  </g>

  <!-- Arrow showing rolling motion -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M54,36 Q60,34 66,36" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Completed cone (right side) -->
  <g transform="translate(68, 8)">
    <!-- Cone shape -->
    <polygon points="16,0 0,44 32,44" fill="white" stroke="#374151" stroke-width="1.2"/>
    <!-- Overlap seam -->
    <line x1="16" y1="0" x2="8" y2="44" stroke="#374151" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Tube below with cone being placed on top -->
  <g transform="translate(34, 54)">
    <!-- Tube body (painted) -->
    <rect x="0" y="0" width="30" height="40" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
    <!-- Top ellipse -->
    <ellipse cx="15" cy="2" rx="15" ry="5" fill="#b0b8c4" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Arrow showing cone going onto tube -->
  <path d="M84,52 Q72,54 58,54" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Tape roll -->
  <g transform="translate(92, 64)">
    <ellipse cx="8" cy="8" rx="8" ry="8" fill="#d1fae5" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="8" cy="8" rx="3" ry="3" fill="#fef3c7" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Scissors -->
  <g transform="translate(8, 76) rotate(-10)">
    <path d="M0,0 L14,4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L14,-4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.2" fill="#374151"/>
    <ellipse cx="18" cy="5" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <ellipse cx="18" cy="-5" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  </g>

  <!-- Warning symbol -->
  <g transform="translate(100, 4)">
    <polygon points="8,0 0,14 16,14" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <line x1="8" y1="4" x2="8" y2="9" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="8" cy="11.5" r="0.8" fill="#374151"/>
  </g>
</svg>
