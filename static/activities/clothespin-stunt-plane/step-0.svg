<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Table surface -->
  <rect x="5" y="95" width="110" height="12" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Clothespin body (fuselage, hero, horizontal) -->
  <rect x="30" y="52" width="60" height="10" rx="2" fill="#fde68a" stroke="#374151" stroke-width="2.5"/>
  <!-- Clothespin slit/gap -->
  <line x1="42" y1="52" x2="42" y2="62" stroke="#374151" stroke-width="1"/>
  <!-- Spring metal piece -->
  <ellipse cx="42" cy="57" rx="4" ry="3" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
  <!-- Nose of clothespin (grip end) -->
  <path d="M30,52 L26,54 L26,60 L30,62" fill="#fde68a" stroke="#374151" stroke-width="2"/>

  <!-- Popsicle stick wing being slid through -->
  <rect x="8" y="54" width="104" height="6" rx="1" fill="#d97706" stroke="#374151" stroke-width="2"/>

  <!-- Arrow showing stick being pushed through slit -->
  <path d="M18,44 L18,52" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M102,44 L102,52" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Glue dot indication -->
  <circle cx="46" cy="57" r="3" fill="#f9fafb" stroke="#374151" stroke-width="0.75" opacity="0.7"/>

  <!-- Glue bottle -->
  <path d="M80,74 Q78,74 78,76 L78,90 Q78,92 82,92 L86,92 Q90,92 90,90 L90,76 Q90,74 88,74 Z"
        fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <rect x="81" y="70" width="4" height="5" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="1"/>

  <!-- Arrow from glue to joint -->
  <path d="M78,78 Q66,70 50,60" stroke="#374151" stroke-width="1" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Equal length indicators on wings -->
  <line x1="12" y1="68" x2="40" y2="68" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="12" y1="66" x2="12" y2="70" stroke="#374151" stroke-width="0.75"/>
  <line x1="40" y1="66" x2="40" y2="70" stroke="#374151" stroke-width="0.75"/>

  <line x1="62" y1="68" x2="108" y2="68" stroke="#374151" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="62" y1="66" x2="62" y2="70" stroke="#374151" stroke-width="0.75"/>
  <line x1="108" y1="66" x2="108" y2="70" stroke="#374151" stroke-width="0.75"/>
</svg>
