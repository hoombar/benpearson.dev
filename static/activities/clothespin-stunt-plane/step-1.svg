<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Plane body (clothespin, top-down view showing tail end, hero) -->
  <!-- Fuselage (clothespin) -->
  <rect x="20" y="48" width="70" height="10" rx="2" fill="#fde68a" stroke="#374151" stroke-width="2.5"/>
  <!-- Nose -->
  <path d="M20,48 L16,50 L16,56 L20,58" fill="#fde68a" stroke="#374151" stroke-width="2"/>
  <!-- Spring -->
  <ellipse cx="32" cy="53" rx="4" ry="3" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Main wing (already attached) -->
  <rect x="32" y="46" width="6" height="14" rx="1" fill="#d97706" stroke="#374151" stroke-width="1"/>
  <rect x="10" y="50" width="100" height="6" rx="1" fill="#d97706" stroke="#374151" stroke-width="1.5"/>

  <!-- Horizontal tail stabiliser (being glued on back) -->
  <rect x="80" y="46" width="28" height="6" rx="1" fill="#d97706" stroke="#374151" stroke-width="2"/>

  <!-- Vertical tail fin (upright, at back) -->
  <rect x="86" y="30" width="6" height="18" rx="1" fill="#d97706" stroke="#374151" stroke-width="2"/>

  <!-- Arrow showing tail being attached -->
  <path d="M94,26 L90,30" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Arrow showing stabiliser being attached -->
  <path d="M102,66 Q98,60 98,54" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Broken popsicle stick piece (showing it was snapped) -->
  <rect x="14" y="76" width="24" height="6" rx="1" fill="#d97706" stroke="#374151" stroke-width="1.5"/>
  <!-- Jagged break edge -->
  <path d="M38,76 L40,79 L38,82" stroke="#374151" stroke-width="1" fill="none"/>

  <!-- Full stick for reference -->
  <rect x="52" y="76" width="50" height="6" rx="1" fill="#d97706" stroke="#374151" stroke-width="1"/>
  <!-- Break line marked -->
  <line x1="77" y1="74" x2="77" y2="84" stroke="#374151" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Glue bottle -->
  <path d="M52,86 Q50,86 50,88 L50,96 Q50,98 54,98 L58,98 Q62,98 62,96 L62,88 Q62,86 60,86 Z"
        fill="#f9fafb" stroke="#374151" stroke-width="1"/>
</svg>
