<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Floor / landing strip -->
  <rect x="0" y="100" width="120" height="20" fill="#e5e7eb" stroke="none"/>
  <line x1="0" y1="100" x2="120" y2="100" stroke="#374151" stroke-width="1.5"/>
  <!-- Landing strip markings -->
  <rect x="45" y="102" width="30" height="4" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="0.75"/>
  <line x1="50" y1="108" x2="50" y2="114" stroke="#f9fafb" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="108" x2="60" y2="114" stroke="#f9fafb" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="108" x2="70" y2="114" stroke="#f9fafb" stroke-width="2" stroke-linecap="round"/>

  <!-- Plane in flight (angled, mid-air, hero) -->
  <g transform="translate(50, 38) rotate(-15)">
    <!-- Fuselage (red) -->
    <rect x="-28" y="-5" width="56" height="10" rx="3" fill="#ef4444" stroke="#374151" stroke-width="2"/>
    <!-- White stripe -->
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#f9fafb" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M-28,-5 L-34,-2 L-34,3 L-28,5" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Wings (blue) -->
    <rect x="-40" y="-2" width="80" height="5" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <!-- Stars on wings -->
    <path d="M-30,0.5 L-29,-1.5 L-28,0.5 L-26,0.5 L-28,2 L-27,4 L-29,2.5 L-31,4 L-30,2 L-32,0.5 Z"
          fill="#fef9c3" stroke="none"/>
    <path d="M28,0.5 L29,-1.5 L30,0.5 L32,0.5 L30,2 L31,4 L29,2.5 L27,4 L28,2 L26,0.5 Z"
          fill="#fef9c3" stroke="none"/>
    <!-- Tail -->
    <rect x="20" y="-7" width="18" height="4" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
    <rect x="26" y="-16" width="5" height="12" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Flight arc (dotted path showing trajectory) -->
  <path d="M14,80 Q20,50 50,38" stroke="#374151" stroke-width="1.5" fill="none"
        stroke-linecap="round" stroke-dasharray="4,3"/>

  <!-- Speed lines behind plane -->
  <line x1="78" y1="46" x2="92" y2="50" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="76" y1="50" x2="90" y2="54" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="54" x2="92" y2="58" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Second plane on ground (landed on strip) -->
  <g transform="translate(100, 96)">
    <rect x="-12" y="-4" width="24" height="5" rx="1.5" fill="#22c55e" stroke="#374151" stroke-width="1"/>
    <rect x="-18" y="-2" width="36" height="3" rx="0.5" fill="#f59e0b" stroke="#374151" stroke-width="0.75"/>
    <rect x="8" y="-6" width="8" height="2.5" rx="0.5" fill="#f59e0b" stroke="#374151" stroke-width="0.75"/>
  </g>
</svg>
