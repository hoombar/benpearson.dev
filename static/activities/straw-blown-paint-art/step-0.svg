<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Small cup/tray -->
  <path d="M40 40 L80 40 L75 80 L45 80 Z" stroke="#374151" stroke-width="2" fill="#f3f4f6"/>
  <!-- Paint blob (vivid red) -->
  <ellipse cx="60" cy="65" rx="12" ry="8" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <!-- Water drop (blue) -->
  <path d="M30 15 Q35 25 35 32 Q35 40 30 40 Q25 40 25 32 Q25 25 30 15" stroke="#3b82f6" stroke-width="2" fill="#dbeafe"/>
  <!-- Arrow from water to cup -->
  <path d="M35 30 Q50 30 55 40" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  <!-- Spoon stirring -->
  <g transform="translate(85, 30) rotate(-15)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="45" rx="6" ry="8" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
