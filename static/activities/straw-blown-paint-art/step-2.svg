<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Paper -->
  <rect x="10" y="50" width="100" height="60" rx="2" stroke="#374151" stroke-width="2" fill="#f9fafb"/>
  <!-- Puddle with splats (transformation) -->
  <path d="M60 80 L40 70 L30 85 L20 75 L15 90 L35 95 L50 105 L65 95 L85 100 L100 85 L85 75 L70 80 Z" fill="#ef4444" stroke="#374151" stroke-width="2"/>
  <!-- Straw (hero action) -->
  <g transform="translate(40, 10) rotate(45)">
    <rect x="0" y="0" width="50" height="6" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <!-- Air lines from straw -->
    <line x1="55" y1="-5" x2="70" y2="-15" stroke="#374151" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="55" y1="3" x2="75" y2="3" stroke="#374151" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="55" y1="11" x2="70" y2="21" stroke="#374151" stroke-width="1" stroke-dasharray="2,2"/>
  </g>
</svg>
