<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Window background -->
  <rect x="0" y="0" width="120" height="120" fill="#dbeafe" stroke="none"/>
  <!-- Window frame -->
  <rect x="4" y="4" width="112" height="112" rx="3" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="60" y1="4" x2="60" y2="116" stroke="#374151" stroke-width="2"/>
  <line x1="4" y1="60" x2="116" y2="60" stroke="#374151" stroke-width="2"/>

  <!-- Windowsill -->
  <rect x="0" y="78" width="120" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Sun through window -->
  <circle cx="90" cy="28" r="12" fill="#fbbf24" stroke="#374151" stroke-width="1.2"/>
  <!-- Sun rays -->
  <line x1="90" y1="12" x2="90" y2="8" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="102" y1="20" x2="106" y2="16" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="106" y1="28" x2="110" y2="28" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="20" x2="74" y2="16" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="102" y1="36" x2="106" y2="40" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Egg carton greenhouse on windowsill -->
  <rect x="14" y="72" width="56" height="20" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>

  <!-- Soil cups with sprouts growing! -->
  <ellipse cx="24" cy="74" rx="7" ry="4" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
  <ellipse cx="42" cy="74" rx="7" ry="4" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
  <ellipse cx="60" cy="74" rx="7" ry="4" fill="#92400e" stroke="#374151" stroke-width="0.8"/>

  <!-- Sprout 1 (tallest) -->
  <line x1="24" y1="72" x2="24" y2="58" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M24,58 Q20,54 22,52" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
  <path d="M24,58 Q28,54 26,52" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>

  <!-- Sprout 2 (medium) -->
  <line x1="42" y1="72" x2="42" y2="62" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M42,62 Q38,58 40,56" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
  <path d="M42,62 Q46,58 44,56" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>

  <!-- Sprout 3 (small, just emerging) -->
  <line x1="60" y1="72" x2="60" y2="68" stroke="#4ade80" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M60,68 Q58,66 59,65" fill="#4ade80" stroke="#374151" stroke-width="0.4"/>

  <!-- Condensation drops on removed cling film area -->
  <circle cx="32" cy="70" r="0.8" fill="#93c5fd" stroke="none" opacity="0.5"/>
  <circle cx="50" cy="71" r="0.8" fill="#93c5fd" stroke="none" opacity="0.5"/>

  <!-- Notebook/diary next to carton -->
  <rect x="78" y="76" width="18" height="14" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <line x1="82" y1="80" x2="92" y2="80" stroke="#d1d5db" stroke-width="0.6"/>
  <line x1="82" y1="83" x2="90" y2="83" stroke="#d1d5db" stroke-width="0.6"/>
  <line x1="82" y1="86" x2="88" y2="86" stroke="#d1d5db" stroke-width="0.6"/>

  <!-- Pencil -->
  <line x1="100" y1="74" x2="96" y2="92" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="96" y1="92" x2="95" y2="95" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
</svg>