<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Egg carton with soil and seeds -->
  <rect x="12" y="44" width="96" height="50" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>

  <!-- Soil-filled cups -->
  <ellipse cx="30" cy="56" rx="12" ry="8" fill="#92400e" stroke="#374151" stroke-width="1"/>
  <ellipse cx="60" cy="56" rx="12" ry="8" fill="#92400e" stroke="#374151" stroke-width="1"/>
  <ellipse cx="90" cy="56" rx="12" ry="8" fill="#92400e" stroke="#374151" stroke-width="1"/>
  <ellipse cx="30" cy="78" rx="12" ry="8" fill="#92400e" stroke="#374151" stroke-width="1"/>
  <ellipse cx="60" cy="78" rx="12" ry="8" fill="#92400e" stroke="#374151" stroke-width="1"/>
  <ellipse cx="90" cy="78" rx="12" ry="8" fill="#92400e" stroke="#374151" stroke-width="1"/>

  <!-- Cling film being stretched over top (transparent, shiny) -->
  <rect x="10" y="42" width="100" height="52" rx="3" fill="#dbeafe" stroke="#374151" stroke-width="1.5" opacity="0.3"/>
  <!-- Cling film highlight reflections -->
  <line x1="20" y1="46" x2="40" y2="46" stroke="#f9fafb" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
  <line x1="60" y1="48" x2="90" y2="48" stroke="#f9fafb" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
  <line x1="30" y1="88" x2="50" y2="88" stroke="#f9fafb" stroke-width="0.8" opacity="0.5" stroke-linecap="round"/>

  <!-- Water droplets on soil surface -->
  <circle cx="28" cy="54" r="1" fill="#93c5fd" stroke="none" opacity="0.7"/>
  <circle cx="62" cy="56" r="1" fill="#93c5fd" stroke="none" opacity="0.7"/>
  <circle cx="88" cy="55" r="1" fill="#93c5fd" stroke="none" opacity="0.7"/>
  <circle cx="32" cy="77" r="1" fill="#93c5fd" stroke="none" opacity="0.7"/>

  <!-- Water drops falling from above -->
  <circle cx="50" cy="24" r="2" fill="#93c5fd" stroke="#374151" stroke-width="0.6"/>
  <circle cx="48" cy="32" r="1.5" fill="#93c5fd" stroke="#374151" stroke-width="0.5"/>
  <circle cx="52" cy="38" r="1" fill="#93c5fd" stroke="#374151" stroke-width="0.4"/>

  <!-- Cling film roll -->
  <rect x="82" y="10" width="28" height="14" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="82" cy="17" rx="4" ry="7" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
  <ellipse cx="110" cy="17" rx="4" ry="7" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>

  <!-- Arrow showing wrap direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M82,28 Q70,36 60,40" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)" stroke-dasharray="2,2"/>
</svg>