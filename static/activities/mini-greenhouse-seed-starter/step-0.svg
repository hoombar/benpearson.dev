<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Egg carton (hero, bottom half, 6 cups visible from above) -->
  <rect x="12" y="40" width="96" height="54" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>

  <!-- 6 egg cups (2 rows of 3) -->
  <!-- Top row -->
  <ellipse cx="30" cy="54" rx="12" ry="10" fill="#d1d5db" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="60" cy="54" rx="12" ry="10" fill="#d1d5db" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="90" cy="54" rx="12" ry="10" fill="#d1d5db" stroke="#374151" stroke-width="1.2"/>
  <!-- Bottom row -->
  <ellipse cx="30" cy="78" rx="12" ry="10" fill="#d1d5db" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="60" cy="78" rx="12" ry="10" fill="#d1d5db" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="90" cy="78" rx="12" ry="10" fill="#d1d5db" stroke="#374151" stroke-width="1.2"/>

  <!-- Drainage hole being poked (in first cup) -->
  <circle cx="30" cy="56" r="2" fill="#374151" stroke="none"/>

  <!-- Spoon poking hole -->
  <line x1="30" y1="56" x2="30" y2="26" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="30" cy="22" rx="6" ry="3" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Arrow showing poking action -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M30,14 Q30,18 30,24" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Holes already made in other cups -->
  <circle cx="60" cy="56" r="1.5" fill="#374151" stroke="none"/>
  <circle cx="90" cy="56" r="1.5" fill="#374151" stroke="none"/>

  <!-- Cut-off lid piece nearby -->
  <rect x="76" y="8" width="36" height="20" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1" opacity="0.5"/>
  <!-- Scissors icon -->
  <g transform="translate(72,18) rotate(-10)">
    <path d="M0,0 L-10,-2" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M0,0 L-10,2" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="1.5" cy="-2.5" rx="3" ry="2" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="1.5" cy="2.5" rx="3" ry="2" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
  </g>
</svg>