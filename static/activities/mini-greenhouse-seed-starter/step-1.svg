<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Egg carton with cups filled with soil -->
  <rect x="12" y="40" width="96" height="54" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>

  <!-- Top row — soil filled -->
  <ellipse cx="30" cy="54" rx="12" ry="10" fill="#92400e" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="60" cy="54" rx="12" ry="10" fill="#92400e" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="90" cy="54" rx="12" ry="10" fill="#92400e" stroke="#374151" stroke-width="1.2"/>
  <!-- Bottom row — soil filled -->
  <ellipse cx="30" cy="78" rx="12" ry="10" fill="#92400e" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="60" cy="78" rx="12" ry="10" fill="#92400e" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="90" cy="78" rx="12" ry="10" fill="#92400e" stroke="#374151" stroke-width="1.2"/>

  <!-- Soil texture dots -->
  <circle cx="26" cy="52" r="1" fill="#78350f" stroke="none"/>
  <circle cx="34" cy="56" r="0.8" fill="#78350f" stroke="none"/>
  <circle cx="56" cy="52" r="1" fill="#78350f" stroke="none"/>
  <circle cx="64" cy="56" r="0.8" fill="#78350f" stroke="none"/>

  <!-- Bean seed being pressed into soil (hero action) -->
  <ellipse cx="60" cy="52" rx="3" ry="2" fill="#16a34a" stroke="#374151" stroke-width="0.8"/>

  <!-- Hand/finger pressing seed down -->
  <path d="M60,42 Q60,46 60,50" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Spoon with soil -->
  <g transform="translate(20,16)">
    <ellipse cx="0" cy="0" rx="8" ry="4" fill="#92400e" stroke="#374151" stroke-width="1"/>
    <line x1="8" y1="0" x2="22" y2="6" stroke="#e5e7eb" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Bean seeds nearby -->
  <ellipse cx="96" cy="22" rx="3.5" ry="2.5" fill="#16a34a" stroke="#374151" stroke-width="0.8"/>
  <ellipse cx="102" cy="26" rx="3.5" ry="2.5" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
  <ellipse cx="90" cy="26" rx="3" ry="2" fill="#16a34a" stroke="#374151" stroke-width="0.8"/>
  <ellipse cx="96" cy="30" rx="3" ry="2" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
  <ellipse cx="104" cy="18" rx="3" ry="2" fill="#16a34a" stroke="#374151" stroke-width="0.8"/>

  <!-- Seeds already planted (small bumps in soil) -->
  <ellipse cx="30" cy="53" rx="2.5" ry="1.5" fill="#16a34a" stroke="#374151" stroke-width="0.5" opacity="0.6"/>
  <ellipse cx="90" cy="53" rx="2.5" ry="1.5" fill="#22c55e" stroke="#374151" stroke-width="0.5" opacity="0.6"/>
</svg>