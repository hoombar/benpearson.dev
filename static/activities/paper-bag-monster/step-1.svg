<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Stuffed bag with horns being twisted (hero) -->
  <g transform="translate(20, 14)">
    <!-- Bag body (plump, stuffed) -->
    <path d="M0,76 L0,20 Q0,8 10,4 L18,0 Q25,-2 32,0 L40,4 Q50,8 50,20 L50,76 Z" fill="#d4a574" stroke="#374151" stroke-width="1.5"/>

    <!-- Left horn (twisted) -->
    <path d="M10,4 Q4,-8 8,-16" fill="none" stroke="#d4a574" stroke-width="5" stroke-linecap="round"/>
    <path d="M10,4 Q4,-8 8,-16" fill="none" stroke="#374151" stroke-width="1"/>
    <!-- Twist lines on left horn -->
    <line x1="8" y1="-2" x2="10" y2="-4" stroke="#c4956a" stroke-width="0.5"/>
    <line x1="7" y1="-8" x2="9" y2="-10" stroke="#c4956a" stroke-width="0.5"/>

    <!-- Right horn (twisted) -->
    <path d="M40,4 Q46,-8 42,-16" fill="none" stroke="#d4a574" stroke-width="5" stroke-linecap="round"/>
    <path d="M40,4 Q46,-8 42,-16" fill="none" stroke="#374151" stroke-width="1"/>
    <!-- Twist lines on right horn -->
    <line x1="42" y1="-2" x2="40" y2="-4" stroke="#c4956a" stroke-width="0.5"/>
    <line x1="43" y1="-8" x2="41" y2="-10" stroke="#c4956a" stroke-width="0.5"/>

    <!-- Tape at horn bases -->
    <rect x="6" y="0" width="10" height="4" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3"/>
    <rect x="34" y="0" width="10" height="4" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3"/>
  </g>

  <!-- Hand twisting horn -->
  <g transform="translate(68, 0)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="16" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Twisting arrow -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M68,14 Q64,10 62,4" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Tape roll -->
  <g transform="translate(86, 60)">
    <ellipse cx="10" cy="10" rx="10" ry="10" fill="#d1fae5" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="10" cy="10" rx="4" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="0.4"/>
  </g>
</svg>
