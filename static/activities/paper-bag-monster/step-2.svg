<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Monster bag being painted (hero) -->
  <g transform="translate(18, 14)">
    <!-- Bag body (painted green) -->
    <path d="M0,76 L0,20 Q0,8 10,4 L18,0 Q25,-2 32,0 L40,4 Q50,8 50,20 L50,76 Z" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>

    <!-- Horns (painted) -->
    <path d="M10,4 Q4,-8 8,-16" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
    <path d="M10,4 Q4,-8 8,-16" fill="none" stroke="#374151" stroke-width="1"/>
    <path d="M40,4 Q46,-8 42,-16" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
    <path d="M40,4 Q46,-8 42,-16" fill="none" stroke="#374151" stroke-width="1"/>

    <!-- Big mouth -->
    <path d="M8,46 Q25,72 42,46" fill="#ef4444" stroke="#374151" stroke-width="1.2"/>

    <!-- Teeth (white triangles) -->
    <polygon points="12,46 16,54 20,46" fill="white" stroke="#374151" stroke-width="0.5"/>
    <polygon points="20,46 25,56 30,46" fill="white" stroke="#374151" stroke-width="0.5"/>
    <polygon points="30,46 34,54 38,46" fill="white" stroke="#374151" stroke-width="0.5"/>

    <!-- Bottom teeth -->
    <polygon points="16,62 20,56 24,62" fill="white" stroke="#374151" stroke-width="0.5"/>
    <polygon points="26,62 30,54 34,62" fill="white" stroke="#374151" stroke-width="0.5"/>

    <!-- Spots on body -->
    <circle cx="12" cy="28" r="4" fill="#16a34a" stroke="#374151" stroke-width="0.4"/>
    <circle cx="38" cy="24" r="3.5" fill="#16a34a" stroke="#374151" stroke-width="0.4"/>
    <circle cx="14" cy="68" r="3" fill="#16a34a" stroke="#374151" stroke-width="0.4"/>
    <circle cx="36" cy="70" r="3.5" fill="#16a34a" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Paintbrush -->
  <g transform="translate(70, 40) rotate(20)">
    <rect x="0" y="-3" width="32" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pot -->
  <g transform="translate(84, 70)">
    <rect x="0" y="0" width="20" height="20" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
    <rect x="2" y="4" width="16" height="14" rx="1" fill="#22c55e" stroke="none"/>
    <rect x="-1" y="-2" width="22" height="5" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
  </g>
</svg>
