<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper bag being stuffed (hero) -->
  <g transform="translate(20, 10)">
    <!-- Bag body -->
    <rect x="0" y="0" width="50" height="70" rx="2" fill="#d4a574" stroke="#374151" stroke-width="1.5"/>
    <!-- Bag opening (top) -->
    <path d="M0,0 Q25,-6 50,0" fill="#c4956a" stroke="#374151" stroke-width="1"/>
    <!-- Paper texture -->
    <line x1="10" y1="15" x2="40" y2="15" stroke="#c4956a" stroke-width="0.4" opacity="0.5"/>
    <line x1="10" y1="35" x2="40" y2="35" stroke="#c4956a" stroke-width="0.4" opacity="0.5"/>

    <!-- Scrunched newspaper visible inside -->
    <circle cx="16" cy="50" r="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="32" cy="54" r="7" fill="#f3f4f6" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="24" cy="40" r="7" fill="#f3f4f6" stroke="#d1d5db" stroke-width="0.8"/>
    <circle cx="38" cy="42" r="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="0.8"/>
  </g>

  <!-- Hand stuffing newspaper in -->
  <g transform="translate(54, 4)">
    <rect x="0" y="0" width="14" height="22" rx="7" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="16" y="2" width="12" height="18" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Newspaper ball being pushed in -->
  <circle cx="62" cy="14" r="7" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <!-- Newspaper texture lines -->
  <line x1="57" y1="12" x2="67" y2="12" stroke="#d1d5db" stroke-width="0.4"/>
  <line x1="58" y1="16" x2="66" y2="16" stroke="#d1d5db" stroke-width="0.4"/>

  <!-- Arrow showing stuffing direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M60,22 Q56,28 52,32" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Newspaper sheets on table -->
  <g transform="translate(78, 42)">
    <rect x="0" y="0" width="30" height="40" rx="1" fill="#f3f4f6" stroke="#d1d5db" stroke-width="0.8"/>
    <line x1="4" y1="8" x2="26" y2="8" stroke="#d1d5db" stroke-width="0.4"/>
    <line x1="4" y1="14" x2="26" y2="14" stroke="#d1d5db" stroke-width="0.4"/>
    <line x1="4" y1="20" x2="26" y2="20" stroke="#d1d5db" stroke-width="0.4"/>
    <line x1="4" y1="26" x2="18" y2="26" stroke="#d1d5db" stroke-width="0.4"/>
  </g>
</svg>
