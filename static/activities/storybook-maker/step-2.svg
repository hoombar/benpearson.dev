<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 2: Write the story — open booklet with marker writing on right page -->

  <!-- Left page -->
  <rect x="6" y="12" width="52" height="96" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left page spine highlight -->
  <rect x="6" y="12" width="5" height="96" rx="2" fill="#e5e7eb" stroke="none"/>
  <!-- Left page: completed text lines (written) -->
  <line x1="16" y1="26" x2="52" y2="26" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="34" x2="52" y2="34" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="42" x2="44" y2="42" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Dashed separator: text above / illustration below -->
  <line x1="10" y1="58" x2="54" y2="58" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3" stroke-linecap="round"/>
  <!-- Illustration area label (blank space for drawing) -->
  <rect x="14" y="64" width="38" height="36" rx="2" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Right page (hero) -->
  <rect x="62" y="12" width="52" height="96" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right page: one line written, one mid-writing -->
  <line x1="68" y1="26" x2="108" y2="26" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Mid-writing line (vivid blue — being written now) -->
  <line x1="68" y1="36" x2="96" y2="36" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Dashed extension (marker still moving) -->
  <line x1="96" y1="36" x2="108" y2="36" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,2" stroke-linecap="round"/>

  <!-- Marker (hero writing tool) -->
  <g transform="translate(110,20) rotate(140)">
    <!-- Marker cap end -->
    <rect x="-4" y="-24" width="8" height="6" rx="2" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Marker barrel -->
    <rect x="-4" y="-18" width="8" height="28" rx="1" fill="#f87171" stroke="#374151" stroke-width="1.5"/>
    <!-- Label stripe -->
    <rect x="-4" y="-8" width="8" height="10" fill="#fca5a5" stroke="none"/>
    <!-- Tip -->
    <polygon points="-3,10 3,10 0,18" fill="#374151" stroke="#374151" stroke-width="1" stroke-linejoin="round"/>
  </g>

  <!-- Dashed separator on right page -->
  <line x1="64" y1="58" x2="110" y2="58" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3" stroke-linecap="round"/>
  <!-- Blank illustration area on right page -->
  <rect x="68" y="64" width="38" height="36" rx="2" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
</svg>
