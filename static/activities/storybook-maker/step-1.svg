<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 1: Fold and bind pages into a booklet -->

  <!-- Bottom stacked sheet (page depth) -->
  <rect x="18" y="72" width="66" height="40" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- Mid stacked sheet -->
  <rect x="16" y="68" width="66" height="40" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Hero: top sheet being folded — left half flat -->
  <rect x="14" y="30" width="38" height="50" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Fold crease/spine (dashed) -->
  <line x1="52" y1="30" x2="52" y2="80" stroke="#374151" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round"/>
  <!-- Right half rising up (perspective fold) -->
  <path d="M52,30 L86,22 L86,72 L52,80 Z" fill="#f3f4f6" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Page lines on rising half (perspective) -->
  <line x1="58" y1="34" x2="82" y2="28" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <line x1="58" y1="44" x2="82" y2="38" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <line x1="58" y1="54" x2="82" y2="48" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <!-- Page lines on flat left half -->
  <line x1="20" y1="42" x2="48" y2="42" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="52" x2="48" y2="52" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>

  <!-- Rotation arc — marker auto-aligns to tangent (98−90,28−8) = (8,20) = 68° right-down -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M70,18 Q90,8 98,28" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Tape strip at spine (blue, binding) -->
  <rect x="47" y="50" width="10" height="14" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="1" opacity="0.9"/>
  <!-- Tape texture lines -->
  <line x1="49" y1="52" x2="55" y2="52" stroke="#dbeafe" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="49" y1="56" x2="55" y2="56" stroke="#dbeafe" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="49" y1="60" x2="55" y2="60" stroke="#dbeafe" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Scissors (supporting element) -->
  <g transform="translate(106,96) rotate(155)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="14" y2="4" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-4" cy="-4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <circle cx="-4" cy="4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  </g>
</svg>
