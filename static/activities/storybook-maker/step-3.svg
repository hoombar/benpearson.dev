<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 3: Illustrate each scene — drawing bold colourful art on the page -->

  <!-- Left page (spine/back) -->
  <rect x="6" y="10" width="50" height="100" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <rect x="6" y="10" width="5" height="100" rx="2" fill="#e5e7eb" stroke="none"/>
  <!-- Left page text lines (written) -->
  <line x1="16" y1="20" x2="50" y2="20" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="28" x2="50" y2="28" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="36" x2="40" y2="36" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right page (hero — illustration being drawn) -->
  <rect x="60" y="10" width="54" height="100" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Text lines at top of right page -->
  <line x1="66" y1="18" x2="108" y2="18" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="66" y1="25" x2="100" y2="25" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Illustration scene: bold colourful drawing filling the lower half -->
  <!-- Sky background -->
  <rect x="64" y="34" width="46" height="68" rx="1" fill="#dbeafe" stroke="#374151" stroke-width="1"/>
  <!-- Green grass ground -->
  <rect x="64" y="82" width="46" height="20" rx="0" fill="#86efac" stroke="#374151" stroke-width="1"/>
  <!-- Sun (yellow) -->
  <circle cx="96" cy="44" r="9" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Sun rays -->
  <line x1="96" y1="32" x2="96" y2="29" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="104" y1="36" x2="106" y2="34" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="107" y1="44" x2="110" y2="44" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="88" y1="36" x2="86" y2="34" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- House -->
  <rect x="68" y="68" width="22" height="16" rx="1" fill="#fca5a5" stroke="#374151" stroke-width="1.5"/>
  <!-- Roof -->
  <path d="M66,68 L79,56 L92,68 Z" fill="#ef4444" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Door -->
  <rect x="75" y="74" width="8" height="10" rx="1" fill="#d97706" stroke="#374151" stroke-width="1"/>
  <!-- Window -->
  <rect x="69" y="70" width="6" height="6" rx="1" fill="#93c5fd" stroke="#374151" stroke-width="1"/>
  <!-- Tree -->
  <line x1="102" y1="82" x2="102" y2="70" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <circle cx="102" cy="64" r="9" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>

  <!-- Pencil drawing over the scene (action: illustrating) -->
  <g transform="translate(72,40) rotate(130)">
    <rect x="-3" y="-16" width="6" height="22" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
    <rect x="-3" y="-16" width="6" height="4" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
    <polygon points="-3,6 3,6 0,13" fill="#fde68a" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="0" cy="12" r="1.2" fill="#374151"/>
  </g>
</svg>
