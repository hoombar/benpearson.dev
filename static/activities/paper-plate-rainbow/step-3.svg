<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Window frame -->
  <rect x="0" y="0" width="120" height="120" fill="#e0f2fe"/>
  <rect x="4" y="4" width="112" height="112" fill="#bfdbfe" stroke="#374151" stroke-width="2"/>
  <!-- Window cross-bars -->
  <line x1="60" y1="4" x2="60" y2="116" stroke="#374151" stroke-width="2"/>
  <line x1="4" y1="60" x2="116" y2="60" stroke="#374151" stroke-width="2"/>

  <!-- Rainbow hanging in window (left pane) -->
  <!-- String from top -->
  <line x1="32" y1="8" x2="32" y2="14" stroke="#374151" stroke-width="1"/>

  <!-- Half plate rainbow -->
  <g transform="translate(8, 14)">
    <path d="M0,22 A24,24 0 0,1 48,22 L0,22 Z" fill="#ef4444" stroke="#374151" stroke-width="1"/>
    <path d="M4,22 A20,20 0 0,1 44,22 L4,22 Z" fill="#f97316" stroke="none"/>
    <path d="M8,22 A16,16 0 0,1 40,22 L8,22 Z" fill="#fbbf24" stroke="none"/>
    <path d="M12,22 A12,12 0 0,1 36,22 L12,22 Z" fill="#22c55e" stroke="none"/>
    <path d="M16,22 A8,8 0 0,1 32,22 L16,22 Z" fill="#3b82f6" stroke="none"/>
    <path d="M20,22 A4,4 0 0,1 28,22 L20,22 Z" fill="#8b5cf6" stroke="none"/>

    <!-- Clouds -->
    <circle cx="2" cy="24" r="4" fill="white" stroke="#374151" stroke-width="0.4"/>
    <circle cx="8" cy="22" r="4" fill="white" stroke="#374151" stroke-width="0.4"/>
    <circle cx="40" cy="24" r="4" fill="white" stroke="#374151" stroke-width="0.4"/>
    <circle cx="46" cy="22" r="4" fill="white" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Streamers flowing -->
  <path d="M14,36 Q12,42 14,48" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M20,36 Q22,44 20,50" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M26,36 Q24,42 26,48" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M32,36 Q34,44 32,52" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M38,36 Q36,42 38,48" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M44,36 Q46,44 44,50" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M50,36 Q48,42 50,48" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Breeze motion lines -->
  <line x1="8" y1="42" x2="4" y2="42" stroke="#374151" stroke-width="0.5" opacity="0.3"/>
  <line x1="8" y1="46" x2="6" y2="46" stroke="#374151" stroke-width="0.5" opacity="0.3"/>

  <!-- Sun in right pane -->
  <circle cx="90" cy="30" r="10" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  <line x1="90" y1="16" x2="90" y2="12" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="100" y1="20" x2="104" y2="16" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="104" y1="30" x2="108" y2="30" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="20" x2="76" y2="16" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="76" y1="30" x2="72" y2="30" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Little cloud in right pane -->
  <circle cx="82" cy="48" r="4" fill="white" stroke="#374151" stroke-width="0.4"/>
  <circle cx="88" cy="46" r="5" fill="white" stroke="#374151" stroke-width="0.4"/>
  <circle cx="94" cy="48" r="4" fill="white" stroke="#374151" stroke-width="0.4"/>
</svg>
