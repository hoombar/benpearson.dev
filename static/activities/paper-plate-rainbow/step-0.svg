<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Half paper plate with rainbow stripes (hero) -->
  <g transform="translate(10, 16)">
    <!-- Half-circle plate -->
    <path d="M0,50 A50,50 0 0,1 100,50 L0,50 Z" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Orange stripe -->
    <path d="M8,50 A42,42 0 0,1 92,50 L8,50 Z" fill="#f97316" stroke="none"/>
    <!-- Yellow stripe -->
    <path d="M16,50 A34,34 0 0,1 84,50 L16,50 Z" fill="#fbbf24" stroke="none"/>
    <!-- Green stripe -->
    <path d="M24,50 A26,26 0 0,1 76,50 L24,50 Z" fill="#22c55e" stroke="none"/>
    <!-- Blue stripe -->
    <path d="M32,50 A18,18 0 0,1 68,50 L32,50 Z" fill="#3b82f6" stroke="none"/>
    <!-- Purple stripe -->
    <path d="M40,50 A10,10 0 0,1 60,50 L40,50 Z" fill="#8b5cf6" stroke="none"/>
    <!-- Plate outline -->
    <path d="M0,50 A50,50 0 0,1 100,50 L0,50 Z" fill="none" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Paintbrush painting stripes -->
  <g transform="translate(86, 22)">
    <rect x="0" y="0" width="6" height="28" rx="2" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
    <rect x="-1" y="26" width="8" height="5" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="0.5"/>
    <rect x="0" y="30" width="6" height="6" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Hand -->
  <g transform="translate(94, 16)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Paint pots in rainbow order -->
  <g transform="translate(6, 74)">
    <rect x="0" y="0" width="12" height="14" rx="2" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
  </g>
  <g transform="translate(22, 76)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#f97316" stroke="#374151" stroke-width="0.6"/>
  </g>
  <g transform="translate(38, 74)">
    <rect x="0" y="0" width="12" height="14" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
  </g>
  <g transform="translate(54, 76)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
  </g>
  <g transform="translate(70, 74)">
    <rect x="0" y="0" width="12" height="14" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>
  </g>
  <g transform="translate(86, 76)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#8b5cf6" stroke="#374151" stroke-width="0.6"/>
  </g>
</svg>
