<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Tissue paper sheet -->
  <rect x="8" y="8" width="54" height="44" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="0.8" opacity="0.6"/>

  <!-- Wing shapes being cut from tissue paper -->
  <!-- Wing 1 (already cut) -->
  <ellipse cx="82" cy="28" rx="24" ry="8" fill="#93c5fd" stroke="#374151" stroke-width="0.8" opacity="0.6"/>
  <!-- Vein pattern on wing -->
  <line x1="62" y1="28" x2="102" y2="28" stroke="#60a5fa" stroke-width="0.5" opacity="0.4"/>
  <line x1="72" y1="22" x2="78" y2="28" stroke="#60a5fa" stroke-width="0.3" opacity="0.3"/>
  <line x1="82" y1="22" x2="86" y2="28" stroke="#60a5fa" stroke-width="0.3" opacity="0.3"/>
  <line x1="92" y1="22" x2="94" y2="28" stroke="#60a5fa" stroke-width="0.3" opacity="0.3"/>

  <!-- Wing 2 (already cut) -->
  <ellipse cx="82" cy="52" rx="24" ry="8" fill="#93c5fd" stroke="#374151" stroke-width="0.8" opacity="0.6"/>
  <line x1="62" y1="52" x2="102" y2="52" stroke="#60a5fa" stroke-width="0.5" opacity="0.4"/>

  <!-- Cut line on tissue paper (where wings were cut from) -->
  <ellipse cx="34" cy="24" rx="20" ry="7" fill="none" stroke="#374151" stroke-width="0.6" stroke-dasharray="2,2"/>

  <!-- Scissors -->
  <g transform="translate(46, 60) rotate(-15)">
    <path d="M0,0 L-16,5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,0 L-16,-5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#374151"/>
    <ellipse cx="5" cy="3.5" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <ellipse cx="5" cy="-3.5" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Second colour tissue paper -->
  <rect x="8" y="58" width="40" height="36" rx="2" fill="#c4b5fd" stroke="#374151" stroke-width="0.8" opacity="0.5"/>

  <!-- Layered wing showing two colours -->
  <ellipse cx="82" cy="78" rx="22" ry="7" fill="#c4b5fd" stroke="#374151" stroke-width="0.6" opacity="0.5"/>
  <ellipse cx="82" cy="78" rx="18" ry="5.5" fill="#93c5fd" stroke="none" opacity="0.4"/>
</svg>
