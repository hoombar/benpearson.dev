<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Clothespin being coloured (hero, large, horizontal) -->
  <g transform="translate(14, 34)">
    <!-- Top jaw -->
    <rect x="0" y="0" width="64" height="8" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>
    <!-- Bottom jaw -->
    <rect x="0" y="10" width="64" height="8" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>
    <!-- Spring -->
    <circle cx="48" cy="9" r="4" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
    <!-- Grip opening at right end -->
    <path d="M64,4 Q70,9 64,14" fill="none" stroke="#374151" stroke-width="1"/>
    <!-- Partially coloured - showing some wood still visible -->
    <rect x="0" y="0" width="36" height="8" rx="2" fill="#3b82f6" stroke="none"/>
    <rect x="36" y="0" width="28" height="8" rx="2" fill="#fbbf24" stroke="none" opacity="0.3"/>
  </g>

  <!-- Marker colouring the clothespin -->
  <g transform="translate(50, 18) rotate(30)">
    <rect x="0" y="0" width="6" height="28" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
    <rect x="0.5" y="28" width="5" height="4" rx="1" fill="#1e40af" stroke="#374151" stroke-width="0.5"/>
    <rect x="-0.5" y="-5" width="7" height="6" rx="2" fill="#2563eb" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Uncoloured clothespins waiting -->
  <g transform="translate(16, 68)">
    <rect x="0" y="0" width="50" height="6" rx="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.8" opacity="0.6"/>
    <rect x="0" y="8" width="50" height="6" rx="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.8" opacity="0.6"/>
    <circle cx="38" cy="7" r="3" fill="#d1d5db" stroke="#374151" stroke-width="0.5"/>
  </g>
  <g transform="translate(16, 84)">
    <rect x="0" y="0" width="50" height="6" rx="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.8" opacity="0.6"/>
    <rect x="0" y="8" width="50" height="6" rx="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.8" opacity="0.6"/>
    <circle cx="38" cy="7" r="3" fill="#d1d5db" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Other markers -->
  <rect x="82" y="56" width="5" height="22" rx="1.5" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
  <rect x="90" y="54" width="5" height="24" rx="1.5" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
  <rect x="98" y="58" width="5" height="20" rx="1.5" fill="#a78bfa" stroke="#374151" stroke-width="0.6"/>
</svg>
