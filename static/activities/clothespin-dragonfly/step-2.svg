<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Dragonfly being assembled (hero, large) -->
  <g transform="translate(14, 28)">
    <!-- Clothespin body (coloured blue) -->
    <rect x="0" y="14" width="64" height="8" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>
    <rect x="0" y="24" width="64" height="8" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>
    <circle cx="48" cy="23" r="4" fill="#d1d5db" stroke="#374151" stroke-width="0.8"/>
    <path d="M64,18 Q70,23 64,28" fill="none" stroke="#374151" stroke-width="0.8"/>

    <!-- Tissue paper wings glued on top -->
    <!-- Upper wing pair -->
    <ellipse cx="28" cy="6" rx="28" ry="7" fill="#93c5fd" stroke="#374151" stroke-width="0.6" opacity="0.6"/>
    <!-- Lower wing pair -->
    <ellipse cx="28" cy="38" rx="28" ry="7" fill="#93c5fd" stroke="#374151" stroke-width="0.6" opacity="0.6"/>

    <!-- Googly eyes at front -->
    <circle cx="4" cy="16" r="5" fill="#ffffff" stroke="#374151" stroke-width="0.8"/>
    <circle cx="5" cy="15" r="2.5" fill="#374151" stroke="none"/>
    <circle cx="4" cy="28" r="5" fill="#ffffff" stroke="#374151" stroke-width="0.8"/>
    <circle cx="5" cy="27" r="2.5" fill="#374151" stroke="none"/>
  </g>

  <!-- Glue bottle -->
  <g transform="translate(88, 20)">
    <rect x="0" y="8" width="12" height="22" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>
    <rect x="2" y="2" width="8" height="8" rx="1.5" fill="#f3f4f6" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Glue dots visible on wing attachment points -->
  <circle cx="42" cy="42" r="2" fill="#fef3c7" stroke="#374151" stroke-width="0.3" opacity="0.6"/>
  <circle cx="42" cy="66" r="2" fill="#fef3c7" stroke="#374151" stroke-width="0.3" opacity="0.6"/>

  <!-- Googly eyes packet -->
  <g transform="translate(86, 60)">
    <rect x="0" y="0" width="20" height="24" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>
    <circle cx="6" cy="8" r="3.5" fill="#ffffff" stroke="#374151" stroke-width="0.5"/>
    <circle cx="7" cy="7" r="1.5" fill="#374151"/>
    <circle cx="14" cy="8" r="3.5" fill="#ffffff" stroke="#374151" stroke-width="0.5"/>
    <circle cx="15" cy="7" r="1.5" fill="#374151"/>
  </g>
</svg>
