<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="120" height="120" fill="#f3f4f6" stroke="none"/>

  <!-- Plant stem -->
  <line x1="60" y1="40" x2="60" y2="116" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <!-- Leaves -->
  <path d="M60,70 Q48,62 42,66 Q48,70 60,70" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
  <path d="M60,86 Q72,78 78,82 Q72,86 60,86" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
  <path d="M60,100 Q46,94 42,98 Q48,102 60,100" fill="#4ade80" stroke="#374151" stroke-width="0.8"/>

  <!-- Dragonfly clipped onto plant stem -->
  <g transform="translate(32, 28)">
    <!-- Clothespin body -->
    <rect x="0" y="8" width="48" height="6" rx="1.5" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
    <rect x="0" y="16" width="48" height="6" rx="1.5" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
    <!-- Spring gripping the stem -->
    <circle cx="36" cy="15" r="3.5" fill="#d1d5db" stroke="#374151" stroke-width="0.8"/>
    <!-- Grip on stem -->
    <path d="M48,11 Q52,15 48,19" fill="none" stroke="#374151" stroke-width="0.8"/>

    <!-- Wings -->
    <ellipse cx="20" cy="2" rx="22" ry="6" fill="#93c5fd" stroke="#374151" stroke-width="0.5" opacity="0.5"/>
    <ellipse cx="20" cy="28" rx="22" ry="6" fill="#93c5fd" stroke="#374151" stroke-width="0.5" opacity="0.5"/>

    <!-- Eyes -->
    <circle cx="4" cy="10" r="4" fill="#ffffff" stroke="#374151" stroke-width="0.8"/>
    <circle cx="5" cy="9" r="2" fill="#374151"/>
    <circle cx="4" cy="20" r="4" fill="#ffffff" stroke="#374151" stroke-width="0.8"/>
    <circle cx="5" cy="19" r="2" fill="#374151"/>
  </g>

  <!-- Second dragonfly (smaller, different colour) clipped to a curtain edge -->
  <g transform="translate(86, 6)">
    <!-- Curtain edge -->
    <rect x="14" y="0" width="20" height="60" fill="#c4b5fd" stroke="#374151" stroke-width="0.8" opacity="0.3"/>
    <!-- Mini dragonfly -->
    <rect x="0" y="18" width="30" height="4" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <rect x="0" y="24" width="30" height="4" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <circle cx="22" cy="23" r="2.5" fill="#d1d5db" stroke="#374151" stroke-width="0.5"/>
    <ellipse cx="12" cy="14" rx="14" ry="4" fill="#fde68a" stroke="#374151" stroke-width="0.4" opacity="0.5"/>
    <ellipse cx="12" cy="32" rx="14" ry="4" fill="#fde68a" stroke="#374151" stroke-width="0.4" opacity="0.5"/>
    <circle cx="3" cy="20" r="3" fill="#ffffff" stroke="#374151" stroke-width="0.5"/>
    <circle cx="4" cy="19" r="1.5" fill="#374151"/>
    <circle cx="3" cy="26" r="3" fill="#ffffff" stroke="#374151" stroke-width="0.5"/>
    <circle cx="4" cy="25" r="1.5" fill="#374151"/>
  </g>
</svg>
