<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Step 1: Add the White Tummy -->
  <!-- Table surface -->
  <line x1="4" y1="108" x2="116" y2="108" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Painted black tube (hero, center-left) -->
  <rect x="30" y="14" width="34" height="92" rx="4" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <!-- White egg-shaped tummy paper (to the right, floating, about to be applied) -->
  <ellipse cx="86" cy="58" rx="18" ry="28" fill="white" stroke="#374151" stroke-width="1.5"/>
  <!-- Arrow from tummy paper toward tube -->
  <line x1="66" y1="58" x2="68" y2="58" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Glue bottle below -->
  <g transform="translate(94, 98)">
    <!-- Glue bottle body -->
    <rect x="-8" y="-14" width="16" height="16" rx="3" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/>
    <!-- Nozzle -->
    <rect x="-2" y="-20" width="4" height="8" rx="1" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/>
    <!-- Label line -->
    <line x1="-5" y1="-6" x2="5" y2="-6" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <line x1="-5" y1="-2" x2="5" y2="-2" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- Glue lines on tummy paper (suggest glue being applied) -->
  <line x1="80" y1="44" x2="92" y2="44" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="76" y1="52" x2="96" y2="52" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="74" y1="62" x2="98" y2="62" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Scissors (upper right corner) -->
  <g transform="translate(106, 22) rotate(30)">
    <circle cx="-4" cy="0" r="3.5" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
    <circle cx="4" cy="0" r="3.5" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
    <line x1="-4" y1="3.5" x2="0" y2="14" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="3.5" x2="0" y2="14" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
