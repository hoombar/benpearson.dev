<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 3: Completed standing penguin — the finished creation -->
  <!-- Table surface -->
  <line x1="4" y1="106" x2="116" y2="106" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Penguin body (black tube) -->
  <rect x="40" y="14" width="40" height="90" rx="6" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <!-- White tummy -->
  <ellipse cx="60" cy="60" rx="13" ry="28" fill="white" stroke="#374151" stroke-width="1.5"/>
  <!-- Left wing (black oval, attached to side) -->
  <ellipse cx="30" cy="56" rx="12" ry="22" fill="#1f2937" stroke="#374151" stroke-width="1.5" transform="rotate(-10 30 56)"/>
  <!-- Right wing (black oval, attached to side) -->
  <ellipse cx="90" cy="56" rx="12" ry="22" fill="#1f2937" stroke="#374151" stroke-width="1.5" transform="rotate(10 90 56)"/>
  <!-- Beak (orange triangle, folded — sticks out from face) -->
  <polygon points="55,42 65,42 60,50" fill="#fb923c" stroke="#374151" stroke-width="1.5"/>
  <!-- Beak fold line -->
  <line x1="55" y1="46" x2="65" y2="46" stroke="#374151" stroke-width="1" stroke-dasharray="2,1" stroke-linecap="round"/>
  <!-- Left eye (googly) -->
  <circle cx="52" cy="34" r="5" fill="white" stroke="#374151" stroke-width="1.5"/>
  <circle cx="53" cy="35" r="2" fill="#374151"/>
  <!-- Right eye (googly) -->
  <circle cx="68" cy="34" r="5" fill="white" stroke="#374151" stroke-width="1.5"/>
  <circle cx="69" cy="35" r="2" fill="#374151"/>
  <!-- Left foot (orange, with tab folded under tube) -->
  <path d="M44 104 Q36 104 34 108 Q38 108 44 108 Z" fill="#fb923c" stroke="#374151" stroke-width="1.5"/>
  <!-- Right foot -->
  <path d="M76 104 Q84 104 86 108 Q82 108 76 108 Z" fill="#fb923c" stroke="#374151" stroke-width="1.5"/>
  <!-- Highlight on body -->
  <line x1="44" y1="20" x2="44" y2="96" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>
</svg>
