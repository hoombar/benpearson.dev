<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Step 2: Make Wings and Beak — cutting paper pieces -->
  <!-- Table surface -->
  <line x1="4" y1="108" x2="116" y2="108" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Black paper sheet (being cut from) -->
  <rect x="6" y="16" width="50" height="60" rx="2" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <!-- Cut line (dashed) on black paper -->
  <path d="M16 28 Q30 40 40 52" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,2" fill="none" stroke-linecap="round"/>
  <!-- Scissors cutting the black paper (hero action) -->
  <g transform="translate(46, 38) rotate(-20)">
    <!-- Blade 1 -->
    <line x1="-16" y1="-4" x2="10" y2="-4" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <!-- Blade 2 -->
    <line x1="-16" y1="4" x2="10" y2="4" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <!-- Ring handles -->
    <circle cx="-18" cy="-5" r="5" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
    <circle cx="-18" cy="5" r="5" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
    <!-- Pivot screw -->
    <circle cx="2" cy="0" r="2" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
  </g>
  <!-- Orange paper sheet (smaller, for beak) -->
  <rect x="64" y="16" width="50" height="32" rx="2" fill="#fb923c" stroke="#374151" stroke-width="1.5"/>
  <!-- Cut line on orange paper -->
  <path d="M72 20 L84 42" stroke="#374151" stroke-width="1" stroke-dasharray="3,2" fill="none" stroke-linecap="round"/>
  <!-- Completed pieces laid out below -->
  <!-- Left wing (black oval) -->
  <ellipse cx="30" cy="92" rx="18" ry="10" fill="#1f2937" stroke="#374151" stroke-width="1.5" transform="rotate(-15 30 92)"/>
  <!-- Right wing (black oval) -->
  <ellipse cx="70" cy="92" rx="18" ry="10" fill="#1f2937" stroke="#374151" stroke-width="1.5" transform="rotate(15 70 92)"/>
  <!-- Beak (orange triangle) -->
  <polygon points="96,82 108,96 84,96" fill="#fb923c" stroke="#374151" stroke-width="1.5"/>
  <!-- Arrow showing pieces are cut out and ready -->
  <line x1="56" y1="74" x2="56" y2="84" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
