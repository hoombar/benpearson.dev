<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <!-- Table surface -->
  <rect x="0" y="95" width="120" height="25" fill="#e5e7eb" rx="2"/>
  <!-- Finished ladybird pebble with glossy sheen -->
  <ellipse cx="60" cy="62" rx="30" ry="20" fill="#ef4444" stroke="#374151" stroke-width="2.5"/>
  <circle cx="50" cy="62" r="5" fill="#111827"/>
  <circle cx="70" cy="62" r="5" fill="#111827"/>
  <circle cx="60" cy="53" r="4" fill="#111827"/>
  <line x1="60" y1="42" x2="60" y2="82" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <!-- Gloss highlight on pebble -->
  <ellipse cx="48" cy="50" rx="8" ry="4" fill="white" opacity="0.35"/>
  <!-- PVA glue bottle -->
  <g transform="translate(8,35)">
    <rect x="0" y="0" width="22" height="40" rx="4" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/>
    <rect x="7" y="-8" width="8" height="10" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
    <text x="11" y="22" font-size="6" fill="#374151" text-anchor="middle" font-family="sans-serif">PVA</text>
  </g>
  <!-- Wide brush applying PVA -->
  <g transform="translate(95,10) rotate(40)">
    <rect x="-4" y="0" width="8" height="32" fill="#92400e" stroke="#374151" stroke-width="1.5"/>
    <rect x="-5" y="32" width="10" height="10" rx="1" fill="#bfdbfe" stroke="#374151" stroke-width="1"/>
    <rect x="-4" y="0" width="8" height="5" fill="#374151"/>
  </g>
  <!-- Arrow from brush to pebble -->
  <line x1="90" y1="52" x2="78" y2="57" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round"/>
  <!-- Sheen lines emanating from pebble -->
  <line x1="92" y1="56" x2="98" y2="50" stroke="#bfdbfe" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="94" y1="62" x2="102" y2="62" stroke="#bfdbfe" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="92" y1="68" x2="98" y2="74" stroke="#bfdbfe" stroke-width="1.5" stroke-linecap="round"/>
</svg>
