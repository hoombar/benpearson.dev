<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <!-- Ground / outdoor context -->
  <rect x="0" y="85" width="120" height="35" fill="#86efac" rx="2"/>
  <!-- Pebbles on ground -->
  <ellipse cx="30" cy="72" rx="18" ry="12" fill="#d1d5db" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="60" cy="75" rx="14" ry="9" fill="#e5e7eb" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="90" cy="71" rx="16" ry="10" fill="#9ca3af" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Water tap / sink indicated by arrow pointing down into bowl -->
  <rect x="48" y="10" width="24" height="30" rx="4" fill="#bfdbfe" stroke="#374151" stroke-width="1.5"/>
  <!-- Tap spout -->
  <path d="M60,18 Q68,18 68,25" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Water drops -->
  <line x1="68" y1="27" x2="68" y2="35" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="2,2" stroke-linecap="round"/>
  <!-- Pebble in bowl -->
  <ellipse cx="60" cy="37" rx="8" ry="5" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <!-- Arrow: pebbles to sink -->
  <line x1="35" y1="65" x2="50" y2="42" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round"/>
  <!-- Cloth / towel on right -->
  <rect x="82" y="50" width="22" height="16" rx="3" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <line x1="82" y1="55" x2="104" y2="55" stroke="#374151" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Arrow: bowl to towel -->
  <line x1="72" y1="37" x2="80" y2="52" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>
