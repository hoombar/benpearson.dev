<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Table surface -->
  <rect x="0" y="95" width="120" height="25" fill="#e5e7eb" rx="2"/>
  <!-- Large pebble (hero) - red base coat, now adding details -->
  <ellipse cx="60" cy="62" rx="30" ry="20" fill="#ef4444" stroke="#374151" stroke-width="2.5"/>
  <!-- Ladybird spots on pebble -->
  <circle cx="50" cy="62" r="5" fill="#111827" stroke="none"/>
  <circle cx="70" cy="62" r="5" fill="#111827" stroke="none"/>
  <circle cx="60" cy="53" r="4" fill="#111827" stroke="none"/>
  <!-- Centre line -->
  <line x1="60" y1="42" x2="60" y2="82" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <!-- Fine detail brush (thin) -->
  <g transform="translate(95,15) rotate(45)">
    <rect x="-2" y="0" width="4" height="30" fill="#92400e" stroke="#374151" stroke-width="1"/>
    <ellipse cx="0" cy="30" rx="2" ry="5" fill="#111827" stroke="#374151" stroke-width="0.8"/>
    <rect x="-2" y="0" width="4" height="4" fill="#374151"/>
  </g>
  <!-- Black marker pen on left -->
  <g transform="translate(8,40) rotate(-30)">
    <rect x="-4" y="0" width="8" height="38" rx="2" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <rect x="-4" y="0" width="8" height="8" rx="2" fill="#374151"/>
    <ellipse cx="0" cy="38" rx="3" ry="2" fill="#374151"/>
  </g>
  <!-- Small paint pot with black paint -->
  <rect x="20" y="80" width="18" height="14" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <rect x="21" y="81" width="16" height="7" rx="1" fill="#111827"/>
</svg>
