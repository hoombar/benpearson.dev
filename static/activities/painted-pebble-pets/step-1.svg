<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Paper / notebook sheet -->
  <rect x="8" y="10" width="60" height="75" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <!-- Sketched animal outlines on paper -->
  <!-- Ladybird sketch -->
  <ellipse cx="30" cy="30" rx="12" ry="9" fill="#fecaca" stroke="#374151" stroke-width="1.5"/>
  <line x1="30" y1="21" x2="30" y2="39" stroke="#374151" stroke-width="1" stroke-dasharray="2,1"/>
  <circle cx="25" cy="28" r="2" fill="none" stroke="#374151" stroke-width="1"/>
  <circle cx="35" cy="28" r="2" fill="none" stroke="#374151" stroke-width="1"/>
  <!-- Owl sketch -->
  <circle cx="30" cy="55" r="10" fill="#d1fae5" stroke="#374151" stroke-width="1.5"/>
  <circle cx="26" cy="52" r="3" fill="none" stroke="#374151" stroke-width="1"/>
  <circle cx="34" cy="52" r="3" fill="none" stroke="#374151" stroke-width="1"/>
  <path d="M28,59 Q30,61 32,59" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- Frog sketch -->
  <ellipse cx="30" cy="77" rx="11" ry="8" fill="#bbf7d0" stroke="#374151" stroke-width="1.5"/>
  <circle cx="23" cy="71" r="3" fill="none" stroke="#374151" stroke-width="1"/>
  <circle cx="37" cy="71" r="3" fill="none" stroke="#374151" stroke-width="1"/>
  <!-- Pebbles placed on paper (right side) -->
  <ellipse cx="86" cy="38" rx="16" ry="11" fill="#d1d5db" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="87" cy="65" rx="13" ry="8" fill="#e5e7eb" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="86" cy="88" rx="14" ry="9" fill="#9ca3af" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Pencil -->
  <g transform="translate(70,8) rotate(40)">
    <rect x="-3" y="0" width="6" height="28" fill="#fde68a" stroke="#374151" stroke-width="1"/>
    <polygon points="-3,28 3,28 0,35" fill="#fcd34d" stroke="#374151" stroke-width="1"/>
    <rect x="-3" y="0" width="6" height="4" fill="#f87171" stroke="#374151" stroke-width="1"/>
  </g>
</svg>
