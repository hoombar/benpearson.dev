<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <!-- Table surface -->
  <rect x="0" y="90" width="120" height="30" fill="#e5e7eb" rx="2"/>
  <!-- Paint palette -->
  <ellipse cx="20" cy="80" rx="15" ry="9" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <circle cx="13" cy="79" r="4" fill="#ef4444"/>
  <circle cx="20" cy="75" r="4" fill="#3b82f6"/>
  <circle cx="27" cy="79" r="4" fill="#22c55e"/>
  <!-- Pebble being painted (hero) -->
  <ellipse cx="68" cy="60" rx="26" ry="18" fill="#e5e7eb" stroke="#374151" stroke-width="2.5"/>
  <!-- Red paint going on pebble -->
  <ellipse cx="68" cy="60" rx="22" ry="14" fill="#ef4444" stroke="none" opacity="0.85"/>
  <!-- Paintbrush applying paint -->
  <g transform="translate(30,20) rotate(35)">
    <rect x="-3" y="0" width="6" height="35" fill="#92400e" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="0" cy="35" rx="4" ry="7" fill="#ef4444" stroke="#374151" stroke-width="1"/>
    <rect x="-3" y="0" width="6" height="5" fill="#374151"/>
  </g>
  <!-- Arrow from brush to pebble -->
  <line x1="46" y1="52" x2="56" y2="57" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" stroke-linecap="round"/>
  <!-- Two more plain pebbles waiting -->
  <ellipse cx="100" cy="55" rx="13" ry="9" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="100" cy="75" rx="14" ry="9" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <!-- Clock indicating waiting / drying -->
  <circle cx="105" cy="25" r="12" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <line x1="105" y1="25" x2="105" y2="16" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="105" y1="25" x2="112" y2="25" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>
