<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Hat shape — triangle top with folded brims -->
  <!-- Main triangle body -->
  <polygon points="60,18 18,62 102,62" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <!-- Newspaper lines on triangle -->
  <line x1="45" y1="40" x2="75" y2="40" stroke="#d1d5db" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="40" y1="46" x2="80" y2="46" stroke="#d1d5db" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="35" y1="52" x2="85" y2="52" stroke="#d1d5db" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Front brim (folded up) -->
  <rect x="18" y="62" width="84" height="12" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <line x1="30" y1="68" x2="90" y2="68" stroke="#d1d5db" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Tape strips on corners -->
  <rect x="18" y="60" width="10" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>
  <rect x="92" y="60" width="10" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>

  <!-- Arrow showing "pop open" -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M60,80 Q52,86 42,88" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M60,80 Q68,86 78,88" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Tape roll nearby -->
  <circle cx="104" cy="88" r="8" fill="#fde68a" stroke="#374151" stroke-width="1.2"/>
  <circle cx="104" cy="88" r="3" fill="#fef3c7" stroke="#374151" stroke-width="0.8"/>
</svg>