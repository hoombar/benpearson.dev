<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Finished pirate hat (hero, front view, decorated) -->
  <!-- Main triangle body -->
  <polygon points="60,14 10,68 110,68" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <!-- Brim -->
  <rect x="10" y="68" width="100" height="12" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <!-- Newspaper lines -->
  <line x1="40" y1="40" x2="80" y2="40" stroke="#d1d5db" stroke-width="0.8"/>
  <line x1="34" y1="48" x2="86" y2="48" stroke="#d1d5db" stroke-width="0.8"/>

  <!-- Skull and crossbones (painted) -->
  <ellipse cx="60" cy="36" rx="7" ry="8" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <circle cx="57" cy="34" r="1.5" fill="#374151" stroke="none"/>
  <circle cx="63" cy="34" r="1.5" fill="#374151" stroke="none"/>
  <path d="M59,38 L61,38 L60,40 Z" fill="#374151" stroke="none"/>
  <line x1="56" y1="42" x2="64" y2="42" stroke="#374151" stroke-width="0.6"/>
  <!-- Crossbones -->
  <line x1="48" y1="48" x2="72" y2="58" stroke="#f9fafb" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="48" x2="48" y2="58" stroke="#f9fafb" stroke-width="2" stroke-linecap="round"/>

  <!-- Newspaper feather (right side) -->
  <g transform="translate(94,30) rotate(25)">
    <!-- Feather shaft -->
    <line x1="0" y1="0" x2="0" y2="-32" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <!-- Feather barbs (fringed newspaper look) -->
    <line x1="0" y1="-6" x2="5" y2="-9" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="-10" x2="6" y2="-14" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="-14" x2="5" y2="-19" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="-18" x2="6" y2="-23" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="-22" x2="4" y2="-27" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="-6" x2="-4" y2="-10" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="-10" x2="-5" y2="-15" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="-14" x2="-4" y2="-20" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="-18" x2="-5" y2="-24" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="-22" x2="-3" y2="-28" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Star stickers -->
  <path d="M30,56 L31,52 L32,56 L36,56 L33,58 L34,62 L31,60 L28,62 L29,58 L26,56 Z"
        fill="#f59e0b" stroke="#374151" stroke-width="0.5"/>
  <path d="M80,24 L81,21 L82,24 L85,24 L83,26 L84,29 L81,27 L78,29 L79,26 L76,24 Z"
        fill="#f59e0b" stroke="#374151" stroke-width="0.5"/>

  <!-- Tape holding feather -->
  <rect x="90" y="58" width="8" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.5"/>

  <!-- Colour splatters -->
  <circle cx="22" cy="60" r="1.5" fill="#3b82f6" stroke="none" opacity="0.5"/>
  <circle cx="42" cy="62" r="1" fill="#ef4444" stroke="none" opacity="0.5"/>
  <circle cx="96" cy="48" r="1" fill="#3b82f6" stroke="none" opacity="0.4"/>
</svg>