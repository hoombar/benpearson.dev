<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Flat newspaper sheet (large rectangle) -->
  <rect x="15" y="20" width="90" height="56" rx="1" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <!-- Newspaper lines (text suggestion) -->
  <line x1="22" y1="30" x2="50" y2="30" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
  <line x1="22" y1="35" x2="55" y2="35" stroke="#d1d5db" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="22" y1="40" x2="48" y2="40" stroke="#d1d5db" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="22" y1="45" x2="52" y2="45" stroke="#d1d5db" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="62" y1="30" x2="98" y2="30" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
  <line x1="62" y1="35" x2="95" y2="35" stroke="#d1d5db" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="62" y1="40" x2="92" y2="40" stroke="#d1d5db" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="62" y1="45" x2="96" y2="45" stroke="#d1d5db" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Fold line (dashed, horizontal centre) -->
  <line x1="15" y1="48" x2="105" y2="48" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Arrow showing fold direction (bottom half folds up) -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M60,82 Q60,72 60,54" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Second state: folded top corners going down (ghost preview) -->
  <!-- Left corner fold line -->
  <line x1="15" y1="20" x2="60" y2="48" stroke="#374151" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5"/>
  <!-- Right corner fold line -->
  <line x1="105" y1="20" x2="60" y2="48" stroke="#374151" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5"/>
</svg>