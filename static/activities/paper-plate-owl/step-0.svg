<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate being painted brown (hero) -->
  <g transform="translate(16, 16)">
    <ellipse cx="38" cy="38" rx="38" ry="36" fill="#92400e" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="38" cy="38" rx="38" ry="36" fill="none" stroke="#78350f" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Paintbrush -->
  <g transform="translate(66, 34) rotate(25)">
    <rect x="0" y="-3" width="34" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#92400e" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pot -->
  <g transform="translate(86, 68)">
    <rect x="0" y="0" width="22" height="22" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
    <rect x="2" y="4" width="18" height="16" rx="1" fill="#92400e"/>
    <rect x="-1" y="-2" width="24" height="5" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Painting motion -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#92400e"/>
    </marker>
  </defs>
  <path d="M58,62 Q50,68 44,64" fill="none" stroke="#92400e" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
