<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Box lid with sound hole (hero) -->
  <rect x="8" y="20" width="104" height="80" rx="4" fill="#fbbf24" stroke="#374151" stroke-width="2.5"/>
  <!-- Sound hole (dark) -->
  <circle cx="60" cy="60" r="22" fill="#374151" stroke="#374151" stroke-width="2"/>
  <!-- Box edge depth hint -->
  <line x1="8" y1="100" x2="4" y2="108" stroke="#374151" stroke-width="1.5"/>
  <line x1="112" y1="100" x2="116" y2="108" stroke="#374151" stroke-width="1.5"/>
  <line x1="4" y1="108" x2="116" y2="108" stroke="#374151" stroke-width="1.5"/>
  <!-- Rubber bands stretched across the box (over the hole) -->
  <!-- Band 1 — thin, high pitch -->
  <line x1="8" y1="38" x2="112" y2="38" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Band 2 -->
  <line x1="8" y1="48" x2="112" y2="48" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <!-- Band 3 -->
  <line x1="8" y1="58" x2="112" y2="58" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Band 4 — wide, low pitch -->
  <line x1="8" y1="68" x2="112" y2="68" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <!-- Band 5 -->
  <line x1="8" y1="78" x2="112" y2="78" stroke="#a78bfa" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Band 6 — thickest -->
  <line x1="8" y1="88" x2="112" y2="88" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
  <!-- Vibration lines on band 3 (plucked) -->
  <path d="M40 58 Q48 50 56 58 Q64 66 72 58 Q80 50 88 58" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Small arrows showing sound waves emanating from hole -->
  <line x1="60" y1="38" x2="60" y2="32" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="50" y1="40" x2="46" y2="35" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="70" y1="40" x2="74" y2="35" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
</svg>
