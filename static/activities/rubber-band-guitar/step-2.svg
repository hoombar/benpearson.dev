<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Box body (hero) -->
  <rect x="30" y="44" width="84" height="64" rx="4" fill="#fbbf24" stroke="#374151" stroke-width="2.5"/>
  <!-- Rubber bands on box -->
  <line x1="30" y1="58" x2="114" y2="58" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="68" x2="114" y2="68" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="78" x2="114" y2="78" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <!-- Sound hole visible on box -->
  <circle cx="72" cy="80" r="14" fill="#d97706" stroke="#374151" stroke-width="1.5"/>
  <circle cx="72" cy="80" r="12" fill="#374151"/>
  <!-- Cardboard tube (neck) being attached to left side of box -->
  <rect x="4" y="56" width="28" height="18" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="2.5"/>
  <!-- Tube end ring (left) -->
  <ellipse cx="4" cy="65" rx="4" ry="9" fill="#d97706" stroke="#374151" stroke-width="2"/>
  <!-- Tube end touching box -->
  <ellipse cx="32" cy="65" rx="4" ry="9" fill="#d97706" stroke="#374151" stroke-width="2"/>
  <!-- Tape wrapping the joint (neck to box) -->
  <rect x="28" y="56" width="8" height="18" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <!-- Multiple tape wrap lines -->
  <line x1="28" y1="59" x2="36" y2="59" stroke="#374151" stroke-width="1" opacity="0.6"/>
  <line x1="28" y1="63" x2="36" y2="63" stroke="#374151" stroke-width="1" opacity="0.6"/>
  <line x1="28" y1="67" x2="36" y2="67" stroke="#374151" stroke-width="1" opacity="0.6"/>
  <line x1="28" y1="71" x2="36" y2="71" stroke="#374151" stroke-width="1" opacity="0.6"/>
  <!-- Arrow showing tape being wrapped -->
  <path d="M22 44 Q28 48 30 56" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
  <!-- Tape roll -->
  <circle cx="16" cy="34" r="10" fill="#fde68a" stroke="#374151" stroke-width="2"/>
  <circle cx="16" cy="34" r="4" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
</svg>
