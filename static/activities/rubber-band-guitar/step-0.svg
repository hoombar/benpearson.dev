<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Cardboard box (hero — flat lid view) -->
  <rect x="14" y="24" width="92" height="68" rx="4" fill="#fbbf24" stroke="#374151" stroke-width="2.5"/>
  <!-- Box edge lines (depth) -->
  <line x1="14" y1="92" x2="8" y2="100" stroke="#374151" stroke-width="1.5"/>
  <line x1="106" y1="92" x2="112" y2="100" stroke="#374151" stroke-width="1.5"/>
  <line x1="8" y1="100" x2="112" y2="100" stroke="#374151" stroke-width="1.5"/>
  <line x1="14" y1="24" x2="8" y2="32" stroke="#374151" stroke-width="1.5"/>
  <line x1="8" y1="32" x2="8" y2="100" stroke="#374151" stroke-width="1.5"/>
  <!-- Cardboard texture -->
  <line x1="14" y1="38" x2="106" y2="38" stroke="#d97706" stroke-width="0.8" opacity="0.5"/>
  <line x1="14" y1="52" x2="106" y2="52" stroke="#d97706" stroke-width="0.8" opacity="0.5"/>
  <line x1="14" y1="66" x2="106" y2="66" stroke="#d97706" stroke-width="0.8" opacity="0.5"/>
  <line x1="14" y1="80" x2="106" y2="80" stroke="#d97706" stroke-width="0.8" opacity="0.5"/>
  <!-- Drawn circle for sound hole (dashed) -->
  <circle cx="60" cy="58" r="22" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Circle already cut (solid) inside -->
  <circle cx="60" cy="58" r="16" fill="#d97706" stroke="#374151" stroke-width="2"/>
  <!-- Dark inside the hole -->
  <circle cx="60" cy="58" r="14" fill="#374151" stroke="none"/>
  <!-- Scissors near the circle -->
  <g transform="translate(90, 30) rotate(-45)">
    <line x1="0" y1="0" x2="14" y2="0" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="12" y2="5" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-4" cy="-4" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <circle cx="-4" cy="5" r="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  </g>
  <!-- Arrow: scissors cutting the circle -->
  <path d="M88 46 Q78 50 78 56" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
  <!-- Pen drawing the circle outline -->
  <line x1="26" y1="14" x2="40" y2="36" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <polygon points="40,36 37,30 44,32" fill="#374151"/>
</svg>
