<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Finished decorated guitar (hero) -->
  <!-- Box body -->
  <rect x="32" y="30" width="80" height="82" rx="6" fill="#fbbf24" stroke="#374151" stroke-width="2.5"/>
  <!-- Guitar body decoration — flame design -->
  <path d="M50 40 Q44 50 50 60 Q46 58 50 68" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <path d="M58 36 Q52 48 58 58 Q54 56 58 66" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <!-- Star decoration -->
  <path d="M96 42 L97.5 47 L102 47 L98.5 50 L100 55 L96 52 L92 55 L93.5 50 L90 47 L94.5 47 Z" fill="#fde68a" stroke="#374151" stroke-width="1"/>
  <!-- Sound hole with rubber band strings -->
  <circle cx="72" cy="78" r="16" fill="#d97706" stroke="#374151" stroke-width="2"/>
  <circle cx="72" cy="78" r="14" fill="#374151"/>
  <!-- Rubber band strings (4 bands) -->
  <line x1="32" y1="58" x2="112" y2="58" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="66" x2="112" y2="66" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="74" x2="112" y2="74" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="82" x2="112" y2="82" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <!-- Neck tube -->
  <rect x="4" y="54" width="30" height="20" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="2.5"/>
  <ellipse cx="4" cy="64" rx="4" ry="10" fill="#d97706" stroke="#374151" stroke-width="2"/>
  <!-- Fret lines on neck -->
  <line x1="12" y1="54" x2="12" y2="74" stroke="#374151" stroke-width="1.5"/>
  <line x1="20" y1="54" x2="20" y2="74" stroke="#374151" stroke-width="1.5"/>
  <line x1="28" y1="54" x2="28" y2="74" stroke="#374151" stroke-width="1.5"/>
  <!-- Tuning pegs at neck end -->
  <circle cx="6" cy="56" r="2.5" fill="#374151" stroke="#374151" stroke-width="1"/>
  <circle cx="6" cy="72" r="2.5" fill="#374151" stroke="#374151" stroke-width="1"/>
  <!-- Strum arc: motion of strumming across strings -->
  <path d="M108 52 Q116 68 108 84" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,2"/>
  <!-- Music notes coming off the strings -->
  <text x="96" y="28" fill="#374151" font-size="10" font-family="serif">♪</text>
  <text x="106" y="20" fill="#374151" font-size="8" font-family="serif">♩</text>
</svg>
