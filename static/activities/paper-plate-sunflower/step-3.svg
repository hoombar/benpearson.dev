<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall background -->
  <rect x="0" y="0" width="120" height="120" fill="#f3f4f6"/>

  <!-- Complete sunflower displayed on wall -->

  <!-- Stem (green paper strip) -->
  <rect x="56" y="60" width="6" height="56" rx="1" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>

  <!-- Left leaf -->
  <g transform="translate(38, 78)">
    <ellipse cx="0" cy="0" rx="14" ry="6" fill="#22c55e" stroke="#374151" stroke-width="0.8" transform="rotate(-30)"/>
    <line x1="-10" y1="5" x2="8" y2="-4" stroke="#16a34a" stroke-width="0.6"/>
  </g>

  <!-- Right leaf -->
  <g transform="translate(80, 90)">
    <ellipse cx="0" cy="0" rx="14" ry="6" fill="#22c55e" stroke="#374151" stroke-width="0.8" transform="rotate(25)"/>
    <line x1="-8" y1="-4" x2="10" y2="5" stroke="#16a34a" stroke-width="0.6"/>
  </g>

  <!-- Sunflower head -->
  <g transform="translate(59, 36)">
    <!-- Petals -->
    <ellipse cx="0" cy="-24" rx="5" ry="10" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="12" cy="-21" rx="5" ry="10" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(30)"/>
    <ellipse cx="21" cy="-12" rx="5" ry="10" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(60)"/>
    <ellipse cx="24" cy="0" rx="5" ry="10" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(90)"/>
    <ellipse cx="21" cy="12" rx="5" ry="10" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(120)"/>
    <ellipse cx="12" cy="21" rx="5" ry="10" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(150)"/>
    <ellipse cx="0" cy="24" rx="5" ry="10" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(180)"/>
    <ellipse cx="-12" cy="21" rx="5" ry="10" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(210)"/>
    <ellipse cx="-21" cy="12" rx="5" ry="10" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(240)"/>
    <ellipse cx="-24" cy="0" rx="5" ry="10" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(270)"/>
    <ellipse cx="-21" cy="-12" rx="5" ry="10" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(300)"/>
    <ellipse cx="-12" cy="-21" rx="5" ry="10" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(330)"/>

    <!-- Brown centre -->
    <circle cx="0" cy="0" r="12" fill="#92400e" stroke="#374151" stroke-width="1.2"/>
    <!-- Seeds -->
    <circle cx="-4" cy="-4" r="1.2" fill="#451a03" stroke="none"/>
    <circle cx="2" cy="-4" r="1.2" fill="#451a03" stroke="none"/>
    <circle cx="-6" cy="2" r="1.2" fill="#451a03" stroke="none"/>
    <circle cx="0" cy="0" r="1.2" fill="#451a03" stroke="none"/>
    <circle cx="6" cy="2" r="1.2" fill="#451a03" stroke="none"/>
    <circle cx="-2" cy="6" r="1.2" fill="#451a03" stroke="none"/>
    <circle cx="4" cy="6" r="1.2" fill="#451a03" stroke="none"/>
  </g>

  <!-- Tape holding it to wall -->
  <rect x="54" y="8" width="12" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.4" opacity="0.7"/>
</svg>
