<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Sunflower with petals cut (hero) -->
  <!-- Petals radiating outward -->
  <g transform="translate(50, 48)">
    <!-- Petals (12 around the circle) -->
    <ellipse cx="0" cy="-30" rx="6" ry="12" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="15" cy="-26" rx="6" ry="12" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(30)"/>
    <ellipse cx="26" cy="-15" rx="6" ry="12" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(60)"/>
    <ellipse cx="30" cy="0" rx="6" ry="12" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(90)"/>
    <ellipse cx="26" cy="15" rx="6" ry="12" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(120)"/>
    <ellipse cx="15" cy="26" rx="6" ry="12" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(150)"/>
    <ellipse cx="0" cy="30" rx="6" ry="12" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(180)"/>
    <ellipse cx="-15" cy="26" rx="6" ry="12" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(210)"/>
    <ellipse cx="-26" cy="15" rx="6" ry="12" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(240)"/>
    <ellipse cx="-30" cy="0" rx="6" ry="12" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(270)"/>
    <ellipse cx="-26" cy="-15" rx="6" ry="12" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(300)"/>
    <ellipse cx="-15" cy="-26" rx="6" ry="12" fill="#fbbf24" stroke="#374151" stroke-width="0.8" transform="rotate(330)"/>

    <!-- Brown seed centre -->
    <circle cx="0" cy="0" r="14" fill="#92400e" stroke="#374151" stroke-width="1.2"/>
    <!-- Seeds -->
    <circle cx="-4" cy="-4" r="1.2" fill="#451a03" stroke="none"/>
    <circle cx="2" cy="-4" r="1.2" fill="#451a03" stroke="none"/>
    <circle cx="-6" cy="2" r="1.2" fill="#451a03" stroke="none"/>
    <circle cx="0" cy="0" r="1.2" fill="#451a03" stroke="none"/>
    <circle cx="6" cy="2" r="1.2" fill="#451a03" stroke="none"/>
    <circle cx="-2" cy="6" r="1.2" fill="#451a03" stroke="none"/>
    <circle cx="4" cy="6" r="1.2" fill="#451a03" stroke="none"/>
  </g>

  <!-- Scissors cutting petals -->
  <g transform="translate(86, 18) rotate(30)">
    <path d="M0,0 L-14,5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,0 L-14,-5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#374151"/>
    <ellipse cx="5" cy="3.5" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <ellipse cx="5" cy="-3.5" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Cut lines showing where to cut -->
  <line x1="72" y1="22" x2="66" y2="30" stroke="#ef4444" stroke-width="0.6" stroke-dasharray="2,2"/>
  <line x1="78" y1="28" x2="68" y2="34" stroke="#ef4444" stroke-width="0.6" stroke-dasharray="2,2"/>

  <!-- Paper scraps -->
  <rect x="92" y="50" width="6" height="4" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.3" opacity="0.4"/>
  <rect x="98" y="56" width="5" height="3" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.3" opacity="0.4"/>
</svg>
