<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Yellow painted plate -->
  <circle cx="50" cy="48" r="36" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>

  <!-- Brown seed centre being glued on (hero focus) -->
  <circle cx="50" cy="48" r="14" fill="#92400e" stroke="#374151" stroke-width="1.2"/>

  <!-- Seed dots/texture on centre -->
  <circle cx="44" cy="42" r="1.5" fill="#451a03" stroke="none"/>
  <circle cx="50" cy="40" r="1.5" fill="#451a03" stroke="none"/>
  <circle cx="56" cy="42" r="1.5" fill="#451a03" stroke="none"/>
  <circle cx="42" cy="48" r="1.5" fill="#451a03" stroke="none"/>
  <circle cx="48" cy="46" r="1.5" fill="#451a03" stroke="none"/>
  <circle cx="54" cy="46" r="1.5" fill="#451a03" stroke="none"/>
  <circle cx="58" cy="48" r="1.5" fill="#451a03" stroke="none"/>
  <circle cx="44" cy="52" r="1.5" fill="#451a03" stroke="none"/>
  <circle cx="50" cy="50" r="1.5" fill="#451a03" stroke="none"/>
  <circle cx="56" cy="52" r="1.5" fill="#451a03" stroke="none"/>
  <circle cx="46" cy="56" r="1.5" fill="#451a03" stroke="none"/>
  <circle cx="52" cy="54" r="1.5" fill="#451a03" stroke="none"/>

  <!-- Hand pressing centre onto plate -->
  <g transform="translate(56, 60)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrow showing pressing down -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M62,62 Q58,60 56,58" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Glue bottle -->
  <g transform="translate(90, 30)">
    <rect x="0" y="8" width="14" height="22" rx="3" fill="white" stroke="#374151" stroke-width="1"/>
    <rect x="3" y="0" width="8" height="10" rx="2" fill="#f97316" stroke="#374151" stroke-width="0.8"/>
    <rect x="5" y="-3" width="4" height="4" rx="1" fill="#f97316" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Brown paper circle cutout nearby -->
  <g transform="translate(88, 72)">
    <circle cx="10" cy="10" r="10" fill="#92400e" stroke="#374151" stroke-width="0.6" opacity="0.5"/>
  </g>
</svg>
