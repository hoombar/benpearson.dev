<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate being painted (hero) -->
  <circle cx="50" cy="48" r="36" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <!-- Orange streaks near centre -->
  <circle cx="50" cy="48" r="14" fill="#f97316" stroke="none" opacity="0.4"/>
  <circle cx="50" cy="48" r="8" fill="#ea580c" stroke="none" opacity="0.3"/>

  <!-- Plate rim -->
  <circle cx="50" cy="48" r="36" fill="none" stroke="#374151" stroke-width="1.5"/>
  <!-- Inner plate ridge -->
  <circle cx="50" cy="48" r="28" fill="none" stroke="#374151" stroke-width="0.5" opacity="0.3"/>

  <!-- Paintbrush painting yellow -->
  <g transform="translate(76, 24)">
    <!-- Handle -->
    <rect x="0" y="0" width="6" height="30" rx="2" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
    <!-- Ferrule -->
    <rect x="-1" y="28" width="8" height="5" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="0.6"/>
    <!-- Bristles -->
    <rect x="0" y="32" width="6" height="7" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Hand holding brush -->
  <g transform="translate(84, 18)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Paint pots -->
  <g transform="translate(88, 62)">
    <rect x="0" y="0" width="16" height="20" rx="3" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="8" cy="2" rx="8" ry="3" fill="#f59e0b" stroke="#374151" stroke-width="0.6"/>
  </g>
  <g transform="translate(88, 86)">
    <rect x="0" y="0" width="14" height="10" rx="2" fill="#f97316" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="7" cy="2" rx="7" ry="2.5" fill="#ea580c" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Paint stroke marks showing coverage -->
  <path d="M28,36 Q34,34 40,36" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
  <path d="M36,60 Q44,58 52,60" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
</svg>
