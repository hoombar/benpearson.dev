<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Painted chest with decorations being added (hero) -->
  <g transform="translate(12, 20)">
    <!-- Bottom -->
    <rect x="0" y="30" width="70" height="22" rx="2" fill="#b45309" stroke="#374151" stroke-width="1.5"/>
    <line x1="4" y1="38" x2="66" y2="38" stroke="#92400e" stroke-width="0.8"/>
    <line x1="4" y1="44" x2="66" y2="44" stroke="#92400e" stroke-width="0.8"/>

    <!-- Lock drawn on front -->
    <rect x="28" y="34" width="14" height="12" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1"/>
    <circle cx="35" cy="42" r="2" fill="#374151"/>

    <!-- Metal band across bottom -->
    <rect x="0" y="48" width="70" height="3" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>

    <!-- Lid -->
    <rect x="0" y="0" width="70" height="28" rx="2" fill="#d97706" stroke="#374151" stroke-width="1.5"/>
    <line x1="4" y1="14" x2="66" y2="14" stroke="#92400e" stroke-width="0.8"/>

    <!-- Metal bands on lid -->
    <rect x="0" y="6" width="70" height="3" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
    <rect x="0" y="20" width="70" height="3" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>

    <!-- Jewel stickers -->
    <circle cx="12" cy="12" r="3" fill="#ef4444" stroke="#374151" stroke-width="0.5"/>
    <circle cx="35" cy="12" r="3" fill="#3b82f6" stroke="#374151" stroke-width="0.5"/>
    <circle cx="58" cy="12" r="3" fill="#22c55e" stroke="#374151" stroke-width="0.5"/>

    <!-- Hinges on back (rectangles) -->
    <rect x="12" y="26" width="8" height="6" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
    <rect x="48" y="26" width="8" height="6" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>

    <line x1="0" y1="28" x2="70" y2="28" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Hand with marker drawing details -->
  <g transform="translate(84, 28)">
    <rect x="0" y="0" width="8" height="24" rx="2" fill="#374151" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="20" width="8" height="4" rx="1" fill="#1f2937" stroke="#374151" stroke-width="0.4"/>
    <polygon points="2,24 6,24 4,28" fill="#374151"/>
  </g>
  <g transform="translate(92, 22)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Sticker sheet -->
  <g transform="translate(86, 62)">
    <rect x="0" y="0" width="22" height="18" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="0.5"/>
    <circle cx="6" cy="6" r="3" fill="#ef4444" stroke="#374151" stroke-width="0.3"/>
    <circle cx="16" cy="6" r="3" fill="#8b5cf6" stroke="#374151" stroke-width="0.3"/>
    <circle cx="6" cy="14" r="3" fill="#22c55e" stroke="#374151" stroke-width="0.3"/>
    <circle cx="16" cy="14" r="3" fill="#fbbf24" stroke="#374151" stroke-width="0.3"/>
  </g>

  <!-- Glitter pot -->
  <g transform="translate(86, 84)">
    <rect x="0" y="0" width="14" height="12" rx="2" fill="#c5d6e7" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="7" cy="2" rx="7" ry="2.5" fill="#c4b5fd" stroke="#374151" stroke-width="0.5"/>
    <!-- Sparkles -->
    <polygon points="4,-2 4.5,-4 5,-2" fill="#fbbf24" stroke="none"/>
    <polygon points="10,-3 10.5,-5 11,-3" fill="#fbbf24" stroke="none"/>
  </g>
</svg>
