<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Rocket body (hero — vertical, slightly right of centre) -->
  <rect x="46" y="26" width="28" height="72" rx="3" stroke="#374151" stroke-width="2.5" fill="#e5e7eb"/>
  <!-- Nose cone (red, sealed) -->
  <path d="M46 26 L60 10 L74 26 Z" stroke="#374151" stroke-width="2.5" fill="#ef4444" stroke-linejoin="round"/>
  <!-- Three fins attached at the bottom -->
  <!-- Left fin (pointing left) -->
  <path d="M46 78 L22 96 L46 96 Z" stroke="#374151" stroke-width="2" fill="#ef4444" stroke-linejoin="round"/>
  <!-- Right fin (pointing right) -->
  <path d="M74 78 L98 96 L74 96 Z" stroke="#374151" stroke-width="2" fill="#ef4444" stroke-linejoin="round"/>
  <!-- Back fin (pointing down — simplified as a flap at centre-back) -->
  <path d="M52 94 L60 112 L68 94 Z" stroke="#374151" stroke-width="2" fill="#fca5a5" stroke-linejoin="round"/>
  <!-- Tape strips attaching fins -->
  <rect x="44" y="84" width="6" height="10" rx="1" stroke="#374151" stroke-width="1" fill="#dbeafe" opacity="0.8"/>
  <rect x="70" y="84" width="6" height="10" rx="1" stroke="#374151" stroke-width="1" fill="#dbeafe" opacity="0.8"/>
  <!-- Small paper square source (upper left) with fold diagonal showing it becomes a triangle -->
  <rect x="6" y="12" width="22" height="22" rx="1" stroke="#374151" stroke-width="1.5" fill="#f3f4f6"/>
  <line x1="6" y1="34" x2="28" y2="12" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3" stroke-linecap="round"/>
  <!-- Arrow from square to fin — marker auto-aligns to line direction (10,24) = down-right -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <line x1="32" y1="30" x2="42" y2="54" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
