<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Rocket (hero — centred, with nose, body, fins, and decorations) -->
  <!-- Body -->
  <rect x="42" y="28" width="30" height="72" rx="3" stroke="#374151" stroke-width="2.5" fill="#e5e7eb"/>
  <!-- Nose cone -->
  <path d="M42 28 L57 10 L72 28 Z" stroke="#374151" stroke-width="2.5" fill="#ef4444" stroke-linejoin="round"/>
  <!-- Left fin -->
  <path d="M42 76 L22 96 L42 96 Z" stroke="#374151" stroke-width="2" fill="#ef4444" stroke-linejoin="round"/>
  <!-- Right fin -->
  <path d="M72 76 L92 96 L72 96 Z" stroke="#374151" stroke-width="2" fill="#ef4444" stroke-linejoin="round"/>
  <!-- Bottom fin -->
  <path d="M49 96 L57 112 L65 96 Z" stroke="#374151" stroke-width="2" fill="#fca5a5" stroke-linejoin="round"/>
  <!-- Decoration: circular porthole window -->
  <circle cx="57" cy="52" r="7" stroke="#374151" stroke-width="1.5" fill="#dbeafe"/>
  <!-- Decoration: star on body -->
  <path d="M57 68 L59 73 L64 73 L60 76 L62 81 L57 78 L52 81 L54 76 L50 73 L55 73 Z" stroke="#374151" stroke-width="1" fill="#fde68a"/>
  <!-- Flame decoration near base -->
  <path d="M48 92 Q50 86 52 88 Q54 82 57 86 Q60 80 62 86 Q64 82 66 88 Q68 86 70 92" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Marker pen held against rocket (right side, peripheral) -->
  <!-- Marker body -->
  <rect x="80" y="44" width="10" height="34" rx="3" stroke="#374151" stroke-width="1.5" fill="#3b82f6"/>
  <!-- Marker cap -->
  <rect x="80" y="38" width="10" height="8" rx="2" stroke="#374151" stroke-width="1.5" fill="#1d4ed8"/>
  <!-- Marker tip -->
  <rect x="83" y="78" width="4" height="6" rx="1" stroke="#374151" stroke-width="1" fill="#374151"/>
  <!-- Dashed line from marker tip to star (showing the drawing action) -->
  <line x1="83" y1="84" x2="64" y2="75" stroke="#374151" stroke-width="1" stroke-dasharray="3,2" stroke-linecap="round"/>
</svg>
