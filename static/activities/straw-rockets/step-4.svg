<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Straw (angled lower-left to upper-right) -->
  <g transform="translate(10, 94) rotate(-45)">
    <rect x="0" y="-5" width="65" height="10" rx="5" fill="#f97316" stroke="#374151" stroke-width="2"/>
    <line x1="4" y1="-2" x2="61" y2="-2" stroke="#fdba74" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- Rocket — ALL parts in one group so they rotate together as a single unit -->
  <g transform="translate(72, 32) rotate(45)">
    <!-- Body -->
    <rect x="-10" y="-24" width="20" height="48" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="2.5"/>
    <!-- Nose cone -->
    <path d="M-10,-24 L0,-38 L10,-24 Z" fill="#ef4444" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Left fin -->
    <path d="M-10,14 L-22,26 L-10,26 Z" fill="#ef4444" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <!-- Right fin -->
    <path d="M10,14 L22,26 L10,26 Z" fill="#ef4444" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <!-- Porthole window -->
    <circle cx="0" cy="-8" r="5" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
    <!-- Star decoration -->
    <path d="M0,6 L1.5,10 L5,10 L2.5,12.5 L3.5,16 L0,14 L-3.5,16 L-2.5,12.5 L-5,10 L-1.5,10 Z" fill="#fde68a" stroke="#374151" stroke-width="0.8"/>
  </g>
  <!-- Speed lines trailing behind rocket -->
  <line x1="54" y1="60" x2="40" y2="74" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="66" x2="46" y2="80" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="55" x2="32" y2="66" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arc trajectory (dashed) with arrowhead -->
  <path d="M86 16 Q98 8 112 10" stroke="#374151" stroke-width="1.5" fill="none" stroke-dasharray="4,3" stroke-linecap="round"/>
  <path d="M109 7 L113 10 L110 14" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Air puff lines (blowing into straw) -->
  <line x1="18" y1="100" x2="30" y2="95" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="104" x2="32" y2="102" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="108" x2="28" y2="110" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>
