<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Straw (hero — the thing being rolled around) -->
  <rect x="10" y="54" width="100" height="12" rx="6" stroke="#374151" stroke-width="2.5" fill="#f97316"/>
  <!-- Straw highlight line -->
  <line x1="14" y1="58" x2="106" y2="58" stroke="#fdba74" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Straw opening left end -->
  <ellipse cx="10" cy="60" rx="3" ry="6" stroke="#374151" stroke-width="1.5" fill="#ea580c"/>
  <!-- Paper strip being rolled (source — upper left) -->
  <rect x="10" y="14" width="40" height="28" rx="2" stroke="#374151" stroke-width="2" fill="#f3f4f6"/>
  <!-- Paper ruled lines showing it's a sheet -->
  <line x1="14" y1="20" x2="46" y2="20" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="14" y1="26" x2="46" y2="26" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="14" y1="32" x2="46" y2="32" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Marker for all arrowheads — auto-aligns to path/line direction -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Arrow from paper to straw: direction (16,20) = 51° below horizontal -->
  <line x1="54" y1="28" x2="70" y2="48" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Paper tube around straw (the result — formed around right portion of straw) -->
  <rect x="66" y="50" width="36" height="20" rx="3" stroke="#374151" stroke-width="2" fill="#e5e7eb"/>
  <!-- Tape strip on the paper tube -->
  <rect x="78" y="50" width="10" height="20" rx="1" stroke="#374151" stroke-width="1" fill="#dbeafe" opacity="0.7"/>
  <!-- Rolling arc arrow: tangent at (96,44) = (96−84, 44−36) = (12,8) = 34° below horizontal -->
  <path d="M72 44 Q84 36 96 44" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
</svg>
