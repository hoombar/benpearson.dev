<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Tin can 1 being painted (hero) -->
  <g transform="translate(10, 26)">
    <rect x="0" y="0" width="24" height="36" rx="2" fill="#ef4444" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="12" cy="0" rx="12" ry="4" fill="#fca5a5" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="12" cy="36" rx="12" ry="4" fill="#dc2626" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Tin can 2 (painted blue) -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="22" height="32" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
    <ellipse cx="11" cy="0" rx="11" ry="3.5" fill="#60a5fa" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="11" cy="32" rx="11" ry="3.5" fill="#2563eb" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Tin can 3 (painted green) -->
  <g transform="translate(68, 28)">
    <rect x="0" y="0" width="22" height="34" rx="2" fill="#22c55e" stroke="#374151" stroke-width="1"/>
    <ellipse cx="11" cy="0" rx="11" ry="3.5" fill="#4ade80" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="11" cy="34" rx="11" ry="3.5" fill="#16a34a" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paintbrush -->
  <g transform="translate(18, 10) rotate(25)">
    <rect x="0" y="-3" width="26" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Tape covering sharp edge -->
  <rect x="10" y="60" width="24" height="3" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3"/>

  <!-- Paint pot -->
  <g transform="translate(94, 50)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
    <rect x="2" y="3" width="12" height="11" rx="1" fill="#fbbf24"/>
  </g>

  <!-- Warning -->
  <g transform="translate(96, 6)">
    <polygon points="8,0 0,14 16,14" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <line x1="8" y1="4" x2="8" y2="9" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="8" cy="11.5" r="0.8" fill="#374151"/>
  </g>
</svg>
