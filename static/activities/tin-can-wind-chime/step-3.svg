<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect x="0" y="0" width="120" height="120" fill="#dbeafe"/>

  <!-- Tree branch -->
  <path d="M0,12 Q30,8 60,14 Q90,20 120,16" fill="none" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>

  <!-- String from branch -->
  <line x1="60" y1="16" x2="60" y2="26" stroke="#374151" stroke-width="0.8"/>

  <!-- Horizontal stick -->
  <line x1="24" y1="26" x2="96" y2="26" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>

  <!-- Can 1 (short string) -->
  <line x1="34" y1="26" x2="34" y2="40" stroke="#374151" stroke-width="0.6"/>
  <g transform="translate(24, 40)">
    <rect x="0" y="0" width="20" height="26" rx="2" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <line x1="2" y1="8" x2="18" y2="8" stroke="#fbbf24" stroke-width="1"/>
    <line x1="2" y1="18" x2="18" y2="18" stroke="#fbbf24" stroke-width="1"/>
    <ellipse cx="10" cy="26" rx="10" ry="3" fill="#dc2626" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Can 2 (medium string) -->
  <line x1="52" y1="26" x2="52" y2="48" stroke="#374151" stroke-width="0.6"/>
  <g transform="translate(43, 48)">
    <rect x="0" y="0" width="18" height="24" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
    <circle cx="9" cy="12" r="3" fill="#fbbf24" stroke="#374151" stroke-width="0.3"/>
    <ellipse cx="9" cy="24" rx="9" ry="3" fill="#2563eb" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Can 3 (long string) -->
  <line x1="68" y1="26" x2="68" y2="54" stroke="#374151" stroke-width="0.6"/>
  <g transform="translate(58, 54)">
    <rect x="0" y="0" width="20" height="28" rx="2" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <line x1="2" y1="6" x2="18" y2="6" stroke="#a855f7" stroke-width="1"/>
    <line x1="2" y1="14" x2="18" y2="14" stroke="#a855f7" stroke-width="1"/>
    <line x1="2" y1="22" x2="18" y2="22" stroke="#a855f7" stroke-width="1"/>
    <ellipse cx="10" cy="28" rx="10" ry="3" fill="#16a34a" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Can 4 (medium-short) -->
  <line x1="84" y1="26" x2="84" y2="42" stroke="#374151" stroke-width="0.6"/>
  <g transform="translate(74, 42)">
    <rect x="0" y="0" width="20" height="24" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="10" cy="24" rx="10" ry="3" fill="#eab308" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Wind lines -->
  <line x1="4" y1="50" x2="16" y2="50" stroke="#374151" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="6" y1="58" x2="18" y2="58" stroke="#374151" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="100" y1="54" x2="112" y2="54" stroke="#374151" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Sound lines -->
  <path d="M48,68 Q46,64 48,60" fill="none" stroke="#374151" stroke-width="0.5" opacity="0.5"/>
  <path d="M72,80 Q70,76 72,72" fill="none" stroke="#374151" stroke-width="0.5" opacity="0.5"/>
</svg>
