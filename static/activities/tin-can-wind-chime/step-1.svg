<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Tin can upside down showing base (hero) -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="40" height="56" rx="3" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Bottom (now on top) -->
    <ellipse cx="20" cy="0" rx="20" ry="6" fill="#dc2626" stroke="#374151" stroke-width="1"/>
    <!-- Rim (now at bottom) -->
    <ellipse cx="20" cy="56" rx="20" ry="6" fill="#fca5a5" stroke="#374151" stroke-width="0.8"/>
    <!-- Hole in centre of base -->
    <circle cx="20" cy="0" r="3" fill="#fef3c7" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Nail/tool poking hole -->
  <g transform="translate(40, 4) rotate(10)">
    <rect x="0" y="0" width="4" height="18" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="0.6"/>
    <circle cx="2" cy="0" r="2" fill="#6b7280" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Arrow showing poke direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="50" y1="10" x2="48" y2="16" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Other cans waiting -->
  <g transform="translate(76, 40)">
    <rect x="0" y="0" width="18" height="28" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="9" cy="0" rx="9" ry="3" fill="#60a5fa" stroke="#374151" stroke-width="0.5"/>
    <circle cx="9" cy="0" r="2" fill="#fef3c7" stroke="#374151" stroke-width="0.4"/>
  </g>
  <g transform="translate(98, 44)">
    <rect x="0" y="0" width="16" height="26" rx="2" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="8" cy="0" rx="8" ry="3" fill="#4ade80" stroke="#374151" stroke-width="0.5"/>
    <circle cx="8" cy="0" r="2" fill="#fef3c7" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Warning -->
  <g transform="translate(80, 6)">
    <polygon points="8,0 0,14 16,14" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <line x1="8" y1="4" x2="8" y2="9" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="8" cy="11.5" r="0.8" fill="#374151"/>
  </g>
</svg>
