<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Horizontal stick/rod at top -->
  <line x1="10" y1="10" x2="110" y2="10" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>

  <!-- String 1 (short) with can -->
  <line x1="26" y1="10" x2="26" y2="30" stroke="#374151" stroke-width="0.8"/>
  <g transform="translate(14, 30)">
    <rect x="0" y="0" width="24" height="32" rx="2" fill="#ef4444" stroke="#374151" stroke-width="1"/>
    <ellipse cx="12" cy="32" rx="12" ry="4" fill="#dc2626" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- String 2 (medium) with can -->
  <line x1="52" y1="10" x2="52" y2="40" stroke="#374151" stroke-width="0.8"/>
  <g transform="translate(41, 40)">
    <rect x="0" y="0" width="22" height="28" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
    <ellipse cx="11" cy="28" rx="11" ry="3.5" fill="#2563eb" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- String 3 (long) with can -->
  <line x1="78" y1="10" x2="78" y2="50" stroke="#374151" stroke-width="0.8"/>
  <g transform="translate(66, 50)">
    <rect x="0" y="0" width="24" height="34" rx="2" fill="#22c55e" stroke="#374151" stroke-width="1"/>
    <ellipse cx="12" cy="34" rx="12" ry="4" fill="#16a34a" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- String 4 (medium-short) with can -->
  <line x1="100" y1="10" x2="100" y2="34" stroke="#374151" stroke-width="0.8"/>
  <g transform="translate(90, 34)">
    <rect x="0" y="0" width="20" height="26" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1"/>
    <ellipse cx="10" cy="26" rx="10" ry="3" fill="#eab308" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Knot detail inside can -->
  <circle cx="26" cy="32" r="2" fill="#374151"/>
  <circle cx="52" cy="42" r="2" fill="#374151"/>

  <!-- Hand threading string -->
  <g transform="translate(58, 18)">
    <rect x="0" y="0" width="8" height="16" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="0.6"/>
  </g>
</svg>
