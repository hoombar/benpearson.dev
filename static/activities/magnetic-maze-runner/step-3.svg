<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Themed maze (space theme - top down view) -->
  <rect x="10" y="8" width="80" height="84" rx="2" fill="#1e293b" stroke="#374151" stroke-width="1.5"/>

  <!-- Stars in space background -->
  <circle cx="16" cy="14" r="1" fill="#fbbf24" stroke="none"/>
  <circle cx="44" cy="12" r="0.8" fill="#f9fafb" stroke="none"/>
  <circle cx="72" cy="18" r="1" fill="#fbbf24" stroke="none"/>
  <circle cx="28" cy="82" r="0.8" fill="#f9fafb" stroke="none"/>
  <circle cx="80" cy="72" r="1" fill="#fbbf24" stroke="none"/>
  <circle cx="62" cy="86" r="0.8" fill="#f9fafb" stroke="none"/>

  <!-- Maze path (space corridor) -->
  <path d="M18,20 L18,40 L36,40 L36,24 L54,24 L54,50 L28,50 L28,68 L60,68 L60,50 L72,50 L72,80"
        fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

  <!-- Dead ends -->
  <path d="M36,40 L36,56" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" opacity="0.15"/>
  <path d="M72,50 L72,30" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" opacity="0.15"/>

  <!-- START (rocket ship) -->
  <circle cx="18" cy="20" r="4" fill="#22c55e" stroke="#374151" stroke-width="0.8"/>

  <!-- FINISH (planet) -->
  <circle cx="72" cy="80" r="5" fill="#f59e0b" stroke="#374151" stroke-width="0.8"/>
  <ellipse cx="72" cy="80" rx="7" ry="2" fill="none" stroke="#d97706" stroke-width="0.8"/>

  <!-- Paper clip character at mid-point -->
  <circle cx="42" cy="40" r="3" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
  <path d="M42,37 L42,32 L48,34 L42,36" fill="#ef4444" stroke="none"/>

  <!-- Dotted trail showing path taken -->
  <path d="M18,20 L18,36" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Timer -->
  <circle cx="102" cy="22" r="12" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <line x1="102" y1="22" x2="102" y2="14" stroke="#ef4444" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="102" y1="22" x2="108" y2="26" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <circle cx="102" cy="22" r="1.2" fill="#374151" stroke="none"/>
  <rect x="100" y="8" width="4" height="3" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>

  <!-- Trophy -->
  <path d="M98,56 L98,50 L106,50 L106,56 Q102,62 102,64" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="98" y="48" width="8" height="4" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
  <!-- Trophy handles -->
  <path d="M98,52 Q94,52 94,56 Q94,58 98,58" fill="none" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
  <path d="M106,52 Q110,52 110,56 Q110,58 106,58" fill="none" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
  <!-- Base -->
  <rect x="99" y="64" width="6" height="2" rx="0.5" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
</svg>