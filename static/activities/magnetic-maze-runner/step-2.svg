<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Side view: paper on thin card, magnet underneath -->
  <!-- Cardboard base -->
  <rect x="14" y="56" width="92" height="4" rx="1" fill="#d97706" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper with maze on top -->
  <rect x="14" y="50" width="92" height="6" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <!-- Maze walls visible on paper -->
  <rect x="24" y="50" width="3" height="6" fill="#e5e7eb" stroke="none"/>
  <rect x="38" y="50" width="3" height="6" fill="#e5e7eb" stroke="none"/>
  <rect x="52" y="50" width="3" height="6" fill="#e5e7eb" stroke="none"/>
  <rect x="70" y="50" width="3" height="6" fill="#e5e7eb" stroke="none"/>
  <rect x="84" y="50" width="3" height="6" fill="#e5e7eb" stroke="none"/>

  <!-- Paper clip character on top (at position along maze) -->
  <path d="M58,50 L58,34 Q58,30 62,30 Q66,30 66,34 L66,42 Q66,44 64,44 Q62,44 62,42 L62,36"
        fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <!-- Flag -->
  <path d="M62,30 L62,22 L72,26 L62,28" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>

  <!-- Magnet underneath (horseshoe shape) -->
  <path d="M54,66 L54,78 Q54,86 60,86 Q66,86 66,78 L66,66" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <!-- Magnet poles -->
  <rect x="50" y="62" width="8" height="6" rx="1" fill="#ef4444" stroke="#374151" stroke-width="1"/>
  <rect x="62" y="62" width="8" height="6" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="1"/>

  <!-- Magnetic field lines (invisible force) -->
  <path d="M56,62 Q56,58 58,56" fill="none" stroke="#c4b5fd" stroke-width="0.8" stroke-dasharray="2,2"/>
  <path d="M64,62 Q64,58 62,56" fill="none" stroke="#c4b5fd" stroke-width="0.8" stroke-dasharray="2,2"/>
  <path d="M60,62 Q60,58 60,56" fill="none" stroke="#c4b5fd" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Arrow showing movement direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M74,74 Q80,74 86,74" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Clip follows on top -->
  <path d="M70,42 Q76,42 82,42" fill="none" stroke="#374151" stroke-width="1" marker-end="url(#arr)" stroke-dasharray="2,2"/>

  <!-- Hand holding magnet (simplified) -->
  <path d="M50,90 Q54,86 56,84" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M70,90 Q66,86 64,84" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>