<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper sheet with maze being drawn (hero) -->
  <rect x="12" y="10" width="82" height="82" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>

  <!-- Maze walls (coloured areas) -->
  <rect x="12" y="10" width="82" height="8" fill="#e5e7eb" stroke="none"/>
  <rect x="12" y="10" width="8" height="82" fill="#e5e7eb" stroke="none"/>
  <rect x="86" y="10" width="8" height="82" fill="#e5e7eb" stroke="none"/>
  <rect x="12" y="84" width="82" height="8" fill="#e5e7eb" stroke="none"/>

  <!-- Internal walls -->
  <rect x="28" y="10" width="6" height="32" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
  <rect x="48" y="30" width="6" height="36" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
  <rect x="28" y="52" width="26" height="6" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
  <rect x="66" y="18" width="6" height="30" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
  <rect x="66" y="60" width="6" height="24" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
  <rect x="28" y="72" width="32" height="6" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>

  <!-- START circle -->
  <circle cx="20" cy="24" r="5" fill="#22c55e" stroke="#374151" stroke-width="1"/>

  <!-- FINISH circle -->
  <circle cx="80" cy="78" r="5" fill="#ef4444" stroke="#374151" stroke-width="1"/>

  <!-- Marker pen drawing -->
  <line x1="106" y1="30" x2="96" y2="50" stroke="#374151" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="93.5" y="50" width="5" height="5" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="0.6"/>
</svg>