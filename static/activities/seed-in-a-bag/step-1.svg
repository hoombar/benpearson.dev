<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Zip-lock bag (hero — open top) -->
  <!-- Bag body -->
  <rect x="46" y="48" width="56" height="64" rx="3"
        fill="#dbeafe" stroke="#374151" stroke-width="2.5"/>
  <!-- Bag zip track top -->
  <rect x="44" y="42" width="60" height="8" rx="2"
        fill="#93c5fd" stroke="#374151" stroke-width="2"/>
  <!-- Open top flap hint (slight overhang left side) -->
  <path d="M44,42 L42,34 L48,34 L48,42"
        fill="#bfdbfe" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Cotton wool pad inside bag at bottom -->
  <!-- Fluffy dome shapes -->
  <path d="M52,96 Q55,86 62,88 Q66,82 74,86 Q80,82 86,88 Q92,86 96,94 Q96,108 52,108 Z"
        fill="#f9fafb" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Inner texture lines on cotton -->
  <path d="M58,98 Q66,94 74,98" fill="none" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <path d="M68,102 Q76,98 84,102" fill="none" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>

  <!-- Arrow from cotton wool on left into bag -->
  <line x1="32" y1="64" x2="44" y2="82"
        stroke="#374151" stroke-width="1.8" stroke-linecap="round"
        marker-end="url(#arr)"/>

  <!-- Cotton wool ball (source, left side) -->
  <!-- Fluffy cloud shape -->
  <path d="M8,54 Q10,46 18,48 Q20,40 28,44 Q36,40 36,50 Q42,52 40,60 Q38,66 8,64 Q6,60 8,54 Z"
        fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Water drops being squeezed out -->
  <line x1="14" y1="66" x2="14" y2="78"
        stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="3,3" stroke-linecap="round"/>
  <line x1="22" y1="68" x2="22" y2="80"
        stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="3,3" stroke-linecap="round"/>
  <line x1="30" y1="66" x2="30" y2="78"
        stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="3,3" stroke-linecap="round"/>
  <!-- Water droplets at bottom of drips -->
  <path d="M14,79 Q13,82 14,84 Q15,82 14,79 Z" fill="#3b82f6"/>
  <path d="M22,81 Q21,84 22,86 Q23,84 22,81 Z" fill="#3b82f6"/>
  <path d="M30,79 Q29,82 30,84 Q31,82 30,79 Z" fill="#3b82f6"/>

  <!-- "Moist not dripping" indicator — squeeze arc above cotton -->
  <path d="M16,48 Q24,40 32,48"
        fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"
        stroke-dasharray="3,2"/>
</svg>
