<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Bag (hero, centre) showing sprouted seed -->
  <!-- Bag body -->
  <rect x="34" y="22" width="52" height="76" rx="3"
        fill="#dbeafe" stroke="#374151" stroke-width="2.5"/>
  <!-- Zip track sealed -->
  <rect x="32" y="16" width="56" height="8" rx="2"
        fill="#93c5fd" stroke="#374151" stroke-width="2"/>

  <!-- Cotton wool pad at bottom -->
  <path d="M38,78 Q42,72 50,74 Q56,68 66,72 Q72,68 80,72 Q84,76 86,98 L34,98 Z"
        fill="#f9fafb" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Bean seed in bag centre -->
  <ellipse cx="60" cy="58" rx="9" ry="6" fill="#d97706" stroke="#374151" stroke-width="2"
           transform="rotate(-5 60 58)"/>
  <!-- Seed coat crease -->
  <path d="M53,56 Q60,52 67,56" fill="none" stroke="#92400e" stroke-width="1" stroke-linecap="round"/>

  <!-- Root going DOWN from seed into cotton wool -->
  <path d="M60,64 Q58,68 60,74 Q62,78 60,82"
        fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <!-- Root tip -->
  <ellipse cx="60" cy="83" rx="2" ry="3" fill="#16a34a" stroke="#374151" stroke-width="1"/>
  <!-- Root hair fuzz -->
  <line x1="58" y1="70" x2="54" y2="73" stroke="#86efac" stroke-width="1" stroke-linecap="round"/>
  <line x1="62" y1="72" x2="66" y2="75" stroke="#86efac" stroke-width="1" stroke-linecap="round"/>
  <line x1="59" y1="76" x2="55" y2="79" stroke="#86efac" stroke-width="1" stroke-linecap="round"/>

  <!-- Shoot going UP from seed -->
  <path d="M60,52 Q58,44 60,36 Q62,30 60,22"
        fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Two small leaves at shoot tip -->
  <ellipse cx="54" cy="24" rx="7" ry="4" fill="#86efac" stroke="#374151" stroke-width="1.5"
           transform="rotate(-30 54 24)"/>
  <ellipse cx="66" cy="22" rx="7" ry="4" fill="#22c55e" stroke="#374151" stroke-width="1.5"
           transform="rotate(20 66 22)"/>

  <!-- Ruler along left edge of scene -->
  <rect x="8" y="16" width="8" height="88" rx="2"
        fill="#fef9c3" stroke="#374151" stroke-width="1.5"/>
  <!-- Ruler ticks -->
  <line x1="10" y1="26" x2="14" y2="26" stroke="#374151" stroke-width="1"/>
  <line x1="10" y1="36" x2="16" y2="36" stroke="#374151" stroke-width="1.2"/>
  <line x1="10" y1="46" x2="14" y2="46" stroke="#374151" stroke-width="1"/>
  <line x1="10" y1="56" x2="16" y2="56" stroke="#374151" stroke-width="1.2"/>
  <line x1="10" y1="66" x2="14" y2="66" stroke="#374151" stroke-width="1"/>
  <line x1="10" y1="76" x2="16" y2="76" stroke="#374151" stroke-width="1.2"/>
  <line x1="10" y1="86" x2="14" y2="86" stroke="#374151" stroke-width="1"/>
  <line x1="10" y1="96" x2="16" y2="96" stroke="#374151" stroke-width="1.2"/>

  <!-- Magnifying glass (right side) -->
  <circle cx="100" cy="48" r="14"
          fill="none" stroke="#374151" stroke-width="2.5"/>
  <line x1="110" y1="58" x2="116" y2="68"
        stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <!-- Tiny root detail visible through glass -->
  <circle cx="100" cy="48" r="12" fill="#dbeafe" opacity="0.4"/>
  <path d="M100,44 Q99,47 100,50" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="99" y1="47" x2="97" y2="49" stroke="#86efac" stroke-width="1" stroke-linecap="round"/>
  <line x1="101" y1="48" x2="103" y2="50" stroke="#86efac" stroke-width="1" stroke-linecap="round"/>
</svg>
