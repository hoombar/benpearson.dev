<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Bag body (hero) -->
  <rect x="28" y="30" width="64" height="82" rx="3"
        fill="#dbeafe" stroke="#374151" stroke-width="2.5"/>
  <!-- Zip track (sealed) -->
  <rect x="26" y="24" width="68" height="8" rx="2"
        fill="#93c5fd" stroke="#374151" stroke-width="2"/>
  <!-- Zip seal indicator — two close parallel lines -->
  <line x1="30" y1="24" x2="90" y2="24"
        stroke="#3b82f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="30" y1="30" x2="90" y2="30"
        stroke="#3b82f6" stroke-width="1" stroke-linecap="round"/>

  <!-- Cotton wool pad at bottom of bag -->
  <path d="M34,90 Q37,82 46,84 Q52,78 62,82 Q68,76 76,80 Q84,76 90,84 Q92,90 92,112 L28,112 Z"
        fill="#f9fafb" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Texture -->
  <path d="M38,96 Q50,92 62,96" fill="none" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <path d="M54,102 Q66,98 78,102" fill="none" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>

  <!-- Air bubble (small oval near top of sealed bag) -->
  <ellipse cx="78" cy="42" rx="6" ry="4"
           fill="none" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- Bean seed pressed against front face of bag, midway up -->
  <ellipse cx="52" cy="62" rx="10" ry="7" fill="#d97706" stroke="#374151" stroke-width="2"
           transform="rotate(-15 52 62)"/>
  <!-- Seed coat crease line -->
  <path d="M45,59 Q52,55 59,59" fill="none" stroke="#92400e" stroke-width="1" stroke-linecap="round"/>

  <!-- Arrow from seed held outside left → into bag position -->
  <line x1="14" y1="52" x2="39" y2="60"
        stroke="#374151" stroke-width="1.8" stroke-linecap="round"
        marker-end="url(#arr)"/>

  <!-- Seed held to left (being placed) -->
  <ellipse cx="10" cy="48" rx="10" ry="7" fill="#f59e0b" stroke="#374151" stroke-width="2"
           transform="rotate(-10 10 48)"/>
  <path d="M3,45 Q10,41 17,45" fill="none" stroke="#b45309" stroke-width="1" stroke-linecap="round"/>

  <!-- "Seal" indication — small checkmark on zip -->
  <path d="M82,26 L86,30 L94,22"
        fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
