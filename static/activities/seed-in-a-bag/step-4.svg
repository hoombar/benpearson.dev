<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Open notebook (hero, right side) -->
  <!-- Cover/spine -->
  <rect x="56" y="18" width="58" height="82" rx="3"
        fill="#dbeafe" stroke="#374151" stroke-width="2.5"/>
  <!-- Spine binding line -->
  <line x1="60" y1="18" x2="60" y2="100"
        stroke="#374151" stroke-width="2"/>
  <!-- Left page -->
  <rect x="14" y="18" width="46" height="82" rx="3"
        fill="#f9fafb" stroke="#374151" stroke-width="2.5"/>
  <!-- Page lines on left -->
  <line x1="20" y1="32" x2="54" y2="32" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="40" x2="54" y2="40" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="48" x2="54" y2="48" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="56" x2="54" y2="56" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="64" x2="54" y2="64" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <!-- Sketch of bean seed on left page -->
  <ellipse cx="37" cy="80" rx="10" ry="7" fill="#fde68a" stroke="#374151" stroke-width="1.5"
           transform="rotate(-15 37 80)"/>
  <path d="M30,77 Q37,73 44,77" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- "Day 1" text lines (represented as ruled lines with a short mark at start) -->
  <rect x="20" y="28" width="8" height="2" rx="1" fill="#374151"/>
  <rect x="20" y="36" width="20" height="2" rx="1" fill="#374151"/>
  <rect x="20" y="44" width="14" height="2" rx="1" fill="#374151"/>

  <!-- Right page lines -->
  <line x1="66" y1="32" x2="108" y2="32" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <line x1="66" y1="40" x2="108" y2="40" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <line x1="66" y1="48" x2="108" y2="48" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
  <line x1="66" y1="56" x2="108" y2="56" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>

  <!-- Marker pen writing on bag label (upper-left) -->
  <!-- Bag label rectangle -->
  <rect x="4" y="10" width="36" height="20" rx="2"
        fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <!-- Label lines (date placeholder) -->
  <rect x="8" y="14" width="16" height="2" rx="1" fill="#374151"/>
  <rect x="8" y="20" width="22" height="2" rx="1" fill="#374151"/>
  <!-- Marker pen drawing on label -->
  <!-- Shaft (green marker) -->
  <line x1="36" y1="8" x2="20" y2="20"
        stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <!-- Cap end -->
  <circle cx="38" cy="6" r="3" fill="#16a34a" stroke="#374151" stroke-width="1"/>
  <!-- Tip -->
  <path d="M16,22 L13,27 L19,24 Z" fill="#374151"/>

  <!-- Arrow from marker toward notebook -->
  <path d="M50,36 Q54,28 62,26"
        fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"
        marker-end="url(#arr)"/>
</svg>
