<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Window frame (background surface) -->
  <!-- Outer frame -->
  <rect x="8" y="8" width="104" height="104" rx="4"
        fill="#e5e7eb" stroke="#374151" stroke-width="2.5"/>
  <!-- Glass pane (inner) with sky colour -->
  <rect x="18" y="18" width="84" height="84" rx="2"
        fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <!-- Window cross divider -->
  <line x1="60" y1="18" x2="60" y2="102"
        stroke="#374151" stroke-width="2"/>
  <line x1="18" y1="60" x2="102" y2="60"
        stroke="#374151" stroke-width="2"/>

  <!-- Sun rays in upper-right quadrant (outside) -->
  <circle cx="88" cy="34" r="7"
          fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Sun rays -->
  <line x1="88" y1="22" x2="88" y2="18" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="98" y1="26" x2="101" y2="23" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="102" y1="34" x2="106" y2="34" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="98" y1="42" x2="101" y2="45" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="26" x2="75" y2="23" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bag taped to lower-left quadrant of window -->
  <!-- Bag outline -->
  <rect x="24" y="64" width="30" height="30" rx="2"
        fill="#bfdbfe" stroke="#374151" stroke-width="2"/>
  <!-- Zip track -->
  <rect x="23" y="60" width="32" height="6" rx="1.5"
        fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
  <!-- Cotton wool at bag bottom -->
  <path d="M26,82 Q28,78 32,79 Q36,75 40,78 Q44,75 48,79 Q51,82 52,94 L24,94 Z"
        fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <!-- Bean seed visible in bag -->
  <ellipse cx="37" cy="72" rx="6" ry="4" fill="#d97706" stroke="#374151" stroke-width="1.5"
           transform="rotate(-10 37 72)"/>

  <!-- Tape strips (4 corners of bag) — pale yellow rectangles -->
  <!-- Top-left tape -->
  <rect x="20" y="58" width="10" height="5" rx="1"
        fill="#fef9c3" stroke="#374151" stroke-width="1"/>
  <!-- Top-right tape -->
  <rect x="43" y="58" width="10" height="5" rx="1"
        fill="#fef9c3" stroke="#374151" stroke-width="1"/>
  <!-- Bottom-left tape -->
  <rect x="20" y="91" width="10" height="5" rx="1"
        fill="#fef9c3" stroke="#374151" stroke-width="1"/>
  <!-- Bottom-right tape -->
  <rect x="43" y="91" width="10" height="5" rx="1"
        fill="#fef9c3" stroke="#374151" stroke-width="1"/>
</svg>
