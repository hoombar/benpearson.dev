<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate being painted grey (hero) -->
  <ellipse cx="50" cy="50" rx="36" ry="34" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
  <!-- Plate rim ring -->
  <ellipse cx="50" cy="50" rx="26" ry="24" fill="none" stroke="#6b7280" stroke-width="0.6" opacity="0.4"/>
  <!-- Wet paint shine -->
  <path d="M36,38 Q44,34 54,40" fill="none" stroke="#d1d5db" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M40,56 Q50,52 58,56" fill="none" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>

  <!-- Paintbrush -->
  <g transform="translate(70, 24) rotate(30)">
    <rect x="0" y="-3" width="28" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pots -->
  <g transform="translate(92, 52)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
    <rect x="2" y="3" width="12" height="11" rx="1" fill="white"/>
  </g>
  <g transform="translate(92, 70)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
    <rect x="2" y="3" width="12" height="11" rx="1" fill="#374151"/>
  </g>

  <!-- Mixing arrow between pots -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M110,62 Q114,66 110,70" fill="none" stroke="#374151" stroke-width="0.6" stroke-dasharray="2,1" marker-end="url(#arr)"/>
</svg>
