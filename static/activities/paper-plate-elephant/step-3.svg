<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Left ear -->
  <path d="M14,28 Q4,46 14,64 Q22,64 26,46 Q22,28 14,28 Z" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
  <!-- Inner ear pink -->
  <path d="M16,34 Q10,46 16,58 Q20,58 22,46 Q20,34 16,34 Z" fill="#f9a8d4" stroke="none" opacity="0.5"/>

  <!-- Right ear -->
  <path d="M82,28 Q92,46 82,64 Q74,64 70,46 Q74,28 82,28 Z" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
  <!-- Inner ear pink -->
  <path d="M80,34 Q86,46 80,58 Q76,58 74,46 Q76,34 80,34 Z" fill="#f9a8d4" stroke="none" opacity="0.5"/>

  <!-- Grey plate head (hero) -->
  <ellipse cx="48" cy="42" rx="30" ry="28" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>

  <!-- Googly eyes -->
  <circle cx="36" cy="34" r="5" fill="white" stroke="#374151" stroke-width="0.8"/>
  <circle cx="37" cy="35" r="2.5" fill="#374151"/>
  <circle cx="58" cy="34" r="5" fill="white" stroke="#374151" stroke-width="0.8"/>
  <circle cx="59" cy="35" r="2.5" fill="#374151"/>

  <!-- Trunk -->
  <path d="M44,68 Q40,78 42,86 Q44,90 48,86 Q50,78 48,68" fill="#9ca3af" stroke="#374151" stroke-width="1.2"/>
  <path d="M44,86 Q40,92 44,96" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>

  <!-- Smile drawn with marker -->
  <path d="M38,56 Q48,62 56,56" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Small tusks -->
  <path d="M38,60 Q36,66 38,68" fill="none" stroke="#f5f5f4" stroke-width="2" stroke-linecap="round"/>
  <path d="M56,60 Q58,66 56,68" fill="none" stroke="#f5f5f4" stroke-width="2" stroke-linecap="round"/>

  <!-- Marker -->
  <g transform="translate(92, 52) rotate(10)">
    <rect x="0" y="-2.5" width="20" height="5" rx="2" fill="#374151" stroke="#374151" stroke-width="0.6"/>
    <rect x="-3" y="-3" width="4" height="6" rx="1" fill="#374151"/>
  </g>
</svg>
