<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Paper sheet (back/blank side) -->
  <rect x="14" y="10" width="92" height="100" rx="3" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <!-- 4x4 grid lines on the back -->
  <line x1="37" y1="10" x2="37" y2="110" stroke="#374151" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="60" y1="10" x2="60" y2="110" stroke="#374151" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="83" y1="10" x2="83" y2="110" stroke="#374151" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="14" y1="35" x2="106" y2="35" stroke="#374151" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="14" y1="60" x2="106" y2="60" stroke="#374151" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="14" y1="85" x2="106" y2="85" stroke="#374151" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Jigsaw bump/tab on a horizontal line (highlight one tab being drawn) -->
  <!-- Bump on line between row1 and row2 at col2 -->
  <path d="M37 35 Q48.5 28 60 35" stroke="#374151" stroke-width="1.5" fill="#dbeafe" fill-opacity="0.5"/>
  <!-- Bump on vertical line at row2 -->
  <path d="M60 60 Q67 71.5 60 83" stroke="#374151" stroke-width="1.5" fill="#dbeafe" fill-opacity="0.5"/>
  <!-- Ruler tool -->
  <rect x="6" y="96" width="108" height="12" rx="2" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <line x1="18" y1="96" x2="18" y2="102" stroke="#374151" stroke-width="1"/>
  <line x1="28" y1="96" x2="28" y2="102" stroke="#374151" stroke-width="1"/>
  <line x1="38" y1="96" x2="38" y2="102" stroke="#374151" stroke-width="1"/>
  <line x1="48" y1="96" x2="48" y2="102" stroke="#374151" stroke-width="1"/>
  <line x1="58" y1="96" x2="58" y2="102" stroke="#374151" stroke-width="1"/>
  <line x1="68" y1="96" x2="68" y2="102" stroke="#374151" stroke-width="1"/>
  <line x1="78" y1="96" x2="78" y2="102" stroke="#374151" stroke-width="1"/>
  <line x1="88" y1="96" x2="88" y2="102" stroke="#374151" stroke-width="1"/>
  <line x1="98" y1="96" x2="98" y2="102" stroke="#374151" stroke-width="1"/>
</svg>
