<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Complete caterpillar with face (hero, curved pose) -->
  <g transform="translate(6, 32)">
    <!-- Head segment (large) -->
    <ellipse cx="16" cy="16" rx="16" ry="16" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>

    <!-- Googly eyes -->
    <circle cx="10" cy="10" r="5" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="10" cy="11" r="2.5" fill="#374151"/>
    <circle cx="22" cy="10" r="5" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="22" cy="11" r="2.5" fill="#374151"/>

    <!-- Happy smile -->
    <path d="M10,22 Q16,28 22,22" fill="none" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Rosy cheeks -->
    <circle cx="6" cy="18" r="2.5" fill="#fca5a5" stroke="none" opacity="0.5"/>
    <circle cx="26" cy="18" r="2.5" fill="#fca5a5" stroke="none" opacity="0.5"/>

    <!-- Antennae -->
    <line x1="10" y1="2" x2="4" y2="-10" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="4" cy="-10" r="2" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <line x1="22" y1="2" x2="28" y2="-10" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="28" cy="-10" r="2" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>

    <!-- Rubber band -->
    <ellipse cx="32" cy="16" rx="2" ry="11" fill="none" stroke="#3b82f6" stroke-width="2"/>

    <!-- Segment 2 -->
    <ellipse cx="44" cy="16" rx="10" ry="12" fill="#ef4444" stroke="#374151" stroke-width="1.3"/>
    <!-- Spots on segment -->
    <circle cx="40" cy="12" r="2" fill="#fbbf24" stroke="none" opacity="0.6"/>
    <circle cx="48" cy="18" r="2" fill="#fbbf24" stroke="none" opacity="0.6"/>
    <ellipse cx="54" cy="16" rx="2" ry="9" fill="none" stroke="#3b82f6" stroke-width="2"/>

    <!-- Segment 3 -->
    <ellipse cx="64" cy="16" rx="8" ry="11" fill="#ef4444" stroke="#374151" stroke-width="1.3"/>
    <circle cx="62" cy="12" r="2" fill="#fbbf24" stroke="none" opacity="0.6"/>
    <circle cx="66" cy="20" r="2" fill="#fbbf24" stroke="none" opacity="0.6"/>
    <ellipse cx="72" cy="16" rx="2" ry="9" fill="none" stroke="#3b82f6" stroke-width="2"/>

    <!-- Segment 4 -->
    <ellipse cx="80" cy="16" rx="8" ry="10" fill="#ef4444" stroke="#374151" stroke-width="1.3"/>
    <circle cx="78" cy="14" r="2" fill="#fbbf24" stroke="none" opacity="0.6"/>
    <ellipse cx="88" cy="16" rx="2" ry="8" fill="none" stroke="#3b82f6" stroke-width="2"/>

    <!-- Segment 5 (tail) -->
    <ellipse cx="96" cy="16" rx="7" ry="9" fill="#ef4444" stroke="#374151" stroke-width="1.3"/>
    <circle cx="103" cy="16" r="3.5" fill="#dc2626" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Marker nearby -->
  <g transform="translate(92, 66)">
    <rect x="0" y="0" width="7" height="24" rx="2" fill="#374151" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="20" width="7" height="4" rx="1" fill="#1f2937" stroke="#374151" stroke-width="0.4"/>
    <polygon points="2,24 5,24 3.5,28" fill="#374151"/>
  </g>

  <!-- Googly eyes packet -->
  <g transform="translate(68, 74)">
    <rect x="0" y="0" width="18" height="14" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
    <circle cx="5" cy="5" r="3" fill="white" stroke="#374151" stroke-width="0.4"/>
    <circle cx="5" cy="5.5" r="1.5" fill="#374151"/>
    <circle cx="13" cy="5" r="3" fill="white" stroke="#374151" stroke-width="0.4"/>
    <circle cx="13" cy="5.5" r="1.5" fill="#374151"/>
  </g>
</svg>
