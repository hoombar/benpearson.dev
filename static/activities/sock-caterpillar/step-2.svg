<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Caterpillar with head being shaped (hero, curved pose) -->
  <g transform="translate(10, 30)">
    <!-- Head segment (larger, at toe end) -->
    <ellipse cx="14" cy="16" rx="14" ry="16" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Rubber band -->
    <ellipse cx="28" cy="16" rx="2" ry="11" fill="none" stroke="#3b82f6" stroke-width="2"/>

    <!-- Segment 2 -->
    <ellipse cx="40" cy="16" rx="10" ry="12" fill="#ef4444" stroke="#374151" stroke-width="1.3"/>
    <ellipse cx="50" cy="16" rx="2" ry="9" fill="none" stroke="#3b82f6" stroke-width="2"/>

    <!-- Segment 3 -->
    <ellipse cx="60" cy="16" rx="8" ry="11" fill="#ef4444" stroke="#374151" stroke-width="1.3"/>
    <ellipse cx="68" cy="16" rx="2" ry="9" fill="none" stroke="#3b82f6" stroke-width="2"/>

    <!-- Segment 4 -->
    <ellipse cx="76" cy="16" rx="8" ry="10" fill="#ef4444" stroke="#374151" stroke-width="1.3"/>
    <ellipse cx="84" cy="16" rx="2" ry="8" fill="none" stroke="#3b82f6" stroke-width="2"/>

    <!-- Segment 5 (tail, smaller) -->
    <ellipse cx="92" cy="16" rx="7" ry="9" fill="#ef4444" stroke="#374151" stroke-width="1.3"/>
    <circle cx="99" cy="16" r="3.5" fill="#dc2626" stroke="#374151" stroke-width="0.8"/>

    <!-- Stripes -->
    <line x1="36" y1="10" x2="36" y2="22" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
    <line x1="56" y1="10" x2="56" y2="22" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
    <line x1="72" y1="10" x2="72" y2="22" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Hands squeezing/shaping the head -->
  <g transform="translate(2, 22)">
    <rect x="0" y="0" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g transform="translate(30, 22)">
    <rect x="0" y="0" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrows showing shaping motion -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M10,24 Q14,30 16,34" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
  <path d="M34,24 Q30,30 28,34" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Size comparison labels (no text, use size indicators) -->
  <!-- Double-headed arrow showing head is bigger -->
  <line x1="12" y1="60" x2="38" y2="60" stroke="#374151" stroke-width="0.8" marker-end="url(#arr)"/>
  <line x1="38" y1="60" x2="12" y2="60" stroke="#374151" stroke-width="0.8" marker-end="url(#arr)"/>

  <!-- Single arrow for smaller segment -->
  <line x1="56" y1="60" x2="72" y2="60" stroke="#374151" stroke-width="0.8" marker-end="url(#arr)"/>
  <line x1="72" y1="60" x2="56" y2="60" stroke="#374151" stroke-width="0.8" marker-end="url(#arr)"/>

  <!-- Dotted lines from arrows to segments -->
  <line x1="24" y1="52" x2="24" y2="58" stroke="#374151" stroke-width="0.5" stroke-dasharray="1,1"/>
  <line x1="64" y1="52" x2="64" y2="58" stroke="#374151" stroke-width="0.5" stroke-dasharray="1,1"/>
</svg>
