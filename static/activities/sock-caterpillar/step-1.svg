<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Stuffed sock with rubber bands creating segments (hero) -->
  <g transform="translate(8, 34)">
    <!-- Segment 1 (toe/head end) -->
    <ellipse cx="12" cy="14" rx="12" ry="14" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Rubber band between 1-2 -->
    <ellipse cx="24" cy="14" rx="2" ry="10" fill="none" stroke="#3b82f6" stroke-width="2"/>

    <!-- Segment 2 -->
    <ellipse cx="36" cy="14" rx="10" ry="12" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Rubber band between 2-3 -->
    <ellipse cx="46" cy="14" rx="2" ry="9" fill="none" stroke="#3b82f6" stroke-width="2"/>

    <!-- Segment 3 -->
    <ellipse cx="56" cy="14" rx="8" ry="11" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Rubber band between 3-4 -->
    <ellipse cx="64" cy="14" rx="2" ry="9" fill="none" stroke="#3b82f6" stroke-width="2"/>

    <!-- Segment 4 -->
    <ellipse cx="72" cy="14" rx="8" ry="11" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Rubber band between 4-5 -->
    <ellipse cx="80" cy="14" rx="2" ry="8" fill="none" stroke="#3b82f6" stroke-width="2"/>

    <!-- Segment 5 (tail) -->
    <ellipse cx="88" cy="14" rx="8" ry="10" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Knot at end -->
    <circle cx="96" cy="14" r="4" fill="#dc2626" stroke="#374151" stroke-width="1"/>

    <!-- Stripe details on segments -->
    <line x1="32" y1="8" x2="32" y2="20" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
    <line x1="52" y1="8" x2="52" y2="20" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
    <line x1="68" y1="8" x2="68" y2="20" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
    <line x1="84" y1="8" x2="84" y2="18" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Hand stretching rubber band onto sock -->
  <g transform="translate(52, 62)">
    <rect x="0" y="0" width="12" height="22" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="20" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrow showing rubber band being wrapped -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <path d="M58,62 Q56,56 54,52" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Spare rubber bands -->
  <ellipse cx="20" cy="80" rx="10" ry="5" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <ellipse cx="20" cy="88" rx="10" ry="5" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
</svg>
