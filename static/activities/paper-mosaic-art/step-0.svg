<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Sheet of paper (hero) with simple sun design being sketched -->
  <rect x="14" y="12" width="82" height="96" rx="2" stroke="#374151" stroke-width="2" fill="white"/>
  <!-- Sketched sun outline on paper (light pencil lines) -->
  <circle cx="55" cy="64" r="22" stroke="#374151" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
  <!-- Sun rays (sketch lines) -->
  <line x1="55" y1="36" x2="55" y2="30" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2"/>
  <line x1="55" y1="92" x2="55" y2="98" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2"/>
  <line x1="27" y1="64" x2="22" y2="64" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2"/>
  <line x1="83" y1="64" x2="88" y2="64" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2"/>
  <line x1="35" y1="44" x2="30" y2="39" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2"/>
  <line x1="75" y1="44" x2="80" y2="39" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2"/>
  <line x1="35" y1="84" x2="30" y2="89" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2"/>
  <line x1="75" y1="84" x2="80" y2="89" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,2"/>
  <!-- Colouring pencil drawing on the paper (angled, tip pointing down toward paper) -->
  <g transform="translate(82, 24) rotate(40)">
    <rect x="-3" y="-28" width="6" height="22" rx="1" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
    <rect x="-3" y="-6" width="6" height="4" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
    <path d="M-3 -2 L0 6 L3 -2 Z" stroke="#374151" stroke-width="1.5" fill="#f59e0b" stroke-linecap="round"/>
  </g>
  <!-- Area label zones (light fill sections showing colour zones) -->
  <path d="M55 42 A22 22 0 0 1 77 64 L55 64 Z" fill="#fde68a" fill-opacity="0.3"/>
  <path d="M33 64 A22 22 0 0 1 55 42 L55 64 Z" fill="#fde68a" fill-opacity="0.3"/>
  <circle cx="55" cy="64" r="10" stroke="#374151" stroke-width="1" fill="#f9fafb" stroke-dasharray="3,2"/>
</svg>
