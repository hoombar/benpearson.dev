<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Paper with partial mosaic design — tiles being placed -->
  <rect x="10" y="10" width="78" height="96" rx="2" stroke="#374151" stroke-width="2" fill="white"/>
  <!-- Glue-applied area (light blue wash on top half of paper) -->
  <rect x="11" y="11" width="76" height="44" rx="2" stroke="none" fill="#dbeafe" fill-opacity="0.4"/>
  <!-- Completed mosaic tiles in the glued area (top section) -->
  <rect x="14" y="14" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#ef4444"/>
  <rect x="24" y="14" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#f97316"/>
  <rect x="34" y="14" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#f59e0b"/>
  <rect x="44" y="14" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#22c55e"/>
  <rect x="54" y="14" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#3b82f6"/>
  <rect x="64" y="14" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#a78bfa"/>
  <rect x="74" y="14" width="12" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#ef4444"/>
  <rect x="14" y="24" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#f59e0b"/>
  <rect x="24" y="24" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#22c55e"/>
  <rect x="34" y="24" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#3b82f6"/>
  <rect x="44" y="24" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#a78bfa"/>
  <rect x="54" y="24" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#ef4444"/>
  <rect x="64" y="24" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#f97316"/>
  <rect x="74" y="24" width="12" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#f59e0b"/>
  <rect x="14" y="34" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#22c55e"/>
  <rect x="24" y="34" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#3b82f6"/>
  <rect x="34" y="34" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#f59e0b"/>
  <rect x="44" y="34" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#ef4444"/>
  <!-- Partial row with gaps (tiles being actively placed) -->
  <rect x="14" y="44" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#a78bfa"/>
  <rect x="24" y="44" width="8" height="8" rx="1" stroke="#374151" stroke-width="1" fill="#3b82f6"/>
  <!-- Gap where next tile is being placed -->
  <!-- Tile being placed (floating above) -->
  <rect x="35" y="40" width="8" height="8" rx="1" stroke="#374151" stroke-width="1.5" fill="#f97316"/>
  <!-- Arrow showing tile being pressed down -->
  <line x1="39" y1="49" x2="39" y2="53" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Paintbrush applying glue at right edge (angled, tip pointing at paper) -->
  <g transform="translate(96, 55) rotate(-50)">
    <rect x="-3" y="-28" width="6" height="22" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
    <rect x="-3" y="-6" width="6" height="4" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
    <path d="M-3 -2 L0 6 L3 -2 Z" stroke="#374151" stroke-width="1.5" fill="#dbeafe" stroke-linecap="round"/>
  </g>
</svg>
