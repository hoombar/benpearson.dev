<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Zip-lock bag (hero) -->
  <rect x="24" y="20" width="72" height="80" rx="4" fill="#dbeafe" fill-opacity="0.5" stroke="#374151" stroke-width="2"/>
  <!-- Zip seal at top -->
  <rect x="24" y="16" width="72" height="8" rx="2" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
  <rect x="28" y="18" width="64" height="3" rx="1" fill="#60a5fa" stroke="none"/>
  <!-- Coloured pasta pieces inside bag -->
  <ellipse cx="42" cy="50" rx="8" ry="5" fill="#f87171" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="60" cy="42" rx="8" ry="5" fill="#fbbf24" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="78" cy="52" rx="8" ry="5" fill="#4ade80" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="46" cy="66" rx="8" ry="5" fill="#a78bfa" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="66" cy="62" rx="8" ry="5" fill="#60a5fa" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="52" cy="80" rx="8" ry="5" fill="#f87171" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="74" cy="76" rx="8" ry="5" fill="#fbbf24" stroke="#374151" stroke-width="1.2"/>
  <!-- Hole through each pasta tube -->
  <ellipse cx="42" cy="50" rx="3" ry="2" fill="#dbeafe" stroke="#374151" stroke-width="0.8"/>
  <ellipse cx="60" cy="42" rx="3" ry="2" fill="#dbeafe" stroke="#374151" stroke-width="0.8"/>
  <ellipse cx="78" cy="52" rx="3" ry="2" fill="#dbeafe" stroke="#374151" stroke-width="0.8"/>
  <ellipse cx="46" cy="66" rx="3" ry="2" fill="#dbeafe" stroke="#374151" stroke-width="0.8"/>
  <ellipse cx="66" cy="62" rx="3" ry="2" fill="#dbeafe" stroke="#374151" stroke-width="0.8"/>
  <!-- Food colouring drops falling in -->
  <path d="M14 8 Q14 14 10 16 Q6 14 6 8 Q6 2 10 2 Q14 2 14 8 Z" fill="#f87171" stroke="#374151" stroke-width="1"/>
  <line x1="10" y1="18" x2="24" y2="28" stroke="#374151" stroke-width="1" stroke-dasharray="3,2" stroke-linecap="round"/>
  <!-- Shaking motion lines -->
  <line x1="100" y1="20" x2="108" y2="16" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="102" y1="28" x2="112" y2="26" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="100" y1="36" x2="108" y2="38" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>
