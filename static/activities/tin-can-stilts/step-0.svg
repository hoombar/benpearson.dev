<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Tin can 1 (hero) -->
  <g transform="translate(20, 30)">
    <rect x="0" y="0" width="30" height="40" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="15" cy="0" rx="15" ry="5" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="15" cy="40" rx="15" ry="5" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
    <!-- Label stripe -->
    <rect x="0" y="12" width="30" height="16" fill="#3b82f6" stroke="none" opacity="0.3"/>
    <!-- Holes poked near bottom -->
    <circle cx="5" cy="36" r="2" fill="#374151" stroke="none"/>
    <circle cx="25" cy="36" r="2" fill="#374151" stroke="none"/>
  </g>

  <!-- Tin can 2 -->
  <g transform="translate(66, 34)">
    <rect x="0" y="0" width="30" height="40" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="15" cy="0" rx="15" ry="5" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="15" cy="40" rx="15" ry="5" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
    <rect x="0" y="12" width="30" height="16" fill="#3b82f6" stroke="none" opacity="0.3"/>
  </g>

  <!-- Nail and hammer nearby -->
  <g transform="translate(6, 80)">
    <!-- Nail -->
    <line x1="0" y1="0" x2="0" y2="14" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2" fill="#d1d5db" stroke="#374151" stroke-width="0.5"/>
    <polygon points="-0.5,14 0.5,14 0,17" fill="#9ca3af"/>
  </g>

  <!-- Hammer -->
  <g transform="translate(16, 78)">
    <line x1="6" y1="6" x2="6" y2="20" stroke="#d4a574" stroke-width="3" stroke-linecap="round"/>
    <rect x="0" y="0" width="12" height="8" rx="1" fill="#6b7280" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrow showing where to poke holes -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M24,80 Q24,74 24,70" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
  <path d="M46,80 Q46,74 46,70" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Warning triangle (adult needed) -->
  <g transform="translate(100, 80)">
    <polygon points="8,0 0,14 16,14" fill="#fbbf24" stroke="#374151" stroke-width="1"/>
    <line x1="8" y1="4" x2="8" y2="9" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="8" cy="12" r="1" fill="#374151"/>
  </g>
</svg>
