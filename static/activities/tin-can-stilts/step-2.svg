<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Tin can 1 being decorated (hero) -->
  <g transform="translate(14, 28)">
    <rect x="0" y="0" width="36" height="46" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="18" cy="0" rx="18" ry="5" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="18" cy="46" rx="18" ry="5" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
    <!-- Decorations: rainbow stripes -->
    <rect x="2" y="8" width="32" height="6" fill="#ef4444" stroke="none" rx="1"/>
    <rect x="2" y="14" width="32" height="6" fill="#f97316" stroke="none" rx="1"/>
    <rect x="2" y="20" width="32" height="6" fill="#fbbf24" stroke="none" rx="1"/>
    <rect x="2" y="26" width="32" height="6" fill="#22c55e" stroke="none" rx="1"/>
    <rect x="2" y="32" width="32" height="6" fill="#3b82f6" stroke="none" rx="1"/>
    <!-- Star sticker -->
    <polygon points="18,40 20,44 24,44 21,47 22,51 18,48 14,51 15,47 12,44 16,44" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Tin can 2 already decorated -->
  <g transform="translate(66, 36)">
    <rect x="0" y="0" width="32" height="42" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="16" cy="0" rx="16" ry="5" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="16" cy="42" rx="16" ry="5" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
    <!-- Monster feet decoration -->
    <circle cx="8" cy="14" r="5" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
    <circle cx="24" cy="14" r="5" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
    <circle cx="16" cy="26" r="6" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
    <!-- Claws -->
    <polygon points="6,32 8,36 10,32" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
    <polygon points="14,32 16,36 18,32" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
    <polygon points="22,32 24,36 26,32" fill="#22c55e" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Hand with marker drawing on can 1 -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="8" height="24" rx="2" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <rect x="0" y="20" width="8" height="4" rx="1" fill="#b91c1c" stroke="#374151" stroke-width="0.5"/>
    <polygon points="2,24 6,24 4,28" fill="#374151"/>
  </g>
  <g transform="translate(58, 24)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Stickers scattered -->
  <g transform="translate(8, 82)">
    <rect x="0" y="0" width="16" height="12" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="0.5"/>
    <polygon points="8,1 9.5,5 14,5 10.5,7.5 11.5,11.5 8,9 4.5,11.5 5.5,7.5 2,5 6.5,5" fill="#fbbf24" stroke="none"/>
  </g>

  <!-- More markers -->
  <g transform="translate(102, 72)">
    <rect x="0" y="0" width="6" height="22" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="0.5"/>
  </g>
  <g transform="translate(110, 74)">
    <rect x="0" y="0" width="6" height="20" rx="2" fill="#22c55e" stroke="#374151" stroke-width="0.5"/>
  </g>
</svg>
