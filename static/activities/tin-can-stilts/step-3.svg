<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Grass/outdoor ground -->
  <rect x="0" y="86" width="120" height="34" rx="2" fill="#86efac" stroke="#374151" stroke-width="1.5"/>
  <!-- Grass blades -->
  <line x1="10" y1="86" x2="12" y2="80" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>
  <line x1="30" y1="86" x2="28" y2="81" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>
  <line x1="50" y1="86" x2="52" y2="80" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>
  <line x1="80" y1="86" x2="78" y2="81" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>
  <line x1="100" y1="86" x2="102" y2="80" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>

  <!-- Sky -->
  <rect x="0" y="0" width="120" height="86" fill="#e0f2fe"/>

  <!-- Child figure standing on cans (simplified) -->
  <!-- Left can -->
  <g transform="translate(34, 70)">
    <rect x="0" y="0" width="16" height="16" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
    <!-- Rainbow stripe decoration -->
    <rect x="1" y="2" width="14" height="3" fill="#ef4444" stroke="none"/>
    <rect x="1" y="5" width="14" height="3" fill="#fbbf24" stroke="none"/>
    <rect x="1" y="8" width="14" height="3" fill="#3b82f6" stroke="none"/>
  </g>

  <!-- Right can -->
  <g transform="translate(62, 70)">
    <rect x="0" y="0" width="16" height="16" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
    <rect x="1" y="2" width="14" height="3" fill="#ef4444" stroke="none"/>
    <rect x="1" y="5" width="14" height="3" fill="#fbbf24" stroke="none"/>
    <rect x="1" y="8" width="14" height="3" fill="#3b82f6" stroke="none"/>
  </g>

  <!-- Feet on cans -->
  <rect x="34" y="66" width="16" height="6" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>
  <rect x="62" y="66" width="16" height="6" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="0.8"/>

  <!-- Legs -->
  <line x1="42" y1="66" x2="46" y2="42" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="66" x2="66" y2="42" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Body -->
  <rect x="44" y="18" width="24" height="26" rx="4" fill="#ef4444" stroke="#374151" stroke-width="1.2"/>

  <!-- Head -->
  <circle cx="56" cy="10" r="8" fill="#fcd9b6" stroke="#374151" stroke-width="1.2"/>
  <!-- Happy face -->
  <circle cx="53" cy="8" r="1" fill="#374151"/>
  <circle cx="59" cy="8" r="1" fill="#374151"/>
  <path d="M53,13 Q56,16 59,13" fill="none" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Hair -->
  <path d="M48,6 Q52,0 56,2 Q60,0 64,6" fill="#92400e" stroke="#374151" stroke-width="0.6"/>

  <!-- Arms holding strings -->
  <line x1="44" y1="22" x2="36" y2="40" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="22" x2="76" y2="40" stroke="#374151" stroke-width="2" stroke-linecap="round"/>

  <!-- Hands -->
  <circle cx="36" cy="40" r="3" fill="#fcd9b6" stroke="#374151" stroke-width="0.6"/>
  <circle cx="76" cy="40" r="3" fill="#fcd9b6" stroke="#374151" stroke-width="0.6"/>

  <!-- Strings from hands to cans -->
  <line x1="36" y1="42" x2="38" y2="70" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="76" y1="42" x2="74" y2="70" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Motion lines -->
  <line x1="24" y1="74" x2="30" y2="74" stroke="#374151" stroke-width="0.8" stroke-linecap="round" opacity="0.3"/>
  <line x1="22" y1="78" x2="32" y2="78" stroke="#374151" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
  <line x1="26" y1="82" x2="32" y2="82" stroke="#374151" stroke-width="0.8" stroke-linecap="round" opacity="0.3"/>

  <!-- Direction arrow -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="86" y1="78" x2="100" y2="78" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>
</svg>
