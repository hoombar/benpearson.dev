<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate (flipped, rim down) -->
  <ellipse cx="54" cy="68" rx="36" ry="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/>
  <path d="M18,68 Q18,78 54,78 Q90,78 90,68" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>

  <!-- Balloon sitting on top of plate -->
  <ellipse cx="54" cy="34" rx="24" ry="30" fill="#f87171" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="46" cy="22" rx="6" ry="10" fill="#fca5a5" opacity="0.5" transform="rotate(-15, 46, 22)"/>
  <!-- Balloon neck going into plate hole -->
  <path d="M54,64 L50,68 L58,68 Z" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>

  <!-- Tape strips sealing around base -->
  <rect x="38" y="64" width="14" height="4" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.4"/>
  <rect x="56" y="64" width="14" height="4" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.4"/>

  <!-- Hand applying tape -->
  <g transform="translate(76, 54)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="16" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Tape roll -->
  <g transform="translate(92, 14)">
    <ellipse cx="10" cy="10" rx="10" ry="10" fill="#d1fae5" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="10" cy="10" rx="4" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Arrow showing seal -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="82" y1="72" x2="72" y2="68" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
