<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table/floor surface -->
  <rect x="0" y="84" width="120" height="36" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>

  <!-- Air cushion lines beneath plate -->
  <line x1="30" y1="82" x2="26" y2="86" stroke="#93c5fd" stroke-width="0.6" opacity="0.6"/>
  <line x1="40" y1="82" x2="38" y2="88" stroke="#93c5fd" stroke-width="0.6" opacity="0.6"/>
  <line x1="50" y1="82" x2="50" y2="88" stroke="#93c5fd" stroke-width="0.6" opacity="0.6"/>
  <line x1="60" y1="82" x2="62" y2="88" stroke="#93c5fd" stroke-width="0.6" opacity="0.6"/>
  <line x1="70" y1="82" x2="74" y2="86" stroke="#93c5fd" stroke-width="0.6" opacity="0.6"/>

  <!-- Paper plate hovering -->
  <ellipse cx="50" cy="72" rx="34" ry="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/>
  <path d="M16,72 Q16,82 50,82 Q84,82 84,72" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>

  <!-- Balloon (slightly deflating) -->
  <ellipse cx="50" cy="40" rx="20" ry="26" fill="#f87171" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="44" cy="30" rx="5" ry="8" fill="#fca5a5" opacity="0.5" transform="rotate(-15, 44, 30)"/>
  <path d="M50,66 L47,72 L53,72 Z" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>

  <!-- Tape -->
  <rect x="40" y="68" width="10" height="3" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3"/>
  <rect x="52" y="68" width="10" height="3" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3"/>

  <!-- Movement arrow showing gliding -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="88" y1="72" x2="104" y2="72" stroke="#374151" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr)"/>

  <!-- Hand giving gentle push -->
  <g transform="translate(2, 38)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>
  <line x1="14" y1="48" x2="20" y2="52" stroke="#374151" stroke-width="0.6" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Speed lines -->
  <line x1="92" y1="66" x2="98" y2="66" stroke="#374151" stroke-width="0.5" opacity="0.4"/>
  <line x1="94" y1="78" x2="100" y2="78" stroke="#374151" stroke-width="0.5" opacity="0.4"/>
</svg>
