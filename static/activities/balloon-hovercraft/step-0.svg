<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate (hero) -->
  <ellipse cx="50" cy="52" rx="38" ry="30" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <!-- Plate rim -->
  <ellipse cx="50" cy="52" rx="28" ry="22" fill="none" stroke="#d1d5db" stroke-width="0.8"/>

  <!-- Centre hole -->
  <circle cx="50" cy="52" r="4" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>

  <!-- Scissors poking hole -->
  <g transform="translate(56, 28) rotate(60)">
    <path d="M0,0 L14,5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,0 L14,-5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#374151"/>
    <ellipse cx="18" cy="6" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <ellipse cx="18" cy="-6" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  </g>

  <!-- Arrow showing flip direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M96,42 Q102,52 96,62" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Small flipped plate preview -->
  <g transform="translate(90, 72)">
    <ellipse cx="14" cy="8" rx="14" ry="6" fill="#f3f4f6" stroke="#374151" stroke-width="0.6"/>
    <path d="M0,8 Q0,16 14,16 Q28,16 28,8" fill="none" stroke="#374151" stroke-width="0.6"/>
    <circle cx="14" cy="8" r="1.5" fill="#fef3c7" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Warning triangle -->
  <g transform="translate(4, 4)">
    <polygon points="8,0 0,14 16,14" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <line x1="8" y1="4" x2="8" y2="9" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="8" cy="11.5" r="0.8" fill="#374151"/>
  </g>
</svg>
