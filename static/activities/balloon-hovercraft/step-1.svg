<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Inflated balloon (hero) -->
  <ellipse cx="56" cy="40" rx="30" ry="36" fill="#f87171" stroke="#374151" stroke-width="1.5"/>
  <!-- Balloon highlight -->
  <ellipse cx="46" cy="28" rx="8" ry="12" fill="#fca5a5" opacity="0.5" transform="rotate(-15, 46, 28)"/>
  <!-- Balloon neck -->
  <path d="M56,76 L52,82 L60,82 Z" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>

  <!-- Fingers pinching neck -->
  <g transform="translate(44, 78)">
    <rect x="0" y="0" width="8" height="16" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g transform="translate(60, 78)">
    <rect x="0" y="0" width="8" height="16" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Pinch arrows -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="38" y1="86" x2="44" y2="86" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
  <line x1="74" y1="86" x2="68" y2="86" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Uninflated balloon for comparison -->
  <g transform="translate(90, 58)">
    <path d="M10,0 Q0,10 4,22 L10,28 L16,22 Q20,10 10,0 Z" fill="#fca5a5" stroke="#374151" stroke-width="0.6" opacity="0.5"/>
    <path d="M8,28 L12,28 L10,32 Z" fill="#ef4444" stroke="#374151" stroke-width="0.4" opacity="0.5"/>
  </g>
</svg>
