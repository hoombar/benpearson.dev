<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Puppet with googly eyes being added (hero) -->
  <g transform="translate(30, 10)">
    <!-- Finger loop -->
    <ellipse cx="20" cy="76" rx="10" ry="6" fill="none" stroke="#ef4444" stroke-width="3.5"/>
    <!-- Body -->
    <line x1="20" y1="70" x2="20" y2="42" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Bunny ears -->
    <path d="M20,42 Q12,16 14,6" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M20,42 Q28,16 26,6" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Googly eye (already stuck on) -->
    <circle cx="16" cy="48" r="4" fill="#ffffff" stroke="#374151" stroke-width="0.8"/>
    <circle cx="17" cy="47" r="2" fill="#374151" stroke="none"/>

    <!-- Second googly eye being placed -->
    <circle cx="24" cy="48" r="4" fill="#ffffff" stroke="#374151" stroke-width="0.8"/>
    <circle cx="25" cy="47" r="2" fill="#374151" stroke="none"/>

    <!-- Tiny paper mouth -->
    <path d="M16,56 Q20,60 24,56" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

    <!-- Arms (added pipe cleaner pieces) -->
    <path d="M16,54 Q4,56 2,52" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <path d="M24,54 Q36,56 38,52" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Googly eyes packet -->
  <g transform="translate(82, 40)">
    <rect x="0" y="0" width="22" height="26" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>
    <circle cx="7" cy="8" r="3.5" fill="#ffffff" stroke="#374151" stroke-width="0.5"/>
    <circle cx="8" cy="7" r="1.5" fill="#374151" stroke="none"/>
    <circle cx="16" cy="8" r="3.5" fill="#ffffff" stroke="#374151" stroke-width="0.5"/>
    <circle cx="17" cy="7" r="1.5" fill="#374151" stroke="none"/>
    <circle cx="7" cy="18" r="3.5" fill="#ffffff" stroke="#374151" stroke-width="0.5"/>
    <circle cx="8" cy="17" r="1.5" fill="#374151" stroke="none"/>
    <circle cx="16" cy="18" r="3.5" fill="#ffffff" stroke="#374151" stroke-width="0.5"/>
    <circle cx="17" cy="17" r="1.5" fill="#374151" stroke="none"/>
  </g>

  <!-- Glue bottle -->
  <g transform="translate(88, 74)">
    <rect x="0" y="6" width="10" height="18" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>
    <rect x="2" y="0" width="6" height="8" rx="1.5" fill="#f3f4f6" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Glue dot being applied -->
  <circle cx="74" cy="48" r="1.5" fill="#fef3c7" stroke="#374151" stroke-width="0.4" opacity="0.7"/>
</svg>
