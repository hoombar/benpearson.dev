<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Three puppets in different stages of being shaped -->

  <!-- Puppet 1: Bunny (complete shape) -->
  <g transform="translate(16, 14)">
    <!-- Finger loop ring -->
    <ellipse cx="14" cy="68" rx="8" ry="5" fill="none" stroke="#ef4444" stroke-width="3"/>
    <!-- Body/torso -->
    <line x1="14" y1="63" x2="14" y2="40" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <!-- Long bunny ears -->
    <path d="M14,40 Q6,14 10,8" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <path d="M14,40 Q22,14 18,8" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Puppet 2: Octopus (being built) -->
  <g transform="translate(46, 22)">
    <!-- Finger loop ring -->
    <ellipse cx="14" cy="60" rx="8" ry="5" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <!-- Head bulge -->
    <path d="M6,55 Q6,30 14,28 Q22,30 22,55" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <!-- Tentacles curling out -->
    <path d="M6,55 Q0,68 4,72" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <path d="M10,58 Q6,72 10,76" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <path d="M18,58 Q22,72 18,76" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <path d="M22,55 Q28,68 24,72" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Puppet 3: Cat (being shaped - ears being bent) -->
  <g transform="translate(80, 18)">
    <!-- Finger loop -->
    <ellipse cx="14" cy="64" rx="8" ry="5" fill="none" stroke="#22c55e" stroke-width="3"/>
    <!-- Body -->
    <line x1="14" y1="59" x2="14" y2="36" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <!-- Pointy ears -->
    <path d="M14,36 Q8,26 6,18" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <path d="M14,36 Q20,26 22,18" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <!-- Tail curling -->
    <path d="M14,60 Q26,58 30,50 Q34,42 30,38" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Hands bending a pipe cleaner -->
  <g transform="translate(76, 72)">
    <rect x="0" y="0" width="8" height="14" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="0" width="8" height="14" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <!-- Pipe cleaner being bent -->
    <path d="M4,14 Q11,20 18,14" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
