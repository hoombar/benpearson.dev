<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="120" height="120" fill="#f3f4f6" stroke="none"/>

  <!-- Cushion/sofa back (stage) -->
  <rect x="0" y="58" width="120" height="62" rx="6" fill="#a78bfa" stroke="#374151" stroke-width="1.5"/>
  <path d="M0,64 Q60,56 120,64" fill="#c4b5fd" stroke="none"/>

  <!-- Fingers poking up from behind cushion with puppets -->

  <!-- Finger 1 + Bunny puppet -->
  <g transform="translate(18, 12)">
    <!-- Finger -->
    <rect x="0" y="30" width="10" height="28" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <!-- Puppet ring -->
    <ellipse cx="5" cy="32" rx="7" ry="4" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <!-- Body -->
    <line x1="5" y1="28" x2="5" y2="14" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Ears -->
    <path d="M5,14 Q1,2 2,-2" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M5,14 Q9,2 8,-2" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="3" cy="18" r="2.5" fill="#ffffff" stroke="#374151" stroke-width="0.5"/>
    <circle cx="3.5" cy="17.5" r="1" fill="#374151"/>
    <circle cx="7" cy="18" r="2.5" fill="#ffffff" stroke="#374151" stroke-width="0.5"/>
    <circle cx="7.5" cy="17.5" r="1" fill="#374151"/>
  </g>

  <!-- Finger 2 + Octopus puppet -->
  <g transform="translate(44, 18)">
    <rect x="0" y="26" width="10" height="24" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="5" cy="28" rx="7" ry="4" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <path d="M-1,24 Q-1,8 5,6 Q11,8 11,24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tentacles -->
    <path d="M-1,24 Q-5,34 -3,38" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M2,26 Q-2,36 0,40" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M8,26 Q12,36 10,40" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M11,24 Q15,34 13,38" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="3" cy="14" r="2.5" fill="#ffffff" stroke="#374151" stroke-width="0.5"/>
    <circle cx="3.5" cy="13.5" r="1" fill="#374151"/>
    <circle cx="7" cy="14" r="2.5" fill="#ffffff" stroke="#374151" stroke-width="0.5"/>
    <circle cx="7.5" cy="13.5" r="1" fill="#374151"/>
  </g>

  <!-- Finger 3 + Cat puppet -->
  <g transform="translate(72, 16)">
    <rect x="0" y="28" width="10" height="26" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="5" cy="30" rx="7" ry="4" fill="none" stroke="#22c55e" stroke-width="2.5"/>
    <line x1="5" y1="26" x2="5" y2="12" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Pointy ears -->
    <path d="M5,12 Q1,4 0,0" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M5,12 Q9,4 10,0" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tail -->
    <path d="M5,28 Q14,26 16,20 Q18,14 16,10" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="3" cy="16" r="2.5" fill="#ffffff" stroke="#374151" stroke-width="0.5"/>
    <circle cx="3.5" cy="15.5" r="1" fill="#374151"/>
    <circle cx="7" cy="16" r="2.5" fill="#ffffff" stroke="#374151" stroke-width="0.5"/>
    <circle cx="7.5" cy="15.5" r="1" fill="#374151"/>
    <!-- Whiskers -->
    <line x1="0" y1="20" x2="-4" y2="18" stroke="#374151" stroke-width="0.5"/>
    <line x1="0" y1="22" x2="-4" y2="22" stroke="#374151" stroke-width="0.5"/>
    <line x1="10" y1="20" x2="14" y2="18" stroke="#374151" stroke-width="0.5"/>
    <line x1="10" y1="22" x2="14" y2="22" stroke="#374151" stroke-width="0.5"/>
  </g>
</svg>
