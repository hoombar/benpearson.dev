<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 2: Reveal the magic — paint sweeping over wax drawing, shapes appearing -->

  <!-- Paper background (full surface) -->
  <rect x="4" y="4" width="112" height="112" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2"/>

  <!-- Blue paint wash covering left/centre (where brush has swept) -->
  <rect x="6" y="6" width="76" height="110" rx="2" fill="#3b82f6"/>

  <!-- Wash gradient edge (right edge of sweep, showing mid-sweep action) -->
  <rect x="78" y="6" width="10" height="110" rx="1" fill="#93c5fd" opacity="0.7"/>

  <!-- Revealed star (hero reveal element — wax pushes paint away) -->
  <polygon points="38,28 42,40 55,40 45,48 49,62 38,54 27,62 31,48 21,40 34,40"
    fill="#dbeafe" stroke="#f9fafb" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Inner star glow -->
  <polygon points="38,33 41,42 51,42 43,48 46,58 38,52 30,58 33,48 25,42 35,42"
    fill="#eff6ff" stroke="none"/>

  <!-- Revealed smiley sun (second wax shape appearing) -->
  <circle cx="38" cy="82" r="16" fill="#dbeafe" stroke="#f9fafb" stroke-width="2.5"/>
  <circle cx="38" cy="82" r="12" fill="#eff6ff" stroke="none"/>
  <!-- Smiley eyes revealed -->
  <circle cx="33" cy="79" r="2.5" fill="#93c5fd"/>
  <circle cx="43" cy="79" r="2.5" fill="#93c5fd"/>
  <!-- Smile revealed -->
  <path d="M32,86 Q38,93 44,86" stroke="#93c5fd" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Sun rays revealed -->
  <line x1="38" y1="62" x2="38" y2="58" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="68" x2="53" y2="65" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="82" x2="58" y2="82" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="68" x2="23" y2="65" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="82" x2="18" y2="82" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>

  <!-- Sparkle lines from reveal (magic moment) -->
  <line x1="56" y1="30" x2="62" y2="24" stroke="#fde68a" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="36" x2="68" y2="33" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="44" x2="66" y2="45" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Paintbrush (hero action — sweeping boldly leftward) -->
  <g transform="translate(108, 34) rotate(155)">
    <!-- Handle (wooden, long) -->
    <rect x="-4" y="-46" width="8" height="52" rx="2" fill="#d97706" stroke="#374151" stroke-width="2"/>
    <!-- Handle grip detail -->
    <line x1="-4" y1="-30" x2="4" y2="-30" stroke="#b45309" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="-4" y1="-20" x2="4" y2="-20" stroke="#b45309" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Top cap -->
    <rect x="-4" y="-46" width="8" height="5" rx="2" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
    <!-- Ferrule (silver band) -->
    <rect x="-5" y="6" width="10" height="8" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
    <!-- Bristles (splayed, wet with blue paint) -->
    <path d="M-5,14 L-9,32 L0,26 L9,32 L5,14 Z" fill="#3b82f6" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Individual bristle lines for detail -->
    <line x1="-4" y1="18" x2="-8" y2="30" stroke="#1d4ed8" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="0" y2="32" stroke="#60a5fa" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="4" y1="18" x2="8" y2="30" stroke="#1d4ed8" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Paint drips from brush tip -->
    <circle cx="-8" cy="34" r="2" fill="#3b82f6"/>
    <circle cx="0" cy="35" r="1.5" fill="#3b82f6"/>
  </g>

  <!-- Motion sweep arcs (showing brush sweeping left) -->
  <path d="M86,28 Q80,34 86,42" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>
  <path d="M82,24 Q74,32 82,42" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="3,2" stroke-linecap="round"/>
</svg>
