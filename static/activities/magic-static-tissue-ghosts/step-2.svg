<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="120" height="120" fill="#e0e7ff"/>
  <!-- Person's Head/Hair -->
  <circle cx="60" cy="90" r="30" fill="#fcd34d" stroke="#374151" stroke-width="2"/>
  <!-- Wild hair standing up -->
  <path d="M40,70 Q30,40 50,60 Q50,20 60,60 Q70,20 70,60 Q90,40 80,70" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <!-- Balloon being rubbed -->
  <ellipse cx="60" cy="40" rx="25" ry="35" fill="#ef4444" stroke="#374151" stroke-width="2" transform="rotate(-15 60 40)"/>
  <path d="M60,75 L55,80 L65,80 Z" fill="#ef4444" stroke="#374151" stroke-width="2" transform="rotate(-15 60 40)"/>
  <path d="M60,80 Q55,85 65,90" fill="none" stroke="#374151" stroke-width="1.5" transform="rotate(-15 60 40)"/>
  <!-- Motion / rubbing action -->
  <path d="M25,40 Q40,20 80,30" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M95,50 Q80,70 40,60" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- Static sparks -->
  <path d="M30,30 L35,25 L32,20" fill="none" stroke="#eab308" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M85,25 L90,20 L87,15" fill="none" stroke="#eab308" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>