<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="120" height="120" fill="#fef3c7"/>
  <rect x="0" y="80" width="120" height="40" fill="#fde68a"/> <!-- Wooden table -->
  <!-- Tissue paper sheet -->
  <rect x="20" y="20" width="60" height="70" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <!-- Ghost shape being cut out -->
  <path d="M40,50 Q50,30 60,50 L60,80 Q55,75 50,80 Q45,75 40,80 Z" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="2,2"/>
  <!-- Faces -->
  <circle cx="45" cy="45" r="2" fill="#374151"/>
  <circle cx="55" cy="45" r="2" fill="#374151"/>
  <ellipse cx="50" cy="55" rx="3" ry="4" fill="#374151"/>
  <!-- Scissors cutting -->
  <g transform="translate(60, 70) rotate(-30)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="14" y2="4" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-4" cy="-4" r="4" fill="#ef4444" stroke="#374151" stroke-width="2"/>
    <circle cx="-4" cy="4" r="4" fill="#ef4444" stroke="#374151" stroke-width="2"/>
  </g>
  <!-- Marker -->
  <g transform="translate(90, 40) rotate(15)">
    <rect x="0" y="0" width="8" height="30" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="8" fill="#1d4ed8" stroke="#374151" stroke-width="1.5"/>
    <polygon points="1,30 7,30 4,36" fill="#374151"/>
  </g>
</svg>