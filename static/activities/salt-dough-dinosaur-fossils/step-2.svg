<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Table background -->
  <rect x="0" y="60" width="120" height="60" fill="#fef3c7" />
  <line x1="0" y1="60" x2="120" y2="60" stroke="#374151" stroke-width="2" />
  
  <!-- Flattened disc -->
  <path d="M28 86 L28 94 Q28 104 60 104 Q92 104 92 94 L92 86 Z" fill="#fde68a" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="60" cy="86" rx="32" ry="12" fill="#fde68a" stroke="#374151" stroke-width="2"/>
  
  <!-- Footprint indentation in the dough -->
  <g transform="translate(60, 86) rotate(15)">
    <!-- Minimal dinosaur footprint shape -->
    <path d="M-6 -2 Q-10 -10 -4 -8 Q-2 -10 -2 -5 L0 -8 L2 -3 L0 0 Z" fill="#d97706" stroke="#b45309" stroke-width="1" stroke-linejoin="round"/>
    <ellipse cx="-4" cy="-2" rx="4" ry="5" fill="#d97706" stroke="#b45309" stroke-width="1"/>
  </g>
  
  <!-- Toy Dinosaur (Green T-Rex silhouette) -->
  <g transform="translate(60, 45)">
    <path d="M-15 -25 Q-5 -25 5 -15 Q15 -10 35 5 Q20 5 15 5 L15 20 L5 20 L5 5 L-5 5 L-5 15 L-15 15 L-10 5 Q-20 0 -20 -10 L-10 -10 Z" fill="#22c55e" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="-12" cy="-18" r="1.5" fill="#374151"/>
  </g>
  
  <!-- Downward press arrow -->
  <line x1="20" y1="30" x2="35" y2="55" stroke="#374151" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
  
  <!-- Motion lines for stamping impact -->
  <path d="M40 76 L48 82" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M80 76 L72 82" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>