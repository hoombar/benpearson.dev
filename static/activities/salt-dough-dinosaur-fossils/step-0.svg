<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Table background -->
  <rect x="0" y="70" width="120" height="50" fill="#fef3c7" />
  <line x1="0" y1="70" x2="120" y2="70" stroke="#374151" stroke-width="2" />
  <!-- Bowl rim and body -->
  <path d="M16 62 Q16 104 60 104 Q104 104 104 62" stroke="#374151" stroke-width="2.5" fill="#f3f4f6"/>
  <line x1="16" y1="62" x2="104" y2="62" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Flour sack (left) -->
  <path d="M12 20 L16 44 L32 44 L36 20 Q24 10 12 20 Z" fill="#f9fafb" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <!-- Salt shaker (center) -->
  <rect x="52" y="10" width="16" height="28" rx="4" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
  <!-- Water jug (right) -->
  <path d="M90 40 L90 20 Q90 12 98 12 Q106 12 106 20 L106 40 Z" fill="#93c5fd" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <!-- Arrows into bowl -->
  <line x1="24" y1="46" x2="40" y2="60" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <line x1="60" y1="40" x2="60" y2="58" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <line x1="98" y1="42" x2="80" y2="60" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-blue)"/>
  <!-- Dough lump in bowl -->
  <ellipse cx="60" cy="88" rx="26" ry="12" fill="#fde68a" stroke="#374151" stroke-width="2"/>
  <!-- Mixing spoon inside bowl -->
  <line x1="84" y1="36" x2="70" y2="70" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="translate(68, 74) rotate(-65)">
    <ellipse cx="0" cy="0" rx="10" ry="6" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
  </g>
  <!-- Mixing motion arc -->
  <path d="M40 76 Q60 60 80 76" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>