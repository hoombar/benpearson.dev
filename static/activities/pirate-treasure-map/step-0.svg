<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Bowl (hero) — dark tea liquid inside -->
  <path d="M14 58 Q14 100 60 100 Q106 100 106 58" stroke="#374151" stroke-width="2.5" fill="#d97706" opacity="0.3"/>
  <line x1="14" y1="58" x2="106" y2="58" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M14 58 Q14 100 60 100 Q106 100 106 58" stroke="#374151" stroke-width="2.5" fill="none"/>
  <!-- Tea liquid surface -->
  <ellipse cx="60" cy="72" rx="28" ry="8" fill="#d97706" opacity="0.5" stroke="none"/>

  <!-- Tea bag 1 (left, dunked in bowl) -->
  <rect x="38" y="52" width="12" height="16" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <!-- Tea bag string going up -->
  <line x1="44" y1="52" x2="44" y2="34" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- Tea bag tag -->
  <rect x="40" y="28" width="8" height="6" rx="1" fill="#fef9c3" stroke="#374151" stroke-width="1"/>

  <!-- Tea bag 2 (right, dunked in bowl) -->
  <rect x="68" y="54" width="12" height="16" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="1.5"/>
  <!-- Tea bag string going up -->
  <line x1="74" y1="54" x2="74" y2="36" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- Tea bag tag -->
  <rect x="70" y="30" width="8" height="6" rx="1" fill="#fef9c3" stroke="#374151" stroke-width="1"/>

  <!-- Hot water stream pouring in from top-right (kettle spout hint) -->
  <path d="M96 8 L96 18 Q96 22 92 22 L88 22" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Water drip lines (dashed = liquid falling) -->
  <line x1="90" y1="22" x2="78" y2="52" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" stroke-linecap="round"/>
  <line x1="94" y1="22" x2="82" y2="52" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" stroke-linecap="round"/>

  <!-- Steam wisps rising from bowl -->
  <path d="M40 48 Q38 42 40 36" stroke="#374151" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M60 46 Q58 40 60 34" stroke="#374151" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M80 48 Q82 42 80 36" stroke="#374151" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Spoon resting on bowl rim -->
  <line x1="88" y1="42" x2="76" y2="62" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="72" cy="68" rx="8" ry="5" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>

  <!-- Table surface -->
  <line x1="4" y1="108" x2="116" y2="108" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>
