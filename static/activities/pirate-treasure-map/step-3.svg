<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Aged parchment paper (hero) -->
  <rect x="10" y="14" width="80" height="96" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
  <!-- Wrinkle texture on paper -->
  <line x1="16" y1="26" x2="60" y2="28" stroke="#d97706" stroke-width="0.5" opacity="0.3" stroke-linecap="round"/>
  <line x1="18" y1="70" x2="74" y2="68" stroke="#d97706" stroke-width="0.5" opacity="0.3" stroke-linecap="round"/>

  <!-- Coastline (jagged coast shape) -->
  <path d="M30 36 L40 32 L48 38 L54 34 L62 40 L68 36 L74 42 L72 52 L76 60 L70 68 L74 76 L68 82 L58 78 L50 84 L42 80 L36 86 L28 78 L24 68 L30 58 L26 48 Z"
        fill="#d1fae5" stroke="#374151" stroke-width="1.5" fill-opacity="0.6"/>

  <!-- Sea wavy lines -->
  <path d="M18 44 Q22 42 26 44" stroke="#3b82f6" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M18 50 Q22 48 26 50" stroke="#3b82f6" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M76 50 Q80 48 84 50" stroke="#3b82f6" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M76 56 Q80 54 84 56" stroke="#3b82f6" stroke-width="0.8" fill="none" opacity="0.5"/>

  <!-- Mountain triangles on the island -->
  <path d="M44 50 L48 40 L52 50 Z" fill="#86efac" stroke="#374151" stroke-width="1" fill-opacity="0.7"/>
  <path d="M54 52 L58 44 L62 52 Z" fill="#86efac" stroke="#374151" stroke-width="1" fill-opacity="0.7"/>

  <!-- Palm tree -->
  <line x1="38" y1="56" x2="38" y2="66" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32 56 Q38 52 44 56" stroke="#22c55e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M34 54 Q38 50 42 54" stroke="#22c55e" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Big red X marks the spot! -->
  <line x1="56" y1="64" x2="66" y2="74" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="66" y1="64" x2="56" y2="74" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

  <!-- Compass rose (top-right of paper) -->
  <circle cx="74" cy="26" r="8" fill="none" stroke="#374151" stroke-width="1"/>
  <line x1="74" y1="18" x2="74" y2="34" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="66" y1="26" x2="82" y2="26" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- N arrow tip -->
  <path d="M72 20 L74 17 L76 20" stroke="#ef4444" stroke-width="1" fill="#ef4444"/>

  <!-- Skull icon (cave/danger spot) -->
  <circle cx="34" cy="76" r="4" fill="none" stroke="#374151" stroke-width="1"/>
  <line x1="30" y1="80" x2="38" y2="80" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <circle cx="32" cy="75" r="1" fill="#374151"/>
  <circle cx="36" cy="75" r="1" fill="#374151"/>

  <!-- Pen drawing on the map (top-right, angled) -->
  <g transform="translate(96, 38) rotate(-40)">
    <!-- Pen tip (at top = toward paper after rotation) -->
    <polygon points="0,-22 -3,-16 3,-16" fill="#374151"/>
    <!-- Pen shaft -->
    <rect x="-3" y="-16" width="6" height="28" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <!-- Pen clip -->
    <rect x="3" y="-10" width="2" height="12" rx="1" fill="#374151"/>
  </g>

  <!-- Table surface -->
  <line x1="4" y1="114" x2="116" y2="114" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
</svg>
