<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <line x1="4" y1="100" x2="116" y2="100" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wet tea-stained paper laid flat (hero) — yellowed/aged colour -->
  <rect x="18" y="36" width="64" height="56" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="2"/>
  <!-- Wrinkle lines showing aged texture -->
  <line x1="24" y1="44" x2="56" y2="48" stroke="#d97706" stroke-width="0.7" opacity="0.4" stroke-linecap="round"/>
  <line x1="28" y1="58" x2="68" y2="56" stroke="#d97706" stroke-width="0.7" opacity="0.4" stroke-linecap="round"/>
  <line x1="22" y1="70" x2="62" y2="72" stroke="#d97706" stroke-width="0.7" opacity="0.4" stroke-linecap="round"/>
  <line x1="30" y1="80" x2="72" y2="78" stroke="#d97706" stroke-width="0.7" opacity="0.4" stroke-linecap="round"/>

  <!-- Water droplets evaporating upward (dashed = liquid/vapour rising) -->
  <line x1="34" y1="36" x2="34" y2="22" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" stroke-linecap="round" opacity="0.6"/>
  <line x1="50" y1="36" x2="50" y2="18" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" stroke-linecap="round" opacity="0.6"/>
  <line x1="66" y1="36" x2="66" y2="24" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" stroke-linecap="round" opacity="0.6"/>

  <!-- Small water droplet shapes at top of each line -->
  <path d="M34 22 Q32 18 34 16 Q36 18 34 22 Z" fill="#3b82f6" opacity="0.5"/>
  <path d="M50 18 Q48 14 50 12 Q52 14 50 18 Z" fill="#3b82f6" opacity="0.5"/>
  <path d="M66 24 Q64 20 66 18 Q68 20 66 24 Z" fill="#3b82f6" opacity="0.5"/>

  <!-- Hairdryer (optional method, top-right) -->
  <g transform="translate(100, 50) rotate(-30)">
    <!-- Body -->
    <rect x="-10" y="-6" width="24" height="12" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <!-- Nozzle -->
    <rect x="-18" y="-4" width="10" height="8" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <!-- Handle -->
    <rect x="4" y="6" width="8" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Air flow lines from hairdryer toward paper -->
  <line x1="82" y1="44" x2="74" y2="48" stroke="#374151" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
  <line x1="84" y1="50" x2="76" y2="54" stroke="#374151" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
  <line x1="82" y1="56" x2="74" y2="60" stroke="#374151" stroke-width="1" opacity="0.4" stroke-linecap="round"/>

  <!-- Clock showing time passing (bottom-right) -->
  <circle cx="102" cy="86" r="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <line x1="102" y1="86" x2="102" y2="80" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="102" y1="86" x2="107" y2="86" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="102" cy="86" r="1.2" fill="#374151"/>
</svg>
