<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 0: Fill the Jar with Oil -->
  <!-- Table surface -->
  <line x1="4" y1="104" x2="116" y2="104" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Glass jar body (hero) -->
  <rect x="18" y="22" width="46" height="80" rx="4" stroke="#374151" stroke-width="2" fill="#f0f9ff" fill-opacity="0.5"/>
  <!-- Jar neck -->
  <rect x="24" y="14" width="34" height="12" rx="2" stroke="#374151" stroke-width="1.5" fill="#e0f2fe"/>
  <!-- Jar lid/cap -->
  <rect x="22" y="10" width="38" height="7" rx="3" stroke="#374151" stroke-width="1.5" fill="#9ca3af"/>
  <!-- Oil inside jar (3/4 full, golden amber) -->
  <rect x="20" y="41" width="42" height="59" rx="2" fill="#fde68a" fill-opacity="0.7" stroke="none"/>
  <!-- Oil surface line -->
  <line x1="20" y1="41" x2="62" y2="41" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Glass highlight -->
  <line x1="23" y1="26" x2="23" y2="98" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Oil bottle (right side, tilted, pouring) -->
  <g transform="translate(90, 26) rotate(32)">
    <!-- Bottle body -->
    <rect x="-7" y="-28" width="14" height="36" rx="4" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
    <!-- Label lines -->
    <line x1="-4" y1="-14" x2="4" y2="-14" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <line x1="-4" y1="-8" x2="4" y2="-8" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <!-- Bottle neck -->
    <rect x="-4" y="-36" width="8" height="10" rx="2" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
    <!-- Cap -->
    <rect x="-5" y="-42" width="10" height="8" rx="2" fill="#d97706" stroke="#374151" stroke-width="1.5"/>
  </g>
  <!-- Pour stream (amber, from bottle tip to jar) -->
  <path d="M80 38 Q72 40 68 41" stroke="#d97706" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Drip drops in jar -->
  <ellipse cx="46" cy="46" rx="4" ry="2" fill="#fbbf24" fill-opacity="0.5" stroke="none"/>
</svg>
