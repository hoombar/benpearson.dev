<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Step 1: Add Coloured Water — water sinks through oil -->
  <!-- Table surface -->
  <line x1="4" y1="104" x2="116" y2="104" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Glass jar body (hero) -->
  <rect x="18" y="22" width="46" height="80" rx="4" stroke="#374151" stroke-width="2" fill="#f0f9ff" fill-opacity="0.5"/>
  <!-- Jar neck -->
  <rect x="24" y="14" width="34" height="12" rx="2" stroke="#374151" stroke-width="1.5" fill="#e0f2fe"/>
  <!-- Jar lid/cap -->
  <rect x="22" y="10" width="38" height="7" rx="3" stroke="#374151" stroke-width="1.5" fill="#9ca3af"/>
  <!-- Oil layer (top 2/3 of jar interior) — amber/yellow -->
  <rect x="20" y="41" width="42" height="38" rx="1" fill="#fde68a" fill-opacity="0.65" stroke="none"/>
  <!-- Oil surface line -->
  <line x1="20" y1="41" x2="62" y2="41" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Oil/water boundary line -->
  <line x1="20" y1="79" x2="62" y2="79" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2" stroke-linecap="round"/>
  <!-- Coloured water layer (bottom of jar) — red/pink -->
  <rect x="20" y="79" width="42" height="21" rx="1" fill="#fca5a5" fill-opacity="0.7" stroke="none"/>
  <!-- Glass highlight -->
  <line x1="23" y1="26" x2="23" y2="98" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Small cup with red water (right side) -->
  <g transform="translate(90, 30) rotate(30)">
    <!-- Cup body -->
    <path d="M-8 0 L-10 26 L10 26 L8 0 Z" stroke="#374151" stroke-width="1.5" fill="#fca5a5"/>
    <!-- Red water inside -->
    <path d="M-8 0 L-9 16 L9 16 L8 0 Z" fill="#ef4444" fill-opacity="0.5" stroke="none"/>
    <!-- Cup rim -->
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Pour stream from cup to jar -->
  <path d="M82 40 Q73 40 68 41" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Arrow pointing down (water sinking) -->
  <line x1="41" y1="60" x2="41" y2="74" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
