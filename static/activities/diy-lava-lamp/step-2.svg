<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Step 2: Drop in the Tablet — bubbles and blobs rising -->
  <!-- Table surface -->
  <line x1="4" y1="104" x2="116" y2="104" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Glass jar body (hero) -->
  <rect x="14" y="18" width="52" height="84" rx="4" stroke="#374151" stroke-width="2" fill="#f0f9ff" fill-opacity="0.5"/>
  <!-- Jar neck -->
  <rect x="20" y="10" width="40" height="12" rx="2" stroke="#374151" stroke-width="1.5" fill="#e0f2fe"/>
  <!-- Jar lid/cap -->
  <rect x="18" y="6" width="44" height="7" rx="3" stroke="#374151" stroke-width="1.5" fill="#9ca3af"/>
  <!-- Oil layer (amber) -->
  <rect x="16" y="42" width="48" height="36" rx="1" fill="#fde68a" fill-opacity="0.55" stroke="none"/>
  <!-- Oil/water boundary -->
  <line x1="16" y1="78" x2="66" y2="78" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2" stroke-linecap="round"/>
  <!-- Coloured water at bottom -->
  <rect x="16" y="78" width="48" height="22" rx="1" fill="#fca5a5" fill-opacity="0.6" stroke="none"/>
  <!-- Oil surface line -->
  <line x1="16" y1="42" x2="66" y2="42" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Coloured water blob rising (mid oil layer) -->
  <ellipse cx="35" cy="60" rx="6" ry="5" fill="#ef4444" fill-opacity="0.7" stroke="#374151" stroke-width="1"/>
  <!-- Another blob higher up -->
  <ellipse cx="52" cy="48" rx="5" ry="4" fill="#ef4444" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
  <!-- Bubbles (white/clear circles) rising -->
  <circle cx="28" cy="72" r="3" stroke="#374151" stroke-width="1" fill="white" fill-opacity="0.6"/>
  <circle cx="44" cy="62" r="2.5" stroke="#374151" stroke-width="1" fill="white" fill-opacity="0.6"/>
  <circle cx="58" cy="54" r="2" stroke="#374151" stroke-width="1" fill="white" fill-opacity="0.6"/>
  <circle cx="32" cy="50" r="2" stroke="#374151" stroke-width="1" fill="white" fill-opacity="0.6"/>
  <circle cx="48" cy="74" r="3" stroke="#374151" stroke-width="1" fill="white" fill-opacity="0.6"/>
  <!-- Effervescent tablet piece above jar, falling -->
  <rect x="36" y="-4" width="10" height="6" rx="3" fill="white" stroke="#374151" stroke-width="1.5"/>
  <!-- Fizz lines on tablet -->
  <line x1="39" y1="-2" x2="39" y2="2" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="43" y1="-2" x2="43" y2="2" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- Arrow showing tablet dropping -->
  <line x1="41" y1="3" x2="41" y2="14" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Glass highlight -->
  <line x1="19" y1="22" x2="19" y2="98" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
</svg>
