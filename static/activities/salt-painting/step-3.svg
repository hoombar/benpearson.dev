<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Dark paper with salt painting (hero) -->
  <rect x="10" y="14" width="76" height="72" rx="2" fill="#1e293b" stroke="#374151" stroke-width="1.5"/>

  <!-- Rainbow arcs with colour flowing along salt -->
  <!-- Outer arc — red flowing -->
  <path d="M20,70 Q48,16 72,70" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <!-- Salt texture on arc -->
  <path d="M20,70 Q48,16 72,70" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

  <!-- Middle arc — blue flowing -->
  <path d="M26,70 Q48,26 66,70" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M26,70 Q48,26 66,70" fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Inner arc — yellow flowing -->
  <path d="M32,70 Q48,36 60,70" fill="none" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
  <path d="M32,70 Q48,36 60,70" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

  <!-- Colour spreading effect — paint flowing along outer arc -->
  <circle cx="28" cy="54" r="2" fill="#ef4444" opacity="0.4"/>
  <circle cx="68" cy="54" r="2.5" fill="#ef4444" opacity="0.3"/>

  <!-- Colour spreading on middle arc -->
  <circle cx="34" cy="48" r="1.8" fill="#3b82f6" opacity="0.4"/>
  <circle cx="60" cy="50" r="2" fill="#3b82f6" opacity="0.3"/>

  <!-- Paintbrush touching salt line -->
  <g transform="translate(62, 2)">
    <!-- Handle -->
    <rect x="0" y="0" width="6" height="32" rx="2" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
    <!-- Ferrule -->
    <rect x="-1" y="30" width="8" height="6" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="0.6"/>
    <!-- Bristles -->
    <rect x="0" y="35" width="6" height="8" rx="2" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
    <!-- Paint on tip -->
    <circle cx="3" cy="44" r="2" fill="#22c55e" opacity="0.6"/>
  </g>

  <!-- Hand holding brush -->
  <g transform="translate(70, 4)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Paint cups nearby -->
  <g transform="translate(92, 30)">
    <rect x="0" y="0" width="18" height="16" rx="3" fill="#fef3c7" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="9" cy="2" rx="9" ry="3" fill="#fef3c7" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="9" cy="5" rx="7" ry="2" fill="#fca5a5" stroke="none"/>
  </g>
  <g transform="translate(92, 56)">
    <rect x="0" y="0" width="18" height="16" rx="3" fill="#fef3c7" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="9" cy="2" rx="9" ry="3" fill="#fef3c7" stroke="#374151" stroke-width="0.6"/>
    <ellipse cx="9" cy="5" rx="7" ry="2" fill="#93c5fd" stroke="none"/>
  </g>

  <!-- Sparkle effects on salt -->
  <polygon points="48,20 49,22 51,22 49.5,23.5 50,26 48,24.5 46,26 46.5,23.5 45,22 47,22" fill="white" opacity="0.5"/>
  <polygon points="36,32 37,33.5 38.5,33.5 37.5,34.5 38,36 36,35 34,36 34.5,34.5 33.5,33.5 35,33.5" fill="white" opacity="0.4"/>
</svg>
