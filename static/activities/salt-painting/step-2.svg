<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Small cup 1 — red paint -->
  <g transform="translate(10, 40)">
    <rect x="0" y="0" width="24" height="20" rx="3" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="12" cy="2" rx="12" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="1"/>
    <!-- Water with paint mixed in -->
    <ellipse cx="12" cy="6" rx="10" ry="3" fill="#fca5a5" stroke="none"/>
  </g>

  <!-- Small cup 2 — blue paint -->
  <g transform="translate(44, 40)">
    <rect x="0" y="0" width="24" height="20" rx="3" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="12" cy="2" rx="12" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="1"/>
    <ellipse cx="12" cy="6" rx="10" ry="3" fill="#93c5fd" stroke="none"/>
  </g>

  <!-- Small cup 3 — yellow paint -->
  <g transform="translate(78, 40)">
    <rect x="0" y="0" width="24" height="20" rx="3" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="12" cy="2" rx="12" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="1"/>
    <ellipse cx="12" cy="6" rx="10" ry="3" fill="#fde68a" stroke="none"/>
  </g>

  <!-- Water being poured into cup (from small container) -->
  <g transform="translate(46, 8)">
    <rect x="0" y="0" width="16" height="20" rx="3" fill="#e0f2fe" stroke="#374151" stroke-width="1"/>
    <ellipse cx="8" cy="2" rx="8" ry="3" fill="#e0f2fe" stroke="#374151" stroke-width="0.8"/>
    <!-- Water pouring out -->
    <path d="M14,16 Q18,24 16,30" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M16,30 Q14,34 16,38" fill="none" stroke="#60a5fa" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Paint pots -->
  <g transform="translate(10, 72)">
    <rect x="0" y="0" width="18" height="22" rx="3" fill="#ef4444" stroke="#374151" stroke-width="1"/>
    <ellipse cx="9" cy="2" rx="9" ry="3" fill="#dc2626" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g transform="translate(34, 72)">
    <rect x="0" y="0" width="18" height="22" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
    <ellipse cx="9" cy="2" rx="9" ry="3" fill="#2563eb" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g transform="translate(58, 72)">
    <rect x="0" y="0" width="18" height="22" rx="3" fill="#eab308" stroke="#374151" stroke-width="1"/>
    <ellipse cx="9" cy="2" rx="9" ry="3" fill="#ca8a04" stroke="#374151" stroke-width="0.8"/>
  </g>
  <g transform="translate(82, 72)">
    <rect x="0" y="0" width="18" height="22" rx="3" fill="#22c55e" stroke="#374151" stroke-width="1"/>
    <ellipse cx="9" cy="2" rx="9" ry="3" fill="#16a34a" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Spoon for mixing -->
  <g transform="translate(104, 44)">
    <line x1="0" y1="0" x2="0" y2="28" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="30" rx="4" ry="3" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Arrow showing paint to cup -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M22,72 Q22,66 22,62" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
