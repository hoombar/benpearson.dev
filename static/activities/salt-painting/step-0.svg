<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Dark paper/card (hero) -->
  <rect x="10" y="20" width="76" height="72" rx="2" fill="#1e293b" stroke="#374151" stroke-width="1.5"/>

  <!-- Glue design — rainbow arc drawn on dark paper -->
  <path d="M20,76 Q48,24 76,76" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Second arc -->
  <path d="M26,76 Q48,32 70,76" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- Third arc -->
  <path d="M32,76 Q48,40 64,76" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Glue bottle squeezing -->
  <g transform="translate(74, 8)">
    <!-- Bottle body -->
    <rect x="0" y="10" width="18" height="28" rx="4" fill="white" stroke="#374151" stroke-width="1.2"/>
    <!-- Nozzle -->
    <rect x="5" y="0" width="8" height="12" rx="2" fill="#f97316" stroke="#374151" stroke-width="1"/>
    <rect x="7" y="-3" width="4" height="4" rx="1" fill="#f97316" stroke="#374151" stroke-width="0.6"/>
    <!-- Glue drip from nozzle -->
    <circle cx="9" cy="-5" r="1.5" fill="white" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Hand squeezing bottle -->
  <g transform="translate(92, 14)">
    <rect x="0" y="4" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="12" y="6" width="9" height="16" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrow showing glue trail direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M80,50 Q78,44 74,40" fill="none" stroke="#fef3c7" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
