<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Baking tray -->
  <rect x="6" y="16" width="84" height="80" rx="3" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <rect x="10" y="20" width="76" height="72" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>

  <!-- Dark paper on tray -->
  <rect x="14" y="24" width="68" height="64" rx="2" fill="#1e293b" stroke="#374151" stroke-width="1"/>

  <!-- Glue arcs now covered with salt (sparkly white/textured) -->
  <path d="M24,72 Q48,22 72,72" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <path d="M30,72 Q48,30 66,72" fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M36,72 Q48,38 60,72" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>

  <!-- Salt crystals along the lines (tiny dots) -->
  <circle cx="30" cy="60" r="0.8" fill="white" opacity="0.8"/>
  <circle cx="36" cy="46" r="0.6" fill="white" opacity="0.7"/>
  <circle cx="42" cy="34" r="0.8" fill="white" opacity="0.8"/>
  <circle cx="50" cy="28" r="0.6" fill="white" opacity="0.7"/>
  <circle cx="58" cy="36" r="0.8" fill="white" opacity="0.8"/>
  <circle cx="64" cy="50" r="0.6" fill="white" opacity="0.7"/>
  <circle cx="68" cy="62" r="0.8" fill="white" opacity="0.8"/>

  <!-- Hand sprinkling salt from above -->
  <g transform="translate(78, 4)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Salt falling from hand -->
  <circle cx="86" cy="26" r="0.8" fill="#d1d5db" stroke="none"/>
  <circle cx="82" cy="30" r="0.6" fill="#d1d5db" stroke="none"/>
  <circle cx="88" cy="34" r="0.7" fill="#d1d5db" stroke="none"/>
  <circle cx="84" cy="38" r="0.5" fill="#d1d5db" stroke="none"/>
  <circle cx="80" cy="42" r="0.8" fill="#d1d5db" stroke="none"/>
  <circle cx="86" cy="44" r="0.6" fill="#d1d5db" stroke="none"/>

  <!-- Excess salt scattered on tray -->
  <circle cx="18" cy="86" r="0.5" fill="#9ca3af" opacity="0.4"/>
  <circle cx="26" cy="90" r="0.4" fill="#9ca3af" opacity="0.3"/>
  <circle cx="50" cy="88" r="0.5" fill="#9ca3af" opacity="0.4"/>
  <circle cx="70" cy="90" r="0.4" fill="#9ca3af" opacity="0.3"/>

  <!-- Tilt arrow showing shaking off excess -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M96,50 Q100,56 100,64" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
