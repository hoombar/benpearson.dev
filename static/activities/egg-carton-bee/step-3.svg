<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Completed bee (hero) -->
  <g transform="translate(22, 22)">
    <!-- Egg cup dome body -->
    <path d="M0,56 Q0,0 34,0 Q68,0 68,56 Z" fill="#eab308" stroke="#374151" stroke-width="1.5"/>

    <!-- Black stripes -->
    <path d="M4,18 Q34,14 64,18" fill="none" stroke="#374151" stroke-width="5" stroke-linecap="round"/>
    <path d="M2,32 Q34,28 66,32" fill="none" stroke="#374151" stroke-width="5" stroke-linecap="round"/>
    <path d="M2,46 Q34,42 66,46" fill="none" stroke="#374151" stroke-width="5" stroke-linecap="round"/>

    <!-- Wings -->
    <ellipse cx="10" cy="-4" rx="18" ry="12" fill="white" stroke="#374151" stroke-width="0.8" opacity="0.7" transform="rotate(-30, 10, -4)"/>
    <ellipse cx="58" cy="-4" rx="18" ry="12" fill="white" stroke="#374151" stroke-width="0.8" opacity="0.7" transform="rotate(30, 58, -4)"/>

    <!-- Pipe cleaner antennae -->
    <path d="M30,4 Q24,-8 20,-16" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="-18" r="3" fill="none" stroke="#374151" stroke-width="2"/>
    <path d="M38,4 Q44,-8 48,-16" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <circle cx="48" cy="-18" r="3" fill="none" stroke="#374151" stroke-width="2"/>

    <!-- Googly eyes -->
    <circle cx="26" cy="10" r="6" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="26" cy="11" r="3" fill="#374151"/>
    <circle cx="42" cy="10" r="6" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="42" cy="11" r="3" fill="#374151"/>

    <!-- Smile -->
    <path d="M28,20 Q34,26 40,20" fill="none" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Spare googly eye -->
  <circle cx="100" cy="88" r="4" fill="white" stroke="#374151" stroke-width="0.6"/>
  <circle cx="100" cy="89" r="2" fill="#374151"/>

  <!-- Small flower decoration -->
  <g transform="translate(6, 82)">
    <line x1="8" y1="8" x2="8" y2="18" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="8" cy="6" r="5" fill="#f472b6" stroke="#374151" stroke-width="0.5"/>
    <circle cx="8" cy="6" r="2" fill="#eab308"/>
  </g>
</svg>
