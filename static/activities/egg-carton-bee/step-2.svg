<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Bee body with wings being attached (hero) -->
  <g transform="translate(26, 24)">
    <!-- Egg cup dome -->
    <path d="M0,52 Q0,0 30,0 Q60,0 60,52 Z" fill="#eab308" stroke="#374151" stroke-width="1.5"/>
    <!-- Black stripes -->
    <path d="M4,16 Q30,12 56,16" fill="none" stroke="#374151" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M2,30 Q30,26 58,30" fill="none" stroke="#374151" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M2,42 Q30,38 58,42" fill="none" stroke="#374151" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Wings (tissue paper, translucent) -->
    <!-- Left wing -->
    <ellipse cx="8" cy="-6" rx="16" ry="10" fill="white" stroke="#374151" stroke-width="0.8" opacity="0.7" transform="rotate(-30, 8, -6)"/>
    <!-- Right wing -->
    <ellipse cx="52" cy="-6" rx="16" ry="10" fill="white" stroke="#374151" stroke-width="0.8" opacity="0.7" transform="rotate(30, 52, -6)"/>
  </g>

  <!-- Tissue paper sheet being cut -->
  <g transform="translate(6, 10)">
    <rect x="0" y="0" width="20" height="16" rx="1" fill="white" stroke="#d1d5db" stroke-width="0.8" opacity="0.7"/>
    <!-- Cut line -->
    <ellipse cx="10" cy="8" rx="8" ry="5" fill="none" stroke="#374151" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Glue bottle -->
  <g transform="translate(90, 40) rotate(15)">
    <rect x="0" y="-5" width="22" height="10" rx="3" fill="white" stroke="#374151" stroke-width="0.8"/>
    <path d="M-2,-3 L-5,0 L-2,3" fill="#f97316" stroke="#374151" stroke-width="0.5"/>
    <rect x="6" y="-3" width="10" height="6" rx="1" fill="#f97316" opacity="0.6"/>
  </g>

  <!-- Arrow showing wing attachment -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M20,18 Q28,20 32,22" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Spare tissue paper -->
  <rect x="92" y="68" width="18" height="22" rx="1" fill="white" stroke="#d1d5db" stroke-width="0.6" opacity="0.7"/>
</svg>
