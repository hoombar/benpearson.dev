<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Egg carton with one cup cut out (hero) -->
  <g transform="translate(6, 30)">
    <!-- Carton base -->
    <rect x="0" y="10" width="60" height="36" rx="2" fill="#d4a574" stroke="#374151" stroke-width="1.2"/>
    <!-- Egg cups in carton -->
    <path d="M4,10 Q10,0 16,10" fill="#c4956a" stroke="#374151" stroke-width="0.8"/>
    <path d="M16,10 Q22,0 28,10" fill="#c4956a" stroke="#374151" stroke-width="0.8"/>
    <path d="M28,10 Q34,0 40,10" fill="#c4956a" stroke="#374151" stroke-width="0.8"/>
    <!-- Cut-out space (empty) -->
    <rect x="40" y="4" width="16" height="14" fill="#fef3c7" stroke="#374151" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Separated egg cup being painted yellow -->
  <g transform="translate(68, 26)">
    <!-- Egg cup dome -->
    <path d="M0,28 Q0,0 18,0 Q36,0 36,28 Z" fill="#eab308" stroke="#374151" stroke-width="1.5"/>
    <!-- Cup texture ridges -->
    <path d="M4,22 Q18,16 32,22" fill="none" stroke="#ca8a04" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Paintbrush applying yellow -->
  <g transform="translate(86, 12) rotate(30)">
    <rect x="0" y="-3" width="28" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#eab308" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pot -->
  <g transform="translate(88, 66)">
    <rect x="0" y="0" width="20" height="20" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
    <rect x="2" y="4" width="16" height="14" rx="1" fill="#eab308"/>
    <rect x="-1" y="-2" width="22" height="5" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Scissors nearby -->
  <g transform="translate(10, 78)">
    <path d="M0,0 L14,4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L14,-4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.2" fill="#374151"/>
    <ellipse cx="18" cy="5" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <ellipse cx="18" cy="-5" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  </g>

  <!-- Warning symbol -->
  <g transform="translate(36, 78)">
    <polygon points="8,0 0,14 16,14" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <line x1="8" y1="4" x2="8" y2="9" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="8" cy="11.5" r="0.8" fill="#374151"/>
  </g>
</svg>
