<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Yellow egg cup with stripes being added (hero) -->
  <g transform="translate(26, 16)">
    <!-- Egg cup dome -->
    <path d="M0,56 Q0,0 32,0 Q64,0 64,56 Z" fill="#eab308" stroke="#374151" stroke-width="1.5"/>

    <!-- Black stripes -->
    <path d="M4,18 Q32,14 60,18" fill="none" stroke="#374151" stroke-width="5" stroke-linecap="round"/>
    <path d="M2,34 Q32,30 62,34" fill="none" stroke="#374151" stroke-width="5" stroke-linecap="round"/>
    <!-- Third stripe being drawn -->
    <path d="M2,48 Q20,44 36,46" fill="none" stroke="#374151" stroke-width="5" stroke-linecap="round" stroke-dasharray="6,4"/>
  </g>

  <!-- Marker drawing the stripe -->
  <g transform="translate(64, 54) rotate(15)">
    <rect x="0" y="-4" width="34" height="8" rx="2" fill="#374151" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-3.5" width="5" height="7" rx="1.5" fill="#1f2937"/>
    <polygon points="-4,-1.5 -4,1.5 -7,0" fill="#374151"/>
  </g>

  <!-- Arrow showing stripe direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M24,82 Q32,78 40,82" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Reference bee pattern (small) -->
  <g transform="translate(94, 78)">
    <ellipse cx="10" cy="8" rx="10" ry="8" fill="#eab308" stroke="#374151" stroke-width="0.5"/>
    <line x1="2" y1="5" x2="18" y2="5" stroke="#374151" stroke-width="1.5"/>
    <line x1="2" y1="11" x2="18" y2="11" stroke="#374151" stroke-width="1.5"/>
  </g>
</svg>
