<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- LEFT: crumpled / sunken foil (failed boat) -->
  <!-- Irregular crumpled flat sheet -->
  <path d="M8 72 L14 56 L22 64 L30 52 L36 60 L38 50 L44 60 L48 54 L52 72 L44 76 L36 70 L24 78 Z"
        fill="#d1d5db" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Extra crinkle lines on crumpled piece -->
  <line x1="16" y1="60" x2="28" y2="68" stroke="#9ca3af" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="30" y1="56" x2="42" y2="66" stroke="#9ca3af" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="20" y1="68" x2="38" y2="62" stroke="#9ca3af" stroke-width="0.75" stroke-linecap="round"/>
  <!-- Water droplets on the crumpled piece (it got wet) -->
  <circle cx="20" cy="74" r="2" fill="#93c5fd" stroke="#374151" stroke-width="1"/>
  <circle cx="34" cy="72" r="1.5" fill="#93c5fd" stroke="#374151" stroke-width="0.75"/>
  <circle cx="44" cy="68" r="2" fill="#93c5fd" stroke="#374151" stroke-width="1"/>
  <!-- ARROW pointing right (redesign action) -->
  <line x1="56" y1="62" x2="68" y2="62" stroke="#374151" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- RIGHT: new improved boat (side view, taller walls) -->
  <!-- Boat base -->
  <rect x="72" y="68" width="44" height="8" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <!-- Taller left wall -->
  <line x1="72" y1="68" x2="72" y2="48" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Taller right wall -->
  <line x1="116" y1="68" x2="116" y2="48" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top rim -->
  <line x1="70" y1="48" x2="118" y2="48" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Shimmer on new boat -->
  <line x1="78" y1="66" x2="110" y2="68" stroke="#9ca3af" stroke-width="0.75" stroke-linecap="round"/>
  <!-- Height comparison: dotted line showing old (shorter) wall height -->
  <line x1="68" y1="60" x2="72" y2="60" stroke="#374151" stroke-width="1" stroke-dasharray="3,2" stroke-linecap="round"/>
  <line x1="116" y1="60" x2="122" y2="60" stroke="#374151" stroke-width="1" stroke-dasharray="3,2" stroke-linecap="round"/>
  <!-- "More coins!" coins stacked higher in the improved boat -->
  <circle cx="86" cy="62" r="5" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <circle cx="98" cy="62" r="5" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <circle cx="110" cy="62" r="5" fill="#fde68a" stroke="#374151" stroke-width="1.5"/>
  <circle cx="86" cy="54" r="5" fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>
  <circle cx="98" cy="54" r="5" fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>
  <!-- Upward arrow showing improvement -->
  <line x1="94" y1="38" x2="94" y2="28" stroke="#374151" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
