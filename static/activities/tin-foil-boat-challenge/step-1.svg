<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Flat foil square (top-down view, centred) -->
  <rect x="28" y="28" width="64" height="64" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <!-- Shimmer lines -->
  <line x1="34" y1="40" x2="86" y2="44" stroke="#9ca3af" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="32" y1="56" x2="88" y2="59" stroke="#9ca3af" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="34" y1="72" x2="86" y2="75" stroke="#9ca3af" stroke-width="0.75" stroke-linecap="round"/>
  <!-- Top edge fold arrow (pointing up) -->
  <line x1="60" y1="28" x2="60" y2="14" stroke="#374151" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Bottom edge fold arrow (pointing down) -->
  <line x1="60" y1="92" x2="60" y2="106" stroke="#374151" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Left edge fold arrow (pointing left) -->
  <line x1="28" y1="60" x2="14" y2="60" stroke="#374151" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Right edge fold arrow (pointing right) -->
  <line x1="92" y1="60" x2="106" y2="60" stroke="#374151" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Fold crease lines (2cm in from each edge) — dashed -->
  <line x1="28" y1="36" x2="92" y2="36" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3" stroke-linecap="round"/>
  <line x1="28" y1="84" x2="92" y2="84" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3" stroke-linecap="round"/>
  <line x1="36" y1="28" x2="36" y2="92" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3" stroke-linecap="round"/>
  <line x1="84" y1="28" x2="84" y2="92" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3" stroke-linecap="round"/>
  <!-- Mini cross-section diagram (bottom-right corner area) showing resulting tray shape -->
  <!-- Tray side profile: flat base + two raised walls -->
  <line x1="94" y1="110" x2="116" y2="110" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="94" y1="104" x2="94" y2="110" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="116" y1="104" x2="116" y2="110" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
</svg>
