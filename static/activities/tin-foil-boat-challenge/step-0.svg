<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Foil roll body (horizontal cylinder, left side) -->
  <rect x="8" y="44" width="36" height="32" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <!-- Roll end cap left -->
  <ellipse cx="8" cy="60" rx="5" ry="16" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <!-- Roll end cap right -->
  <ellipse cx="44" cy="60" rx="5" ry="16" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <!-- Foil spiral lines on roll -->
  <line x1="18" y1="44" x2="18" y2="76" stroke="#9ca3af" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,3"/>
  <line x1="28" y1="44" x2="28" y2="76" stroke="#9ca3af" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,3"/>
  <line x1="38" y1="44" x2="38" y2="76" stroke="#9ca3af" stroke-width="1" stroke-linecap="round" stroke-dasharray="3,3"/>
  <!-- Strip of foil unrolling downward from roll -->
  <rect x="24" y="76" width="16" height="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <!-- Dashed tear line across the foil strip -->
  <line x1="18" y1="94" x2="50" y2="94" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3" stroke-linecap="round"/>
  <!-- Arrow pointing right from roll area to flat sheet -->
  <line x1="54" y1="60" x2="68" y2="60" stroke="#374151" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Flat foil square (right side, the result) -->
  <rect x="74" y="36" width="38" height="38" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="2.5"/>
  <!-- Crinkle / shimmer lines on flat sheet -->
  <line x1="80" y1="44" x2="106" y2="48" stroke="#9ca3af" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="78" y1="54" x2="110" y2="57" stroke="#9ca3af" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="80" y1="64" x2="108" y2="67" stroke="#9ca3af" stroke-width="0.75" stroke-linecap="round"/>
  <!-- Measurement ticks below flat sheet (25cm indicator) -->
  <line x1="74" y1="82" x2="112" y2="82" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="74" y1="79" x2="74" y2="85" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="112" y1="79" x2="112" y2="85" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- Midpoint tick -->
  <line x1="93" y1="80" x2="93" y2="84" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <!-- Size ticks along left edge of flat sheet -->
  <line x1="68" y1="36" x2="68" y2="74" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="65" y1="36" x2="71" y2="36" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  <line x1="65" y1="74" x2="71" y2="74" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
</svg>
