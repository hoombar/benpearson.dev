<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Raft base with string being lashed (hero) -->
  <g transform="translate(14, 26)">
    <!-- Deck sticks -->
    <rect x="0" y="0" width="60" height="6" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
    <rect x="0" y="8" width="60" height="6" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
    <rect x="0" y="16" width="60" height="6" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
    <rect x="0" y="24" width="60" height="6" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
    <rect x="0" y="32" width="60" height="6" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
    <rect x="0" y="40" width="60" height="6" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
    <rect x="0" y="48" width="60" height="6" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>
    <rect x="0" y="56" width="60" height="6" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.8"/>

    <!-- Cross-beams -->
    <rect x="8" y="-2" width="6" height="62" rx="1" fill="#c2956e" stroke="#374151" stroke-width="1"/>
    <rect x="46" y="-2" width="6" height="62" rx="1" fill="#c2956e" stroke="#374151" stroke-width="1"/>

    <!-- String lashing around left cross-beam -->
    <path d="M8,0 L14,4 L8,8 L14,12 L8,16 L14,20 L8,24 L14,28 L8,32" fill="none" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>

    <!-- String lashing around right cross-beam (partially done) -->
    <path d="M46,0 L52,4 L46,8 L52,12 L46,16 L52,20" fill="none" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Hand wrapping string -->
  <g transform="translate(68, 40)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- String trailing from hand to raft -->
  <path d="M70,50 Q66,48 64,46" fill="none" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Arrow showing lashing direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M66,50 Q64,54 62,56" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- String ball -->
  <g transform="translate(88, 66)">
    <circle cx="12" cy="12" r="12" fill="#f5f5f4" stroke="#374151" stroke-width="0.8"/>
    <circle cx="12" cy="12" r="4" fill="#d1d5db" stroke="#374151" stroke-width="0.4"/>
    <circle cx="12" cy="12" r="8" fill="none" stroke="#d1d5db" stroke-width="0.4"/>
  </g>
</svg>
