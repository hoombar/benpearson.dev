<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Raft with sail mast (hero, angled 3/4 view) -->
  <g transform="translate(16, 38)">
    <!-- Deck sticks (slightly angled) -->
    <rect x="0" y="0" width="56" height="5" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="6" width="56" height="5" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="12" width="56" height="5" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="18" width="56" height="5" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="24" width="56" height="5" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="30" width="56" height="5" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="36" width="56" height="5" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="42" width="56" height="5" rx="1" fill="#d4a574" stroke="#374151" stroke-width="0.6"/>

    <!-- Cross-beams -->
    <rect x="6" y="-1" width="5" height="50" rx="1" fill="#c2956e" stroke="#374151" stroke-width="0.8"/>
    <rect x="44" y="-1" width="5" height="50" rx="1" fill="#c2956e" stroke="#374151" stroke-width="0.8"/>

    <!-- String lashing -->
    <path d="M6,0 L11,4 L6,8 L11,12 L6,16 L11,20 L6,24 L11,28 L6,32 L11,36 L6,40 L11,44 L6,48" fill="none" stroke="#374151" stroke-width="0.8"/>
    <path d="M44,0 L49,4 L44,8 L49,12 L44,16 L49,20 L44,24 L49,28 L44,32 L49,36 L44,40 L49,44 L44,48" fill="none" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Mast (popsicle stick standing up) -->
  <rect x="42" y="4" width="4" height="58" rx="1" fill="#c2956e" stroke="#374151" stroke-width="1"/>

  <!-- Sail (paper triangle) -->
  <polygon points="48,10 48,48 80,30" fill="white" stroke="#374151" stroke-width="1"/>
  <!-- Pirate flag design on sail -->
  <circle cx="58" cy="28" r="4" fill="#374151"/>
  <line x1="54" y1="34" x2="62" y2="34" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Tape securing mast -->
  <rect x="38" y="58" width="12" height="4" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.3" opacity="0.6"/>

  <!-- Hand decorating sail with marker -->
  <g transform="translate(82, 14)">
    <rect x="0" y="0" width="7" height="22" rx="2" fill="#374151" stroke="#374151" stroke-width="0.5"/>
    <rect x="0" y="18" width="7" height="4" rx="1" fill="#1f2937"/>
    <polygon points="2,22 5,22 3.5,26" fill="#374151"/>
  </g>
  <g transform="translate(90, 10)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>
</svg>
