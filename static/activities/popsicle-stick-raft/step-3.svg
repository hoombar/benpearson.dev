<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Large bowl of water -->
  <ellipse cx="56" cy="62" rx="46" ry="20" fill="#bfdbfe" stroke="#374151" stroke-width="1.5"/>
  <!-- Bowl sides -->
  <path d="M10,62 Q10,90 56,90 Q102,90 102,62" fill="none" stroke="#374151" stroke-width="1.5"/>
  <!-- Water surface shimmer -->
  <ellipse cx="36" cy="58" rx="8" ry="2" fill="none" stroke="white" stroke-width="0.5" opacity="0.4"/>
  <ellipse cx="70" cy="60" rx="6" ry="1.5" fill="none" stroke="white" stroke-width="0.5" opacity="0.4"/>

  <!-- Raft floating on water (hero) -->
  <g transform="translate(30, 48)">
    <!-- Deck sticks -->
    <rect x="0" y="0" width="40" height="3" rx="0.5" fill="#d4a574" stroke="#374151" stroke-width="0.5"/>
    <rect x="0" y="4" width="40" height="3" rx="0.5" fill="#d4a574" stroke="#374151" stroke-width="0.5"/>
    <rect x="0" y="8" width="40" height="3" rx="0.5" fill="#d4a574" stroke="#374151" stroke-width="0.5"/>
    <rect x="0" y="12" width="40" height="3" rx="0.5" fill="#d4a574" stroke="#374151" stroke-width="0.5"/>
    <rect x="0" y="16" width="40" height="3" rx="0.5" fill="#d4a574" stroke="#374151" stroke-width="0.5"/>
    <rect x="0" y="20" width="40" height="3" rx="0.5" fill="#d4a574" stroke="#374151" stroke-width="0.5"/>

    <!-- Cross-beams -->
    <rect x="4" y="-1" width="3" height="26" rx="0.5" fill="#c2956e" stroke="#374151" stroke-width="0.5"/>
    <rect x="32" y="-1" width="3" height="26" rx="0.5" fill="#c2956e" stroke="#374151" stroke-width="0.5"/>

    <!-- Mast -->
    <rect x="18" y="-32" width="3" height="36" rx="0.5" fill="#c2956e" stroke="#374151" stroke-width="0.8"/>

    <!-- Sail -->
    <polygon points="23,-28 23,-4 42,-16" fill="white" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Coins on the raft (cargo) -->
  <ellipse cx="40" cy="54" rx="4" ry="1.5" fill="#fbbf24" stroke="#374151" stroke-width="0.4"/>
  <ellipse cx="46" cy="56" rx="4" ry="1.5" fill="#fde68a" stroke="#374151" stroke-width="0.4"/>

  <!-- Water ripples around raft -->
  <ellipse cx="50" cy="72" rx="18" ry="4" fill="none" stroke="#60a5fa" stroke-width="0.5" opacity="0.4"/>
  <ellipse cx="50" cy="76" rx="22" ry="4" fill="none" stroke="#60a5fa" stroke-width="0.5" opacity="0.3"/>

  <!-- Hand adding coin -->
  <g transform="translate(62, 14)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Coin being placed -->
  <ellipse cx="66" cy="36" rx="5" ry="2" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>

  <!-- Arrow showing coin going onto raft -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M64,38 Q58,42 52,46" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- More coins waiting -->
  <g transform="translate(96, 42)">
    <ellipse cx="6" cy="8" rx="6" ry="2.5" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
    <ellipse cx="6" cy="6" rx="6" ry="2.5" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
    <ellipse cx="6" cy="4" rx="6" ry="2.5" fill="#fde68a" stroke="#374151" stroke-width="0.5"/>
  </g>
</svg>
