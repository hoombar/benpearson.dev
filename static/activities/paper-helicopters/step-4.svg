<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="shadow4" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87ceeb"/>
      <stop offset="100%" stop-color="#e0f6ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  
  <!-- Motion lines -->
  <path d="M 170 180 Q 180 230 190 280" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8,4" opacity="0.6"/>
  <path d="M 230 180 Q 220 230 210 280" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8,4" opacity="0.6"/>
  
  <!-- Spiral air currents -->
  <path d="M 120 100 C 100 120, 160 140, 180 120 C 200 100, 140 80, 120 100" fill="none" stroke="#fff" stroke-width="2" opacity="0.4"/>
  <path d="M 280 140 C 300 160, 240 180, 220 160 C 200 140, 260 120, 280 140" fill="none" stroke="#fff" stroke-width="2" opacity="0.4"/>

  <!-- Falling helicopter in perspective -->
  <g transform="translate(200, 120) scale(1.2)" filter="url(#shadow4)">
    <!-- Motion blur duplicates for the blades -->
    <polygon points="0,0 -60,-20 -60,-35 0,-15" fill="#ffffff" opacity="0.3"/>
    <polygon points="0,0 60,-20 60,-35 0,-15" fill="#ffffff" opacity="0.3"/>
    <polygon points="0,0 -50,-30 -50,-45 0,-25" fill="#ffffff" opacity="0.5"/>
    <polygon points="0,0 50,-30 50,-45 0,-25" fill="#ffffff" opacity="0.5"/>
    
    <!-- Actual blades -->
    <polygon points="0,0 -60,-10 -60,-25 0,-5" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
    <polygon points="0,0 60,-10 60,-25 0,-5" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
    
    <!-- Stem -->
    <rect x="-10" y="0" width="20" height="50" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>
    
    <!-- Paper clip -->
    <path d="M -3,40 v 15 a 3 3 0 0 0 6 0 v -18 a 5 5 0 0 0 -10 0 v 20 a 7 7 0 0 0 14 0 v -18" fill="none" stroke="#888" stroke-width="2"/>
  </g>
</svg>