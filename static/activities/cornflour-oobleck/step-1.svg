<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Step 1: Slowly Add Water — careful drizzle into bowl -->
  <!-- Table surface -->
  <line x1="4" y1="108" x2="116" y2="108" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Large bowl (hero) -->
  <path d="M10 62 Q10 102 60 102 Q110 102 110 62 Z" stroke="#374151" stroke-width="2" fill="#f9fafb"/>
  <ellipse cx="60" cy="62" rx="50" ry="10" stroke="#374151" stroke-width="2" fill="#f3f4f6"/>
  <!-- Thick oobleck mixture inside bowl (white-ish) -->
  <path d="M22 74 Q60 70 98 74 Q98 98 60 98 Q22 98 22 74 Z" fill="#f0fdf4" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Small measuring cup of water (right side, tilted slowly) -->
  <g transform="translate(88, 24) rotate(20)">
    <!-- Cup body -->
    <path d="M-10 -2 L-12 22 L12 22 L10 -2 Z" stroke="#374151" stroke-width="1.5" fill="#e0f2fe"/>
    <!-- Handle -->
    <path d="M10 4 Q18 4 18 12 Q18 20 10 18" stroke="#374151" stroke-width="1.5" fill="none"/>
    <!-- Cup rim -->
    <line x1="-10" y1="-2" x2="10" y2="-2" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Water inside cup (blue tint) -->
    <path d="M-10 -2 L-11 10 L11 10 L10 -2 Z" fill="#93c5fd" fill-opacity="0.5" stroke="none"/>
    <!-- Measurement marks -->
    <line x1="-12" y1="6" x2="-8" y2="6" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <line x1="-12" y1="14" x2="-8" y2="14" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- Thin water drizzle (slow, careful pour) — dashed to suggest slow trickle -->
  <line x1="80" y1="38" x2="76" y2="52" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,3"/>
  <line x1="76" y1="54" x2="72" y2="62" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <!-- Water droplets landing in bowl -->
  <circle cx="70" cy="66" r="2" fill="#93c5fd" fill-opacity="0.7" stroke="none"/>
  <circle cx="66" cy="68" r="1.5" fill="#93c5fd" fill-opacity="0.7" stroke="none"/>
  <!-- Spoon in bowl (stirring) -->
  <g transform="translate(38, 70) rotate(-25)">
    <!-- Spoon handle -->
    <rect x="-2" y="-30" width="4" height="28" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <!-- Spoon bowl -->
    <ellipse cx="0" cy="2" rx="5" ry="3" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  </g>
  <!-- Arrow indicating slow/careful action -->
  <line x1="72" y1="36" x2="72" y2="48" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
