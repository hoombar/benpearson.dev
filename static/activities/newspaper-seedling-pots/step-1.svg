<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Jar being slid out of formed pot (hero) -->
  <g transform="translate(14, 24)">
    <!-- Newspaper pot (cylinder shape) -->
    <rect x="0" y="0" width="36" height="40" rx="3" fill="#f5f5f4" stroke="#374151" stroke-width="1.2"/>
    <!-- Text texture -->
    <line x1="4" y1="8" x2="32" y2="8" stroke="#e5e7eb" stroke-width="0.5"/>
    <line x1="4" y1="14" x2="30" y2="14" stroke="#e5e7eb" stroke-width="0.5"/>
    <line x1="4" y1="20" x2="32" y2="20" stroke="#e5e7eb" stroke-width="0.5"/>
    <line x1="4" y1="26" x2="28" y2="26" stroke="#e5e7eb" stroke-width="0.5"/>

    <!-- Folded base (visible underneath) -->
    <rect x="2" y="36" width="32" height="6" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>
    <!-- Fold lines on base -->
    <line x1="12" y1="36" x2="12" y2="42" stroke="#374151" stroke-width="0.4"/>
    <line x1="24" y1="36" x2="24" y2="42" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Glass jar sliding out to the right -->
  <g transform="translate(56, 26)">
    <rect x="0" y="0" width="34" height="32" rx="4" fill="#e0f2fe" stroke="#374151" stroke-width="1" opacity="0.5"/>
    <ellipse cx="34" cy="16" rx="3" ry="16" fill="#e0f2fe" stroke="#374151" stroke-width="0.8" opacity="0.4"/>
    <line x1="8" y1="4" x2="8" y2="28" stroke="white" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Arrow showing jar sliding out -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="52" y1="42" x2="66" y2="42" stroke="#374151" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Finished pots standing (already made) -->
  <g transform="translate(80, 48)">
    <rect x="0" y="0" width="16" height="24" rx="2" fill="#f5f5f4" stroke="#374151" stroke-width="0.8"/>
    <rect x="1" y="20" width="14" height="4" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="0.5"/>
    <line x1="3" y1="6" x2="13" y2="6" stroke="#e5e7eb" stroke-width="0.4"/>
    <line x1="3" y1="10" x2="12" y2="10" stroke="#e5e7eb" stroke-width="0.4"/>
  </g>
  <g transform="translate(100, 50)">
    <rect x="0" y="0" width="16" height="22" rx="2" fill="#f5f5f4" stroke="#374151" stroke-width="0.8"/>
    <rect x="1" y="18" width="14" height="4" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="0.5"/>
    <line x1="3" y1="6" x2="13" y2="6" stroke="#e5e7eb" stroke-width="0.4"/>
    <line x1="3" y1="10" x2="12" y2="10" stroke="#e5e7eb" stroke-width="0.4"/>
  </g>

  <!-- Hand folding base -->
  <g transform="translate(6, 60)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrows showing fold inward on base -->
  <path d="M20,74 Q24,70 28,68" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
