<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Newspaper being rolled around jar (hero) -->
  <g transform="translate(12, 24)">
    <!-- Newspaper sheet (partially rolled) -->
    <rect x="0" y="0" width="70" height="44" rx="1" fill="#f5f5f4" stroke="#374151" stroke-width="1"/>
    <!-- Text lines -->
    <line x1="4" y1="6" x2="34" y2="6" stroke="#d1d5db" stroke-width="1.2"/>
    <line x1="4" y1="10" x2="32" y2="10" stroke="#e5e7eb" stroke-width="0.6"/>
    <line x1="4" y1="14" x2="34" y2="14" stroke="#e5e7eb" stroke-width="0.6"/>
    <line x1="40" y1="6" x2="66" y2="6" stroke="#d1d5db" stroke-width="1.2"/>
    <line x1="40" y1="10" x2="64" y2="10" stroke="#e5e7eb" stroke-width="0.6"/>
    <line x1="40" y1="14" x2="66" y2="14" stroke="#e5e7eb" stroke-width="0.6"/>
    <line x1="4" y1="22" x2="34" y2="22" stroke="#e5e7eb" stroke-width="0.6"/>
    <line x1="4" y1="26" x2="32" y2="26" stroke="#e5e7eb" stroke-width="0.6"/>
  </g>

  <!-- Glass jar lying on its side on the newspaper -->
  <g transform="translate(26, 36)">
    <!-- Jar body -->
    <rect x="0" y="0" width="40" height="22" rx="4" fill="#e0f2fe" stroke="#374151" stroke-width="1.2" opacity="0.6"/>
    <!-- Jar opening -->
    <ellipse cx="0" cy="11" rx="4" ry="11" fill="#bfdbfe" stroke="#374151" stroke-width="0.8" opacity="0.5"/>
    <!-- Jar bottom -->
    <ellipse cx="40" cy="11" rx="3" ry="11" fill="#e0f2fe" stroke="#374151" stroke-width="0.8" opacity="0.5"/>
    <!-- Glass shine -->
    <line x1="8" y1="4" x2="8" y2="18" stroke="white" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Arrow showing rolling direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M76,36 Q82,30 86,36 Q90,42 86,46" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Hand rolling -->
  <g transform="translate(82, 46)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Overhang indicator at bottom -->
  <line x1="14" y1="68" x2="82" y2="68" stroke="#374151" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="14" y1="76" x2="14" y2="68" stroke="#374151" stroke-width="0.5"/>
  <line x1="82" y1="76" x2="82" y2="68" stroke="#374151" stroke-width="0.5"/>

  <!-- More newspaper sheets -->
  <g transform="translate(14, 80)">
    <rect x="0" y="0" width="40" height="14" rx="1" fill="#f5f5f4" stroke="#374151" stroke-width="0.5"/>
    <line x1="4" y1="4" x2="20" y2="4" stroke="#e5e7eb" stroke-width="0.5"/>
    <line x1="4" y1="8" x2="22" y2="8" stroke="#e5e7eb" stroke-width="0.5"/>
  </g>
</svg>
