<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Baking tray with pots -->
  <rect x="6" y="42" width="108" height="52" rx="3" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <rect x="10" y="46" width="100" height="44" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.8"/>

  <!-- Newspaper pot 1 (being filled with soil, hero) -->
  <g transform="translate(16, 46)">
    <rect x="0" y="0" width="22" height="30" rx="2" fill="#f5f5f4" stroke="#374151" stroke-width="1"/>
    <line x1="3" y1="8" x2="19" y2="8" stroke="#e5e7eb" stroke-width="0.4"/>
    <line x1="3" y1="14" x2="18" y2="14" stroke="#e5e7eb" stroke-width="0.4"/>
    <!-- Soil inside -->
    <ellipse cx="11" cy="6" rx="9" ry="4" fill="#92400e" stroke="none"/>
    <!-- Bean seed visible -->
    <ellipse cx="11" cy="8" rx="3" ry="2" fill="#86efac" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Newspaper pot 2 (already planted) -->
  <g transform="translate(44, 48)">
    <rect x="0" y="0" width="22" height="28" rx="2" fill="#f5f5f4" stroke="#374151" stroke-width="1"/>
    <line x1="3" y1="8" x2="19" y2="8" stroke="#e5e7eb" stroke-width="0.4"/>
    <!-- Soil -->
    <ellipse cx="11" cy="4" rx="9" ry="4" fill="#92400e" stroke="none"/>
  </g>

  <!-- Newspaper pot 3 (empty) -->
  <g transform="translate(72, 48)">
    <rect x="0" y="0" width="22" height="28" rx="2" fill="#f5f5f4" stroke="#374151" stroke-width="1"/>
    <line x1="3" y1="8" x2="19" y2="8" stroke="#e5e7eb" stroke-width="0.4"/>
    <line x1="3" y1="14" x2="18" y2="14" stroke="#e5e7eb" stroke-width="0.4"/>
  </g>

  <!-- Hand dropping seed into pot -->
  <g transform="translate(18, 12)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Seed dropping -->
  <ellipse cx="24" cy="36" rx="3" ry="2" fill="#86efac" stroke="#374151" stroke-width="0.5"/>

  <!-- Arrow showing seed going in -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M26,38 Q26,42 26,44" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Bean seed packet -->
  <g transform="translate(86, 10)">
    <rect x="0" y="0" width="22" height="30" rx="2" fill="#86efac" stroke="#374151" stroke-width="0.8"/>
    <!-- Seed illustration on packet -->
    <ellipse cx="11" cy="14" rx="5" ry="3.5" fill="#22c55e" stroke="#374151" stroke-width="0.5"/>
    <path d="M8,14 Q11,11 14,14" fill="none" stroke="#16a34a" stroke-width="0.5"/>
  </g>

  <!-- Water drops (just watered) -->
  <circle cx="56" cy="46" r="1" fill="#60a5fa" stroke="none" opacity="0.5"/>
  <circle cx="52" cy="48" r="0.8" fill="#60a5fa" stroke="none" opacity="0.4"/>
  <circle cx="58" cy="50" r="0.8" fill="#60a5fa" stroke="none" opacity="0.4"/>
</svg>
