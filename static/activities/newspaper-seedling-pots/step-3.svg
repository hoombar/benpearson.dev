<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Window sill / sunny surface -->
  <rect x="0" y="80" width="120" height="40" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>
  <!-- Wall -->
  <rect x="0" y="0" width="120" height="80" fill="#f3f4f6"/>
  <!-- Window -->
  <rect x="30" y="4" width="60" height="48" fill="#e0f2fe" stroke="#374151" stroke-width="1.5"/>
  <line x1="60" y1="4" x2="60" y2="52" stroke="#374151" stroke-width="1.5"/>
  <line x1="30" y1="28" x2="90" y2="28" stroke="#374151" stroke-width="1.5"/>

  <!-- Sun through window -->
  <circle cx="50" cy="18" r="8" fill="#fbbf24" stroke="none" opacity="0.6"/>
  <line x1="50" y1="6" x2="50" y2="10" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="40" y1="10" x2="42" y2="14" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="58" y1="12" x2="56" y2="14" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

  <!-- Baking tray on windowsill -->
  <rect x="14" y="62" width="92" height="32" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="1.2"/>
  <rect x="18" y="66" width="84" height="24" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>

  <!-- Pot 1 with sprouted seedling (hero!) -->
  <g transform="translate(22, 62)">
    <rect x="0" y="4" width="20" height="24" rx="2" fill="#f5f5f4" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="10" cy="8" rx="8" ry="3" fill="#92400e" stroke="none"/>
    <!-- Seedling growing! -->
    <line x1="10" y1="6" x2="10" y2="-10" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
    <!-- Leaves -->
    <ellipse cx="6" cy="-10" rx="5" ry="3" fill="#22c55e" stroke="#374151" stroke-width="0.5" transform="rotate(-20 6 -10)"/>
    <ellipse cx="14" cy="-12" rx="5" ry="3" fill="#22c55e" stroke="#374151" stroke-width="0.5" transform="rotate(20 14 -12)"/>
  </g>

  <!-- Pot 2 with smaller sprout -->
  <g transform="translate(48, 64)">
    <rect x="0" y="4" width="20" height="22" rx="2" fill="#f5f5f4" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="10" cy="8" rx="8" ry="3" fill="#92400e" stroke="none"/>
    <!-- Small sprout -->
    <line x1="10" y1="6" x2="10" y2="-2" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="7" cy="-2" rx="3" ry="2" fill="#86efac" stroke="#374151" stroke-width="0.4"/>
    <ellipse cx="13" cy="-3" rx="3" ry="2" fill="#86efac" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Pot 3 with just-emerging seed -->
  <g transform="translate(74, 64)">
    <rect x="0" y="4" width="20" height="22" rx="2" fill="#f5f5f4" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="10" cy="8" rx="8" ry="3" fill="#92400e" stroke="none"/>
    <!-- Tiny sprout peeking through -->
    <line x1="10" y1="6" x2="10" y2="2" stroke="#86efac" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Sunshine rays hitting plants -->
  <line x1="50" y1="30" x2="34" y2="50" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>
  <line x1="56" y1="30" x2="46" y2="52" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>
  <line x1="62" y1="30" x2="58" y2="50" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>

  <!-- Water drops on soil -->
  <circle cx="60" cy="70" r="0.8" fill="#60a5fa" stroke="none" opacity="0.4"/>
  <circle cx="86" cy="72" r="0.8" fill="#60a5fa" stroke="none" opacity="0.4"/>
</svg>
