<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Cards laid face-down in grid (hero) -->
  <!-- Row 1 -->
  <rect x="10" y="12" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="34" y="12" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="58" y="12" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="82" y="12" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>

  <!-- Row 2 -->
  <rect x="10" y="42" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="34" y="42" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="58" y="42" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="82" y="42" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>

  <!-- Row 3 -->
  <rect x="10" y="72" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="34" y="72" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="58" y="72" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="82" y="72" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>

  <!-- Card back pattern (subtle) -->
  <line x1="16" y1="18" x2="24" y2="32" stroke="#2563eb" stroke-width="0.5" opacity="0.5"/>
  <line x1="24" y1="18" x2="16" y2="32" stroke="#2563eb" stroke-width="0.5" opacity="0.5"/>

  <!-- Shuffle motion arrows -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M106,25 Q112,20 108,14" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
