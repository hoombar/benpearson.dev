<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Game in progress - some face down, two flipped (hero) -->
  <!-- Row 1 -->
  <rect x="10" y="12" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <!-- Flipped card 1 - sun -->
  <rect x="34" y="12" width="20" height="26" rx="2" fill="white" stroke="#374151" stroke-width="1.2"/>
  <circle cx="44" cy="25" r="5" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
  <line x1="44" y1="18" x2="44" y2="16" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="44" y1="32" x2="44" y2="34" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="37" y1="25" x2="35" y2="25" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="51" y1="25" x2="53" y2="25" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round"/>

  <rect x="58" y="12" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="82" y="12" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>

  <!-- Row 2 -->
  <rect x="10" y="42" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <rect x="34" y="42" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <!-- Flipped card 2 - sun (match!) -->
  <rect x="58" y="42" width="20" height="26" rx="2" fill="white" stroke="#374151" stroke-width="1.2"/>
  <circle cx="68" cy="55" r="5" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
  <line x1="68" y1="48" x2="68" y2="46" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="68" y1="62" x2="68" y2="64" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="61" y1="55" x2="59" y2="55" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="75" y1="55" x2="77" y2="55" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round"/>

  <rect x="82" y="42" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>

  <!-- Row 3 (some removed - already matched) -->
  <rect x="10" y="72" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <!-- Empty space (matched pair removed) -->
  <rect x="34" y="72" width="20" height="26" rx="2" fill="none" stroke="#d1d5db" stroke-width="0.5" stroke-dasharray="3,3"/>
  <rect x="58" y="72" width="20" height="26" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
  <!-- Empty space -->
  <rect x="82" y="72" width="20" height="26" rx="2" fill="none" stroke="#d1d5db" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Match indicator line between the two suns -->
  <path d="M44,38 Q50,42 58,48" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Checkmark for match -->
  <g transform="translate(104, 4)">
    <circle cx="8" cy="8" r="8" fill="#d1fae5" stroke="#374151" stroke-width="0.6"/>
    <polyline points="4,8 7,11 13,5" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Hand flipping card -->
  <g transform="translate(60, 36)">
    <rect x="0" y="0" width="10" height="14" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.5"/>
  </g>
</svg>
