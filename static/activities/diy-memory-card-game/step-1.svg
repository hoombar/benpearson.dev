<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Cards with matching pair drawings (hero) -->
  <!-- Row 1: matching suns -->
  <g transform="translate(8, 10)">
    <rect x="0" y="0" width="22" height="28" rx="2" fill="white" stroke="#374151" stroke-width="1"/>
    <circle cx="11" cy="14" r="6" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <line x1="11" y1="6" x2="11" y2="4" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="11" y1="22" x2="11" y2="24" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="3" y1="14" x2="1" y2="14" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="19" y1="14" x2="21" y2="14" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
  </g>
  <g transform="translate(34, 10)">
    <rect x="0" y="0" width="22" height="28" rx="2" fill="white" stroke="#374151" stroke-width="1"/>
    <circle cx="11" cy="14" r="6" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <line x1="11" y1="6" x2="11" y2="4" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="11" y1="22" x2="11" y2="24" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="3" y1="14" x2="1" y2="14" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
    <line x1="19" y1="14" x2="21" y2="14" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Row 2: matching hearts -->
  <g transform="translate(8, 44)">
    <rect x="0" y="0" width="22" height="28" rx="2" fill="white" stroke="#374151" stroke-width="1"/>
    <path d="M11,10 Q13,6 15,10 Q17,6 19,10 L15,18 Z" fill="#ef4444" stroke="#374151" stroke-width="0.4" transform="scale(1.3) translate(-3, -2)"/>
  </g>
  <g transform="translate(34, 44)">
    <rect x="0" y="0" width="22" height="28" rx="2" fill="white" stroke="#374151" stroke-width="1"/>
    <path d="M11,10 Q13,6 15,10 Q17,6 19,10 L15,18 Z" fill="#ef4444" stroke="#374151" stroke-width="0.4" transform="scale(1.3) translate(-3, -2)"/>
  </g>

  <!-- Row 3: matching stars -->
  <g transform="translate(8, 78)">
    <rect x="0" y="0" width="22" height="20" rx="2" fill="white" stroke="#374151" stroke-width="1"/>
    <polygon points="11,3 13,8 18,8 14,11 15,16 11,13 7,16 8,11 4,8 9,8" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
  </g>
  <g transform="translate(34, 78)">
    <rect x="0" y="0" width="22" height="20" rx="2" fill="white" stroke="#374151" stroke-width="1"/>
    <polygon points="11,3 13,8 18,8 14,11 15,16 11,13 7,16 8,11 4,8 9,8" fill="#3b82f6" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Card being drawn on -->
  <g transform="translate(64, 20)">
    <rect x="0" y="0" width="26" height="32" rx="2" fill="white" stroke="#374151" stroke-width="1.2"/>
    <!-- Cat face being drawn -->
    <circle cx="13" cy="16" r="8" fill="none" stroke="#374151" stroke-width="1"/>
    <!-- Ears -->
    <polygon points="7,10 5,4 10,8" fill="none" stroke="#374151" stroke-width="0.8"/>
    <polygon points="19,10 21,4 16,8" fill="none" stroke="#374151" stroke-width="0.8"/>
    <!-- Eyes -->
    <circle cx="10" cy="14" r="1.5" fill="#374151"/>
    <circle cx="16" cy="14" r="1.5" fill="#374151"/>
    <!-- Whiskers -->
    <line x1="3" y1="18" x2="9" y2="17" stroke="#374151" stroke-width="0.5"/>
    <line x1="17" y1="17" x2="23" y2="18" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Marker drawing -->
  <g transform="translate(78, 10) rotate(30)">
    <rect x="0" y="-3" width="24" height="6" rx="2" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
    <rect x="-3" y="-2.5" width="4" height="5" rx="1" fill="#b91c1c"/>
    <polygon points="-3,-1 -3,1 -5,0" fill="#374151"/>
  </g>

  <!-- Match indicator -->
  <line x1="28" y1="24" x2="36" y2="24" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
</svg>
