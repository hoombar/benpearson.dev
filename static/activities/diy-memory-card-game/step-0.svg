<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper sheet with cut lines (hero) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="72" height="56" rx="1" fill="white" stroke="#374151" stroke-width="1"/>
    <!-- Grid cut lines -->
    <line x1="18" y1="0" x2="18" y2="56" stroke="#374151" stroke-width="0.5" stroke-dasharray="3,2"/>
    <line x1="36" y1="0" x2="36" y2="56" stroke="#374151" stroke-width="0.5" stroke-dasharray="3,2"/>
    <line x1="54" y1="0" x2="54" y2="56" stroke="#374151" stroke-width="0.5" stroke-dasharray="3,2"/>
    <line x1="0" y1="28" x2="72" y2="28" stroke="#374151" stroke-width="0.5" stroke-dasharray="3,2"/>
  </g>

  <!-- Already-cut cards stacked -->
  <g transform="translate(10, 72)">
    <rect x="0" y="0" width="16" height="22" rx="1" fill="white" stroke="#374151" stroke-width="0.8"/>
    <rect x="2" y="-1" width="16" height="22" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
    <rect x="4" y="-2" width="16" height="22" rx="1" fill="white" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Ruler alongside -->
  <g transform="translate(86, 10)">
    <rect x="0" y="0" width="8" height="56" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>
    <line x1="0" y1="10" x2="4" y2="10" stroke="#374151" stroke-width="0.3"/>
    <line x1="0" y1="20" x2="6" y2="20" stroke="#374151" stroke-width="0.3"/>
    <line x1="0" y1="30" x2="4" y2="30" stroke="#374151" stroke-width="0.3"/>
    <line x1="0" y1="40" x2="6" y2="40" stroke="#374151" stroke-width="0.3"/>
    <line x1="0" y1="50" x2="4" y2="50" stroke="#374151" stroke-width="0.3"/>
  </g>

  <!-- Scissors -->
  <g transform="translate(88, 74)">
    <path d="M0,0 L12,4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L12,-4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.2" fill="#374151"/>
    <ellipse cx="16" cy="5" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <ellipse cx="16" cy="-5" rx="4" ry="3" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  </g>

  <!-- Warning -->
  <g transform="translate(54, 72)">
    <polygon points="8,0 0,14 16,14" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <line x1="8" y1="4" x2="8" y2="9" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <circle cx="8" cy="11.5" r="0.7" fill="#374151"/>
  </g>
</svg>
