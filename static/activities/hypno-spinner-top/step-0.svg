<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="95" width="110" height="12" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper sheet -->
  <rect x="10" y="20" width="70" height="72" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>

  <!-- Cup placed upside down on paper (for tracing) -->
  <ellipse cx="45" cy="56" rx="22" ry="4" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <path d="M23,56 L26,30 Q26,26 45,26 Q64,26 64,30 L67,56"
        fill="#dbeafe" stroke="#374151" stroke-width="2" fill-opacity="0.5"/>

  <!-- Traced circle on paper (dashed) -->
  <circle cx="45" cy="56" r="22" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Scissors cutting the circle -->
  <g transform="translate(72, 48) rotate(10)">
    <line x1="0" y1="0" x2="14" y2="-2" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="12" y2="4" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-4" cy="-4" r="3.5" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <circle cx="-4" cy="4" r="3.5" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Cut-out circle result (to the right) -->
  <circle cx="100" cy="56" r="16" fill="#f9fafb" stroke="#374151" stroke-width="2"/>

  <!-- Arrow from traced to cut-out -->
  <line x1="70" y1="70" x2="82" y2="64" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M80 67 L84 63 L79 62" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
