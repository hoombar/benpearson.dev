<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background: floor/pond area -->
  <rect x="0" y="0" width="120" height="120" fill="#dbeafe"/>
  <!-- Floor surface where fish are spread -->
  <rect x="0" y="72" width="120" height="48" fill="#e0f2fe" stroke="none"/>
  <line x1="0" y1="72" x2="120" y2="72" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- Fish spread face-up on floor -->
  <!-- Fish 1: blue, left -->
  <g transform="translate(22, 88)">
    <ellipse cx="0" cy="0" rx="16" ry="9" fill="#93c5fd" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <polygon points="-16,0 -22,-6 -22,6" fill="#3b82f6" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="10" cy="-3" r="3" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <circle cx="11" cy="-3" r="1" fill="#374151"/>
    <!-- Paper clip -->
    <path d="M16,-3 L22,-3 Q26,-3 26,0 Q26,3 22,3 L16,3" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16,-1 L21,-1 Q23,-1 23,0 Q23,1 21,1 L16,1" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Fish 2: red, right -->
  <g transform="translate(86, 95)">
    <ellipse cx="0" cy="0" rx="15" ry="8" fill="#fca5a5" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <polygon points="-15,0 -21,-6 -21,6" fill="#ef4444" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="9" cy="-3" r="3" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <circle cx="10" cy="-3" r="1" fill="#374151"/>
    <!-- Paper clip -->
    <path d="M15,-3 L21,-3 Q25,-3 25,0 Q25,3 21,3 L15,3" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Fish 3: yellow, bottom-centre (target fish for magnet) -->
  <g transform="translate(58, 108)">
    <ellipse cx="0" cy="0" rx="16" ry="9" fill="#fde68a" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <polygon points="-16,0 -22,-6 -22,6" fill="#f59e0b" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="10" cy="-3" r="3" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <circle cx="11" cy="-3" r="1" fill="#374151"/>
    <!-- Paper clip (target for magnet above) -->
    <path d="M16,-3 L22,-3 Q26,-3 26,0 Q26,3 22,3 L16,3" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16,-1 L21,-1 Q23,-1 23,0 Q23,1 21,1 L16,1" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Fishing rod held diagonally at top-right — flat absolute line, no rotation -->
  <!-- Top at (112,8), tip at (88,52); string connects exactly at (88,52) -->
  <line x1="112" y1="8" x2="88" y2="52" stroke="#374151" stroke-width="8" stroke-linecap="round"/>
  <line x1="112" y1="8" x2="88" y2="52" stroke="#fde68a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="88" cy="52" r="3" fill="#d97706" stroke="#374151" stroke-width="1.5"/>

  <!-- String dangling from rod tip (88,52) down to magnet -->
  <line x1="88" y1="52" x2="84" y2="96" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-dasharray="5,3"/>

  <!-- Magnet at string end, lowering toward yellow fish's paper clip -->
  <g transform="translate(84, 90)">
    <rect x="-8" y="-10" width="7" height="10" rx="2" fill="#ef4444" stroke="#374151" stroke-width="2"/>
    <rect x="1" y="-10" width="7" height="10" rx="2" fill="#ef4444" stroke="#374151" stroke-width="2"/>
    <path d="M-4,-10 Q-4,-16 4,-16 Q12,-16 8,-10" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
    <path d="M-4,-10 Q-4,-16 4,-16 Q12,-16 8,-10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <!-- N/S poles -->
    <rect x="-8" y="-2" width="7" height="3" rx="1" fill="#3b82f6" stroke="#374151" stroke-width="1"/>
    <rect x="1" y="-2" width="7" height="3" rx="1" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Dashed line + arrow showing lowering action toward clip -->
  <line x1="84" y1="92" x2="82" y2="102" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>
  <polyline points="79,100 82,104 85,100" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
