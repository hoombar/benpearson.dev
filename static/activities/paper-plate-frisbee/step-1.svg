<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Two rim rings stacked (hero, centre) -->
  <!-- Outer ring -->
  <circle cx="56" cy="50" r="36" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="56" cy="50" r="26" fill="none" stroke="#374151" stroke-width="2"/>
  <!-- Ring fill (the rim) -->
  <path d="M56,14 A36,36 0 1,1 55.99,14 Z" fill="#f9fafb" stroke="none"/>
  <path d="M56,24 A26,26 0 1,1 55.99,24 Z" fill="#fef3c7" stroke="none"/>
  <circle cx="56" cy="50" r="36" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="56" cy="50" r="26" fill="none" stroke="#374151" stroke-width="1.5"/>

  <!-- Tape strips wrapping around -->
  <rect x="18" y="48" width="8" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6" opacity="0.8"/>
  <rect x="88" y="48" width="8" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6" opacity="0.8"/>
  <rect x="54" y="12" width="5" height="8" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6" opacity="0.8"/>
  <rect x="54" y="82" width="5" height="8" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6" opacity="0.8"/>
  <rect x="28" y="22" width="6" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6" opacity="0.8" transform="rotate(-40 31 24.5)"/>
  <rect x="78" y="22" width="6" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6" opacity="0.8" transform="rotate(40 81 24.5)"/>
  <rect x="28" y="74" width="6" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6" opacity="0.8" transform="rotate(40 31 76.5)"/>
  <rect x="78" y="74" width="6" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6" opacity="0.8" transform="rotate(-40 81 76.5)"/>

  <!-- Tape roll -->
  <circle cx="106" cy="86" r="8" fill="#fde68a" stroke="#374151" stroke-width="1.2"/>
  <circle cx="106" cy="86" r="3" fill="#fef3c7" stroke="#374151" stroke-width="0.7"/>
</svg>