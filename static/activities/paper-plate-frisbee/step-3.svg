<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect x="0" y="0" width="120" height="80" fill="#dbeafe" stroke="none"/>
  <!-- Grass ground -->
  <rect x="0" y="80" width="120" height="40" fill="#86efac" stroke="none"/>
  <line x1="0" y1="80" x2="120" y2="80" stroke="#374151" stroke-width="1.5"/>

  <!-- Frisbee flying through air (hero, tilted) -->
  <g transform="translate(70,28) rotate(-15)">
    <ellipse cx="0" cy="0" rx="18" ry="4" fill="none" stroke="#374151" stroke-width="1.5"/>
    <!-- Colour segments -->
    <path d="M-18,0 A18,4 0 0,1 0,-4 L0,-2 A13,3 0 0,0 -13,0 Z" fill="#ef4444" stroke="none"/>
    <path d="M0,-4 A18,4 0 0,1 18,0 L13,0 A13,3 0 0,0 0,-2 Z" fill="#3b82f6" stroke="none"/>
    <path d="M18,0 A18,4 0 0,1 0,4 L0,2 A13,3 0 0,0 13,0 Z" fill="#22c55e" stroke="none"/>
    <path d="M0,4 A18,4 0 0,1 -18,0 L-13,0 A13,3 0 0,0 0,2 Z" fill="#fbbf24" stroke="none"/>
    <ellipse cx="0" cy="0" rx="18" ry="4" fill="none" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Motion lines behind frisbee -->
  <line x1="46" y1="32" x2="38" y2="36" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="48" y1="28" x2="40" y2="30" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="50" y1="24" x2="42" y2="24" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Spin lines -->
  <path d="M60,22 Q66,18 72,22" fill="none" stroke="#374151" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Stick figure throwing (left) -->
  <circle cx="22" cy="56" r="5" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>
  <line x1="22" y1="61" x2="22" y2="82" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="82" x2="16" y2="100" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="22" y1="82" x2="28" y2="100" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Throwing arm extended -->
  <line x1="22" y1="66" x2="38" y2="56" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Other arm back -->
  <line x1="22" y1="66" x2="14" y2="72" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Target on ground -->
  <ellipse cx="96" cy="90" rx="14" ry="5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <ellipse cx="96" cy="90" rx="8" ry="3" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
  <ellipse cx="96" cy="90" rx="3" ry="1.5" fill="#ef4444" stroke="none"/>

  <!-- Cloud -->
  <ellipse cx="110" cy="14" rx="10" ry="4" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>
  <ellipse cx="104" cy="12" rx="6" ry="3.5" fill="#f9fafb" stroke="none"/>
</svg>