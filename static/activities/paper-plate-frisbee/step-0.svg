<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate (hero, with centre being cut out) -->
  <circle cx="54" cy="50" r="36" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Inner cut circle (dashed) -->
  <circle cx="54" cy="50" r="24" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Cut-out centre piece (partially detached) -->
  <circle cx="54" cy="50" r="22" fill="#f9fafb" stroke="#374151" stroke-width="1" opacity="0.4"/>

  <!-- Scissors cutting along circle -->
  <g transform="translate(78,36) rotate(45)">
    <path d="M0,0 L-12,-3" stroke="#374151" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M0,0 L-12,3" stroke="#374151" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <ellipse cx="2" cy="-3" rx="4" ry="2.5" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="2" cy="3" rx="4" ry="2.5" fill="#ef4444" stroke="#374151" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="1.2" fill="#374151" stroke="none"/>
  </g>

  <!-- Second plate waiting (behind) -->
  <circle cx="100" cy="80" r="16" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>

  <!-- Cut-out centre piece (removed, shown aside) -->
  <circle cx="106" cy="28" r="12" fill="#f9fafb" stroke="#374151" stroke-width="0.8" opacity="0.4"/>

  <!-- Arrow showing "cut out" -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M54,50 Q72,36 90,30" fill="none" stroke="#374151" stroke-width="1" marker-end="url(#arr)" stroke-dasharray="2,2"/>
</svg>