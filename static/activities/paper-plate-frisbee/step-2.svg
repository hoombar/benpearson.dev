<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="5" y="100" width="110" height="10" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Decorated frisbee ring (hero) -->
  <!-- Outer edge -->
  <circle cx="56" cy="50" r="36" fill="none" stroke="#374151" stroke-width="2"/>
  <!-- Inner edge -->
  <circle cx="56" cy="50" r="26" fill="none" stroke="#374151" stroke-width="1.5"/>

  <!-- Colourful rim fill -->
  <!-- Segments of colour -->
  <path d="M56,14 A36,36 0 0,1 92,50 L82,50 A26,26 0 0,0 56,24 Z" fill="#ef4444" stroke="none"/>
  <path d="M92,50 A36,36 0 0,1 56,86 L56,76 A26,26 0 0,0 82,50 Z" fill="#3b82f6" stroke="none"/>
  <path d="M56,86 A36,36 0 0,1 20,50 L30,50 A26,26 0 0,0 56,76 Z" fill="#22c55e" stroke="none"/>
  <path d="M20,50 A36,36 0 0,1 56,14 L56,24 A26,26 0 0,0 30,50 Z" fill="#fbbf24" stroke="none"/>

  <!-- Re-draw edges on top -->
  <circle cx="56" cy="50" r="36" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="56" cy="50" r="26" fill="none" stroke="#374151" stroke-width="1.5"/>

  <!-- Star stickers -->
  <path d="M56,16 L57,13 L58,16 L61,16 L59,18 L60,21 L57,19 L54,21 L55,18 L52,16 Z"
        fill="#f59e0b" stroke="#374151" stroke-width="0.3"/>
  <path d="M56,80 L57,77 L58,80 L61,80 L59,82 L60,85 L57,83 L54,85 L55,82 L52,80 Z"
        fill="#f59e0b" stroke="#374151" stroke-width="0.3"/>

  <!-- Lightning bolt decoration -->
  <path d="M84,38 L80,46 L84,46 L80,54" fill="none" stroke="#f9fafb" stroke-width="2" stroke-linecap="round"/>

  <!-- Marker pen -->
  <line x1="106" y1="30" x2="98" y2="44" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="95.5" y="44" width="5" height="5" rx="1" fill="#fca5a5" stroke="#374151" stroke-width="0.6"/>
</svg>