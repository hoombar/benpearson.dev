<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Twig (hero) -->
  <g transform="translate(60, 60) rotate(-15)">
    <rect x="-3" y="-50" width="6" height="100" fill="#d97706" stroke="#374151" stroke-width="2"/>
    
    <!-- Foil wrapped at the top -->
    <path d="M-5,-50 L5,-50 L7,-20 L-7,-20 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <!-- Foil wrinkles -->
    <line x1="-3" y1="-40" x2="3" y2="-45" stroke="#374151" stroke-width="1"/>
    <line x1="-4" y1="-30" x2="4" y2="-32" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Sheet of foil being brought in -->
  <rect x="80" y="20" width="25" height="25" fill="#f3f4f6" stroke="#374151" stroke-width="1.5" transform="rotate(15 92 32)"/>

  <!-- Action arrow -->
  <path d="M85,35 Q75,45 65,40" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>