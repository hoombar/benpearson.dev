<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Twig with foil -->
  <g transform="translate(60, 60) rotate(-15)">
    <rect x="-3" y="-50" width="6" height="100" fill="#d97706" stroke="#374151" stroke-width="2"/>
    <path d="M-5,-50 L5,-50 L7,-20 L-7,-20 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    
    <!-- String handle wrapping -->
    <path d="M-3,-15 L3,-15 M-3,-10 L3,-10 M-3,-5 L3,-5 M-3,0 L3,0 M-3,5 L3,5 M-3,10 L3,10" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- String spool -->
  <g transform="translate(90, 80) scale(0.6)">
    <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#ef4444" stroke="#374151" stroke-width="2"/>
    <path d="M-15,-10 L15,-10 M-15,-5 L15,-5 M-15,0 L15,0 M-15,5 L15,5 M-15,10 L15,10" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Action arrow wrapping around -->
  <path d="M80,70 Q60,80 55,60" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>