<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Grass/Nature background -->
  <path d="M0,100 Q30,90 60,100 Q90,110 120,100 L120,120 L0,120 Z" fill="#86efac" opacity="0.3"/>
  <path d="M10,95 L12,85 M15,97 L18,88 M80,105 L82,95" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Twig (hero) -->
  <g transform="translate(60, 60) rotate(45)">
    <path d="M-2,-40 L2,-40 L3,40 L-3,40 Z" fill="#d97706" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <!-- Small offshoot -->
    <path d="M2,0 L10,-10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Action arrow for picking up -->
  <path d="M40,90 Q30,75 50,55" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
</svg>