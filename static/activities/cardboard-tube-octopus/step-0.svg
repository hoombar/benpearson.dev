<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Cardboard tube (hero, unpainted) -->
  <g transform="translate(30, 20)">
    <!-- Tube body -->
    <rect x="0" y="0" width="30" height="70" rx="2" fill="#d4a574" stroke="#374151" stroke-width="1.5"/>
    <!-- Top opening ellipse -->
    <ellipse cx="15" cy="2" rx="15" ry="5" fill="#c4956a" stroke="#374151" stroke-width="1.2"/>
    <!-- Cardboard texture lines -->
    <line x1="8" y1="14" x2="8" y2="64" stroke="#c4956a" stroke-width="0.5" opacity="0.5"/>
    <line x1="22" y1="14" x2="22" y2="64" stroke="#c4956a" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Paint being applied - purple stroke on tube -->
  <rect x="30" y="30" width="30" height="40" rx="2" fill="#a855f7" stroke="#374151" stroke-width="1" opacity="0.7"/>

  <!-- Paintbrush applying paint -->
  <g transform="translate(62, 38)">
    <!-- Brush handle -->
    <rect x="0" y="-3" width="36" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="1"/>
    <!-- Ferrule -->
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.8"/>
    <!-- Bristles with paint -->
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#a855f7" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Paint pot -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="24" height="22" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
    <!-- Paint inside -->
    <rect x="2" y="4" width="20" height="16" rx="1" fill="#a855f7" stroke="none"/>
    <!-- Rim -->
    <rect x="-1" y="-2" width="26" height="5" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="0.8"/>
    <!-- Paint drip -->
    <path d="M22,3 Q24,8 22,12" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Motion arrow showing brush direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a855f7"/>
    </marker>
  </defs>
  <path d="M56,60 Q54,68 56,76" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
