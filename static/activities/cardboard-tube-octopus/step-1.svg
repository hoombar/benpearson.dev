<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Painted purple tube with cuts being made (hero) -->
  <g transform="translate(25, 14)">
    <!-- Tube body - painted purple -->
    <rect x="0" y="0" width="34" height="76" rx="2" fill="#a855f7" stroke="#374151" stroke-width="1.5"/>
    <!-- Top opening ellipse -->
    <ellipse cx="17" cy="2" rx="17" ry="5" fill="#9333ea" stroke="#374151" stroke-width="1.2"/>

    <!-- Cut lines (bottom half - 8 strips) -->
    <line x1="4" y1="40" x2="4" y2="76" stroke="#374151" stroke-width="0.6" stroke-dasharray="2,2"/>
    <line x1="8.5" y1="40" x2="8.5" y2="76" stroke="#374151" stroke-width="0.6" stroke-dasharray="2,2"/>
    <line x1="13" y1="40" x2="13" y2="76" stroke="#374151" stroke-width="0.6" stroke-dasharray="2,2"/>
    <line x1="17" y1="40" x2="17" y2="76" stroke="#374151" stroke-width="0.6" stroke-dasharray="2,2"/>
    <line x1="21.5" y1="40" x2="21.5" y2="76" stroke="#374151" stroke-width="0.6" stroke-dasharray="2,2"/>
    <line x1="26" y1="40" x2="26" y2="76" stroke="#374151" stroke-width="0.6" stroke-dasharray="2,2"/>
    <line x1="30" y1="40" x2="30" y2="76" stroke="#374151" stroke-width="0.6" stroke-dasharray="2,2"/>

    <!-- Halfway mark line -->
    <line x1="-3" y1="40" x2="37" y2="40" stroke="#374151" stroke-width="0.5" stroke-dasharray="3,2"/>
  </g>

  <!-- Scissors cutting bottom of tube -->
  <g transform="translate(64, 68) rotate(-20)">
    <!-- Blade 1 -->
    <path d="M0,0 L18,5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Blade 2 -->
    <path d="M0,0 L18,-5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Pivot -->
    <circle cx="0" cy="0" r="1.5" fill="#374151"/>
    <!-- Handle 1 -->
    <ellipse cx="22" cy="6" rx="5" ry="4" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <!-- Handle 2 -->
    <ellipse cx="22" cy="-6" rx="5" ry="4" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Arrow showing cutting direction (upward) -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="18" y1="88" x2="18" y2="58" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Warning symbol for adult help -->
  <g transform="translate(96, 6)">
    <polygon points="10,0 0,18 20,18" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <line x1="10" y1="5" x2="10" y2="12" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="10" cy="15" r="1" fill="#374151"/>
  </g>
</svg>
