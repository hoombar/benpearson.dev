<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Hanging string from top -->
  <line x1="60" y1="0" x2="60" y2="14" stroke="#374151" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Completed octopus hanging (hero) -->
  <g transform="translate(30, 14)">
    <!-- Tube body -->
    <rect x="0" y="0" width="34" height="36" rx="2" fill="#a855f7" stroke="#374151" stroke-width="1.5"/>
    <!-- Top opening with string hole -->
    <ellipse cx="17" cy="2" rx="17" ry="5" fill="#9333ea" stroke="#374151" stroke-width="1.2"/>

    <!-- Googly eyes -->
    <circle cx="10" cy="16" r="5" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="10" cy="17" r="2.5" fill="#374151"/>
    <circle cx="24" cy="16" r="5" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="24" cy="17" r="2.5" fill="#374151"/>

    <!-- Smile -->
    <path d="M10,26 Q17,32 24,26" fill="none" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Rosy cheeks -->
    <circle cx="6" cy="24" r="2.5" fill="#fda4af" opacity="0.6"/>
    <circle cx="28" cy="24" r="2.5" fill="#fda4af" opacity="0.6"/>

    <!-- Curling tentacles -->
    <path d="M2,36 Q-10,52 -2,66" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
    <path d="M6,36 Q-2,50 4,62" fill="none" stroke="#9333ea" stroke-width="3" stroke-linecap="round"/>
    <path d="M11,36 Q8,52 12,66" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
    <path d="M15,36 Q16,50 18,64" fill="none" stroke="#9333ea" stroke-width="3" stroke-linecap="round"/>
    <path d="M19,36 Q18,50 16,64" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
    <path d="M23,36 Q26,52 22,66" fill="none" stroke="#9333ea" stroke-width="3" stroke-linecap="round"/>
    <path d="M28,36 Q36,50 30,62" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
    <path d="M32,36 Q44,52 36,66" fill="none" stroke="#9333ea" stroke-width="3" stroke-linecap="round"/>

    <!-- Suction cup dots on tentacles -->
    <circle cx="-4" cy="56" r="1" fill="#d8b4fe" stroke="#9333ea" stroke-width="0.3"/>
    <circle cx="4" cy="52" r="1" fill="#d8b4fe" stroke="#9333ea" stroke-width="0.3"/>
    <circle cx="12" cy="56" r="1" fill="#d8b4fe" stroke="#9333ea" stroke-width="0.3"/>
    <circle cx="22" cy="56" r="1" fill="#d8b4fe" stroke="#9333ea" stroke-width="0.3"/>
    <circle cx="30" cy="52" r="1" fill="#d8b4fe" stroke="#9333ea" stroke-width="0.3"/>
    <circle cx="38" cy="56" r="1" fill="#d8b4fe" stroke="#9333ea" stroke-width="0.3"/>
  </g>

  <!-- Markers nearby -->
  <g transform="translate(86, 80)">
    <rect x="0" y="0" width="6" height="22" rx="2" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="0" width="6" height="4" rx="1" fill="#b91c1c" stroke="#374151" stroke-width="0.4"/>
  </g>
  <g transform="translate(96, 82)">
    <rect x="0" y="0" width="6" height="20" rx="2" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="0" width="6" height="4" rx="1" fill="#1d4ed8" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Googly eye spare -->
  <circle cx="80" cy="96" r="4" fill="white" stroke="#374151" stroke-width="0.6"/>
  <circle cx="80" cy="97" r="2" fill="#374151"/>
</svg>
