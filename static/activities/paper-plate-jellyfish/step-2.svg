<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate flipped (unpainted side up, hero) -->
  <ellipse cx="54" cy="36" rx="36" ry="28" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="54" cy="36" rx="26" ry="20" fill="none" stroke="#d1d5db" stroke-width="0.6"/>

  <!-- Tape pieces holding strips -->
  <rect x="28" y="56" width="8" height="4" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.4"/>
  <rect x="42" y="58" width="8" height="4" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.4"/>
  <rect x="56" y="58" width="8" height="4" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.4"/>
  <rect x="70" y="56" width="8" height="4" rx="1" fill="#d1fae5" stroke="#374151" stroke-width="0.4"/>

  <!-- Dangling tentacle strips -->
  <path d="M32,60 Q34,72 30,84 Q28,92 32,98" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M46,62 Q48,74 44,86 Q42,94 46,98" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M60,62 Q62,74 58,86 Q56,94 60,98" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M74,60 Q76,72 72,84 Q70,92 74,98" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Hand placing tape -->
  <g transform="translate(82, 48)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="16" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Tape roll -->
  <g transform="translate(96, 14)">
    <ellipse cx="10" cy="10" rx="10" ry="10" fill="#d1fae5" stroke="#374151" stroke-width="0.8"/>
    <ellipse cx="10" cy="10" rx="4" ry="4" fill="#fef3c7" stroke="#374151" stroke-width="0.4"/>
  </g>

  <!-- Arrow showing attachment direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="88" y1="66" x2="80" y2="60" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
