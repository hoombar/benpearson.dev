<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Tissue paper sheet being cut (hero) -->
  <rect x="10" y="20" width="60" height="50" rx="1" fill="#c084fc" stroke="#374151" stroke-width="0.8" opacity="0.7"/>

  <!-- Cut strips -->
  <rect x="10" y="20" width="8" height="50" rx="1" fill="#c084fc" stroke="#374151" stroke-width="0.6" opacity="0.8"/>
  <rect x="20" y="20" width="8" height="50" rx="1" fill="#818cf8" stroke="#374151" stroke-width="0.6" opacity="0.8"/>
  <rect x="30" y="20" width="8" height="50" rx="1" fill="#f472b6" stroke="#374151" stroke-width="0.6" opacity="0.8"/>

  <!-- Cut lines (dashed) -->
  <line x1="18" y1="20" x2="18" y2="70" stroke="#374151" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="28" y1="20" x2="28" y2="70" stroke="#374151" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="38" y1="20" x2="38" y2="70" stroke="#374151" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="48" y1="20" x2="48" y2="70" stroke="#374151" stroke-width="0.5" stroke-dasharray="3,2"/>

  <!-- Scissors -->
  <g transform="translate(44, 12) rotate(0)">
    <path d="M0,0 L14,5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,0 L14,-5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#374151"/>
    <ellipse cx="18" cy="6" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <ellipse cx="18" cy="-6" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  </g>

  <!-- Curled strip with pencil -->
  <g transform="translate(76, 30)">
    <!-- Pencil -->
    <rect x="0" y="0" width="6" height="50" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <polygon points="3,50 0,56 6,56" fill="#f5deb3" stroke="#374151" stroke-width="0.5"/>
    <!-- Tissue wrapped around -->
    <path d="M-2,10 Q10,14 -2,20 Q10,24 -2,30 Q10,34 -2,40" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Finished curled strips -->
  <path d="M90,24 Q96,30 90,36 Q96,42 90,48 Q96,54 90,60" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M100,28 Q106,34 100,40 Q106,46 100,52 Q106,58 100,64" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
</svg>
