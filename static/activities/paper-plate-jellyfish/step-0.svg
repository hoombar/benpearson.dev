<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate (hero) -->
  <ellipse cx="50" cy="52" rx="38" ry="36" fill="#c084fc" stroke="#374151" stroke-width="1.5"/>
  <!-- Plate rim ring -->
  <ellipse cx="50" cy="52" rx="28" ry="26" fill="none" stroke="#a855f7" stroke-width="0.8" opacity="0.5"/>
  <!-- Paint swirls showing wet paint -->
  <path d="M36,42 Q44,38 52,44" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M42,56 Q54,52 60,58" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M34,62 Q42,66 54,62" fill="none" stroke="#7c3aed" stroke-width="1" stroke-linecap="round"/>

  <!-- Paintbrush painting -->
  <g transform="translate(70, 28) rotate(25)">
    <rect x="0" y="-3" width="28" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#a855f7" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pots -->
  <g transform="translate(94, 56)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
    <rect x="2" y="3" width="12" height="11" rx="1" fill="#a855f7"/>
  </g>
  <g transform="translate(94, 74)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="0.6"/>
    <rect x="2" y="3" width="12" height="11" rx="1" fill="#3b82f6"/>
  </g>
</svg>
