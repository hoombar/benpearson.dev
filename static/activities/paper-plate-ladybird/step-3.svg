<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Completed ladybird standing up (hero) -->
  <g transform="translate(16, 14)">
    <!-- Folded plate body (slightly open, standing) -->
    <path d="M0,72 Q40,-6 80,72" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <line x1="0" y1="72" x2="80" y2="72" stroke="#374151" stroke-width="1.5"/>
    <!-- Centre fold line -->
    <line x1="40" y1="8" x2="40" y2="72" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/>
    <!-- Black head -->
    <path d="M30,70 Q40,58 50,70" fill="#374151" stroke="#374151" stroke-width="1"/>

    <!-- Spots left -->
    <circle cx="22" cy="38" r="5" fill="#374151"/>
    <circle cx="16" cy="54" r="4.5" fill="#374151"/>
    <circle cx="30" cy="56" r="4" fill="#374151"/>
    <!-- Spots right -->
    <circle cx="58" cy="38" r="5" fill="#374151"/>
    <circle cx="64" cy="54" r="4.5" fill="#374151"/>
    <circle cx="50" cy="56" r="4" fill="#374151"/>

    <!-- Antennae with spirals -->
    <path d="M38,58 Q30,42 20,30 Q14,24 16,18" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <circle cx="16" cy="16" r="4" fill="none" stroke="#374151" stroke-width="2"/>
    <path d="M42,58 Q50,42 60,30 Q66,24 64,18" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <circle cx="64" cy="16" r="4" fill="none" stroke="#374151" stroke-width="2"/>

    <!-- Googly eyes -->
    <circle cx="36" cy="64" r="4" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="36" cy="65" r="2" fill="#374151"/>
    <circle cx="44" cy="64" r="4" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="44" cy="65" r="2" fill="#374151"/>

    <!-- Smile -->
    <path d="M36,72 Q40,76 44,72" fill="none" stroke="white" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Spare googly eye -->
  <circle cx="104" cy="92" r="4" fill="white" stroke="#374151" stroke-width="0.6"/>
  <circle cx="104" cy="93" r="2" fill="#374151"/>

  <!-- Marker -->
  <g transform="translate(100, 68)">
    <rect x="0" y="0" width="6" height="22" rx="2" fill="#374151" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="0" width="6" height="4" rx="1" fill="#1f2937" stroke="#374151" stroke-width="0.4"/>
  </g>
</svg>
