<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Folded plate - ladybird shape (hero) -->
  <g transform="translate(14, 14)">
    <!-- Folded half-plate body (side view, slightly open) -->
    <path d="M0,70 Q40,-10 80,70" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Bottom flat edge -->
    <line x1="0" y1="70" x2="80" y2="70" stroke="#374151" stroke-width="1.5"/>

    <!-- Centre fold line -->
    <line x1="40" y1="4" x2="40" y2="70" stroke="#374151" stroke-width="1.2" stroke-dasharray="3,3"/>

    <!-- Black head section -->
    <path d="M30,68 Q40,56 50,68" fill="#374151" stroke="#374151" stroke-width="1"/>

    <!-- Black spots on left wing -->
    <circle cx="22" cy="38" r="5" fill="#374151"/>
    <circle cx="16" cy="54" r="4.5" fill="#374151"/>
    <circle cx="30" cy="56" r="4" fill="#374151"/>

    <!-- Black spots on right wing (symmetrical) -->
    <circle cx="58" cy="38" r="5" fill="#374151"/>
    <circle cx="64" cy="54" r="4.5" fill="#374151"/>
    <circle cx="50" cy="56" r="4" fill="#374151"/>
  </g>

  <!-- Marker adding spots -->
  <g transform="translate(78, 30) rotate(40)">
    <rect x="0" y="-4" width="30" height="8" rx="2" fill="#374151" stroke="#374151" stroke-width="0.8"/>
    <rect x="-4" y="-3.5" width="5" height="7" rx="1.5" fill="#1f2937" stroke="#374151" stroke-width="0.4"/>
    <polygon points="-4,-1.5 -4,1.5 -7,0" fill="#374151"/>
  </g>

  <!-- Arrow showing symmetry -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="36" y1="86" x2="26" y2="86" stroke="#374151" stroke-width="0.8" marker-end="url(#arr)"/>
  <line x1="68" y1="86" x2="78" y2="86" stroke="#374151" stroke-width="0.8" marker-end="url(#arr)"/>
</svg>
