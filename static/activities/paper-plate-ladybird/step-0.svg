<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate being painted red (hero) -->
  <g transform="translate(16, 18)">
    <!-- Plate -->
    <ellipse cx="38" cy="38" rx="38" ry="36" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Plate rim ring -->
    <ellipse cx="38" cy="38" rx="38" ry="36" fill="none" stroke="#dc2626" stroke-width="1" opacity="0.5"/>
    <!-- Inner plate area still white -->
    <ellipse cx="38" cy="38" rx="26" ry="24" fill="white" stroke="none" opacity="0.3"/>
  </g>

  <!-- Paintbrush applying red paint -->
  <g transform="translate(68, 34) rotate(25)">
    <!-- Handle -->
    <rect x="0" y="-3" width="34" height="6" rx="2" fill="#92400e" stroke="#374151" stroke-width="0.8"/>
    <!-- Ferrule -->
    <rect x="-4" y="-4" width="6" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
    <!-- Bristles -->
    <rect x="-10" y="-5" width="7" height="10" rx="1" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint pot -->
  <g transform="translate(84, 66)">
    <rect x="0" y="0" width="22" height="24" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
    <rect x="2" y="4" width="18" height="18" rx="1" fill="#ef4444" stroke="none"/>
    <rect x="-1" y="-2" width="24" height="5" rx="2" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Painting motion arrow -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>
  <path d="M58,64 Q50,70 44,66" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
