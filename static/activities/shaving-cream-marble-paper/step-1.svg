<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Tray with cream surface (hero) -->
  <rect x="8" y="60" width="104" height="48" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="2.5"/>
  <rect x="14" y="66" width="92" height="36" rx="2" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Cream surface texture -->
  <path d="M14 70 Q22 64 30 70 Q38 64 46 70 Q54 64 62 70 Q70 64 78 70 Q86 64 94 70 Q102 64 106 70" fill="none" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
  <!-- Colour swirls in the cream — S-curves -->
  <path d="M26 76 Q34 68 42 76 Q50 84 58 76 Q66 68 74 76 Q82 84 90 76" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <path d="M22 88 Q32 80 42 88 Q52 96 62 88 Q72 80 82 88 Q92 96 100 88" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <path d="M30 82 Q42 74 54 82 Q66 90 78 82 Q88 74 98 82" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <!-- Food colouring drops (source bottles top area) -->
  <!-- Red bottle -->
  <rect x="14" y="22" width="10" height="24" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <rect x="14" y="16" width="10" height="8" rx="3" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
  <!-- Blue bottle -->
  <rect x="54" y="20" width="10" height="24" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <rect x="54" y="14" width="10" height="8" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
  <!-- Yellow bottle -->
  <rect x="94" y="22" width="10" height="24" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <rect x="94" y="16" width="10" height="8" rx="3" fill="#f59e0b" stroke="#374151" stroke-width="1.5"/>
  <!-- Dashed drop lines from bottles into cream -->
  <line x1="19" y1="46" x2="30" y2="70" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" stroke-linecap="round"/>
  <line x1="59" y1="44" x2="60" y2="70" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3" stroke-linecap="round"/>
  <line x1="99" y1="46" x2="90" y2="70" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3" stroke-linecap="round"/>
  <!-- Pen swirling in the cream -->
  <line x1="60" y1="10" x2="60" y2="62" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M57 62 L60 68 L63 62" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="#374151"/>
  <!-- Arc showing swirling motion -->
  <path d="M46 56 Q60 48 74 56" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>
</svg>
