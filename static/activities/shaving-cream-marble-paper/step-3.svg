<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Marble paper (hero — result) -->
  <rect x="10" y="58" width="100" height="54" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2.5"/>
  <!-- Marble colour swirls — revealed pattern -->
  <path d="M14 66 Q26 60 38 70 Q50 80 62 70 Q74 60 86 70 Q98 80 106 70" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 78 Q24 68 36 78 Q48 88 60 78 Q72 68 84 78 Q96 88 106 78" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 90 Q28 82 42 90 Q56 98 70 90 Q84 82 98 90 Q106 94 108 90" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 102 Q30 94 46 102 Q62 110 78 102 Q94 94 108 102" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <!-- Ruler scraping cream off (top of paper) -->
  <rect x="10" y="48" width="100" height="8" rx="2" fill="#fde68a" stroke="#374151" stroke-width="2"/>
  <!-- Ruler markings -->
  <line x1="22" y1="48" x2="22" y2="52" stroke="#374151" stroke-width="1"/>
  <line x1="34" y1="48" x2="34" y2="52" stroke="#374151" stroke-width="1"/>
  <line x1="46" y1="48" x2="46" y2="52" stroke="#374151" stroke-width="1"/>
  <line x1="58" y1="48" x2="58" y2="52" stroke="#374151" stroke-width="1"/>
  <line x1="70" y1="48" x2="70" y2="52" stroke="#374151" stroke-width="1"/>
  <line x1="82" y1="48" x2="82" y2="52" stroke="#374151" stroke-width="1"/>
  <line x1="94" y1="48" x2="94" y2="52" stroke="#374151" stroke-width="1"/>
  <!-- Cream blob being scraped to the side -->
  <ellipse cx="104" cy="52" rx="10" ry="6" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
  <path d="M94 50 Q100 46 110 50" fill="none" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
  <!-- Arrow: ruler dragging right -->
  <path d="M22 40 L90 40" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
  <!-- Scrape reveals paper — small area near ruler showing pattern starting to show -->
  <rect x="10" y="56" width="100" height="4" rx="0" fill="#fef9c3" opacity="0.5"/>
</svg>
