<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Tray with swirled cream below -->
  <rect x="8" y="74" width="104" height="38" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="2.5"/>
  <rect x="14" y="80" width="92" height="26" rx="2" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Swirled cream colours -->
  <path d="M18 88 Q30 80 42 88 Q54 96 66 88 Q78 80 90 88 Q102 96 106 88" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <path d="M18 96 Q28 88 40 96 Q52 104 64 96 Q76 88 88 96 Q100 104 106 96" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <!-- Paper being pressed face-down onto cream (hero) -->
  <rect x="14" y="56" width="92" height="24" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
  <!-- Paper texture lines -->
  <line x1="14" y1="62" x2="106" y2="62" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="14" y1="68" x2="106" y2="68" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Downward arrows showing pressing action -->
  <path d="M35 44 L35 54" stroke="#374151" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
  <path d="M60 44 L60 54" stroke="#374151" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
  <path d="M85 44 L85 54" stroke="#374151" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
  <!-- "30s" wait indicator -->
  <circle cx="60" cy="30" r="14" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <path d="M60 18 L60 30 L68 30" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Clock tick marks -->
  <line x1="60" y1="17" x2="60" y2="19" stroke="#374151" stroke-width="1.5"/>
  <line x1="60" y1="41" x2="60" y2="43" stroke="#374151" stroke-width="1.5"/>
  <line x1="73" y1="30" x2="74" y2="30" stroke="#374151" stroke-width="1.5"/>
  <line x1="46" y1="30" x2="47" y2="30" stroke="#374151" stroke-width="1.5"/>
</svg>
