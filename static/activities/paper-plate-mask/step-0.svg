<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate (hero) -->
  <circle cx="52" cy="50" r="38" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <!-- Plate rim -->
  <circle cx="52" cy="50" r="32" fill="none" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Pencil marks for eye positions -->
  <circle cx="40" cy="44" r="3" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="64" cy="44" r="3" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Light sketch lines for lion face -->
  <!-- Nose -->
  <path d="M49,54 L52,58 L55,54" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2,2"/>
  <!-- Mouth -->
  <path d="M46,62 Q52,68 58,62" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2,2"/>
  <!-- Ear outlines -->
  <path d="M24,26 Q20,14 30,18" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2,2"/>
  <path d="M80,26 Q84,14 74,18" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Marker pen -->
  <g transform="translate(86, 42) rotate(-20)">
    <rect x="0" y="0" width="6" height="30" rx="2" fill="#374151" stroke="#374151" stroke-width="0.8"/>
    <rect x="0.5" y="30" width="5" height="4" rx="1" fill="#1f2937" stroke="#374151" stroke-width="0.5"/>
    <!-- Cap -->
    <rect x="-0.5" y="-6" width="7" height="8" rx="2" fill="#374151" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Thought bubble showing lion face idea -->
  <g transform="translate(84, 6)">
    <ellipse cx="14" cy="12" rx="16" ry="12" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>
    <!-- Mini lion face inside -->
    <circle cx="14" cy="12" r="6" fill="#fbbf24" stroke="#374151" stroke-width="0.5"/>
    <circle cx="11" cy="10" r="1" fill="#374151"/>
    <circle cx="17" cy="10" r="1" fill="#374151"/>
    <path d="M12,14 Q14,16 16,14" fill="none" stroke="#374151" stroke-width="0.5"/>
    <!-- Thought dots -->
    <circle cx="2" cy="26" r="1.5" fill="#f9fafb" stroke="#374151" stroke-width="0.5"/>
    <circle cx="0" cy="30" r="1" fill="#f9fafb" stroke="#374151" stroke-width="0.5"/>
  </g>
</svg>
