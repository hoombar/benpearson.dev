<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="120" height="120" fill="#f3f4f6" stroke="none"/>

  <!-- Child's head silhouette (from front) -->
  <ellipse cx="60" cy="48" rx="28" ry="32" fill="#fcd9b6" stroke="#374151" stroke-width="1.2"/>

  <!-- Hair -->
  <path d="M32,36 Q32,12 60,12 Q88,12 88,36" fill="#92400e" stroke="#374151" stroke-width="1"/>

  <!-- Mask worn on face -->
  <circle cx="60" cy="46" r="30" fill="#fbbf24" stroke="#374151" stroke-width="1.2"/>

  <!-- Mane -->
  <circle cx="60" cy="46" r="30" fill="none" stroke="#f97316" stroke-width="5" stroke-dasharray="6,3" opacity="0.7"/>

  <!-- Inner face -->
  <circle cx="60" cy="50" r="18" fill="#fde68a" stroke="none"/>

  <!-- Eye holes with eyes peeking through -->
  <ellipse cx="50" cy="42" rx="6" ry="4" fill="#fcd9b6" stroke="#374151" stroke-width="1"/>
  <circle cx="50" cy="42" r="2" fill="#374151"/>
  <ellipse cx="70" cy="42" rx="6" ry="4" fill="#fcd9b6" stroke="#374151" stroke-width="1"/>
  <circle cx="70" cy="42" r="2" fill="#374151"/>

  <!-- Nose -->
  <path d="M56,50 L60,54 L64,50 Z" fill="#374151" stroke="#374151" stroke-width="0.6"/>

  <!-- Mouth -->
  <path d="M60,54 L60,58" stroke="#374151" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M54,58 Q60,63 66,58" fill="none" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Whisker dots -->
  <circle cx="52" cy="54" r="0.8" fill="#374151"/>
  <circle cx="49" cy="52" r="0.8" fill="#374151"/>
  <circle cx="68" cy="54" r="0.8" fill="#374151"/>
  <circle cx="71" cy="52" r="0.8" fill="#374151"/>

  <!-- Ears -->
  <path d="M34,22 Q30,10 40,14" fill="#fbbf24" stroke="#374151" stroke-width="1"/>
  <path d="M86,22 Q90,10 80,14" fill="#fbbf24" stroke="#374151" stroke-width="1"/>

  <!-- String going around head -->
  <line x1="30" y1="46" x2="24" y2="46" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="90" y1="46" x2="96" y2="46" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Body/shoulders below -->
  <path d="M36,78 Q60,74 84,78 L90,112 L30,112 Z" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>
  <!-- Collar -->
  <path d="M42,78 Q60,84 78,78" fill="none" stroke="#374151" stroke-width="0.8"/>
</svg>
