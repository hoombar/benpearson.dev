<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate -->
  <circle cx="52" cy="50" r="38" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="52" cy="50" r="32" fill="none" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Cut-out eye holes (showing table through) -->
  <ellipse cx="38" cy="42" rx="7" ry="5" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="66" cy="42" rx="7" ry="5" fill="#fef3c7" stroke="#374151" stroke-width="1.2"/>

  <!-- Scissors in action -->
  <g transform="translate(78, 36) rotate(20)">
    <path d="M0,0 L-16,5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,0 L-16,-5" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#374151" stroke="none"/>
    <ellipse cx="5" cy="3.5" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <ellipse cx="5" cy="-3.5" rx="5" ry="3.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Cut-out paper pieces (fallen scraps) -->
  <ellipse cx="40" cy="90" rx="5" ry="3.5" fill="#f9fafb" stroke="#374151" stroke-width="0.6"/>
  <ellipse cx="52" cy="92" rx="5" ry="3.5" fill="#f9fafb" stroke="#374151" stroke-width="0.6"/>

  <!-- Dashed cut line showing where to cut (guide) -->
  <path d="M72,42 Q76,42 76,38" fill="none" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="2,2"/>
</svg>
