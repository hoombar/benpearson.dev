<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Table background -->
  <rect x="0" y="0" width="120" height="120" fill="#fef3c7" />
  <rect x="16" y="10" width="88" height="100" fill="#fbbf24" stroke="#374151" stroke-width="2.5" />
  
  <!-- Launcher tube at bottom right -->
  <g transform="translate(85, 75)">
    <!-- Cardboard Tube -->
    <rect x="-10" y="-15" width="20" height="35" fill="#d97706" stroke="#374151" stroke-width="2" />
    <!-- Tube top opening -->
    <ellipse cx="0" cy="-15" rx="10" ry="4" fill="#92400e" stroke="#374151" stroke-width="2" />
    <!-- Tube bottom opening -->
    <ellipse cx="0" cy="20" rx="10" ry="4" fill="#fbbf24" stroke="#374151" stroke-width="2" />
    
    <!-- Rubber band pulled back -->
    <path d="M-10,15 L0,35 L10,15" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Marble in the band -->
    <circle cx="0" cy="30" r="7" fill="#3b82f6" stroke="#374151" stroke-width="2" />
    
    <!-- Pull action arrow -->
    <line x1="0" y1="42" x2="0" y2="54" stroke="#374151" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)" />
  </g>
</svg>
