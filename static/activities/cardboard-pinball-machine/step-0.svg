<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="80" width="120" height="40" fill="#fef9c3" />
  <line x1="0" y1="80" x2="120" y2="80" stroke="#374151" stroke-width="2" />
  
  <!-- Box Side Profile -->
  <!-- Inner box area (back wall) -->
  <rect x="20" y="20" width="80" height="70" fill="#fef3c7" stroke="#374151" stroke-width="2" />
  
  <!-- The cut slanted side wall -->
  <polygon points="20,20 100,20 100,90 20,90" fill="#fbbf24" stroke="#374151" stroke-width="2" />
  
  <polygon points="20,20 100,60 100,90 20,90" fill="#d97706" stroke="#374151" stroke-width="2" stroke-linejoin="round" />
  <!-- The piece being cut away (top right triangle) -->
  <polygon points="20,20 100,20 100,60" fill="#fbbf24" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  
  <!-- Scissors cutting at (70, 40) along the slant -->
  <g transform="translate(75, 45) rotate(155)">
    <line x1="0" y1="0" x2="25" y2="-6" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="25" y2="6" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-6" cy="-6" r="6" fill="#3b82f6" stroke="#374151" stroke-width="2"/>
    <circle cx="-6" cy="6" r="6" fill="#3b82f6" stroke="#374151" stroke-width="2"/>
  </g>
</svg>
