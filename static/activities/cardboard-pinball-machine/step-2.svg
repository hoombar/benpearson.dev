<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Table background -->
  <rect x="0" y="0" width="120" height="120" fill="#fef3c7" />
  <!-- Box -->
  <rect x="16" y="10" width="88" height="100" fill="#fbbf24" stroke="#374151" stroke-width="2.5" />
  
  <!-- Obstacle / Bumper in center -->
  <g transform="translate(60, 45) rotate(15)">
    <!-- Stick 1 -->
    <rect x="-30" y="-12" width="8" height="24" rx="3" fill="#fde68a" stroke="#374151" stroke-width="2" />
    <rect x="-31" y="-6" width="10" height="12" fill="#93c5fd" stroke="#374151" stroke-width="1.5" />
    <!-- Stick 2 -->
    <rect x="22" y="-12" width="8" height="24" rx="3" fill="#fde68a" stroke="#374151" stroke-width="2" />
    <rect x="21" y="-6" width="10" height="12" fill="#93c5fd" stroke="#374151" stroke-width="1.5" />
    
    <!-- Rubber band stretched between them -->
    <rect x="-26" y="-4" width="52" height="8" rx="4" fill="none" stroke="#ef4444" stroke-width="2.5" />
    
    <!-- Marble hitting it -->
    <circle cx="0" cy="12" r="8" fill="#a855f7" stroke="#374151" stroke-width="2" />
  </g>
  
  <!-- Bounce path showing kinetic action -->
  <path d="M50,85 Q56,65 57,58" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr)" />
</svg>
