<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Carriage 1 (blue, being decorated) -->
  <g transform="translate(8, 30)">
    <rect x="0" y="0" width="50" height="28" rx="4" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="50" cy="14" rx="3.5" ry="14" fill="#2563eb" stroke="#374151" stroke-width="0.8"/>
    <!-- Windows drawn on -->
    <rect x="8" y="6" width="8" height="8" rx="1" fill="#bfdbfe" stroke="#374151" stroke-width="0.8"/>
    <rect x="20" y="6" width="8" height="8" rx="1" fill="#bfdbfe" stroke="#374151" stroke-width="0.8"/>
    <rect x="32" y="6" width="8" height="8" rx="1" fill="#bfdbfe" stroke="#374151" stroke-width="0.8"/>
    <!-- Door -->
    <rect x="18" y="16" width="10" height="12" rx="1" fill="#93c5fd" stroke="#374151" stroke-width="0.6"/>
    <circle cx="26" cy="22" r="1" fill="#374151"/>
  </g>

  <!-- Carriage 2 (green, already decorated) -->
  <g transform="translate(8, 66)">
    <rect x="0" y="0" width="50" height="28" rx="4" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="50" cy="14" rx="3.5" ry="14" fill="#16a34a" stroke="#374151" stroke-width="0.8"/>
    <!-- Windows -->
    <rect x="8" y="6" width="8" height="8" rx="1" fill="#bbf7d0" stroke="#374151" stroke-width="0.8"/>
    <rect x="20" y="6" width="8" height="8" rx="1" fill="#bbf7d0" stroke="#374151" stroke-width="0.8"/>
    <rect x="32" y="6" width="8" height="8" rx="1" fill="#bbf7d0" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Hand with marker drawing on carriage 1 -->
  <g transform="translate(62, 24)">
    <!-- Hand -->
    <rect x="8" y="0" width="12" height="22" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <!-- Marker -->
    <rect x="0" y="18" width="8" height="26" rx="2" fill="#8b5cf6" stroke="#374151" stroke-width="1"/>
    <rect x="0" y="38" width="8" height="6" rx="1" fill="#6d28d9" stroke="#374151" stroke-width="0.6"/>
    <!-- Marker tip -->
    <polygon points="2,44 6,44 4,48" fill="#374151"/>
  </g>

  <!-- More markers scattered -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="6" height="22" rx="2" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="18" width="6" height="4" rx="1" fill="#b91c1c" stroke="#374151" stroke-width="0.4"/>
  </g>
  <g transform="translate(92, 74)">
    <rect x="0" y="0" width="6" height="20" rx="2" fill="#f59e0b" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="16" width="6" height="4" rx="1" fill="#d97706" stroke="#374151" stroke-width="0.4"/>
  </g>
  <g transform="translate(104, 72)">
    <rect x="0" y="0" width="6" height="22" rx="2" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>
    <rect x="0" y="18" width="6" height="4" rx="1" fill="#16a34a" stroke="#374151" stroke-width="0.4"/>
  </g>
</svg>
