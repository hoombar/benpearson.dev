<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Floor surface -->
  <rect x="0" y="85" width="120" height="35" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>

  <!-- Complete train (engine + 2 carriages connected by string) -->

  <!-- Engine -->
  <g transform="translate(4, 42)">
    <rect x="0" y="0" width="28" height="18" rx="3" fill="#ef4444" stroke="#374151" stroke-width="1.2"/>
    <!-- Smokestack -->
    <polygon points="6,-8 3,0 9,0" fill="#6b7280" stroke="#374151" stroke-width="0.8"/>
    <!-- Front face -->
    <rect x="-3" y="3" width="5" height="12" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
    <!-- Headlight -->
    <circle cx="-0.5" cy="8" r="2" fill="#fef3c7" stroke="#374151" stroke-width="0.5"/>
    <!-- Wheels -->
    <circle cx="7" cy="21" r="5" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="7" cy="21" r="1" fill="#374151"/>
    <circle cx="21" cy="21" r="5" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="21" cy="21" r="1" fill="#374151"/>
  </g>

  <!-- String connecting engine to carriage 1 -->
  <line x1="32" y1="54" x2="38" y2="54" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Carriage 1 (blue) -->
  <g transform="translate(38, 42)">
    <rect x="0" y="0" width="28" height="18" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="1.2"/>
    <!-- Windows -->
    <rect x="4" y="3" width="6" height="5" rx="1" fill="#bfdbfe" stroke="#374151" stroke-width="0.5"/>
    <rect x="14" y="3" width="6" height="5" rx="1" fill="#bfdbfe" stroke="#374151" stroke-width="0.5"/>
    <!-- Wheels -->
    <circle cx="7" cy="21" r="5" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="7" cy="21" r="1" fill="#374151"/>
    <circle cx="21" cy="21" r="5" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="21" cy="21" r="1" fill="#374151"/>
  </g>

  <!-- String connecting carriage 1 to carriage 2 -->
  <line x1="66" y1="54" x2="72" y2="54" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Carriage 2 (green) -->
  <g transform="translate(72, 42)">
    <rect x="0" y="0" width="28" height="18" rx="3" fill="#22c55e" stroke="#374151" stroke-width="1.2"/>
    <!-- Windows -->
    <rect x="4" y="3" width="6" height="5" rx="1" fill="#bbf7d0" stroke="#374151" stroke-width="0.5"/>
    <rect x="14" y="3" width="6" height="5" rx="1" fill="#bbf7d0" stroke="#374151" stroke-width="0.5"/>
    <!-- Wheels -->
    <circle cx="7" cy="21" r="5" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="7" cy="21" r="1" fill="#374151"/>
    <circle cx="21" cy="21" r="5" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="21" cy="21" r="1" fill="#374151"/>
  </g>

  <!-- Pull string from engine -->
  <line x1="1" y1="52" x2="-2" y2="46" stroke="#374151" stroke-width="1" stroke-linecap="round"/>

  <!-- Hand pulling the train -->
  <g transform="translate(0, 20)">
    <rect x="-6" y="0" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="6" y="2" width="8" height="16" rx="4" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Direction arrow -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="106" y1="52" x2="116" y2="52" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Smoke puffs from smokestack -->
  <circle cx="14" cy="28" r="3" fill="#d1d5db" stroke="none" opacity="0.3"/>
  <circle cx="20" cy="22" r="2.5" fill="#d1d5db" stroke="none" opacity="0.25"/>
  <circle cx="26" cy="18" r="2" fill="#d1d5db" stroke="none" opacity="0.2"/>
</svg>
