<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Carriage tube (hero, side view) -->
  <g transform="translate(14, 30)">
    <!-- Tube body -->
    <rect x="0" y="0" width="60" height="30" rx="4" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <!-- Windows -->
    <rect x="8" y="6" width="10" height="8" rx="1" fill="#bfdbfe" stroke="#374151" stroke-width="0.8"/>
    <rect x="24" y="6" width="10" height="8" rx="1" fill="#bfdbfe" stroke="#374151" stroke-width="0.8"/>
    <rect x="40" y="6" width="10" height="8" rx="1" fill="#bfdbfe" stroke="#374151" stroke-width="0.8"/>

    <!-- Wheels being attached -->
    <circle cx="14" cy="34" r="7" fill="white" stroke="#374151" stroke-width="1.2"/>
    <circle cx="14" cy="34" r="1.5" fill="#374151"/>
    <circle cx="46" cy="34" r="7" fill="white" stroke="#374151" stroke-width="1.2"/>
    <circle cx="46" cy="34" r="1.5" fill="#374151"/>
  </g>

  <!-- Hand gluing wheel -->
  <g transform="translate(70, 52)">
    <rect x="0" y="0" width="12" height="20" rx="6" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="14" y="2" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrow showing wheel being attached -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <path d="M72,72 Q68,68 64,66" fill="none" stroke="#374151" stroke-width="0.8" stroke-dasharray="2,2" marker-end="url(#arr)"/>

  <!-- Cut-out wheel circles -->
  <g transform="translate(82, 78)">
    <circle cx="8" cy="8" r="7" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="8" cy="8" r="1.5" fill="#374151"/>
  </g>
  <g transform="translate(100, 82)">
    <circle cx="6" cy="6" r="7" fill="white" stroke="#374151" stroke-width="0.8"/>
    <circle cx="6" cy="6" r="1.5" fill="#374151"/>
  </g>

  <!-- Glue bottle -->
  <g transform="translate(94, 34)">
    <rect x="0" y="8" width="14" height="22" rx="3" fill="white" stroke="#374151" stroke-width="1"/>
    <rect x="3" y="0" width="8" height="10" rx="2" fill="#f97316" stroke="#374151" stroke-width="0.8"/>
    <!-- Nozzle -->
    <rect x="5" y="-3" width="4" height="4" rx="1" fill="#f97316" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Scissors and paper scraps -->
  <g transform="translate(6, 80)">
    <path d="M0,0 L10,4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 L10,-4" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1" fill="#374151"/>
    <ellipse cx="-3" cy="2.5" rx="3.5" ry="2.5" fill="none" stroke="#ef4444" stroke-width="1"/>
    <ellipse cx="-3" cy="-2.5" rx="3.5" ry="2.5" fill="none" stroke="#ef4444" stroke-width="1"/>
  </g>
  <!-- Paper scraps -->
  <rect x="8" y="92" width="8" height="5" rx="1" fill="white" stroke="#374151" stroke-width="0.4" opacity="0.5"/>
  <rect x="20" y="94" width="6" height="4" rx="1" fill="white" stroke="#374151" stroke-width="0.4" opacity="0.5"/>
</svg>
