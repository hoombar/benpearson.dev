<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Step 2: Tie the Forward Knot — figure-of-four close-up -->
  <!-- Background work surface -->
  <rect x="4" y="4" width="112" height="112" rx="4" fill="#fef9c3" fill-opacity="0.4" stroke="none"/>
  <!-- Table surface -->
  <line x1="4" y1="112" x2="116" y2="112" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Two strings zoomed in — left (red working strand) crossing over right (orange) -->
  <!-- Right strand — going straight down -->
  <line x1="70" y1="8" x2="70" y2="112" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <!-- Left (red working) strand — looping over and under in figure-of-four -->
  <!-- Going down from top -->
  <line x1="40" y1="8" x2="40" y2="48" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <!-- Horizontal cross over the orange strand -->
  <line x1="40" y1="48" x2="72" y2="48" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <!-- Loop going down along right side of orange strand -->
  <line x1="72" y1="48" x2="72" y2="74" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <!-- Loop coming back under — behind orange -->
  <path d="M72 74 Q60 80 48 70 Q40 62 40 52" stroke="#ef4444" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Tighten pull arrow — pulling the red strand up -->
  <line x1="36" y1="66" x2="28" y2="48" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Resulting knot bulge at crossing point -->
  <ellipse cx="66" cy="60" rx="8" ry="6" fill="#ef4444" fill-opacity="0.3" stroke="#374151" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Other strings visible at edges (blue, green further right) -->
  <line x1="86" y1="8" x2="86" y2="112" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="8" x2="100" y2="112" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <!-- Arrow showing the loop direction (figure-of-four motion) -->
  <path d="M82 42 Q90 34 90 52 Q90 62 82 64" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>
