<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 3: Continue Row by Row — partially finished bracelet with diagonal stripes -->
  <!-- Table surface -->
  <line x1="4" y1="112" x2="116" y2="112" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Clipboard background -->
  <rect x="26" y="6" width="68" height="104" rx="3" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
  <!-- Top tape securing knot end -->
  <rect x="30" y="10" width="60" height="8" rx="2" fill="#fef08a" fill-opacity="0.85" stroke="#d97706" stroke-width="1"/>
  <!-- Knot at top -->
  <path d="M46 10 Q60 8 74 10 Q72 16 60 16 Q48 16 46 10 Z" fill="#374151" stroke="#374151" stroke-width="1"/>
  <!-- Woven section of bracelet (hero) — diagonal colour stripes -->
  <!-- Bracelet band — outer rectangle -->
  <rect x="46" y="18" width="28" height="58" rx="2" stroke="#374151" stroke-width="1.5" fill="none"/>
  <!-- Diagonal colour stripe rows filling the bracelet (left-to-right diagonals) -->
  <!-- Row 1 — Red stripes going diagonal -->
  <path d="M46 18 L74 42" stroke="#ef4444" stroke-width="4" stroke-linecap="butt" clip-path="url(#bracelet)"/>
  <path d="M46 26 L74 50" stroke="#f97316" stroke-width="4" stroke-linecap="butt" clip-path="url(#bracelet)"/>
  <path d="M46 34 L74 58" stroke="#f59e0b" stroke-width="4" stroke-linecap="butt" clip-path="url(#bracelet)"/>
  <path d="M46 42 L74 66" stroke="#22c55e" stroke-width="4" stroke-linecap="butt" clip-path="url(#bracelet)"/>
  <path d="M46 50 L74 74" stroke="#3b82f6" stroke-width="4" stroke-linecap="butt" clip-path="url(#bracelet)"/>
  <path d="M46 58 L70 76" stroke="#a78bfa" stroke-width="4" stroke-linecap="butt" clip-path="url(#bracelet)"/>
  <!-- Bracelet outline on top of stripes -->
  <rect x="46" y="18" width="28" height="58" rx="2" stroke="#374151" stroke-width="2" fill="none"/>
  <!-- Unfinished loose strings hanging below bracelet -->
  <line x1="50" y1="76" x2="48" y2="104" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="76" x2="53" y2="104" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="76" x2="60" y2="104" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="66" y1="76" x2="67" y2="104" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="76" x2="72" y2="104" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <defs>
    <clipPath id="bracelet">
      <rect x="46" y="18" width="28" height="58" rx="2"/>
    </clipPath>
  </defs>
</svg>
