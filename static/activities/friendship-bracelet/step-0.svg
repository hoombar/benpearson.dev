<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Step 0: Cut and Tie the Strings -->
  <!-- Table / work surface -->
  <line x1="4" y1="112" x2="116" y2="112" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Coloured strings hanging from a knot at top, taped to surface at bottom -->
  <!-- Top knot (overhand knot blob) -->
  <path d="M46 14 Q60 10 74 14 Q72 22 60 22 Q48 22 46 14 Z" fill="#374151" stroke="#374151" stroke-width="1"/>
  <!-- Tape holding the knot end to a clipboard/surface -->
  <rect x="42" y="20" width="36" height="8" rx="2" fill="#fef08a" fill-opacity="0.8" stroke="#374151" stroke-width="1"/>
  <!-- String 1 — Red -->
  <line x1="48" y1="28" x2="48" y2="100" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- String 2 — Orange -->
  <line x1="54" y1="28" x2="54" y2="100" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <!-- String 3 — Yellow -->
  <line x1="60" y1="28" x2="60" y2="100" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- String 4 — Green -->
  <line x1="66" y1="28" x2="66" y2="100" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- String 5 — Blue -->
  <line x1="72" y1="28" x2="72" y2="100" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Scissors at bottom, cutting strings to length -->
  <g transform="translate(94, 72) rotate(-30)">
    <!-- Blade 1 -->
    <line x1="-14" y1="-3" x2="8" y2="-3" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <!-- Blade 2 -->
    <line x1="-14" y1="3" x2="8" y2="3" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <!-- Ring handles -->
    <circle cx="-16" cy="-4" r="5" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
    <circle cx="-16" cy="4" r="5" stroke="#374151" stroke-width="1.5" fill="#e5e7eb"/>
    <!-- Pivot -->
    <circle cx="0" cy="0" r="2" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
  </g>
  <!-- Arrows showing strings being pulled down to cut at same length -->
  <line x1="32" y1="88" x2="40" y2="100" stroke="#374151" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Cut line indicator across all strings -->
  <line x1="42" y1="100" x2="78" y2="100" stroke="#374151" stroke-width="1" stroke-dasharray="3,2" stroke-linecap="round"/>
</svg>
