<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background: Hallway looking down -->
  <rect width="800" height="600" fill="#1a1a2e"/>
  <!-- Left Wall -->
  <path d="M 0 0 L 250 150 L 250 450 L 0 600 Z" fill="#16213e"/>
  <!-- Right Wall -->
  <path d="M 800 0 L 550 150 L 550 450 L 800 600 Z" fill="#0f3460"/>
  <!-- Floor -->
  <path d="M 0 600 L 800 600 L 550 450 L 250 450 Z" fill="#292929"/>
  
  <!-- "Lasers" -->
  <g stroke-linecap="round">
    <line x1="50" y1="400" x2="650" y2="350" stroke="#e53935" stroke-width="6"/>
    <line x1="50" y1="400" x2="650" y2="350" stroke="#ff8a80" stroke-width="2"/>
    
    <line x1="650" y1="350" x2="150" y2="200" stroke="#e53935" stroke-width="6"/>
    <line x1="650" y1="350" x2="150" y2="200" stroke="#ff8a80" stroke-width="2"/>
    
    <line x1="150" y1="200" x2="700" y2="250" stroke="#e53935" stroke-width="6"/>
    <line x1="150" y1="200" x2="700" y2="250" stroke="#ff8a80" stroke-width="2"/>
    
    <line x1="100" y1="500" x2="750" y2="550" stroke="#e53935" stroke-width="6"/>
    <line x1="100" y1="500" x2="750" y2="550" stroke="#ff8a80" stroke-width="2"/>
  </g>
  
  <!-- Kid stepping over laser (abstract silhouette) -->
  <g transform="translate(400, 350)">
    <!-- Back Leg (Stepping over) -->
    <path d="M 0 0 Q -50 -50 -100 50" fill="none" stroke="#4db8ff" stroke-width="30" stroke-linecap="round"/>
    <!-- Front Leg (Planted) -->
    <path d="M 0 0 Q 50 50 20 150" fill="none" stroke="#0088cc" stroke-width="35" stroke-linecap="round"/>
    
    <!-- Torso -->
    <path d="M 0 0 C 0 -80 -20 -150 -10 -200" fill="none" stroke="#00aaff" stroke-width="40" stroke-linecap="round"/>
    
    <!-- Head -->
    <circle cx="-10" cy="-240" r="35" fill="#ffccbc"/>
    
    <!-- Arms -->
    <path d="M -10 -180 Q -80 -150 -60 -80" fill="none" stroke="#ffccbc" stroke-width="20" stroke-linecap="round"/>
    <path d="M -10 -180 Q 80 -180 100 -120" fill="none" stroke="#ffccbc" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- Glowing effect where stepping over -->
  <circle cx="300" cy="385" r="25" fill="#ff8a80" opacity="0.3"/>
  <circle cx="300" cy="385" r="10" fill="#fff" opacity="0.8"/>
  <path d="M 280 385 L 320 385" stroke="#fff" stroke-width="4"/>
  <path d="M 300 365 L 300 405" stroke="#fff" stroke-width="4"/>

  <!-- Action lines -->
  <path d="M 330 250 Q 360 220 400 240" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8,8" opacity="0.5"/>

</svg>