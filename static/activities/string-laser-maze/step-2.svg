<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background: Hallway looking down -->
  <rect width="800" height="600" fill="#eceff1"/>
  <!-- Left Wall -->
  <path d="M 0 0 L 250 150 L 250 450 L 0 600 Z" fill="#cfd8dc"/>
  <!-- Right Wall -->
  <path d="M 800 0 L 550 150 L 550 450 L 800 600 Z" fill="#b0bec5"/>
  <!-- Ceiling & Floor -->
  <path d="M 0 0 L 800 0 L 550 150 L 250 150 Z" fill="#f5f5f5"/>
  <path d="M 0 600 L 800 600 L 550 450 L 250 450 Z" fill="#d7ccc8"/>
  
  <!-- Door at end of hallway -->
  <rect x="350" y="150" width="100" height="300" fill="#795548"/>
  <rect x="360" y="160" width="80" height="290" fill="#5d4037"/>
  <circle cx="430" cy="300" r="5" fill="#ffb300"/>

  <!-- Glowing Lasers (String) -->
  <g>
    <!-- Laser 1 (Low) -->
    <path d="M 150 400 L 600 350" stroke="#f44336" stroke-width="4"/>
    <path d="M 150 400 L 600 350" stroke="#ff8a80" stroke-width="2"/>
    <rect x="140" y="380" width="20" height="40" fill="rgba(255,255,255,0.7)" transform="rotate(15 150 400)"/>
    <rect x="590" y="330" width="20" height="40" fill="rgba(255,255,255,0.7)" transform="rotate(-15 600 350)"/>

    <!-- Laser 2 (Mid crossing) -->
    <path d="M 600 350 L 200 250" stroke="#e53935" stroke-width="4"/>
    <path d="M 600 350 L 200 250" stroke="#ff8a80" stroke-width="2"/>
    <rect x="190" y="230" width="20" height="40" fill="rgba(255,255,255,0.7)" transform="rotate(-30 200 250)"/>
    
    <!-- Laser 3 (High) -->
    <path d="M 200 250 L 700 150" stroke="#d32f2f" stroke-width="4"/>
    <path d="M 200 250 L 700 150" stroke="#ff8a80" stroke-width="2"/>
    <rect x="690" y="130" width="20" height="40" fill="rgba(255,255,255,0.7)" transform="rotate(45 700 150)"/>
  </g>

  <!-- Hand taping another string -->
  <g transform="translate(100, 150)">
    <!-- String extending from hand -->
    <path d="M 0 0 L 700 150" stroke="#ff5252" stroke-width="5" opacity="0.8"/>
    <!-- Hand -->
    <path d="M -20 -30 C -40 -50 -60 -30 -80 10 C -90 40 -50 80 -10 100 C 40 120 70 60 50 20 Z" fill="#ffccbc"/>
    <path d="M -80 10 C -90 -10 -70 -30 -50 -10 Z" fill="#ffccbc"/> <!-- Thumb -->
    <!-- Tape piece in hand -->
    <rect x="-10" y="0" width="40" height="80" fill="rgba(255,255,255,0.8)" transform="rotate(-20)"/>
    <!-- Motion lines -->
    <path d="M -100 -20 Q -120 0 -100 20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>