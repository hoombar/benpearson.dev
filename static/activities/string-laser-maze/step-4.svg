<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background: Speed lines -->
  <rect width="800" height="600" fill="#ffecb3"/>
  <!-- Radiating speed lines -->
  <g transform="translate(400, 300)">
    <path d="M 0 0 L -400 -300 L -300 -300 Z" fill="#ffe082"/>
    <path d="M 0 0 L 400 -300 L 400 -200 Z" fill="#ffd54f"/>
    <path d="M 0 0 L -400 300 L -400 200 Z" fill="#ffca28"/>
    <path d="M 0 0 L 400 300 L 300 300 Z" fill="#ffc107"/>
    <path d="M 0 0 L -100 -300 L 100 -300 Z" fill="#ffd54f"/>
    <path d="M 0 0 L -200 300 L 200 300 Z" fill="#ffe082"/>
  </g>

  <!-- Lasers zipping by -->
  <line x1="-50" y1="100" x2="850" y2="500" stroke="#f44336" stroke-width="8"/>
  <line x1="-50" y1="100" x2="850" y2="500" stroke="#ff8a80" stroke-width="3"/>
  
  <line x1="-50" y1="400" x2="850" y2="200" stroke="#d32f2f" stroke-width="10"/>
  <line x1="-50" y1="400" x2="850" y2="200" stroke="#ff8a80" stroke-width="4"/>

  <!-- Stopwatch dominating the foreground -->
  <g transform="translate(400, 300) scale(1.2)">
    <!-- Shadow -->
    <ellipse cx="20" cy="20" rx="100" ry="100" fill="rgba(0,0,0,0.1)"/>
    
    <!-- Watch body -->
    <circle cx="0" cy="0" r="100" fill="#eceff1"/>
    <circle cx="0" cy="0" r="90" fill="#37474f"/>
    <circle cx="0" cy="0" r="80" fill="#ffffff"/>
    
    <!-- Top button -->
    <rect x="-15" y="-120" width="30" height="25" rx="5" fill="#cfd8dc"/>
    <rect x="-20" y="-130" width="40" height="15" rx="5" fill="#90a4ae"/>
    
    <!-- Side button -->
    <g transform="rotate(45)">
      <rect x="-10" y="-110" width="20" height="15" rx="3" fill="#cfd8dc"/>
      <rect x="-15" y="-120" width="30" height="15" rx="3" fill="#ff5252"/>
    </g>

    <!-- Ticks -->
    <line x1="0" y1="-70" x2="0" y2="-80" stroke="#37474f" stroke-width="4"/>
    <line x1="0" y1="70" x2="0" y2="80" stroke="#37474f" stroke-width="4"/>
    <line x1="-70" y1="0" x2="-80" y2="0" stroke="#37474f" stroke-width="4"/>
    <line x1="70" y1="0" x2="80" y2="0" stroke="#37474f" stroke-width="4"/>

    <!-- Needles -->
    <circle cx="0" cy="0" r="8" fill="#1e88e5"/>
    <line x1="0" y1="0" x2="50" y2="-50" stroke="#1e88e5" stroke-width="4" stroke-linecap="round"/>
    
    <circle cx="0" cy="40" r="4" fill="#ff5252"/>
    <line x1="0" y1="40" x2="0" y2="20" stroke="#ff5252" stroke-width="2" stroke-linecap="round"/>

    <!-- Motion trails for needles -->
    <path d="M 0 -60 A 60 60 0 0 1 50 -50" fill="none" stroke="#1e88e5" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  </g>
  
  <!-- Zipping motion lines around watch -->
  <path d="M 100 200 Q 200 150 250 180" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <path d="M 150 450 Q 250 500 300 480" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <path d="M 600 150 Q 550 100 500 120" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

</svg>