<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background: Hallway floor and baseboards -->
  <rect width="800" height="600" fill="#f4ebdd"/> <!-- Wood floor base -->
  <!-- Floorboards -->
  <path d="M 100 0 L 0 600" stroke="#deb887" stroke-width="4"/>
  <path d="M 250 0 L 200 600" stroke="#deb887" stroke-width="4"/>
  <path d="M 400 0 L 400 600" stroke="#deb887" stroke-width="4"/>
  <path d="M 550 0 L 600 600" stroke="#deb887" stroke-width="4"/>
  <path d="M 700 0 L 800 600" stroke="#deb887" stroke-width="4"/>
  
  <!-- Baseboards on edges -->
  <path d="M 0 0 L 0 600 L 40 600 L 80 0 Z" fill="#ffffff" opacity="0.8"/>
  <path d="M 800 0 L 800 600 L 760 600 L 720 0 Z" fill="#ffffff" opacity="0.8"/>
  
  <!-- Soft shadow -->
  <ellipse cx="400" cy="350" rx="200" ry="80" fill="rgba(0,0,0,0.08)"/>

  <!-- Ball of red yarn/string -->
  <g transform="translate(250, 350)">
    <circle cx="0" cy="0" r="60" fill="#e53935"/>
    <ellipse cx="0" cy="-10" rx="55" ry="50" fill="#f44336"/>
    <!-- Yarn texture -->
    <path d="M -40 -30 Q 0 -50 40 -20 M -50 10 Q 0 -10 50 20 M -30 30 Q 10 50 40 10" fill="none" stroke="#d32f2f" stroke-width="3" stroke-linecap="round"/>
    <path d="M 50 10 Q 80 30 100 50 Q 120 70 150 60" fill="none" stroke="#e53935" stroke-width="5" stroke-linecap="round"/>
    <path d="M 150 60 Q 180 50 200 80" fill="none" stroke="#e53935" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <!-- Tape -->
  <g transform="translate(500, 250)">
    <ellipse cx="0" cy="15" rx="45" ry="25" fill="rgba(0,0,0,0.15)"/>
    <path d="M -35 0 L -35 -20 A 35 15 0 0 1 35 -20 L 35 0 A 35 15 0 0 1 -35 0" fill="#bbdefb"/>
    <ellipse cx="0" cy="-20" rx="35" ry="15" fill="#90caf9"/>
    <ellipse cx="0" cy="-20" rx="22" ry="10" fill="#f4ebdd"/>
    <!-- Tape piece extending -->
    <path d="M -25 -15 L -60 10 L -40 20 L -10 0 Z" fill="rgba(255,255,255,0.7)"/>
  </g>

  <!-- Scissors -->
  <g transform="translate(480, 420) rotate(15)">
    <rect x="-20" y="-10" width="140" height="40" rx="10" fill="rgba(0,0,0,0.1)" transform="translate(5, 5)"/>
    
    <path d="M 0 0 L 100 -15 L 120 -5 L 0 5 Z" fill="#b0bec5"/>
    <path d="M 0 10 L 100 25 L 120 15 L 0 5 Z" fill="#90a4ae"/>
    <circle cx="20" cy="5" r="5" fill="#546e7a"/>
    <!-- Handles -->
    <path d="M -20 -20 C -45 -40 -60 0 -20 0 Z" fill="#42a5f5" stroke="#1e88e5" stroke-width="5"/>
    <path d="M -20 30 C -45 50 -60 10 -20 10 Z" fill="#42a5f5" stroke="#1e88e5" stroke-width="5"/>
  </g>
</svg>