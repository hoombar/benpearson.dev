<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Flat dried paper towel with starburst colour pattern — hero -->
  <rect x="10" y="14" width="100" height="72" rx="3" fill="#f9fafb" stroke="#374151" stroke-width="2.5"/>
  <!-- Colour patches — tie-dye burst from centre + corners -->
  <!-- Centre burst — light blue -->
  <ellipse cx="60" cy="50" rx="20" ry="15" fill="#dbeafe" opacity="0.8" stroke="none"/>
  <!-- Red burst — bottom-left corner -->
  <ellipse cx="20" cy="76" rx="18" ry="12" fill="#fca5a5" opacity="0.85" stroke="none"/>
  <!-- Blue burst — bottom-right -->
  <ellipse cx="100" cy="76" rx="18" ry="12" fill="#93c5fd" opacity="0.85" stroke="none"/>
  <!-- Yellow burst — top-left -->
  <ellipse cx="20" cy="24" rx="16" ry="10" fill="#fde68a" opacity="0.85" stroke="none"/>
  <!-- Purple burst — top-right -->
  <ellipse cx="100" cy="24" rx="16" ry="10" fill="#c4b5fd" opacity="0.85" stroke="none"/>
  <!-- Orange blend — top-centre -->
  <ellipse cx="60" cy="20" rx="14" ry="8" fill="#fdba74" opacity="0.7" stroke="none"/>
  <!-- Green blend — bottom-centre -->
  <ellipse cx="60" cy="80" rx="14" ry="8" fill="#86efac" opacity="0.7" stroke="none"/>
  <!-- Paper towel grid texture lines (lighter, on top of colour) -->
  <line x1="10" y1="32" x2="110" y2="32" stroke="#d1d5db" stroke-width="0.8" opacity="0.6"/>
  <line x1="10" y1="50" x2="110" y2="50" stroke="#d1d5db" stroke-width="0.8" opacity="0.6"/>
  <line x1="10" y1="68" x2="110" y2="68" stroke="#d1d5db" stroke-width="0.8" opacity="0.6"/>
  <line x1="37" y1="14" x2="37" y2="86" stroke="#d1d5db" stroke-width="0.8" opacity="0.6"/>
  <line x1="64" y1="14" x2="64" y2="86" stroke="#d1d5db" stroke-width="0.8" opacity="0.6"/>
  <line x1="91" y1="14" x2="91" y2="86" stroke="#d1d5db" stroke-width="0.8" opacity="0.6"/>
  <!-- Border of towel (on top) -->
  <rect x="10" y="14" width="100" height="72" rx="3" fill="none" stroke="#374151" stroke-width="2"/>
  <!-- Sun/window glow hint — right side showing stained glass effect -->
  <rect x="88" y="98" width="22" height="16" rx="2" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/>
  <!-- Small light rays from window -->
  <line x1="99" y1="94" x2="99" y2="98" stroke="#fde68a" stroke-width="2" stroke-linecap="round"/>
  <line x1="104" y1="95" x2="107" y2="98" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="94" y1="95" x2="91" y2="98" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round"/>
</svg>
