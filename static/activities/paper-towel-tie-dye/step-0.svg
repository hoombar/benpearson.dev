<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#374151" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Flat paper towel (white surface) -->
  <rect x="10" y="10" width="100" height="70" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <!-- Texture lines showing paper towel grid pattern -->
  <line x1="10" y1="27" x2="110" y2="27" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="10" y1="44" x2="110" y2="44" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="10" y1="61" x2="110" y2="61" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="37" y1="10" x2="37" y2="80" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="64" y1="10" x2="64" y2="80" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="91" y1="10" x2="91" y2="80" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Fold line 1: vertical centre fold -->
  <line x1="60" y1="10" x2="60" y2="80" stroke="#374151" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Fold arrow pointing to right half -->
  <path d="M80 45 Q95 45 95 45" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
  <!-- Label arrows showing fold direction -->
  <path d="M72 30 Q68 45 72 60" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
  <!-- Folded result (smaller square, below) -->
  <rect x="32" y="92" width="56" height="20" rx="2" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <!-- Fold line on result -->
  <line x1="60" y1="92" x2="60" y2="112" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Arrow from towel to folded result -->
  <path d="M60 82 L60 90" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arr)"/>
</svg>
