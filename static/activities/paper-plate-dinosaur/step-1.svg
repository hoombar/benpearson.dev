<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Dinosaur body (half plate, hero) -->
  <path d="M10,68 Q10,42 50,42 Q90,42 90,68 Z" fill="#22c55e" stroke="#374151" stroke-width="1.5"/>

  <!-- Back plates being glued along top edge -->
  <polygon points="24,42 20,28 28,28" fill="#f97316" stroke="#374151" stroke-width="0.8"/>
  <polygon points="38,42 34,26 42,26" fill="#16a34a" stroke="#374151" stroke-width="0.8"/>
  <polygon points="52,42 48,24 56,24" fill="#f97316" stroke="#374151" stroke-width="0.8"/>
  <polygon points="66,42 62,26 70,26" fill="#16a34a" stroke="#374151" stroke-width="0.8"/>
  <polygon points="80,42 76,28 84,28" fill="#f97316" stroke="#374151" stroke-width="0.8"/>

  <!-- PVA glue -->
  <g transform="translate(94, 22)">
    <rect x="0" y="8" width="14" height="20" rx="3" fill="#f0f9ff" stroke="#374151" stroke-width="0.8"/>
    <rect x="3" y="0" width="8" height="10" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="0.6"/>
    <circle cx="7" cy="0" r="2" fill="#f97316" stroke="#374151" stroke-width="0.5"/>
  </g>

  <!-- Glue dots -->
  <circle cx="24" cy="40" r="1" fill="#fef9c3" stroke="#374151" stroke-width="0.2" opacity="0.6"/>
  <circle cx="52" cy="40" r="1" fill="#fef9c3" stroke="#374151" stroke-width="0.2" opacity="0.6"/>

  <!-- Extra triangles not yet glued -->
  <polygon points="8,82 4,72 12,72" fill="#f97316" stroke="#374151" stroke-width="0.5"/>
  <polygon points="24,82 20,72 28,72" fill="#16a34a" stroke="#374151" stroke-width="0.5"/>

  <!-- Hand placing a plate -->
  <g transform="translate(58, 14)">
    <rect x="0" y="0" width="10" height="18" rx="5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>
</svg>
