<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Window frame -->
  <rect x="8" y="4" width="104" height="112" rx="3" fill="#bfdbfe" stroke="#374151" stroke-width="2"/>
  <!-- Window pane light -->
  <rect x="12" y="8" width="96" height="104" rx="1" fill="#dbeafe" stroke="none"/>

  <!-- Window cross bars -->
  <line x1="60" y1="8" x2="60" y2="112" stroke="#374151" stroke-width="2"/>
  <line x1="12" y1="60" x2="108" y2="60" stroke="#374151" stroke-width="2"/>

  <!-- Bag taped to window (left pane, upper) -->
  <rect x="18" y="16" width="36" height="38" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="1" opacity="0.5"/>

  <!-- Paint glowing through bag (backlit) -->
  <ellipse cx="28" cy="30" rx="8" ry="7" fill="#ef4444" opacity="0.5" stroke="none"/>
  <ellipse cx="44" cy="28" rx="7" ry="6" fill="#3b82f6" opacity="0.5" stroke="none"/>
  <ellipse cx="32" cy="42" rx="8" ry="6" fill="#fbbf24" opacity="0.5" stroke="none"/>
  <ellipse cx="46" cy="40" rx="6" ry="5" fill="#22c55e" opacity="0.5" stroke="none"/>

  <!-- Tape strips holding bag to window -->
  <rect x="14" y="14" width="12" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>
  <rect x="42" y="14" width="12" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>
  <rect x="14" y="50" width="12" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>
  <rect x="42" y="50" width="12" height="5" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>

  <!-- Sunlight rays through window -->
  <line x1="70" y1="16" x2="78" y2="24" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="80" y1="14" x2="86" y2="20" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="90" y1="18" x2="94" y2="26" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

  <!-- Tape roll nearby on windowsill -->
  <circle cx="86" cy="106" r="8" fill="#fde68a" stroke="#374151" stroke-width="1"/>
  <circle cx="86" cy="106" r="3" fill="#f9fafb" stroke="#374151" stroke-width="0.6"/>
</svg>
