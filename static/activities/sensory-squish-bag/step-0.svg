<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Zip-lock bag lying flat, open at top -->
  <rect x="16" y="20" width="62" height="74" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="1.2" opacity="0.4"/>
  <!-- Zip-lock seal (open) -->
  <line x1="16" y1="24" x2="78" y2="24" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
  <!-- Bag opening flap -->
  <path d="M16,20 Q16,14 20,14 L74,14 Q78,14 78,20" fill="#dbeafe" stroke="#374151" stroke-width="1" opacity="0.3"/>

  <!-- Paint blobs inside bag -->
  <circle cx="32" cy="50" r="10" fill="#ef4444" stroke="#374151" stroke-width="0.8" opacity="0.8"/>
  <circle cx="55" cy="45" r="10" fill="#3b82f6" stroke="#374151" stroke-width="0.8" opacity="0.8"/>
  <circle cx="42" cy="70" r="10" fill="#fbbf24" stroke="#374151" stroke-width="0.8" opacity="0.8"/>
  <circle cx="64" cy="68" r="9" fill="#22c55e" stroke="#374151" stroke-width="0.8" opacity="0.8"/>

  <!-- Paint bottle squeezing paint in -->
  <g transform="translate(84, 16) rotate(25)">
    <rect x="0" y="0" width="14" height="32" rx="3" fill="#ef4444" stroke="#374151" stroke-width="1"/>
    <rect x="3" y="-8" width="8" height="10" rx="2" fill="#fca5a5" stroke="#374151" stroke-width="0.8"/>
    <!-- Nozzle tip -->
    <rect x="5" y="-12" width="4" height="5" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="0.6"/>
  </g>

  <!-- Paint dripping from nozzle -->
  <circle cx="80" cy="30" r="2.5" fill="#ef4444" stroke="#374151" stroke-width="0.5" opacity="0.7"/>
  <circle cx="80" cy="36" r="1.5" fill="#ef4444" stroke="#374151" stroke-width="0.4" opacity="0.5"/>
</svg>
