<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Zip-lock bag sealed flat -->
  <rect x="18" y="24" width="62" height="68" rx="2" fill="#dbeafe" stroke="#374151" stroke-width="1.2" opacity="0.4"/>

  <!-- Paint visible inside (squished flat) -->
  <ellipse cx="36" cy="52" rx="12" ry="10" fill="#ef4444" opacity="0.6" stroke="none"/>
  <ellipse cx="58" cy="48" rx="12" ry="10" fill="#3b82f6" opacity="0.6" stroke="none"/>
  <ellipse cx="44" cy="70" rx="12" ry="8" fill="#fbbf24" opacity="0.6" stroke="none"/>
  <ellipse cx="64" cy="68" rx="10" ry="8" fill="#22c55e" opacity="0.6" stroke="none"/>

  <!-- Zip-lock seal (closed) -->
  <line x1="18" y1="28" x2="80" y2="28" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="26" x2="80" y2="26" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Tape strip reinforcing the seal -->
  <rect x="14" y="20" width="70" height="8" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.8" opacity="0.7"/>

  <!-- Hands pressing seal closed -->
  <!-- Left hand fingers -->
  <g transform="translate(22, 8)">
    <rect x="0" y="0" width="7" height="14" rx="3.5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="9" y="2" width="6" height="12" rx="3" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>
  <!-- Right hand fingers -->
  <g transform="translate(58, 8)">
    <rect x="0" y="0" width="7" height="14" rx="3.5" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
    <rect x="9" y="2" width="6" height="12" rx="3" fill="#fcd9b6" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Arrow showing press direction -->
  <defs>
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="49" y1="6" x2="49" y2="18" stroke="#374151" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr)"/>
</svg>
