<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Lamp bulb (hero, top-centre) — warm yellow glow -->
  <g transform="translate(60,14)">
    <!-- glow halo -->
    <circle cx="0" cy="0" r="22" fill="#fef9c3" stroke="none" opacity="0.4"/>
    <!-- bulb glass body -->
    <path d="M0,-18 Q20,-18 22,-4 Q24,8 16,18 Q12,22 12,28 L-12,28 Q-12,22 -16,18 Q-24,8 -22,-4 Q-20,-18 0,-18"
          fill="#fef3c7" stroke="#374151" stroke-width="2"/>
    <!-- bulb base metal band -->
    <rect x="-12" y="28" width="24" height="6" rx="1" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <!-- threaded base -->
    <rect x="-10" y="34" width="20" height="8" rx="1" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
    <line x1="-10" y1="37" x2="10" y2="37" stroke="#9ca3af" stroke-width="1"/>
    <line x1="-10" y1="40" x2="10" y2="40" stroke="#9ca3af" stroke-width="1"/>
    <!-- filament inside bulb -->
    <path d="M-6,8 Q-2,0 0,4 Q2,8 6,0" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <!-- inner glow -->
    <circle cx="0" cy="4" r="6" fill="#fde68a" stroke="none" opacity="0.5"/>
  </g>

  <!-- Heat waves (wavy lines downward) -->
  <path d="M44,56 Q40,62 44,68 Q48,74 44,80" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <path d="M52,58 Q48,64 52,70 Q56,76 52,82" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <path d="M60,60 Q56,66 60,72 Q64,78 60,84" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M68,58 Q64,64 68,70 Q72,76 68,82" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <path d="M76,56 Q72,62 76,68 Q80,74 76,80" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>

  <!-- Paper below lamp -->
  <rect x="14" y="82" width="92" height="34" rx="2" fill="#f9fafb" stroke="#374151" stroke-width="2.5"/>
  <!-- ruled lines on paper -->
  <line x1="20" y1="96" x2="100" y2="96" stroke="#dbeafe" stroke-width="1"/>
  <line x1="20" y1="108" x2="100" y2="108" stroke="#dbeafe" stroke-width="1"/>

  <!-- Revealed brown text lines (left side, near heat) -->
  <!-- revealed line 1 — fully brown -->
  <line x1="20" y1="90" x2="62" y2="90" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <!-- revealing in progress line (gradient effect: brown fading to nothing) -->
  <line x1="62" y1="90" x2="78" y2="90" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="78" y1="90" x2="94" y2="90" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4,3"/>

  <!-- revealed line 2 — partially revealed -->
  <line x1="20" y1="102" x2="46" y2="102" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="102" x2="66" y2="102" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="66" y1="102" x2="94" y2="102" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round" stroke-dasharray="4,3"/>

  <!-- not-yet-revealed line 3 (still invisible / dashed) -->
  <line x1="20" y1="114" x2="94" y2="114" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="4,3" stroke-linecap="round"/>

  <!-- Warm glow overlay on revealed area -->
  <rect x="14" y="82" width="50" height="34" rx="2" fill="#fef9c3" stroke="none" opacity="0.2"/>

</svg>
