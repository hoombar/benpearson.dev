<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper with paint marks -->
  <rect x="10" y="14" width="74" height="82" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>

  <!-- Dab marks (circular soft prints) -->
  <circle cx="30" cy="36" r="6" fill="#ef4444" opacity="0.7" stroke="none"/>
  <circle cx="42" cy="32" r="5" fill="#ef4444" opacity="0.5" stroke="none"/>
  <circle cx="26" cy="44" r="5" fill="#ef4444" opacity="0.6" stroke="none"/>

  <!-- Swirl marks -->
  <path d="M58,40 Q64,34 68,40 Q72,46 66,50 Q60,54 56,48" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Drag marks -->
  <line x1="22" y1="62" x2="52" y2="58" stroke="#22c55e" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="24" y1="68" x2="48" y2="66" stroke="#22c55e" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Tap/dot marks -->
  <circle cx="60" cy="70" r="3" fill="#fbbf24" opacity="0.7" stroke="none"/>
  <circle cx="68" cy="66" r="2.5" fill="#fbbf24" opacity="0.6" stroke="none"/>
  <circle cx="64" cy="76" r="3" fill="#fbbf24" opacity="0.7" stroke="none"/>
  <circle cx="72" cy="72" r="2" fill="#fbbf24" opacity="0.5" stroke="none"/>

  <!-- Cotton ball tool being used - dabbing action -->
  <g transform="translate(50, 22) rotate(10)">
    <!-- Clothespin -->
    <rect x="0" y="-28" width="4" height="22" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <rect x="5" y="-28" width="4" height="22" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <circle cx="4.5" cy="-20" r="2" fill="#d1d5db" stroke="#374151" stroke-width="0.5"/>
    <!-- Cotton ball with paint on it -->
    <circle cx="4.5" cy="2" r="7" fill="#fca5a5" stroke="#374151" stroke-width="0.8"/>
    <circle cx="2" cy="0" r="2.5" fill="#ef4444" stroke="none" opacity="0.5"/>
  </g>

  <!-- Motion lines showing dabbing action -->
  <line x1="48" y1="16" x2="46" y2="12" stroke="#374151" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="56" y1="14" x2="58" y2="10" stroke="#374151" stroke-width="0.6" stroke-linecap="round"/>
</svg>
