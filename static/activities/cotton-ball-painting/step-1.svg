<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Table surface -->
  <rect x="0" y="100" width="120" height="20" rx="2" fill="#fef3c7" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper sheet laid flat -->
  <rect x="8" y="28" width="64" height="68" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>

  <!-- Paper plate palette with paint blobs -->
  <ellipse cx="96" cy="46" rx="20" ry="18" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <!-- Red blob -->
  <circle cx="88" cy="38" r="5" fill="#ef4444" stroke="#374151" stroke-width="0.6"/>
  <!-- Blue blob -->
  <circle cx="102" cy="36" r="5" fill="#3b82f6" stroke="#374151" stroke-width="0.6"/>
  <!-- Yellow blob -->
  <circle cx="90" cy="50" r="5" fill="#fbbf24" stroke="#374151" stroke-width="0.6"/>
  <!-- Green blob -->
  <circle cx="102" cy="50" r="5" fill="#22c55e" stroke="#374151" stroke-width="0.6"/>

  <!-- Cotton ball tools ready to go -->
  <!-- Tool 1 -->
  <g transform="translate(84, 64) rotate(-30)">
    <rect x="0" y="0" width="4" height="24" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <rect x="5" y="0" width="4" height="24" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <circle cx="4.5" cy="8" r="2" fill="#d1d5db" stroke="#374151" stroke-width="0.5"/>
    <circle cx="4.5" cy="30" r="6" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Tool 2 -->
  <g transform="translate(94, 70) rotate(-15)">
    <rect x="0" y="0" width="4" height="22" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <rect x="5" y="0" width="4" height="22" rx="1" fill="#fbbf24" stroke="#374151" stroke-width="0.8"/>
    <circle cx="4.5" cy="7" r="2" fill="#d1d5db" stroke="#374151" stroke-width="0.5"/>
    <circle cx="4.5" cy="28" r="6" fill="#f9fafb" stroke="#374151" stroke-width="0.8"/>
  </g>

  <!-- Paint pot -->
  <rect x="8" y="4" width="16" height="18" rx="2" fill="#ef4444" stroke="#374151" stroke-width="1"/>
  <ellipse cx="16" cy="4" rx="8" ry="2.5" fill="#fca5a5" stroke="#374151" stroke-width="0.8"/>
</svg>
