<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall background -->
  <rect x="0" y="0" width="120" height="120" fill="#f3f4f6" stroke="none"/>

  <!-- Finished painting displayed -->
  <rect x="16" y="8" width="74" height="86" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>

  <!-- Tape holding it up -->
  <rect x="46" y="4" width="14" height="6" rx="1" fill="#fde68a" stroke="#374151" stroke-width="0.6"/>

  <!-- Beautiful cotton ball art - flower garden scene -->
  <!-- Sky dabs -->
  <circle cx="30" cy="20" r="5" fill="#93c5fd" opacity="0.5" stroke="none"/>
  <circle cx="46" cy="16" r="6" fill="#93c5fd" opacity="0.4" stroke="none"/>
  <circle cx="62" cy="18" r="5" fill="#93c5fd" opacity="0.5" stroke="none"/>
  <circle cx="78" cy="20" r="6" fill="#93c5fd" opacity="0.4" stroke="none"/>

  <!-- Sun dabs -->
  <circle cx="74" cy="22" r="7" fill="#fbbf24" opacity="0.7" stroke="none"/>
  <circle cx="70" cy="18" r="4" fill="#fbbf24" opacity="0.5" stroke="none"/>
  <circle cx="78" cy="16" r="4" fill="#fbbf24" opacity="0.5" stroke="none"/>

  <!-- Grass drag marks -->
  <line x1="18" y1="72" x2="86" y2="72" stroke="#22c55e" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line x1="18" y1="78" x2="86" y2="78" stroke="#4ade80" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  <line x1="18" y1="84" x2="86" y2="84" stroke="#22c55e" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

  <!-- Flower 1 - red dab cluster -->
  <circle cx="32" cy="52" r="5" fill="#ef4444" opacity="0.7" stroke="none"/>
  <circle cx="26" cy="48" r="4" fill="#ef4444" opacity="0.6" stroke="none"/>
  <circle cx="38" cy="48" r="4" fill="#ef4444" opacity="0.6" stroke="none"/>
  <circle cx="32" cy="44" r="4" fill="#f87171" opacity="0.5" stroke="none"/>
  <line x1="32" y1="58" x2="32" y2="72" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>

  <!-- Flower 2 - yellow dab cluster -->
  <circle cx="54" cy="46" r="5" fill="#fbbf24" opacity="0.7" stroke="none"/>
  <circle cx="48" cy="42" r="4" fill="#fbbf24" opacity="0.6" stroke="none"/>
  <circle cx="60" cy="42" r="4" fill="#fbbf24" opacity="0.6" stroke="none"/>
  <circle cx="54" cy="38" r="4" fill="#fde68a" opacity="0.5" stroke="none"/>
  <line x1="54" y1="52" x2="54" y2="72" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>

  <!-- Flower 3 - purple dab cluster -->
  <circle cx="72" cy="54" r="5" fill="#a78bfa" opacity="0.7" stroke="none"/>
  <circle cx="66" cy="50" r="4" fill="#a78bfa" opacity="0.6" stroke="none"/>
  <circle cx="78" cy="50" r="4" fill="#a78bfa" opacity="0.6" stroke="none"/>
  <circle cx="72" cy="46" r="4" fill="#c4b5fd" opacity="0.5" stroke="none"/>
  <line x1="72" y1="60" x2="72" y2="72" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
</svg>
