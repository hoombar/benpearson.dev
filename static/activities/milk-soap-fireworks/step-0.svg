<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 0: Pour the Milk into the paper plate -->
  <!-- Table surface -->
  <line x1="4" y1="108" x2="116" y2="108" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Paper plate (hero, flat, front view) — wide ellipse on table -->
  <ellipse cx="60" cy="94" rx="48" ry="14" stroke="#374151" stroke-width="2" fill="#f9fafb"/>
  <!-- Plate rim ring -->
  <ellipse cx="60" cy="94" rx="44" ry="11" stroke="#374151" stroke-width="1" fill="none"/>
  <!-- Milk pool inside plate (shallow, white/cream) -->
  <ellipse cx="60" cy="94" rx="38" ry="8" stroke="none" fill="#fefce8" fill-opacity="0.9"/>
  <!-- Milk pour stream -->
  <path d="M70 40 Q72 62 68 86" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M72 42 Q74 64 70 86" stroke="#e5e7eb" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Milk carton (hero — right side, tilted to pour) -->
  <g transform="translate(86, 40) rotate(25)">
    <!-- Carton body -->
    <rect x="-12" y="-28" width="24" height="40" rx="2" fill="white" stroke="#374151" stroke-width="1.5"/>
    <!-- Carton roof/gable top -->
    <path d="M-12 -28 L0 -38 L12 -28 Z" fill="white" stroke="#374151" stroke-width="1.5"/>
    <!-- Blue stripe on carton -->
    <rect x="-12" y="-20" width="24" height="8" rx="0" fill="#3b82f6" fill-opacity="0.3" stroke="none"/>
    <!-- Carton label lines -->
    <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <line x1="-8" y1="-2" x2="8" y2="-2" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <!-- Spout/opening at carton bottom -->
    <path d="M-4 12 L-6 16 L6 16 L4 12 Z" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
  </g>
  <!-- Splash where milk lands in plate -->
  <circle cx="68" cy="88" r="4" fill="white" fill-opacity="0.7" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="62" y1="84" x2="58" y2="80" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="74" y1="84" x2="78" y2="80" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>
