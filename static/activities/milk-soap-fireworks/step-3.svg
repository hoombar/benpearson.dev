<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 3: Touch and Watch — colours exploding outward in swirling firework patterns -->
  <!-- Table surface -->
  <line x1="4" y1="112" x2="116" y2="112" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Paper plate (hero) -->
  <ellipse cx="60" cy="94" rx="52" ry="18" stroke="#374151" stroke-width="2" fill="#f9fafb"/>
  <ellipse cx="60" cy="94" rx="48" ry="15" stroke="#374151" stroke-width="1" fill="none"/>
  <!-- Milk base -->
  <ellipse cx="60" cy="92" rx="42" ry="11" fill="#fefce8" stroke="none"/>
  <!-- Colour explosion swirls radiating outward from center -->
  <!-- Red swirl arm -->
  <path d="M60 88 Q52 84 40 88 Q28 92 20 84" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Orange swirl arm -->
  <path d="M60 88 Q62 80 72 76 Q84 72 88 80" stroke="#f97316" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Blue swirl arm -->
  <path d="M60 88 Q52 94 44 100 Q36 106 24 100" stroke="#3b82f6" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Green swirl arm -->
  <path d="M60 88 Q68 94 78 92 Q90 90 96 98" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Yellow swirl arm -->
  <path d="M60 88 Q56 80 50 76 Q42 72 38 78" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Purple swirl arm -->
  <path d="M60 88 Q66 86 74 90 Q82 96 80 102" stroke="#a78bfa" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Starburst lines from center -->
  <line x1="60" y1="88" x2="52" y2="80" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="88" x2="70" y2="80" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="88" x2="68" y2="96" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="88" x2="48" y2="96" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cotton wool piece touching the center -->
  <path d="M50 70 Q54 64 60 66 Q66 64 70 70 Q72 76 66 78 Q60 82 54 78 Q48 76 50 70 Z"
        fill="white" stroke="#374151" stroke-width="1.5"/>
  <!-- Soap shine on cotton wool -->
  <path d="M52 72 Q56 68 62 70" stroke="#6ee7b7" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Small dot showing touch point -->
  <circle cx="60" cy="88" r="3" fill="white" stroke="#374151" stroke-width="1.5"/>
</svg>
