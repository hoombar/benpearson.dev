<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 1: Add Colour Drops to the milk surface — just sitting, not stirred -->
  <!-- Table surface -->
  <line x1="4" y1="108" x2="116" y2="108" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Paper plate (hero) -->
  <ellipse cx="60" cy="92" rx="50" ry="16" stroke="#374151" stroke-width="2" fill="#f9fafb"/>
  <ellipse cx="60" cy="92" rx="46" ry="13" stroke="#374151" stroke-width="1" fill="none"/>
  <!-- Milk surface inside plate -->
  <ellipse cx="60" cy="90" rx="40" ry="9" stroke="none" fill="#fefce8"/>
  <!-- Colour drops sitting on milk surface (not stirred — just floating blobs) -->
  <circle cx="36" cy="89" r="6" fill="#ef4444" fill-opacity="0.9" stroke="#374151" stroke-width="1"/>
  <circle cx="54" cy="87" r="5" fill="#3b82f6" fill-opacity="0.9" stroke="#374151" stroke-width="1"/>
  <circle cx="70" cy="89" r="6" fill="#22c55e" fill-opacity="0.9" stroke="#374151" stroke-width="1"/>
  <circle cx="84" cy="87" r="5" fill="#f59e0b" fill-opacity="0.9" stroke="#374151" stroke-width="1"/>
  <!-- Food colouring bottle held above (right side) -->
  <g transform="translate(78, 32) rotate(165)">
    <!-- Bottle body -->
    <rect x="-6" y="-26" width="12" height="30" rx="3" fill="#ef4444" stroke="#374151" stroke-width="1.5"/>
    <!-- Dropper tip -->
    <rect x="-2" y="-32" width="4" height="8" rx="1" fill="#374151" stroke="#374151" stroke-width="1"/>
    <!-- Label -->
    <line x1="-4" y1="-14" x2="4" y2="-14" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="-4" y1="-8" x2="4" y2="-8" stroke="white" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- Red drops falling from bottle -->
  <ellipse cx="74" cy="52" rx="2" ry="3" fill="#ef4444" fill-opacity="0.9" stroke="none"/>
  <ellipse cx="72" cy="62" rx="1.5" ry="2.5" fill="#ef4444" fill-opacity="0.8" stroke="none"/>
  <ellipse cx="71" cy="72" rx="1.5" ry="2" fill="#ef4444" fill-opacity="0.7" stroke="none"/>
  <!-- Second bottle (blue, left side) -->
  <g transform="translate(42, 28) rotate(170)">
    <rect x="-6" y="-24" width="12" height="28" rx="3" fill="#3b82f6" stroke="#374151" stroke-width="1.5"/>
    <rect x="-2" y="-30" width="4" height="8" rx="1" fill="#374151" stroke="#374151" stroke-width="1"/>
  </g>
  <!-- Blue drops falling -->
  <ellipse cx="46" cy="48" rx="1.5" ry="2.5" fill="#3b82f6" fill-opacity="0.9" stroke="none"/>
  <ellipse cx="48" cy="60" rx="1.5" ry="2" fill="#3b82f6" fill-opacity="0.7" stroke="none"/>
</svg>
